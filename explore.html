{"id": "pubhealth", "g": "health", "n": {"en": "Public Health", "ar": "الصحة العامة"}, "study": {"en": "Epidemiology and biostatistics are the core, alongside environmental health, health policy and management, control of communicable and non communicable disease, and health promotion. Most Gulf programmes run four years and end with a practicum inside a ministry, a primary care network or a health authority. You will do more statistics than most students expect, and very little clinical work.", "ar": "علم الأوبئة والإحصاء الحيوي هما جوهر التخصص، إلى جانب الصحة البيئية وسياسات الصحة وإدارتها ومكافحة الأمراض المعدية وغير المعدية وتعزيز الصحة. ومعظم البرامج الخليجية أربع سنوات تنتهي بتدريب ميداني داخل وزارة أو شبكة رعاية أولية أو هيئة صحية. وستدرس إحصاءً أكثر مما يتوقع أغلب الطلبة، وعملاً سريرياً قليلاً جداً."}, "day": {"en": "This is the one health major that really is mostly desk and data. You pull surveillance figures, check whether a rise in cases is real or an artefact of reporting, write briefs for people who will act on them, design a screening campaign, sit in coordination meetings. Field days exist, in inspections and outbreak work, but the majority of the week is a screen and a spreadsheet.", "ar": "هذا هو التخصص الصحي الوحيد الذي يقوم فعلاً على المكتب والبيانات في معظمه. تسحب أرقام الترصد وتتحقق هل ارتفاع الحالات حقيقي أم أثر من آثار التبليغ، وتكتب مذكرات لمن سيبني عليها قراره، وتصمم حملة فحص، وتحضر اجتماعات تنسيق. وهناك أيام ميدانية في التفتيش والاستجابة للفاشيات، لكن معظم الأسبوع شاشة وجدول بيانات."}, "hard": {"en": "Two things. The statistics, which are heavier than the word health suggests and are the usual reason people transfer out. And the job market, because public health hiring in the Gulf sits mostly inside ministries and health authorities, which means a small number of posts, slow competitions and often a preference for candidates who already hold a master's. If you want patient contact this is the wrong choice, and if you want to avoid it entirely this is the right one.", "ar": "أمران. الإحصاء، وهو أثقل مما توحي به كلمة صحة، وهو السبب المعتاد لانتقال الطلبة إلى غيره. وسوق العمل، لأن التوظيف في الصحة العامة في الخليج يتركز داخل الوزارات والهيئات الصحية، أي عدد محدود من الوظائف ومنافسات بطيئة وتفضيل متكرر لمن يحمل الماجستير. فإن كنت تريد التعامل مع المرضى فهذا اختيار خاطئ، وإن كنت تريد تجنبه تماماً فهو الاختيار الصحيح."}, "subj": {"en": ["Biology", "Mathematics", "English"], "ar": ["الأحياء", "الرياضيات", "اللغة الإنجليزية"]}, "u": {"bh": ["University of Bahrain"], "sa": ["Imam Abdulrahman Bin Faisal University", "King Saud bin Abdulaziz University for Health Sciences", "Umm Al-Qura University"], "ae": ["Abu Dhabi University", "Canadian University Dubai", "Manipal Academy of Higher Education Dubai"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["A'Sharqiyah University"]}},
{"id": "nutrition", "g": "health", "n": {"en": "Nutrition and Dietetics", "ar": "التغذية والحميات"}, "study": {"en": "Biochemistry, physiology, food science and metabolism first, then medical nutrition therapy: how to feed a patient in kidney failure, a diabetic, a burns case, a premature infant. Four years in most Gulf programmes, followed by a supervised internship of six months to a year before you can register and practise. Expect chemistry to be a real part of the first two years.", "ar": "الكيمياء الحيوية وعلم وظائف الأعضاء وعلوم الغذاء والأيض أولاً، ثم العلاج التغذوي الطبي: كيف تغذي مريض فشل كلوي، ومريض سكري، وحالة حروق، وطفلاً خديجاً. أربع سنوات في معظم البرامج الخليجية، يليها تدريب داخلي تحت إشراف من ستة أشهر إلى سنة قبل أن تسجل وتمارس. وتوقع أن تكون الكيمياء جزءاً حقيقياً من السنتين الأوليين."}, "day": {"en": "Clinical dietetics is a hospital job, not a wellness influencer job. You round on wards, calculate feeds for patients who cannot eat, write tube feeding and intravenous nutrition orders for critically ill people, adjust them when the laboratory results move, and sit with families who are frightened. The private clinic and sports side exists and is a great deal smaller than social media makes it look.", "ar": "التغذية السريرية عمل داخل المستشفى، لا عمل مؤثر على مواقع التواصل. تمر على الأجنحة، وتحسب التغذية لمرضى لا يستطيعون الأكل، وتكتب أوامر التغذية الأنبوبية والوريدية لمرضى حرجين، وتعدلها كلما تغيرت التحاليل، وتجلس مع أسر خائفة. أما عيادات القطاع الخاص والتغذية الرياضية فموجودة، وحجمها أصغر بكثير مما تبدو عليه في وسائل التواصل."}, "hard": {"en": "Students arrive expecting meal plans and healthy eating and meet biochemistry, then a ward full of critically ill patients. Tube feeding, stoma output, vomit and the smell of a hospital are part of the work, and the intensive care rotation ends the plan for a good number of people. The salary ceiling in the Gulf is also lower than in most other allied health fields, and registration rules differ by country, so check yours before you enrol.", "ar": "يأتي الطلبة وهم يتوقعون خططاً غذائية وأكلاً صحياً فيجدون الكيمياء الحيوية، ثم جناحاً مليئاً بمرضى حرجين. التغذية الأنبوبية ومخرجات الفغرة والقيء ورائحة المستشفى جزء من العمل، ودورة العناية المركزة تنهي الخطة عند عدد ليس بالقليل. كما أن سقف الرواتب في الخليج أدنى منه في معظم تخصصات المهن الصحية الأخرى، وأنظمة التسجيل تختلف من دولة إلى أخرى، فتحقق من نظام بلدك قبل الالتحاق."}, "subj": {"en": ["Biology", "Chemistry", "Mathematics"], "ar": ["الأحياء", "الكيمياء", "الرياضيات"]}, "u": {"bh": ["Ahlia University"], "sa": ["Imam Abdulrahman Bin Faisal University", "King Saud bin Abdulaziz University for Health Sciences", "Umm Al-Qura University"], "ae": ["UAE University", "University of Sharjah", "Abu Dhabi University"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University", "A'Sharqiyah University"]}},
{"id": "radiology", "g": "health", "n": {"en": "Radiology and Medical Imaging", "ar": "الأشعة والتصوير الطبي"}, "study": {"en": "Anatomy, the physics of radiation, radiation protection and imaging technique across plain film, fluoroscopy, computed tomography, magnetic resonance and ultrasound. Four years plus a clinical internship year in most Gulf programmes, then a licence from the national health regulator. Understand what the degree is: it makes you a radiographer who acquires images, not a radiologist, who is a physician with a medical degree and a residency on top.", "ar": "التشريح وفيزياء الإشعاع والوقاية منه وتقنيات التصوير في الأشعة السينية والتنظير والتصوير المقطعي والرنين المغناطيسي والموجات فوق الصوتية. أربع سنوات يليها عام امتياز سريري في معظم البرامج الخليجية، ثم ترخيص من الجهة الصحية التنظيمية في بلدك. وافهم طبيعة الشهادة: هي تجعلك أخصائي أشعة يلتقط الصور، لا طبيب أشعة، فطبيب الأشعة خريج طب أكمل بعده برنامج زمالة."}, "day": {"en": "You are in the room with the patient, and often the patient is a trauma case. You lift, roll and position injured bodies, hold a limb that is broken, work beside the resuscitation team, and go into theatre with a mobile machine. You also see what the scan sees, the bleed, the tumour, the fracture in a child, before anyone has told the family. It is not a desk job and there is nothing clean or distant about it.", "ar": "أنت في الغرفة مع المريض، وكثيراً ما يكون المريض حالة إصابة. ترفع الأجساد المصابة وتقلبها وتضعها في الوضع المطلوب، وتمسك طرفاً مكسوراً، وتعمل إلى جانب فريق الإنعاش، وتدخل غرفة العمليات بجهاز متنقل. وترى أيضاً ما تراه الصورة، النزيف والورم والكسر في طفل، قبل أن يبلغ أحد الأسرة. هذه ليست وظيفة مكتبية، ولا شيء فيها نظيف أو بعيد."}, "hard": {"en": "The physical load and the exposure to distress. Twelve hour shifts on your feet, moving patients, plus night and weekend rotas, and the accumulated weight of seeing bad findings you are not the one permitted to explain. Students who chose imaging as the clean, technology facing alternative to nursing usually discover the difference in the first hospital placement.", "ar": "الحمل البدني والتعرض للمواقف المؤلمة. مناوبات اثنتي عشرة ساعة على قدميك، ونقل مرضى، ومناوبات ليلية وفي العطلات، إضافة إلى الأثر المتراكم لرؤية نتائج سيئة لست أنت المخول بشرحها. والطلبة الذين اختاروا التصوير باعتباره البديل النظيف التقني عن التمريض يكتشفون الفرق عادة في أول تدريب داخل مستشفى."}, "subj": {"en": ["Physics", "Biology", "Mathematics"], "ar": ["الفيزياء", "الأحياء", "الرياضيات"]}, "u": {"bh": ["University of Bahrain"], "sa": ["Imam Abdulrahman Bin Faisal University", "King Khalid University", "Jazan University"], "ae": ["University of Sharjah", "Gulf Medical University"], "qa": ["University of Doha for Science and Technology"], "kw": ["Kuwait University"], "om": ["Oman College of Health Sciences"]}},
{"id": "speech", "g": "health", "n": {"en": "Speech and Hearing Sciences", "ar": "علوم النطق والسمع"}, "study": {"en": "Linguistics and phonetics, anatomy of the head and neck, the neurology of language, audiology, and the disorders themselves: developmental language delay, stuttering, articulation, voice, aphasia after stroke, and swallowing. Four years plus a supervised clinical placement, and in the Gulf you will need real command of Arabic phonology as well as English. Some employers and some countries expect a master's for full clinical scope.", "ar": "اللسانيات والصوتيات وتشريح الرأس والعنق وعلم الأعصاب المرتبط باللغة والسمعيات، ثم الاضطرابات نفسها: تأخر اللغة عند الأطفال والتلعثم واضطرابات النطق والصوت والحبسة بعد الجلطة وصعوبات البلع. أربع سنوات إضافة إلى تدريب سريري تحت إشراف، وفي الخليج ستحتاج إتقاناً حقيقياً لعلم أصوات العربية إلى جانب الإنجليزية. وبعض جهات العمل وبعض الدول تشترط الماجستير لممارسة كامل نطاق المهنة."}, "day": {"en": "Close, repetitive, hands on work with one person at a time. You sit knee to knee with a child for months on a single sound, you put your hands on a patient's jaw and throat, and you run swallowing assessments where the risk you are managing is food or liquid entering the lungs. That means saliva, coughing, and sometimes suction. Progress is measured in very small steps over very long periods.", "ar": "عمل قريب ومتكرر وبتماس مباشر مع شخص واحد في كل مرة. تجلس ركبة إلى ركبة مع طفل شهوراً على صوت واحد، وتضع يديك على فك المريض وحنجرته، وتجري تقييمات بلع يكون الخطر الذي تديره فيها دخول الطعام أو السائل إلى الرئتين. وهذا يعني اللعاب والسعال وأحياناً الشفط. والتقدم يقاس بخطوات صغيرة جداً على مدد طويلة جداً."}, "hard": {"en": "It is sold as the gentle option and it is gentle in temperament, not in physical contact. Swallowing work in particular is medical work carrying aspiration risk, done on stroke and head injury patients on a ward, with saliva and secretions throughout. Add the patience the job demands, because you will work with the same child for two years, and the fact that some Gulf countries still have thin licensing pathways, so confirm the rules where you intend to work.", "ar": "يسوق باعتباره الخيار اللطيف، وهو لطيف في المزاج لا في التماس الجسدي. فالعمل على اضطرابات البلع تحديداً عمل طبي فيه خطر الشفط الرئوي، يجرى على مرضى الجلطات وإصابات الرأس داخل الأجنحة، ويصاحبه اللعاب والإفرازات طوال الوقت. أضف إلى ذلك الصبر الذي تتطلبه المهنة، إذ قد تعمل مع الطفل نفسه سنتين، وأن بعض دول الخليج ما زالت مسارات الترخيص فيها ضعيفة، فتأكد من الأنظمة في البلد الذي تنوي العمل فيه."}, "subj": {"en": ["Biology", "Arabic", "English"], "ar": ["الأحياء", "اللغة العربية", "اللغة الإنجليزية"]}, "u": {"bh": [], "sa": ["King Saud University", "Dar Al-Hekma University"], "ae": ["Gulf Medical University"], "qa": [], "kw": ["Kuwait University"], "om": []}},
{"id": "occtherapy", "g": "health", "n": {"en": "Occupational Therapy", "ar": "العلاج الوظيفي"}, "study": {"en": "Anatomy, neurology, kinesiology and developmental psychology, then the practice itself: assessing what a person can no longer do and rebuilding it, splinting, assistive technology, and adaptation of the home and the workplace. Four years plus a supervised clinical internship in most Gulf programmes, then licensure. Expect a large amount of placement time in hospitals, rehabilitation centres and schools.", "ar": "التشريح وعلم الأعصاب وعلم الحركة وعلم نفس النمو، ثم الممارسة نفسها: تقييم ما لم يعد الشخص قادراً على فعله وإعادة بنائه، والجبائر، والتقنيات المساعدة، وتكييف المنزل ومكان العمل. أربع سنوات إضافة إلى تدريب سريري تحت إشراف في معظم البرامج الخليجية، ثم الترخيص. وتوقع وقتاً كبيراً من التدريب داخل المستشفيات ومراكز التأهيل والمدارس."}, "day": {"en": "Physical, one to one and slow. You transfer patients out of beds and wheelchairs, work on dressing, washing and toileting with people who have lost the ability to do them, make a splint for a burned hand, and spend a morning on the floor with an autistic four year old. Documentation and insurance justification take a real slice of the week.", "ar": "عمل بدني، فردي، وبطيء. تنقل المرضى من الأسرة والكراسي المتحركة، وتعمل على اللباس والاستحمام واستخدام الحمام مع من فقدوا القدرة عليها، وتصنع جبيرة ليد محترقة، وتقضي صباحاً على الأرض مع طفل توحدي في الرابعة. والتوثيق وتبرير التغطية التأمينية يأخذان حصة حقيقية من الأسبوع."}, "hard": {"en": "Students pick it as the kind, low medical alternative to nursing and then find it is one of the most physically close jobs in the hospital. You handle bodies, you meet incontinence, wounds and body fluids during self care training, and you lift. It is gentle in temperament and it is not gentle in contact. The other difficulty is scale, because occupational therapy is still a small profession in most Gulf countries and the number of posts is limited.", "ar": "يختاره الطلبة باعتباره البديل الرحيم الأقل طبية عن التمريض، ثم يجدون أنه من أكثر الوظائف تماساً جسدياً في المستشفى. تتعامل مع الأجساد، وتواجه سلس البول والجروح وسوائل الجسم أثناء تدريب العناية بالذات، وترفع. هو لطيف في المزاج، وليس لطيفاً في التماس. والصعوبة الأخرى هي الحجم، فالعلاج الوظيفي ما زال مهنة صغيرة في معظم دول الخليج وعدد الوظائف فيها محدود."}, "subj": {"en": ["Biology", "Physics", "Psychology"], "ar": ["الأحياء", "الفيزياء", "علم النفس"]}, "u": {"bh": [], "sa": ["King Saud University"], "ae": ["Batterjee Medical College Dubai"], "qa": [], "kw": ["Kuwait University"], "om": []}},
{"id": "resptherapy", "g": "health", "n": {"en": "Respiratory Therapy", "ar": "العلاج التنفسي"}, "study": {"en": "Cardiopulmonary physiology, pharmacology, mechanical ventilation, blood gas interpretation and critical care. Four years plus a clinical internship in most Gulf programmes, then a licence. The mathematics is real: you will calculate ventilator settings, oxygen delivery and acid base balance, and you are expected to get them right at three in the morning.", "ar": "فسيولوجيا القلب والرئة وعلم الأدوية والتهوية الميكانيكية وتفسير غازات الدم والعناية الحرجة. أربع سنوات إضافة إلى تدريب سريري في معظم البرامج الخليجية، ثم ترخيص. والحساب هنا حقيقي: ستحسب إعدادات جهاز التنفس وكمية الأكسجين وتوازن الحموضة والقلوية، ويتوقع منك أن تصيب فيها في الثالثة فجراً."}, "day": {"en": "Airway and secretion management. That is the honest description of the job. You suction mucus out of lungs, manage tracheostomies, bag a patient who has stopped breathing, run ventilators in intensive care, and are part of every resuscitation and every intubation in the building. It is one of the most fluid heavy jobs in the hospital, and most of your work is with the sickest patients in it.", "ar": "إدارة المجرى الهوائي والإفرازات. هذا هو الوصف الصادق للمهنة. تشفط المخاط من الرئتين، وتعتني بفتحات القصبة الهوائية، وتنفس يدوياً عن مريض توقف تنفسه، وتشغل أجهزة التنفس في العناية المركزة، وتكون جزءاً من كل إنعاش وكل تنبيب في المبنى. وهي من أكثر وظائف المستشفى تعاملاً مع سوائل الجسم، ومعظم عملك مع أشد المرضى مرضاً."}, "hard": {"en": "There is no version of this job away from body fluids, and anyone choosing it to avoid them has misread it completely. Add night shifts, the emotional load of being present at most of the deaths on your unit, and the fact that the profession is well established in Saudi Arabia and Qatar but thin in some other Gulf countries, which limits where you can work. Employability inside Saudi hospitals is genuinely strong.", "ar": "لا توجد نسخة من هذه المهنة بعيدة عن سوائل الجسم، ومن يختارها هرباً منها فقد أساء قراءتها تماماً. أضف المناوبات الليلية، والعبء النفسي لحضورك معظم حالات الوفاة في قسمك، وأن المهنة راسخة في السعودية وقطر وضعيفة الحضور في بعض دول الخليج الأخرى، وهذا يحد من أماكن العمل المتاحة لك. أما فرص التوظيف داخل المستشفيات السعودية فقوية فعلاً."}, "subj": {"en": ["Biology", "Chemistry", "Physics"], "ar": ["الأحياء", "الكيمياء", "الفيزياء"]}, "u": {"bh": [], "sa": ["King Saud University", "Imam Abdulrahman Bin Faisal University", "Taibah University", "King Saud bin Abdulaziz University for Health Sciences"], "ae": ["Batterjee Medical College Dubai"], "qa": ["University of Doha for Science and Technology"], "kw": [], "om": []}},
{"id": "physics", "g": "sci", "n": {"en": "Physics", "ar": "الفيزياء"}, "study": {"en": "Mechanics, electromagnetism, thermodynamics, quantum mechanics and statistical physics, carried on a spine of mathematics heavier than most students expect: calculus, differential equations, linear algebra and numerical methods. Four years, with laboratory work in almost every term and a final year project. Several Gulf programmes let you take a track in medical physics, astronomy or applied nuclear science.", "ar": "الميكانيكا والكهرومغناطيسية والديناميكا الحرارية وميكانيكا الكم والفيزياء الإحصائية، محمولة على عمود من الرياضيات أثقل مما يتوقع أغلب الطلبة: التفاضل والتكامل والمعادلات التفاضلية والجبر الخطي والطرق العددية. أربع سنوات، مع عمل مخبري في كل فصل تقريباً ومشروع في السنة الأخيرة. وتتيح عدة برامج خليجية مساراً في الفيزياء الطبية أو الفلك أو العلوم النووية التطبيقية."}, "day": {"en": "Very few graduates work as physicists. The common destinations are school and college teaching, quality and measurement laboratories, medical physics after further training and licensing, well logging and formation evaluation in oil services, meteorology, and increasingly data and software work. The day is calibration, measurement, code, and writing results up so that someone else can act on them.", "ar": "قليل جداً من الخريجين يعملون فيزيائيين. والوجهات المعتادة هي التدريس في المدارس والكليات، ومختبرات الجودة والقياس، والفيزياء الطبية بعد تدريب وترخيص إضافي، وتسجيل الآبار وتقييم المكامن في خدمات النفط، والأرصاد الجوية، وبصورة متزايدة أعمال البيانات والبرمجة. ويمضي اليوم في المعايرة والقياس والبرمجة وتحرير النتائج ليبني عليها غيرك قراره."}, "hard": {"en": "The mathematics, and then the job market. A physics degree on its own has a weaker direct route into work in the Gulf than an engineering or applied degree, and most graduates end up in one of four places: teaching, a government laboratory or regulator, a postgraduate degree, or a job that never needed the physics. That is not a reason to avoid it. It is a reason to pair it deliberately with programming and numerical modelling, or with an accredited laboratory or medical physics qualification, because that pairing is what separates the graduates who place well from the ones who do not.", "ar": "الرياضيات، ثم سوق العمل. فشهادة الفيزياء وحدها طريقها إلى العمل في الخليج أضعف من شهادة هندسية أو تطبيقية، وينتهي معظم الخريجين إلى واحد من أربعة: التدريس، أو مختبر حكومي أو جهة رقابية، أو دراسات عليا، أو وظيفة لم تكن تحتاج الفيزياء أصلاً. وليس هذا سبباً لتجنبها، بل سبب لأن تقرنها عن قصد بالبرمجة والنمذجة العددية، أو بمؤهل معتمد في المختبرات أو الفيزياء الطبية. فهذا الاقتران هو ما يفرق بين خريج يجد مكانه وخريج لا يجده."}, "subj": {"en": ["Physics", "Mathematics", "English"], "ar": ["الفيزياء", "الرياضيات", "اللغة الإنجليزية"]}, "u": {"bh": ["University of Bahrain"], "sa": ["King Fahd University of Petroleum and Minerals", "King Faisal University", "Umm Al-Qura University"], "ae": ["UAE University", "Khalifa University", "American University of Sharjah", "NYU Abu Dhabi"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "chemistry", "g": "sci", "n": {"en": "Chemistry", "ar": "الكيمياء"}, "study": {"en": "General, organic, inorganic, physical and analytical chemistry, with instrumental analysis and a substantial amount of laboratory time from the first year. Four years, and the laboratory component is what decides your grade, not the lectures. Most Gulf programmes add industrial or petrochemical chemistry and a final year project.", "ar": "الكيمياء العامة والعضوية وغير العضوية والفيزيائية والتحليلية، مع التحليل الآلي وقدر كبير من العمل المخبري منذ السنة الأولى. أربع سنوات، والجزء المخبري هو ما يحدد تقديرك لا المحاضرات. وتضيف معظم البرامج الخليجية الكيمياء الصناعية أو البتروكيماوية ومشروعاً في السنة الأخيرة."}, "day": {"en": "The strong route in the Gulf is industrial: quality control and process laboratories in petrochemicals, refining, aluminium, fertilisers, cement, water treatment, food and pharmaceuticals. The day is sample preparation, running instruments, checking calibration, logging results against a specification and issuing the certificate. It is precise, procedural work under an accreditation standard, and it is nothing like the discovery chemistry of school textbooks.", "ar": "المسار القوي في الخليج صناعي: مختبرات ضبط الجودة والعمليات في البتروكيماويات والتكرير والألمنيوم والأسمدة والإسمنت ومعالجة المياه والأغذية والأدوية. ويمضي اليوم في تحضير العينات وتشغيل الأجهزة والتحقق من المعايرة وتسجيل النتائج مقابل مواصفة وإصدار الشهادة. عمل دقيق منضبط بالإجراءات تحت معيار اعتماد، ولا يشبه كيمياء الاكتشاف في كتب المدرسة."}, "hard": {"en": "The laboratory hours, and the honest point about employability. A chemistry degree on its own competes less well in the Gulf than chemical engineering, and most graduates land in teaching, a government or regulator laboratory, a postgraduate degree, or a job that did not need the chemistry. The graduates who do best go industrial early and add a laboratory accreditation skill, meaning method validation, ISO 17025 practice and real instrument competence, or they add programming and move to the data side.", "ar": "ساعات المختبر، ثم الحقيقة الصريحة عن التوظيف. فشهادة الكيمياء وحدها تنافس في الخليج أضعف من الهندسة الكيميائية، ومعظم الخريجين ينتهون إلى التدريس، أو مختبر حكومي أو رقابي، أو دراسات عليا، أو وظيفة لم تكن تحتاج الكيمياء. والأفضل حالاً هم من اتجهوا صناعياً مبكراً وأضافوا مهارة اعتماد المختبرات، أي التحقق من الطرق وممارسة الأيزو 17025 وإتقان الأجهزة، أو أضافوا البرمجة وانتقلوا إلى جانب البيانات."}, "subj": {"en": ["Chemistry", "Mathematics", "Physics"], "ar": ["الكيمياء", "الرياضيات", "الفيزياء"]}, "u": {"bh": ["University of Bahrain"], "sa": ["King Saud University", "King Fahd University of Petroleum and Minerals", "King Faisal University"], "ae": ["UAE University", "Khalifa University", "American University of Sharjah", "University of Sharjah"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "biology", "g": "sci", "n": {"en": "Biology and Life Sciences", "ar": "الأحياء وعلوم الحياة"}, "study": {"en": "Cell biology, genetics, microbiology, physiology, ecology and evolution, with biochemistry and statistics running alongside. Four years, heavy on laboratory work and in some programmes on fieldwork. Most Gulf departments let you specialise late into microbiology, molecular biology, zoology, botany or an environmental track.", "ar": "بيولوجيا الخلية والوراثة والأحياء الدقيقة وعلم وظائف الأعضاء وعلم البيئة والتطور، مع الكيمياء الحيوية والإحصاء إلى جانبها. أربع سنوات ثقيلة العمل المخبري، وفي بعض البرامج عمل ميداني. وتتيح معظم الأقسام الخليجية التخصص في مرحلة متأخرة في الأحياء الدقيقة أو البيولوجيا الجزيئية أو علم الحيوان أو النبات أو مسار بيئي."}, "day": {"en": "Graduates work in hospital and public health laboratories, food and water testing, agriculture and fisheries authorities, environmental regulators, pharmaceutical quality control, schools and university research groups. Bench work is repetitive by design: the same protocol, the same controls, the same forms, because reproducibility is the entire point. Expect long hours standing at a bench and a great deal of record keeping.", "ar": "يعمل الخريجون في مختبرات المستشفيات والصحة العامة، وفحص الأغذية والمياه، وهيئات الزراعة والثروة السمكية، والجهات الرقابية البيئية، وضبط الجودة الدوائي، والمدارس والمجموعات البحثية في الجامعات. والعمل على طاولة المختبر متكرر بحكم تصميمه: البروتوكول نفسه والشواهد نفسها والنماذج نفسها، لأن قابلية التكرار هي المقصد كله. فتوقع ساعات طويلة واقفاً أمام الطاولة وقدراً كبيراً من التوثيق."}, "hard": {"en": "In the Gulf a biology degree is very often chosen by students who wanted medicine and did not get a place. That is a real and reasonable path, and many people build good careers from it, but choose it deliberately rather than as a consolation, because the two degrees lead to different work. Named plainly, biology opens laboratory science once you add a clinical or accreditation qualification, biotechnology, environmental and food regulation, teaching, and research through a master's or doctorate. What it does not do on its own is compete with an applied or engineering degree for a first job, so decide in year one which of those doors you are walking towards.", "ar": "في الخليج كثيراً ما يختار الأحياء طالب أراد الطب ولم يحصل على مقعد. وهذا مسار حقيقي ومعقول، وقد بنى عليه كثيرون مسيرة جيدة، لكن اخترْه عن قصد لا على سبيل العزاء، لأن الشهادتين تؤديان إلى عملين مختلفين. وبصراحة، تفتح الأحياء أمامك علوم المختبرات بعد إضافة مؤهل سريري أو اعتماد مهني، والتقنية الحيوية، والتنظيم البيئي والغذائي، والتدريس، والبحث عبر ماجستير أو دكتوراه. أما ما لا تفعله وحدها فهو منافسة شهادة تطبيقية أو هندسية على الوظيفة الأولى، فاحسم من السنة الأولى أي باب تقصد."}, "subj": {"en": ["Biology", "Chemistry", "Mathematics"], "ar": ["الأحياء", "الكيمياء", "الرياضيات"]}, "u": {"bh": ["University of Bahrain"], "sa": ["King Saud University", "King Faisal University", "Umm Al-Qura University"], "ae": ["UAE University", "American University of Sharjah", "NYU Abu Dhabi", "Khalifa University"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "biotech", "g": "sci", "n": {"en": "Biotechnology", "ar": "التقنية الحيوية"}, "study": {"en": "Molecular biology, genetics, microbiology and biochemistry, then the applied layer: fermentation and bioprocessing, genetic engineering, bioinformatics, and regulation and bioethics. Four years, laboratory heavy, usually with an industrial placement. It sits between a pure biology degree and chemical engineering, and the better programmes teach the process side properly.", "ar": "البيولوجيا الجزيئية والوراثة والأحياء الدقيقة والكيمياء الحيوية، ثم الطبقة التطبيقية: التخمير والمعالجة الحيوية والهندسة الوراثية والمعلوماتية الحيوية والتنظيم وأخلاقيات التقنية الحيوية. أربع سنوات ثقيلة المختبر، مع تدريب صناعي في العادة. ويقع التخصص بين شهادة الأحياء البحتة والهندسة الكيميائية، والبرامج الأفضل تدرّس جانب العمليات تدريساً جاداً."}, "day": {"en": "In the Gulf the employers are pharmaceutical and vaccine plants, food and dairy processing, agricultural and date palm tissue culture laboratories, water and waste treatment, diagnostics companies and a small number of research institutes. The day is protocol work: preparing media, running cultures, validating a batch, documenting everything to a standard an inspector will read. The interesting design work sits above several years of that.", "ar": "أصحاب العمل في الخليج هم مصانع الأدوية واللقاحات، ومعالجة الأغذية والألبان، ومختبرات زراعة الأنسجة الزراعية ونخيل التمر، ومعالجة المياه والصرف، وشركات التشخيص، وعدد قليل من معاهد البحث. واليوم عمل بالبروتوكول: تحضير الأوساط وتشغيل المزارع والتحقق من دفعة إنتاج وتوثيق كل شيء بمستوى سيقرؤه مفتش. أما عمل التصميم الممتع فيأتي بعد سنوات من ذلك."}, "hard": {"en": "The number of employers is small, and that is the honest constraint. Biotechnology is a stated priority in Saudi and Emirati industrial strategy, so the sector is growing, but it is growing from a low base, and there are still few Gulf programmes and few graduate posts. The degree is also demanding, carrying the laboratory load of biology and the process and quantitative load of engineering. If you cannot relocate, count how many relevant employers exist within reach of your city before you commit four years.", "ar": "عدد أصحاب العمل قليل، وهذا هو القيد الصريح. فالتقنية الحيوية أولوية معلنة في الاستراتيجية الصناعية السعودية والإماراتية، والقطاع ينمو فعلاً، لكنه ينمو من قاعدة صغيرة، ولا تزال البرامج الخليجية قليلة والوظائف للخريجين قليلة. والتخصص شاق أيضاً، إذ يحمل عبء المختبر في الأحياء وعبء العمليات والحساب في الهندسة. وإن كنت لا تستطيع الانتقال فاحسب كم جهة توظيف ذات صلة توجد قرب مدينتك قبل أن تلتزم بأربع سنوات."}, "subj": {"en": ["Biology", "Chemistry", "Mathematics"], "ar": ["الأحياء", "الكيمياء", "الرياضيات"]}, "u": {"bh": [], "sa": [], "ae": ["American University of Ras Al Khaimah", "Amity University Dubai"], "qa": [], "kw": ["American International University Kuwait"], "om": ["Sultan Qaboos University"]}},
{"id": "envsci", "g": "sci", "n": {"en": "Environmental Science", "ar": "علوم البيئة"}, "study": {"en": "Ecology, hydrology, soil and atmospheric science, environmental chemistry, pollution monitoring, geographic information systems and environmental impact assessment, with statistics throughout. Four years, part classroom, part laboratory, part field. Note the difference from environmental engineering, which this site covers separately: the engineer designs and builds the treatment plant, the environmental scientist measures, assesses and regulates.", "ar": "علم البيئة والهيدرولوجيا وعلوم التربة والغلاف الجوي والكيمياء البيئية ورصد التلوث ونظم المعلومات الجغرافية وتقييم الأثر البيئي، مع الإحصاء في كل مرحلة. أربع سنوات، بعضها في القاعة وبعضها في المختبر وبعضها في الميدان. وانتبه إلى الفرق عن الهندسة البيئية التي يغطيها الموقع في صفحة مستقلة: المهندس يصمم محطة المعالجة ويبنيها، وعالم البيئة يقيس ويقيّم وينظّم."}, "day": {"en": "The work sits in environment authorities and municipalities, consultancies writing environmental impact assessments, the health, safety and environment departments of oil, industrial and construction companies, and sustainability reporting teams. A typical week mixes site visits and sampling with long stretches of writing: a permit application, a monitoring report, a compliance file for a regulator. Much of the value is in knowing the local regulation precisely.", "ar": "العمل في هيئات البيئة والبلديات، وشركات الاستشارات التي تعد تقييمات الأثر البيئي، وإدارات الصحة والسلامة والبيئة في شركات النفط والصناعة والمقاولات، وفرق تقارير الاستدامة. والأسبوع المعتاد يخلط زيارات المواقع وأخذ العينات بفترات طويلة من الكتابة: طلب تصريح، أو تقرير رصد، أو ملف امتثال لجهة رقابية. وأكثر قيمة العمل في المعرفة الدقيقة باللوائح المحلية."}, "hard": {"en": "The field component is genuinely uncomfortable, and the writing volume surprises people who chose the subject for the outdoors. The other honest point is that demand here is created by regulation rather than by markets, so it rises when a government tightens its rules and stalls when it does not. Across all six Gulf states the rules have been tightening, which is why this is one of the few pure science degrees with a strengthening direct route into work. Pair it with GIS and data analysis, because that is the skill that separates the assessor from the assistant.", "ar": "الجانب الميداني شاق فعلاً، وحجم الكتابة يفاجئ من اختار التخصص حباً في العمل خارج المكتب. والنقطة الصريحة الأخرى أن الطلب هنا تصنعه اللوائح لا السوق، فيرتفع حين تشدد الحكومة أنظمتها ويتوقف حين لا تفعل. وفي دول الخليج الست تشددت الأنظمة في السنوات الأخيرة، ولهذا كان هذا من قلة من شهادات العلوم البحتة التي يقوى طريقها المباشر إلى العمل. اقرنه بنظم المعلومات الجغرافية وتحليل البيانات، فهذه هي المهارة التي تفصل المقيّم عن المساعد."}, "subj": {"en": ["Biology", "Chemistry", "Geography"], "ar": ["الأحياء", "الكيمياء", "الجغرافيا"]}, "u": {"bh": [], "sa": ["King Abdulaziz University"], "ae": ["American University of Sharjah", "Canadian University Dubai"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": []}},
{"id": "geology", "g": "sci", "n": {"en": "Geology and Earth Sciences", "ar": "الجيولوجيا وعلوم الأرض"}, "study": {"en": "Mineralogy, petrology, structural geology, stratigraphy, sedimentology, geophysics and geochemistry, plus mapping, remote sensing and a good deal of mathematics. Four years, and the defining feature is field camp: weeks of mapping outdoors in Gulf heat, which students either love or use as their reason to leave. Programmes attached to petroleum faculties add reservoir and petrophysics courses.", "ar": "علم المعادن والصخور والجيولوجيا التركيبية وعلم الطبقات والرسوبيات والجيوفيزياء والجيوكيمياء، مع رسم الخرائط والاستشعار عن بعد وقدر جيد من الرياضيات. أربع سنوات، وأبرز ما فيها المعسكر الميداني: أسابيع من رسم الخرائط في الخارج تحت حر الخليج، يحبها الطالب أو تكون سبب انسحابه. وتضيف البرامج الملحقة بكليات البترول مقررات المكامن والفيزياء الصخرية."}, "day": {"en": "Most Gulf geoscientists work for a national oil company or a service contractor: interpreting seismic volumes and well logs on screen, building subsurface models, and arguing about where the boundary of a reservoir actually lies. The rest work in mining and exploration, groundwater and desalination studies, ground investigation for construction, geological surveys and teaching. After the first few years the screen time far exceeds the field time.", "ar": "أغلب الجيولوجيين في الخليج يعملون لدى شركة نفط وطنية أو مقاول خدمات: تفسير المسوح الزلزالية وسجلات الآبار على الشاشة، وبناء نماذج لما تحت السطح، والجدل حول موضع حدود المكمن فعلاً. والبقية في التعدين والاستكشاف، ودراسات المياه الجوفية والتحلية، والفحص الأرضي للمشاريع الإنشائية، والمساحة الجيولوجية، والتدريس. وبعد السنوات الأولى تفوق ساعات الشاشة ساعات الميدان بكثير."}, "hard": {"en": "This degree is tied to the oil and gas cycle, and that is both its strength and its risk. When prices are high the national oil companies hire geoscientists on good terms, and when they are not, hiring stops for years at a time, so your graduation year matters more than it should. The growing edge is mining and minerals, particularly in Saudi Arabia, where the sector is being expanded deliberately, and that is where a student starting now should be looking. Note also that the national oil companies recruit nationals first, so an expatriate student should plan for service companies, consultancies and mining instead.", "ar": "هذا التخصص مرتبط بدورة النفط والغاز، وهذا قوته وخطره معاً. فحين ترتفع الأسعار توظف شركات النفط الوطنية الجيولوجيين بشروط جيدة، وحين تنخفض يتوقف التوظيف سنوات، فتصبح سنة تخرجك عاملاً أهم مما ينبغي. والحد النامي هو التعدين والثروة المعدنية، وخاصة في السعودية حيث يجري توسيع القطاع عن قصد، وهذا ما ينبغي أن ينظر إليه طالب يبدأ اليوم. وانتبه أيضاً إلى أن شركات النفط الوطنية تقدم المواطنين في التوظيف، فليخطط الطالب الوافد لشركات الخدمات والاستشارات والتعدين."}, "subj": {"en": ["Physics", "Chemistry", "Geography"], "ar": ["الفيزياء", "الكيمياء", "الجغرافيا"]}, "u": {"bh": [], "sa": ["King Fahd University of Petroleum and Minerals", "King Abdulaziz University", "King Saud University"], "ae": ["UAE University", "Khalifa University"], "qa": [], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University", "German University of Technology in Oman"]}},
{"id": "marinesci", "g": "sci", "n": {"en": "Marine Science and Fisheries", "ar": "علوم البحار والثروة السمكية"}, "study": {"en": "Marine biology and ecology, oceanography, fisheries biology and stock assessment, aquaculture, and marine pollution and conservation, with statistics and a strong practical component. Four years, including boat work, diving in some programmes, and time at a coastal station or hatchery. The Omani programme leans towards fisheries and aquaculture, the Saudi and Kuwaiti ones towards oceanography and marine biology.", "ar": "الأحياء البحرية وعلم البيئة البحرية وعلوم المحيطات وبيولوجيا المصايد وتقدير المخزون والاستزراع المائي والتلوث البحري وحماية البيئة البحرية، مع الإحصاء وجانب عملي قوي. أربع سنوات تشمل العمل على القوارب، والغوص في بعض البرامج، وفترة في محطة ساحلية أو مفرخ. ويميل البرنامج العماني إلى المصايد والاستزراع المائي، ويميل البرنامجان السعودي والكويتي إلى علوم المحيطات والأحياء البحرية."}, "day": {"en": "The employers are fisheries ministries and research authorities, aquaculture farms and hatcheries, environmental regulators, marine consultancies attached to coastal construction, and a handful of conservation programmes on the Red Sea and in the Gulf. Work alternates between survey trips that are hot, wet and physically demanding, and desk periods spent on stock assessment models and reports. Aquaculture in particular is animal husbandry, with the early mornings and weekend cover that implies.", "ar": "جهات التوظيف هي وزارات الثروة السمكية وهيئات البحث، ومزارع ومفرخات الاستزراع المائي، والجهات الرقابية البيئية، والاستشارات البحرية المرتبطة بالإنشاءات الساحلية، وعدد محدود من برامج حماية البيئة في البحر الأحمر والخليج. ويتناوب العمل بين رحلات مسح حارة ورطبة ومجهدة بدنياً، وفترات مكتبية على نماذج تقدير المخزون والتقارير. والاستزراع المائي على وجه الخصوص تربية حيوان، بما يعنيه ذلك من استيقاظ مبكر ومناوبات في العطلات."}, "hard": {"en": "The number of posts. This is a small field, and the honest picture is that each Gulf state supports a fisheries authority, a research centre and a modest private sector, so the annual intake of new graduates is counted in tens rather than hundreds. It is genuinely tied to Oman and Kuwait, where fisheries carry real economic weight, and to Red Sea and Gulf conservation and coastal development projects. Choose it because you want this specific work, not as a general science degree, and be ready to move for a job.", "ar": "عدد الوظائف. فهذا مجال صغير، والصورة الصريحة أن كل دولة خليجية تعيل هيئة للثروة السمكية ومركز بحث وقطاعاً خاصاً متواضعاً، فيقاس استيعاب الخريجين الجدد سنوياً بالعشرات لا بالمئات. وهو مرتبط فعلاً بعُمان والكويت حيث للثروة السمكية وزن اقتصادي حقيقي، وبمشاريع حماية البيئة والتنمية الساحلية في البحر الأحمر والخليج. فاخترْه لأنك تريد هذا العمل بعينه لا كشهادة علوم عامة، وكن مستعداً للانتقال من أجل وظيفة."}, "subj": {"en": ["Biology", "Chemistry", "Geography"], "ar": ["الأحياء", "الكيمياء", "الجغرافيا"]}, "u": {"bh": [], "sa": ["King Abdulaziz University"], "ae": ["UAE University"], "qa": [], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "petroleum", "g": "eng", "n": {"en": "Petroleum and Natural Gas Engineering", "ar": "هندسة البترول والغاز الطبيعي"}, "study": {"en": "Geology, drilling engineering, reservoir engineering, production engineering and well testing, built on two first years of mathematics, thermodynamics and fluid mechanics. Four to five years, with a summer at a rig, a plant or a field office in most Gulf programmes. The final year is usually a field development project where you size a reservoir and defend the economics of producing it.", "ar": "الجيولوجيا وهندسة الحفر وهندسة المكامن وهندسة الإنتاج واختبار الآبار، فوق سنتين أوليين من الرياضيات والديناميكا الحرارية وميكانيكا الموائع. أربع إلى خمس سنوات، مع صيف في منصة حفر أو معمل أو مكتب حقل في معظم البرامج الخليجية. وتنتهي السنة الأخيرة عادة بمشروع تطوير حقل تقدر فيه حجم المكمن وتدافع عن جدوى إنتاجه اقتصادياً."}, "day": {"en": "Two very different lives sit inside one job title. Field and rig work runs on rotation, long shifts, heat and safety paperwork, while office reservoir work is simulation software, well data and production forecasts presented to a committee. Most graduates start in the field and move inside after a few years, and the pay is the highest of any engineering route in the Gulf.", "ar": "تحت المسمى الواحد حياتان مختلفتان تماماً. فالعمل في الحقل والمنصات يقوم على نظام المناوبات والورديات الطويلة والحرارة وأوراق السلامة، أما العمل المكتبي في المكامن فبرامج محاكاة وبيانات آبار وتوقعات إنتاج تعرض على لجنة. ومعظم الخريجين يبدأون في الحقل ثم ينتقلون إلى الداخل بعد سنوات، والأجر هو الأعلى بين مسارات الهندسة في الخليج."}, "hard": {"en": "The honest tension here is time. This is the best paid engineering degree in the region today and also the one most exposed across a forty year career, because oil demand is expected to plateau within the working life of anyone starting now. The second hard fact is access. The national oil companies, Saudi Aramco, ADNOC, Kuwait Oil Company, Petroleum Development Oman and QatarEnergy, run the best funded graduate schemes in the region and most of them recruit nationals only, so an expatriate student should be looking at service companies and international operators instead.", "ar": "التوتر الصريح هنا هو الزمن. فهذا أعلى تخصصات الهندسة أجراً في المنطقة اليوم، وهو في الوقت نفسه الأكثر تعرضاً على مدى أربعين سنة من العمر المهني، لأن الطلب على النفط يتوقع أن يبلغ مستوى ثابتاً خلال حياة من يبدأ الدراسة الآن. والحقيقة الثانية هي فرص الالتحاق. فشركات النفط الوطنية، أرامكو السعودية وأدنوك وشركة نفط الكويت وتنمية نفط عمان وقطر للطاقة، تدير أفضل برامج الخريجين تمويلاً في المنطقة، ومعظمها مقصور على المواطنين، فعلى الطالب الوافد أن ينظر إلى شركات الخدمات النفطية والشركات العالمية العاملة في المنطقة."}, "subj": {"en": ["Physics", "Mathematics", "Chemistry"], "ar": ["الفيزياء", "الرياضيات", "الكيمياء"]}, "u": {"bh": [], "sa": ["King Fahd University of Petroleum and Minerals", "King Saud University"], "ae": ["Khalifa University", "UAE University"], "qa": ["Texas A&M University at Qatar"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "aero", "g": "eng", "n": {"en": "Aerospace and Aeronautical Engineering", "ar": "هندسة الطيران والفضاء"}, "study": {"en": "Aerodynamics, propulsion, flight mechanics, structures and materials, control systems and avionics, on top of two years of mathematics, physics and mechanics. Four to five years, with laboratory work in wind tunnels and structures labs and a capstone design of an aircraft, a satellite or a subsystem. Some Gulf programmes add a space track covering orbital mechanics and satellite systems.", "ar": "الديناميكا الهوائية والدفع وميكانيكا الطيران والإنشاءات والمواد ونظم التحكم وإلكترونيات الطيران، فوق سنتين من الرياضيات والفيزياء والميكانيكا. أربع إلى خمس سنوات، مع عمل مخبري في أنفاق الرياح ومختبرات الإنشاءات، ومشروع تخرج تصمم فيه طائرة أو قمراً اصطناعياً أو نظاماً فرعياً. وتضيف بعض البرامج الخليجية مساراً فضائياً يشمل ميكانيكا المدارات ونظم الأقمار الاصطناعية."}, "day": {"en": "This is an engineering degree, not a flying one, and it is a different thing from the Aviation Management and Piloting entry on this site, which is a business and licence route. Graduates work in maintenance and airworthiness engineering at airlines and MRO companies, in flight operations and performance, in defence and satellite programmes, or abroad with a manufacturer. The day is drawings, load cases, simulation output, maintenance records and certification documents rather than anything that resembles the brochure.", "ar": "هذا تخصص هندسي لا تخصص طيران، وهو غير مسار إدارة الطيران والقيادة الجوية المدرج في هذا الموقع، فذاك مسار إداري ورخصة مهنية. يعمل الخريجون في هندسة الصيانة وصلاحية الطائرات لدى شركات الطيران وشركات الصيانة، وفي عمليات التشغيل والأداء، وفي برامج الدفاع والأقمار الاصطناعية، أو خارج المنطقة لدى شركة مصنعة. واليوم رسومات وحالات أحمال ومخرجات محاكاة وسجلات صيانة ووثائق اعتماد، لا شيئاً يشبه الصورة الدعائية."}, "hard": {"en": "The gap between what the region flies and what it builds. The Gulf has some of the largest airline and airport operations in the world and comparatively little aircraft manufacturing, so most graduates go into maintenance, operations or defence, or leave the region for a manufacturer. Expect heavy competition for a small number of design posts, and check that the programme is properly accredited if you intend to work overseas.", "ar": "الفجوة بين ما تطيره المنطقة وما تصنعه. فللخليج بعض أكبر عمليات الطيران والمطارات في العالم وصناعة طائرات محدودة نسبياً، ولذلك يتجه معظم الخريجين إلى الصيانة أو التشغيل أو الدفاع، أو يغادرون المنطقة إلى شركة مصنعة. توقع منافسة شديدة على عدد صغير من وظائف التصميم، وتأكد من اعتماد البرنامج إن كنت تنوي العمل في الخارج."}, "subj": {"en": ["Physics", "Mathematics", "Computer Science"], "ar": ["الفيزياء", "الرياضيات", "علوم الحاسوب"]}, "u": {"bh": [], "sa": ["King Abdulaziz University", "King Fahd University of Petroleum and Minerals"], "ae": ["Khalifa University", "UAE University"], "qa": ["University of Doha for Science and Technology"], "kw": [], "om": []}},
{"id": "robotics", "g": "eng", "n": {"en": "Robotics and Mechatronics Engineering", "ar": "هندسة الروبوتات والميكاترونكس"}, "study": {"en": "A deliberate mix of three disciplines: mechanical design and dynamics, electronics and embedded systems, and control theory and programming. Four to five years, laboratory heavy from early on, covering sensors, actuators, microcontrollers, machine vision and industrial automation, with a capstone where you build something that has to work in front of a panel. Programmes in the region are usually titled Mechatronics Engineering rather than Robotics.", "ar": "مزيج مقصود من ثلاثة تخصصات: التصميم الميكانيكي والديناميكا، والإلكترونيات والنظم المدمجة، ونظرية التحكم والبرمجة. أربع إلى خمس سنوات، كثيفة المختبرات من وقت مبكر، تشمل المجسات والمشغلات والمتحكمات الدقيقة والرؤية الآلية وأتمتة المصانع، ومشروع تخرج تبني فيه شيئاً يجب أن يعمل أمام لجنة. والبرامج في المنطقة تحمل عادة اسم هندسة الميكاترونكس لا الروبوتات."}, "day": {"en": "Most of the work is automation rather than humanoid robots. Graduates commission and maintain production lines, design control systems for warehouses and ports, program industrial robots and PLCs, and spend a lot of time on a factory or site floor working out why a machine stopped. Expect a mixture of workshop, site visits and software, plus periods on call when a line goes down.", "ar": "أغلب العمل أتمتة لا روبوتات بشرية الشكل. يقوم الخريجون بتشغيل خطوط الإنتاج وصيانتها، وتصميم نظم التحكم للمستودعات والموانئ، وبرمجة الروبوتات الصناعية ووحدات التحكم المنطقية، ويقضون وقتاً طويلاً في أرض المصنع أو الموقع يبحثون عن سبب توقف آلة. توقع خليطاً من الورشة والزيارات الميدانية والبرمجة، وفترات استدعاء طارئ حين يتوقف خط."}, "hard": {"en": "The breadth. You are asked to be competent in mechanical, electrical and software work at the same time, and students who are strong in one and weak in another stall in the third year integration projects. The fault finding is unforgiving too, because a problem can sit in the mechanism, the wiring, the sensor or the code, and locating it is the job.", "ar": "الاتساع. فالمطلوب منك أن تكون كفؤاً في الميكانيكا والكهرباء والبرمجيات في وقت واحد، ومن يقوى في جانب ويضعف في آخر يتعثر في مشاريع الدمج في السنة الثالثة. وتتبع الأعطال قاس أيضاً، لأن الخلل قد يكون في الآلية أو الأسلاك أو المجس أو الشيفرة، والعثور عليه هو العمل نفسه."}, "subj": {"en": ["Physics", "Mathematics", "Computer Science"], "ar": ["الفيزياء", "الرياضيات", "علوم الحاسوب"]}, "u": {"bh": ["University of Technology Bahrain"], "sa": [], "ae": ["American University of Sharjah", "University of Sharjah", "Khalifa University", "Canadian University Dubai"], "qa": [], "kw": [], "om": []}},
{"id": "biomedeng", "g": "eng", "n": {"en": "Biomedical Engineering", "ar": "الهندسة الطبية الحيوية"}, "study": {"en": "An engineering degree with a medical vocabulary: electronics, signals and systems, materials and mechanics, alongside anatomy, physiology, medical imaging, biomechanics and instrumentation. Four to five years, with laboratory work on medical devices and often a placement in a hospital clinical engineering department. It is not medicine and it does not lead to a medical licence.", "ar": "درجة هندسية بمفردات طبية: إلكترونيات وإشارات ونظم ومواد وميكانيكا، إلى جانب التشريح ووظائف الأعضاء والتصوير الطبي والميكانيكا الحيوية وأجهزة القياس. أربع إلى خمس سنوات، مع عمل مخبري على الأجهزة الطبية وتدريب في قسم الهندسة الطبية بأحد المستشفيات في الغالب. وهو ليس طباً ولا يؤدي إلى رخصة مزاولة طبية."}, "day": {"en": "Three realistic destinations. Clinical engineering inside a hospital, where you specify, install, test and maintain equipment and keep the calibration records inspectors ask for. Medical device sales and application support for a manufacturer or a distributor, which is the largest single employer of these graduates in the Gulf. Regulatory affairs and quality work, preparing device registrations for bodies such as the Saudi Food and Drug Authority.", "ar": "ثلاث وجهات واقعية. الهندسة الطبية داخل مستشفى، حيث تحدد المواصفات وتركب الأجهزة وتختبرها وتصونها وتحفظ سجلات المعايرة التي يطلبها المفتشون. ومبيعات الأجهزة الطبية والدعم التطبيقي لدى شركة مصنعة أو موزع، وهي أكبر جهة توظيف منفردة لهؤلاء الخريجين في الخليج. وشؤون التسجيل والجودة، بإعداد ملفات تسجيل الأجهزة لدى جهات مثل الهيئة العامة للغذاء والدواء السعودية."}, "hard": {"en": "The confusion with medicine, and the size of the market. Many students choose this expecting a clinical career and find an engineering degree with anatomy attached. The Gulf designs and manufactures very few medical devices, so the local market is thin relative to the number of graduates each year, and a large share end up in sales, service or unrelated engineering work. Choose it if the device itself interests you as an object of engineering, not as a way into medicine.", "ar": "الخلط بينه وبين الطب، وحجم السوق. كثير من الطلبة يختارونه توقعاً لمسار سريري فيجدون تخصصاً هندسياً ألحق به تشريح. والخليج يصمم ويصنع عدداً قليلاً جداً من الأجهزة الطبية، فالسوق المحلي ضيق قياساً بعدد الخريجين كل سنة، وينتهي جزء كبير منهم إلى المبيعات أو الخدمة أو أعمال هندسية غير ذات صلة. فاختره إن كان الجهاز نفسه يعنيك بوصفه موضوعاً هندسياً، لا بوصفه باباً إلى الطب."}, "subj": {"en": ["Physics", "Biology", "Mathematics"], "ar": ["الفيزياء", "الأحياء", "الرياضيات"]}, "u": {"bh": [], "sa": ["King Abdulaziz University"], "ae": ["Khalifa University", "Abu Dhabi University", "NYU Abu Dhabi"], "qa": [], "kw": [], "om": []}},
{"id": "marineeng", "g": "eng", "n": {"en": "Marine and Maritime Engineering", "ar": "الهندسة البحرية"}, "study": {"en": "Ship propulsion, marine diesel and gas turbine plant, auxiliary machinery, the basics of naval architecture, electrical systems and ship stability. Four to five years. The critical fork is between a seagoing licence track, regulated under the international STCW convention and including months of supervised sea time on a working vessel, and a shore based engineering track, which has none.", "ar": "دفع السفن ومحركات الديزل والتوربينات الغازية البحرية والآلات المساعدة وأساسيات العمارة البحرية والنظم الكهربائية واتزان السفينة. أربع إلى خمس سنوات. والمفترق الحاسم بين مسار الرخصة البحرية، المنظم بموجب الاتفاقية الدولية للتدريب والإجازة والمناوبة والمتضمن شهوراً من الخدمة البحرية المشرف عليها على متن سفينة عاملة، ومسار الهندسة البرية الذي لا يتضمن شيئاً من ذلك."}, "day": {"en": "Those two tracks are completely different lives. A seagoing engineer stands watches in an engine room on contracts of several months at a time, away from home, with the machinery, the heat and the noise, then takes long leave. A shore based marine engineer works in a shipyard, a port, a classification society or an offshore operator, doing surveys, repairs, dry dock planning and inspection reports on a normal roster.", "ar": "المساران حياتان مختلفتان تماماً. فالمهندس البحري العامل على السفن يقف نوبات في غرفة المحركات بعقود تمتد شهوراً بعيداً عن أهله، مع الآلات والحرارة والضجيج، ثم يأخذ إجازة طويلة. أما المهندس البحري في البر فيعمل في حوض بناء أو ميناء أو هيئة تصنيف أو شركة عمليات بحرية، في المسوح والإصلاحات وتخطيط الأحواض الجافة وتقارير التفتيش بدوام اعتيادي."}, "hard": {"en": "Deciding which of the two lives you want, and being honest with yourself about the sea one. Sea time is compulsory on the licence track and it is the point at which many students discover that months away from family does not suit them. Moving to shore later is normal and respected, but starting shore based and moving to sea is much harder, so the choice at admission carries more weight than in most degrees. Oman and Saudi Arabia have both put serious money into ports, shipyards and maritime training, and that is where regional hiring is concentrated.", "ar": "أن تحسم أي الحياتين تريد، وأن تصارح نفسك بشأن حياة البحر. فالخدمة البحرية إلزامية في مسار الرخصة، وعندها يكتشف كثير من الطلبة أن الغياب شهوراً عن الأسرة لا يناسبهم. والانتقال إلى البر لاحقاً أمر معتاد ومحترم، أما البدء من البر والانتقال إلى البحر فأصعب بكثير، ولذلك يزن قرار القبول هنا أكثر مما يزن في معظم التخصصات. وقد ضخت عمان والسعودية استثمارات جادة في الموانئ وأحواض السفن والتدريب البحري، وهناك يتركز التوظيف الإقليمي."}, "subj": {"en": ["Physics", "Mathematics", "Chemistry"], "ar": ["الفيزياء", "الرياضيات", "الكيمياء"]}, "u": {"bh": [], "sa": ["King Abdulaziz University"], "ae": [], "qa": [], "kw": [], "om": ["International Maritime College Oman"]}},
{"id": "urbanplan", "g": "eng", "n": {"en": "Urban Planning", "ar": "التخطيط العمراني"}, "study": {"en": "Land use and zoning, transport planning, housing, urban design, environmental planning and planning law, with geographic information systems used throughout. Four to five years, usually inside a college of architecture and planning, so the early years overlap with architecture studio work. Studio projects on real districts, and a final year plan for an actual site, are the core of the assessment.", "ar": "استعمالات الأراضي والتقسيم المناطقي وتخطيط النقل والإسكان والتصميم الحضري والتخطيط البيئي وقانون التخطيط، مع استخدام نظم المعلومات الجغرافية في ذلك كله. أربع إلى خمس سنوات، داخل كلية عمارة وتخطيط عادة، فتتداخل السنوات الأولى مع مراسم العمارة. ومشاريع المرسم على أحياء حقيقية، ومخطط السنة الأخيرة لموقع فعلي، هما جوهر التقييم."}, "day": {"en": "Less drawing than architecture and more negotiation. The day is zoning studies, traffic and population data, environmental and infrastructure reports, consultation meetings, and the long business of getting a plan through a municipality or a project authority. Work is split between government planning departments, giga project authorities and the consultancies that serve them.", "ar": "رسم أقل مما في العمارة وتفاوض أكثر. اليوم دراسات تقسيم مناطقي وبيانات مرور وسكان وتقارير بيئية وتقارير بنية تحتية ولقاءات تشاور، ثم العملية الطويلة لتمرير مخطط عبر بلدية أو هيئة مشروع. والعمل موزع بين إدارات التخطيط الحكومية وهيئات المشاريع الكبرى وشركات الاستشارات التي تخدمها."}, "hard": {"en": "Two things. The pace, because a plan you work on for two years can be shelved by a change of leadership or budget, and planners have to be able to live with that. The employment picture is the other. There is a genuine hiring wave right now attached to NEOM, Diriyah, Qiddiya, Lusail and Sultan Haitham City, but it is project cycle dependent, and when a phase closes or funding is reprofiled the hiring stops quickly. Treat the current demand as real but not permanent.", "ar": "أمران. الأول الإيقاع، فالمخطط الذي تعمل عليه سنتين قد يجمد بتغير قيادة أو موازنة، وعلى المخطط أن يحتمل ذلك. والثاني صورة التوظيف. فهناك موجة توظيف حقيقية الآن مرتبطة بنيوم والدرعية والقدية ولوسيل ومدينة السلطان هيثم، لكنها مرهونة بدورات المشاريع، وحين تنتهي مرحلة أو يعاد جدولة تمويلها يتوقف التوظيف سريعاً. فتعامل مع الطلب الحالي بوصفه حقيقياً لا دائماً."}, "subj": {"en": ["Geography", "Mathematics", "Art and Design"], "ar": ["الجغرافيا", "الرياضيات", "الفنون والتصميم"]}, "u": {"bh": [], "sa": ["Imam Abdulrahman Bin Faisal University", "King Saud University", "King Abdulaziz University"], "ae": [], "qa": [], "kw": [], "om": ["German University of Technology in Oman"]}}
];
