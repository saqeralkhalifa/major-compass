{"id": "econ", "g": "biz", "n": {"en": "Economics", "ar": "الاقتصاد"}, "study": {"en": "Micro and macroeconomics first, then the quantitative machinery: statistics, econometrics, calculus and optimisation, alongside money and banking, international trade, development and public finance. Most Gulf programmes run four years inside a business college, so you also take accounting, finance and management courses. The final year usually ends with a research project built on a real dataset.", "ar": "تبدأ الدراسة بالاقتصاد الجزئي والكلي، ثم تدخل الأدوات الكمية: الإحصاء والاقتصاد القياسي والتفاضل والتكامل، إلى جانب مقررات في النقود والبنوك والتجارة الدولية والتنمية والمالية العامة. ومعظم البرامج الخليجية أربع سنوات داخل كلية إدارة الأعمال، لذلك تدرس أيضاً محاسبة وتمويلاً وإدارة. وتنتهي السنة الأخيرة عادة بمشروع بحثي مبني على بيانات حقيقية."}, "day": {"en": "Most economics graduates do not become economists in the academic sense. They work as analysts in banks, regulators, central banks, consultancies and government planning units, and the day goes on pulling data, cleaning it, running models and writing a short note that someone senior will act on. Long stretches of spreadsheet and code, punctuated by meetings where you defend a number.", "ar": "أغلب خريجي الاقتصاد لا يعملون اقتصاديين بالمعنى الأكاديمي. يعملون محللين في البنوك والجهات الرقابية والبنوك المركزية وشركات الاستشارات ووحدات التخطيط الحكومية، ويمضي اليوم في جمع البيانات وتنظيفها وتشغيل النماذج وكتابة مذكرة قصيرة يبني عليها مسؤول أعلى قراره. ساعات طويلة أمام الجداول والبرمجة، تتخللها اجتماعات تدافع فيها عن رقم."}, "hard": {"en": "The mathematics. Economics is not the talkative cousin of business studies. From year two it becomes genuinely quantitative, with econometrics, statistics and calculus, and this is the single most common reason students transfer out. If you disliked mathematics at school, expect the second year to be a wall rather than a bump.", "ar": "الرياضيات. الاقتصاد ليس النسخة الكلامية من إدارة الأعمال. فمن السنة الثانية يصبح تخصصاً كمياً بحق، بالاقتصاد القياسي والإحصاء والتفاضل والتكامل، وهذا هو السبب الأول لتحول الطلبة إلى تخصصات أخرى. وإن كنت لا تطيق الرياضيات في المدرسة فتوقع أن تكون السنة الثانية جداراً لا مطباً."}, "subj": {"en": ["Mathematics", "Economics", "English"], "ar": ["الرياضيات", "الاقتصاد", "اللغة الإنجليزية"]}, "u": {"bh": ["Ahlia University", "University of Bahrain"], "sa": ["King Saud University", "King Abdulaziz University"], "ae": ["UAE University", "American University of Sharjah", "NYU Abu Dhabi", "Sorbonne University Abu Dhabi"], "qa": ["Qatar University", "Georgetown University in Qatar"], "kw": ["Kuwait University", "American University of Kuwait"], "om": ["Sultan Qaboos University", "Modern College of Business and Science"]}},
{"id": "polsci", "g": "hum", "n": {"en": "Political Science", "ar": "العلوم السياسية"}, "study": {"en": "Political theory, comparative government, public policy, international politics and research methods, with regional politics and often Islamic political thought in Gulf programmes. Four years, mostly essay based, with a statistics or methods course that surprises people. Several programmes sit beside law or economics, so you take some of those courses too.", "ar": "النظرية السياسية والحكومة المقارنة والسياسات العامة والسياسة الدولية ومناهج البحث، مع سياسات المنطقة والفكر السياسي الإسلامي في كثير من البرامج الخليجية. أربع سنوات قائمة على المقالات في معظمها، مع مقرر في الإحصاء أو المناهج يفاجئ كثيرين. وتقع بعض البرامج بجوار القانون أو الاقتصاد فتدرس شيئاً منهما."}, "day": {"en": "Graduates end up in ministries, research centres, risk and public affairs teams, media, and the policy side of large companies. The work is reading, briefing and writing: describing a situation accurately in two pages for someone who has ten minutes. Very little of it resembles the debating that attracted people to the subject.", "ar": "ينتهي الخريجون إلى الوزارات ومراكز البحث وفرق المخاطر والشؤون العامة والإعلام والجانب السياساتي في الشركات الكبيرة. والعمل قراءة وتلخيص وكتابة: أن تصف وضعاً بدقة في صفحتين لشخص لا يملك أكثر من عشر دقائق. وقليل منه يشبه السجال الذي جذب الناس إلى التخصص."}, "hard": {"en": "Employability, and it is worth being blunt. The obvious employer is a foreign ministry or a government body, and diplomatic service recruitment is restricted to nationals in every GCC state. If you hold another passport, the realistic route is research centres, media, consultancies and international organisations, so plan for that from year one rather than year four.", "ar": "قابلية التوظيف، ومن الأمانة قولها بوضوح. الجهة الأوضح للتوظيف هي وزارة الخارجية أو جهة حكومية، والتعيين في السلك الدبلوماسي في دول الخليج كافة مقصور على المواطنين. فإن كنت تحمل جنسية أخرى فالمسار الواقعي هو مراكز البحث والإعلام والاستشارات والمنظمات الدولية، وخطط لذلك من السنة الأولى لا الرابعة."}, "subj": {"en": ["History", "English", "Arabic"], "ar": ["التاريخ", "اللغة الإنجليزية", "اللغة العربية"]}, "u": {"bh": ["Applied Science University"], "sa": [], "ae": ["UAE University", "NYU Abu Dhabi"], "qa": ["Georgetown University in Qatar"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "intrel", "g": "hum", "n": {"en": "International Relations and Diplomacy", "ar": "العلاقات الدولية والدبلوماسية"}, "study": {"en": "International politics, diplomatic history, international law and organisations, and foreign policy analysis, usually with a serious language requirement. Gulf programmes add Middle East politics and regional security. Four years, heavy on reading and writing, with a research project and often a term of negotiation and simulation work.", "ar": "السياسة الدولية وتاريخ الدبلوماسية والقانون الدولي والمنظمات الدولية وتحليل السياسة الخارجية، مع متطلب لغوي جاد في العادة. وتضيف البرامج الخليجية سياسات الشرق الأوسط والأمن الإقليمي. أربع سنوات ثقيلة القراءة والكتابة، مع مشروع بحثي وفصل من أعمال التفاوض والمحاكاة في الغالب."}, "day": {"en": "Outside a foreign ministry, graduates work in international organisations, think tanks, corporate government affairs, trade bodies and the political risk desks of banks and consultancies. The daily reality is monitoring, meeting notes, protocol, scheduling and long documents, with the interesting conversations happening two levels above you for the first several years.", "ar": "خارج وزارة الخارجية يعمل الخريجون في المنظمات الدولية ومراكز الفكر والشؤون الحكومية في الشركات والهيئات التجارية ومكاتب المخاطر السياسية في البنوك والاستشارات. والواقع اليومي رصد ومحاضر اجتماعات ومراسم وتنسيق مواعيد ووثائق طويلة، أما الأحاديث المثيرة فتجري على مستويين فوقك في سنواتك الأولى."}, "hard": {"en": "The distance between the image and the job market. Diplomatic service recruitment is nationals only in every GCC state, so for an expatriate student the single most obvious employer is closed, and the choice should be made with that fact in plain view. The degree is also broad rather than technical, so pair it with a language, a region or a quantitative skill or you will compete against everyone.", "ar": "المسافة بين الصورة وسوق العمل. فالتعيين في السلك الدبلوماسي مقصور على المواطنين في دول الخليج كافة، وإن كنت طالباً وافداً فإن أوضح جهة توظيف مغلقة أمامك، ويجب أن تقرر وهذه الحقيقة أمامك. والتخصص واسع لا تقني، فاقرنه بلغة أو بمنطقة أو بمهارة كمية وإلا نافست الجميع على الشيء نفسه."}, "subj": {"en": ["History", "English", "Arabic"], "ar": ["التاريخ", "اللغة الإنجليزية", "اللغة العربية"]}, "u": {"bh": [], "sa": ["Dar Al-Hekma University"], "ae": ["Abu Dhabi University", "Sorbonne University Abu Dhabi"], "qa": ["Qatar University", "Georgetown University in Qatar"], "kw": ["American University of Kuwait"], "om": []}},
{"id": "pubadmin", "g": "hum", "n": {"en": "Public Administration and Public Policy", "ar": "الإدارة العامة والسياسات العامة"}, "study": {"en": "Public sector management, administrative law, public finance and budgeting, human resource management, policy analysis and programme evaluation, with statistics and research methods. Four years, usually inside a business or social sciences college, often with a placement in a ministry or a municipality. Several Gulf programmes are taught in Arabic.", "ar": "إدارة القطاع العام والقانون الإداري والمالية العامة والموازنات وإدارة الموارد البشرية وتحليل السياسات وتقييم البرامج، مع الإحصاء ومناهج البحث. أربع سنوات داخل كلية إدارة أو علوم اجتماعية عادة، مع تدريب ميداني في وزارة أو بلدية في الغالب. وعدد من البرامج الخليجية يدرس بالعربية."}, "day": {"en": "Most of the work sits inside a government body or a state owned company: budgets, procurement files, staffing cases, service standards, committee papers and the slow business of moving a decision through several layers. There are stretches of genuinely interesting policy design, and longer stretches of process.", "ar": "أغلب العمل داخل جهة حكومية أو شركة مملوكة للدولة: موازنات وملفات مشتريات وقضايا توظيف ومعايير خدمة وأوراق لجان، والسعي البطيء لتمرير قرار عبر عدة طبقات. وفيه فترات تصميم سياسات ممتعة فعلاً، وفترات أطول من الإجراءات."}, "hard": {"en": "It is largely a government sector degree, and that is the honest limitation. In several GCC states most government posts are reserved for nationals, so an expatriate student should check the rules for their citizenship before committing four years. Students also underestimate the administrative law and budgeting components, which are dry and detailed.", "ar": "هو في معظمه تخصص للقطاع الحكومي، وهذا حده الصريح. ففي عدد من دول الخليج تقتصر معظم الوظائف الحكومية على المواطنين، وعلى الطالب الوافد أن يتحقق من الأنظمة الخاصة بجنسيته قبل أن يلتزم بأربع سنوات. كما يستهين الطلبة بمقررات القانون الإداري والموازنات، وهي جافة وتفصيلية."}, "subj": {"en": ["Mathematics", "Business Studies", "Arabic"], "ar": ["الرياضيات", "إدارة الأعمال", "اللغة العربية"]}, "u": {"bh": [], "sa": ["King Saud University"], "ae": [], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Modern College of Business and Science"]}},
{"id": "socio", "g": "hum", "n": {"en": "Sociology and Social Work", "ar": "علم الاجتماع والخدمة الاجتماعية"}, "study": {"en": "Two connected fields. Sociology is the theory and the research methods: family, religion, class, migration and crime, plus statistics and survey design. Social work adds casework practice, welfare law and a supervised field placement in a ministry, a school or a shelter. Four years, and in most Gulf programmes the placement is the year that decides whether you stay.", "ar": "مجالان مترابطان. علم الاجتماع هو النظرية ومناهج البحث: الأسرة والدين والطبقة والهجرة والجريمة، إضافة إلى الإحصاء وتصميم الاستبانات. أما الخدمة الاجتماعية فتضيف دراسة الحالة وقوانين الرعاية وتدريباً ميدانياً تحت إشراف في وزارة أو مدرسة أو دار إيواء. أربع سنوات، والتدريب الميداني في معظم برامج الخليج هو السنة التي تحسم بقاءك في التخصص من عدمه."}, "day": {"en": "A social worker's Tuesday is case notes, home visits, phone calls to a school or a court, and meetings about a family whose situation cannot be fixed quickly. A sociology graduate working in research designs surveys, codes interviews and writes reports for a ministry, a consultancy or a research centre. Both involve far more paperwork than anyone warns you about.", "ar": "يوم الأخصائي الاجتماعي هو تدوين الحالات وزيارات منزلية واتصالات بمدرسة أو محكمة واجتماعات حول أسرة لا يمكن إصلاح وضعها بسرعة. وخريج علم الاجتماع العامل في البحث يصمم الاستبانات ويرمّز المقابلات ويكتب تقارير لوزارة أو شركة استشارية أو مركز دراسات. وفي الحالتين هناك أعمال ورقية أكثر بكثير مما يحذرك منه أحد."}, "hard": {"en": "The emotional load, and low pay at entry. You carry other people's problems home, and case files close slowly or never. The employability question is fair, and the honest answer is that the jobs are real but concentrated: social affairs and development ministries, family and juvenile courts, school social workers, hospitals, shelters and NGOs, with a growing slice in corporate social responsibility and social research. If you want a private-sector salary from day one, this is not the route.", "ar": "العبء النفسي وضعف الراتب في البداية. تحمل مشكلات الآخرين معك إلى البيت، وملفات الحالات تغلق ببطء أو لا تغلق أصلاً. وسؤال فرص العمل سؤال مشروع، والجواب الصادق أن الوظائف موجودة لكنها متركزة: وزارات التنمية والشؤون الاجتماعية، ومحاكم الأسرة والأحداث، والأخصائيون الاجتماعيون في المدارس، والمستشفيات، ودور الإيواء، والجمعيات الأهلية، مع حصة متنامية في المسؤولية الاجتماعية للشركات والبحوث الاجتماعية. وإن كنت تريد راتب القطاع الخاص من اليوم الأول فهذا ليس طريقك."}, "subj": {"en": ["Social studies", "Arabic", "Mathematics"], "ar": ["الدراسات الاجتماعية", "اللغة العربية", "الرياضيات"]}, "u": {"bh": ["University of Bahrain"], "sa": ["Umm Al-Qura University"], "ae": ["United Arab Emirates University", "University of Sharjah", "Sorbonne University Abu Dhabi"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University", "Dhofar University"]}},
{"id": "history", "g": "hum", "n": {"en": "History and Archaeology", "ar": "التاريخ والآثار"}, "study": {"en": "Sources, and arguing about them. Gulf programmes usually cover Islamic and Arab history, modern Gulf history and world history, and historical method, while archaeology tracks add survey, excavation technique and material culture. Four years, with fieldwork seasons on the archaeology side. Expect long reading lists and a research dissertation.", "ar": "المصادر والجدل حولها. تغطي برامج الخليج عادة التاريخ الإسلامي والعربي، وتاريخ الخليج الحديث والتاريخ العالمي، ومناهج البحث التاريخي، وتضيف مسارات الآثار المسح وأساليب التنقيب ودراسة الثقافة المادية. أربع سنوات، ومسارات الآثار تتضمن مواسم عمل ميداني. توقع قوائم قراءة طويلة وبحث تخرج."}, "day": {"en": "Teaching in a school is the most common first job, so a Tuesday is lesson plans and marking. In a museum or a heritage authority it is cataloguing objects, checking provenance, writing labels and exhibition text, and increasingly digitisation. Archaeologists split the year between site seasons and the far longer stretch of writing up what they found.", "ar": "التدريس في المدارس هو الوظيفة الأولى الأكثر شيوعاً، فيكون يومك تحضير دروس وتصحيح أوراق. وفي المتحف أو هيئة التراث يكون العمل فهرسة القطع والتحقق من مصدرها وكتابة البطاقات ونصوص المعارض، والرقمنة بشكل متزايد. أما علماء الآثار فيقسمون سنتهم بين مواسم الموقع والفترة الأطول بكثير المخصصة لكتابة نتائج ما وجدوه."}, "hard": {"en": "The honest problem is the size of the market. The direct routes are teaching, museums, heritage authorities and archives, and there are only so many posts. That said, it is less of a dead end than it was ten years ago. Diriyah and Qiddiya in Saudi Arabia, Qatar Museums, and Oman's heritage sector have created real work in curation, collections and heritage management. The market is still narrow, so plan a second skill such as languages, GIS or professional writing.", "ar": "المشكلة الصادقة هي حجم السوق. الطرق المباشرة هي التدريس والمتاحف وهيئات التراث ودور الوثائق، وعدد الوظائف فيها محدود. لكنه صار أقل انسداداً مما كان قبل عشر سنوات. فالدرعية والقدية في السعودية، ومتاحف قطر، وقطاع التراث في عُمان أوجدت عملاً حقيقياً في القيمومة وإدارة المجموعات وإدارة التراث. ويبقى السوق ضيقاً، فخطط لمهارة ثانية مثل اللغات أو نظم المعلومات الجغرافية أو الكتابة المهنية."}, "subj": {"en": ["History", "Arabic", "Geography"], "ar": ["التاريخ", "اللغة العربية", "الجغرافيا"]}, "u": {"bh": ["University of Bahrain"], "sa": ["King Saud University"], "ae": ["University of Sharjah", "NYU Abu Dhabi", "Sorbonne University Abu Dhabi"], "qa": ["Qatar University", "Georgetown University in Qatar"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "geog", "g": "hum", "n": {"en": "Geography and GIS", "ar": "الجغرافيا ونظم المعلومات الجغرافية"}, "study": {"en": "Half the degree looks like a social science, covering population, cities, climate and land use. The other half is a technical course: cartography, remote sensing, spatial statistics and GIS software, usually ArcGIS or QGIS. Four years, with fieldwork and a mapping or modelling project. The technical half is where the employability sits.", "ar": "نصف الدرجة يشبه العلوم الاجتماعية، فيغطي السكان والمدن والمناخ واستخدامات الأراضي. والنصف الآخر مقرر تقني: رسم الخرائط والاستشعار عن بعد والإحصاء المكاني وبرامج نظم المعلومات الجغرافية، غالباً ArcGIS أو QGIS. أربع سنوات مع عمل ميداني ومشروع في رسم الخرائط أو النمذجة. والنصف التقني هو موضع فرص العمل."}, "day": {"en": "Building and cleaning spatial data, running analysis, and producing maps and dashboards that somebody else makes a decision from. In practice that means a utility asking where the network is failing, a planning authority checking land use against a masterplan, or a logistics firm optimising routes. A large part of the day is data quality work, which is tedious and matters more than the finished map.", "ar": "بناء البيانات المكانية وتنظيفها، وتشغيل التحليل، وإنتاج خرائط ولوحات معلومات يتخذ غيرك قراراً بناءً عليها. وعملياً يعني ذلك شركة مرافق تسأل أين تتعطل الشبكة، أو جهة تخطيط تتحقق من مطابقة استخدام الأرض للمخطط الهيكلي، أو شركة لوجستية تحسّن مساراتها. وجزء كبير من اليوم عمل على جودة البيانات، وهو ممل ويهم أكثر من الخريطة النهائية."}, "hard": {"en": "The technical half surprises people who chose geography expecting essays. Coordinate systems, projections and database work defeat a fair number of students, and there is more statistics than the name suggests. The upside is unusual for this group of subjects: GIS feeds directly into urban planning, utilities, oil and gas, logistics and defence, and Gulf employers are hiring. Take the software and statistics courses seriously and this degree pays.", "ar": "النصف التقني يفاجئ من اختار الجغرافيا متوقعاً مقالات. فأنظمة الإحداثيات والإسقاطات والعمل على قواعد البيانات تسقط عدداً غير قليل من الطلبة، والإحصاء فيها أكثر مما يوحي به الاسم. أما الجانب الإيجابي فغير معتاد في هذه المجموعة من التخصصات: نظم المعلومات الجغرافية تغذي مباشرة التخطيط العمراني والمرافق والنفط والغاز والخدمات اللوجستية والدفاع، وأصحاب العمل في الخليج يوظفون. خذ مقررات البرمجيات والإحصاء بجدية وستجد أن هذه الدرجة تدفع."}, "subj": {"en": ["Geography", "Mathematics", "Computer science"], "ar": ["الجغرافيا", "الرياضيات", "الحاسوب"]}, "u": {"bh": [], "sa": ["King Saud University", "Umm Al-Qura University"], "ae": ["United Arab Emirates University", "Sorbonne University Abu Dhabi"], "qa": [], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "philo", "g": "hum", "n": {"en": "Philosophy", "ar": "الفلسفة"}, "study": {"en": "Logic, ethics, epistemology and the history of philosophy, Western and Islamic, plus close reading of difficult texts and a great deal of written argument. Four years. Very few GCC universities teach it as a bachelor's degree, so most students who want it either study abroad or take it as a minor.", "ar": "المنطق والأخلاق ونظرية المعرفة وتاريخ الفلسفة، الغربية والإسلامية، مع قراءة دقيقة لنصوص صعبة وكتابة حجاجية كثيرة. أربع سنوات. وقليل جداً من جامعات دول الخليج تدرّسها كدرجة بكالوريوس، فمعظم من يريدها يدرس في الخارج أو يأخذها تخصصاً فرعياً."}, "day": {"en": "For the small number who stay in the field it is teaching and academic writing. For everyone else the degree is a foundation rather than a job. The day looks like whatever field you entered, law, policy, journalism or consulting, with philosophy showing up in how you build an argument rather than in your job title.", "ar": "بالنسبة للعدد القليل الذي يبقى في المجال، العمل تدريس وكتابة أكاديمية. أما البقية فالدرجة أساس وليست وظيفة. يومك يشبه المجال الذي دخلته، القانون أو السياسات أو الصحافة أو الاستشارات، وتظهر الفلسفة في طريقة بنائك للحجة لا في المسمى الوظيفي."}, "hard": {"en": "Be honest with yourself about this one. It is intellectually excellent and vocationally narrow, and no Gulf employer advertises for a philosopher. What it genuinely trains is precise reasoning, spotting a bad argument, and writing clearly under pressure, which transfers well into law, public policy, journalism and consulting, but you will usually need a second qualification to convert it into work. Availability is the other problem, since only a handful of GCC institutions offer it at all.", "ar": "كن صريحاً مع نفسك هنا. التخصص ممتاز فكرياً وضيق مهنياً، ولا يعلن أي صاحب عمل في الخليج عن وظيفة فيلسوف. وما يدربه فعلاً هو الاستدلال الدقيق واكتشاف الحجة الفاسدة والكتابة الواضحة تحت الضغط، وهذا ينتقل جيداً إلى القانون والسياسات العامة والصحافة والاستشارات، لكنك ستحتاج عادة إلى مؤهل ثانٍ لتحويله إلى عمل. والمشكلة الأخرى هي التوافر، فعدد قليل جداً من مؤسسات دول الخليج يقدمه أصلاً."}, "subj": {"en": ["Arabic", "English", "Islamic studies"], "ar": ["اللغة العربية", "اللغة الإنجليزية", "التربية الإسلامية"]}, "u": {"bh": [], "sa": [], "ae": ["NYU Abu Dhabi", "Sorbonne University Abu Dhabi"], "qa": [], "kw": ["Kuwait University"], "om": []}},
{"id": "arabic", "g": "hum", "n": {"en": "Arabic Language and Literature", "ar": "اللغة العربية وآدابها"}, "study": {"en": "Classical and modern Arabic literature, grammar and morphology, rhetoric, philology and literary criticism, with a heavy load of pre-Islamic and Abbasid poetry. Most Gulf programmes run four years and are taught entirely in Arabic. Many add a teaching-methods track or a media and editing track in the final year.", "ar": "الأدب العربي القديم والحديث، والنحو والصرف، والبلاغة، وفقه اللغة، والنقد الأدبي، مع قدر كبير من الشعر الجاهلي والعباسي. معظم برامج الخليج مدتها أربع سنوات وتُدرَّس بالعربية كاملة. ويضيف كثير منها مسار طرائق التدريس أو مسار الإعلام والتحرير في السنة الأخيرة."}, "day": {"en": "The main routes are teaching, newsroom and content editing, official writing inside government and companies, and translation. A working day is proofreading, rewriting weak copy into correct Arabic, marking student work, or preparing lessons. This is one of the few fields where being a native speaker is a genuine professional asset rather than something taken for granted, because employers across the Gulf struggle to find people who write formal Arabic accurately.", "ar": "المسارات الرئيسية هي التدريس، والتحرير الصحفي وتحرير المحتوى، والكتابة الرسمية في الجهات الحكومية والشركات، والترجمة. يوم العمل تدقيق لغوي، وإعادة صياغة نصوص ركيكة بعربية سليمة، وتصحيح أوراق الطلبة، أو إعداد الدروس. وهذا من الميادين القليلة التي تكون فيها اللغة الأم ميزة مهنية حقيقية لا أمرًا مفروغًا منه، لأن جهات العمل في الخليج تجد صعوبة في العثور على من يكتب العربية الفصحى كتابة صحيحة."}, "hard": {"en": "The grammar and the volume of memorised classical text defeat students who expected an easy ride because they already speak Arabic. Employability is the honest problem: teaching absorbs most graduates, and the ministry hiring queue in several Gulf states is long. Machine translation has taken most of the generic Arabic translation work, while legal, literary and religious translation still needs a person.", "ar": "النحو وحجم النصوص التراثية المطلوب حفظها يوقعان الطلبة الذين ظنوا الأمر سهلًا لأنهم يتحدثون العربية أصلًا. والمشكلة الصريحة هي التوظيف: التدريس يستوعب أغلب الخريجين، وقوائم الانتظار في وزارات التربية في عدد من دول الخليج طويلة. كما استحوذت الترجمة الآلية على معظم أعمال الترجمة العربية العامة، بينما تبقى الترجمة القانونية والأدبية والدينية بحاجة إلى إنسان."}, "subj": {"en": ["Arabic", "Islamic Studies", "History"], "ar": ["اللغة العربية", "التربية الإسلامية", "التاريخ"]}, "u": {"bh": ["University of Bahrain"], "sa": ["King Saud University", "Islamic University of Madinah", "Qassim University"], "ae": ["UAE University", "University of Sharjah"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University", "Dhofar University"]}},
{"id": "english", "g": "hum", "n": {"en": "English Language, Literature and Translation", "ar": "اللغة الإنجليزية والأدب والترجمة"}, "study": {"en": "Literature from Shakespeare to modern fiction, linguistics and phonetics, academic writing, and in translation tracks a practical sequence of Arabic to English rendering plus interpreting labs. Four years, taught in English, usually after a foundation year for students whose school English is weak. Some Gulf programmes split into a literature stream and a translation stream in year three.", "ar": "الأدب الإنجليزي من شكسبير إلى الرواية الحديثة، وعلم اللغة والأصوات، والكتابة الأكاديمية، وفي مسارات الترجمة سلسلة عملية من النقل بين العربية والإنجليزية مع مختبرات للترجمة الفورية. أربع سنوات بالإنجليزية، وغالبًا بعد سنة تأسيسية لمن كانت لغته المدرسية ضعيفة. وتنقسم بعض برامج الخليج في السنة الثالثة إلى مسار أدب ومسار ترجمة."}, "day": {"en": "Graduates end up teaching English, editing and writing corporate and government English, working in communications, or translating. Translation work in practice is now post-editing machine output, fixing terminology, and handling documents that must be legally exact. Interpreting is a separate and much harder skill, done live, with no chance to revise.", "ar": "يعمل الخريجون في تدريس الإنجليزية، وتحرير وكتابة المحتوى الإنجليزي في الشركات والجهات الحكومية، والاتصال المؤسسي، والترجمة. والترجمة عمليًا اليوم هي مراجعة مخرجات الآلة، وضبط المصطلح، ومعالجة الوثائق التي يجب أن تكون دقيقة قانونيًا. أما الترجمة الفورية فمهارة منفصلة وأصعب بكثير، تُؤدى مباشرة ولا مجال فيها للمراجعة."}, "hard": {"en": "The honest warning: generic translation is the single most AI-exposed language job, machine output is already good enough for routine business text, and the entry-level pipeline that used to train translators has thinned. What survives is specialised, meaning legal, medical, certified and literary translation, and live interpretation. This is also a crowded major in the Gulf, so a second skill or a certified specialisation now matters more than the degree alone.", "ar": "التحذير الصريح: الترجمة العامة هي أكثر الوظائف اللغوية تعرضًا للذكاء الاصطناعي، ومخرجات الآلة صارت كافية للنصوص التجارية الاعتيادية، وتقلص مسار العمل المبتدئ الذي كان يصنع المترجمين. الباقي هو التخصص، أي الترجمة القانونية والطبية والمعتمدة والأدبية والترجمة الفورية. وهو تخصص مزدحم في الخليج، فوجود مهارة ثانية أو تخصص معتمد صار أهم من الشهادة وحدها."}, "subj": {"en": ["English", "Arabic", "History"], "ar": ["اللغة الإنجليزية", "اللغة العربية", "التاريخ"]}, "u": {"bh": ["University of Bahrain", "Ahlia University"], "sa": ["King Saud University", "King Khalid University", "Effat University", "Qassim University"], "ae": ["UAE University", "American University of Sharjah"], "qa": ["Qatar University"], "kw": ["Kuwait University", "American University of Kuwait", "Gulf University for Science and Technology"], "om": ["Sultan Qaboos University", "Dhofar University"]}},
{"id": "islamic", "g": "hum", "n": {"en": "Islamic Studies and Sharia", "ar": "الدراسات الإسلامية والشريعة"}, "study": {"en": "Quranic sciences and tafsir, hadith and its authentication, fiqh across the schools, usul al-fiqh, aqeedah and Islamic history, with classical Arabic running through all of it. Most Gulf programmes run four years, and some run five where a law component is included. Departments usually specialise, so you choose fiqh, aqeedah and dawah, or Quran and Sunnah.", "ar": "علوم القرآن والتفسير، والحديث وتخريجه، والفقه على المذاهب، وأصول الفقه، والعقيدة، والتاريخ الإسلامي، مع العربية الفصحى في كل ذلك. معظم برامج الخليج أربع سنوات، وبعضها خمس حين يضم مكونًا نظاميًا في القانون. وتتخصص الأقسام عادة، فتختار الفقه، أو العقيدة والدعوة، أو القرآن والسنة."}, "day": {"en": "The work is textual and careful: reading primary sources, tracing a ruling back to its evidence, drafting written opinions, teaching, and answering questions from the public. Graduates go into Sharia courts and the judiciary, fatwa and religious authority bodies, schools and universities, Sharia supervisory boards at Islamic banks, and endowment (waqf) administration.", "ar": "العمل نصي دقيق: قراءة المصادر الأصلية، وتتبع الحكم إلى دليله، وصياغة الأجوبة المكتوبة، والتدريس، والرد على أسئلة الناس. ويتجه الخريجون إلى المحاكم الشرعية والقضاء، وجهات الإفتاء والشؤون الدينية، والمدارس والجامعات، والهيئات الشرعية في المصارف الإسلامية، وإدارة الأوقاف."}, "hard": {"en": "The memorisation load, and the precision expected when citing evidence. On employment, be clear-eyed: judicial and Sharia court appointment routes are restricted to nationals in the GCC states, so check the rules for your citizenship before choosing. Teaching and waqf administration absorb many graduates, while the Islamic finance Sharia board route is small, competitive and usually needs postgraduate study.", "ar": "حجم الحفظ، والدقة المطلوبة في عزو الأدلة. وفي التوظيف يجب الوضوح: مسارات التعيين في القضاء والمحاكم الشرعية مقصورة على المواطنين في دول مجلس التعاون، فتحقق من الأنظمة بحسب جنسيتك قبل الاختيار. والتدريس وإدارة الأوقاف يستوعبان كثيرًا من الخريجين، أما مسار الهيئات الشرعية في التمويل الإسلامي فضيق وتنافسي ويحتاج غالبًا دراسات عليا."}, "subj": {"en": ["Islamic Studies", "Arabic", "History"], "ar": ["التربية الإسلامية", "اللغة العربية", "التاريخ"]}, "u": {"bh": ["University of Bahrain"], "sa": ["Islamic University of Madinah", "Imam Mohammad Ibn Saud Islamic University", "Qassim University"], "ae": ["University of Sharjah", "Al Qasimia University"], "qa": ["Qatar University"], "kw": ["Kuwait University"], "om": []}},
{"id": "libinfo", "g": "hum", "n": {"en": "Library and Information Science", "ar": "علم المكتبات والمعلومات"}, "study": {"en": "Despite the name, the modern degree is mostly information organisation: metadata standards, cataloguing and classification, database and repository design, digital preservation, records management and archival practice, plus research methods. Four years. Most Gulf programmes now carry a digital archives or information systems track.", "ar": "رغم الاسم، فإن الدرجة الحديثة تدور في معظمها حول تنظيم المعلومات: معايير البيانات الوصفية، والفهرسة والتصنيف، وتصميم قواعد البيانات والمستودعات الرقمية، والحفظ الرقمي، وإدارة السجلات والممارسة الأرشيفية، مع مناهج البحث. أربع سنوات. ومعظم برامج الخليج تضم اليوم مسارًا في الأرشفة الرقمية أو نظم المعلومات."}, "day": {"en": "The work is structuring information so other people can find it later: building metadata schemes, running document and records systems for a ministry or a company, digitising and preserving archives, and operating institutional repositories. Much of it sits closer to IT than to a reading room.", "ar": "العمل هو هيكلة المعلومات ليتمكن غيرك من إيجادها لاحقًا: بناء أنظمة البيانات الوصفية، وتشغيل أنظمة الوثائق والسجلات في وزارة أو شركة، ورقمنة الأرشيف وحفظه، وإدارة المستودعات المؤسسية. وكثير منه أقرب إلى تقنية المعلومات منه إلى قاعة مطالعة."}, "hard": {"en": "The name is the main obstacle, because students and families read it as shelving books while the actual jobs are in information architecture, records management and digital archives. It is also detail work, and people who cannot tolerate precise, rule-bound classification leave early. Employability is reasonable in government archives, oil and gas document control, hospitals and banks, but you have to look for the roles under titles like records officer or document controller.", "ar": "الاسم نفسه هو العقبة الأولى، فالطالب وأسرته يقرآنه على أنه ترتيب كتب، بينما الوظائف الحقيقية في هندسة المعلومات وإدارة السجلات والأرشفة الرقمية. وهو عمل تفصيلي، ومن لا يحتمل التصنيف الدقيق المحكوم بقواعد يتركه مبكرًا. وفرص العمل معقولة في الأرشيفات الحكومية وضبط الوثائق في النفط والغاز والمستشفيات والبنوك، لكن عليك البحث عن المسميات مثل أخصائي سجلات أو مراقب وثائق."}, "subj": {"en": ["Computer Science", "English", "Arabic"], "ar": ["الحاسوب", "اللغة الإنجليزية", "اللغة العربية"]}, "u": {"bh": [], "sa": ["King Saud University"], "ae": [], "qa": [], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University", "Middle East College"]}}
];

  }

let lang = "en", group = "all", query = "";
const $ = id => document.getElementById(id);

function applyChrome(){
  const U = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar"
    ? "استكشف التخصصات الجامعية | د. صقر آل خليفة"
    : "Explore University Majors | Dr. Saqer AlKhalifa";
  $("langToggle").textContent = U.toggle;
  $("t-title").textContent = U.title;
  $("t-sub").textContent = U.sub;
  $("t-quizline").innerHTML = U.quizline;
  $("t-quizbtn").textContent = U.quizbtn;
  $("t-scholline").innerHTML = U.scholline;
  $("t-scholbtn").textContent = U.scholbtn;
  $("t-parline").innerHTML = U.parline;
  $("t-parbtn").textContent = U.parbtn;
  $("t-entline").innerHTML = U.entline;
  $("t-entbtn").textContent = U.entbtn;
  $("search").placeholder = U.search;
  $("t-disc").textContent = U.disc;
  $("t-foot").innerHTML = U.foot;
  $("empty").textContent = U.empty;
  $("filters").innerHTML = GROUPS.map(g =>
    `<button class="fbtn${g.id===group?" on":""}" data-g="${g.id}">${g[lang]}</button>`).join("");
  $("filters").querySelectorAll(".fbtn").forEach(b =>
    b.addEventListener("click", () => { group = b.dataset.g; applyChrome(); render(); }));
}

function matches(m){
  if(group !== "all" && m.g !== group) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  const hay = [m.n.en, m.n.ar, m.study.en, m.study.ar, m.day.en, m.day.ar,
               m.subj.en.join(" "), m.subj.ar.join(" "),
               Object.values(m.u).flat().join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function uniBlock(m, U){
  return `<div class="unis">` + CT_ORDER.map(c => {
    const list = m.u[c] || [];
    const val = list.length ? list.join(" · ") : U.none;
    return `<div class="uni-row${list.length?"":" none"}"><b>${CT[c][lang]}</b><span>${val}</span></div>`;
  }).join("") + `</div><p class="note">${U.uniNote}</p>`;
}

function render(){
  const U = UI[lang];
  const shown = MAJORS.filter(matches);
  $("count").textContent = U.count(shown.length, MAJORS.length);
  $("empty").style.display = shown.length ? "none" : "block";
  const gname = g => (GROUPS.find(x => x.id === g) || {})[lang] || "";
  $("list").innerHTML = shown.map(m => `
    <div class="mcard" id="m-${m.id}">
      <button class="mhead" data-id="${m.id}">
        <h2>${m.n[lang]}<span class="grp">${gname(m.g)}</span></h2>
        <span class="chev">›</span>
      </button>
      <div class="mbody">
        <div class="sec"><h3>${U.hStudy}</h3><p>${m.study[lang]}</p></div>
        <div class="sec"><h3>${U.hDay}</h3><p>${m.day[lang]}</p></div>
        <div class="sec"><h3>${U.hHard}</h3><p>${m.hard[lang]}</p></div>
        <div class="sec"><h3>${U.hSubj}</h3><p>${m.subj[lang].map(s=>`<span class="subj">${s}</span>`).join("")}</p></div>
        <div class="sec"><h3>${U.hUni}</h3>${uniBlock(m, U)}</div>
      </div>
    </div>`).join("");
  $("list").querySelectorAll(".mhead").forEach(b =>
    b.addEventListener("click", () => {
      const card = document.getElementById("m-" + b.dataset.id);
      const opening = !card.classList.contains("open");
      card.classList.toggle("open");
      if(opening && window.goatcounter && window.goatcounter.count){
        try{ window.goatcounter.count({path:"explore-" + b.dataset.id, event:true}); }catch(e){}
      }
    }));
  openFromHash();
}

function openFromHash(){
  const h = (location.hash || "").replace("#", "");
  if(!h) return;
  const card = document.getElementById("m-" + h);
  if(card && !card.classList.contains("open")){
    card.classList.add("open");
    setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60);
  }
}

$("langToggle").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  applyChrome(); render();
});
$("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
window.addEventListener("hashchange", openFromHash);

applyChrome();
render();

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
