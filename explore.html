  .brand strong{color:var(--ink); font-weight:600;}

  .hero{text-align:center; padding:40px 0 6px;}

  .hero p{color:var(--ink-2); font-size:1.08rem; max-width:600px; margin:0 auto;}

  .quizbar{background:var(--accent-soft); border:1px solid #cfe0ef; border-radius:var(--radius);
    padding:18px 22px; margin:24px 0 8px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .quizbar p{flex:1 1 260px; font-size:1rem; color:var(--ink-2); margin:0;}
  .quizbar b{color:var(--ink);}
  .btn{display:inline-block; border:none; cursor:pointer; text-decoration:none; text-align:center;
    background:var(--accent); color:#fff; font-size:1rem; font-weight:600; font-family:inherit;
    padding:12px 26px; border-radius:999px; transition:transform .12s, box-shadow .12s;
    box-shadow:0 4px 14px rgba(28,93,153,.28); white-space:nowrap;}
  .btn:hover{transform:translateY(-1px);}

  .tools{position:sticky; top:0; background:var(--paper); padding:16px 0 12px; z-index:5;
    border-bottom:1px solid var(--line); margin-bottom:18px;}
  .search{width:100%; font-family:inherit; font-size:1rem; padding:13px 18px;
    border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink);}
  .search:focus{outline:none; border-color:var(--accent);}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .fbtn{background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 15px; font-size:.9rem; font-family:inherit; color:var(--ink-2); cursor:pointer;}
  .fbtn:hover{border-color:var(--accent);}
  .fbtn.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .count{font-size:.85rem; color:var(--ink-3); margin-top:10px;}

  .mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;}
  .mhead{display:flex; align-items:center; gap:14px; padding:20px 24px; cursor:pointer; width:100%;
    background:none; border:none; text-align:start; font-family:inherit; color:var(--ink);}
  .mhead:hover{background:var(--accent-soft);}
  .mhead h2{font-size:1.2rem; font-weight:700; flex:1;}
  .mhead .grp{font-size:.78rem; color:var(--ink-3); display:block; font-weight:400; margin-top:2px;}
  .chev{color:var(--accent); font-size:1.1rem; flex:0 0 auto; transition:transform .2s;}
  .mcard.open .chev{transform:rotate(90deg);}
  [dir="rtl"] .chev{transform:rotate(180deg);}
  [dir="rtl"] .mcard.open .chev{transform:rotate(90deg);}
  .mbody{display:none; padding:0 24px 22px; border-top:1px solid var(--line);}
  .mcard.open .mbody{display:block;}
  .sec{margin-top:18px;}
  .sec h3{font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
    font-weight:800; margin-bottom:6px;}
  .sec p{color:var(--ink-2); font-size:1rem;}
  [dir="rtl"] .sec h3{letter-spacing:0; text-transform:none; font-size:.95rem;}
  .subj{display:inline-block; background:var(--accent-soft); color:var(--accent);

  .uni-row b{color:var(--ink); font-weight:600;}
  .uni-row span{color:var(--ink-2);}
  .uni-row.none span{color:#a3574d;}
  .note{font-size:.84rem; color:var(--ink-3); margin-top:12px; line-height:1.5;}
  .empty{text-align:center; color:var(--ink-3); padding:40px 0;}

  footer.site{margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
    text-align:center; font-size:.85rem; color:var(--ink-3);}
  footer.site a{color:var(--accent); text-decoration:none;}
  .disc{font-size:.84rem; color:var(--ink-3); max-width:640px; margin:0 auto 14px; line-height:1.55;}

  @media (max-width:560px){

/* ============================================================
   Shared design system, applied across every page
   ============================================================ */
:root{
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Source Sans 3', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --font-ar:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif;

  --paper:#fbf9f5;
  --paper-2:#f4f0e7;
  --card:#ffffff;
  --line:#e7e1d5;
  --line-2:#d6ccb9;

  --ink:#14181d;
  --ink-2:#4a525b;
  --ink-3:#8b929b;

  --navy:#14365c;
  --navy-deep:#0d2036;
  --accent:#16456f;
  --accent-soft:#eaf0f7;
  --accent-line:#c9d9ea;

  --gold:#a37518;
  --gold-soft:#fbf3e1;
  --gold-line:#ecdcb4;
  --gold-bright:#c79a3a;

  --good:#0d6f47;
  --good-soft:#e8f4ee;
  --good-line:#c4e2d3;
  --warn:#8a5a12;
  --warn-soft:#fbf3e1;
  --warn-line:#ecdcb4;
  --bad:#9c3b34;
  --bad-soft:#fbecea;
  --bad-line:#eecdc9;

  --radius:16px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,24,29,.04), 0 14px 30px -16px rgba(20,24,29,.20);
  --shadow-lift:0 2px 4px rgba(20,24,29,.05), 0 22px 40px -20px rgba(20,24,29,.28);
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar);}
body::before{
  content:""; position:fixed; inset:0 0 auto 0; height:3px; z-index:99;
  background:linear-gradient(90deg, var(--navy-deep), var(--navy) 38%, var(--gold-bright) 72%, var(--gold) 100%);
}

.serif, .chap h2, .cn, .stat-n, .minrow b{
  font-family:var(--font-display);
  font-variation-settings:'SOFT' 22, 'WONK' 0;
  letter-spacing:-.012em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .stat-n{
  font-family:var(--font-ar); font-variation-settings:normal; letter-spacing:0; font-weight:700;
}
h1,h2,h3{letter-spacing:-.01em;}
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{letter-spacing:0;}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--gold-soft); color:var(--navy-deep);}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2.5px solid var(--gold-bright); outline-offset:2px; border-radius:6px;
}

/* ---------- masthead ---------- */
header.site{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:16px 0 14px; border-bottom:1px solid var(--line); margin-bottom:0;
}
header.site .brand{
  display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; min-width:0;
}
header.site .mark{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 30%, #1d4a79, var(--navy-deep));
  box-shadow:0 2px 8px rgba(13,32,54,.28), inset 0 0 0 1px rgba(232,194,106,.45);
}
header.site .bt{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
header.site .bt strong{
  font-family:var(--font-display); font-weight:600; font-size:1.06rem; color:var(--ink);
  letter-spacing:-.015em; white-space:nowrap;
}
[dir="rtl"] header.site .bt strong{font-family:var(--font-ar); letter-spacing:0;}
header.site .bs{
  font-size:.74rem; color:var(--ink-3); letter-spacing:.07em; text-transform:uppercase; white-space:nowrap;
}
[dir="rtl"] header.site .bs{letter-spacing:0; text-transform:none; font-size:.82rem;}
.lang-toggle{
  flex:0 0 auto; border:1px solid var(--line-2); background:var(--card); border-radius:999px;
  padding:7px 17px; font-size:.9rem; cursor:pointer; color:var(--accent); font-weight:600;
  font-family:inherit; transition:background .15s, border-color .15s, transform .12s;
}
.lang-toggle:hover{background:var(--accent-soft); border-color:var(--accent-line); transform:translateY(-1px);}

/* ---------- tool switcher ---------- */
.toolnav{
  display:flex; gap:6px; padding:12px 0 4px; overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid var(--line); margin-bottom:4px;
}
.toolnav::-webkit-scrollbar{display:none;}
.toolnav a{
  flex:0 0 auto; text-decoration:none; font-size:.88rem; font-weight:600; color:var(--ink-2);
  padding:7px 14px; border-radius:999px; border:1px solid transparent; white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s;
}
.toolnav a:hover{background:var(--accent-soft); color:var(--accent);}
.toolnav a.on{background:var(--navy); color:#fff; box-shadow:0 3px 10px -3px rgba(20,54,92,.6);}
.toolnav a.on:hover{background:var(--navy-deep); color:#fff;}

/* ---------- hero ---------- */
.hero, .res-head{position:relative;}
.hero::before{
  content:""; position:absolute; z-index:-1; left:50%; top:-40px; transform:translateX(-50%);
  width:min(760px, 118%); height:330px; pointer-events:none;
  background:
    radial-gradient(closest-side, rgba(199,154,58,.13), transparent 72%) 22% 12%/58% 78% no-repeat,
    radial-gradient(closest-side, rgba(20,54,92,.13), transparent 72%) 82% 34%/62% 82% no-repeat;
  filter:blur(2px);
}
.hero h1{font-size:clamp(1.75rem, 1.15rem + 2.3vw, 2.5rem); line-height:1.18; font-weight:600;}
[dir="rtl"] .hero h1{line-height:1.4; font-weight:700;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker{color:var(--gold); font-weight:700;}

/* ---------- surfaces ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox{
  border-radius:var(--radius); border-color:var(--line); box-shadow:var(--shadow);
}
.mcard, .pcard{transition:box-shadow .18s, border-color .18s, transform .18s;}
.mcard:hover, .pcard:hover{box-shadow:var(--shadow-lift); border-color:var(--line-2);}
.pcard{border-inline-start-width:5px;}

/* ---------- buttons and chips ---------- */
.btn{
  background:linear-gradient(180deg, #1d4d7c, var(--navy));
  border:none; border-radius:999px; font-weight:600; letter-spacing:.005em; color:#fff;
  box-shadow:0 2px 4px rgba(13,32,54,.18), 0 10px 22px -10px rgba(13,32,54,.7);
  transition:transform .14s, box-shadow .14s, filter .14s;
}
.btn:hover{transform:translateY(-1.5px); box-shadow:0 3px 6px rgba(13,32,54,.2), 0 16px 30px -12px rgba(13,32,54,.75); filter:saturate(1.08);}
.btn.ghost, .btn.secondary{
  background:var(--card); color:var(--accent); border:1.5px solid var(--accent-line);
  box-shadow:0 1px 2px rgba(20,24,29,.04);
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--accent-soft); border-color:var(--accent);}
.fbtn{
  border:1.5px solid var(--line-2); border-radius:999px; background:var(--card); color:var(--ink-2);
  transition:border-color .15s, background .15s, color .15s, transform .12s;
}
.fbtn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
.fbtn.on{
  background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;
  box-shadow:0 3px 10px -4px rgba(20,54,92,.75);
}
.printbtn{border-color:var(--accent-line);}
.printbtn:hover{background:var(--accent-soft);}

/* ---------- bars and callouts ---------- */
.bar, .quizbar, .cta-inline{
  background:linear-gradient(180deg, #f2f6fb, var(--accent-soft));
  border:1px solid var(--accent-line); border-radius:var(--radius);
}
.rule, .checked, .hedge, .extra, .flag{border-radius:var(--radius-sm);}
.rule.w, .checked, .hedge, .extra, .flag{
  background:linear-gradient(180deg, #fdf8ec, var(--gold-soft)); border-color:var(--gold-line);
}
.rule.b{background:linear-gradient(180deg, #fdf1ef, var(--bad-soft)); border-color:var(--bad-line);}
.rule.n{background:linear-gradient(180deg, #f2f6fb, var(--accent-soft)); border-color:var(--accent-line);}

/* ---------- section labels ---------- */
.sec h3, .lbl, .toc h2{letter-spacing:.1em; font-weight:800;}
[dir="rtl"] .sec h3, [dir="rtl"] .lbl, [dir="rtl"] .toc h2{letter-spacing:0;}
.grp-t, .grp h2, .panel h2, .srcbox h2, .majors-title{font-family:var(--font-display); letter-spacing:-.012em; font-weight:600;}
[dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title{font-family:var(--font-ar); letter-spacing:0; font-weight:700;}

/* ---------- footer ---------- */
footer.site{
  margin-top:52px; padding:26px 0 0; border-top:1px solid var(--line); color:var(--ink-3);
}
footer.site a{color:var(--accent); font-weight:600;}

@media (max-width:520px){
  header.site .bs{display:none;}
  .toolnav a{font-size:.83rem; padding:6px 12px;}
}

/* ---------- page specific polish ---------- */
:root{--accent-2:#2f6da6;}
body:has(#screen-quiz.active) .toolnav{display:none;}
.bar-fill{background:linear-gradient(90deg, var(--navy), #2f6da6);}
.viz-bar-fill, .viz-row .fill{background:linear-gradient(90deg, var(--navy), var(--accent-2));}
.navbtn{
  background:var(--card); border:1.5px solid var(--line-2); border-radius:999px;
  color:var(--ink-2); font-weight:600; transition:border-color .15s, color .15s, transform .12s, background .15s;
}
.navbtn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); transform:translateY(-1px);}
.section-chip{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);}
.opt{border-radius:var(--radius-sm); transition:border-color .15s, background .15s, box-shadow .15s;}
.opt.selected{box-shadow:0 0 0 1px var(--accent) inset;}
[dir="rtl"] body::before{
  background:linear-gradient(270deg, var(--navy-deep), var(--navy) 38%, var(--gold-bright) 72%, var(--gold) 100%);
}
.hero::before{filter:blur(0px); opacity:.85;}
.mhead h2, .phead .ptxt b, .mcard h3{letter-spacing:-.005em;}

@media print{ .toolnav, body::before, .crosslinks{display:none;} }
  .crosslinks{margin-top:44px; padding-top:26px; border-top:1px solid var(--line);}
  .crosslinks .quizbar:first-child, .crosslinks .bar:first-child{margin-top:0;}


</style>

        ar:"سنتان إلى ثلاث في دراسة الجسم وكيف يعمل: التشريح ووظائف الأعضاء والكيمياء الحيوية وعلم الأدوية. ثم سنوات سريرية في المستشفى تتنقل فيها بين الجراحة وطب الأطفال والنساء والولادة والطب النفسي والباطنية. توقع من خمس إلى سبع سنوات، تليها سنة امتياز، ثم سنوات إقامة قبل أن تصبح اختصاصيًا."},
 day:{en:"Ward rounds early in the morning, seeing patients, ordering and interpreting tests, writing notes, explaining difficult news to families. Long shifts including nights and weekends. The work is intellectually demanding and emotionally heavy, and you are rarely finished when you go home.",
      ar:"جولات صباحية مبكرة، ومقابلة المرضى، وطلب الفحوصات وتفسيرها، وكتابة التقارير، وشرح الأخبار الصعبة للأهل. مناوبات طويلة تشمل الليالي والعطل. العمل مرهق ذهنيًا وثقيل عاطفيًا، ونادرًا ما ينتهي يومك حين تعود إلى البيت."},
 hard:{en:"The length is what surprises people most: you are still training in your late twenties while friends are established. Students also underestimate how much of medicine is memorisation in the early years, and how much is emotional labour later.",
       ar:"المدة هي ما يفاجئ الناس أكثر: ما زلت تتدرب في أواخر العشرينات بينما استقر أصدقاؤك. كما يقلّل الطلبة من حجم الحفظ في السنوات الأولى، ومن حجم العبء العاطفي لاحقًا."},
 subj:{en:["Biology","Chemistry","Physics","Strong grades overall"], ar:["الأحياء","الكيمياء","الفيزياء","معدل مرتفع عمومًا"]},
 u:{bh:["Arabian Gulf University","RCSI Medical University of Bahrain"],
    sa:["King Saud University","King Abdulaziz University","Imam Abdulrahman Bin Faisal University","Alfaisal University","King Khalid University","Umm Al-Qura University","Taibah University","Qassim University"],

{id:"dent", g:"health", n:{en:"Dentistry", ar:"طب الأسنان"},
 study:{en:"Head and neck anatomy, oral biology and materials science, then years of supervised clinical practice on real patients: fillings, extractions, root canals, crowns. Usually five to six years, and much of it is learning precise handwork under a microscope-level of tolerance.",
        ar:"تشريح الرأس والعنق، وبيولوجيا الفم، وعلوم المواد، ثم سنوات من الممارسة السريرية تحت الإشراف على مرضى حقيقيين: حشوات وخلع وعلاج جذور وتيجان. غالبًا خمس إلى ست سنوات، ومعظمها تعلّم عمل يدوي بالغ الدقة."},
 day:{en:"Back-to-back appointments in one room, working in a space the size of a matchbox while a nervous person sits inches from your face. Highly repetitive by design, physically static, and you build a regular patient base over years.",
      ar:"مواعيد متتالية في غرفة واحدة، وعمل في مساحة بحجم علبة صغيرة بينما يجلس شخص متوتر على بعد سنتيمترات من وجهك. عمل متكرر بطبيعته، وثابت بدنيًا، وتبني قاعدة مرضى منتظمة عبر السنين."},
 hard:{en:"Two things: the manual precision, which some very academic students never quite develop, and the isolation, since you work alone in a room rather than in a team. Neck and back problems are common later in the career.",
       ar:"أمران: الدقة اليدوية التي لا يتقنها بعض الطلبة الأكاديميين تمامًا، والعزلة لأنك تعمل وحدك في غرفة لا ضمن فريق. ومشاكل الرقبة والظهر شائعة لاحقًا في المهنة."},
 subj:{en:["Biology","Chemistry","Art or anything using your hands"], ar:["الأحياء","الكيمياء","الفنون أو أي عمل يدوي"]},
 u:{bh:[], sa:["King Saud University","King Abdulaziz University","Imam Abdulrahman Bin Faisal University","King Khalid University","Umm Al-Qura University","Taibah University","Qassim University"],
    ae:["University of Sharjah","Ajman University","Gulf Medical University"],
    qa:["Qatar University"], kw:["Kuwait University"], om:[]}},

{id:"pharm", g:"health", n:{en:"Pharmacy", ar:"الصيدلة"},
 study:{en:"Heavy chemistry: how drugs are built, how the body absorbs and breaks them down, how they interact. Then therapeutics, meaning which drug for which condition at which dose, plus clinical placements. Usually five years for a PharmD.",
        ar:"كيمياء مكثفة: كيف تُصنع الأدوية، وكيف يمتصها الجسم ويحللها، وكيف تتفاعل. ثم العلاجات، أي أي دواء لأي حالة وبأي جرعة، مع تدريب سريري. غالبًا خمس سنوات لدرجة الدكتور الصيدلي."},
 day:{en:"In a hospital, reviewing prescriptions for safety and dosing, advising doctors, and joining ward rounds. In a community pharmacy, serving the public all day and answering the questions people are too embarrassed to ask a doctor. In industry, quality control and regulatory work.",
      ar:"في المستشفى: مراجعة الوصفات من حيث السلامة والجرعة، وإرشاد الأطباء، والمشاركة في الجولات. وفي الصيدلية المجتمعية: خدمة الجمهور طوال اليوم والإجابة عن الأسئلة التي يخجل الناس من طرحها على الطبيب. وفي الصناعة: مراقبة الجودة والشؤون التنظيمية."},
 hard:{en:"The volume of chemistry surprises students who chose it as a lighter alternative to medicine. It is not lighter, it is different. Community pharmacy can also feel more retail than clinical, which disappoints some graduates.",
       ar:"كمية الكيمياء تفاجئ من اختارها بديلًا أخف من الطب. هي ليست أخف، بل مختلفة. كما أن الصيدلية المجتمعية قد تبدو أقرب إلى البيع منها إلى العمل السريري، وهو ما يخيّب بعض الخريجين."},
 subj:{en:["Chemistry","Biology","Mathematics"], ar:["الكيمياء","الأحياء","الرياضيات"]},
 u:{bh:["University of Bahrain"],
    sa:["King Saud University","King Abdulaziz University","Alfaisal University (PharmD)","King Khalid University","Umm Al-Qura University","Taibah University","Qassim University"],
    ae:["University of Sharjah","Ajman University"], qa:["Qatar University"], kw:["Kuwait University"],
    om:["National University of Science and Technology","University of Nizwa"]}},

{id:"nurs", g:"health", n:{en:"Nursing", ar:"التمريض"},
 study:{en:"Anatomy and physiology, pharmacology, and a great deal of supervised clinical placement from early on. Four years typically, and you are in hospitals from the first or second year rather than waiting until the end.",
        ar:"التشريح ووظائف الأعضاء وعلم الأدوية، مع قدر كبير من التدريب السريري تحت الإشراف منذ وقت مبكر. أربع سنوات عادة، وتكون في المستشفيات من السنة الأولى أو الثانية لا في نهاية البرنامج."},
 day:{en:"Twelve-hour shifts on your feet, responsible for a group of patients: medications, observations, wound care, catching the early signs that something is going wrong. You are the person who is actually there when a patient deteriorates at three in the morning.",
      ar:"مناوبات من اثنتي عشرة ساعة على قدميك، مسؤولًا عن مجموعة مرضى: الأدوية والمتابعة والعناية بالجروح، والتقاط العلامات المبكرة لتدهور الحالة. أنت الموجود فعلًا حين تسوء حالة مريض في الثالثة فجرًا."},
 hard:{en:"The physical demand and the shift pattern, which disrupts sleep and social life permanently. Also the status gap: nurses often know more than junior doctors about ward realities but are not always treated that way.",
       ar:"الجهد البدني ونظام المناوبات الذي يربك النوم والحياة الاجتماعية بشكل دائم. وكذلك فجوة المكانة: الممرضون غالبًا أعلم بواقع القسم من الأطباء المبتدئين لكنهم لا يُعاملون دائمًا على هذا الأساس."},
 subj:{en:["Biology","Chemistry","Communication skills"], ar:["الأحياء","الكيمياء","مهارات التواصل"]},
 u:{bh:["University of Bahrain","Arabian Gulf University","RCSI Bahrain"],
    sa:["King Saud University","King Abdulaziz University","King Khalid University","Umm Al-Qura University","Qassim University","Princess Nourah University"],
    ae:["Gulf Medical University","UAE University","University of Sharjah"],
    qa:["Qatar University","University of Doha for Science and Technology"],
    kw:["Kuwait University","PAAET College of Nursing"],
    om:["Sultan Qaboos University","University of Nizwa"]}},

{id:"biomed", g:"health", n:{en:"Biomedical and Laboratory Science", ar:"العلوم الطبية المخبرية"},
 study:{en:"Microbiology, haematology, clinical biochemistry, immunology and histopathology, with heavy laboratory practice. Four years, and you learn to run and interpret the tests that doctors depend on to diagnose anything at all.",
        ar:"الأحياء الدقيقة وعلم الدم والكيمياء الحيوية السريرية والمناعة وعلم الأنسجة، مع تدريب مخبري مكثف. أربع سنوات، تتعلم فيها إجراء الفحوصات التي يعتمد عليها الأطباء في التشخيص وتفسيرها."},
 day:{en:"Behind the scenes in a hospital laboratory, processing samples, running analysers, flagging abnormal results, and maintaining quality control. Structured, precise, mostly away from patients, and busiest when the emergency department is busiest.",
      ar:"خلف الكواليس في مختبر المستشفى: معالجة العينات، وتشغيل الأجهزة، والتنبيه إلى النتائج غير الطبيعية، وضبط الجودة. عمل منظم ودقيق وبعيد عن المرضى غالبًا، وأكثر ما يكون ازدحامًا حين تزدحم الطوارئ."},
 hard:{en:"It is invisible work. You are essential to diagnosis but patients never meet you and the recognition goes elsewhere. Students who wanted patient contact often find that out too late.",
       ar:"عمل غير مرئي. أنت أساسي في التشخيص لكن المرضى لا يرونك والتقدير يذهب لغيرك. ومن أراد التعامل المباشر مع المرضى يكتشف ذلك متأخرًا غالبًا."},
 subj:{en:["Biology","Chemistry","Attention to detail"], ar:["الأحياء","الكيمياء","الدقة في التفاصيل"]},
 u:{bh:["University of Bahrain (Medical Laboratory Sciences)"],
    sa:["Applied Medical Sciences colleges at the main public universities"],
    ae:["Gulf Medical University","Abu Dhabi University","Khalifa University (Biomedical Engineering)"],
    qa:["Qatar University (Biomedical Sciences)"], kw:["Kuwait University"],
    om:["National University of Science and Technology","A'Sharqiyah University","Sultan Qaboos University"]}},

{id:"physio", g:"health", n:{en:"Physiotherapy and Sports Science", ar:"العلاج الطبيعي وعلوم الرياضة"},
 study:{en:"Musculoskeletal anatomy, biomechanics, exercise physiology and rehabilitation technique, with clinical placements in hospitals, clinics and sometimes sports clubs. Usually four to five years.",
        ar:"تشريح الجهاز العضلي الهيكلي، والميكانيكا الحيوية، وفسيولوجيا التمرين، وتقنيات التأهيل، مع تدريب في المستشفيات والعيادات وأحيانًا الأندية الرياضية. غالبًا أربع إلى خمس سنوات."},
 day:{en:"One-to-one sessions all day: assessing how someone moves, using your hands, and coaching them through exercises they would rather not do. Progress is slow and incremental, and a large part of the job is motivating people who are discouraged.",
      ar:"جلسات فردية طوال اليوم: تقييم حركة الشخص، والعمل بيديك، وتحفيزه على تمارين لا يرغب فيها. التقدم بطيء وتدريجي، وجزء كبير من العمل هو تشجيع أشخاص فقدوا الحماس."},
 hard:{en:"It is physically tiring in a way students do not expect, and emotionally draining when patients do not improve. Sports science in particular is oversubscribed relative to the number of elite sports jobs, so most graduates work in general clinical settings.",
       ar:"مرهق بدنيًا بشكل لا يتوقعه الطلبة، ومستنزف عاطفيًا حين لا يتحسن المرضى. وعلوم الرياضة تحديدًا مزدحمة مقارنة بعدد الوظائف في الرياضة النخبوية، فمعظم الخريجين يعملون في بيئات سريرية عامة."},
 subj:{en:["Biology","Physics","Physical education"], ar:["الأحياء","الفيزياء","التربية الرياضية"]},
 u:{bh:["Ahlia University (Physiotherapy)","University of Bahrain (Sport Sciences)"],
    sa:["King Saud University","Taibah University"],
    ae:["Middlesex University Dubai (Sport Science)"],
    qa:["Qatar University (Physiotherapy and Sport Science)"],
    kw:["Kuwait University (Physical Therapy)"],
    om:["University of Nizwa (Physical Therapy)"]}},

{id:"psych", g:"health", n:{en:"Psychology", ar:"علم النفس"},
 study:{en:"How people think, develop, and behave, taught as a science: research methods and statistics are a bigger part of the degree than most students expect. Cognitive, developmental, social and abnormal psychology, usually over four years.",
        ar:"كيف يفكر الناس وينمون ويتصرفون، ويُدرَّس كعلم: مناهج البحث والإحصاء جزء أكبر من الدرجة مما يتوقعه معظم الطلبة. علم النفس المعرفي والنمائي والاجتماعي والمرضي، غالبًا في أربع سنوات."},
 day:{en:"Depends entirely on the path. Counselling means sessions with clients and careful notes. Organisational psychology means assessment, hiring and training design inside companies. Research means data and writing. Clinical practice requires postgraduate qualification almost everywhere.",
      ar:"يعتمد كليًا على المسار. الإرشاد يعني جلسات مع المراجعين وتوثيقًا دقيقًا. وعلم النفس المؤسسي يعني التقييم والتوظيف وتصميم التدريب داخل الشركات. والبحث يعني البيانات والكتابة. أما الممارسة السريرية فتتطلب دراسات عليا في معظم الدول."},
 hard:{en:"The statistics, which nobody warns you about, and the fact that a bachelor's degree alone does not make you a therapist. Plan for postgraduate study from the start or choose a path that does not need it.",
       ar:"الإحصاء الذي لا ينبهك إليه أحد، وحقيقة أن البكالوريوس وحده لا يجعلك معالجًا. خطط للدراسات العليا من البداية، أو اختر مسارًا لا يتطلبها."},
 subj:{en:["Biology","Mathematics or statistics","Strong writing"], ar:["الأحياء","الرياضيات أو الإحصاء","كتابة قوية"]},
 u:{bh:[], sa:["Effat University (Clinical Psychology)","Dar Al-Hekma University"],
    ae:["American University of Sharjah","American University in Dubai","Zayed University","Abu Dhabi University","University of Wollongong Dubai","Heriot-Watt Dubai","RIT Dubai","Middlesex Dubai","Canadian University Dubai"],
    qa:["Qatar University"], kw:["Kuwait University","American University of Kuwait"],
    om:["A'Sharqiyah University (Psychological Counselling)"]}}
];

{id:"cs", g:"tech", n:{en:"Computer Science and Software Engineering", ar:"علوم الحاسوب وهندسة البرمجيات"},
 study:{en:"Programming from the first week, then the theory underneath it: data structures, algorithms, operating systems, databases, and a lot more discrete mathematics than students expect. Four years, usually ending in a substantial build project.",
        ar:"البرمجة من الأسبوع الأول، ثم النظرية خلفها: هياكل البيانات والخوارزميات وأنظمة التشغيل وقواعد البيانات، وقدر من الرياضيات المتقطعة أكبر مما يتوقعه الطلبة. أربع سنوات تنتهي عادة بمشروع تطبيقي كبير."},

 hard:{en:"The mathematics, and the pace of change: what you learn in year one may be outdated by graduation, so the real skill is learning quickly forever. AI tools have raised the bar for entry-level work, so building real projects while you study matters more than it used to.",
       ar:"الرياضيات، وسرعة التغير: ما تتعلمه في السنة الأولى قد يصبح قديمًا عند التخرج، فالمهارة الحقيقية هي التعلم السريع الدائم. وقد رفعت أدوات الذكاء الاصطناعي سقف المطلوب في الوظائف المبتدئة، فبناء مشاريع حقيقية أثناء الدراسة صار أهم من قبل."},

{id:"cyber", g:"tech", n:{en:"Cybersecurity", ar:"الأمن السيبراني"},
 study:{en:"Networking and operating systems first, because you cannot defend what you do not understand, then cryptography, secure coding, digital forensics and ethical hacking. Four years, with a lot of hands-on lab work and certifications alongside.",
        ar:"الشبكات وأنظمة التشغيل أولًا، لأنك لا تحمي ما لا تفهمه، ثم التشفير والبرمجة الآمنة والتحقيق الجنائي الرقمي والاختراق الأخلاقي. أربع سنوات مع تدريب مخبري كثيف وشهادات مهنية مصاحبة."},
 day:{en:"Monitoring alerts, investigating whether something is a real attack or noise, patching weaknesses, and running tests designed to break your own organisation's systems before someone else does. Periods of routine punctuated by genuine emergencies.",
      ar:"مراقبة التنبيهات، والتحقق مما إذا كان الأمر هجومًا حقيقيًا أم ضجيجًا، وسد الثغرات، وإجراء اختبارات تهدف إلى كسر أنظمة مؤسستك قبل أن يكسرها غيرك. فترات روتينية تتخللها طوارئ حقيقية."},
 hard:{en:"You are on call, and incidents do not respect weekends. It is also a field where you are judged on what did not happen, which can feel thankless. Certifications matter as much as the degree, so budget time and money for them.",

{id:"data", g:"tech", n:{en:"Data Science and Artificial Intelligence", ar:"علوم البيانات والذكاء الاصطناعي"},
 study:{en:"Statistics and linear algebra as the foundation, then programming, machine learning, and how to handle messy real data. Four years. The mathematics is genuinely heavy, and the programs that skip it produce graduates who cannot go deep.",
        ar:"الإحصاء والجبر الخطي كأساس، ثم البرمجة وتعلم الآلة والتعامل مع البيانات الواقعية الفوضوية. أربع سنوات. الرياضيات ثقيلة فعلًا، والبرامج التي تتجاوزها تخرّج طلبة لا يستطيعون التعمق."},

       ar:"الفجوة بين الصورة المثيرة التي يتخيلها الطلبة وواقع قضاء معظم الأسبوع في جودة البيانات. كما أن المجال يتغير بسرعة تجعل الأدوات التي أتقنتها قابلة للاستبدال، فأساس الإحصاء هو ما يحميك."},

{id:"netw", g:"tech", n:{en:"Computer and Network Engineering", ar:"هندسة الحاسوب والشبكات"},
 study:{en:"Where hardware meets software: digital logic, embedded systems, computer architecture, and networking protocols. More electrical engineering than a computer science degree, more programming than an electrical one. Four to five years.",
        ar:"حيث يلتقي العتاد بالبرمجيات: المنطق الرقمي والأنظمة المدمجة ومعمارية الحاسوب وبروتوكولات الشبكات. هندسة كهربائية أكثر من علوم الحاسوب، وبرمجة أكثر من الهندسة الكهربائية. أربع إلى خمس سنوات."},
 day:{en:"Designing and maintaining the infrastructure everything else runs on: networks, data centres, smart devices, cloud systems. Often on site rather than at a desk, and often the person called when the whole system is down.",
      ar:"تصميم وصيانة البنية التي يعمل عليها كل شيء آخر: الشبكات ومراكز البيانات والأجهزة الذكية والأنظمة السحابية. غالبًا في الموقع لا خلف مكتب، وغالبًا أنت من يُستدعى حين يتوقف النظام بأكمله."},
 hard:{en:"You sit between two disciplines and can end up less specialised than either, so choose a depth early. The on-call element is real, since infrastructure fails at inconvenient hours.",
       ar:"تقف بين تخصصين وقد تنتهي أقل تخصصًا من كليهما، فاختر عمقًا مبكرًا. وعنصر الاستدعاء حقيقي، لأن البنية التحتية تتعطل في أوقات غير مناسبة."},

{id:"mech", g:"eng", n:{en:"Mechanical Engineering", ar:"الهندسة الميكانيكية"},
 study:{en:"Thermodynamics, fluid mechanics, materials, dynamics and machine design, with heavy mathematics throughout and design projects that have to actually work. Four to five years.",
        ar:"الديناميكا الحرارية وميكانيكا الموائع والمواد والديناميكا وتصميم الآلات، مع رياضيات مكثفة طوال البرنامج ومشاريع تصميم يجب أن تعمل فعلًا. أربع إلى خمس سنوات."},
 day:{en:"Depends heavily on sector. In oil, gas and manufacturing it means plant visits, equipment problems and maintenance planning. In design roles it means CAD, simulation and testing. Site-based work involves heat, safety gear and early starts.",
      ar:"يختلف كثيرًا حسب القطاع. في النفط والغاز والتصنيع يعني زيارات المصانع ومشاكل المعدات وتخطيط الصيانة. وفي أدوار التصميم يعني برامج التصميم والمحاكاة والاختبار. والعمل الميداني يعني حرارة ومعدات سلامة وبدايات مبكرة."},
 hard:{en:"The mathematics load in years one and two removes a lot of students. Also, the glamorous design jobs are a small minority; most mechanical engineers work in operations and maintenance, which is a different daily life.",
       ar:"حِمل الرياضيات في السنتين الأولى والثانية يُخرج كثيرًا من الطلبة. كما أن وظائف التصميم اللامعة أقلية صغيرة؛ فمعظم المهندسين الميكانيكيين يعملون في التشغيل والصيانة، وهي حياة يومية مختلفة."},
 subj:{en:["Mathematics","Physics","Design and technology"], ar:["الرياضيات","الفيزياء","التصميم والتقنية"]},

{id:"elec", g:"eng", n:{en:"Electrical Engineering", ar:"الهندسة الكهربائية"},
 study:{en:"Circuits, electromagnetics, signals, power systems and control. Among the most mathematically abstract of the engineering degrees, because much of what you work with cannot be seen. Four to five years.",
        ar:"الدوائر والكهرومغناطيسية والإشارات وأنظمة القدرة والتحكم. من أكثر التخصصات الهندسية تجريدًا رياضيًا، لأن كثيرًا مما تعمل عليه لا يُرى. أربع إلى خمس سنوات."},
 day:{en:"Power engineers work on grids, substations and increasingly on solar and battery projects. Electronics engineers design and test circuits. Control engineers automate industrial processes. Expect a mix of office design work and site commissioning.",
      ar:"مهندسو القدرة يعملون على الشبكات والمحطات وبشكل متزايد على مشاريع الطاقة الشمسية والبطاريات. ومهندسو الإلكترونيات يصممون الدوائر ويختبرونها. ومهندسو التحكم يؤتمتون العمليات الصناعية. توقع مزيجًا من التصميم المكتبي والتشغيل الميداني."},
 hard:{en:"The abstraction. Students who need to see and touch what they are building often prefer mechanical or civil. Those who enjoy the invisible mathematics find it deeply satisfying.",
       ar:"التجريد. الطلبة الذين يحتاجون إلى رؤية ما يبنونه ولمسه يفضلون غالبًا الميكانيكية أو المدنية. أما من يستمتع بالرياضيات غير المرئية فيجده مرضيًا جدًا."},
 subj:{en:["Mathematics","Physics"], ar:["الرياضيات","الفيزياء"]},

    qa:["Qatar University","Texas A&M at Qatar","Hamad Bin Khalifa University"],

{id:"civil", g:"eng", n:{en:"Civil Engineering", ar:"الهندسة المدنية"},
 study:{en:"Structures, geotechnics, materials, water, transport and construction management. You learn why buildings stand up and what makes them fall down, with design projects and site visits throughout. Four to five years.",
        ar:"الإنشاءات وميكانيكا التربة والمواد والمياه والنقل وإدارة التشييد. تتعلم لماذا تقف المباني وما الذي يُسقطها، مع مشاريع تصميم وزيارات ميدانية طوال البرنامج. أربع إلى خمس سنوات."},
 day:{en:"Either site-based, walking projects in the heat and coordinating contractors, or office-based doing design and analysis. Gulf construction runs on tight deadlines, so the pace is real, and a great deal of the job is documentation and coordination rather than calculation.",
      ar:"إما ميداني: تتجول في المشروع تحت الحر وتنسق مع المقاولين، أو مكتبي: تصميم وتحليل. والإنشاءات في الخليج تسير بمواعيد ضاغطة، فالوتيرة حقيقية، وجزء كبير من العمل توثيق وتنسيق لا حسابات."},
 hard:{en:"The heat and the hours on site, and the fact that responsibility arrives young: your signature can carry legal weight. The work is also cyclical, rising and falling with construction spending.",
       ar:"الحر وساعات الموقع، وحقيقة أن المسؤولية تأتي مبكرًا: توقيعك قد يحمل وزنًا قانونيًا. كما أن العمل دوري يرتفع وينخفض مع الإنفاق على الإنشاءات."},
 subj:{en:["Mathematics","Physics","Geography or geology helps"], ar:["الرياضيات","الفيزياء","الجغرافيا أو الجيولوجيا مفيدة"]},

{id:"chem", g:"eng", n:{en:"Chemical and Process Engineering", ar:"الهندسة الكيميائية وهندسة العمليات"},
 study:{en:"Chemistry scaled up to industrial size: reaction engineering, heat and mass transfer, separation processes, plant design and safety. Mathematically the heaviest of the engineering degrees in many programs. Four to five years.",
        ar:"كيمياء بحجم صناعي: هندسة التفاعلات وانتقال الحرارة والكتلة وعمليات الفصل وتصميم المصانع والسلامة. من أثقل التخصصات الهندسية رياضيًا في كثير من البرامج. أربع إلى خمس سنوات."},
 day:{en:"In a refinery, petrochemical plant or LNG facility: monitoring process performance, troubleshooting when output drifts, planning shutdowns, and taking safety extremely seriously. Often shift work or remote industrial sites.",
      ar:"في مصفاة أو مصنع بتروكيماويات أو منشأة غاز مسال: مراقبة أداء العمليات، ومعالجة الانحرافات، وتخطيط فترات الإيقاف، والتعامل مع السلامة بجدية بالغة. غالبًا عمل بالمناوبات أو في مواقع صناعية نائية."},
 hard:{en:"The workload, and the locations: the best paid roles are often in industrial cities away from home. Safety culture also means a level of procedural discipline that some find restrictive.",
       ar:"عبء الدراسة، والمواقع: أعلى الوظائف أجرًا غالبًا في مدن صناعية بعيدة عن البيت. كما تعني ثقافة السلامة انضباطًا إجرائيًا يجده البعض مقيدًا."},
 subj:{en:["Chemistry","Mathematics","Physics"], ar:["الكيمياء","الرياضيات","الفيزياء"]},

{id:"indus", g:"eng", n:{en:"Industrial Engineering", ar:"الهندسة الصناعية"},
 study:{en:"Optimisation, operations research, quality systems, supply chains and human factors. Less physics than other engineering branches and more statistics and management, applied to making any system run better.",
        ar:"الأمثلة وبحوث العمليات وأنظمة الجودة وسلاسل الإمداد والعوامل البشرية. فيزياء أقل من الفروع الهندسية الأخرى، وإحصاء وإدارة أكثر، تُطبَّق لتحسين أداء أي نظام."},
 day:{en:"Studying how a factory, hospital or airport actually operates, finding the bottleneck, and redesigning the process. You spend a lot of time observing, measuring, and persuading people to change how they work.",
      ar:"دراسة كيف يعمل مصنع أو مستشفى أو مطار فعلًا، وإيجاد نقطة الاختناق، وإعادة تصميم العملية. تقضي وقتًا كبيرًا في الملاحظة والقياس وإقناع الناس بتغيير طريقة عملهم."},
 hard:{en:"It is the least understood engineering degree, so you will explain what you do repeatedly. The technical work is often the easy part; getting an organisation to accept change is the real challenge.",
       ar:"أقل التخصصات الهندسية فهمًا لدى الناس، فستشرح ما تفعله مرارًا. والجانب التقني غالبًا هو الأسهل؛ أما التحدي الحقيقي فهو إقناع المؤسسة بالتغيير."},

{id:"renew", g:"eng", n:{en:"Renewable Energy and Environmental Engineering", ar:"هندسة الطاقة المتجددة والبيئة"},

        ar:"أنظمة الطاقة، وتقنيات الشمس والرياح، ومعالجة المياه، وجودة الهواء، وتقييم الاستدامة، على أساس هندسي معتاد من الرياضيات والديناميكا الحرارية. أربع إلى خمس سنوات."},

{id:"arch", g:"eng", n:{en:"Architecture and Interior Design", ar:"العمارة والتصميم الداخلي"},
 study:{en:"Design studio is the heart of it, plus structures, environmental systems, history and building regulation. Five years for a professional degree in most places, and studio culture means late nights and public critique of your work.",
        ar:"مرسم التصميم هو القلب، إضافة إلى الإنشاءات والأنظمة البيئية والتاريخ وأنظمة البناء. خمس سنوات لدرجة مهنية في معظم الدول، وثقافة المرسم تعني سهرًا ونقدًا علنيًا لعملك."},
 day:{en:"Drawing, modelling and revising, then defending choices to clients who change their minds. Much of professional practice is regulation, coordination with engineers and construction documents rather than the creative vision students imagine.",
      ar:"رسم ونمذجة وتعديل، ثم الدفاع عن خياراتك أمام عملاء يغيرون رأيهم. ومعظم الممارسة المهنية أنظمة وتنسيق مع المهندسين ووثائق تنفيذ، لا الرؤية الإبداعية التي يتخيلها الطلبة."},

{id:"fintech", g:"biz", n:{en:"Financial Technology", ar:"التقنية المالية"},
 study:{en:"A hybrid: finance fundamentals plus programming, data analysis, blockchain and digital payments, with regulation running through it. Four years. Quality varies, so check how much real coding the program contains.",
        ar:"تخصص هجين: أساسيات التمويل مع البرمجة وتحليل البيانات والبلوك تشين والمدفوعات الرقمية، مع التنظيم في خلفية كل شيء. أربع سنوات. والجودة متفاوتة، فتحقق من حجم البرمجة الفعلي في البرنامج."},
 day:{en:"Product work at a bank or a startup: designing how a payment or lending flow should behave, working between engineers and compliance officers, and analysing whether it is actually working once launched.",
      ar:"عمل على المنتجات في بنك أو شركة ناشئة: تصميم كيفية عمل تدفق الدفع أو الإقراض، والوساطة بين المهندسين ومسؤولي الامتثال، وتحليل ما إذا كان يعمل فعلًا بعد الإطلاق."},
 hard:{en:"Being half-technical is a risk: you can end up neither a strong engineer nor a strong financier. The students who do best pick one side to be genuinely good at and use the other as an advantage.",
       ar:"أن تكون نصف تقني مخاطرة: قد تنتهي لا مهندسًا قويًا ولا ماليًا قويًا. والأنجح هم من يختارون جانبًا يتقنونه فعلًا ويستخدمون الآخر كميزة."},
 subj:{en:["Mathematics","Computing","Economics"], ar:["الرياضيات","الحاسوب","الاقتصاد"]},
 u:{bh:["Gulf University","Bahrain Polytechnic (BSc Financial Technology)"],
    sa:["Princess Nourah University (BSc Financial Technology)"],
    ae:["Abu Dhabi University (Finance and Fintech)"],
    qa:["University of Doha for Science and Technology (Banking and Financial Technology)"],
    kw:[], om:[]}},

{id:"math", g:"biz", n:{en:"Mathematics, Statistics and Actuarial Science", ar:"الرياضيات والإحصاء والعلوم الاكتوارية"},
 study:{en:"Pure and applied mathematics, probability, statistical modelling and, in actuarial programs, the specific mathematics of insurance and pensions. Four years, plus a long series of professional actuarial exams afterwards if you take that route.",
        ar:"الرياضيات البحتة والتطبيقية والاحتمالات والنمذجة الإحصائية، وفي البرامج الاكتوارية: رياضيات التأمين والمعاشات تحديدًا. أربع سنوات، يليها سلسلة طويلة من الامتحانات الاكتوارية المهنية إن سلكت هذا الطريق."},
 day:{en:"Actuaries price risk and reserves for insurers, working in spreadsheets and modelling software and explaining results to boards. Statisticians work across health, government and business. Both jobs are analytical, office-based and quietly influential.",
      ar:"الاكتواريون يسعّرون المخاطر والاحتياطيات لشركات التأمين، ويعملون بالجداول وبرامج النمذجة ويشرحون النتائج للمجالس. والإحصائيون يعملون في الصحة والحكومة والأعمال. كلا العملين تحليلي ومكتبي وذو تأثير هادئ."},
 hard:{en:"The actuarial exams are famously difficult and take years alongside full-time work, with high failure rates. Pure mathematics graduates who do not add a practical skill can also struggle to translate the degree into a first job.",
       ar:"الامتحانات الاكتوارية صعبة بشهرة وتستغرق سنوات مع العمل بدوام كامل، ونسب الرسوب فيها مرتفعة. كما أن خريجي الرياضيات البحتة الذين لا يضيفون مهارة تطبيقية قد يجدون صعوبة في ترجمة الشهادة إلى وظيفة أولى."},
 subj:{en:["Mathematics","Further mathematics","Statistics"], ar:["الرياضيات","الرياضيات المتقدمة","الإحصاء"]},
 u:{bh:["University of Bahrain (including Actuarial Science, the only one in Bahrain)"],
    sa:["KFUPM (Actuarial Science and Financial Mathematics)","Prince Sultan University (Actuarial Science)","Qassim University (Actuarial Mathematics)"],
    ae:["American University of Sharjah","Khalifa University","Heriot-Watt Dubai (Actuarial Data Science)"],
    qa:["Qatar University"],
    kw:["Kuwait University (including Financial Mathematics)"],
    om:["Sultan Qaboos University","University of Nizwa","Dhofar University","MCBS","A'Sharqiyah University"]}},

{id:"bus", g:"biz", n:{en:"Business Management", ar:"إدارة الأعمال"},
 study:{en:"A broad survey: accounting, marketing, operations, strategy, human resources and economics, usually with a specialisation in the final years. Four years, and the most popular degree in the Gulf by a wide margin.",
        ar:"مسح واسع: محاسبة وتسويق وعمليات واستراتيجية وموارد بشرية واقتصاد، مع تخصص في السنوات الأخيرة عادة. أربع سنوات، وهي الأكثر شيوعًا في الخليج بفارق كبير."},
 day:{en:"Enormously varied, which is both the appeal and the problem. Management trainees rotate through functions; specialists go deep into one. Most days involve coordinating people, tracking numbers, and writing things that persuade.",
      ar:"متنوع للغاية، وهذا سبب جاذبيته ومشكلته معًا. المتدربون الإداريون يتنقلون بين الوظائف، والمتخصصون يتعمقون في واحدة. ومعظم الأيام تنسيق للناس ومتابعة للأرقام وكتابة تقنع."},
 hard:{en:"This is the honest one: business is the most oversupplied degree in the region, and a general business graduate with no specialisation competes with thousands. Choose a concrete specialisation, add a technical or analytical skill, and get internships early.",
       ar:"هذه هي النقطة الصادقة: إدارة الأعمال أكثر التخصصات وفرة في المنطقة، وخريج الإدارة العامة بلا تخصص ينافس الآلاف. اختر تخصصًا محددًا، وأضف مهارة تقنية أو تحليلية، واحصل على تدريب عملي مبكرًا."},
 subj:{en:["Business studies","Economics","Mathematics"], ar:["إدارة الأعمال","الاقتصاد","الرياضيات"]},

    sa:["Prince Sultan University","Alfaisal University","Effat University","Prince Mohammad Bin Fahd University","Dar Al-Hekma University","King Saud University","King Abdulaziz University"],

{id:"mkt", g:"biz", n:{en:"Marketing and Digital Marketing", ar:"التسويق والتسويق الرقمي"},
 study:{en:"Consumer behaviour, branding, market research, advertising and, increasingly, analytics and paid digital channels. Four years. The best programs are heavy on data; the weakest are mostly theory and slogans.",
        ar:"سلوك المستهلك والعلامة التجارية وبحوث السوق والإعلان، وبشكل متزايد التحليلات والقنوات الرقمية المدفوعة. أربع سنوات. وأفضل البرامج مكثفة في البيانات، وأضعفها نظرية وشعارات."},
 day:{en:"Planning campaigns, writing and approving content, watching performance dashboards daily, and arguing for budget. Deadlines are constant and public, since everything you make is seen. Results are measurable, which cuts both ways.",
      ar:"تخطيط الحملات، وكتابة المحتوى واعتماده، ومتابعة لوحات الأداء يوميًا، والدفاع عن الميزانية. المواعيد مستمرة وعلنية، لأن كل ما تصنعه يُرى. والنتائج قابلة للقياس، وهذا سلاح ذو حدين."},
 hard:{en:"Basic content and copywriting roles are being automated fast, while analytical and performance marketing roles are growing. If you take this degree, become genuinely good with data and paid media rather than only with ideas.",
       ar:"وظائف المحتوى والكتابة الأساسية تُؤتمت بسرعة، بينما تنمو وظائف التسويق التحليلي والأدائي. فإن اخترت هذا التخصص، أتقن البيانات والإعلانات المدفوعة فعلًا لا الأفكار وحدها."},
 subj:{en:["Business studies","Psychology","Statistics"], ar:["إدارة الأعمال","علم النفس","الإحصاء"]},
 u:{bh:["University of Bahrain","Bahrain Polytechnic","American University of Bahrain","Ahlia University","Gulf University"],
    sa:["Prince Sultan University","Alfaisal University","Effat University","Dar Al-Hekma University"],
    ae:["University of Wollongong Dubai","RIT Dubai","Zayed University","Abu Dhabi University"],
    qa:["Qatar University","University of Doha for Science and Technology"],
    kw:["Kuwait University","GUST","American University of Kuwait","AUM","Australian University Kuwait"],
    om:["Sultan Qaboos University","UTAS","University of Nizwa","Dhofar University","Sohar University","Middle East College","Muscat University"]}},

{id:"logi", g:"biz", n:{en:"Logistics and Supply Chain Management", ar:"اللوجستيات وإدارة سلاسل الإمداد"},
 study:{en:"Procurement, inventory, transport, warehousing, customs and increasingly data analysis and optimisation. Four years, often with port, airport or warehouse placements that make the subject concrete.",
        ar:"المشتريات والمخزون والنقل والتخزين والجمارك، وبشكل متزايد تحليل البيانات والأمثلة. أربع سنوات، غالبًا مع تدريب في الموانئ أو المطارات أو المستودعات يجعل المادة ملموسة."},
 day:{en:"Solving problems that have already happened: a delayed shipment, a customs hold, a supplier who cannot deliver. Fast paced, phone-heavy, and deeply practical. When it goes well nobody notices, which is the nature of the field.",
      ar:"حل مشكلات وقعت فعلًا: شحنة متأخرة، أو احتجاز جمركي، أو مورّد لا يستطيع التسليم. عمل سريع الإيقاع وكثير الاتصالات وعملي جدًا. وحين يسير الأمر جيدًا لا يلاحظه أحد، وتلك طبيعة المجال."},
 hard:{en:"The stress of constant firefighting, and hours that follow shipping schedules rather than office hours. Note too that routine stock-keeping roles are declining globally while planning and analytics roles grow.",
       ar:"ضغط إطفاء الحرائق المستمر، وساعات تتبع جداول الشحن لا دوام المكتب. ولاحظ أيضًا أن وظائف مسك المخزون الروتينية تتراجع عالميًا بينما تنمو وظائف التخطيط والتحليل."},
 subj:{en:["Mathematics","Business studies","Geography"], ar:["الرياضيات","إدارة الأعمال","الجغرافيا"]},
 u:{bh:["Bahrain Polytechnic (International Logistics and Supply Chain Management)"],
    sa:["Effat University (Operations and Supply Chain Management)"],
    ae:["Higher Colleges of Technology (Logistics Engineering Technology)","Emirates Aviation University"],
    qa:["University of Doha for Science and Technology"],
    kw:["Kuwait University (Operations and Supply Chain Management)"],
    om:["GUtech","NUST","Muscat University","Dhofar University","Middle East College","MCBS","A'Sharqiyah University","UTAS"]}},

{id:"avia", g:"biz", n:{en:"Aviation and Airport Management", ar:"إدارة الطيران والمطارات"},
 study:{en:"Two distinct routes. Aviation management covers airline and airport operations, safety, regulation and economics as a business degree. Piloting and aircraft maintenance are licence-based training, often outside the university system, and are expensive.",
        ar:"مساران مختلفان. إدارة الطيران تغطي عمليات شركات الطيران والمطارات والسلامة والتنظيم والاقتصاد كدرجة في الأعمال. أما قيادة الطائرات وصيانتها فتدريب قائم على الرخص، غالبًا خارج النظام الجامعي، ومكلف."},
 day:{en:"In airport or airline operations: shift-based coordination of turnarounds, delays, crew and ground handling, where a small problem cascades quickly. In safety and regulation: audits, documentation and investigation.",
      ar:"في عمليات المطار أو شركة الطيران: تنسيق بالمناوبات لمواعيد الإقلاع والتأخيرات والطواقم والخدمة الأرضية، حيث تتسع المشكلة الصغيرة بسرعة. وفي السلامة والتنظيم: تدقيق وتوثيق وتحقيق."},
 hard:{en:"Understand the difference before you commit: a pilot licence is training, not a degree, and the cost is high with no guarantee of an airline place. Aviation management is a normal degree with normal graduate competition.",
       ar:"افهم الفرق قبل أن تلتزم: رخصة الطيران تدريب لا شهادة جامعية، وكلفتها عالية دون ضمان مقعد في شركة طيران. أما إدارة الطيران فدرجة جامعية عادية بمنافسة عادية."},
 subj:{en:["Physics","Mathematics","English"], ar:["الفيزياء","الرياضيات","اللغة الإنجليزية"]},
 u:{bh:[], sa:["Prince Sultan University (Aviation Management)"],
    ae:["Emirates Aviation University","Abu Dhabi University","Higher Colleges of Technology","Khalifa University (Aerospace Engineering)"],
    qa:["University of Doha for Science and Technology","Qatar Aeronautical Academy (licence-level, not a degree)"],
    kw:["Australian University Kuwait"],
    om:["MCBS (Aviation and Airport Management)"]}},

{id:"law", g:"soc", n:{en:"Law", ar:"القانون"},
 study:{en:"Reading, and a great deal of it: constitutional, civil, commercial and criminal law, plus Sharia components in most Gulf programs. Four to five years, followed by a training or bar requirement before you can practise.",
        ar:"قراءة، وكثير منها: القانون الدستوري والمدني والتجاري والجنائي، مع مكونات شرعية في معظم برامج الخليج. أربع إلى خمس سنوات، يليها تدريب أو شرط نقابي قبل أن تمارس."},
 day:{en:"Far less courtroom drama than television suggests. Most lawyers draft and review contracts, research precedent, advise on regulation and negotiate. Corporate and compliance work dominates hiring in the Gulf right now.",
      ar:"دراما المحاكم أقل بكثير مما يوحي التلفزيون. معظم المحامين يصوغون العقود ويراجعونها، ويبحثون في السوابق، ويستشيرون في التنظيم، ويتفاوضون. والعمل المؤسسي والامتثال يهيمن على التوظيف في الخليج حاليًا."},
 hard:{en:"The reading volume, and the fact that in several Gulf countries practising as an advocate is restricted to nationals, so check the rules for your citizenship before choosing. Routine legal-support roles are also exposed to automation, while regulatory and compliance work is growing.",
       ar:"حجم القراءة، وحقيقة أن الترافع في عدة دول خليجية مقصور على المواطنين، فتحقق من الأنظمة الخاصة بجنسيتك قبل الاختيار. كما أن وظائف الدعم القانوني الروتينية معرضة للأتمتة، بينما ينمو العمل التنظيمي والامتثال."},
 subj:{en:["Arabic and English","History","Debate"], ar:["العربية والإنجليزية","التاريخ","المناظرة"]},
 u:{bh:["University of Bahrain","Applied Science University","Gulf University"],
    sa:["Prince Sultan University","Alfaisal University","Dar Al-Hekma University","Prince Mohammad Bin Fahd University","King Saud University"],
    ae:["University of Sharjah","Ajman University","Abu Dhabi University","Middlesex Dubai"],
    qa:["Qatar University","Lusail University"],
    kw:["Kuwait University","Kuwait International Law School"],
    om:["Sultan Qaboos University","Dhofar University","Sohar University","A'Sharqiyah University"]}},

{id:"media", g:"soc", n:{en:"Media and Mass Communication", ar:"الإعلام والاتصال الجماهيري"},
 study:{en:"Writing and reporting, media law and ethics, production skills, public relations and increasingly digital and social platforms. Four years, and the strongest programs push you to produce constantly rather than only study theory.",
        ar:"الكتابة والتحرير، وقانون الإعلام وأخلاقياته، ومهارات الإنتاج، والعلاقات العامة، وبشكل متزايد المنصات الرقمية والاجتماعية. أربع سنوات، وأقوى البرامج تدفعك للإنتاج باستمرار لا لدراسة النظرية فقط."},
 day:{en:"Deadline-driven: producing content, pitching stories, managing an organisation's public voice, or handling a reputational problem in real time. Portfolio matters more than transcript in almost every hiring decision.",
      ar:"محكوم بالمواعيد: إنتاج المحتوى، وعرض القصص، وإدارة الصوت العام لمؤسسة، أو معالجة أزمة سمعة في وقتها. وملف أعمالك يهم أكثر من كشف درجاتك في معظم قرارات التوظيف."},
 hard:{en:"Entry pay is low and competition is high, and generative AI is squeezing basic content production. The graduates who do well specialise early in something scarce: video production, data journalism, crisis communication or Arabic-English bilingual work.",
       ar:"الأجر المبتدئ منخفض والمنافسة شديدة، والذكاء الاصطناعي التوليدي يضغط على إنتاج المحتوى الأساسي. والناجحون يتخصصون مبكرًا في شيء نادر: إنتاج الفيديو، أو صحافة البيانات، أو اتصال الأزمات، أو العمل بالعربية والإنجليزية معًا."},
 subj:{en:["Arabic and English","Media studies","Anything you can build a portfolio in"], ar:["العربية والإنجليزية","الإعلام","أي مجال تبني فيه ملف أعمال"]},
 u:{bh:["University of Bahrain","Gulf University","Bahrain Polytechnic"],
    sa:["Effat University (Digital Media and Communication)","King Abdulaziz University"],
    ae:["American University of Sharjah","American University in Dubai","University of Wollongong Dubai","Abu Dhabi University","Ajman University","Zayed University","University of Sharjah","RIT Dubai"],
    qa:["Northwestern University in Qatar","Qatar University","University of Doha for Science and Technology"],
    kw:["Kuwait University","GUST","American University of Kuwait"],
    om:["Sultan Qaboos University","Sohar University","UTAS"]}},

{id:"design", g:"soc", n:{en:"Graphic and Multimedia Design", ar:"التصميم الجرافيكي والوسائط المتعددة"},
 study:{en:"Studio-based: typography, colour, layout, branding, motion and increasingly user interface and experience design. Four years, and your portfolio is the qualification that actually gets you hired.",
        ar:"قائم على المرسم: الطباعة والألوان والتنسيق والهوية والحركة، وبشكل متزايد تصميم الواجهات وتجربة المستخدم. أربع سنوات، وملف أعمالك هو المؤهل الذي يوظفك فعلًا."},
 day:{en:"Client or brief driven: producing options, receiving criticism, revising, and defending decisions to people with strong opinions and no design training. Deadlines are tight and revision cycles are the norm.",
      ar:"مدفوع بالعميل أو بالتكليف: إنتاج خيارات، وتلقي النقد، والتعديل، والدفاع عن القرارات أمام أشخاص لهم آراء قوية بلا خلفية تصميمية. المواعيد ضيقة ودورات التعديل هي القاعدة."},
 hard:{en:"Be aware of this one honestly: global forecasts now list graphic designers among the fastest-declining roles because of generative AI, for the first time. The work that remains strong is user experience and product design, motion and interactive work. Choose that direction deliberately.",
       ar:"كن على علم بهذا بصراحة: التوقعات العالمية باتت تصنف مصممي الجرافيك ضمن أسرع المهن تراجعًا بسبب الذكاء الاصطناعي التوليدي، لأول مرة. والعمل الذي يبقى قويًا هو تصميم تجربة المستخدم والمنتجات والحركة والتفاعلية. فاختر هذا الاتجاه عن قصد."},
 subj:{en:["Art and design","Computing","Anything visual you make now"], ar:["الفنون والتصميم","الحاسوب","أي عمل بصري تصنعه الآن"]},
 u:{bh:["Applied Science University","American University of Bahrain","Bahrain Polytechnic","Ahlia University","University of Bahrain"],
    sa:["Dar Al-Hekma University (Visual Communications)","Effat University","Prince Mohammad Bin Fahd University"],
    ae:["American University in Dubai","Zayed University","Heriot-Watt Dubai","University of Wollongong Dubai","RIT Dubai"],
    qa:["VCUarts Qatar","Qatar University"],
    kw:["American University of Kuwait"],
    om:["UTAS","MCBS","University of Nizwa"]}},

{id:"edu", g:"soc", n:{en:"Education and Teaching", ar:"التربية والتعليم"},
 study:{en:"Your subject specialism plus how people learn: curriculum design, assessment, classroom management and child development, with school placements that start early and increase. Four years, usually leading to a teaching licence.",
        ar:"تخصصك الدراسي مع كيفية تعلم الناس: تصميم المناهج والتقويم وإدارة الصف ونمو الطفل، مع تدريب ميداني يبدأ مبكرًا ويتزايد. أربع سنوات، تؤدي عادة إلى رخصة تدريس."},
 day:{en:"Teaching is the visible part; planning, marking, parent contact and administration fill the rest. You are performing for hours with no privacy, and the emotional demand of thirty young people needing you at once is underestimated.",
      ar:"التدريس هو الجزء الظاهر؛ أما التخطيط والتصحيح والتواصل مع الأهالي والأعمال الإدارية فتملأ البقية. أنت تؤدي لساعات دون خصوصية، والعبء العاطفي لثلاثين طفلًا يحتاجونك في آنٍ واحد يُستهان به."},
 hard:{en:"The workload outside teaching hours, and the gap between the idealism students bring and the reality of behaviour management. Note the strong upside: mathematics, science and computing teachers are in short supply across the Gulf, so specialise in those if you can.",
       ar:"العبء خارج ساعات التدريس، والفجوة بين المثالية التي يحملها الطلبة وواقع إدارة السلوك. ولاحظ الجانب الإيجابي القوي: معلمو الرياضيات والعلوم والحاسوب نادرون في الخليج، فتخصص فيها إن استطعت."},
 subj:{en:["Your future teaching subject","Arabic and English","Psychology"], ar:["مادتك المستقبلية","العربية والإنجليزية","علم النفس"]},
 u:{bh:["University of Bahrain and Bahrain Teachers College"],
    sa:["Most public universities including King Saud, King Abdulaziz, Umm Al-Qura and Qassim"],
    ae:["Higher Colleges of Technology","UAE University","Zayed University"],
    qa:["Qatar University","Lusail University"],
    kw:["Kuwait University","PAAET College of Basic Education"],
    om:["Sultan Qaboos University","UTAS","University of Nizwa","Dhofar University","Sohar University","A'Sharqiyah University"]}},

{id:"tour", g:"soc", n:{en:"Tourism and Hospitality Management", ar:"إدارة السياحة والضيافة"},
 study:{en:"Hotel and event operations, tourism economics, service management and revenue, with substantial industry placements that are often the most valuable part of the degree. Four years.",
        ar:"عمليات الفنادق والفعاليات، واقتصاد السياحة، وإدارة الخدمة والإيرادات، مع تدريب عملي كبير يكون غالبًا أثمن ما في الدرجة. أربع سنوات."},
 day:{en:"Operational and people-facing: shifts including evenings, weekends and holidays, solving guest problems in real time, and managing teams that turn over quickly. Events work is intense in bursts around each event.",
      ar:"تشغيلي ومواجه للناس: مناوبات تشمل الأمسيات والعطل والأعياد، وحل مشكلات الضيوف فورًا، وإدارة فرق سريعة التغير. وعمل الفعاليات مكثف في نوبات حول كل فعالية."},
 hard:{en:"You work when everyone else is celebrating, and entry-level pay is modest relative to the hours. Career progression is real but slow, and the graduate-level roles are fewer than the headline job numbers in tourism strategies suggest.",
       ar:"تعمل حين يحتفل الآخرون، والأجر المبتدئ متواضع مقارنة بالساعات. والتقدم المهني حقيقي لكنه بطيء، والوظائف الجامعية أقل مما توحي به الأرقام الكبيرة في استراتيجيات السياحة."},
 subj:{en:["Languages","Business studies","Geography"], ar:["اللغات","إدارة الأعمال","الجغرافيا"]},
 u:{bh:["University of Bahrain","Vatel Bahrain (International Hotel Management)"],
    sa:["King Khalid University","King Saud University"],
    ae:["Zayed University"],
    qa:[],
    kw:[],
    om:["Oman Tourism College","Sultan Qaboos University","University of Nizwa"]}}
];

/* ===== UI strings, groups and rendering ===== */
const MAJORS = M1.concat(M2, M3);

const CT = {bh:{en:"Bahrain",ar:"البحرين"}, sa:{en:"Saudi Arabia",ar:"السعودية"},
            ae:{en:"UAE",ar:"الإمارات"}, qa:{en:"Qatar",ar:"قطر"},
            kw:{en:"Kuwait",ar:"الكويت"}, om:{en:"Oman",ar:"عُمان"}};
const CT_ORDER = ["bh","sa","ae","qa","kw","om"];

const GROUPS = [
  {id:"all",    en:"All majors",              ar:"كل التخصصات"},
  {id:"health", en:"Health and medicine",     ar:"الصحة والطب"},
  {id:"tech",   en:"Computing and technology",ar:"الحاسوب والتقنية"},
  {id:"eng",    en:"Engineering",             ar:"الهندسة"},
  {id:"biz",    en:"Business and finance",    ar:"الأعمال والمال"},
  {id:"soc",    en:"People, law and creative",ar:"الإنسان والقانون والإبداع"}
];

const UI = {
  en:{
    title:"Explore university majors",
    sub:"Thirty-one majors, explained honestly: what you actually study, what the work is really like day to day, what students find hardest, and which universities in the Gulf offer each one.",
    quizline:"<b>Not sure where to start?</b> Take the free 8-minute assessment and get your top 5 majors, then come back here to read about them.",
    quizbtn:"Take the quiz",
    scholline:"<b>Wondering how to pay for it?</b> The scholarship and funding guide shows what is open to your passport, and what is not.",
    scholbtn:"Scholarships",
    parline:"<b>Are you a parent?</b> There is a separate guide for you on how to talk about this decision, and what the Gulf job market actually rewards now.",
    parbtn:"Parent guide",
    entline:"<b>Can you actually get in?</b> The entry requirements checker shows the published minimums at Gulf universities, and what your school track has already closed.",
    entbtn:"Entry requirements",
    search:"Search a major, a career, or a subject",
    count:(n,t)=> n===t ? `Showing all ${t} majors` : `Showing ${n} of ${t} majors`,
    empty:"No majors match that search. Try a different word, or clear the search box.",
    hStudy:"What you actually study",
    hDay:"What the work is really like",
    hHard:"What students find hardest",
    hSubj:"School subjects that matter most",
    hUni:"Where to study it in the Gulf",
    none:"No undergraduate programme found here. You would need to study abroad or choose a related major.",
    uniNote:"University lists were compiled from institutions' own published programmes and are a starting point, not a complete or guaranteed list. Programmes change, so always confirm directly with the university before applying.",
    disc:"This guide is for exploration and discussion, not a final verdict. Speak to people already working in a field before you commit to it, and check entry requirements with each university.",
    foot:'Prepared by <a href="https://www.saqeralkhalifa.com">Dr. Saqer AlKhalifa</a> · Free for all students',
    toggle:"عربي"
  },
  ar:{
    title:"استكشف التخصصات الجامعية",
    sub:"واحد وثلاثون تخصصًا بشرح صادق: ماذا تدرس فعلًا، وكيف يبدو العمل يوميًا، وما أصعب ما يواجهه الطلبة، وأي جامعات الخليج تقدّم كل تخصص.",
    quizline:"<b>لا تعرف من أين تبدأ؟</b> جرّب الاختبار المجاني في ٨ دقائق واحصل على أفضل ٥ تخصصات لك، ثم عد إلى هنا لتقرأ عنها.",
    quizbtn:"ابدأ الاختبار",
    scholline:"<b>تتساءل كيف تموّل دراستك؟</b> دليل المنح والتمويل يوضح ما هو متاح لجوازك وما ليس متاحًا.",
    scholbtn:"المنح الدراسية",
    parline:"<b>هل أنت ولي أمر؟</b> يوجد دليل منفصل لك عن كيفية الحوار في هذا القرار، وما يكافئه سوق العمل الخليجي فعلًا اليوم.",
    parbtn:"دليل أولياء الأمور",
    entline:"<b>هل يمكنك الالتحاق فعلًا؟</b> أداة شروط القبول تعرض الحدود الدنيا المنشورة في جامعات الخليج، وما أغلقه مسارك المدرسي أصلًا.",
    entbtn:"شروط القبول",
    search:"ابحث عن تخصص أو مهنة أو مادة",
    count:(n,t)=> n===t ? `عرض جميع التخصصات (${t})` : `عرض ${n} من ${t} تخصصًا`,
    empty:"لا توجد تخصصات مطابقة. جرّب كلمة أخرى أو امسح خانة البحث.",
    hStudy:"ماذا تدرس فعلًا",
    hDay:"كيف يبدو العمل حقيقةً",
    hHard:"أصعب ما يواجهه الطلبة",
    hSubj:"أهم المواد المدرسية",
    hUni:"أين تدرسه في الخليج",
    none:"لم نجد برنامج بكالوريوس هنا. ستحتاج إلى الدراسة في الخارج أو اختيار تخصص قريب.",
    uniNote:"قوائم الجامعات جُمعت من البرامج المنشورة على مواقع المؤسسات نفسها، وهي نقطة بداية لا قائمة كاملة أو مضمونة. البرامج تتغير، لذا تأكد دائمًا من الجامعة مباشرة قبل التقديم.",
    disc:"هذا الدليل للاستكشاف والنقاش، لا حكمًا نهائيًا. تحدث مع من يعملون في المجال قبل أن تلتزم به، وتحقق من شروط القبول لدى كل جامعة.",
    foot:'إعداد <a href="https://www.saqeralkhalifa.com">د. صقر آل خليفة</a> · مجاني لجميع الطلبة',
    toggle:"English"
  }
};

let lang = "en", group = "all", query = "";
const $ = id => document.getElementById(id);

function applyChrome(){
  const U = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar"
    ? "استكشف التخصصات الجامعية | د. صقر آل خليفة"
    : "Explore University Majors | Dr. Saqer AlKhalifa";
  $("langToggle").textContent = U.toggle;
  $("t-title").textContent = U.title;
  $("t-sub").textContent = U.sub;
  $("t-quizline").innerHTML = U.quizline;
  $("t-quizbtn").textContent = U.quizbtn;
  $("t-scholline").innerHTML = U.scholline;
  $("t-scholbtn").textContent = U.scholbtn;
  $("t-parline").innerHTML = U.parline;
  $("t-parbtn").textContent = U.parbtn;
  $("t-entline").innerHTML = U.entline;
  $("t-entbtn").textContent = U.entbtn;
  $("search").placeholder = U.search;
  $("t-disc").textContent = U.disc;
  $("t-foot").innerHTML = U.foot;
  $("empty").textContent = U.empty;
  $("filters").innerHTML = GROUPS.map(g =>
    `<button class="fbtn${g.id===group?" on":""}" data-g="${g.id}">${g[lang]}</button>`).join("");
  $("filters").querySelectorAll(".fbtn").forEach(b =>
    b.addEventListener("click", () => { group = b.dataset.g; applyChrome(); render(); }));
}

function matches(m){
  if(group !== "all" && m.g !== group) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  const hay = [m.n.en, m.n.ar, m.study.en, m.study.ar, m.day.en, m.day.ar,
               m.subj.en.join(" "), m.subj.ar.join(" "),
               Object.values(m.u).flat().join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function uniBlock(m, U){
  return `<div class="unis">` + CT_ORDER.map(c => {
    const list = m.u[c] || [];
    const val = list.length ? list.join(" · ") : U.none;
    return `<div class="uni-row${list.length?"":" none"}"><b>${CT[c][lang]}</b><span>${val}</span></div>`;
  }).join("") + `</div><p class="note">${U.uniNote}</p>`;
}

function render(){
  const U = UI[lang];
  const shown = MAJORS.filter(matches);
  $("count").textContent = U.count(shown.length, MAJORS.length);
  $("empty").style.display = shown.length ? "none" : "block";
  const gname = g => (GROUPS.find(x => x.id === g) || {})[lang] || "";
  $("list").innerHTML = shown.map(m => `
    <div class="mcard" id="m-${m.id}">
      <button class="mhead" data-id="${m.id}">
        <h2>${m.n[lang]}<span class="grp">${gname(m.g)}</span></h2>
        <span class="chev">›</span>
      </button>
      <div class="mbody">
        <div class="sec"><h3>${U.hStudy}</h3><p>${m.study[lang]}</p></div>
        <div class="sec"><h3>${U.hDay}</h3><p>${m.day[lang]}</p></div>
        <div class="sec"><h3>${U.hHard}</h3><p>${m.hard[lang]}</p></div>
        <div class="sec"><h3>${U.hSubj}</h3><p>${m.subj[lang].map(s=>`<span class="subj">${s}</span>`).join("")}</p></div>
        <div class="sec"><h3>${U.hUni}</h3>${uniBlock(m, U)}</div>
      </div>
    </div>`).join("");
  $("list").querySelectorAll(".mhead").forEach(b =>
    b.addEventListener("click", () => {
      const card = document.getElementById("m-" + b.dataset.id);
      const opening = !card.classList.contains("open");
      card.classList.toggle("open");
      if(opening && window.goatcounter && window.goatcounter.count){
        try{ window.goatcounter.count({path:"explore-" + b.dataset.id, event:true}); }catch(e){}
      }
    }));
  openFromHash();
}

function openFromHash(){
  const h = (location.hash || "").replace("#", "");
  if(!h) return;
  const card = document.getElementById("m-" + h);
  if(card && !card.classList.contains("open")){
    card.classList.add("open");
    setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60);
  }
}

$("langToggle").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  applyChrome(); render();
});
$("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
window.addEventListener("hashchange", openFromHash);

applyChrome();
render();

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
</body>
