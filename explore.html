<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore University Majors | Dr. Saqer AlKhalifa</title>
<meta name="description" content="A free bilingual guide to 31 university majors for students in Bahrain and the Gulf: what you actually study, what the work is like, what students find hardest, and which GCC universities offer each one.">
<script data-goatcounter="https://majorcompass.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  :root{
    --ink:#101418; --ink-2:#4a5158; --ink-3:#8a9199;
    --paper:#faf9f6; --card:#ffffff; --line:#e6e3dc;
    --accent:#1c5d99; --accent-soft:#e8f0f8; --gold:#b98c2f; --good:#0e7a4d;
    --radius:14px; --shadow:0 1px 3px rgba(16,20,24,.06), 0 8px 24px rgba(16,20,24,.07);
    color-scheme: light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper); color:var(--ink); line-height:1.6; min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, Arial, sans-serif;}
  [dir="rtl"] body{font-family:'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', Arial, sans-serif;}
  .serif{font-family:Georgia, 'Times New Roman', serif;}
  [dir="rtl"] .serif{font-family:'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', Georgia, serif;}
  .wrap{max-width:820px; margin:0 auto; padding:0 20px 80px;}

  header.site{display:flex; align-items:center; justify-content:space-between;
    padding:18px 0 14px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .brand{font-size:.95rem; color:var(--ink-2); text-decoration:none;}
  .brand strong{color:var(--ink); font-weight:600;}
  .lang-toggle{border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:7px 16px; font-size:.95rem; cursor:pointer; color:var(--accent); font-weight:600;
    font-family:inherit; transition:all .15s;}
  .lang-toggle:hover{background:var(--accent-soft);}

  .hero{text-align:center; padding:40px 0 6px;}
  .hero h1{font-size:2.1rem; line-height:1.25; margin-bottom:8px;}
  .hero p{color:var(--ink-2); font-size:1.08rem; max-width:600px; margin:0 auto;}

  .quizbar{background:var(--accent-soft); border:1px solid #cfe0ef; border-radius:var(--radius);
    padding:18px 22px; margin:24px 0 8px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .quizbar p{flex:1 1 260px; font-size:1rem; color:var(--ink-2); margin:0;}
  .quizbar b{color:var(--ink);}
  .btn{display:inline-block; border:none; cursor:pointer; text-decoration:none; text-align:center;
    background:var(--accent); color:#fff; font-size:1rem; font-weight:600; font-family:inherit;
    padding:12px 26px; border-radius:999px; transition:transform .12s, box-shadow .12s;
    box-shadow:0 4px 14px rgba(28,93,153,.28); white-space:nowrap;}
  .btn:hover{transform:translateY(-1px);}

  .tools{position:sticky; top:0; background:var(--paper); padding:16px 0 12px; z-index:5;
    border-bottom:1px solid var(--line); margin-bottom:18px;}
  .search{width:100%; font-family:inherit; font-size:1rem; padding:13px 18px;
    border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink);}
  .search:focus{outline:none; border-color:var(--accent);}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .fbtn{background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 15px; font-size:.9rem; font-family:inherit; color:var(--ink-2); cursor:pointer;}
  .fbtn:hover{border-color:var(--accent);}
  .fbtn.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .count{font-size:.85rem; color:var(--ink-3); margin-top:10px;}

  .mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;}
  .mhead{display:flex; align-items:center; gap:14px; padding:20px 24px; cursor:pointer; width:100%;
    background:none; border:none; text-align:start; font-family:inherit; color:var(--ink);}
  .mhead:hover{background:var(--accent-soft);}
  .mhead h2{font-size:1.2rem; font-weight:700; flex:1;}
  .mhead .grp{font-size:.78rem; color:var(--ink-3); display:block; font-weight:400; margin-top:2px;}
  .chev{color:var(--accent); font-size:1.1rem; flex:0 0 auto; transition:transform .2s;}
  .mcard.open .chev{transform:rotate(90deg);}
  [dir="rtl"] .chev{transform:rotate(180deg);}
  [dir="rtl"] .mcard.open .chev{transform:rotate(90deg);}
  .mbody{display:none; padding:0 24px 22px; border-top:1px solid var(--line);}
  .mcard.open .mbody{display:block;}
  .sec{margin-top:18px;}
  .sec h3{font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
    font-weight:800; margin-bottom:6px;}
  .sec p{color:var(--ink-2); font-size:1rem;}
  [dir="rtl"] .sec h3{letter-spacing:0; text-transform:none; font-size:.95rem;}
  .subj{display:inline-block; background:var(--accent-soft); color:var(--accent);
    border-radius:999px; padding:3px 12px; font-size:.85rem; font-weight:600; margin:4px 4px 0 0;}
  [dir="rtl"] .subj{margin:4px 0 0 4px;}
  .unis{margin-top:6px;}
  .uni-row{display:grid; grid-template-columns:120px 1fr; gap:10px; padding:7px 0;
    border-bottom:1px dashed var(--line); font-size:.95rem;}
  .uni-row:last-child{border-bottom:none;}
  .uni-row b{color:var(--ink); font-weight:600;}
  .uni-row span{color:var(--ink-2);}
  .uni-row.none span{color:#a3574d;}
  .note{font-size:.84rem; color:var(--ink-3); margin-top:12px; line-height:1.5;}
  .empty{text-align:center; color:var(--ink-3); padding:40px 0;}

  footer.site{margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
    text-align:center; font-size:.85rem; color:var(--ink-3);}
  footer.site a{color:var(--accent); text-decoration:none;}
  .disc{font-size:.84rem; color:var(--ink-3); max-width:640px; margin:0 auto 14px; line-height:1.55;}

  @media (max-width:560px){
    .hero h1{font-size:1.65rem;}
    .mhead{padding:16px 18px;} .mbody{padding:0 18px 18px;}
    .uni-row{grid-template-columns:1fr; gap:2px;}
  }
  @media print{ .tools, .quizbar, .lang-toggle{display:none;} .mbody{display:block!important;} }

/* ============================================================
   Major Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:Newsreader, Georgia, 'Times New Roman', serif;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-ar:'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Segoe UI', Tahoma, Arial, sans-serif;

  --paper:#f6f3ec;
  --paper-2:#efece4;
  --card:#fbf9f4;
  --line:#ddd7cb;
  --line-2:#cfc9bd;

  --ink:#14161a;
  --ink-2:#33363c;
  --ink-3:#6b6e74;

  --navy:#14161a;
  --navy-deep:#8a5a1e;
  --accent:#8a5a1e;
  --accent-soft:#efece4;
  --accent-line:#cfc9bd;

  --gold:#8a5a1e;
  --gold-soft:#f0ebdf;
  --gold-line:#ddd7cb;
  --gold-bright:#d8b98a;

  --good:#3f6b4f;  --good-soft:#eaefe9;  --good-line:#cfdbd0;
  --warn:#8a5a1e;  --warn-soft:#f0ebdf;  --warn-line:#e2d9c6;
  --bad:#8c3a30;   --bad-soft:#f4e9e5;   --bad-line:#e2cfc8;

  --radius:0; --radius-sm:0;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

/* ---------- the shared dark nav ---------- */
.mc-nav{
  background:var(--ink); color:var(--paper);
  position:sticky; top:0; z-index:40;
}
.mc-nav-inner{
  max-width:880px; margin:0 auto; padding:13px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
}
.mc-brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--paper); min-width:0;}
.mc-brand b{font-family:var(--font-display); font-size:17px; font-weight:400; letter-spacing:-.01em; white-space:nowrap;}
[dir="rtl"] .mc-brand b{font-family:var(--font-ar); font-weight:600; letter-spacing:0;}
.mc-brand span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9a9da3; white-space:nowrap;}
[dir="rtl"] .mc-brand span{letter-spacing:0; text-transform:none; font-size:12px;}
.mc-nav-links{
  display:flex; gap:20px; font-size:12px; letter-spacing:.06em; align-items:center;
  overflow-x:auto; scrollbar-width:none; flex:1 1 auto; justify-content:center;
}
.mc-nav-links::-webkit-scrollbar{display:none;}
[dir="rtl"] .mc-nav-links{letter-spacing:0; font-size:13px;}
.mc-nav-links a{
  color:#c9ccd2; text-decoration:none; white-space:nowrap; padding-bottom:2px;
  border-bottom:1px solid transparent; transition:color .15s, border-color .15s;
}
.mc-nav-links a:hover{color:var(--paper);}
.mc-nav-links a[aria-current="page"]{color:var(--paper); border-bottom-color:var(--accent);}
.mc-nav .lang-toggle{
  flex:0 0 auto; border:1px solid #3a3d43; background:transparent; border-radius:999px;
  padding:6px 15px; font-size:12px; letter-spacing:.08em; font-weight:500;
  color:#c9ccd2; cursor:pointer; font-family:var(--font-body);
  transition:background .15s, color .15s, border-color .15s;
}
.mc-nav .lang-toggle:hover{background:var(--paper); color:var(--ink); border-color:var(--paper);}
@media (max-width:640px){
  .mc-nav-inner{padding:11px 18px; gap:10px;}
  .mc-nav-links{justify-content:flex-start; order:3; width:100%; gap:16px; padding-bottom:2px;}
}
@media print{ .mc-nav{display:none;} }

/* the old in-page masthead and pill switcher are replaced by .mc-nav */
header.site, nav.toolnav{display:none !important;}

/* ---------- page header ---------- */
.hero, .res-head{position:relative;}
.hero::before{display:none !important;}
.hero{padding-top:52px;}
.hero h1{font-size:clamp(34px, 5.4vw, 52px); line-height:1.04; font-weight:400;}
[dir="rtl"] .hero h1{line-height:1.35; font-weight:600;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker, .eyebrow{
  color:var(--accent); font-weight:600; font-size:11px;
  letter-spacing:.18em; text-transform:uppercase;
}
[dir="rtl"] .kicker, [dir="rtl"] .eyebrow{letter-spacing:0; text-transform:none; font-size:13px;}

/* ---------- surfaces: square, flat, ruled ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox,
.m, .fact, .pt, .bar, .quizbar, .cta-inline, .rule, .checked, .hedge, .extra, .flag,
.note, .card, .grp{
  border-radius:0 !important;
  box-shadow:none !important;
}
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .stat, .nextbox, .m, .fact{
  background:var(--card); border:1px solid var(--line-2);
}
.mcard:hover, .pcard:hover, .m:hover{border-color:var(--ink-3);}
.pcard{border-inline-start-width:2px; border-inline-start-color:var(--accent);}
.lede{background:var(--card); border:1px solid var(--line-2);
  border-inline-start:2px solid var(--accent) !important; border-inline-end:1px solid var(--line-2) !important;}

/* ---------- buttons ---------- */
.btn{
  background:var(--ink); border:1px solid var(--ink); border-radius:0;
  font-weight:500; letter-spacing:0; color:var(--paper); box-shadow:none;
  transition:background .15s, border-color .15s, color .15s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff; transform:none; filter:none; box-shadow:none;}
.btn.ghost, .btn.secondary{
  background:transparent; color:var(--ink); border:1px solid var(--ink); box-shadow:none;
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.printbtn{border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);}
.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

/* filter chips and pickers: square, ruled */
.fbtn, .chip, .navbtn, .picker button, .filters button{
  border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);
  box-shadow:none; transition:background .15s, color .15s, border-color .15s;
}
.fbtn:hover, .chip:hover, .navbtn:hover{border-color:var(--ink); color:var(--ink); background:transparent; transform:none;}
.fbtn.on, .chip.on, .navbtn.on{
  background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500; box-shadow:none;
}
input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);
}
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{
  background:var(--paper-2); border:1px solid var(--line); border-radius:0;
}
.rule, .checked, .hedge, .extra, .flag{border-radius:0;}
.rule.w, .checked, .hedge, .extra, .flag{background:var(--warn-soft); border-color:var(--warn-line);}
.rule.b{background:var(--bad-soft); border-color:var(--bad-line);}
.rule.n{background:var(--paper-2); border-color:var(--line);}
.row.act{background:var(--paper-2) !important; border-color:var(--line) !important;}

/* ---------- band chips and verdict pills keep meaning, lose gloss ---------- */
.band{border-radius:0; font-weight:600;}

/* ---------- section labels ---------- */
.sec h3, .lbl, .toc h2, .row h4{
  letter-spacing:.14em; font-weight:600; text-transform:uppercase; font-size:11px; color:var(--ink-3);
}
[dir="rtl"] .sec h3, [dir="rtl"] .lbl, [dir="rtl"] .toc h2, [dir="rtl"] .row h4{
  letter-spacing:0; text-transform:none; font-size:13px;
}

/* ---------- tables ---------- */
table{border-collapse:collapse;}
th{
  text-align:start; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--ink);
}
[dir="rtl"] th{letter-spacing:0; text-transform:none; font-size:13px;}
td{padding:14px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; font-size:14px;}

/* ---------- footer ---------- */
footer.site{
  margin-top:56px; padding:26px 0 0; border-top:1px solid var(--line); color:var(--ink-3); font-size:13px;
}
footer.site a{color:var(--accent); font-weight:500;}

@media (max-width:520px){
  .hero h1{font-size:clamp(28px, 8vw, 36px);}
}

/* ---- 2A refinements ---- */
input, button, select, textarea{border-radius:0;}
.lang-toggle, .mc-nav .lang-toggle{border-radius:999px;}
.pt{border-inline-start-width:2px !important;}
.compass{display:none !important;}
.emoji{display:none !important;}
.mcard, .m, .panel, .qcard, .fact, .stat, .srcbox, .toc, .nextbox, .viz-root{border-color:var(--line-2);}
.opt{border-radius:0 !important;}
.opt.selected{background:var(--paper-2); border-color:var(--ink);}
.band{border-radius:0 !important;}
.crosslinks .bar, .bar{border-radius:0 !important;}
hr{border:0; border-top:1px solid var(--line);}

/* ---- 2A: square the remaining pills, protect quiz progress ---- */
.section-chip, .progress-bar, .progress-fill, .bar-fill, .chip, .meta-chips .chip,
.tag, .pill, .badge, .cta, .startbtn{border-radius:0 !important;}
.section-chip{background:var(--paper-2); color:var(--accent); border:1px solid var(--line);
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; padding:5px 12px;}
[dir="rtl"] .section-chip{letter-spacing:0; text-transform:none; font-size:13px;}
body:has(#screen-quiz.active) .mc-nav-links{display:none;}
body:has(#screen-quiz.active) .mc-nav-inner{justify-content:space-between;}

/* ---- 2A: square corners everywhere except the language pill ---- */
.wrap, .wrap *, .mc-nav *:not(.lang-toggle){border-radius:0 !important;}
.lang-toggle{border-radius:999px !important;}

/* subject and topic chips become ruled tags, per the handoff */
.subj, .tag, .chip{
  background:transparent !important; border:1px solid var(--line-2) !important;
  color:var(--ink-2) !important; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 9px !important; font-weight:500;
}
[dir="rtl"] .subj, [dir="rtl"] .tag, [dir="rtl"] .chip{letter-spacing:0; text-transform:none; font-size:13px;}

/* the ranked numeral on the results screen: Newsreader, brass, no disc */
.mrank{
  background:transparent !important; border:0 !important; width:auto !important; height:auto !important;
  font-family:var(--font-display); font-size:22px; font-weight:400; color:var(--accent) !important;
  box-shadow:none !important; min-width:28px;
}
[dir="rtl"] .mrank{font-family:var(--font-ar); font-weight:600;}

/* the sticky nav must not cover anything scrolled into view */
html{scroll-padding-top:76px;}
.wrap [id], .m, .mcard{scroll-margin-top:76px;}


/* ---- nav: links back to the main site and the book ---- */
.mc-nav-inner{max-width:1160px !important; gap:14px; flex-wrap:nowrap;}
.mc-nav-links{gap:17px; justify-content:center; min-width:0;}
@media (max-width:1100px){ .mc-brand span{display:none;} }
@media (max-width:760px){
  .mc-nav-inner{flex-wrap:wrap;}
  .mc-nav-links{order:3; width:100%; justify-content:flex-start;}
}
.mc-nav-right{display:flex; align-items:center; gap:14px; flex:0 0 auto;}
.mc-site{
  color:#9a9da3; text-decoration:none; font-size:12px; letter-spacing:.06em; white-space:nowrap;
  border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s, border-color .15s;
}
.mc-site:hover{color:var(--paper); border-bottom-color:#3a3d43;}
[dir="rtl"] .mc-site{letter-spacing:0; font-size:13px;}
.mc-book{
  color:#d8b98a; text-decoration:none; font-size:12px; letter-spacing:.06em; white-space:nowrap;
  border:1px solid rgba(216,185,138,.45); padding:6px 13px; transition:background .15s, color .15s, border-color .15s;
}
.mc-book:hover{background:#d8b98a; color:var(--ink); border-color:#d8b98a;}
[dir="rtl"] .mc-book{letter-spacing:0; font-size:13px;}
@media (max-width:860px){ .mc-site{display:none;} }
@media (max-width:640px){
  .mc-nav-right{gap:9px;}
  .mc-book{padding:5px 10px;}
}
</style>
</head>
<body>
<div class="mc-nav">
  <div class="mc-nav-inner">
    <a class="mc-brand" href="./">
      <b data-en="Major Compass" data-ar="بوصلة التخصص">Major Compass</b>
      <span data-en="Dr. Saqer AlKhalifa" data-ar="د. صقر آل خليفة">Dr. Saqer AlKhalifa</span>
    </a>
    <nav class="mc-nav-links" aria-label="Tools">
      <a href="./" data-en="The quiz" data-ar="الاختبار">The quiz</a>
      <a href="explore.html" aria-current="page" data-en="Majors" data-ar="التخصصات">Majors</a>

{id:"med", g:"health", n:{en:"Medicine", ar:"الطب البشري"},
 study:{en:"Two to three years of the body and how it works: anatomy, physiology, biochemistry, pharmacology. Then clinical years on hospital wards rotating through surgery, paediatrics, obstetrics, psychiatry and internal medicine. Expect five to seven years, followed by an internship year, then several more years of residency before you are a specialist.",
        ar:"سنتان إلى ثلاث في دراسة الجسم وكيف يعمل: التشريح ووظائف الأعضاء والكيمياء الحيوية وعلم الأدوية. ثم سنوات سريرية في المستشفى تتنقل فيها بين الجراحة وطب الأطفال والنساء والولادة والطب النفسي والباطنية. توقع من خمس إلى سبع سنوات، تليها سنة امتياز، ثم سنوات إقامة قبل أن تصبح اختصاصيًا."},

{id:"dent", g:"health", n:{en:"Dentistry", ar:"طب الأسنان"},

        ar:"تشريح الرأس والعنق، وبيولوجيا الفم، وعلوم المواد، ثم سنوات من الممارسة السريرية تحت الإشراف على مرضى حقيقيين: حشوات وخلع وعلاج جذور وتيجان. غالبًا خمس إلى ست سنوات، ومعظمها تعلّم عمل يدوي بالغ الدقة."},

{id:"pharm", g:"health", n:{en:"Pharmacy", ar:"الصيدلة"},

    om:["National University of Science and Technology","University of Nizwa"]}},

{id:"nurs", g:"health", n:{en:"Nursing", ar:"التمريض"},

{id:"psych", g:"health", n:{en:"Psychology", ar:"علم النفس"},
 study:{en:"How people think, develop, and behave, taught as a science: research methods and statistics are a bigger part of the degree than most students expect. Cognitive, developmental, social and abnormal psychology, usually over four years.",
        ar:"كيف يفكر الناس وينمون ويتصرفون، ويُدرَّس كعلم: مناهج البحث والإحصاء جزء أكبر من الدرجة مما يتوقعه معظم الطلبة. علم النفس المعرفي والنمائي والاجتماعي والمرضي، غالبًا في أربع سنوات."},

{id:"data", g:"tech", n:{en:"Data Science and Artificial Intelligence", ar:"علوم البيانات والذكاء الاصطناعي"},
 study:{en:"Statistics and linear algebra as the foundation, then programming, machine learning, and how to handle messy real data. Four years. The mathematics is genuinely heavy, and the programs that skip it produce graduates who cannot go deep.",
        ar:"الإحصاء والجبر الخطي كأساس، ثم البرمجة وتعلم الآلة والتعامل مع البيانات الواقعية الفوضوية. أربع سنوات. الرياضيات ثقيلة فعلًا، والبرامج التي تتجاوزها تخرّج طلبة لا يستطيعون التعمق."},
 day:{en:"Most of the job is cleaning and understanding data, not building clever models. Then explaining findings to people who will make decisions based on them, which means your communication matters as much as your code.",
      ar:"معظم العمل تنظيف البيانات وفهمها، لا بناء نماذج ذكية. ثم شرح النتائج لمن سيتخذون قرارات بناءً عليها، ما يعني أن تواصلك لا يقل أهمية عن كودك."},
 hard:{en:"The gap between the exciting version students imagine and the reality of spending most of your week on data quality. Also, the field moves so fast that specific tools you master may be replaced, so the statistics foundation is what protects you.",
       ar:"الفجوة بين الصورة المثيرة التي يتخيلها الطلبة وواقع قضاء معظم الأسبوع في جودة البيانات. كما أن المجال يتغير بسرعة تجعل الأدوات التي أتقنتها قابلة للاستبدال، فأساس الإحصاء هو ما يحميك."},
 subj:{en:["Mathematics","Statistics","Computing"], ar:["الرياضيات","الإحصاء","الحاسوب"]},
 u:{bh:["American University of Bahrain","University of Bahrain (Statistics and Data Science)","BIBF"],
    sa:["Alfaisal University","KFUPM"],
    ae:["MBZUAI (dedicated AI university)","Khalifa University","American University of Sharjah","Abu Dhabi University","Ajman University","Heriot-Watt Dubai","University of Wollongong Dubai","Canadian University Dubai"],
    qa:["Carnegie Mellon Qatar (BS Artificial Intelligence)","University of Doha for Science and Technology"],
    kw:["Kuwait University"],
    om:["UTAS","NUST","GUtech","Muscat University","University of Nizwa","MCBS"]}},

{id:"netw", g:"tech", n:{en:"Computer and Network Engineering", ar:"هندسة الحاسوب والشبكات"},
 study:{en:"Where hardware meets software: digital logic, embedded systems, computer architecture, and networking protocols. More electrical engineering than a computer science degree, more programming than an electrical one. Four to five years.",
        ar:"حيث يلتقي العتاد بالبرمجيات: المنطق الرقمي والأنظمة المدمجة ومعمارية الحاسوب وبروتوكولات الشبكات. هندسة كهربائية أكثر من علوم الحاسوب، وبرمجة أكثر من الهندسة الكهربائية. أربع إلى خمس سنوات."},
 day:{en:"Designing and maintaining the infrastructure everything else runs on: networks, data centres, smart devices, cloud systems. Often on site rather than at a desk, and often the person called when the whole system is down.",
      ar:"تصميم وصيانة البنية التي يعمل عليها كل شيء آخر: الشبكات ومراكز البيانات والأجهزة الذكية والأنظمة السحابية. غالبًا في الموقع لا خلف مكتب، وغالبًا أنت من يُستدعى حين يتوقف النظام بأكمله."},
 hard:{en:"You sit between two disciplines and can end up less specialised than either, so choose a depth early. The on-call element is real, since infrastructure fails at inconvenient hours.",
       ar:"تقف بين تخصصين وقد تنتهي أقل تخصصًا من كليهما، فاختر عمقًا مبكرًا. وعنصر الاستدعاء حقيقي، لأن البنية التحتية تتعطل في أوقات غير مناسبة."},
 subj:{en:["Mathematics","Physics","Computing"], ar:["الرياضيات","الفيزياء","الحاسوب"]},
 u:{bh:["University of Bahrain","American University of Bahrain","Ahlia University","Bahrain Polytechnic"],
    sa:["Prince Sultan University","KFUPM","Prince Mohammad Bin Fahd University","Effat University"],

{id:"mech", g:"eng", n:{en:"Mechanical Engineering", ar:"الهندسة الميكانيكية"},
 study:{en:"Thermodynamics, fluid mechanics, materials, dynamics and machine design, with heavy mathematics throughout and design projects that have to actually work. Four to five years.",
        ar:"الديناميكا الحرارية وميكانيكا الموائع والمواد والديناميكا وتصميم الآلات، مع رياضيات مكثفة طوال البرنامج ومشاريع تصميم يجب أن تعمل فعلًا. أربع إلى خمس سنوات."},
 day:{en:"Depends heavily on sector. In oil, gas and manufacturing it means plant visits, equipment problems and maintenance planning. In design roles it means CAD, simulation and testing. Site-based work involves heat, safety gear and early starts.",
      ar:"يختلف كثيرًا حسب القطاع. في النفط والغاز والتصنيع يعني زيارات المصانع ومشاكل المعدات وتخطيط الصيانة. وفي أدوار التصميم يعني برامج التصميم والمحاكاة والاختبار. والعمل الميداني يعني حرارة ومعدات سلامة وبدايات مبكرة."},
 hard:{en:"The mathematics load in years one and two removes a lot of students. Also, the glamorous design jobs are a small minority; most mechanical engineers work in operations and maintenance, which is a different daily life.",
       ar:"حِمل الرياضيات في السنتين الأولى والثانية يُخرج كثيرًا من الطلبة. كما أن وظائف التصميم اللامعة أقلية صغيرة؛ فمعظم المهندسين الميكانيكيين يعملون في التشغيل والصيانة، وهي حياة يومية مختلفة."},
 subj:{en:["Mathematics","Physics","Design and technology"], ar:["الرياضيات","الفيزياء","التصميم والتقنية"]},
 u:{bh:["University of Bahrain","American University of Bahrain","Applied Science University","Gulf University","Bahrain Polytechnic"],
    sa:["KFUPM","Alfaisal University","Prince Mohammad Bin Fahd University","King Abdulaziz University"],
    ae:["Khalifa University","American University of Sharjah","American University in Dubai","University of Wollongong Dubai","Heriot-Watt Dubai","Abu Dhabi University","RIT Dubai","Higher Colleges of Technology"],
    qa:["Qatar University","Texas A&M at Qatar"],
    kw:["Kuwait University","AUM","Australian University Kuwait"],
    om:["Sultan Qaboos University","UTAS","NUST","GUtech","Dhofar University","Sohar University","Middle East College"]}},

{id:"elec", g:"eng", n:{en:"Electrical Engineering", ar:"الهندسة الكهربائية"},
 study:{en:"Circuits, electromagnetics, signals, power systems and control. Among the most mathematically abstract of the engineering degrees, because much of what you work with cannot be seen. Four to five years.",
        ar:"الدوائر والكهرومغناطيسية والإشارات وأنظمة القدرة والتحكم. من أكثر التخصصات الهندسية تجريدًا رياضيًا، لأن كثيرًا مما تعمل عليه لا يُرى. أربع إلى خمس سنوات."},
 day:{en:"Power engineers work on grids, substations and increasingly on solar and battery projects. Electronics engineers design and test circuits. Control engineers automate industrial processes. Expect a mix of office design work and site commissioning.",
      ar:"مهندسو القدرة يعملون على الشبكات والمحطات وبشكل متزايد على مشاريع الطاقة الشمسية والبطاريات. ومهندسو الإلكترونيات يصممون الدوائر ويختبرونها. ومهندسو التحكم يؤتمتون العمليات الصناعية. توقع مزيجًا من التصميم المكتبي والتشغيل الميداني."},
 hard:{en:"The abstraction. Students who need to see and touch what they are building often prefer mechanical or civil. Those who enjoy the invisible mathematics find it deeply satisfying.",
       ar:"التجريد. الطلبة الذين يحتاجون إلى رؤية ما يبنونه ولمسه يفضلون غالبًا الميكانيكية أو المدنية. أما من يستمتع بالرياضيات غير المرئية فيجده مرضيًا جدًا."},
 subj:{en:["Mathematics","Physics"], ar:["الرياضيات","الفيزياء"]},
 u:{bh:["University of Bahrain","Applied Science University","Gulf University","Bahrain Polytechnic"],
    sa:["KFUPM","Prince Sultan University","Alfaisal University","Prince Mohammad Bin Fahd University","Effat University"],
    ae:["Khalifa University","American University of Sharjah","American University in Dubai","University of Wollongong Dubai","Heriot-Watt Dubai","Abu Dhabi University","RIT Dubai","Higher Colleges of Technology"],
    qa:["Qatar University","Texas A&M at Qatar","Hamad Bin Khalifa University"],
    kw:["Kuwait University","GUST","American University of Kuwait","Australian University Kuwait","KCST"],
    om:["Sultan Qaboos University","UTAS","NUST","University of Nizwa","Dhofar University","Sohar University","A'Sharqiyah University"]}},

{id:"civil", g:"eng", n:{en:"Civil Engineering", ar:"الهندسة المدنية"},
 study:{en:"Structures, geotechnics, materials, water, transport and construction management. You learn why buildings stand up and what makes them fall down, with design projects and site visits throughout. Four to five years.",
        ar:"الإنشاءات وميكانيكا التربة والمواد والمياه والنقل وإدارة التشييد. تتعلم لماذا تقف المباني وما الذي يُسقطها، مع مشاريع تصميم وزيارات ميدانية طوال البرنامج. أربع إلى خمس سنوات."},
 day:{en:"Either site-based, walking projects in the heat and coordinating contractors, or office-based doing design and analysis. Gulf construction runs on tight deadlines, so the pace is real, and a great deal of the job is documentation and coordination rather than calculation.",
      ar:"إما ميداني: تتجول في المشروع تحت الحر وتنسق مع المقاولين، أو مكتبي: تصميم وتحليل. والإنشاءات في الخليج تسير بمواعيد ضاغطة، فالوتيرة حقيقية، وجزء كبير من العمل توثيق وتنسيق لا حسابات."},
 hard:{en:"The heat and the hours on site, and the fact that responsibility arrives young: your signature can carry legal weight. The work is also cyclical, rising and falling with construction spending.",
       ar:"الحر وساعات الموقع، وحقيقة أن المسؤولية تأتي مبكرًا: توقيعك قد يحمل وزنًا قانونيًا. كما أن العمل دوري يرتفع وينخفض مع الإنفاق على الإنشاءات."},
 subj:{en:["Mathematics","Physics","Geography or geology helps"], ar:["الرياضيات","الفيزياء","الجغرافيا أو الجيولوجيا مفيدة"]},

    sa:["KFUPM","Prince Sultan University","Prince Mohammad Bin Fahd University","Imam Abdulrahman Bin Faisal University"],
    ae:["Khalifa University","American University of Sharjah","American University in Dubai","University of Wollongong Dubai","Heriot-Watt Dubai","Abu Dhabi University","Higher Colleges of Technology"],
    qa:["Qatar University"],

{id:"chem", g:"eng", n:{en:"Chemical and Process Engineering", ar:"الهندسة الكيميائية وهندسة العمليات"},
 study:{en:"Chemistry scaled up to industrial size: reaction engineering, heat and mass transfer, separation processes, plant design and safety. Mathematically the heaviest of the engineering degrees in many programs. Four to five years.",
        ar:"كيمياء بحجم صناعي: هندسة التفاعلات وانتقال الحرارة والكتلة وعمليات الفصل وتصميم المصانع والسلامة. من أثقل التخصصات الهندسية رياضيًا في كثير من البرامج. أربع إلى خمس سنوات."},
 day:{en:"In a refinery, petrochemical plant or LNG facility: monitoring process performance, troubleshooting when output drifts, planning shutdowns, and taking safety extremely seriously. Often shift work or remote industrial sites.",
      ar:"في مصفاة أو مصنع بتروكيماويات أو منشأة غاز مسال: مراقبة أداء العمليات، ومعالجة الانحرافات، وتخطيط فترات الإيقاف، والتعامل مع السلامة بجدية بالغة. غالبًا عمل بالمناوبات أو في مواقع صناعية نائية."},
 hard:{en:"The workload, and the locations: the best paid roles are often in industrial cities away from home. Safety culture also means a level of procedural discipline that some find restrictive.",
       ar:"عبء الدراسة، والمواقع: أعلى الوظائف أجرًا غالبًا في مدن صناعية بعيدة عن البيت. كما تعني ثقافة السلامة انضباطًا إجرائيًا يجده البعض مقيدًا."},
 subj:{en:["Chemistry","Mathematics","Physics"], ar:["الكيمياء","الرياضيات","الفيزياء"]},
 u:{bh:["University of Bahrain","Bahrain Polytechnic"],
    sa:["KFUPM","King Abdulaziz University"],
    ae:["Khalifa University","American University of Sharjah","Heriot-Watt Dubai","Abu Dhabi University","Higher Colleges of Technology"],
    qa:["Qatar University","Texas A&M at Qatar"],
    kw:["Kuwait University","AUM"],
    om:["Sultan Qaboos University","UTAS","NUST","GUtech","University of Nizwa","Dhofar University","Muscat University"]}},

{id:"indus", g:"eng", n:{en:"Industrial Engineering", ar:"الهندسة الصناعية"},
 study:{en:"Optimisation, operations research, quality systems, supply chains and human factors. Less physics than other engineering branches and more statistics and management, applied to making any system run better.",
        ar:"الأمثلة وبحوث العمليات وأنظمة الجودة وسلاسل الإمداد والعوامل البشرية. فيزياء أقل من الفروع الهندسية الأخرى، وإحصاء وإدارة أكثر، تُطبَّق لتحسين أداء أي نظام."},
 day:{en:"Studying how a factory, hospital or airport actually operates, finding the bottleneck, and redesigning the process. You spend a lot of time observing, measuring, and persuading people to change how they work.",
      ar:"دراسة كيف يعمل مصنع أو مستشفى أو مطار فعلًا، وإيجاد نقطة الاختناق، وإعادة تصميم العملية. تقضي وقتًا كبيرًا في الملاحظة والقياس وإقناع الناس بتغيير طريقة عملهم."},
 hard:{en:"It is the least understood engineering degree, so you will explain what you do repeatedly. The technical work is often the easy part; getting an organisation to accept change is the real challenge.",
       ar:"أقل التخصصات الهندسية فهمًا لدى الناس، فستشرح ما تفعله مرارًا. والجانب التقني غالبًا هو الأسهل؛ أما التحدي الحقيقي فهو إقناع المؤسسة بالتغيير."},
 subj:{en:["Mathematics","Statistics","Business studies"], ar:["الرياضيات","الإحصاء","إدارة الأعمال"]},
 u:{bh:["American University of Bahrain"],
    sa:["KFUPM","Alfaisal University","Prince Sultan University"],
    ae:["American University of Sharjah","Abu Dhabi University","RIT Dubai","Khalifa University","Higher Colleges of Technology"],
    qa:["Qatar University"],
    kw:["Kuwait University","AUM","GUST (Engineering Management)"],
    om:["Sultan Qaboos University"]}},

{id:"renew", g:"eng", n:{en:"Renewable Energy and Environmental Engineering", ar:"هندسة الطاقة المتجددة والبيئة"},
 study:{en:"Energy systems, solar and wind technology, water treatment, air quality and sustainability assessment, built on a normal engineering foundation of mathematics and thermodynamics. Four to five years.",
        ar:"أنظمة الطاقة، وتقنيات الشمس والرياح، ومعالجة المياه، وجودة الهواء، وتقييم الاستدامة، على أساس هندسي معتاد من الرياضيات والديناميكا الحرارية. أربع إلى خمس سنوات."},
 day:{en:"Designing and assessing solar plants, water and waste systems, or sustainability compliance for large projects. A growing share of the work is measurement and reporting, since companies now have targets they must prove they are meeting.",
      ar:"تصميم وتقييم محطات الطاقة الشمسية وأنظمة المياه والنفايات، أو الامتثال للاستدامة في المشاريع الكبرى. وحصة متنامية من العمل هي القياس والتقارير، لأن الشركات صار عليها أهداف يجب أن تثبت تحقيقها."},
 hard:{en:"The field is newer than the others, so program quality varies widely: check whether the degree is accredited as engineering or is really an environmental science degree, because employers treat them differently.",
       ar:"المجال أحدث من غيره، فجودة البرامج متفاوتة: تحقق مما إذا كانت الدرجة معتمدة كهندسة أم أنها في الحقيقة علوم بيئية، لأن أصحاب العمل يتعاملون معهما بشكل مختلف."},
 subj:{en:["Physics","Chemistry","Mathematics"], ar:["الفيزياء","الكيمياء","الرياضيات"]},
 u:{bh:["University of Technology Bahrain (Environmental Engineering)"],

    ae:["Abu Dhabi University (Renewable and Sustainable Energy)","Khalifa University (Energy Engineering)","American University of Sharjah","Zayed University"],
    qa:["Qatar University (Environmental Sciences)"],
    kw:[],
    om:["GUtech","University of Nizwa","A'Sharqiyah University","Middle East College","Muscat University"]}},

{id:"arch", g:"eng", n:{en:"Architecture and Interior Design", ar:"العمارة والتصميم الداخلي"},
 study:{en:"Design studio is the heart of it, plus structures, environmental systems, history and building regulation. Five years for a professional degree in most places, and studio culture means late nights and public critique of your work.",
        ar:"مرسم التصميم هو القلب، إضافة إلى الإنشاءات والأنظمة البيئية والتاريخ وأنظمة البناء. خمس سنوات لدرجة مهنية في معظم الدول، وثقافة المرسم تعني سهرًا ونقدًا علنيًا لعملك."},
 day:{en:"Drawing, modelling and revising, then defending choices to clients who change their minds. Much of professional practice is regulation, coordination with engineers and construction documents rather than the creative vision students imagine.",
      ar:"رسم ونمذجة وتعديل، ثم الدفاع عن خياراتك أمام عملاء يغيرون رأيهم. ومعظم الممارسة المهنية أنظمة وتنسيق مع المهندسين ووثائق تنفيذ، لا الرؤية الإبداعية التي يتخيلها الطلبة."},
 hard:{en:"The hours are the worst of any undergraduate degree, and the pay in the early years is low relative to the length of training. Demand reports across the Gulf also name project managers and civil engineers more often than architects.",
       ar:"ساعات العمل هي الأصعب بين درجات البكالوريوس، والأجر في السنوات الأولى منخفض مقارنة بطول التدريب. كما أن تقارير الطلب في الخليج تذكر مديري المشاريع والمهندسين المدنيين أكثر من المعماريين."},
 subj:{en:["Art","Mathematics","Physics"], ar:["الفنون","الرياضيات","الفيزياء"]},

{id:"fin", g:"biz", n:{en:"Banking and Finance, including Islamic Finance", ar:"المصارف والتمويل، ومنه التمويل الإسلامي"},
 study:{en:"Corporate finance, investments, financial markets, risk and, in Islamic finance programs, the Sharia structures behind sukuk, murabaha and takaful. Four years, with more mathematics and statistics than most students expect.",
        ar:"تمويل الشركات والاستثمارات والأسواق المالية والمخاطر، وفي برامج التمويل الإسلامي: الهياكل الشرعية خلف الصكوك والمرابحة والتكافل. أربع سنوات، مع رياضيات وإحصاء أكثر مما يتوقع معظم الطلبة."},
 day:{en:"Analysis and modelling, building the case for a decision, then presenting it to people more senior than you. Long hours in investment banking, more predictable in corporate or retail banking. Relationships matter as much as spreadsheets.",
      ar:"تحليل ونمذجة وبناء الحجة لقرار ما، ثم عرضها على من هم أعلى منك. ساعات طويلة في الاستثمار المصرفي، وأكثر انتظامًا في المصرفية المؤسسية أو الأفراد. والعلاقات لا تقل أهمية عن الجداول."},
 hard:{en:"It is competitive at entry, and the prestigious roles concentrate in a few institutions. Global forecasts show the field splitting sharply: routine banking roles are declining while analytical and fintech-facing roles grow, so aim deliberately at the second group.",
       ar:"المنافسة شديدة عند الدخول، والوظائف المرموقة تتركز في مؤسسات قليلة. والتوقعات العالمية تُظهر انقسامًا حادًا: الوظائف المصرفية الروتينية تتراجع بينما تنمو الأدوار التحليلية والمرتبطة بالتقنية المالية، فاستهدف الثانية عن قصد."},
 subj:{en:["Mathematics","Economics","Business studies"], ar:["الرياضيات","الاقتصاد","إدارة الأعمال"]},

{id:"fintech", g:"biz", n:{en:"Financial Technology", ar:"التقنية المالية"},
 study:{en:"A hybrid: finance fundamentals plus programming, data analysis, blockchain and digital payments, with regulation running through it. Four years. Quality varies, so check how much real coding the program contains.",
        ar:"تخصص هجين: أساسيات التمويل مع البرمجة وتحليل البيانات والبلوك تشين والمدفوعات الرقمية، مع التنظيم في خلفية كل شيء. أربع سنوات. والجودة متفاوتة، فتحقق من حجم البرمجة الفعلي في البرنامج."},
 day:{en:"Product work at a bank or a startup: designing how a payment or lending flow should behave, working between engineers and compliance officers, and analysing whether it is actually working once launched.",
      ar:"عمل على المنتجات في بنك أو شركة ناشئة: تصميم كيفية عمل تدفق الدفع أو الإقراض، والوساطة بين المهندسين ومسؤولي الامتثال، وتحليل ما إذا كان يعمل فعلًا بعد الإطلاق."},
 hard:{en:"Being half-technical is a risk: you can end up neither a strong engineer nor a strong financier. The students who do best pick one side to be genuinely good at and use the other as an advantage.",
       ar:"أن تكون نصف تقني مخاطرة: قد تنتهي لا مهندسًا قويًا ولا ماليًا قويًا. والأنجح هم من يختارون جانبًا يتقنونه فعلًا ويستخدمون الآخر كميزة."},
 subj:{en:["Mathematics","Computing","Economics"], ar:["الرياضيات","الحاسوب","الاقتصاد"]},
 u:{bh:["Gulf University","Bahrain Polytechnic (BSc Financial Technology)"],
    sa:["Princess Nourah University (BSc Financial Technology)"],
    ae:["Abu Dhabi University (Finance and Fintech)"],
    qa:["University of Doha for Science and Technology (Banking and Financial Technology)"],
    kw:[], om:[]}},

{id:"math", g:"biz", n:{en:"Mathematics, Statistics and Actuarial Science", ar:"الرياضيات والإحصاء والعلوم الاكتوارية"},
 study:{en:"Pure and applied mathematics, probability, statistical modelling and, in actuarial programs, the specific mathematics of insurance and pensions. Four years, plus a long series of professional actuarial exams afterwards if you take that route.",
        ar:"الرياضيات البحتة والتطبيقية والاحتمالات والنمذجة الإحصائية، وفي البرامج الاكتوارية: رياضيات التأمين والمعاشات تحديدًا. أربع سنوات، يليها سلسلة طويلة من الامتحانات الاكتوارية المهنية إن سلكت هذا الطريق."},
 day:{en:"Actuaries price risk and reserves for insurers, working in spreadsheets and modelling software and explaining results to boards. Statisticians work across health, government and business. Both jobs are analytical, office-based and quietly influential.",
      ar:"الاكتواريون يسعّرون المخاطر والاحتياطيات لشركات التأمين، ويعملون بالجداول وبرامج النمذجة ويشرحون النتائج للمجالس. والإحصائيون يعملون في الصحة والحكومة والأعمال. كلا العملين تحليلي ومكتبي وذو تأثير هادئ."},
 hard:{en:"The actuarial exams are famously difficult and take years alongside full-time work, with high failure rates. Pure mathematics graduates who do not add a practical skill can also struggle to translate the degree into a first job.",
       ar:"الامتحانات الاكتوارية صعبة بشهرة وتستغرق سنوات مع العمل بدوام كامل، ونسب الرسوب فيها مرتفعة. كما أن خريجي الرياضيات البحتة الذين لا يضيفون مهارة تطبيقية قد يجدون صعوبة في ترجمة الشهادة إلى وظيفة أولى."},
 subj:{en:["Mathematics","Further mathematics","Statistics"], ar:["الرياضيات","الرياضيات المتقدمة","الإحصاء"]},
 u:{bh:["University of Bahrain (including Actuarial Science, the only one in Bahrain)"],
    sa:["KFUPM (Actuarial Science and Financial Mathematics)","Prince Sultan University (Actuarial Science)","Qassim University (Actuarial Mathematics)"],
    ae:["American University of Sharjah","Khalifa University","Heriot-Watt Dubai (Actuarial Data Science)"],
    qa:["Qatar University"],
    kw:["Kuwait University (including Financial Mathematics)"],

{id:"bus", g:"biz", n:{en:"Business Management", ar:"إدارة الأعمال"},
 study:{en:"A broad survey: accounting, marketing, operations, strategy, human resources and economics, usually with a specialisation in the final years. Four years, and the most popular degree in the Gulf by a wide margin.",
        ar:"مسح واسع: محاسبة وتسويق وعمليات واستراتيجية وموارد بشرية واقتصاد، مع تخصص في السنوات الأخيرة عادة. أربع سنوات، وهي الأكثر شيوعًا في الخليج بفارق كبير."},
 day:{en:"Enormously varied, which is both the appeal and the problem. Management trainees rotate through functions; specialists go deep into one. Most days involve coordinating people, tracking numbers, and writing things that persuade.",
      ar:"متنوع للغاية، وهذا سبب جاذبيته ومشكلته معًا. المتدربون الإداريون يتنقلون بين الوظائف، والمتخصصون يتعمقون في واحدة. ومعظم الأيام تنسيق للناس ومتابعة للأرقام وكتابة تقنع."},
 hard:{en:"This is the honest one: business is the most oversupplied degree in the region, and a general business graduate with no specialisation competes with thousands. Choose a concrete specialisation, add a technical or analytical skill, and get internships early.",
       ar:"هذه هي النقطة الصادقة: إدارة الأعمال أكثر التخصصات وفرة في المنطقة، وخريج الإدارة العامة بلا تخصص ينافس الآلاف. اختر تخصصًا محددًا، وأضف مهارة تقنية أو تحليلية، واحصل على تدريب عملي مبكرًا."},
 subj:{en:["Business studies","Economics","Mathematics"], ar:["إدارة الأعمال","الاقتصاد","الرياضيات"]},

{id:"mkt", g:"biz", n:{en:"Marketing and Digital Marketing", ar:"التسويق والتسويق الرقمي"},
 study:{en:"Consumer behaviour, branding, market research, advertising and, increasingly, analytics and paid digital channels. Four years. The best programs are heavy on data; the weakest are mostly theory and slogans.",
        ar:"سلوك المستهلك والعلامة التجارية وبحوث السوق والإعلان، وبشكل متزايد التحليلات والقنوات الرقمية المدفوعة. أربع سنوات. وأفضل البرامج مكثفة في البيانات، وأضعفها نظرية وشعارات."},
 day:{en:"Planning campaigns, writing and approving content, watching performance dashboards daily, and arguing for budget. Deadlines are constant and public, since everything you make is seen. Results are measurable, which cuts both ways.",
      ar:"تخطيط الحملات، وكتابة المحتوى واعتماده، ومتابعة لوحات الأداء يوميًا، والدفاع عن الميزانية. المواعيد مستمرة وعلنية، لأن كل ما تصنعه يُرى. والنتائج قابلة للقياس، وهذا سلاح ذو حدين."},
 hard:{en:"Basic content and copywriting roles are being automated fast, while analytical and performance marketing roles are growing. If you take this degree, become genuinely good with data and paid media rather than only with ideas.",
       ar:"وظائف المحتوى والكتابة الأساسية تُؤتمت بسرعة، بينما تنمو وظائف التسويق التحليلي والأدائي. فإن اخترت هذا التخصص، أتقن البيانات والإعلانات المدفوعة فعلًا لا الأفكار وحدها."},
 subj:{en:["Business studies","Psychology","Statistics"], ar:["إدارة الأعمال","علم النفس","الإحصاء"]},

{id:"logi", g:"biz", n:{en:"Logistics and Supply Chain Management", ar:"اللوجستيات وإدارة سلاسل الإمداد"},
 study:{en:"Procurement, inventory, transport, warehousing, customs and increasingly data analysis and optimisation. Four years, often with port, airport or warehouse placements that make the subject concrete.",
        ar:"المشتريات والمخزون والنقل والتخزين والجمارك، وبشكل متزايد تحليل البيانات والأمثلة. أربع سنوات، غالبًا مع تدريب في الموانئ أو المطارات أو المستودعات يجعل المادة ملموسة."},
 day:{en:"Solving problems that have already happened: a delayed shipment, a customs hold, a supplier who cannot deliver. Fast paced, phone-heavy, and deeply practical. When it goes well nobody notices, which is the nature of the field.",
      ar:"حل مشكلات وقعت فعلًا: شحنة متأخرة، أو احتجاز جمركي، أو مورّد لا يستطيع التسليم. عمل سريع الإيقاع وكثير الاتصالات وعملي جدًا. وحين يسير الأمر جيدًا لا يلاحظه أحد، وتلك طبيعة المجال."},
 hard:{en:"The stress of constant firefighting, and hours that follow shipping schedules rather than office hours. Note too that routine stock-keeping roles are declining globally while planning and analytics roles grow.",
       ar:"ضغط إطفاء الحرائق المستمر، وساعات تتبع جداول الشحن لا دوام المكتب. ولاحظ أيضًا أن وظائف مسك المخزون الروتينية تتراجع عالميًا بينما تنمو وظائف التخطيط والتحليل."},
 subj:{en:["Mathematics","Business studies","Geography"], ar:["الرياضيات","إدارة الأعمال","الجغرافيا"]},
 u:{bh:["Bahrain Polytechnic (International Logistics and Supply Chain Management)"],
    sa:["Effat University (Operations and Supply Chain Management)"],
    ae:["Higher Colleges of Technology (Logistics Engineering Technology)","Emirates Aviation University"],
    qa:["University of Doha for Science and Technology"],
    kw:["Kuwait University (Operations and Supply Chain Management)"],
    om:["GUtech","NUST","Muscat University","Dhofar University","Middle East College","MCBS","A'Sharqiyah University","UTAS"]}},

{id:"avia", g:"biz", n:{en:"Aviation and Airport Management", ar:"إدارة الطيران والمطارات"},
 study:{en:"Two distinct routes. Aviation management covers airline and airport operations, safety, regulation and economics as a business degree. Piloting and aircraft maintenance are licence-based training, often outside the university system, and are expensive.",
        ar:"مساران مختلفان. إدارة الطيران تغطي عمليات شركات الطيران والمطارات والسلامة والتنظيم والاقتصاد كدرجة في الأعمال. أما قيادة الطائرات وصيانتها فتدريب قائم على الرخص، غالبًا خارج النظام الجامعي، ومكلف."},
 day:{en:"In airport or airline operations: shift-based coordination of turnarounds, delays, crew and ground handling, where a small problem cascades quickly. In safety and regulation: audits, documentation and investigation.",
      ar:"في عمليات المطار أو شركة الطيران: تنسيق بالمناوبات لمواعيد الإقلاع والتأخيرات والطواقم والخدمة الأرضية، حيث تتسع المشكلة الصغيرة بسرعة. وفي السلامة والتنظيم: تدقيق وتوثيق وتحقيق."},
 hard:{en:"Understand the difference before you commit: a pilot licence is training, not a degree, and the cost is high with no guarantee of an airline place. Aviation management is a normal degree with normal graduate competition.",
       ar:"افهم الفرق قبل أن تلتزم: رخصة الطيران تدريب لا شهادة جامعية، وكلفتها عالية دون ضمان مقعد في شركة طيران. أما إدارة الطيران فدرجة جامعية عادية بمنافسة عادية."},
 subj:{en:["Physics","Mathematics","English"], ar:["الفيزياء","الرياضيات","اللغة الإنجليزية"]},
 u:{bh:[], sa:["Prince Sultan University (Aviation Management)"],
    ae:["Emirates Aviation University","Abu Dhabi University","Higher Colleges of Technology","Khalifa University (Aerospace Engineering)"],
    qa:["University of Doha for Science and Technology","Qatar Aeronautical Academy (licence-level, not a degree)"],
    kw:["Australian University Kuwait"],
    om:["MCBS (Aviation and Airport Management)"]}},

{id:"law", g:"soc", n:{en:"Law", ar:"القانون"},
 study:{en:"Reading, and a great deal of it: constitutional, civil, commercial and criminal law, plus Sharia components in most Gulf programs. Four to five years, followed by a training or bar requirement before you can practise.",
        ar:"قراءة، وكثير منها: القانون الدستوري والمدني والتجاري والجنائي، مع مكونات شرعية في معظم برامج الخليج. أربع إلى خمس سنوات، يليها تدريب أو شرط نقابي قبل أن تمارس."},
 day:{en:"Far less courtroom drama than television suggests. Most lawyers draft and review contracts, research precedent, advise on regulation and negotiate. Corporate and compliance work dominates hiring in the Gulf right now.",
      ar:"دراما المحاكم أقل بكثير مما يوحي التلفزيون. معظم المحامين يصوغون العقود ويراجعونها، ويبحثون في السوابق، ويستشيرون في التنظيم، ويتفاوضون. والعمل المؤسسي والامتثال يهيمن على التوظيف في الخليج حاليًا."},
 hard:{en:"The reading volume, and the fact that in several Gulf countries practising as an advocate is restricted to nationals, so check the rules for your citizenship before choosing. Routine legal-support roles are also exposed to automation, while regulatory and compliance work is growing.",
       ar:"حجم القراءة، وحقيقة أن الترافع في عدة دول خليجية مقصور على المواطنين، فتحقق من الأنظمة الخاصة بجنسيتك قبل الاختيار. كما أن وظائف الدعم القانوني الروتينية معرضة للأتمتة، بينما ينمو العمل التنظيمي والامتثال."},
 subj:{en:["Arabic and English","History","Debate"], ar:["العربية والإنجليزية","التاريخ","المناظرة"]},
 u:{bh:["University of Bahrain","Applied Science University","Gulf University"],
    sa:["Prince Sultan University","Alfaisal University","Dar Al-Hekma University","Prince Mohammad Bin Fahd University","King Saud University"],
    ae:["University of Sharjah","Ajman University","Abu Dhabi University","Middlesex Dubai"],
    qa:["Qatar University","Lusail University"],
    kw:["Kuwait University","Kuwait International Law School"],
    om:["Sultan Qaboos University","Dhofar University","Sohar University","A'Sharqiyah University"]}},

{id:"media", g:"soc", n:{en:"Media and Mass Communication", ar:"الإعلام والاتصال الجماهيري"},
 study:{en:"Writing and reporting, media law and ethics, production skills, public relations and increasingly digital and social platforms. Four years, and the strongest programs push you to produce constantly rather than only study theory.",
        ar:"الكتابة والتحرير، وقانون الإعلام وأخلاقياته، ومهارات الإنتاج، والعلاقات العامة، وبشكل متزايد المنصات الرقمية والاجتماعية. أربع سنوات، وأقوى البرامج تدفعك للإنتاج باستمرار لا لدراسة النظرية فقط."},
 day:{en:"Deadline-driven: producing content, pitching stories, managing an organisation's public voice, or handling a reputational problem in real time. Portfolio matters more than transcript in almost every hiring decision.",
      ar:"محكوم بالمواعيد: إنتاج المحتوى، وعرض القصص، وإدارة الصوت العام لمؤسسة، أو معالجة أزمة سمعة في وقتها. وملف أعمالك يهم أكثر من كشف درجاتك في معظم قرارات التوظيف."},
 hard:{en:"Entry pay is low and competition is high, and generative AI is squeezing basic content production. The graduates who do well specialise early in something scarce: video production, data journalism, crisis communication or Arabic-English bilingual work.",
       ar:"الأجر المبتدئ منخفض والمنافسة شديدة، والذكاء الاصطناعي التوليدي يضغط على إنتاج المحتوى الأساسي. والناجحون يتخصصون مبكرًا في شيء نادر: إنتاج الفيديو، أو صحافة البيانات، أو اتصال الأزمات، أو العمل بالعربية والإنجليزية معًا."},
 subj:{en:["Arabic and English","Media studies","Anything you can build a portfolio in"], ar:["العربية والإنجليزية","الإعلام","أي مجال تبني فيه ملف أعمال"]},

    ae:["American University of Sharjah","American University in Dubai","University of Wollongong Dubai","Abu Dhabi University","Ajman University","Zayed University","University of Sharjah","RIT Dubai"],
    qa:["Northwestern University in Qatar","Qatar University","University of Doha for Science and Technology"],
    kw:["Kuwait University","GUST","American University of Kuwait"],
    om:["Sultan Qaboos University","Sohar University","UTAS"]}},

{id:"design", g:"soc", n:{en:"Graphic and Multimedia Design", ar:"التصميم الجرافيكي والوسائط المتعددة"},
 study:{en:"Studio-based: typography, colour, layout, branding, motion and increasingly user interface and experience design. Four years, and your portfolio is the qualification that actually gets you hired.",
        ar:"قائم على المرسم: الطباعة والألوان والتنسيق والهوية والحركة، وبشكل متزايد تصميم الواجهات وتجربة المستخدم. أربع سنوات، وملف أعمالك هو المؤهل الذي يوظفك فعلًا."},
 day:{en:"Client or brief driven: producing options, receiving criticism, revising, and defending decisions to people with strong opinions and no design training. Deadlines are tight and revision cycles are the norm.",
      ar:"مدفوع بالعميل أو بالتكليف: إنتاج خيارات، وتلقي النقد، والتعديل، والدفاع عن القرارات أمام أشخاص لهم آراء قوية بلا خلفية تصميمية. المواعيد ضيقة ودورات التعديل هي القاعدة."},
 hard:{en:"Be aware of this one honestly: global forecasts now list graphic designers among the fastest-declining roles because of generative AI, for the first time. The work that remains strong is user experience and product design, motion and interactive work. Choose that direction deliberately.",
       ar:"كن على علم بهذا بصراحة: التوقعات العالمية باتت تصنف مصممي الجرافيك ضمن أسرع المهن تراجعًا بسبب الذكاء الاصطناعي التوليدي، لأول مرة. والعمل الذي يبقى قويًا هو تصميم تجربة المستخدم والمنتجات والحركة والتفاعلية. فاختر هذا الاتجاه عن قصد."},
 subj:{en:["Art and design","Computing","Anything visual you make now"], ar:["الفنون والتصميم","الحاسوب","أي عمل بصري تصنعه الآن"]},
 u:{bh:["Applied Science University","American University of Bahrain","Bahrain Polytechnic","Ahlia University","University of Bahrain"],
    sa:["Dar Al-Hekma University (Visual Communications)","Effat University","Prince Mohammad Bin Fahd University"],
    ae:["American University in Dubai","Zayed University","Heriot-Watt Dubai","University of Wollongong Dubai","RIT Dubai"],
    qa:["VCUarts Qatar","Qatar University"],

{id:"edu", g:"soc", n:{en:"Education and Teaching", ar:"التربية والتعليم"},
 study:{en:"Your subject specialism plus how people learn: curriculum design, assessment, classroom management and child development, with school placements that start early and increase. Four years, usually leading to a teaching licence.",
