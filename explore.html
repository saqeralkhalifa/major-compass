{"id": "hr", "g": "biz", "n": {"en": "Human Resources Management", "ar": "إدارة الموارد البشرية"}, "study": {"en": "Organisational behaviour, recruitment and selection, compensation and benefits, training and development, and a heavy labour law component that in the Gulf means the local labour code plus the workforce nationalisation regulations. Four years in most programmes, usually with a summer placement inside a human resources department. Expect more law and more spreadsheets than the phrase working with people suggests.", "ar": "السلوك التنظيمي، والاستقطاب والاختيار، والأجور والمزايا، والتدريب والتطوير، إضافة إلى مكون قانوني ثقيل يعني في الخليج قانون العمل المحلي ولوائح توطين الوظائف. أربع سنوات في معظم البرامج، وعادة مع تدريب صيفي داخل إدارة موارد بشرية. وتوقع قانوناً وجداول بيانات أكثر مما توحي به عبارة العمل مع الناس."}, "day": {"en": "A large share of a Gulf human resources job is compliance. You track your organisation against its nationalisation target, the Saudization band under Nitaqat, the Bahrainisation percentage, the Emiratisation quota, the Omanisation and Kuwaitisation requirements, and you work out how to move the number before the next inspection. Around that sits visa and residency paperwork, payroll, end of service calculations, recruitment, and the disciplinary and grievance cases nobody enjoys. Strategic work exists and it sits several years above the administrative work.", "ar": "الجزء الأكبر من عمل الموارد البشرية في الخليج امتثال تنظيمي. تتابع موقع منشأتك من نسبة التوطين المطلوبة، ونطاق السعودة في برنامج نطاقات، ونسبة البحرنة، وحصة التوطين الإماراتية، ومتطلبات التعمين والتكويت، وتبحث عن طريقة لتحسين الرقم قبل التفتيش القادم. وحول ذلك تدور معاملات التأشيرات والإقامات، والرواتب، وحساب مكافأة نهاية الخدمة، والتوظيف، وقضايا الجزاءات والتظلمات التي لا يستمتع بها أحد. أما العمل الاستراتيجي فموجود، ويقع على بعد سنوات فوق العمل الإداري."}, "hard": {"en": "The parts students dislike are the repetition and the confrontation: telling a candidate they did not get the job, sitting in a termination meeting, chasing documents that people will not send. The compliance load is also what makes the degree employable, because every employer in the Gulf needs somebody who understands the quota system and the labour code, and that requirement is growing rather than shrinking. Judgement and discretion matter more here than grades, and people who cannot keep a confidence do not last.", "ar": "أكثر ما ينفر منه الطلبة هو التكرار والمواجهة: أن تبلغ مرشحاً أنه لم يقبل، وأن تجلس في اجتماع إنهاء خدمة، وأن تلاحق أوراقاً لا يرسلها أصحابها. وعبء الامتثال نفسه هو ما يجعل هذه الشهادة قابلة للتوظيف، لأن كل جهة عمل في الخليج تحتاج من يفهم نظام النسب وقانون العمل، وهذه الحاجة تتسع ولا تضيق. والحكم الشخصي وحفظ الأسرار هنا أهم من الدرجات، ومن لا يستطيع كتمان معلومة لا يبقى طويلاً."}, "subj": {"en": ["Business Studies", "English", "Arabic"], "ar": ["إدارة الأعمال", "اللغة الإنجليزية", "اللغة العربية"]}, "u": {"bh": ["American University of Bahrain", "Gulf University"], "sa": ["King Fahd University of Petroleum and Minerals", "King Abdulaziz University", "Effat University", "Prince Mohammad Bin Fahd University", "Dar Al-Hekma University"], "ae": ["UAE University", "Higher Colleges of Technology", "Abu Dhabi University", "Canadian University Dubai", "University of Sharjah"], "qa": ["University of Doha for Science and Technology", "Lusail University"], "kw": ["American University of Kuwait"], "om": ["Middle East College"]}},
{"id": "mis", "g": "biz", "n": {"en": "Management Information Systems", "ar": "نظم المعلومات الإدارية"}, "study": {"en": "Programming and databases in the early years, then systems analysis and design, networks, enterprise systems such as ERP, data analytics and information security, sitting on top of an ordinary business core of accounting, finance and management. Four years. You write code, but less of it and at a shallower level than a computer science student, and you spend far more time on requirements, processes and how an organisation actually uses a system.", "ar": "البرمجة وقواعد البيانات في السنوات الأولى، ثم تحليل النظم وتصميمها، والشبكات، ونظم المؤسسات مثل تخطيط موارد المؤسسة، وتحليل البيانات، وأمن المعلومات، فوق أساس إداري معتاد من محاسبة وتمويل وإدارة. أربع سنوات. وستكتب شيفرة برمجية، لكن أقل وأقل عمقاً مما يكتبه طالب علوم الحاسوب، وستقضي وقتاً أطول بكثير في المتطلبات والعمليات وفي كيفية استخدام المؤسسة للنظام فعلياً."}, "day": {"en": "You sit between the business side and the technical team. You pull requirements out of people who cannot describe what they want, write them down precisely, configure or specify a system, test it, run the rollout, train the users and deal with what breaks. Business analyst, systems analyst, ERP consultant and data analyst are the usual titles. A large part of the week is meetings, documentation and diagrams.", "ar": "تجلس بين جانب الأعمال والفريق التقني. تستخرج المتطلبات من أشخاص لا يستطيعون وصف ما يريدون، وتكتبها بدقة، وتهيئ نظاماً أو تحدد مواصفاته، وتختبره، وتدير إطلاقه، وتدرب المستخدمين، وتعالج ما يتعطل. والمسميات المعتادة هي محلل أعمال، ومحلل نظم، ومستشار تخطيط موارد المؤسسة، ومحلل بيانات. وجزء كبير من الأسبوع اجتماعات وتوثيق ومخططات."}, "hard": {"en": "Two honest points. This is not computer science. If what you want is to build software, do computer science or software engineering, because this degree leaves you a competent specifier and user of systems rather than a strong engineer, and you will lose developer jobs to computer science graduates. Against that, it is probably the most employable business degree in the Gulf at the moment, because every ministry, bank and large company is in the middle of a digitisation programme and needs people who speak both languages. The academic difficulty is that you have to be adequate on both sides and cannot hide in either.", "ar": "نقطتان صريحتان. هذا التخصص ليس علوم حاسوب. فإن كان ما تريده بناء البرمجيات فادرس علوم الحاسوب أو هندسة البرمجيات، لأن هذه الشهادة تخرجك محدداً لمواصفات النظم ومستخدماً كفؤاً لها، لا مهندساً قوياً، وستخسر وظائف المطورين أمام خريجي علوم الحاسوب. وفي المقابل، هي على الأرجح أكثر شهادات إدارة الأعمال قابلية للتوظيف في الخليج اليوم، لأن كل وزارة وبنك وشركة كبيرة في منتصف برنامج تحول رقمي، وتحتاج من يتقن اللغتين. أما الصعوبة الدراسية فهي أنك مطالب بأن تكون كفؤاً في الجانبين، ولا تستطيع الاختباء في أحدهما."}, "subj": {"en": ["Mathematics", "Computer Science", "English"], "ar": ["الرياضيات", "علوم الحاسوب", "اللغة الإنجليزية"]}, "u": {"bh": ["University of Bahrain", "Applied Science University", "Ahlia University"], "sa": ["King Saud University", "King Abdulaziz University", "King Fahd University of Petroleum and Minerals", "Prince Sultan University", "Prince Mohammad Bin Fahd University"], "ae": [], "qa": [], "kw": ["American University of Kuwait", "Gulf University for Science and Technology", "American University of the Middle East"], "om": []}},
{"id": "entrep", "g": "biz", "n": {"en": "Entrepreneurship", "ar": "ريادة الأعمال"}, "study": {"en": "The standard business core of accounting, finance, marketing and operations, with a layer on top covering opportunity assessment, business models, venture finance, intellectual property and small business management. Four years, built around projects: you write plans, pitch them to panels, and in the better programmes run something small for real. Several Gulf programmes attach an incubator or accelerator placement.", "ar": "الأساس الإداري المعتاد من محاسبة وتمويل وتسويق وعمليات، وفوقه طبقة عن تقييم الفرص، ونماذج العمل، وتمويل المشاريع الناشئة، والملكية الفكرية، وإدارة المنشآت الصغيرة. أربع سنوات قائمة على المشاريع: تكتب خططاً، وتعرضها أمام لجان، وفي البرامج الأفضل تدير مشروعاً صغيراً على أرض الواقع. وعدد من البرامج الخليجية يربط الطالب بحاضنة أو مسرعة أعمال."}, "day": {"en": "There is no single entrepreneurship job. Graduates either start something, join an early stage company where you do a bit of everything and most of it badly at first, or work in the layer around startups: incubators, accelerators, venture funds, the small business development agencies every Gulf government now runs, family offices and corporate innovation teams. Days inside a young company are unglamorous, chasing a late payment, replacing a supplier, doing your own bookkeeping.", "ar": "لا توجد وظيفة واحدة اسمها ريادة الأعمال. فالخريج إما أن يبدأ مشروعه، أو ينضم إلى شركة في طور مبكر يعمل فيها في كل شيء وبإتقان ناقص في البداية، أو يعمل في الطبقة المحيطة بالشركات الناشئة: الحاضنات، والمسرعات، وصناديق الاستثمار الجريء، وهيئات تنمية المنشآت الصغيرة التي أنشأتها كل حكومة خليجية، ومكاتب العائلات، وفرق الابتكار في الشركات الكبرى. وأيام الشركة الفتية غير براقة: ملاحقة دفعة متأخرة، واستبدال مورد، ومسك دفاترك بنفسك."}, "hard": {"en": "Be clear about this one. Entrepreneurship is mostly learned by doing rather than by studying, and no classroom gives you the tolerance for uncertainty that the work requires. What the degree genuinely gives you is access: competition funding, university incubators, the government support programmes such as Tamkeen in Bahrain and Monsha'at in Saudi Arabia, and a network of people in the same position at the same time. Inside the Gulf that access is worth real money. A student who is certain they want to build a company may get more from a degree in the field they intend to build in, plus an incubator, than from this one. Think about that before you choose it.", "ar": "كن واضحاً هنا. ريادة الأعمال تتعلم بالممارسة أكثر مما تتعلم بالدراسة، ولا توجد قاعة درس تمنحك القدرة على تحمل الغموض التي يتطلبها هذا العمل. أما ما تمنحه الشهادة فعلاً فهو الوصول: تمويل المسابقات، وحاضنات الجامعات، وبرامج الدعم الحكومية مثل تمكين في البحرين ومنشآت في السعودية، وشبكة من أقران في الموقف نفسه في الوقت نفسه. وهذا الوصول في الخليج يساوي مالاً حقيقياً. والطالب الواثق من رغبته في تأسيس شركة قد يستفيد من شهادة في المجال الذي ينوي البناء فيه، مع حاضنة أعمال، أكثر مما يستفيد من هذا التخصص. ففكر في ذلك قبل أن تختاره."}, "subj": {"en": ["Business Studies", "Mathematics", "English"], "ar": ["إدارة الأعمال", "الرياضيات", "اللغة الإنجليزية"]}, "u": {"bh": ["University of Bahrain"], "sa": [], "ae": ["UAE University", "Canadian University Dubai"], "qa": ["Lusail University"], "kw": ["American International University Kuwait"], "om": ["Modern College of Business and Science"]}},
{"id": "insurance", "g": "biz", "n": {"en": "Insurance and Risk Management", "ar": "التأمين وإدارة المخاطر"}, "study": {"en": "Probability and statistics first, then insurance principles, underwriting, claims, reinsurance and corporate risk management, with takaful and the Sharia structure of cooperative insurance in most Gulf programmes. Four years. There is more mathematics in it than in a general business degree and less than in actuarial science, and the professional examinations that carry weight in this industry usually begin after graduation.", "ar": "الاحتمالات والإحصاء أولاً، ثم مبادئ التأمين، والاكتتاب، والمطالبات، وإعادة التأمين، وإدارة المخاطر في المنشآت، مع التأمين التكافلي والبنية الشرعية للتأمين التعاوني في معظم البرامج الخليجية. أربع سنوات. والرياضيات فيه أكثر مما في شهادة إدارة أعمال عامة وأقل مما في علوم الاكتوارية، أما الاختبارات المهنية التي يعتد بها في هذه الصناعة فتبدأ عادة بعد التخرج."}, "day": {"en": "Underwriting is reading a risk and putting a price on it: a fleet of lorries, a construction project, a company medical scheme. Claims is establishing what happened and deciding what is payable, which means telling people no and then defending the decision. Risk management inside a company is identifying what could go wrong, buying cover for it, and writing procedures everybody ignores until something happens. Broking is sales. Actuarial work is modelling, and it needs years of examinations on top of the degree.", "ar": "الاكتتاب أن تقرأ خطراً وتضع له سعراً: أسطول شاحنات، أو مشروع إنشاءات، أو برنامج تأمين طبي لشركة. والمطالبات أن تثبت ما حدث وتقرر ما يستحق الدفع، ومعنى ذلك أن تقول لا ثم تدافع عن قرارك. وإدارة المخاطر داخل المنشأة أن تحدد ما يمكن أن يسوء، وتشتري له غطاء، وتكتب إجراءات يتجاهلها الجميع حتى يقع شيء. والوساطة عمل بيعي. أما العمل الاكتواري فنمذجة، ويحتاج سنوات من الاختبارات فوق الشهادة."}, "hard": {"en": "It is unglamorous and very few students choose it, which is precisely why the ones who do get hired. Gulf insurance markets are expanding, health cover has been made compulsory in several countries, takaful keeps growing, and the region has a long standing shortage of qualified actuaries and underwriters, so a local graduate who can do the mathematics is scarce. The hard parts are the statistics, the professional examinations that run for years alongside a full time job, and the fact that claims work is built on conflict.", "ar": "تخصص غير براق يختاره عدد قليل جداً من الطلبة، وهذا بالضبط سبب سهولة توظيف من يختاره. فأسواق التأمين الخليجية تتوسع، والتأمين الصحي صار إلزامياً في عدة دول، والتكافل ينمو، وتعاني المنطقة نقصاً مزمناً في الاكتواريين والمكتتبين المؤهلين، ما يجعل الخريج المحلي القادر على الرياضيات نادراً. أما الصعوبات فهي الإحصاء، والاختبارات المهنية التي تمتد سنوات إلى جانب وظيفة بدوام كامل، وكون عمل المطالبات قائماً على النزاع."}, "subj": {"en": ["Mathematics", "Business Studies", "English"], "ar": ["الرياضيات", "إدارة الأعمال", "اللغة الإنجليزية"]}, "u": {"bh": [], "sa": ["Imam Mohammad Ibn Saud Islamic University", "Taif University"], "ae": [], "qa": ["Lusail University"], "kw": [], "om": ["Modern College of Business and Science"]}},
{"id": "healthmgmt", "g": "biz", "n": {"en": "Healthcare Management", "ar": "إدارة الرعاية الصحية"}, "study": {"en": "Health systems and policy, hospital operations, health economics and financing, quality and patient safety, health informatics, medical terminology and health law, on top of a management core of accounting, finance and human resources. Four years, usually with a placement inside a hospital administration department. You learn enough clinical vocabulary to hold a conversation with a consultant, and no clinical skills at all.", "ar": "النظم والسياسات الصحية، وتشغيل المستشفيات، واقتصاديات التمويل الصحي، والجودة وسلامة المرضى، والمعلوماتية الصحية، والمصطلحات الطبية، والتشريعات الصحية، فوق أساس إداري من محاسبة وتمويل وموارد بشرية. أربع سنوات، وعادة مع تدريب داخل إدارة مستشفى. وتتعلم من المفردات السريرية ما يكفي لمحادثة استشاري، ولا تتعلم أي مهارة سريرية."}, "day": {"en": "You run the parts of a hospital that are not medicine. Bed capacity and patient flow, staffing rotas, supply and pharmacy contracts, insurance claims and the revenue cycle, accreditation preparation, complaints, and the meeting where a clinical department wants equipment the budget will not cover. There is no patient contact in the clinical sense. You are inside the building and the pressure of the building reaches you, but nobody hands you a needle.", "ar": "تدير من المستشفى كل ما ليس طباً. سعة الأسرة وانسياب المرضى، وجداول المناوبات، وعقود التوريد والصيدلية، ومطالبات التأمين والدورة الإيرادية، والاستعداد للاعتماد، والشكاوى، والاجتماع الذي يطلب فيه قسم سريري جهازاً لا تحتمله الموازنة. ولا يوجد تعامل سريري مع المرضى. أنت داخل المبنى ويصلك ضغط المبنى، لكن لا أحد يناولك إبرة."}, "hard": {"en": "Clinical staff often do not respect administrators, and a large part of the job is persuading doctors and nurses to do something they regard as bureaucracy. Accreditation cycles and the revenue cycle are relentless and full of detail. The upside is that the Gulf is in the middle of a long hospital building programme, in Saudi Arabia most of all, and a new hospital needs administrators before it needs almost anything else, so this is one of the few health related degrees where demand is visible and the training is short. It is also the honest answer for a student who wants to work in healthcare and does not want the clinical side.", "ar": "كثيراً ما لا يحترم الكادر السريري الإداريين، وجزء كبير من العمل إقناع الأطباء والممرضين بأمور يعدونها بيروقراطية. ودورات الاعتماد والدورة الإيرادية لا تتوقف وتفاصيلها كثيرة. وفي المقابل، يعيش الخليج برنامج بناء مستشفيات طويلاً، وفي السعودية أكثر من غيرها، والمستشفى الجديد يحتاج إداريين قبل أن يحتاج أي شيء آخر تقريباً، فهذه من الشهادات الصحية القليلة التي يكون فيها الطلب مرئياً ومدة الدراسة قصيرة. وهي أيضاً الجواب الصادق لطالب يريد العمل في القطاع الصحي ولا يريد الجانب السريري."}, "subj": {"en": ["Business Studies", "Biology", "English"], "ar": ["إدارة الأعمال", "الأحياء", "اللغة الإنجليزية"]}, "u": {"bh": [], "sa": ["King Saud University", "King Abdulaziz University"], "ae": [], "qa": ["University of Doha for Science and Technology"], "kw": [], "om": []}},
{"id": "fashion", "g": "soc", "n": {"en": "Fashion Design", "ar": "تصميم الأزياء"}, "study": {"en": "Drawing and illustration first, then pattern cutting, garment construction, textiles and fibre science, and the business layer: costing, sourcing, merchandising and buying. Four years in most Gulf programmes, ending in a portfolio and a graduation collection you cut and sew yourself. This is not Graphic and Multimedia Design, which is covered separately on this site. There the output is a screen or a printed page, here it is a physical object that has to fit a body, survive a wash and cost less to make than it sells for.", "ar": "الرسم والإظهار أولاً، ثم قص الباترون وتنفيذ الملابس وعلوم المنسوجات والألياف، ثم الطبقة التجارية: التكلفة والتوريد وتخطيط البضائع والشراء. أربع سنوات في معظم البرامج الخليجية تنتهي بملف أعمال ومجموعة تخرج تقصها وتخيطها بنفسك. وهذا ليس تصميم الجرافيك والوسائط المتعددة، وهو تخصص مستقل على هذا الموقع. هناك يكون الناتج شاشة أو صفحة مطبوعة، وهنا جسم مادي عليه أن يناسب جسد إنسان وأن يحتمل الغسيل وأن تقل كلفة صنعه عن سعر بيعه."}, "day": {"en": "Studio hours are long and much of the work is repetitive: the same seam unpicked and resewn, the same sleeve redrafted until it hangs right. In the job itself, the Gulf market is overwhelmingly retail, buying and merchandising rather than design. A normal Tuesday is more likely to be a range plan, a supplier call about a delayed shipment, a fitting session, or a decision about how many units of one colourway to order, than it is to be sketching.", "ar": "ساعات المشغل طويلة وكثير من العمل متكرر: الحياكة نفسها تفك وتعاد، والكم نفسه يعاد رسمه حتى ينسدل كما ينبغي. أما في الوظيفة ذاتها فالسوق الخليجي في معظمه تجزئة وشراء وتخطيط بضائع أكثر منه تصميماً. والثلاثاء العادي غالباً خطة تشكيلة، أو مكالمة مع مورد بشأن شحنة متأخرة، أو جلسة قياس، أو قرار بعدد القطع المطلوبة من لون واحد، لا رسم تصاميم."}, "hard": {"en": "The honest part is where graduates end up. Most do not design collections. They work in brand, buying, merchandising, production or retail management, and the small number of design posts are concentrated in a handful of houses and are fought over. The genuinely new development is Saudi Arabia's Fashion Commission, which since 2020 has been building the sector deliberately through funding, incubators, training and local manufacturing, so there is now a domestic industry to enter that did not exist ten years ago. Take that seriously without assuming it has already produced enough design jobs to go round.", "ar": "الجزء الصادق هو أين ينتهي الخريجون. أغلبهم لا يصممون مجموعات. يعملون في العلامات التجارية والشراء وتخطيط البضائع والإنتاج وإدارة التجزئة، والوظائف التصميمية القليلة تتركز في عدد محدود من الدور ويتنافس عليها كثيرون. والتطور الجديد فعلاً هو هيئة الأزياء السعودية، التي تبني القطاع عن قصد منذ 2020 عبر التمويل والحاضنات والتدريب والتصنيع المحلي، فصارت هناك صناعة محلية يمكن الدخول إليها لم تكن موجودة قبل عشر سنوات. خذ ذلك على محمل الجد دون أن تفترض أنها أنتجت بالفعل وظائف تصميم تكفي الجميع."}, "subj": {"en": ["Art and Design", "Business Studies", "Mathematics"], "ar": ["التربية الفنية", "إدارة الأعمال", "الرياضيات"]}, "u": {"bh": ["Royal University for Women"], "sa": ["Dar Al-Hekma University", "Al-Baha University"], "ae": ["American University in the Emirates", "Dubai Institute of Design and Innovation", "Amity University Dubai"], "qa": ["VCUarts Qatar"], "kw": ["American International University Kuwait"], "om": ["Scientific College of Design", "University of Technology and Applied Sciences"]}},
{"id": "finearts", "g": "soc", "n": {"en": "Fine Arts and Visual Arts", "ar": "الفنون الجميلة والبصرية"}, "study": {"en": "Studio practice in drawing, painting, printmaking, sculpture, photography and installation, alongside art history, theory and weekly critique where your work is discussed in front of the group. Four years, ending in a degree show. The difference from Graphic and Multimedia Design, which this site covers separately, is that there is no client and no brief. Nobody tells you what to make, which sounds like freedom and is in practice the hardest part of the degree.", "ar": "ممارسة في المشغل تشمل الرسم والتصوير الزيتي والطباعة الفنية والنحت والتصوير الضوئي والتجهيز في الفراغ، إلى جانب تاريخ الفن والنظرية وجلسة نقد أسبوعية يناقش فيها عملك أمام المجموعة. أربع سنوات تنتهي بمعرض تخرج. والفرق عن تصميم الجرافيك والوسائط المتعددة، وهو تخصص مستقل على هذا الموقع، أنه لا يوجد عميل ولا يوجد بريف. لا أحد يخبرك بما تصنع، وهذا يبدو حرية وهو عملياً أصعب ما في التخصص."}, "day": {"en": "For the few who work as artists, the week is mostly not making art. It is applications for residencies and grants, framing and shipping, writing about your own work, and chasing galleries. For the majority the day is a job with a salary attached to art: teaching a class, hanging and lighting a show, cataloguing and condition checking a collection, running a foundation's education programme, or producing commercial work in a studio.", "ar": "بالنسبة للقلة الذين يعملون فنانين، معظم الأسبوع ليس صناعة فن. هو طلبات إقامات فنية ومنح، وتأطير وشحن، وكتابة عن عملك، وملاحقة صالات العرض. أما الأغلبية فيومهم وظيفة براتب متصلة بالفن: تدريس حصة، أو تعليق معرض وإضاءته، أو فهرسة مجموعة فنية وفحص حالتها، أو إدارة برنامج تعليمي في مؤسسة ثقافية، أو إنتاج عمل تجاري داخل استوديو."}, "hard": {"en": "This needs saying plainly: very few people anywhere make a living selling their own art, and that is true in the Gulf as well. The realistic routes out of this degree are teaching, galleries, museums, cultural foundations, arts administration and commercial studio work. What has genuinely changed is scale. Qatar Museums, Louvre Abu Dhabi, Sharjah Art Foundation, the Diriyah and AlUla projects and Saudi's Museums Commission have created real institutional jobs that did not exist twenty years ago. That makes this less impossible than it was. It does not make it easy, and you should not choose it expecting a clear path.", "ar": "لا بد من قول هذا بوضوح: قليلون جداً في أي مكان يعيشون من بيع فنهم، وهذا صحيح في الخليج أيضاً. والمسارات الواقعية بعد هذه الشهادة هي التدريس وصالات العرض والمتاحف والمؤسسات الثقافية وإدارة الفنون والعمل في الاستوديوهات التجارية. والذي تغير فعلاً هو الحجم. متاحف قطر واللوفر أبوظبي ومؤسسة الشارقة للفنون ومشروعا الدرعية والعلا وهيئة المتاحف السعودية أوجدت وظائف مؤسسية حقيقية لم تكن موجودة قبل عشرين سنة. هذا يجعل المجال أقل استحالة مما كان. ولا يجعله سهلاً، ولا ينبغي أن تختاره متوقعاً طريقاً واضحاً."}, "subj": {"en": ["Art and Design", "History", "English"], "ar": ["التربية الفنية", "التاريخ", "اللغة الإنجليزية"]}, "u": {"bh": [], "sa": [], "ae": ["Zayed University", "NYU Abu Dhabi"], "qa": ["VCUarts Qatar", "Qatar University"], "kw": [], "om": ["Scientific College of Design"]}},
{"id": "animation", "g": "soc", "n": {"en": "Animation and Game Design", "ar": "الرسوم المتحركة وتصميم الألعاب"}, "study": {"en": "Drawing and the principles of movement first, then 3D modelling, rigging, texturing, lighting, storyboarding and editing, and on the games side level design, game engines such as Unity and Unreal, and enough scripting to build a working prototype. Four years, judged at the end on a showreel or a playable build rather than on your transcript. It sits next to Graphic and Multimedia Design, which this site covers separately, but the difference is real: here things move, and in games the audience acts on them, which means far more code and far more systems thinking.", "ar": "الرسم ومبادئ الحركة أولاً، ثم النمذجة ثلاثية الأبعاد والتحريك الهيكلي والإكساء والإضاءة والقصة المصورة والمونتاج، وفي جانب الألعاب تصميم المراحل ومحركات الألعاب مثل يونيتي وأنريل، وبرمجة تكفي لبناء نموذج أولي يعمل. أربع سنوات يحكم عليك في نهايتها بشريط أعمالك أو بنسخة قابلة للعب لا بسجلك الأكاديمي. وهو مجاور لتصميم الجرافيك والوسائط المتعددة، وهو تخصص مستقل على هذا الموقع، لكن الفرق حقيقي: هنا تتحرك الأشياء، وفي الألعاب يتفاعل معها الجمهور، وهذا يعني برمجة أكثر بكثير وتفكيراً في الأنظمة أكثر بكثير."}, "day": {"en": "Long stretches on one shot or one mechanic, done again after notes, then again. Animation work is a pipeline: you are one station on it, and your file has to open cleanly for the person after you. Games work is the same with a build to keep stable, and deadlines around milestones produce genuine crunch periods. People who love it love the iteration. People who leave usually leave because of it.", "ar": "فترات طويلة على لقطة واحدة أو آلية لعب واحدة، تعاد بعد الملاحظات، ثم تعاد مرة أخرى. عمل التحريك خط إنتاج: أنت محطة واحدة فيه، وملفك يجب أن يفتح نظيفاً عند من يليك. وعمل الألعاب مثله مع نسخة يجب إبقاؤها مستقرة، والمواعيد المرتبطة بالمراحل تنتج فترات ضغط حقيقية. من يحب هذا المجال يحب التكرار فيه. ومن يتركه يتركه بسببه عادة."}, "hard": {"en": "Be clear eyed here, because this is the field on this list where AI has arrived hardest and fastest. Generative tools already produce concept art, style frames, texture and asset variations and in between animation frames at a quality studios are using in live pipelines, and junior asset production roles, which were the traditional way in, are being cut. What survives is direction, animation supervision, systems and level design, technical art and game design thinking, and none of those are entry level jobs. The second honest point is regional: the Gulf has few actual development studios, though Saudi Arabia's Savvy Games Group investment has started to change that.", "ar": "كن واضح النظر هنا، فهذا هو المجال الذي وصل إليه الذكاء الاصطناعي أقوى وأسرع من غيره في هذه القائمة. الأدوات التوليدية تنتج بالفعل الرسوم التصورية ولقطات الأسلوب وتنويعات الإكساء والأصول والإطارات البينية بجودة تستخدمها الاستوديوهات في خطوط إنتاج فعلية، ووظائف إنتاج الأصول للمبتدئين، وهي المدخل التقليدي، تُقلَّص. والذي يبقى هو الإخراج والإشراف على التحريك وتصميم الأنظمة والمراحل والفن التقني والتفكير في تصميم اللعبة، ولا شيء من ذلك وظيفة مبتدئين. والنقطة الصادقة الثانية إقليمية: في الخليج استوديوهات تطوير قليلة فعلاً، وإن كان استثمار مجموعة سافي للألعاب في السعودية قد بدأ يغير ذلك."}, "subj": {"en": ["Art and Design", "Computer Science", "Mathematics"], "ar": ["التربية الفنية", "علوم الحاسب", "الرياضيات"]}, "u": {"bh": [], "sa": [], "ae": ["Zayed University", "Amity University Dubai", "SAE University College Dubai", "Manipal Academy of Higher Education Dubai", "American University in Dubai", "Abu Dhabi University"], "qa": ["Lusail University"], "kw": [], "om": ["Scientific College of Design", "Modern College of Business and Science"]}},
{"id": "journalism", "g": "soc", "n": {"en": "Journalism", "ar": "الصحافة"}, "study": {"en": "News writing and structure, interviewing, media law and ethics, and reporting practice across print, broadcast and digital, usually with a newsroom simulation and a placement. Four years. This site covers Mass Communication and Media separately and the distinction matters: that degree is the wide one, taking in advertising, production, media studies and communication theory. Journalism is the narrow craft inside it, which is finding out what happened, checking that it is true, and writing it so a stranger understands it quickly.", "ar": "كتابة الخبر وبناؤه، وإجراء المقابلات، وقانون الإعلام وأخلاقياته، وتدريب على التغطية في الصحافة المطبوعة والمرئية والرقمية، ومعها عادةً غرفة أخبار تدريبية وتدريب ميداني. أربع سنوات. ويغطي هذا الموقع الإعلام والاتصال الجماهيري في تخصص مستقل، والفرق مهم: ذاك التخصص هو الواسع، ويشمل الإعلان والإنتاج ودراسات الإعلام ونظريات الاتصال. أما الصحافة فهي الحرفة الضيقة داخله، أي أن تعرف ما الذي حدث، وتتحقق من صحته، وتكتبه بحيث يفهمه غريب بسرعة."}, "day": {"en": "Most of the job is contact, not writing. You call people who do not want to talk to you, wait, call again, read documents, sit through a press conference for the one useful sentence in it, then write to a length and a deadline. The writing itself is often the fastest part of the day. Shifts are irregular, and the story you were working on gets dropped when something bigger breaks.", "ar": "معظم العمل تواصل لا كتابة. تتصل بأناس لا يريدون الحديث إليك، وتنتظر، وتتصل مرة أخرى، وتقرأ وثائق، وتحضر مؤتمراً صحفياً كاملاً من أجل جملة واحدة مفيدة فيه، ثم تكتب بطول محدد وموعد محدد. والكتابة نفسها غالباً أسرع أجزاء اليوم. والمناوبات غير منتظمة، والقصة التي تعمل عليها تُترك حين يقع خبر أكبر."}, "hard": {"en": "Two things, and neither is the writing. First, newsroom employment has been shrinking globally for two decades as advertising revenue moved to the large platforms, so there are fewer paid staff posts than there are graduates, and many end up in corporate or government communications instead. Second, media in the Gulf operates under national licensing and publication rules, and a large share of outlets are state owned or state linked. In practice that shapes which subjects are commissioned and how they are framed, and it is worth understanding as a fact about the job before you commit four years to it.", "ar": "أمران، وليس أي منهما الكتابة. أولاً، التوظيف في غرف الأخبار يتقلص عالمياً منذ عقدين مع انتقال عائدات الإعلان إلى المنصات الكبرى، فعدد الوظائف الثابتة أقل من عدد الخريجين، وكثيرون ينتهون إلى الاتصال المؤسسي أو الحكومي بدلاً منها. ثانياً، يعمل الإعلام في الخليج ضمن أنظمة وطنية للترخيص والنشر، ونسبة كبيرة من المؤسسات مملوكة للدولة أو مرتبطة بها. وهذا عملياً يحدد أي الموضوعات تُكلَّف وكيف تُعالَج، ومن المفيد أن تفهمه بوصفه واقعة عن المهنة قبل أن تمنحها أربع سنوات."}, "subj": {"en": ["Arabic", "English", "History"], "ar": ["اللغة العربية", "اللغة الإنجليزية", "التاريخ"]}, "u": {"bh": [], "sa": ["Imam Mohammad Ibn Saud Islamic University"], "ae": ["University of Sharjah", "Canadian University Dubai", "Middlesex University Dubai"], "qa": ["Northwestern University in Qatar"], "kw": [], "om": []}},
{"id": "pr", "g": "soc", "n": {"en": "Advertising and Public Relations", "ar": "الإعلان والعلاقات العامة"}, "study": {"en": "Campaign planning, copywriting, media relations, brand and reputation management, crisis communication, consumer behaviour and measurement, usually with a live client project and an agency placement. Four years. Mass Communication and Media, covered separately here, is the broad media degree. This one is narrower and commercial: it is about persuading a defined audience on behalf of a paying organisation, and being measured on whether it worked.", "ar": "تخطيط الحملات وكتابة النصوص الإعلانية والعلاقات مع وسائل الإعلام وإدارة العلامة والسمعة والاتصال في الأزمات وسلوك المستهلك والقياس، ومعها عادةً مشروع لعميل حقيقي وتدريب في وكالة. أربع سنوات. والإعلام والاتصال الجماهيري، وهو تخصص مستقل هنا، هو الشهادة الإعلامية الواسعة. أما هذا فأضيق وأكثر تجارية: هو إقناع جمهور محدد نيابة عن جهة تدفع، وقياس ما إذا كان ذلك قد نجح."}, "day": {"en": "A great deal of writing and a great deal of coordination. Drafting statements and social copy, building media lists, briefing a spokesperson, chasing approvals through three layers of a client, monitoring coverage, and producing the monthly report that shows what the money bought. Agency work is fast and account driven, in house corporate and government work is slower and more political. Crisis periods are the part that separates people who stay from people who leave.", "ar": "كتابة كثيرة وتنسيق كثير. صياغة بيانات ومحتوى لمنصات التواصل، وبناء قوائم إعلامية، وإعداد المتحدث الرسمي، وملاحقة الموافقات عبر ثلاث طبقات لدى العميل، ورصد التغطية، وإعداد التقرير الشهري الذي يبين ما اشتراه المال. العمل في الوكالات سريع ومحكوم بالحسابات، والعمل داخل الشركات والجهات الحكومية أبطأ وأكثر سياسية. وفترات الأزمات هي ما يفصل بين من يبقى في المهنة ومن يتركها."}, "hard": {"en": "The honest note here is a positive one, which is unusual on this site. This is the commercially healthy end of media in the Gulf. Corporate communications, government and entity communications around the national visions, and agency work are all genuinely hiring, and salaries are respectable. The difficulty is the nature of the work rather than the availability of it: you are answerable to a client's judgement rather than your own, hours around a launch or an incident are unpredictable, and the first two years are largely drafting and monitoring, which is exactly the layer AI is now doing.", "ar": "الملاحظة الصادقة هنا إيجابية، وهذا غير معتاد في هذا الموقع. هذا هو الطرف السليم تجارياً من الإعلام في الخليج. الاتصال المؤسسي، والاتصال الحكومي واتصال الجهات المرتبطة بالرؤى الوطنية، وعمل الوكالات، كلها توظف فعلاً، والرواتب محترمة. والصعوبة في طبيعة العمل لا في توفره: أنت مسؤول أمام حكم العميل لا حكمك، وساعات العمل قرب إطلاق أو حادثة غير متوقعة، والسنتان الأوليان في معظمهما صياغة ورصد، وهي بالضبط الطبقة التي صار الذكاء الاصطناعي يؤديها."}, "subj": {"en": ["English", "Arabic", "Business Studies"], "ar": ["اللغة الإنجليزية", "اللغة العربية", "إدارة الأعمال"]}, "u": {"bh": [], "sa": ["Imam Mohammad Ibn Saud Islamic University"], "ae": ["University of Sharjah", "Canadian University Dubai", "American University in the Emirates"], "qa": [], "kw": [], "om": []}},
{"id": "sportmgmt", "g": "soc", "n": {"en": "Sport Management", "ar": "إدارة الرياضة"}, "study": {"en": "Management, marketing, finance and accounting, contract and sport law, event operations, facility management, sponsorship and governance, with a placement at a club, federation or event. Four years. Be clear about what this is: it is a business degree pointed at one industry. You will study very little sport science and you will not be training athletes.", "ar": "إدارة وتسويق ومالية ومحاسبة، وقانون العقود والقانون الرياضي، وتشغيل الفعاليات وإدارة المنشآت والرعاية والحوكمة، مع تدريب في نادٍ أو اتحاد أو فعالية. أربع سنوات. وكن واضحاً بشأن ماهيته: هو شهادة إدارة أعمال موجهة إلى قطاع واحد. ستدرس قدراً قليلاً جداً من علوم الرياضة ولن تدرب رياضيين."}, "day": {"en": "Outside match days it is an office job: budgets, sponsor reporting, ticketing numbers, supplier contracts, scheduling, permits and safety paperwork. On event days it is fifteen hours on your feet solving problems in order, from a broken turnstile to a delayed team bus. The mix of very ordinary administration and a small number of intense days is the actual shape of this career.", "ar": "خارج أيام المباريات هو عمل مكتبي: موازنات، وتقارير للرعاة، وأرقام تذاكر، وعقود موردين، وجداول، وتصاريح وأوراق سلامة. وفي أيام الفعاليات هو خمس عشرة ساعة على قدميك تحل المشكلات بالترتيب، من بوابة معطلة إلى حافلة فريق متأخرة. ومزيج الإدارة العادية جداً مع عدد قليل من الأيام المكثفة هو الشكل الحقيقي لهذه المهنة."}, "hard": {"en": "The opportunity is real and large. Qatar's 2022 World Cup, Saudi Arabia's Pro League spending and its hosting of the 2034 World Cup, Formula 1 rounds in Bahrain, Abu Dhabi, Jeddah and Qatar, and the federations and new clubs around all of it have created a volume of sport jobs the region has never had. The honest qualification is where those jobs sit. Operational and administrative roles are plentiful and often unglamorous, and the visible roles, agent, club commercial director, national federation leadership, attract enormous competition from people with far more experience, frequently from Europe. Expect to start with a clipboard.", "ar": "الفرصة حقيقية وكبيرة. كأس العالم في قطر 2022، وإنفاق دوري روشن السعودي واستضافة السعودية لكأس العالم 2034، وجولات الفورمولا 1 في البحرين وأبوظبي وجدة وقطر، والاتحادات والأندية الجديدة حول ذلك كله، أوجدت حجماً من الوظائف الرياضية لم تعرفه المنطقة من قبل. والتحفظ الصادق هو موقع تلك الوظائف. الأدوار التشغيلية والإدارية وفيرة وغير براقة غالباً، أما الأدوار الظاهرة، كالوكيل والمدير التجاري للنادي وقيادة الاتحادات الوطنية، فتجتذب منافسة هائلة من أصحاب خبرة أطول بكثير، وكثير منهم من أوروبا. توقع أن تبدأ بحافظة أوراق في يدك."}, "subj": {"en": ["Mathematics", "Business Studies", "English"], "ar": ["الرياضيات", "إدارة الأعمال", "اللغة الإنجليزية"]}, "u": {"bh": [], "sa": [], "ae": ["Canadian University Dubai"], "qa": ["Qatar University"], "kw": [], "om": []}},
{"id": "music", "g": "soc", "n": {"en": "Music and Performing Arts", "ar": "الموسيقى والفنون الأدائية"}, "study": {"en": "Instrumental or vocal study, theory and harmony, ear training, music history including Arab maqam traditions, composition and ensemble work, and on the performing arts side acting, movement and stagecraft. Four years, with daily individual practice that no timetable shows. Entry usually requires an audition, so you need to be playing seriously before you apply, not after.", "ar": "دراسة آلة أو غناء، ونظريات وهارموني، وتدريب سمعي، وتاريخ الموسيقى بما فيه تقاليد المقام العربي، وتأليف وعمل جماعي، وفي جانب الفنون الأدائية تمثيل وحركة وفنون خشبة المسرح. أربع سنوات، مع تمرين فردي يومي لا يظهر في أي جدول. والقبول يتطلب عادةً اختبار أداء، أي أن عليك أن تكون عازفاً جاداً قبل التقديم لا بعده."}, "day": {"en": "For performers, the day is practice, rehearsal and a small number of paid engagements, and the calendar is never full in the way a salary is. For most graduates the income is teaching, in schools, in private studios or in institutes, alongside session work, arranging, production, and coordinating arts programmes for cultural bodies. It is portfolio work, several sources at once, rather than one job.", "ar": "بالنسبة للمؤدين، اليوم تمرين وبروفة وعدد قليل من الحفلات المدفوعة، والتقويم لا يمتلئ أبداً كما يمتلئ راتب. وبالنسبة لمعظم الخريجين يأتي الدخل من التدريس، في المدارس أو الاستوديوهات الخاصة أو المعاهد، إلى جانب عمل التسجيلات والتوزيع والإنتاج وتنسيق البرامج الفنية لدى الجهات الثقافية. هو عمل بمصادر متعددة في وقت واحد، لا وظيفة واحدة."}, "hard": {"en": "This is the smallest field on this site and the numbers say so. Only two or three universities in the whole Gulf teach music at bachelor's level, so most serious students either go abroad, to Egypt, Jordan, Europe or the United States, or study privately with a teacher and take a different degree. There is also a social dimension worth naming honestly: in parts of the region a music degree still needs explaining to family, and that is a real cost some students pay. If you are not already committed to an instrument, this is not the degree to discover music through.", "ar": "هذا أصغر مجال في هذا الموقع، والأرقام تقول ذلك. جامعتان أو ثلاث فقط في الخليج كله تدرّس الموسيقى في مرحلة البكالوريوس، فمعظم الطلبة الجادين إما يسافرون إلى مصر أو الأردن أو أوروبا أو الولايات المتحدة، وإما يدرسون على يد معلم خاص ويأخذون شهادة في تخصص آخر. وهناك بعد اجتماعي يستحق الذكر بصراحة: في بعض أنحاء المنطقة ما زالت شهادة الموسيقى تحتاج إلى شرح أمام الأسرة، وهذه كلفة حقيقية يدفعها بعض الطلبة. وإن لم تكن ملتزماً بآلة بالفعل، فليست هذه الشهادة التي تكتشف الموسيقى من خلالها."}, "subj": {"en": ["Music", "English", "Mathematics"], "ar": ["الموسيقى", "اللغة الإنجليزية", "الرياضيات"]}, "u": {"bh": [], "sa": ["King Khalid University"], "ae": ["NYU Abu Dhabi"], "qa": [], "kw": [], "om": ["Sultan Qaboos University"]}},
{"id": "vet", "g": "health", "n": {"en": "Veterinary Medicine", "ar": "الطب البيطري"}, "study": {"en": "Anatomy, physiology, pathology, microbiology and pharmacology across several species, then clinical years covering surgery, internal medicine, reproduction, food hygiene and veterinary public health. Five to six years in Gulf programmes, with a heavy practical component and rotations through farms, clinics and abattoirs. Dissection starts early and never really stops.", "ar": "علم التشريح ووظائف الأعضاء وعلم الأمراض والأحياء الدقيقة وعلم الأدوية في عدة أنواع من الحيوانات، ثم سنوات سريرية تشمل الجراحة والباطنة والتناسليات وسلامة الأغذية والصحة العامة البيطرية. خمس إلى ست سنوات في البرامج الخليجية، مع جانب عملي ثقيل وتدريب في المزارع والعيادات والمسالخ. والتشريح يبدأ مبكراً ولا يتوقف تقريباً."}, "day": {"en": "The work in the Gulf splits three ways. Camel and equine practice, which is the prestigious and best paid end and sits around racing, breeding and endurance stables. Livestock, dairy and food safety work, much of it on farms and inside government veterinary services. And small animal clinics in the cities, where the caseload is vaccinations, skin, dentistry and emergency surgery on cats and dogs.", "ar": "العمل في الخليج ينقسم ثلاثة أقسام. طب الإبل والخيل، وهو الطرف الأرفع والأعلى دخلاً، ويدور حول السباق والإنتاج وسباقات القدرة. وعمل الثروة الحيوانية والألبان وسلامة الغذاء، ومعظمه في المزارع وداخل الخدمات البيطرية الحكومية. وعيادات الحيوانات الأليفة في المدن، وأغلب حالاتها تطعيمات وأمراض جلدية وأسنان وجراحات طارئة للقطط والكلاب."}, "hard": {"en": "This is surgery on living animals, so anyone who chose it to avoid blood is in the wrong degree, and that is a common and real mistake. The workload matches human medicine, the course is longer than most, and admission is competitive because the number of seats in the Gulf is small. Injury is ordinary here, you will be kicked, bitten and scratched, and large animal work happens outdoors in Gulf summers.", "ar": "هذه جراحة على حيوان حي، فمن اختار التخصص هرباً من الدم فهو في المكان الخطأ، وهذا خطأ شائع وحقيقي. حجم الدراسة يوازي الطب البشري، والمدة أطول من أغلب التخصصات، والقبول تنافسي لأن عدد المقاعد في الخليج قليل. والإصابة أمر عادي هنا، سيصيبك الركل والعض والخدش، وعمل الحيوانات الكبيرة يجري في الخارج تحت صيف الخليج."}, "subj": {"en": ["Biology", "Chemistry", "Mathematics"], "ar": ["الأحياء", "الكيمياء", "الرياضيات"]}, "u": {"bh": [], "sa": ["King Faisal University", "Qassim University"], "ae": ["United Arab Emirates University"], "qa": [], "kw": [], "om": ["A'Sharqiyah University"]}},
{"id": "optometry", "g": "health", "n": {"en": "Optometry", "ar": "البصريات"}, "study": {"en": "Optics, ocular anatomy and physiology and visual neuroscience, then clinical refraction, contact lenses, binocular vision and the detection of eye disease. In Saudi Arabia the route is usually a five to six year Doctor of Optometry rather than a four year BSc, and it includes a clinical internship year. Expect more physics than students anticipate.", "ar": "البصريات وتشريح العين ووظائفها وعلم الأعصاب البصري، ثم العمل السريري في قياس الانكسار والعدسات اللاصقة والرؤية الثنائية واكتشاف أمراض العين. والمسار في السعودية غالباً دكتور بصريات من خمس إلى ست سنوات لا بكالوريوس من أربع، ويتضمن سنة امتياز سريرية. وتوقع فيزياء أكثر مما يتصور الطالب."}, "day": {"en": "Clinic work, mostly seated, with a chair, a slit lamp and a patient in front of you. You measure vision, prescribe spectacles and contact lenses, screen for glaucoma, diabetic retinopathy and cataract, and refer on to an ophthalmologist when the finding is surgical. It is one of the very few clinical careers with almost no exposure to blood or body fluids, which makes it a serious answer for a student who wants healthcare without that.", "ar": "عمل عيادي، معظمه جالس، أمامك كرسي فحص ومجهر شقي ومريض. تقيس الإبصار، وتصف النظارات والعدسات اللاصقة، وتفحص للكشف عن الجلوكوما واعتلال الشبكية السكري والساد، وتحيل إلى طبيب العيون حين تكون الحالة جراحية. وهو من المسارات السريرية القليلة جداً التي تكاد تخلو من التعرض للدم وسوائل الجسم، وهذا يجعله جواباً جدياً لمن يريد مهنة صحية بلا ذلك."}, "hard": {"en": "The optics and the physics are the usual reason people struggle, and the work is repetitive by design, you will perform the same refraction many times a day. Scope of practice differs across the Gulf, so check what an optometrist is licensed to do in the country you intend to work in before you commit. Retail optical chains pay less than hospital posts, and they are where most graduates start.", "ar": "البصريات والفيزياء هي السبب المعتاد للتعثر، والعمل متكرر بحكم تصميمه، وستجري القياس نفسه مرات كثيرة في اليوم. ونطاق الممارسة يختلف بين دول الخليج، فتحقق مما يسمح لأخصائي البصريات بعمله في البلد الذي تنوي العمل فيه قبل أن تلتزم. وسلاسل النظارات التجارية تدفع أقل من وظائف المستشفيات، وهي حيث يبدأ معظم الخريجين."}, "subj": {"en": ["Physics", "Biology", "Mathematics"], "ar": ["الفيزياء", "الأحياء", "الرياضيات"]}, "u": {"bh": [], "sa": ["King Saud University", "Qassim University"], "ae": ["Gulf Medical University"], "qa": [], "kw": [], "om": []}},
{"id": "ems", "g": "health", "n": {"en": "Emergency Medical Services and Paramedic Science", "ar": "الخدمات الطبية الطارئة والإسعاف"}, "study": {"en": "Anatomy and physiology, pharmacology, trauma and medical emergency management, airway skills, cardiac life support and mass casualty planning. Four years in the Gulf, with a very large clinical and ambulance placement component, followed by licensing before you can practise. Most of the assessment is practical and done under time pressure.", "ar": "التشريح ووظائف الأعضاء وعلم الأدوية وإدارة الإصابات والحالات الطبية الطارئة ومهارات المجرى الهوائي ودعم الحياة القلبي وخطط الإصابات الجماعية. أربع سنوات في الخليج، مع تدريب سريري وإسعافي ميداني كبير جداً، ثم ترخيص قبل الممارسة. ومعظم التقويم عملي ويجري تحت ضغط الوقت."}, "day": {"en": "You go to people on the worst day of their life. Road traffic collisions, cardiac arrests, falls, burns, overdoses, births, and a great many calls that turn out to be minor. This is the most intense trauma exposure of any degree on this site, and it is not something a lecture theatre prepares you for. Shifts run twelve hours including nights and weekends, and the job has genuine physical requirements, you will lift patients and carry equipment up stairs.", "ar": "تذهب إلى الناس في أسوأ يوم في حياتهم. حوادث طرق وسكتات قلبية وسقوط وحروق وجرعات زائدة وولادات، وكثير من البلاغات تنتهي بسيطة. هذا أشد تعرض للإصابات المروعة بين كل التخصصات في هذا الموقع، وليس شيئاً تهيئك له قاعة المحاضرات. والمناوبات اثنتا عشرة ساعة تشمل الليل ونهاية الأسبوع، وللعمل متطلبات بدنية حقيقية، سترفع المرضى وتحمل المعدات في السلالم."}, "hard": {"en": "The exposure itself. You will see death, including the death of children, and you will see it in front of families. Burnout and turnover in prehospital care are high everywhere and the Gulf is no exception. There are also fitness and medical standards for ambulance service employment, so read them before you enrol rather than after.", "ar": "التعرض نفسه. سترى الموت، ومنه موت الأطفال، وستراه أمام الأسر. والاحتراق الوظيفي ودوران العاملين في الإسعاف مرتفعان في كل مكان، والخليج ليس استثناء. وهناك أيضاً شروط لياقة وشروط طبية للتوظيف في هيئات الإسعاف، فاقرأها قبل التسجيل لا بعده."}, "subj": {"en": ["Biology", "Chemistry", "Physical Education"], "ar": ["الأحياء", "الكيمياء", "التربية البدنية"]}, "u": {"bh": [], "sa": ["King Saud University", "King Saud bin Abdulaziz University for Health Sciences"], "ae": [], "qa": ["University of Doha for Science and Technology"], "kw": [], "om": []}},
{"id": "healthinfo", "g": "health", "n": {"en": "Health Information Management and Health Informatics", "ar": "إدارة المعلومات الصحية والمعلوماتية الصحية"}, "study": {"en": "Medical terminology, anatomy and disease classification, then clinical coding, health record standards, databases, health information systems and analytics. Four years, usually inside a college of public health or applied medical sciences, with a practicum in a hospital records or informatics department. There is real computing in it, more than the word records suggests.", "ar": "المصطلحات الطبية والتشريح وتصنيف الأمراض، ثم الترميز الطبي ومعايير السجلات الصحية وقواعد البيانات ونظم المعلومات الصحية والتحليلات. أربع سنوات، غالباً داخل كلية للصحة العامة أو للعلوم الطبية التطبيقية، مع تدريب عملي في قسم السجلات أو المعلوماتية في مستشفى. وفيه حوسبة حقيقية، أكثر مما توحي به كلمة سجلات."}, "day": {"en": "Desk work inside a hospital or a health authority. You code diagnoses and procedures for claims and statistics, audit the quality of records, manage access and privacy, produce reports for management, and support the electronic health record when clinicians complain that it is wrong. Almost no patient contact and almost no body fluids, which is the whole point of it for many students.", "ar": "عمل مكتبي داخل مستشفى أو هيئة صحية. ترمز التشخيصات والإجراءات لأغراض المطالبات والإحصاء، وتدقق جودة السجلات، وتدير الصلاحيات والخصوصية، وتخرج التقارير للإدارة، وتسند السجل الصحي الإلكتروني حين يشتكي الأطباء من خطأ فيه. لا تعامل مع المرضى تقريباً ولا تعرض لسوائل الجسم، وهذا هو سبب اختياره عند كثير من الطلبة."}, "hard": {"en": "Two problems. The work is detailed and rule bound, and students who need variety find the coding side dull within a year. And the title is not well understood by employers outside health, so the job search is narrower than a general information systems degree would give you. The upside is real, Gulf health systems are digitising quickly and hospitals cannot run without this function.", "ar": "مشكلتان. العمل تفصيلي ومحكوم بقواعد، ومن يحتاج التنويع يجد جانب الترميز مملاً خلال سنة. والمسمى غير مفهوم جيداً لدى أرباب العمل خارج القطاع الصحي، فيكون البحث عن عمل أضيق مما تعطيه شهادة نظم معلومات عامة. والوجه الآخر حقيقي، فالأنظمة الصحية الخليجية تتحول رقمياً بسرعة، والمستشفيات لا تعمل من دون هذه الوظيفة."}, "subj": {"en": ["Biology", "Computer Science", "Mathematics"], "ar": ["الأحياء", "الحاسوب", "الرياضيات"]}, "u": {"bh": [], "sa": ["Imam Abdulrahman Bin Faisal University", "King Saud bin Abdulaziz University for Health Sciences", "Saudi Electronic University"], "ae": [], "qa": [], "kw": ["Kuwait University"], "om": []}},
{"id": "agri", "g": "sci", "n": {"en": "Agriculture and Food Science", "ar": "العلوم الزراعية والغذائية"}, "study": {"en": "Plant and soil science, crop production, irrigation and water management, animal production and plant protection, alongside food science covering processing, safety and quality. Four years in Gulf universities, with field and laboratory work and a period of practical training. Chemistry and biology carry the first two years.", "ar": "علوم النبات والتربة والإنتاج المحصولي والري وإدارة المياه والإنتاج الحيواني ووقاية النبات، إلى جانب علوم الأغذية من تصنيع وسلامة وجودة. أربع سنوات في الجامعات الخليجية، مع عمل حقلي ومختبري وفترة تدريب عملي. والكيمياء والأحياء تحملان السنتين الأوليين."}, "day": {"en": "Less field and more system than the name suggests. The work sits in controlled environment agriculture, the greenhouses and vertical farms that a Gulf climate forces you into, in aquaculture, in irrigation and water efficiency, in food processing plants, and in food safety and regulation inside bodies such as the Saudi Food and Drug Authority and the Abu Dhabi Agriculture and Food Safety Authority. Field days exist, and the summer ones are hot.", "ar": "حقل أقل ونظام أكثر مما يوحي به الاسم. العمل يقع في الزراعة المحمية والمتحكم ببيئتها، أي البيوت المحمية والمزارع الرأسية التي يفرضها مناخ الخليج، وفي الاستزراع المائي، وفي كفاءة الري والمياه، وفي مصانع الأغذية، وفي سلامة الغذاء والرقابة داخل جهات مثل الهيئة العامة للغذاء والدواء في السعودية وهيئة أبوظبي للزراعة والسلامة الغذائية. والأيام الحقلية موجودة، وأيامها الصيفية حارة."}, "hard": {"en": "The traditional farming image is the problem. Open field agriculture in the Gulf is water constrained and shrinking, and if that is what you pictured you will be disappointed. Salaries in production roles are modest, and the better paid work is in food safety, quality assurance, agritech and regulation. Since 2020 food security has become explicit policy in Saudi Arabia, the UAE and Oman and real money has followed, which is the honest reason this degree is worth more now than it was ten years ago.", "ar": "صورة الزراعة التقليدية هي المشكلة. الزراعة المكشوفة في الخليج مقيدة بالماء وتتقلص، وإن كان هذا ما تخيلته فستصاب بخيبة. والرواتب في وظائف الإنتاج متواضعة، والأعلى أجراً هو سلامة الغذاء وضمان الجودة والتقنيات الزراعية والرقابة. ومنذ 2020 صار الأمن الغذائي سياسة معلنة في السعودية والإمارات وعُمان وتبعه إنفاق حقيقي، وهذا هو السبب الصادق في أن قيمة هذه الشهادة اليوم أعلى مما كانت قبل عشر سنوات."}, "subj": {"en": ["Biology", "Chemistry", "Mathematics"], "ar": ["الأحياء", "الكيمياء", "الرياضيات"]}, "u": {"bh": [], "sa": ["King Saud University", "King Faisal University", "Qassim University"], "ae": ["United Arab Emirates University"], "qa": [], "kw": ["Kuwait University"], "om": ["Sultan Qaboos University"]}},
{"id": "mining", "g": "eng", "n": {"en": "Mining and Geo-engineering", "ar": "هندسة التعدين والجيوتقنية"}, "study": {"en": "Geology and mineralogy, rock mechanics, drilling and blasting, mine design and planning, mineral processing, ventilation, and mine safety and economics. Four to five years with a strong site training component, usually including summer placements at an operating mine. Physics and mathematics carry the early years.", "ar": "الجيولوجيا وعلم المعادن وميكانيكا الصخور والحفر والتفجير وتصميم المناجم وتخطيطها ومعالجة الخامات والتهوية وسلامة المناجم واقتصادياتها. أربع إلى خمس سنوات مع تدريب ميداني قوي في المواقع، وغالباً تدريب صيفي في منجم عامل. والفيزياء والرياضيات تحملان السنوات الأولى."}, "day": {"en": "Site based, and the sites are remote. In Saudi Arabia that means places such as Mahd Adh Dhahab, Al Amar, Bulghah and the phosphate operations at Waad Al Shamal, on rotation rather than a daily commute from a city. The work is mine planning, grade control, blast design, equipment and production supervision, and safety. Office and consultancy roles exist and usually come later in a career.", "ar": "العمل في المواقع، والمواقع بعيدة. في السعودية يعني ذلك أماكن مثل مهد الذهب والأمار وبلغة وعمليات الفوسفات في وعد الشمال، بنظام مناوبات لا بدوام يومي من المدينة. والعمل تخطيط للمنجم وضبط للعيار وتصميم للتفجير وإشراف على المعدات والإنتاج وسلامة. أما الوظائف المكتبية والاستشارية فموجودة وتأتي عادة في مرحلة لاحقة من المسار."}, "hard": {"en": "It is a small field. Saudi Arabia has raised its official estimate of untapped mineral wealth to about 9.4 trillion riyals and is spending accordingly, and Oman has copper and limestone activity, but the number of employers in the whole Gulf is countable on your fingers. Remote rotation is not for everyone, and if you dislike being away from a city for weeks then the career itself is the problem, not just the first job. Commodity prices move, and mining hiring moves with them.", "ar": "المجال صغير. رفعت السعودية تقديرها الرسمي للثروة المعدنية غير المستغلة إلى نحو 9.4 تريليون ريال وتنفق بما يوازي ذلك، ولعُمان نشاط في النحاس والحجر الجيري، لكن عدد أرباب العمل في الخليج كله يعد على الأصابع. ونظام المناوبات البعيدة لا يناسب الجميع، وإن كنت تكره الابتعاد عن المدينة أسابيع فالمشكلة في المهنة نفسها لا في الوظيفة الأولى فقط. وأسعار المعادن تتحرك، والتوظيف يتحرك معها."}, "subj": {"en": ["Mathematics", "Physics", "Chemistry"], "ar": ["الرياضيات", "الفيزياء", "الكيمياء"]}, "u": {"bh": [], "sa": ["King Fahd University of Petroleum and Minerals", "King Abdulaziz University"], "ae": [], "qa": [], "kw": [], "om": ["German University of Technology in Oman"]}},
{"id": "nuclear", "g": "eng", "n": {"en": "Nuclear Engineering", "ar": "الهندسة النووية"}, "study": {"en": "Nuclear physics and reactor theory, thermal hydraulics, radiation detection and shielding, nuclear materials, the fuel cycle, and reactor safety and regulation. Four to five years, heavy on physics and mathematics, with laboratory work in radiation measurement. It is one of the most theoretical engineering degrees you can choose.", "ar": "الفيزياء النووية ونظرية المفاعلات والهيدروليكا الحرارية وكشف الإشعاع والتدريع والمواد النووية ودورة الوقود وأمان المفاعلات وتنظيمها. أربع إلى خمس سنوات، ثقيلة في الفيزياء والرياضيات، مع عمل مختبري في قياس الإشعاع. وهي من أكثر شهادات الهندسة نظرية."}, "day": {"en": "Almost all of it is operations, safety and regulation rather than design. In the Gulf that means the Barakah plant in Abu Dhabi with its four operating units, the regulator FANR, ENEC and its contractors, plus radiation protection work in hospitals and industry. Days are procedures, surveillance testing, safety analysis and documentation, in an industry where paperwork is a safety control and not an irritation.", "ar": "معظم العمل تشغيل وأمان وتنظيم لا تصميم. وفي الخليج يعني ذلك محطة براكة في أبوظبي بوحداتها الأربع العاملة، والهيئة الاتحادية للرقابة النووية، ومؤسسة الإمارات للطاقة النووية ومقاوليها، إضافة إلى الوقاية من الإشعاع في المستشفيات والصناعة. والأيام إجراءات واختبارات دورية وتحليل أمان وتوثيق، في صناعة يعد فيها الورق أداة أمان لا إزعاجاً."}, "hard": {"en": "The field is tiny. Only two universities in the Gulf teach it at bachelor level and there is essentially one large employer in the region, so you must be willing to relocate, to Abu Dhabi at minimum and possibly outside the Gulf. Saudi Arabia has a nuclear programme in preparation and it has moved slowly. Security clearance and nationality requirements apply to many roles, the physics is genuinely hard, and this is not a degree to pick for prestige.", "ar": "المجال ضيق جداً. جامعتان فقط في الخليج تدرسانه في مرحلة البكالوريوس، وهناك عملياً رب عمل كبير واحد في المنطقة، فعليك أن تكون مستعداً للانتقال إلى أبوظبي على الأقل وربما خارج الخليج. وللسعودية برنامج نووي قيد الإعداد وقد تحرك ببطء. وشروط التصريح الأمني والجنسية تنطبق على وظائف كثيرة، والفيزياء صعبة فعلاً، وهذه ليست شهادة تختار من أجل الوجاهة."}, "subj": {"en": ["Physics", "Mathematics", "Chemistry"], "ar": ["الفيزياء", "الرياضيات", "الكيمياء"]}, "u": {"bh": [], "sa": ["King Abdulaziz University"], "ae": ["University of Sharjah"], "qa": [], "kw": [], "om": []}},

let lang = "en", group = "all", query = "";
const $ = id => document.getElementById(id);

function applyChrome(){
  const U = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar"
    ? "استكشف التخصصات الجامعية | د. صقر آل خليفة"
    : "Explore University Majors | Dr. Saqer AlKhalifa";
  $("langToggle").textContent = U.toggle;
  $("t-title").textContent = U.title;
  $("t-sub").textContent = U.sub;
  $("t-quizline").innerHTML = U.quizline;
  $("t-quizbtn").textContent = U.quizbtn;
  $("t-scholline").innerHTML = U.scholline;
  $("t-scholbtn").textContent = U.scholbtn;
  $("t-parline").innerHTML = U.parline;
  $("t-parbtn").textContent = U.parbtn;
  $("t-entline").innerHTML = U.entline;
  $("t-entbtn").textContent = U.entbtn;
  $("search").placeholder = U.search;
  $("t-disc").textContent = U.disc;
  $("t-foot").innerHTML = U.foot;
  $("empty").textContent = U.empty;
  $("filters").innerHTML = GROUPS.map(g =>
    `<button class="fbtn${g.id===group?" on":""}" data-g="${g.id}">${g[lang]}</button>`).join("");
  $("filters").querySelectorAll(".fbtn").forEach(b =>
    b.addEventListener("click", () => { group = b.dataset.g; applyChrome(); render(); }));
}

function matches(m){
  if(group !== "all" && m.g !== group) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  const hay = [m.n.en, m.n.ar, m.study.en, m.study.ar, m.day.en, m.day.ar,
               m.subj.en.join(" "), m.subj.ar.join(" "),
               Object.values(m.u).flat().join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}

function uniBlock(m, U){
  return `<div class="unis">` + CT_ORDER.map(c => {
    const list = m.u[c] || [];
    const val = list.length ? list.join(" · ") : U.none;
    return `<div class="uni-row${list.length?"":" none"}"><b>${CT[c][lang]}</b><span>${val}</span></div>`;
  }).join("") + `</div><p class="note">${U.uniNote}</p>`;
}

function render(){
  const U = UI[lang];
  const shown = MAJORS.filter(matches);
  $("count").textContent = U.count(shown.length, MAJORS.length);
  $("empty").style.display = shown.length ? "none" : "block";
  const gname = g => (GROUPS.find(x => x.id === g) || {})[lang] || "";
  $("list").innerHTML = shown.map(m => `
    <div class="mcard" id="m-${m.id}">
      <button class="mhead" data-id="${m.id}">
        <h2>${m.n[lang]}<span class="grp">${gname(m.g)}</span></h2>
        <span class="chev">›</span>
      </button>
      <div class="mbody">
        <div class="sec"><h3>${U.hStudy}</h3><p>${m.study[lang]}</p></div>
        <div class="sec"><h3>${U.hDay}</h3><p>${m.day[lang]}</p></div>
        <div class="sec"><h3>${U.hHard}</h3><p>${m.hard[lang]}</p></div>
        <div class="sec"><h3>${U.hSubj}</h3><p>${m.subj[lang].map(s=>`<span class="subj">${s}</span>`).join("")}</p></div>
        <div class="sec"><h3>${U.hUni}</h3>${uniBlock(m, U)}</div>
      </div>
    </div>`).join("");
  $("list").querySelectorAll(".mhead").forEach(b =>
    b.addEventListener("click", () => {
      const card = document.getElementById("m-" + b.dataset.id);
      const opening = !card.classList.contains("open");
      card.classList.toggle("open");
      if(opening && window.goatcounter && window.goatcounter.count){
        try{ window.goatcounter.count({path:"explore-" + b.dataset.id, event:true}); }catch(e){}
      }
    }));
  openFromHash();
}

function openFromHash(){
  const h = (location.hash || "").replace("#", "");
  if(!h) return;
  const card = document.getElementById("m-" + h);
  if(card && !card.classList.contains("open")){
    card.classList.add("open");
    setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 60);
  }
}

$("langToggle").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  applyChrome(); render();
});
$("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
window.addEventListener("hashchange", openFromHash);

applyChrome();
render();

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
/* MCLANG boot: applies the resolved language by driving the page's own toggle,
   then remembers whatever the visitor lands on. */
(function(){
  var b = document.getElementById("langToggle");
  if(!b) return;
  if(mcInitLang() === "ar" && document.documentElement.lang !== "ar") b.click();
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){
        mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en");
      }, 0);
    }
  }, true);
})();
</script>
