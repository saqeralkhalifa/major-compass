/* ---------- state ---------- */
var LANG = "en";
var FILTER = "all";
var BFILTER = null;
var Q = "";
var OPEN = {};

function L(){ return T[LANG]; }
function tx(o){ return o[LANG]; }

/* ---------- render ---------- */
function renderChrome(){
  var t = L();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("lede").textContent = t.lede;

  document.getElementById("facts").innerHTML =
    '<div class="fact"><b>'+t.f1n+'</b><span>'+t.f1s+'</span></div>' +
    '<div class="fact"><b>'+t.f2n+'</b><span>'+t.f2s+'</span></div>' +
    '<div class="fact"><b>'+t.f3n+'</b><span>'+t.f3s+'</span></div>';

  document.getElementById("t-howT").textContent = t.howT;
  document.getElementById("t-howS").textContent = t.howS;
  document.getElementById("keys").innerHTML = t.keys.map(function(k){
    return '<div class="pt"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  document.getElementById("q").placeholder = t.q;

  document.getElementById("t-cavT").textContent = t.cavT;
  document.getElementById("t-cavS").textContent = t.cavS;
  document.getElementById("cavs").innerHTML = t.cavs.map(function(k){
    return '<div class="pt warn"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  document.getElementById("t-gulfT").textContent = t.gulfT;
  document.getElementById("t-gulfS").textContent = t.gulfS;
  document.getElementById("gulfs").innerHTML = t.gulfs.map(function(k){
    return '<div class="pt"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  document.getElementById("t-quizline").textContent = t.quizline;
  document.getElementById("t-quizbtn").textContent = t.quizbtn;
  document.getElementById("t-expline").textContent = t.expline;
  document.getElementById("t-expbtn").textContent = t.expbtn;
  document.getElementById("t-parline").textContent = t.parline;
  document.getElementById("t-parbtn").textContent = t.parbtn;

  document.getElementById("srcT").textContent = t.srcT;
  document.getElementById("srcS").textContent = t.srcS;
  document.getElementById("srcList").innerHTML = T.en.src.map(function(s){
    return '<li>'+s[0]+' <a href="'+s[1]+'" target="_blank" rel="noopener">'+s[1]+'</a></li>'; }).join("");

  document.getElementById("t-disc").textContent = t.disc;
  document.getElementById("t-foot").textContent = t.foot;

  var chips = GROUPS.map(function(g){
    return '<button class="chip'+(FILTER===g.k?' on':'')+'" data-g="'+g.k+'">'+tx(g)+'</button>'; })
    .concat(BANDCHIPS.map(function(b){
      return '<button class="chip'+(BFILTER===b.k?' on':'')+'" data-b="'+b.k+'">'+tx(b)+'</button>'; }));
  document.getElementById("chips").innerHTML = chips.join("");
}

function match(m){
  if(FILTER !== "all" && m.g !== FILTER) return false;
  if(BFILTER && ("b-"+m.b) !== BFILTER) return false;
  if(!Q) return true;
  var hay = (m.n.en+" "+m.n.ar+" "+m.d.en+" "+m.d.ar+" "+m.t.en+" "+m.t.ar+" "+m.a.en+" "+m.a.ar).toLowerCase();
  return hay.indexOf(Q) > -1;
}

function renderList(){
  var t = L();
  var list = MAJORS_AI.filter(match);
  document.getElementById("count").textContent = t.count(list.length, MAJORS_AI.length);
  if(!list.length){ document.getElementById("mlist").innerHTML = '<div class="pt"><span>'+t.none+'</span></div>'; return; }
  document.getElementById("mlist").innerHTML = list.map(function(m){
    var open = OPEN[m.id] ? " open" : "";
    return '<div class="m'+open+'" id="m-'+m.id+'">' +
      '<button class="mhead" data-id="'+m.id+'" aria-expanded="'+(OPEN[m.id]?"true":"false")+'">' +
        '<span class="mname">'+tx(m.n)+'</span>' +
        '<span class="band '+m.b+'">'+tx(BANDS[m.b])+'</span>' +
        '<span class="caret" aria-hidden="true">&#9654;</span>' +
      '</button>' +
      '<div class="mbody">' +
        '<div class="row"><h4>'+t.r1+'</h4><p>'+tx(m.d)+'</p></div>' +
        '<div class="row"><h4>'+t.r2+'</h4><p>'+tx(m.x)+'</p></div>' +
        '<div class="row"><h4>'+t.r3+'</h4><p>'+tx(m.t)+'</p></div>' +
        '<div class="row act"><h4>'+t.r4+'</h4><p>'+tx(m.a)+'</p></div>' +
        '<div class="ev"><strong>'+t.r5+'.</strong> '+tx(m.e)+'</div>' +
      '</div></div>';
  }).join("");
}

function renderAll(){ renderChrome(); renderList(); }

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var h = e.target.closest ? e.target.closest(".mhead") : null;
  if(h){
    var id = h.getAttribute("data-id");
    OPEN[id] = !OPEN[id];
    var card = document.getElementById("m-"+id);
    if(card){ card.classList.toggle("open"); h.setAttribute("aria-expanded", OPEN[id]?"true":"false"); }
    if(OPEN[id] && window.goatcounter && window.goatcounter.count){
      try{ window.goatcounter.count({path:"ai-"+id, title:"AI major "+id, event:true}); }catch(err){}
    }
    return;
  }
  var c = e.target.closest ? e.target.closest(".chip") : null;
  if(c){
    if(c.hasAttribute("data-g")){ FILTER = c.getAttribute("data-g"); }
    else { var b = c.getAttribute("data-b"); BFILTER = (BFILTER === b) ? null : b; }
    renderAll();
  }
});

document.getElementById("q").addEventListener("input", function(e){
  Q = (e.target.value || "").trim().toLowerCase();
  renderList();
});

document.getElementById("langToggle").addEventListener("click", function(){
  LANG = (LANG === "en") ? "ar" : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === "ar") ? "rtl" : "ltr";
  this.textContent = (LANG === "ar") ? "English" : "عربي";
  renderAll();
});

renderAll();

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
</body>
</html>
