<script>
/* MCLANG: one language resolver shared by every Major Compass page.
   Order: ?lang= in the URL, then the visitor's saved choice, then the browser. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }
</script>

/* ============================================================
   Major Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-ar:'Noto Naskh Arabic', 'Amiri', Georgia, serif;

  --paper:#FAF5EA;
  --paper-2:#EFE4CE;
  --card:#F5ECDA;
  --line:#E2D5BB;
  --line-2:#D3C0A0;

  --ink:#152A55;
  --ink-2:#4A3728;
  --ink-3:#6B5B47;

  --navy:#152A55;
  --navy-deep:#0F2047;
  --accent:#7D5F27;
  --accent-soft:#EFE4CE;
  --accent-line:#D3C0A0;

  --gold:#7D5F27;
  --gold-soft:#F5ECDA;
  --gold-line:#E2D5BB;
  --gold-bright:#C09A45;

  --good:#2F5D46;  --good-soft:#E7EEE8;  --good-line:#C9D8CC;
  --warn:#7D5F27;  --warn-soft:#F5ECDA;  --warn-line:#E2D5BB;
  --bad:#8C3A30;   --bad-soft:#F6EAE3;   --bad-line:#E4D2C7;

  --radius:2px; --radius-sm:2px;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

/* ---------- the shared dark nav ---------- */
.mc-nav{
  background:var(--ink); color:var(--paper);
  position:sticky; top:0; z-index:40;
}
.mc-nav-inner{
  max-width:820px; margin:0 auto; padding:13px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
}
.mc-brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--paper); min-width:0;}
.mc-brand b{font-family:var(--font-display); font-size:17px; font-weight:400; letter-spacing:-.01em; white-space:nowrap;}
[dir="rtl"] .mc-brand b{font-family:var(--font-ar); font-weight:600; letter-spacing:0;}
.mc-brand span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9AAAD0; white-space:nowrap; font-family:var(--font-label);}
[dir="rtl"] .mc-brand span{letter-spacing:0; text-transform:none; font-size:12px;}
.mc-nav-links{
  display:flex; gap:20px; font-size:12px; letter-spacing:.06em; align-items:center;
  overflow-x:auto; scrollbar-width:none; flex:1 1 auto; justify-content:center;
}
.mc-nav-links::-webkit-scrollbar{display:none;}
[dir="rtl"] .mc-nav-links{letter-spacing:0; font-size:13px;}
.mc-nav-links a{
  color:#D3DCEF; text-decoration:none; white-space:nowrap; padding-bottom:2px;
  border-bottom:1px solid transparent; transition:color .15s, border-color .15s;
}
.mc-nav-links a:hover{color:var(--paper);}
.mc-nav-links a[aria-current="page"]{color:var(--paper); border-bottom-color:var(--accent);}
.mc-nav .lang-toggle{
  flex:0 0 auto; border:1px solid var(--accent); background:var(--accent); border-radius:999px;
  padding:6px 17px; font-size:13px; letter-spacing:.04em; font-weight:600;
  color:#F5ECDA; cursor:pointer; font-family:var(--font-body);
  transition:background .15s, color .15s, border-color .15s;
}
.mc-nav .lang-toggle:hover{background:var(--paper); color:var(--ink); border-color:var(--paper);}
@media (max-width:640px){
  .mc-nav-inner{padding:11px 18px; gap:10px;}
  .mc-nav-links{justify-content:flex-start; order:3; width:100%; gap:16px; padding-bottom:2px;}
}
@media print{ .mc-nav{display:none;} }

/* the old in-page masthead and pill switcher are replaced by .mc-nav */
header.site, nav.toolnav{display:none !important;}

/* ---------- page header ---------- */
.hero, .res-head{position:relative;}
.hero::before{display:none !important;}
.hero{padding-top:52px;}
.hero h1{font-size:clamp(34px, 5.4vw, 52px); line-height:1.04; font-weight:400;}
[dir="rtl"] .hero h1{line-height:1.35; font-weight:600;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker, .eyebrow{
  color:var(--accent); font-weight:600; font-size:11px;
  letter-spacing:.18em; text-transform:uppercase; font-family:var(--font-label);}
[dir="rtl"] .kicker, [dir="rtl"] .eyebrow{letter-spacing:0; text-transform:none; font-size:13px;}

/* ---------- surfaces: square, flat, ruled ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox,
.m, .fact, .pt, .bar, .quizbar, .cta-inline, .rule, .checked, .hedge, .extra, .flag,
.note, .card, .grp{
  border-radius:0 !important;
  box-shadow:none !important;
}
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .stat, .nextbox, .m, .fact{
  background:var(--card); border:1px solid var(--line-2);
}
.mcard:hover, .pcard:hover, .m:hover{border-color:var(--ink-3);}
.pcard{border-inline-start-width:2px; border-inline-start-color:var(--accent);}
.lede{background:var(--card); border:1px solid var(--line-2);
  border-inline-start:2px solid var(--accent) !important; border-inline-end:1px solid var(--line-2) !important;}

/* ---------- buttons ---------- */
.btn{
  background:var(--ink); border:1px solid var(--ink); border-radius:0;
  font-weight:500; letter-spacing:0; color:var(--paper); box-shadow:none;
  transition:background .15s, border-color .15s, color .15s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff; transform:none; filter:none; box-shadow:none;}
.btn.ghost, .btn.secondary{
  background:transparent; color:var(--ink); border:1px solid var(--ink); box-shadow:none;
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.printbtn{border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);}
.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

/* filter chips and pickers: square, ruled */
.fbtn, .chip, .navbtn, .picker button, .filters button{
  border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);
  box-shadow:none; transition:background .15s, color .15s, border-color .15s;
}
.fbtn:hover, .chip:hover, .navbtn:hover{border-color:var(--ink); color:var(--ink); background:transparent; transform:none;}
.fbtn.on, .chip.on, .navbtn.on{
  background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500; box-shadow:none;
}
input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);
}
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{
  background:var(--paper-2); border:1px solid var(--line); border-radius:0;
}
.rule, .checked, .hedge, .extra, .flag{border-radius:0;}
.rule.w, .checked, .hedge, .extra, .flag{background:var(--warn-soft); border-color:var(--warn-line);}
.rule.b{background:var(--bad-soft); border-color:var(--bad-line);}
.rule.n{background:var(--paper-2); border-color:var(--line);}
.row.act{background:var(--paper-2) !important; border-color:var(--line) !important;}

/* ---------- band chips and verdict pills keep meaning, lose gloss ---------- */
.band{border-radius:0; font-weight:600;}

/* ---------- section labels ---------- */
.sec h3, .lbl, .toc h2, .row h4{
  letter-spacing:.14em; font-weight:600; text-transform:uppercase; font-size:11px; color:var(--ink-3); font-family:var(--font-label);}
[dir="rtl"] .sec h3, [dir="rtl"] .lbl, [dir="rtl"] .toc h2, [dir="rtl"] .row h4{
  letter-spacing:0; text-transform:none; font-size:13px;
}

/* ---------- tables ---------- */
table{border-collapse:collapse;}
th{
  text-align:start; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--ink); font-family:var(--font-label);}
[dir="rtl"] th{letter-spacing:0; text-transform:none; font-size:13px;}
td{padding:14px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; font-size:14px;}

/* ---------- footer ---------- */
footer.site{
  margin-top:56px; padding:26px 0 0; border-top:1px solid var(--line); color:var(--ink-3); font-size:13px;
}
footer.site a{color:var(--accent); font-weight:500;}

@media (max-width:520px){
  .hero h1{font-size:clamp(28px, 8vw, 36px);}
}

/* ---- 2A refinements ---- */
input, button, select, textarea{border-radius:0;}
.lang-toggle, .mc-nav .lang-toggle{border-radius:999px;}
.pt{border-inline-start-width:2px !important;}
.compass{display:none !important;}
.emoji{display:none !important;}
.mcard, .m, .panel, .qcard, .fact, .stat, .srcbox, .toc, .nextbox, .viz-root{border-color:var(--line-2);}
.opt{border-radius:0 !important;}
.opt.selected{background:var(--paper-2); border-color:var(--ink);}
.band{border-radius:0 !important;}
.crosslinks .bar, .bar{border-radius:0 !important;}
hr{border:0; border-top:1px solid var(--line);}

/* ---- 2A: square the remaining pills, protect quiz progress ---- */
.section-chip, .progress-bar, .progress-fill, .bar-fill, .chip, .meta-chips .chip,
.tag, .pill, .badge, .cta, .startbtn{border-radius:0 !important;}
.section-chip{background:var(--paper-2); color:var(--accent); border:1px solid var(--line);
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; padding:5px 12px; font-family:var(--font-label);}
[dir="rtl"] .section-chip{letter-spacing:0; text-transform:none; font-size:13px;}

<script>
/* ===== Parent guide: content ===== */

const HERO = {
  en:{kicker:"A guide for parents",
      t:"Your son or daughter is choosing a major",
      s:"What the research actually says about your role in this decision, what the Gulf job market actually rewards, and how to have the conversation without losing them."},
  ar:{kicker:"دليل لأولياء الأمور",
      t:"ابنك أو ابنتك يختار تخصصه الجامعي",
      s:"ما تقوله الأبحاث فعلًا عن دورك في هذا القرار، وما يكافئه سوق العمل الخليجي حقيقةً، وكيف تدير الحوار دون أن تخسرهما."}
};

const LEDE = {
  en:"You are not being asked to step back. That is not what the evidence recommends, and it is not what your child needs. Studies find that parents who disengage from this decision leave their children measurably worse at planning a career, not freer. What the evidence recommends is something harder and better: stay closely involved, and stop deciding.",
  ar:"لا يُطلب منك أن تبتعد. ليس هذا ما توصي به الأدلة، وليس ما يحتاجه ابنك. فالدراسات تجد أن الآباء الذين ينسحبون من هذا القرار يتركون أبناءهم أضعف في التخطيط المهني، لا أكثر حرية. ما توصي به الأدلة أصعب وأفضل: ابقَ قريبًا ومشاركًا، وتوقف عن أن تقرر بدلًا عنه."
};

const SECTIONS = [

{id:"three",
 t:{en:"Three findings worth knowing before you say anything", ar:"ثلاث نتائج تستحق أن تعرفها قبل أن تتكلم"},
 b:{en:`<p>Most of what families believe about this decision was true twenty years ago. Three things have changed enough to be worth reading carefully.</p>

<div class="stat">
  <div class="stat-n">0.83 against 0.25</div>
  <div class="stat-b">In the most complete review of career guidance research, being <b>supported through</b> the decision had more than three times the effect of being <b>told about</b> the options. Emotional support scored an effect size of 0.83. Giving someone information about the world of work scored 0.25. Your value here is not the lecture about which field pays. It is being the person they can think out loud in front of.</div>
</div>

<div class="stat">
  <div class="stat-n">25%</div>
  <div class="stat-b">Youth unemployment among Saudi holders of STEM degrees, as of 2023. Only 30% of Saudi engineering and technology graduates were judged fully qualified for private sector positions. Meanwhile <b>38% of Saudi employers say they plan to remove degree requirements altogether</b>, against 19% globally. The degree that felt safest to your generation is no longer the one that guarantees work.</div>
</div>

<div class="stat">
  <div class="stat-n">$64,000 to $146,000</div>
  <div class="stat-b">The range of median earnings <b>within</b> science and engineering majors in the most recent large US analysis. The gap inside one field is far wider than the gap between fields, and fourteen of nineteen humanities and arts majors out-earn the bottom quarter of STEM. Choosing "engineering" tells you almost nothing about your child's future income. What they do inside it tells you a great deal.</div>
</div>

<p>None of this means that practical considerations do not matter. It means the practical considerations your family is probably using are out of date.</p>`,

    ar:`<p>معظم ما تؤمن به الأسر حول هذا القرار كان صحيحًا قبل عشرين عامًا. وثلاثة أمور تغيّرت بما يكفي لتستحق قراءة متأنية.</p>

<div class="stat">
  <div class="stat-n">٠٫٨٣ مقابل ٠٫٢٥</div>
  <div class="stat-b">في أشمل مراجعة لأبحاث الإرشاد المهني، كان <b>الدعم أثناء اتخاذ القرار</b> أقوى أثرًا بأكثر من ثلاثة أضعاف من <b>إخبار الشخص</b> بالخيارات. فحجم أثر الدعم العاطفي بلغ ٠٫٨٣، أما تزويد الشخص بمعلومات عن عالم العمل فبلغ ٠٫٢٥. قيمتك هنا ليست المحاضرة عن أي المجالات أعلى دخلًا، بل أن تكون الشخص الذي يستطيع ابنك أن يفكر بصوت عالٍ أمامه.</div>
</div>

<div class="stat">
  <div class="stat-n">٢٥٪</div>
  <div class="stat-b">نسبة البطالة بين الشباب السعودي من حملة شهادات العلوم والهندسة والتقنية، بحسب بيانات ٢٠٢٣. و٣٠٪ فقط من خريجي الهندسة والتقنية السعوديين اعتُبروا مؤهلين تمامًا لوظائف القطاع الخاص. وفي الوقت نفسه يقول <b>٣٨٪ من أصحاب العمل السعوديين إنهم يخططون لإلغاء اشتراط الشهادة الجامعية</b>، مقابل ١٩٪ عالميًا. الشهادة التي بدت الأكثر أمانًا لجيلك لم تعد هي التي تضمن العمل.</div>
</div>

<div class="stat">
  <div class="stat-n">٦٤ ألفًا إلى ١٤٦ ألف دولار</div>
  <div class="stat-b">مدى الدخل الوسيط <b>داخل</b> تخصصات العلوم والهندسة في أحدث تحليل أمريكي واسع. الفجوة داخل المجال الواحد أوسع بكثير من الفجوة بين المجالات، وأربعة عشر تخصصًا من تسعة عشر في الإنسانيات والفنون تتجاوز دخلها الربع الأدنى من تخصصات العلوم والهندسة. اختيار "الهندسة" لا يخبرك تقريبًا بشيء عن دخل ابنك مستقبلًا، أما ما يفعله داخلها فيخبرك بالكثير.</div>
</div>

<p>لا يعني هذا أن الاعتبارات العملية غير مهمة، بل يعني أن الاعتبارات العملية التي تستخدمها أسرتك على الأرجح قديمة.</p>`}},

{id:"result",
 t:{en:"How to read the result they bring you", ar:"كيف تقرأ النتيجة التي يعرضها عليك"},
 b:{en:`<p>If your child has taken the assessment on this site, they will come to you with five majors ranked by fit, a three letter interest code, and a percentage next to each one. Here is what those numbers are, and what they are not.</p>

<p><b>The list is a conversation opener, not a verdict.</b> It is built on the Holland interest model, the most widely used framework in career guidance, and it matches a young person's pattern of interests, strengths, values and constraints against eighty two majors. That is a reasonable starting point. It is not a measurement of talent, and it cannot see the things you can see: how they behave under pressure, what they are like when nobody is grading them, what they have quietly loved since they were nine.</p>

<p><b>The percentages are relative, not absolute.</b> A 74% match does not mean the student will be 74% happy. It means that of the eighty two options, this one lines up with their answers more closely than the one below it. Two majors three points apart are, for practical purposes, tied.</p>

<p><b>Read the whole list, not just the first item.</b> The most useful information is usually the pattern. If four of the five are people facing, that is the finding. If the list is split between something creative and something technical, that split is real and worth talking about, and there are many careers that need both.</p>

<p><b>Look at what they avoided.</b> The assessment asks about dealbreakers. Roughly three in ten students who have taken it say they would rather not work with blood or clinical procedures. Around two in ten want to avoid heavy mathematics. If your child has said one of these, pushing them toward medicine or engineering is not ambition, it is a plan for them to be miserable for six years and then leave.</p>

<p>The most productive question you can ask about the result is not "why is this one first" but <b>"which of these five do you actually want to go and find out more about"</b>.</p>`,

    ar:`<p>إذا أجرى ابنك الاختبار في هذا الموقع فسيأتيك بخمسة تخصصات مرتبة حسب التوافق، ورمز ميول من ثلاثة أحرف، ونسبة مئوية بجانب كل تخصص. وهذا ما تعنيه هذه الأرقام، وما لا تعنيه.</p>

<p><b>القائمة بداية حوار لا حكم نهائي.</b> فهي مبنية على نموذج هولاند للميول، وهو الإطار الأوسع استخدامًا في الإرشاد المهني، وتطابق نمط ميول الطالب وقدراته وقيمه وقيوده مع اثنين وثمانين تخصصًا. هذه نقطة انطلاق معقولة، لكنها ليست قياسًا للموهبة، ولا ترى ما تراه أنت: كيف يتصرف تحت الضغط، وكيف يكون حين لا يقيّمه أحد، وما الذي أحبه بهدوء منذ كان في التاسعة.</p>

<p><b>النسب نسبية لا مطلقة.</b> فتوافق ٧٤٪ لا يعني أن الطالب سيكون سعيدًا بنسبة ٧٤٪، بل يعني أن هذا التخصص، من بين اثنين وثمانين خيارًا، أقرب إلى إجاباته من الذي يليه. وتخصصان بينهما ثلاث نقاط متعادلان عمليًا.</p>

<p><b>اقرأ القائمة كاملة لا الأول فقط.</b> فالمعلومة الأنفع عادة هي النمط. إن كانت أربعة من الخمسة تتعامل مع الناس فهذه هي النتيجة. وإن انقسمت القائمة بين شيء إبداعي وآخر تقني فهذا الانقسام حقيقي ويستحق النقاش، وهناك مهن كثيرة تحتاج الاثنين معًا.</p>

<p><b>انظر إلى ما تجنّبه.</b> فالاختبار يسأل عن الأمور المستبعدة تمامًا. ونحو ثلاثة من كل عشرة ممن أجروه يقولون إنهم يفضلون ألا يعملوا مع الدم أو الإجراءات السريرية، ونحو اثنين من كل عشرة يريدون تجنب الرياضيات الثقيلة. فإن قال ابنك أحد هذين، فدفعه نحو الطب أو الهندسة ليس طموحًا، بل خطة ليشقى ست سنوات ثم ينسحب.</p>

<p>وأنفع سؤال تطرحه عن النتيجة ليس "لماذا جاء هذا أولًا" بل <b>"أي هذه الخمسة تريد فعلًا أن تذهب وتعرف عنه أكثر"</b>.</p>`}},

{id:"influence",
 t:{en:"How much you actually influence this, and which kind of influence helps", ar:"كم تؤثر فعلًا، وأي نوع من التأثير ينفع"},
 b:{en:`<p>In a study of 453 undergraduates at a Saudi public university in 2023 and 2024, <b>81% agreed that their chosen major aligns with their parents' preferences</b>, and 95% cited family encouragement. Family alignment outranked both expected income and social status as a stated influence. That is a single institution with a mostly female sample, and agreement is not the same as compliance, but the direction is unmistakable. In the Gulf, you are in this decision whether you intend to be or not.</p>

<p>The research is much clearer on <b>which kind of involvement helps</b>. A pooled analysis of 238 studies covering 126,423 people found that parental autonomy support, meaning taking the young person's own perspective seriously and supporting their initiative, correlates with wellbeing at 0.30. Parental psychological control, meaning guilt, conditional warmth and pressure, correlates with ill-being at 0.26.</p>

<p>The important detail, and the one most parents get wrong: <b>these are not two ends of one dial.</b> They are two separate behaviours, and you can do both at the same time. Being loving and generous does not cancel out being controlling about this one decision. Your child experiences both.</p>

<p>Two more findings complete the picture. First, students who study because someone else expects it are measurably more likely to want to quit. In a study of 754 students, controlled motivation predicted intention to drop out, while autonomous motivation predicted both staying and performing better. Second, withdrawing is not the safe alternative. In a 2025 study of 814 students, a lack of parental engagement directly reduced career planning ability.</p>

<p>Engaged, warm and non directive is the target. It is harder than either shouting or shrugging.</p>

<p class="hedge">Worth being honest about: these are correlations from populations, not predictions about your family. One study of young adults found that school career support mattered more than parental behaviour, which is a reminder that you are one influence among several, and that pressing your child's school to do more may matter as much as anything you do at home.</p>`,

    ar:`<p>في دراسة على ٤٥٣ طالبًا جامعيًا في جامعة حكومية سعودية عامي ٢٠٢٣ و٢٠٢٤، <b>وافق ٨١٪ على أن تخصصهم المختار يتوافق مع تفضيلات والديهم</b>، وذكر ٩٥٪ تشجيع الأسرة. وتفوّق التوافق مع الأسرة على الدخل المتوقع وعلى المكانة الاجتماعية معًا كعامل مؤثر مُعلن. صحيح أن هذه مؤسسة واحدة بعينة غالبها من الإناث، وأن الموافقة ليست هي الامتثال، لكن الاتجاه واضح. في الخليج أنت طرف في هذا القرار سواء قصدت ذلك أم لا.</p>

<p>والأبحاث أوضح بكثير في <b>أي نوع من المشاركة ينفع</b>. فتحليل مجمّع لـ٢٣٨ دراسة شملت ١٢٦٤٢٣ شخصًا وجد أن دعم الاستقلالية من الوالدين، أي أخذ وجهة نظر الابن على محمل الجد ودعم مبادرته، يرتبط بالعافية النفسية بمعامل ٠٫٣٠. أما السيطرة النفسية، أي الشعور بالذنب والحنان المشروط والضغط، فترتبط بسوء الحال النفسي بمعامل ٠٫٢٦.</p>

<p>والتفصيل المهم، وهو ما يخطئ فيه أكثر الآباء: <b>هذان ليسا طرفي مقياس واحد</b>، بل سلوكان منفصلان يمكن أن يصدرا منك في الوقت نفسه. فكونك محبًا وكريمًا لا يلغي كونك مسيطرًا في هذا القرار تحديدًا. وابنك يعيش الأمرين معًا.</p>

<p>وتكمل الصورةَ نتيجتان أخريان. الأولى أن الطلبة الذين يدرسون لأن غيرهم يتوقع ذلك منهم أميل بوضوح إلى الرغبة في الانسحاب. ففي دراسة على ٧٥٤ طالبًا تنبأ الدافع الخارجي بنية ترك الدراسة، بينما تنبأ الدافع الذاتي بالاستمرار وبالأداء الأفضل معًا. والثانية أن الانسحاب ليس البديل الآمن. ففي دراسة عام ٢٠٢٥ على ٨١٤ طالبًا، أدى غياب مشاركة الوالدين مباشرة إلى ضعف القدرة على التخطيط المهني.</p>

<p>المطلوب إذن: حضور دافئ ومشارك وغير آمر. وهو أصعب من الصياح ومن اللامبالاة معًا.</p>

<p class="hedge">وللأمانة: هذه ارتباطات مستخلصة من مجموعات كبيرة، لا تنبؤات عن أسرتك أنت. كما وجدت دراسة على شباب بالغين أن الدعم المهني من المدرسة كان أهم من سلوك الوالدين، وهو تذكير بأنك مؤثر واحد بين عدة مؤثرات، وأن الضغط على مدرسة ابنك لتقدّم إرشادًا أفضل قد يوازي في أهميته كل ما تفعله في البيت.</p>`}},

{id:"prestige",
 t:{en:"The prestige trap, in numbers", ar:"فخ المكانة، بالأرقام"},
 b:{en:`<p>Almost every Gulf family has a short list of respectable degrees. Medicine, engineering, law, accounting. That list was assembled when a government job followed a degree almost automatically. It no longer does, and the policy change is deliberate.</p>

<p>Saudi Arabia now produces over 300,000 graduates a year, up from 200,000 in 2015, concentrated heavily in business, law and management. Nitaqat has moved Saudi nationals in private sector employment from roughly 24% before 2011 to about 33% by 2023. In the UAE, Emiratisation legally requires companies with fifty or more employees to raise Emirati skilled roles toward 10% by 2026, with penalties of AED 6,000 a month per unfilled position. Governments across the Gulf are legislating nationals into the private sector. The safe government job is not an assumption that policy supports any more.</p>

<p>The specific degrees have moved too:</p>

<ul>
  <li><b>Accounting and auditing</b> appear on the World Economic Forum's list of the fastest declining occupations to 2030. It is on the same list as cashiers and administrative assistants.</li>
  <li><b>Computer science</b>, the field families were most recently told was guaranteed, had the highest unemployment rate within science and engineering for recent graduates at 6.8%, even while paying a strong median salary. High pay and high unemployment can sit inside the same major.</li>
  <li><b>Entry level white collar work</b> is where artificial intelligence is landing first. A Stanford analysis found workers aged 22 to 25 in the most AI exposed occupations saw employment fall by roughly 16%, while workers over 30 in the same roles saw increases of 6% to 9%. Software developers aged 22 to 25 fell nearly 20%. Salaries barely moved. The adjustment came through hiring, which means it hits new graduates first.</li>
</ul>

<p>And the general picture is less reassuring than the brochures suggest: in the United States, 42% of recent graduates are working in jobs that do not require a degree at all.</p>

<p>What is growing, globally and in the Gulf: artificial intelligence and big data, networks and cybersecurity, fintech, renewable energy engineering, and in sheer numbers, nursing and teaching. In Saudi Arabia employers expect autonomous technology to handle 45% of work tasks by 2030. In the UAE, 87% say technological literacy is becoming more important.</p>

<p>The honest conclusion is not "avoid medicine" or "everyone should study computing". It is that <b>the field name on the certificate is a weak predictor of anything</b>, and a family that argues for two years about the field name while ignoring what the student will actually be good at and willing to sustain has optimised for the wrong variable.</p>`,

    ar:`<p>لدى كل أسرة خليجية تقريبًا قائمة قصيرة من الشهادات المحترمة: الطب والهندسة والقانون والمحاسبة. وقد وُضعت هذه القائمة حين كانت الوظيفة الحكومية تتبع الشهادة تلقائيًا تقريبًا. لم يعد الأمر كذلك، والتغيير في السياسات مقصود.</p>

<p>تنتج السعودية اليوم أكثر من ٣٠٠ ألف خريج سنويًا، صعودًا من ٢٠٠ ألف عام ٢٠١٥، ويتركز معظمهم في الأعمال والقانون والإدارة. وقد رفع نطاقات نسبة السعوديين في القطاع الخاص من نحو ٢٤٪ قبل ٢٠١١ إلى نحو ٣٣٪ بحلول ٢٠٢٣. وفي الإمارات يلزم التوطين الشركات التي لديها خمسون موظفًا فأكثر برفع نسبة الوظائف المهارية للمواطنين نحو ١٠٪ بحلول ٢٠٢٦، بغرامة ٦٠٠٠ درهم شهريًا عن كل وظيفة شاغرة. الحكومات في الخليج تشرّع لدخول المواطنين إلى القطاع الخاص. والوظيفة الحكومية الآمنة لم تعد افتراضًا تسنده السياسات.</p>

<p>والشهادات نفسها تحركت أيضًا:</p>

<ul>
  <li><b>المحاسبة والتدقيق</b> ترد في قائمة المنتدى الاقتصادي العالمي للمهن الأسرع انحسارًا حتى ٢٠٣٠، في القائمة نفسها التي تضم أمناء الصناديق والسكرتارية الإدارية.</li>
  <li><b>علوم الحاسوب</b>، وهي المجال الذي قيل للأسر مؤخرًا إنه مضمون، سجلت أعلى بطالة بين تخصصات العلوم والهندسة لحديثي التخرج عند ٦٫٨٪، رغم دخلها الوسيط الجيد. فالأجر المرتفع والبطالة المرتفعة قد يجتمعان في التخصص نفسه.</li>
  <li><b>الوظائف المكتبية في مستوى المبتدئين</b> هي أول ما يصيبه الذكاء الاصطناعي. فقد وجد تحليل من ستانفورد أن العاملين بين ٢٢ و٢٥ سنة في المهن الأكثر تعرضًا للذكاء الاصطناعي تراجعت أعدادهم بنحو ١٦٪، بينما ارتفعت أعداد من تجاوزوا الثلاثين في المهن نفسها بين ٦٪ و٩٪. ومطورو البرمجيات بين ٢٢ و٢٥ سنة تراجعوا بنحو ٢٠٪. أما الرواتب فلم تتحرك تقريبًا، أي أن التعديل جرى عبر التوظيف، وهذا يصيب الخريجين الجدد أولًا.</li>
</ul>

<p>والصورة العامة أقل طمأنة مما توحي به كتيبات الجامعات: ففي الولايات المتحدة يعمل ٤٢٪ من حديثي التخرج في وظائف لا تشترط شهادة جامعية أصلًا.</p>

<p>أما ما ينمو، عالميًا وفي الخليج: الذكاء الاصطناعي والبيانات الضخمة، والشبكات والأمن السيبراني، والتقنية المالية، وهندسة الطاقة المتجددة، ومن حيث الأعداد المطلقة التمريض والتعليم. ويتوقع أصحاب العمل في السعودية أن تؤدي التقنيات ذاتية التشغيل ٤٥٪ من المهام بحلول ٢٠٣٠. وفي الإمارات يقول ٨٧٪ إن الثقافة التقنية تزداد أهمية.</p>

<p>والخلاصة الصادقة ليست "تجنّبوا الطب" ولا "ليدرس الجميع الحاسوب"، بل أن <b>اسم التخصص على الشهادة مؤشر ضعيف على أي شيء</b>، وأن الأسرة التي تتجادل سنتين حول اسم التخصص وتتجاهل ما سيبرع فيه ابنها فعلًا وما يقوى على الاستمرار فيه، قد حسّنت المتغير الخطأ.</p>`}},

{id:"say",
 t:{en:"What to say, and what to stop saying", ar:"ما تقوله، وما تتوقف عن قوله"},
 b:{en:`<p>There is no study that tests exact parental wording and measures the result. Anyone who tells you otherwise is overselling. What follows is reasoned from mechanisms that are evidenced, and each avoidance below is tied to a finding rather than to an opinion.</p>

<div class="two">
  <div class="col good">
    <h3>Six questions worth asking</h3>
    <ol>
      <li>What do you actually know about what a person in that job does all day?</li>
      <li>Who could we find for you to talk to who does this work now?</li>
      <li>What parts of school do you lose track of time in?</li>
      <li>If money and other people's opinions were not a factor, what would you look at? And then, separately: now let us put the practical constraints back in.</li>
      <li>What would you want to be true about your working life at thirty? Not the job title, the day.</li>
      <li>What would make you want to change your mind later, and would you tell me if that happened?</li>
    </ol>
    <p class="small">The first question targets the strongest Gulf finding we have on dropout. The last one quietly gives them permission to be honest with you in two years' time, which is worth more than it looks.</p>
  </div>
  <div class="col bad">
    <h3>Six things to stop saying</h3>
    <ol>
      <li><b>"We have already decided."</b> Psychological control tracks with ill-being at 0.26 across 126,423 people.</li>
      <li><b>"After everything we have spent on you."</b> Obligation framing produces exactly the kind of motivation that predicts wanting to drop out.</li>
      <li><b>"Engineering and medicine are safe."</b> 25% youth unemployment among Saudi STEM graduates in 2023.</li>
      <li><b>"Accounting is always in demand."</b> It is on the World Economic Forum's fastest declining list.</li>
      <li><b>"Decide now and never change."</b> Students who declared immediately and never switched graduated at a lower rate than those who settled later.</li>
      <li><b>Nothing at all.</b> Disengagement measurably reduces career planning ability. Silence is not neutrality.</li>
    </ol>
  </div>
</div>`,

    ar:`<p>لا توجد دراسة تختبر صياغات محددة يقولها الوالدان وتقيس نتيجتها. ومن يخبرك بغير ذلك يبالغ. وما يلي مستنتج من آليات مثبتة، وكل عبارة يُنصح بتجنبها أدناه مرتبطة بنتيجة بحثية لا برأي.</p>

<div class="two">
  <div class="col good">
    <h3>ستة أسئلة تستحق أن تُطرح</h3>
    <ol>
      <li>ماذا تعرف فعلًا عمّا يفعله صاحب هذه المهنة طوال يومه؟</li>
      <li>من يمكننا أن نجد لك لتتحدث معه ممن يعملون في هذا المجال الآن؟</li>
      <li>أي جزء من الدراسة تنسى الوقت وأنت فيه؟</li>
      <li>لو لم يكن المال ولا رأي الناس عاملًا، ماذا كنت ستنظر إليه؟ ثم، بشكل منفصل: والآن لنعد القيود العملية إلى الحساب.</li>
      <li>ما الذي تتمنى أن يكون صحيحًا في حياتك العملية وأنت في الثلاثين؟ لا المسمى الوظيفي بل تفاصيل اليوم.</li>
      <li>ما الذي قد يجعلك تغيّر رأيك لاحقًا، وهل ستخبرني لو حدث ذلك؟</li>
    </ol>
    <p class="small">السؤال الأول يستهدف أقوى نتيجة خليجية لدينا عن التسرب الجامعي. والسؤال الأخير يمنح ابنك بهدوء إذنًا بأن يكون صادقًا معك بعد سنتين، وهذا أثمن مما يبدو.</p>
  </div>
  <div class="col bad">
    <h3>ستة أمور توقف عن قولها</h3>
    <ol>
      <li><b>"لقد قررنا مسبقًا".</b> السيطرة النفسية ترتبط بسوء الحال النفسي بمعامل ٠٫٢٦ عبر ١٢٦٤٢٣ شخصًا.</li>
      <li><b>"بعد كل ما أنفقناه عليك".</b> صياغة الالتزام تنتج تحديدًا نوع الدافع الذي يتنبأ بالرغبة في ترك الدراسة.</li>
      <li><b>"الهندسة والطب آمنان".</b> ٢٥٪ بطالة بين الشباب السعودي من خريجي العلوم والهندسة عام ٢٠٢٣.</li>
      <li><b>"المحاسبة مطلوبة دائمًا".</b> هي في قائمة المنتدى الاقتصادي العالمي للمهن الأسرع انحسارًا.</li>
      <li><b>"قرر الآن ولا تغيّر أبدًا".</b> الطلبة الذين حسموا فورًا ولم يغيّروا تخرجوا بنسبة أقل ممن استقروا لاحقًا.</li>
      <li><b>لا شيء إطلاقًا.</b> الانسحاب يضعف قدرة الابن على التخطيط المهني بشكل ملموس. الصمت ليس حيادًا.</li>
    </ol>
  </div>
</div>`}},

{id:"meet",
 t:{en:"The single most useful thing you can arrange", ar:"أنفع شيء يمكنك ترتيبه"},
 b:{en:`<p>A machine learning study of 4,560 students across Saudi universities, with data collected between July 2024 and January 2025, identified the strongest predictors of dropping out. Alongside grade average and employment status was something families rarely think about: <b>major pre-knowledge</b>, meaning how much the student actually knew about the subject before enrolling.</p>

<p>That is a Gulf finding, it is recent, and it points at something you can do this month. Your child does not need another brochure. They need to sit with a person who does the job.</p>

<p>British research tracking school leavers found that <b>four or more encounters with employers while still at school</b> is the threshold associated with better outcomes as a young adult, and attributed the benefit to knowledge and contacts rather than to skills. In the career guidance meta analysis, watching and learning from a real person scored higher than being given information about the world of work.</p>

<p>Practically, in a Gulf family this is often easy. You already know a radiographer, a site engineer, a compliance officer, a teacher, a pharmacist, someone at the bank. Ask three of them for twenty minutes with your child, and brief your child to ask what a normal Tuesday looks like, what the worst part of the job is, and what they would study if they were eighteen now.</p>

<p>One warning worth passing on: the professions your child sees on television are not the professions as they are lived. A study of young people found that where they did not personally know someone doing a job, television and film became the main source of what they believed about it.</p>`,

    ar:`<p>حدّدت دراسة تعلّم آلي على ٤٥٦٠ طالبًا في جامعات سعودية، بُنيت على بيانات جُمعت بين يوليو ٢٠٢٤ ويناير ٢٠٢٥، أقوى العوامل المتنبئة بالتسرب. وإلى جانب المعدل التراكمي وحالة العمل جاء عامل نادرًا ما تفكر فيه الأسر: <b>المعرفة المسبقة بالتخصص</b>، أي كم كان الطالب يعرف فعلًا عن مجاله قبل التحاقه به.</p>

<p>هذه نتيجة خليجية وحديثة، وتشير إلى شيء يمكنك فعله هذا الشهر. ابنك لا يحتاج كتيّبًا آخر، بل يحتاج أن يجلس مع إنسان يمارس المهنة.</p>

<p>ووجدت أبحاث بريطانية تتبعت خريجي المدارس أن <b>أربعة لقاءات فأكثر مع أرباب عمل أثناء الدراسة</b> هي العتبة المرتبطة بنتائج أفضل في مقتبل العمر، ونسبت الفائدة إلى المعرفة والعلاقات لا إلى المهارات. وفي المراجعة الشاملة لأبحاث الإرشاد المهني، تفوّقت المشاهدة والتعلم من شخص حقيقي على مجرد تزويد الطالب بمعلومات عن عالم العمل.</p>

<p>وعمليًا، هذا سهل غالبًا في الأسرة الخليجية. أنت تعرف بالفعل أخصائي أشعة، ومهندس موقع، وموظف التزام، ومعلمًا، وصيدليًا، وشخصًا في البنك. اطلب من ثلاثة منهم عشرين دقيقة مع ابنك، ووجّه ابنك ليسأل: كيف يبدو يوم ثلاثاء عادي، وما أسوأ جزء في هذه المهنة، وماذا كنت ستدرس لو كنت في الثامنة عشرة اليوم.</p>

<p>وتحذير يستحق النقل: المهن التي يراها ابنك في التلفاز ليست المهن كما تُعاش. فقد وجدت دراسة على الصغار أنه حين لا يعرفون شخصًا يمارس المهنة، يصبح التلفاز والسينما المصدر الأساسي لما يعتقدونه عنها.</p>`}},

{id:"switch",
 t:{en:"If they change their mind, that is not failure", ar:"إن غيّر رأيه فليس ذلك فشلًا"},
 b:{en:`<p>Two corrections here, one that families overestimate and one they underestimate.</p>

<p><b>The myth that everyone switches is false.</b> The most reliable national tracking data found that about 30% of students who had declared a major changed it within three years, not the 80% that circulates online. About one in ten changed more than once.</p>

<p><b>The fear that switching ruins things is also false.</b> An analysis of more than 78,000 students across ten institutions compared graduation rates by when a student settled on their final major. Students who never switched graduated at 78%. Students who switched in the second, third, fourth, fifth or sixth term graduated at 82% to 84%. Switchers did better at nearly every point, and median time to degree held at eight terms for anyone switching through the first semester of third year. Only switching in the twelfth term dropped it, to 74%.</p>

<p class="hedge">The caveat that must go with that: the analysis only included students who had already completed sixty credits, so students who left early are not counted. The honest claim is that among students who reach third year, switching is not associated with worse outcomes. It is not proof that switching improves them.</p>

<p>One detail worth keeping in mind next time someone in the family calls a subject soft: <b>mathematics has the highest switching rate of any field, at 52%</b>, followed by the natural sciences at 40%. The rigorous, serious subjects are the ones students most often leave.</p>

<p>The practical implication for you is small and concrete. If your child knows in advance that changing direction will be met with a conversation rather than a punishment, they will tell you in first year when it is cheap, rather than in fourth year when it is not.</p>`,

    ar:`<p>هنا تصحيحان: أمر تبالغ فيه الأسر، وأمر تستهين به.</p>

<p><b>خرافة أن الجميع يغيّر تخصصه غير صحيحة.</b> فأوثق بيانات التتبع الوطنية وجدت أن نحو ٣٠٪ ممن حددوا تخصصهم غيّروه خلال ثلاث سنوات، لا ٨٠٪ كما يتداول على الإنترنت. ونحو واحد من كل عشرة غيّر أكثر من مرة.</p>

<p><b>والخوف من أن التغيير يفسد كل شيء غير صحيح أيضًا.</b> فقد قارن تحليل لأكثر من ٧٨ ألف طالب في عشر مؤسسات نسب التخرج بحسب موعد استقرار الطالب على تخصصه النهائي. الذين لم يغيّروا أبدًا تخرجوا بنسبة ٧٨٪. والذين غيّروا في الفصل الثاني أو الثالث أو الرابع أو الخامس أو السادس تخرجوا بنسبة ٨٢٪ إلى ٨٤٪. أي أن المغيّرين كانوا أفضل في كل نقطة تقريبًا، وبقي متوسط مدة الدراسة ثمانية فصول لمن غيّر حتى الفصل الأول من السنة الثالثة. ولم تنخفض النسبة إلى ٧٤٪ إلا لمن غيّر في الفصل الثاني عشر.</p>

<p class="hedge">والتحفظ الواجب ذكره معه: اقتصر التحليل على من أتمّ ستين ساعة معتمدة، أي أن من انسحب مبكرًا غير محسوب. والقول الصادق هو أن التغيير، بين من يصلون إلى السنة الثالثة، لا يرتبط بنتائج أسوأ. وليس دليلًا على أنه يحسّنها.</p>

<p>وتفصيل يستحق التذكّر حين يصف أحد في العائلة مادةً بأنها سهلة: <b>الرياضيات هي الأعلى في نسبة تغيير التخصص بين كل المجالات عند ٥٢٪</b>، تليها العلوم الطبيعية عند ٤٠٪. فالمواد الصارمة الجادة هي أكثر ما يتركه الطلبة.</p>

<p>والنتيجة العملية بالنسبة لك صغيرة وملموسة: إن علم ابنك مسبقًا أن تغيير الاتجاه سيقابَل بحوار لا بعقاب، فسيخبرك في السنة الأولى حين تكون الكلفة زهيدة، لا في السنة الرابعة حين لا تكون كذلك.</p>`}},

{id:"timing",
 t:{en:"The calendar nobody tells you about", ar:"الرزنامة التي لا يخبرك بها أحد"},
 b:{en:`<p>This is the part of the guide with the shortest shelf life and the highest cost of missing it.</p>

<p>The most valuable scholarships in the Gulf do not select students in their final year. <b>They select them in Grade 11.</b></p>

<ul>
  <li><b>Bahrain, Crown Prince's International Scholarship Programme.</b> Applicants must be enrolled in Grade 11, with a cumulative average of 97% or above across Grade 10 and the first semester of Grade 11. Applications open in March.</li>
  <li><b>Bahrain, Bapco Energies NBH Future Energy Leaders.</b> Grade 11 students only. Grade 12 students cannot apply. Minimum 95% cumulative and 97% in core subjects.</li>
  <li><b>Oman, Takatuf Scholars.</b> Omani nationals registered in Grade 11, minimum 75% overall and 75% in English in the first semester. The 2026 deadline was 25 February.</li>
</ul>

<p>Read the grade thresholds again. They are cumulative <b>from Grade 10</b>. A student whose Grade 10 results are weak has already lost eligibility for the best funded routes in the country before anyone in the family has sat down to discuss university. That is not a reason to panic in Grade 11. It is a reason to start in Grade 9.</p>

<p>There is a second timing finding that sits underneath all of this. Research on children aged 7 to 11 found that career ideas and gendered assumptions about jobs are largely formed by around age eight, and that where a child does not personally know someone doing a job, television fills the gap. Analysis of teenagers across many countries found that roughly half expect to work in one of just ten popular occupations, that this concentration has increased since 2000, and that their expectations bear little relationship to actual labour market demand.</p>

<p>By the time most families begin the conversation, most of the narrowing has already happened. Starting in Grade 11 is starting late.</p>

<p class="cta-inline">The scholarship guide on this site lists what is open to your family's passport, what each award covers, and the month each one opens.</p>`,

    ar:`<p>هذا هو الجزء الأقصر عمرًا في الدليل، والأغلى ثمنًا إن فاتك.</p>

<p>أثمن البعثات في الخليج لا تختار الطلبة في سنتهم الأخيرة. <b>بل تختارهم في الصف الحادي عشر.</b></p>

<ul>
  <li><b>البحرين، برنامج ولي العهد للمنح الدراسية العالمية.</b> يجب أن يكون المتقدم مسجلًا في الصف الحادي عشر، بمعدل تراكمي ٩٧٪ فأعلى عبر الصف العاشر والفصل الأول من الحادي عشر. ويفتح التقديم في مارس.</li>
  <li><b>البحرين، بابكو للطاقة، برنامج قادة الطاقة المستقبليين.</b> لطلبة الصف الحادي عشر فقط، ولا يمكن لطلبة الثاني عشر التقديم. بحد أدنى ٩٥٪ تراكمي و٩٧٪ في المواد الأساسية.</li>
  <li><b>عُمان، برنامج تكاتف.</b> للعُمانيين المسجلين في الصف الحادي عشر، بحد أدنى ٧٥٪ عام و٧٥٪ في الإنجليزية في الفصل الأول. وكان آخر موعد لدورة ٢٠٢٦ في ٢٥ فبراير.</li>
</ul>

<p>أعد قراءة حدود المعدلات. إنها تراكمية <b>من الصف العاشر</b>. أي أن الطالب ضعيف نتائج العاشر يكون قد خسر أهليته لأفضل المسارات تمويلًا في بلده قبل أن يجلس أحد في الأسرة ليتحدث عن الجامعة. وهذا ليس سببًا للذعر في الحادي عشر، بل سبب للبدء في التاسع.</p>

<p>وتحت هذا كله نتيجة توقيت ثانية. فقد وجدت أبحاث على أطفال بين السابعة والحادية عشرة أن التصورات المهنية والافتراضات المرتبطة بالجنس عن المهن تتشكل إلى حد بعيد عند الثامنة تقريبًا، وأنه حين لا يعرف الطفل شخصًا يمارس المهنة يملأ التلفاز الفراغ. كما وجد تحليل للمراهقين في دول كثيرة أن نحو نصفهم يتوقعون العمل في عشر مهن شهيرة فقط، وأن هذا التركّز ازداد منذ عام ٢٠٠٠، وأن توقعاتهم لا تكاد ترتبط بالطلب الحقيقي في سوق العمل.</p>

<p>فحين تبدأ معظم الأسر الحوار تكون معظم التصفية قد حدثت أصلًا. البدء في الصف الحادي عشر بدءٌ متأخر.</p>

<p class="cta-inline">دليل المنح في هذا الموقع يعرض ما هو متاح لجواز أسرتك، وماذا تغطي كل منحة، وفي أي شهر تفتح.</p>`}},

{id:"unknown",
 t:{en:"What is not known, said plainly", ar:"ما لا نعرفه، بصراحة"},
 b:{en:`<p>A guide that only reports the findings that suit its argument is not worth trusting. These are the gaps.</p>

<ul>
  <li>There is <b>no study</b> that isolates students who chose a major to satisfy their family and tracks what happened to them afterwards. The argument here is built on research into motivation more generally, which is close but not the same thing.</li>
  <li>There is <b>no recent published research</b> on family influence on major choice specific to Bahrain or Kuwait. The Gulf figures used here are Saudi, Emirati and Qatari.</li>
  <li>There is <b>no Gulf data</b> on how often students switch majors, or on how many graduates end up working outside their field.</li>
  <li>There is <b>no tested evidence</b> for any specific wording a parent should use. The questions suggested above are reasoned, not trialled.</li>
  <li>Some of the strongest findings here are correlations across large populations. They describe tendencies, not your child.</li>
</ul>

<p>Where a number could not be verified against its original source, it has been left out of this page rather than rounded into something quotable.</p>`,

    ar:`<p>الدليل الذي ينقل فقط النتائج التي تخدم رأيه لا يستحق الثقة. وهذه هي الثغرات.</p>

<ul>
  <li><b>لا توجد دراسة</b> تعزل الطلبة الذين اختاروا تخصصهم إرضاءً لأسرهم وتتبع ما حدث لهم بعد ذلك. والحجة هنا مبنية على أبحاث الدافعية عمومًا، وهي قريبة لكنها ليست الشيء نفسه.</li>
  <li><b>لا توجد أبحاث منشورة حديثة</b> عن تأثير الأسرة في اختيار التخصص خاصة بالبحرين أو الكويت. والأرقام الخليجية المستخدمة هنا سعودية وإماراتية وقطرية.</li>
  <li><b>لا توجد بيانات خليجية</b> عن معدلات تغيير التخصص، ولا عن نسبة الخريجين الذين يعملون خارج مجال دراستهم.</li>
  <li><b>لا يوجد دليل مختبَر</b> على صياغة بعينها ينبغي للوالد استخدامها. والأسئلة المقترحة أعلاه مستنتجة لا مجرّبة.</li>
  <li>بعض أقوى النتائج هنا ارتباطات عبر مجموعات كبيرة، تصف اتجاهات عامة لا تصف ابنك أنت.</li>
</ul>

<p>وحيثما تعذّر التحقق من رقم في مصدره الأصلي، حُذف من هذه الصفحة بدل تقريبه إلى عبارة قابلة للاقتباس.</p>`}},

{id:"close",
 t:{en:"One last thing", ar:"أمر أخير"},
 b:{en:`<p>The decision your child is making is smaller than it feels. They are not choosing a life. They are choosing what to study first, in a labour market where 39% of the skills people use are expected to change within five years, where 42% of recent graduates are working in jobs that do not need their degree, and where nearly four in ten employers in Saudi Arabia say they intend to stop asking about degrees at all.</p>

<p>What will not change is whether your child learned how to make a considered decision, and whether they know they can come back to you and say they got it wrong. Those two things are within your control this year. The field name on the certificate mostly is not.</p>`,

    ar:`<p>القرار الذي يتخذه ابنك أصغر مما يبدو. فهو لا يختار حياة كاملة، بل يختار ماذا يدرس أولًا، في سوق عمل يُتوقع أن تتغير فيه ٣٩٪ من المهارات المستخدمة خلال خمس سنوات، ويعمل فيه ٤٢٪ من حديثي التخرج في وظائف لا تشترط شهادتهم، ويقول فيه نحو أربعة من كل عشرة من أصحاب العمل في السعودية إنهم ينوون التوقف عن السؤال عن الشهادات أصلًا.</p>

<p>وما لن يتغير هو: هل تعلّم ابنك كيف يتخذ قرارًا مدروسًا، وهل يعلم أنه يستطيع العودة إليك ليقول إنه أخطأ. هذان الأمران في يدك هذا العام. أما اسم التخصص على الشهادة فليس كذلك في الغالب.</p>`}}

  $("lede").textContent = LEDE[lang];

  $("t-quizline").innerHTML = N.quizline;
  $("t-quizbtn").textContent = N.quizbtn;
  $("t-schline").innerHTML = N.schline;
  $("t-schbtn").textContent = N.schbtn;
  $("t-expline").innerHTML = N.expline;
  $("t-expbtn").textContent = N.expbtn;
  $("t-entline").innerHTML = N.entline;
  $("t-entbtn").textContent = N.entbtn;
  $("t-contents").textContent = N.contents;
  $("t-print").textContent = N.print;
  $("t-disc").textContent = N.disc;
  $("t-foot").innerHTML = N.foot;

  $("toc").innerHTML = SECTIONS.map((s, i) =>
    `<li><a href="#${s.id}"><span class="tn">${i + 1}</span>${s.t[lang]}</a></li>`).join("");

  $("body").innerHTML = SECTIONS.map((s, i) => `
    <section class="chap" id="${s.id}">
      <h2><span class="cn">${i + 1}</span>${s.t[lang]}</h2>
      ${s.b[lang]}
    </section>`).join("");

  const S = SRC[lang];
  $("srcT").textContent = S.t;
  $("srcS").textContent = S.s;
  $("srcList").innerHTML = S.items.map(it =>
    `<li><a href="${it[1]}" target="_blank" rel="noopener">${it[0]}</a></li>`).join("");
}

$("langToggle").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});
$("t-print").addEventListener("click", () => window.print());

render();

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
    /* Links that point at saqeralkhalifa.com have an Arabic twin. The
       main site is two separate pages, not a toggle, so the href has to
       move with the language or an Arabic reader lands in English. */
    var h = document.querySelectorAll("[data-href-en]");
    for(var j=0;j<h.length;j++){
      var v = h[j].getAttribute("data-href-"+l);
      if(v) h[j].setAttribute("href", v);
    }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
/* MCLANG boot: applies the resolved language by driving the page's own toggle,
   then remembers whatever the visitor lands on. */
(function(){
  /* The visitor's language has to survive every click, including clicks that
     cross from one of these sites to another. They sit on different origins,
     so localStorage cannot carry the choice across; every internal link gets
     stamped with the current language instead. */
  var HOSTS = ["saqeralkhalifa.github.io", "internships.saqeralkhalifa.com",
               "saqeralkhalifa.com", "www.saqeralkhalifa.com"];

  function cur(){ return document.documentElement.lang === "ar" ? "ar" : "en"; }

  /* Never overwrite a lang that is already on the link. An explicit ?lang=ar
     link is itself a deliberate choice and outranks the running preference. */
  function stamp(a){
    try{
      var raw = a.getAttribute("href");
      if(!raw || raw.charAt(0) === "#") return;
      var u = new URL(raw, location.href);
      if(u.protocol !== "http:" && u.protocol !== "https:") return;
      if(HOSTS.indexOf(u.hostname) === -1) return;
      if(u.searchParams.has("lang")) return;
      u.searchParams.set("lang", cur());
      a.setAttribute("href", u.toString());
    }catch(e){}
  }
  function onAnchor(e){
    var t = e.target;
    var a = (t && t.closest) ? t.closest("a[href]") : null;
    if(a) stamp(a);
  }
  /* Capture phase, so the href is correct before the browser follows it.
     auxclick covers middle click, contextmenu covers "copy link address". */
  ["click", "auxclick", "contextmenu"].forEach(function(ev){
    document.addEventListener(ev, onAnchor, true);
  });

  var b = document.getElementById("langToggle");
  if(!b) return;
  var want = mcInitLang();
  if(want === "ar" && document.documentElement.lang !== "ar") b.click();
  if(want === "en" && document.documentElement.lang === "ar") b.click();
  mcSaveLang(want);
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){
        mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en");
      }, 0);
    }
  }, true);
})();
</script>
