<meta name="robots" content="noindex, follow">
<script>
/* This page has moved to its own site. Carry the visitor's language across
   with it, because the new site is on a different origin and cannot read the
   language this one had stored. */
(function(){
  var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
  if(!q){ try{ var s = localStorage.getItem("mc-lang"); if(s === "ar" || s === "en") q = s; }catch(e){} }
  if(!q){
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    q = /^ar/i.test(n) ? "ar" : "en";
  }
  location.replace("https://internships.saqeralkhalifa.com/?lang=" + q);
})();
</script>
