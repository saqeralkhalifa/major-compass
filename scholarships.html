<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarships and Funding | Dr. Saqer AlKhalifa</title>
<meta name="description" content="A free bilingual scholarship and funding guide for students in Bahrain and the Gulf: national scholarships, foreign government scholarships, university funding abroad, and an honest list of the schemes that are not open to Gulf students.">
<script data-goatcounter="https://majorcompass.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101418; --ink-2:#4a5158; --ink-3:#8a9199;
    --paper:#faf9f6; --card:#ffffff; --line:#e6e3dc;
    --accent:#1c5d99; --accent-soft:#e8f0f8; --gold:#b98c2f; --good:#0e7a4d;
    --warn:#8a5a12; --warn-soft:#fdf4e3; --bad:#a3413a; --bad-soft:#fbeceb;
    --radius:14px; --shadow:0 1px 3px rgba(16,20,24,.06), 0 8px 24px rgba(16,20,24,.07);
    color-scheme: light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper); color:var(--ink); line-height:1.6; min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, Arial, sans-serif;}
  [dir="rtl"] body{font-family:'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', Arial, sans-serif;}
  .serif{font-family:Georgia, 'Times New Roman', serif;}
  [dir="rtl"] .serif{font-family:'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', Georgia, serif;}
  .wrap{max-width:820px; margin:0 auto; padding:0 20px 80px;}

  header.site{display:flex; align-items:center; justify-content:space-between;
    padding:18px 0 14px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .brand{font-size:.95rem; color:var(--ink-2); text-decoration:none;}
  .brand strong{color:var(--ink); font-weight:600;}
  .lang-toggle{border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:7px 16px; font-size:.95rem; cursor:pointer; color:var(--accent); font-weight:600;
    font-family:inherit; transition:all .15s;}
  .lang-toggle:hover{background:var(--accent-soft);}

  .hero{text-align:center; padding:40px 0 6px;}
  .hero h1{font-size:2.1rem; line-height:1.25; margin-bottom:8px;}
  .hero p{color:var(--ink-2); font-size:1.08rem; max-width:640px; margin:0 auto;}

  .rules{margin:26px 0 8px; display:grid; gap:12px;}
  .rule{border-radius:var(--radius); padding:16px 20px; border:1px solid;}
  .rule h3{font-size:1rem; font-weight:800; margin-bottom:5px;}
  .rule p{font-size:.95rem; line-height:1.55;}
  .rule.w{background:var(--warn-soft); border-color:#efdcb6; color:#5c4415;}
  .rule.w h3{color:var(--warn);}
  .rule.b{background:var(--bad-soft); border-color:#f0cfcc; color:#6b3630;}
  .rule.b h3{color:var(--bad);}
  .rule.n{background:var(--accent-soft); border-color:#cfe0ef; color:#204660;}
  .rule.n h3{color:var(--accent);}

  .quizbar{background:var(--accent-soft); border:1px solid #cfe0ef; border-radius:var(--radius);
    padding:16px 20px; margin:12px 0 0; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .quizbar p{flex:1 1 260px; font-size:.98rem; color:var(--ink-2); margin:0;}
  .quizbar b{color:var(--ink);}
  .btn{display:inline-block; border:none; cursor:pointer; text-decoration:none; text-align:center;
    background:var(--accent); color:#fff; font-size:.98rem; font-weight:600; font-family:inherit;
    padding:11px 24px; border-radius:999px; transition:transform .12s;
    box-shadow:0 4px 14px rgba(28,93,153,.28); white-space:nowrap;}
  .btn:hover{transform:translateY(-1px);}
  .btn.ghost{background:var(--card); color:var(--accent); border:1.5px solid #cfe0ef; box-shadow:none;}

  .tools{position:sticky; top:0; background:var(--paper); padding:14px 0 12px; z-index:5;
    border-bottom:1px solid var(--line); margin:24px 0 18px;}
  .picker{margin-bottom:10px;}
  .picker .lbl{font-size:.8rem; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-3); font-weight:700; margin-bottom:6px; display:block;}
  [dir="rtl"] .picker .lbl{letter-spacing:0; text-transform:none; font-size:.9rem;}
  .filters{display:flex; gap:7px; flex-wrap:wrap;}
  .fbtn{background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 15px; font-size:.9rem; font-family:inherit; color:var(--ink-2); cursor:pointer;}
  .fbtn:hover{border-color:var(--accent);}
  .fbtn.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .search{width:100%; font-family:inherit; font-size:1rem; padding:12px 18px; margin-top:4px;
    border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink);}
  .search:focus{outline:none; border-color:var(--accent);}
  .count{font-size:.85rem; color:var(--ink-3); margin-top:9px;}

  .grp{margin-bottom:34px;}
  .grp-t{font-size:1.35rem; font-weight:800; margin-bottom:4px;}
  .grp-s{font-size:.95rem; color:var(--ink-2); margin-bottom:14px;}

  .mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;}
  .mcard.dead{background:#fdfbfa; border-color:#f0e2e0;}
  .mhead{display:flex; align-items:center; gap:14px; padding:18px 22px; cursor:pointer; width:100%;
    background:none; border:none; text-align:start; font-family:inherit; color:var(--ink);}
  .mhead:hover{background:var(--accent-soft);}
  .mhead h2{font-size:1.1rem; font-weight:700; flex:1; line-height:1.4;}
  .chev{color:var(--accent); font-size:1.1rem; flex:0 0 auto; transition:transform .2s;}
  .mcard.open .chev{transform:rotate(90deg);}
  [dir="rtl"] .chev{transform:rotate(180deg);}
  [dir="rtl"] .mcard.open .chev{transform:rotate(90deg);}
  .badge{display:inline-block; font-size:.72rem; font-weight:700; border-radius:999px;
    padding:3px 11px; margin-inline-start:9px; vertical-align:middle; white-space:nowrap;}
  .badge.g{background:#e4f4ec; color:var(--good);}
  .badge.a{background:var(--warn-soft); color:var(--warn);}
  .badge.b{background:var(--accent-soft); color:var(--accent);}
  .badge.n{background:#eeecea; color:var(--ink-3);}
  .badge.r{background:var(--bad-soft); color:var(--bad);}

  .mbody{display:none; padding:0 22px 20px; border-top:1px solid var(--line);}
  .mcard.open .mbody{display:block;}
  .sec{margin-top:16px;}
  .sec h3{font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
    font-weight:800; margin-bottom:5px;}
  [dir="rtl"] .sec h3{letter-spacing:0; text-transform:none; font-size:.93rem;}
  .sec p{color:var(--ink-2); font-size:.98rem;}
  .sec p b{color:var(--ink);}
  .flag{margin-top:16px; background:var(--warn-soft); border:1px solid #efdcb6;
    border-radius:10px; padding:12px 16px;}
  .flag b{display:block; font-size:.8rem; letter-spacing:.07em; text-transform:uppercase;
    color:var(--warn); margin-bottom:4px;}
  [dir="rtl"] .flag b{letter-spacing:0; text-transform:none; font-size:.93rem;}
  .flag p{font-size:.95rem; color:#5c4415;}
  .flag p b{display:inline; font-size:inherit; letter-spacing:0; text-transform:none; color:#3f2f0e;}
  .olink{display:inline-block; margin-top:16px; color:var(--accent); font-weight:600;
    font-size:.95rem; text-decoration:none;}
  .olink:hover{text-decoration:underline;}
  .empty{text-align:center; color:var(--ink-3); padding:40px 0;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:24px; margin-bottom:24px;}
  .panel h2{font-size:1.25rem; font-weight:800; margin-bottom:4px;}
  .panel .sub{font-size:.93rem; color:var(--ink-2); margin-bottom:14px;}
  .cal-row{display:grid; grid-template-columns:110px 1fr; gap:12px; padding:9px 0;
    border-bottom:1px dashed var(--line); font-size:.94rem;}
  .cal-row:last-child{border-bottom:none;}
  .cal-row b{color:var(--accent); font-weight:700;}
  .cal-row span{color:var(--ink-2);}
  .checked{background:var(--warn-soft); border:1px solid #efdcb6; border-radius:var(--radius);
    padding:16px 20px; margin-bottom:24px; color:#5c4415;}
  .checked b{display:block; color:var(--warn); font-weight:800; margin-bottom:4px;}
  .checked p{font-size:.93rem; line-height:1.55;}

  footer.site{margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
    text-align:center; font-size:.85rem; color:var(--ink-3);}
  footer.site a{color:var(--accent); text-decoration:none;}
  .disc{font-size:.84rem; color:var(--ink-3); max-width:660px; margin:0 auto 14px; line-height:1.55;}

  @media (max-width:560px){
    .hero h1{font-size:1.6rem;}
    .mhead{padding:15px 16px;} .mbody{padding:0 16px 16px;}
    .mhead h2{font-size:1rem;}
    .badge{display:inline-block; margin:5px 0 0; margin-inline-start:0;}
    .cal-row{grid-template-columns:1fr; gap:2px;}
    .panel{padding:18px;}
  }
  @media print{ .tools, .quizbar, .lang-toggle{display:none;} .mbody{display:block!important;} }

/* ============================================================
   Shared design system, applied across every page
   ============================================================ */
:root{
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Source Sans 3', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --font-ar:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif;

  --paper:#fbf9f5;
  --paper-2:#f4f0e7;
  --card:#ffffff;
  --line:#e7e1d5;
  --line-2:#d6ccb9;

  --ink:#14181d;
  --ink-2:#4a525b;
  --ink-3:#8b929b;

  --navy:#14365c;
  --navy-deep:#0d2036;
  --accent:#16456f;
  --accent-soft:#eaf0f7;
  --accent-line:#c9d9ea;

  --gold:#a37518;
  --gold-soft:#fbf3e1;
  --gold-line:#ecdcb4;
  --gold-bright:#c79a3a;

  --good:#0d6f47;
  --good-soft:#e8f4ee;
  --good-line:#c4e2d3;
  --warn:#8a5a12;
  --warn-soft:#fbf3e1;
  --warn-line:#ecdcb4;
  --bad:#9c3b34;
  --bad-soft:#fbecea;
  --bad-line:#eecdc9;

  --radius:16px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,24,29,.04), 0 14px 30px -16px rgba(20,24,29,.20);
  --shadow-lift:0 2px 4px rgba(20,24,29,.05), 0 22px 40px -20px rgba(20,24,29,.28);
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar);}
body::before{
  content:""; position:fixed; inset:0 0 auto 0; height:3px; z-index:99;
  background:linear-gradient(90deg, var(--navy-deep), var(--navy) 38%, var(--gold-bright) 72%, var(--gold) 100%);
}

.serif, .chap h2, .cn, .stat-n, .minrow b{
  font-family:var(--font-display);
  font-variation-settings:'SOFT' 22, 'WONK' 0;
  letter-spacing:-.012em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .stat-n{
  font-family:var(--font-ar); font-variation-settings:normal; letter-spacing:0; font-weight:700;
}
h1,h2,h3{letter-spacing:-.01em;}
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{letter-spacing:0;}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--gold-soft); color:var(--navy-deep);}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2.5px solid var(--gold-bright); outline-offset:2px; border-radius:6px;
}

/* ---------- masthead ---------- */
header.site{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:16px 0 14px; border-bottom:1px solid var(--line); margin-bottom:0;
}
header.site .brand{
  display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; min-width:0;
}
header.site .mark{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 30%, #1d4a79, var(--navy-deep));
  box-shadow:0 2px 8px rgba(13,32,54,.28), inset 0 0 0 1px rgba(232,194,106,.45);
}
header.site .bt{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
header.site .bt strong{
  font-family:var(--font-display); font-weight:600; font-size:1.06rem; color:var(--ink);
  letter-spacing:-.015em; white-space:nowrap;
}
[dir="rtl"] header.site .bt strong{font-family:var(--font-ar); letter-spacing:0;}
header.site .bs{
  font-size:.74rem; color:var(--ink-3); letter-spacing:.07em; text-transform:uppercase; white-space:nowrap;
}
[dir="rtl"] header.site .bs{letter-spacing:0; text-transform:none; font-size:.82rem;}
.lang-toggle{
  flex:0 0 auto; border:1px solid var(--line-2); background:var(--card); border-radius:999px;
  padding:7px 17px; font-size:.9rem; cursor:pointer; color:var(--accent); font-weight:600;
  font-family:inherit; transition:background .15s, border-color .15s, transform .12s;
}
.lang-toggle:hover{background:var(--accent-soft); border-color:var(--accent-line); transform:translateY(-1px);}

/* ---------- tool switcher ---------- */
.toolnav{
  display:flex; gap:6px; padding:12px 0 4px; overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid var(--line); margin-bottom:4px;
}
.toolnav::-webkit-scrollbar{display:none;}
.toolnav a{
  flex:0 0 auto; text-decoration:none; font-size:.88rem; font-weight:600; color:var(--ink-2);
  padding:7px 14px; border-radius:999px; border:1px solid transparent; white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s;
}
.toolnav a:hover{background:var(--accent-soft); color:var(--accent);}
.toolnav a.on{background:var(--navy); color:#fff; box-shadow:0 3px 10px -3px rgba(20,54,92,.6);}
.toolnav a.on:hover{background:var(--navy-deep); color:#fff;}

/* ---------- hero ---------- */
.hero, .res-head{position:relative;}
.hero::before{
  content:""; position:absolute; z-index:-1; left:50%; top:-40px; transform:translateX(-50%);
  width:min(760px, 118%); height:330px; pointer-events:none;
  background:
    radial-gradient(closest-side, rgba(199,154,58,.13), transparent 72%) 22% 12%/58% 78% no-repeat,
    radial-gradient(closest-side, rgba(20,54,92,.13), transparent 72%) 82% 34%/62% 82% no-repeat;
  filter:blur(2px);
}
.hero h1{font-size:clamp(1.75rem, 1.15rem + 2.3vw, 2.5rem); line-height:1.18; font-weight:600;}
[dir="rtl"] .hero h1{line-height:1.4; font-weight:700;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker{color:var(--gold); font-weight:700;}

/* ---------- surfaces ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox{
  border-radius:var(--radius); border-color:var(--line); box-shadow:var(--shadow);
}
.mcard, .pcard{transition:box-shadow .18s, border-color .18s, transform .18s;}
.mcard:hover, .pcard:hover{box-shadow:var(--shadow-lift); border-color:var(--line-2);}
.pcard{border-inline-start-width:5px;}

/* ---------- buttons and chips ---------- */
.btn{
  background:linear-gradient(180deg, #1d4d7c, var(--navy));
  border:none; border-radius:999px; font-weight:600; letter-spacing:.005em; color:#fff;
  box-shadow:0 2px 4px rgba(13,32,54,.18), 0 10px 22px -10px rgba(13,32,54,.7);
  transition:transform .14s, box-shadow .14s, filter .14s;
}
.btn:hover{transform:translateY(-1.5px); box-shadow:0 3px 6px rgba(13,32,54,.2), 0 16px 30px -12px rgba(13,32,54,.75); filter:saturate(1.08);}
.btn.ghost, .btn.secondary{
  background:var(--card); color:var(--accent); border:1.5px solid var(--accent-line);
  box-shadow:0 1px 2px rgba(20,24,29,.04);
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--accent-soft); border-color:var(--accent);}
.fbtn{
  border:1.5px solid var(--line-2); border-radius:999px; background:var(--card); color:var(--ink-2);
  transition:border-color .15s, background .15s, color .15s, transform .12s;
}
.fbtn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
.fbtn.on{
  background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;
  box-shadow:0 3px 10px -4px rgba(20,54,92,.75);
}
.printbtn{border-color:var(--accent-line);}
.printbtn:hover{background:var(--accent-soft);}

/* ---------- bars and callouts ---------- */
.bar, .quizbar, .cta-inline{
  background:linear-gradient(180deg, #f2f6fb, var(--accent-soft));
  border:1px solid var(--accent-line); border-radius:var(--radius);
}
.rule, .checked, .hedge, .extra, .flag{border-radius:var(--radius-sm);}
.rule.w, .checked, .hedge, .extra, .flag{
  background:linear-gradient(180deg, #fdf8ec, var(--gold-soft)); border-color:var(--gold-line);
}
.rule.b{background:linear-gradient(180deg, #fdf1ef, var(--bad-soft)); border-color:var(--bad-line);}
.rule.n{background:linear-gradient(180deg, #f2f6fb, var(--accent-soft)); border-color:var(--accent-line);}

/* ---------- section labels ---------- */
.sec h3, .lbl, .toc h2{letter-spacing:.1em; font-weight:800;}
[dir="rtl"] .sec h3, [dir="rtl"] .lbl, [dir="rtl"] .toc h2{letter-spacing:0;}
.grp-t, .grp h2, .panel h2, .srcbox h2, .majors-title{font-family:var(--font-display); letter-spacing:-.012em; font-weight:600;}
[dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title{font-family:var(--font-ar); letter-spacing:0; font-weight:700;}

/* ---------- footer ---------- */
footer.site{
  margin-top:52px; padding:26px 0 0; border-top:1px solid var(--line); color:var(--ink-3);
}
footer.site a{color:var(--accent); font-weight:600;}

@media (max-width:520px){
  header.site .bs{display:none;}
  .toolnav a{font-size:.83rem; padding:6px 12px;}
}

/* ---------- page specific polish ---------- */
:root{--accent-2:#2f6da6;}
body:has(#screen-quiz.active) .toolnav{display:none;}
.bar-fill{background:linear-gradient(90deg, var(--navy), #2f6da6);}
.viz-bar-fill, .viz-row .fill{background:linear-gradient(90deg, var(--navy), var(--accent-2));}
.navbtn{
  background:var(--card); border:1.5px solid var(--line-2); border-radius:999px;
  color:var(--ink-2); font-weight:600; transition:border-color .15s, color .15s, transform .12s, background .15s;
}
.navbtn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); transform:translateY(-1px);}
.section-chip{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);}
.opt{border-radius:var(--radius-sm); transition:border-color .15s, background .15s, box-shadow .15s;}
.opt.selected{box-shadow:0 0 0 1px var(--accent) inset;}
[dir="rtl"] body::before{
  background:linear-gradient(270deg, var(--navy-deep), var(--navy) 38%, var(--gold-bright) 72%, var(--gold) 100%);
}
.hero::before{filter:blur(0px); opacity:.85;}
.mhead h2, .phead .ptxt b, .mcard h3{letter-spacing:-.005em;}

@media print{ .toolnav, body::before, .crosslinks{display:none;} }
  .crosslinks{margin-top:44px; padding-top:26px; border-top:1px solid var(--line);}
  .crosslinks .quizbar:first-child, .crosslinks .bar:first-child{margin-top:0;}


</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="./">
      <span class="mark" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="29" stroke="#e8c26a" stroke-width="3"/><path d="M32 8 L36.5 27.5 L56 32 L36.5 36.5 L32 56 L27.5 36.5 L8 32 L27.5 27.5 Z" fill="#e8c26a"/><circle cx="32" cy="32" r="3.2" fill="#0d2036"/></svg></span>
      <span class="bt"><strong data-en="Major Compass" data-ar="بوصلة التخصص">Major Compass</strong><span class="bs" data-en="Dr. Saqer AlKhalifa" data-ar="د. صقر آل خليفة">Dr. Saqer AlKhalifa</span></span>
    </a>
    <button class="lang-toggle" id="langToggle">عربي</button>
  </header>
  <nav class="toolnav" aria-label="Tools">

<script>
/* ===== Part 1: national and government schemes inside the GCC ===== */
const S1 = [

/* ---------- BAHRAIN ---------- */
{id:"cpisp", cat:"nat", ct:"bh", who:["bh"], lvl:"ug", st:"grade11",
 n:{en:"Crown Prince's International Scholarship Programme (CPISP)", ar:"برنامج ولي العهد للمنح الدراسية العالمية"},
 el:{en:"Bahraini citizens who are <b>currently in Grade 11</b>, with a cumulative average of <b>97% or above</b> across Grade 10 and the first semester of Grade 11.",
     ar:"المواطنون البحرينيون الذين هم <b>في الصف الحادي عشر حاليًا</b>، بمعدل تراكمي <b>٩٧٪ فأعلى</b> عبر الصف العاشر والفصل الأول من الحادي عشر."},
 cv:{en:"Full university costs, plus internships, career guidance and job placement. Public school scholars first complete a two year American High School Diploma or A Levels at a boarding school. Around 20 scholarships a year.",
     ar:"تكاليف الدراسة الجامعية كاملة، مع تدريب عملي وإرشاد مهني وتوظيف. طلبة المدارس الحكومية يكملون أولًا دبلومًا ثانويًا أمريكيًا أو مستوى A لمدة سنتين في مدرسة داخلية. نحو ٢٠ منحة سنويًا."},
 wn:{en:"Opens every year in <b>March</b>. The 2026 round has closed, so the next one is expected in March 2027.",
     ar:"يفتح سنويًا في <b>مارس</b>. أُغلقت دورة ٢٠٢٦، والدورة القادمة متوقعة في مارس ٢٠٢٧."},
 fl:{en:"This is the most important timing message for any Bahraini student. You apply a year and a half before you leave school. If you wait for your final results you have already missed it.",
     ar:"هذه أهم رسالة توقيت لأي طالب بحريني. التقديم يتم قبل مغادرة المدرسة بسنة ونصف. إذا انتظرت نتيجتك النهائية تكون قد فاتتك."},
 url:"https://www.cpisp.bh/CPISPapplication"},

{id:"bhmoe", cat:"nat", ct:"bh", who:["bh"], lvl:"ug", st:"check",
 n:{en:"Ministry of Education scholarships and grants", ar:"بعثات ومنح وزارة التربية والتعليم"},
 el:{en:"Bahraini secondary school leavers. In the 2025/26 plan: full scholarships for <b>95% and above</b>, grants for <b>90 to 94.9%</b>.",
     ar:"خريجو الثانوية البحرينيون. في خطة ٢٠٢٥/٢٠٢٦: بعثات كاملة لمن حصل على <b>٩٥٪ فأعلى</b>، ومنح لمن حصل على <b>٩٠ إلى ٩٤٫٩٪</b>."},
 cv:{en:"Over 4,000 awards in the last published plan: about 1,900 full scholarships and 2,300 grants, plus 300 nursing scholarships, 12 international scholarships in the US and UK, and 5 at Al Azhar. Mostly at University of Bahrain, Bahrain Polytechnic and other local institutions.",
     ar:"أكثر من ٤٠٠٠ مقعد في آخر خطة منشورة: نحو ١٩٠٠ بعثة كاملة و٢٣٠٠ منحة، إضافة إلى ٣٠٠ بعثة تمريض، و١٢ بعثة دولية في أمريكا وبريطانيا، و٥ في الأزهر. معظمها في جامعة البحرين وبوليتكنك البحرين ومؤسسات محلية أخرى."},
 wn:{en:"The 2025 window ran <b>8 to 14 July</b>. The Ministry has announced registration for 2026/27 but the exact dates were not confirmed at the time of writing, so treat July as the likely month and check the portal.",
     ar:"دورة ٢٠٢٥ كانت من <b>٨ إلى ١٤ يوليو</b>. أعلنت الوزارة فتح التسجيل لعام ٢٠٢٦/٢٠٢٧ لكن التواريخ الدقيقة لم تتأكد وقت الكتابة، فاعتبر يوليو الشهر المرجح وراجع البوابة."},
 fl:{en:"Grant holders apply <b>after</b> securing a university place, within two months of admission. Scholarship holders are placed by the Ministry.",
     ar:"أصحاب المنح يقدّمون <b>بعد</b> الحصول على مقعد جامعي، خلال شهرين من القبول. أما أصحاب البعثات فتوزعهم الوزارة."},
 url:"https://scholarship.moe.gov.bh/"},

{id:"nbh", cat:"nat", ct:"bh", who:["bh"], lvl:"ug", st:"grade11",
 n:{en:"Bapco Energies, NBH Future Energy Leaders (undergraduate track)", ar:"بابكو للطاقة، برنامج قادة الطاقة المستقبليين (المسار الجامعي)"},
 el:{en:"Bahraini nationals <b>in Grade 11</b> at the time of applying, with a minimum <b>95% cumulative average and 97% in core subjects</b>, and active extracurricular involvement.",
     ar:"مواطنون بحرينيون <b>في الصف الحادي عشر</b> وقت التقديم، بمعدل تراكمي لا يقل عن <b>٩٥٪ و٩٧٪ في المواد الأساسية</b>، مع مشاركة فاعلة في الأنشطة."},
 cv:{en:"Full tuition and academic fees at approved international universities, skills workshops, internships and mentoring. Fields: engineering, business, IT and cybersecurity, sustainability and energy, law and governance.",
     ar:"الرسوم الدراسية والأكاديمية كاملة في جامعات دولية معتمدة، مع ورش مهارات وتدريب وإرشاد. المجالات: الهندسة، الأعمال، تقنية المعلومات والأمن السيبراني، الاستدامة والطاقة، القانون والحوكمة."},
 wn:{en:"The 2026 round ran <b>15 June to 16 July</b> and has closed. Expect a similar window in 2027.",
     ar:"دورة ٢٠٢٦ كانت من <b>١٥ يونيو إلى ١٦ يوليو</b> وقد أُغلقت. توقع فترة مشابهة في ٢٠٢٧."},
 fl:{en:"There is an employment bond. You must join Bapco Energies within 60 days of an offer or repay the scholarship. A separate postgraduate track exists but it requires three years of work experience, so school leavers cannot use it.",
     ar:"يوجد التزام وظيفي. عليك الالتحاق ببابكو للطاقة خلال ٦٠ يومًا من العرض أو إعادة قيمة البعثة. يوجد مسار دراسات عليا منفصل لكنه يشترط ثلاث سنوات خبرة عمل، فلا يصلح لخريجي الثانوية."},
 url:"https://www.bapcoenergies.com/nbh-future-energy-leaders/undergraduate"},

{id:"waqfisa", cat:"nat", ct:"bh", who:["bh"], lvl:"ug", st:"check",
 n:{en:"Isa bin Salman Education Charitable Trust (Waqf Isa)", ar:"وقف عيسى بن سلمان التعليمي الخيري"},
 el:{en:"Bahraini students. There are separate bachelor's and master's rounds, so a school leaver applies to the <b>bachelor's round</b> only.",
     ar:"الطلبة البحرينيون. توجد دورتان منفصلتان للبكالوريوس والماجستير، وخريج الثانوية يقدّم على <b>دورة البكالوريوس</b> فقط."},
 cv:{en:"Study support through a partner network of 15 local and 4 international universities.",
     ar:"دعم دراسي عبر شبكة شركاء تضم ١٥ جامعة محلية و٤ جامعات دولية."},
 wn:{en:"The 2025/26 bachelor's round ran <b>29 May to 12 June</b>. The 2026 dates were not published at the time of writing, so check the portal in May and June.",
     ar:"دورة بكالوريوس ٢٠٢٥/٢٠٢٦ كانت من <b>٢٩ مايو إلى ١٢ يونيو</b>. لم تُنشر تواريخ ٢٠٢٦ وقت الكتابة، فراجع البوابة في مايو ويونيو."},
 url:"https://waqfisa.bh/"},

{id:"rayaat", cat:"nat", ct:"bh", who:["bh"], lvl:"ug", st:"check",
 n:{en:"AlMabarrah Al Khalifia Foundation, Rayaat Scholarship Programme", ar:"مؤسسة المبرة الخليفية، برنامج رايات للمنح الدراسية"},
 el:{en:"Bahraini nationals studying <b>inside Bahrain</b>. Minimum <b>85%</b> high school average for government universities and <b>95%</b> for Euro University of Bahrain. You must not already hold any other grant, scholarship or financial assistance, and must not already hold a bachelor's degree. Evidence of achievement and volunteering is required.",
     ar:"مواطنون بحرينيون يدرسون <b>داخل البحرين</b>. الحد الأدنى <b>٨٥٪</b> في الثانوية للجامعات الحكومية و<b>٩٥٪</b> للجامعة الأوروبية بالبحرين. يجب ألا تكون حاصلًا على أي منحة أو بعثة أو دعم مالي آخر، وألا تكون حاصلًا على بكالوريوس. يُطلب إثبات التميز والعمل التطوعي."},
 cv:{en:"Fully sponsored university fees, book allowance, monthly incentives for high achievers, enrichment workshops and internships. Partners include University of Bahrain, Bahrain Polytechnic, RCSI Bahrain for medicine, Ahlia, AUBH, British University of Bahrain, University of Technology Bahrain, Euro University and University of London degrees through BIBF.",
     ar:"رسوم جامعية مدفوعة بالكامل، وبدل كتب، وحوافز شهرية للمتفوقين، وورش إثرائية وتدريب عملي. من الشركاء: جامعة البحرين، بوليتكنك البحرين، الكلية الملكية للجراحين في البحرين للطب، الأهلية، الجامعة الأمريكية بالبحرين، الجامعة البريطانية بالبحرين، جامعة البحرين التقنية، الجامعة الأوروبية، وشهادات جامعة لندن عبر بيبف."},
 wn:{en:"Around <b>late March and April</b>. The foundation published two different date ranges for 2026, so confirm with the foundation rather than relying on one of them. Results in July.",
     ar:"نحو <b>أواخر مارس وأبريل</b>. نشرت المؤسسة فترتين مختلفتين لعام ٢٠٢٦، لذا تأكد منها مباشرة بدل الاعتماد على إحداهما. النتائج في يوليو."},
 url:"https://mkfbh.org/rayaat"},

/* ---------- SAUDI ARABIA ---------- */
{id:"sa2holy", cat:"nat", ct:"sa", who:["sa"], lvl:"ug", st:"check",
 n:{en:"Custodian of the Two Holy Mosques Scholarship Programme", ar:"برنامج خادم الحرمين الشريفين للابتعاث الخارجي"},
 el:{en:"Saudi citizens with admission to an approved institution, in a designated field, aged <b>not more than 30 for a bachelor's degree</b>. From 2025/26, bachelor's applicants entering through the preparatory year need <b>90% or above</b> in high school and <b>IELTS 5.5</b>. The China track needs 85% and IELTS 4.5, and Germany needs a German A2 certificate.",
     ar:"مواطنون سعوديون لديهم قبول في مؤسسة معتمدة وفي تخصص محدد، بعمر <b>لا يتجاوز ٣٠ سنة للبكالوريوس</b>. من عام ٢٠٢٥/٢٠٢٦، من يدخل عبر السنة التحضيرية يحتاج <b>٩٠٪ فأعلى</b> في الثانوية و<b>آيلتس ٥٫٥</b>. مسار الصين يتطلب ٨٥٪ وآيلتس ٤٫٥، وألمانيا تتطلب شهادة ألمانية A2."},
 cv:{en:"Four tracks. <b>Pioneers</b> covers bachelor's and master's at the top 30 global institutions with the age cap waived. <b>Imdad</b> covers bachelor's and master's at the top 200 in labour market priority fields. <b>Waaid</b> is employment linked and covers diplomas, bachelor's degrees, master's degrees and professional certificates. The <b>Research and Development</b> track is master's and doctoral only, so it is not for school leavers. Destinations include the USA, UK, Australia, Switzerland, Spain, France, Germany and China.",
     ar:"أربعة مسارات. <b>الرواد</b> يغطي البكالوريوس والماجستير في أفضل ٣٠ مؤسسة عالمية مع إعفاء من حد العمر. <b>إمداد</b> يغطي البكالوريوس والماجستير في أفضل ٢٠٠ جامعة في تخصصات أولويات سوق العمل. <b>واعد</b> مرتبط بالتوظيف ويشمل الدبلومات والبكالوريوس والماجستير والشهادات المهنية. مسار <b>البحث والتطوير</b> للماجستير والدكتوراه فقط، فلا يناسب خريجي الثانوية. الوجهات تشمل أمريكا وبريطانيا وأستراليا وسويسرا وإسبانيا وفرنسا وألمانيا والصين."},
 wn:{en:"Individual Waaid opportunities open several times a year for short windows, sometimes only two weeks. Watch the Safeer portal continuously rather than waiting for one annual date.",
     ar:"فرص واعد تُفتح عدة مرات في السنة لفترات قصيرة، أحيانًا أسبوعين فقط. تابع بوابة سفير باستمرار بدل انتظار موعد سنوي واحد."},
 fl:{en:"This is the successor to the King Abdullah Scholarship Programme. It has not been discontinued, but it is far smaller and more selective than it was at its peak in the 2010s. The official pages do not itemise tuition, stipend, flights or insurance, so do not assume a specific allowance.",
     ar:"هذا امتداد لبرنامج الملك عبدالله للابتعاث. لم يتوقف، لكنه أصغر وأكثر انتقائية بكثير مما كان في ذروته خلال العقد الماضي. الصفحات الرسمية لا تفصّل الرسوم أو المكافأة أو التذاكر أو التأمين، فلا تفترض مبلغًا محددًا."},
 url:"https://sites.moe.gov.sa/scholarship-program/"},

{id:"aramco", cat:"nat", ct:"sa", who:["sa"], lvl:"ug", st:"check",
 n:{en:"Saudi Aramco College Degree Programme for Non Employees", ar:"أرامكو السعودية، برنامج الابتعاث الجامعي لغير الموظفين"},
 el:{en:"Saudi nationals aged <b>22 or under</b> (Hijri), in the second semester of Grade 12, with a cumulative high school average of <b>85% or above</b> and <b>85% or above in maths and science</b>, plus a <b>Qudurat score of 90 or above</b>. Open to male and female students.",
     ar:"مواطنون سعوديون بعمر <b>٢٢ سنة فأقل</b> هجريًا، في الفصل الثاني من الصف الثاني عشر، بمعدل تراكمي <b>٨٥٪ فأعلى</b> و<b>٨٥٪ فأعلى في الرياضيات والعلوم</b>، مع درجة <b>قدرات ٩٠ فأعلى</b>. متاح للطلاب والطالبات."},
 cv:{en:"One year of the College Preparatory Programme in Dhahran, then a bachelor's degree at a university outside the Kingdom. During the preparatory year: SR 4,000 a month, housing, transport, medical care, university application support and academic counselling.",
     ar:"سنة في البرنامج التحضيري الجامعي في الظهران، ثم بكالوريوس في جامعة خارج المملكة. خلال السنة التحضيرية: ٤٠٠٠ ريال شهريًا، وسكن، ومواصلات، ورعاية طبية، ودعم في التقديم الجامعي، وإرشاد أكاديمي."},
 wn:{en:"Registration is currently closed and Aramco states the next period will be announced later. Check the page regularly during Grade 12.",
     ar:"التسجيل مغلق حاليًا وتذكر أرامكو أن الفترة القادمة ستُعلن لاحقًا. راجع الصفحة بانتظام خلال الصف الثاني عشر."},
 url:"https://www.aramco.com/en/careers/for-saudi-applicants/student-opportunities/college-degree-program"},

{id:"sabic", cat:"nat", ct:"sa", who:["sa"], lvl:"ug", st:"check",
 n:{en:"SABIC University Scholarship for fresh high school graduates", ar:"منحة سابك الجامعية لخريجي الثانوية الجدد"},
 el:{en:"Saudi nationals aged <b>20 or under</b>, with a high school average of <b>90% or above</b> and a General Aptitude Test score of <b>85 or above</b>.",
     ar:"مواطنون سعوديون بعمر <b>٢٠ سنة فأقل</b>، بمعدل ثانوي <b>٩٠٪ فأعلى</b> ودرجة قدرات <b>٨٥ فأعلى</b>."},
 cv:{en:"Tuition, monthly stipend, housing allowance, book allowance, medical insurance and an annual air ticket, while studying <b>inside Saudi Arabia</b> at King Saud University, King Abdulaziz University, KFUPM or Princess Nourah bint Abdulrahman University.",
     ar:"الرسوم الدراسية، ومكافأة شهرية، وبدل سكن، وبدل كتب، وتأمين طبي، وتذكرة سنوية، مع الدراسة <b>داخل السعودية</b> في جامعة الملك سعود أو جامعة الملك عبدالعزيز أو جامعة الملك فهد للبترول والمعادن أو جامعة الأميرة نورة."},
 wn:{en:"You cannot apply cold. Invitations are sent by SMS <b>after</b> you enrol at one of the four universities.",
     ar:"لا يمكن التقديم مباشرة. تُرسل الدعوات برسالة نصية <b>بعد</b> التحاقك بإحدى الجامعات الأربع."},
 url:"https://www.sabic.com/en/careers/middle-east-africa/students-and-fresh-graduates"},

{id:"sanonsaudi", cat:"nat", ct:"sa", who:["exp","bh","ae","qa","kw","om"], lvl:"ug", st:"check",
 n:{en:"Saudi Arabia, scholarships in public universities for non Saudis", ar:"السعودية، منح الجامعات الحكومية لغير السعوديين"},
 el:{en:"Non Saudi students from over 200 countries, aged <b>17 to 25</b> for undergraduate and Arabic language programmes. You must pass medical and security clearance, must not hold another scholarship in the Kingdom, and need home government approval where that applies. Health and medical specialties are excluded.",
     ar:"طلبة غير سعوديين من أكثر من ٢٠٠ دولة، بعمر <b>١٧ إلى ٢٥</b> للبكالوريوس وبرامج اللغة العربية. يجب اجتياز الفحص الطبي والأمني، وعدم الحصول على منحة أخرى في المملكة، والحصول على موافقة الدولة الأم حيث ينطبق ذلك. التخصصات الصحية والطبية مستثناة."},
 cv:{en:"Three types: <b>full</b> (all benefits including healthcare, housing, an arrival reward and annual travel tickets), <b>partial</b> (a seat only, or a seat with housing), and <b>paid grants</b>.",
     ar:"ثلاثة أنواع: <b>كاملة</b> (جميع المزايا من رعاية صحية وسكن ومكافأة قدوم وتذاكر سنوية)، و<b>جزئية</b> (مقعد فقط أو مقعد مع سكن)، و<b>منح مدفوعة</b>."},
 wn:{en:"Apply through individual university websites during their announced periods, or through Saudi Cultural Attachés and embassies.",
     ar:"التقديم عبر مواقع الجامعات في فتراتها المعلنة، أو عبر الملحقيات الثقافية والسفارات السعودية."},
 fl:{en:"This is one of the very few government routes in the Gulf that is open by design to people who are not nationals of that country.",
     ar:"هذا أحد المسارات الحكومية القليلة جدًا في الخليج المفتوحة بحكم تصميمها لغير مواطني الدولة."},
 url:"https://www.moe.gov.sa/en/education/ResidentsAndvisitors/Pages/PublicUniversitiesScholarships.aspx"},

/* ---------- UAE ---------- */
{id:"uaemoe", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"check",
 n:{en:"UAE Ministry of Education scholarships", ar:"بعثات وزارة التربية والتعليم الإماراتية"},
 el:{en:"Emirati nationals and students whose mothers are Emirati, applying through the <b>National Admissions and Placement Office</b>. You need the General School Certificate plus <b>EmSAT</b> in English, maths, science and Arabic at the score set by the institution, a unified online application and a medical check.",
     ar:"المواطنون الإماراتيون وأبناء الأم الإماراتية، عبر <b>مكتب القبول والتنسيق الوطني</b>. تحتاج شهادة الثانوية العامة مع <b>إمسات</b> في الإنجليزية والرياضيات والعلوم والعربية بالدرجة التي تحددها المؤسسة، وطلبًا إلكترونيًا موحدًا، وفحصًا طبيًا."},
 cv:{en:"Undergraduate and postgraduate study <b>abroad</b>, at ministry recognised universities.",
     ar:"دراسة بكالوريوس ودراسات عليا <b>في الخارج</b>، في جامعات معترف بها من الوزارة."},
 wn:{en:"There is a Fall window and a Spring window, run through the ministry portal using UAE Pass. The Fall 2025 confirmation deadline was 11 August. Exact 2026/27 dates were not published at the time of writing.",
     ar:"توجد فترة للفصل الأول وأخرى للفصل الثاني، عبر بوابة الوزارة باستخدام الهوية الرقمية. كان آخر موعد لتأكيد خريف ٢٠٢٥ في ١١ أغسطس. لم تُنشر تواريخ ٢٠٢٦/٢٠٢٧ وقت الكتابة."},
 fl:{en:"The official page does not publish grade thresholds, EmSAT scores or age limits. Do not rely on figures you find on scholarship blogs. Ask the ministry.",
     ar:"الصفحة الرسمية لا تنشر حدود المعدلات ولا درجات إمسات ولا حدود العمر. لا تعتمد على الأرقام في مدونات المنح. اسأل الوزارة."},
 url:"https://u.ae/en/information-and-services/education/higher-education/joining-higher-education-institutions-/scholarships-for-uae-nationals/scholarships-from-ministry-of-education"},

{id:"sco", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"check",
 n:{en:"The Scholarships Office, Ministry of Presidential Affairs", ar:"مكتب البعثات الدراسية، وزارة شؤون الرئاسة"},
 el:{en:"Outstanding Emirati students, from an accredited list of universities and majors.",
     ar:"الطلبة الإماراتيون المتميزون، ضمن قائمة معتمدة من الجامعات والتخصصات."},
 cv:{en:"Bachelor's degree scholarships both <b>inside and outside the UAE</b>, plus graduate scholarships, at prestigious international universities.",
     ar:"بعثات بكالوريوس <b>داخل الإمارات وخارجها</b>، إضافة إلى بعثات دراسات عليا، في جامعات دولية مرموقة."},
 wn:{en:"Not published in a form that could be verified. Contact the office directly on +971 2 222 8391 or info@sco.ae.",
     ar:"غير منشورة بصورة يمكن التحقق منها. تواصل مع المكتب مباشرة على ٩٧١٢٢٢٢٨٣٩١+ أو info@sco.ae."},
 url:"https://www.sco.ae/"},

{id:"adek", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"check",
 n:{en:"Abu Dhabi Scholarships (ADEK)", ar:"منح أبوظبي الدراسية (دائرة التعليم والمعرفة)"},
 el:{en:"UAE nationals aged <b>17 to 24</b>, in Grade 12 or Year 13, or already at university. The <b>Elite</b> track needs 85% or above in Grade 11 and 90% or above in Grade 12 Term 1. The <b>Creative</b> track needs 80 to 85%. English proficiency: IELTS Academic 6.0 or TOEFL iBT 67.",
     ar:"مواطنون إماراتيون بعمر <b>١٧ إلى ٢٤</b>، في الصف الثاني عشر أو السنة ١٣، أو طلبة جامعيون حاليون. مسار <b>النخبة</b> يتطلب ٨٥٪ فأعلى في الحادي عشر و٩٠٪ فأعلى في الفصل الأول من الثاني عشر. مسار <b>الإبداع</b> يتطلب ٨٠ إلى ٨٥٪. إتقان الإنجليزية: آيلتس أكاديمي ٦٫٠ أو توفل ٦٧."},
 cv:{en:"Tuition fees and book allowance, health insurance, travel costs, a monthly stipend including a housing allowance, and a bonus for high performers. Around 150 universities across the UK, USA, Europe, Scandinavia, Australia, New Zealand, the Middle East, the Far East and the Americas. Fast track for students admitted to a world top 20 university.",
     ar:"الرسوم الدراسية وبدل الكتب، وتأمين صحي، وتكاليف السفر، ومكافأة شهرية تشمل بدل سكن، ومكافأة للمتفوقين. نحو ١٥٠ جامعة في بريطانيا وأمريكا وأوروبا والدول الإسكندنافية وأستراليا ونيوزيلندا والشرق الأوسط والشرق الأقصى والأمريكتين. مسار سريع لمن يُقبل في جامعة ضمن أفضل ٢٠ عالميًا."},
 wn:{en:"Historically <b>March and April</b>. The exact 2026 dates were not confirmed on an official page at the time of writing.",
     ar:"تاريخيًا في <b>مارس وأبريل</b>. لم تتأكد تواريخ ٢٠٢٦ الدقيقة من صفحة رسمية وقت الكتابة."},
 url:"https://ads.adek.ae/"},

{id:"hbm", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"closed",
 n:{en:"Hamdan bin Mohammed Scholarship Programme (Dubai)", ar:"برنامج حمدان بن محمد للمنح الدراسية (دبي)"},
 el:{en:"Emiratis <b>holding a Dubai family book</b>, who graduated high school in 2023/24, 2024/25 or 2025/26, and who hold a conditional or unconditional university admission. You must not have accepted another scholarship offer.",
     ar:"إماراتيون <b>يحملون خلاصة قيد دبي</b>، تخرجوا من الثانوية في ٢٠٢٣/٢٠٢٤ أو ٢٠٢٤/٢٠٢٥ أو ٢٠٢٥/٢٠٢٦، ولديهم قبول جامعي مشروط أو غير مشروط. ويشترط عدم قبول عرض منحة أخرى."},
 cv:{en:"100 fully funded scholarships a year under a programme worth AED 1.1 billion. Around 70% of current scholars are at universities ranked in the world top 100. Fields: computer science, artificial intelligence, digital technologies, business, finance, medicine, law and social sciences.",
     ar:"١٠٠ منحة ممولة بالكامل سنويًا ضمن برنامج بقيمة ١٫١ مليار درهم. نحو ٧٠٪ من المبتعثين الحاليين في جامعات ضمن أفضل ١٠٠ عالميًا. المجالات: علوم الحاسوب، والذكاء الاصطناعي، والتقنيات الرقمية، والأعمال، والمالية، والطب، والقانون، والعلوم الاجتماعية."},
 wn:{en:"The third cohort was announced on 23 March 2026 and closed on <b>30 June 2026</b>. Applications go through the Emirati section of the Dubai Now app.",
     ar:"أُعلنت الدفعة الثالثة في ٢٣ مارس ٢٠٢٦ وأُغلقت في <b>٣٠ يونيو ٢٠٢٦</b>. التقديم عبر قسم الإماراتيين في تطبيق دبي الآن."},
 url:"https://www.khda.gov.ae/"},

{id:"mofa", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"check",
 n:{en:"UAE Ministry of Foreign Affairs Scholarship", ar:"بعثة وزارة الخارجية الإماراتية"},
 el:{en:"UAE nationals with a valid passport and family book, aged <b>17 to 21</b> with guardian approval, holding a high school diploma meeting minimum grades of roughly <b>80 to 90% depending on the stream</b>, with <b>IELTS Academic 6.5</b>, a good conduct certificate, and for males a completed or exempted national service.",
     ar:"مواطنون إماراتيون بجواز ساري وخلاصة قيد، بعمر <b>١٧ إلى ٢١</b> بموافقة ولي الأمر، بشهادة ثانوية تحقق الحد الأدنى نحو <b>٨٠ إلى ٩٠٪ حسب المسار</b>، مع <b>آيلتس أكاديمي ٦٫٥</b>، وشهادة حسن سيرة، وللذكور إتمام الخدمة الوطنية أو الإعفاء منها."},
 cv:{en:"All tuition costs at ministry approved universities, followed by a compulsory diploma at the Anwar Gargash Diplomatic Academy. Undergraduate only.",
     ar:"جميع الرسوم الدراسية في جامعات معتمدة من الوزارة، يليها دبلوم إلزامي في أكاديمية أنور قرقاش الدبلوماسية. للبكالوريوس فقط."},
 wn:{en:"Not published on the official page. Contact the ministry.",
     ar:"غير منشورة على الصفحة الرسمية. تواصل مع الوزارة."},
 fl:{en:"There is a service bond. You must serve in the UAE diplomatic corps for a period equal to the length of the scholarship.",
     ar:"يوجد التزام خدمة. عليك العمل في السلك الدبلوماسي الإماراتي لمدة تعادل مدة البعثة."},
 url:"https://www.mofa.gov.ae/en/scholarship"},

{id:"adnoc", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"check",
 n:{en:"ADNOC Scholarship Programme", ar:"برنامج منح أدنوك"},
 el:{en:"UAE nationals who <b>already hold a conditional acceptance</b> from an ADNOC approved university, with a medical assessment and a military release letter where applicable.",
     ar:"مواطنون إماراتيون <b>لديهم قبول مشروط</b> من جامعة معتمدة لدى أدنوك، مع تقييم طبي وخطاب إخلاء طرف عسكري حيث ينطبق."},
 cv:{en:"Support with tuition fees and living expenses, application assistance, and rewards for excellent performance. Note the official wording is support rather than full coverage. Study is at <b>leading institutions inside the UAE</b>, not abroad. Fields: energy and sustainability, chemical, petroleum, mechanical and electrical engineering, geoscience, project management, law, finance, economics, data science, artificial intelligence and machine learning, materials science and computer science.",
     ar:"دعم في الرسوم الدراسية ونفقات المعيشة، ومساعدة في التقديم، ومكافآت للأداء المتميز. لاحظ أن الصياغة الرسمية دعم وليس تغطية كاملة. الدراسة في <b>مؤسسات رائدة داخل الإمارات</b>، لا في الخارج. المجالات: الطاقة والاستدامة، والهندسة الكيميائية والبترولية والميكانيكية والكهربائية، وعلوم الأرض، وإدارة المشاريع، والقانون، والمالية، والاقتصاد، وعلم البيانات، والذكاء الاصطناعي وتعلم الآلة، وعلوم المواد، وعلوم الحاسوب."},
 wn:{en:"Not published. Watch the ADNOC careers page.",
     ar:"غير منشورة. تابع صفحة التوظيف في أدنوك."},
 url:"https://jobs.adnoc.ae/us/en/ADNOC-Scholarship-Program-r"},

{id:"uaeother", cat:"nat", ct:"ae", who:["ae"], lvl:"ug", st:"check",
 n:{en:"Other UAE government routes: Betha, Masar and Emirates Group", ar:"مسارات إماراتية أخرى: بعثة، ومسار، ومجموعة الإمارات"},
 el:{en:"Emirati high school graduates. Each programme sets its own thresholds, and most are not published in detail.",
     ar:"خريجو الثانوية الإماراتيون. لكل برنامج شروطه، ومعظمها غير منشور بالتفصيل."},
 cv:{en:"<b>Betha</b> (ICT Fund at TDRA) covers undergraduate and master's study in information and communications technology, in the UAE, USA, Australia or Japan. <b>Masar</b> (Ministry of Finance) covers undergraduate finance and accounting and other disciplines at accredited UAE universities. <b>Emirates Group</b> supports Emirati school leavers in aviation management, IT, artificial intelligence, logistics and supply chain, finance, cadet pilot training and aircraft maintenance engineering, with a career start in the group.",
     ar:"<b>بعثة</b> (صندوق تقنية المعلومات في هيئة التنظيم الرقمي) تغطي البكالوريوس والماجستير في تقنية المعلومات والاتصالات، في الإمارات أو أمريكا أو أستراليا أو اليابان. <b>مسار</b> (وزارة المالية) تغطي البكالوريوس في المالية والمحاسبة وتخصصات أخرى في جامعات إماراتية معتمدة. <b>مجموعة الإمارات</b> تدعم خريجي الثانوية الإماراتيين في إدارة الطيران وتقنية المعلومات والذكاء الاصطناعي والخدمات اللوجستية وسلاسل الإمداد والمالية وتدريب الطيارين وهندسة صيانة الطائرات، مع بداية مهنية داخل المجموعة."},
 wn:{en:"Varies by programme, and not published centrally.",
     ar:"تختلف حسب البرنامج، وغير منشورة مركزيًا."},
 fl:{en:"A correction worth knowing: the Mohammed Bin Rashid Distinguished Students Programme is <b>not</b> a university scholarship. It covers 50% of annual tuition at Dubai private schools, meaning school fees, not university fees. Scholarship websites list it wrongly.",
     ar:"تصحيح يستحق المعرفة: برنامج محمد بن راشد للطلبة المتميزين <b>ليس</b> منحة جامعية. يغطي ٥٠٪ من الرسوم السنوية في مدارس دبي الخاصة، أي رسوم المدرسة لا الجامعة. مواقع المنح تدرجه بشكل خاطئ."},
 url:"https://u.ae/en/information-and-services/education/higher-education/joining-higher-education-institutions-/scholarships-for-uae-nationals"},

/* ---------- QATAR ---------- */
{id:"qf", cat:"nat", ct:"qa", who:["all"], lvl:"ug", st:"open",
 n:{en:"Qatar Foundation financial aid, Education City", ar:"المساعدة المالية من مؤسسة قطر، المدينة التعليمية"},
 el:{en:"<b>Not restricted by nationality.</b> You must be admitted to an Education City university (Georgetown, Northwestern, Carnegie Mellon, VCUarts, Weill Cornell or HBKU), enrolled full time in a bachelor's programme, with no prior loan default. <b>Note that Texas A&amp;M at Qatar is no longer admitting undergraduates</b>, having announced in 2024 that it will close its Qatar campus by 2028, so ignore it on any list that still includes it.",
     ar:"<b>غير مقيّدة بالجنسية.</b> يجب أن تكون مقبولًا في إحدى جامعات المدينة التعليمية (جورجتاون، نورث وسترن، كارنيجي ميلون، فرجينيا كومنولث للفنون، وايل كورنيل، أو حمد بن خليفة)، ومسجلًا بدوام كامل في برنامج بكالوريوس، وليس عليك تعثر في قرض سابق. <b>ولاحظ أن تكساس إيه آند إم في قطر لم تعد تقبل طلبة بكالوريوس</b>، إذ أعلنت في ٢٠٢٤ أنها ستغلق حرمها في قطر بحلول ٢٠٢٨، فتجاهلها في أي قائمة ما زالت تدرجها."},
 cv:{en:"An <b>interest free, need based loan</b> covering up to 100% of the annual cost of attendance. On graduation you either repay on a plan or enter a paid service programme at an approved organisation in Qatar. There is <b>partial debt forgiveness over one to six years</b> depending on the size of the loan, while employed at an approved company, organisation or government office, for students who signed financial aid contracts from Fall 2024 onwards.",
     ar:"<b>قرض بدون فوائد قائم على الحاجة</b> يغطي حتى ١٠٠٪ من التكلفة السنوية للدراسة. عند التخرج إما تسدد وفق خطة أو تلتحق ببرنامج خدمة مدفوع في جهة معتمدة في قطر. ويوجد <b>إعفاء جزئي من الدين خلال سنة إلى ست سنوات</b> بحسب حجم القرض، أثناء العمل في شركة أو جهة أو مؤسسة حكومية معتمدة، لمن وقّع عقود المساعدة المالية من خريف ٢٠٢٤ فصاعدًا."},
 wn:{en:"Applied for alongside admission to an Education City university, through the financial aid portal.",
     ar:"يُقدَّم عليها مع طلب القبول في جامعات المدينة التعليمية، عبر بوابة المساعدة المالية."},
 fl:{en:"This is the most substantial funding mechanism in the entire Gulf that is open regardless of nationality. If you are an expatriate school leaver in the region, read this one carefully. Note that the separate <b>merit scholarship</b> requires two completed semesters in Education City with an outstanding grade average, so it is not available to an incoming school leaver.",
     ar:"هذه أهم آلية تمويل في الخليج كله وهي مفتوحة بغض النظر عن الجنسية. إن كنت طالبًا وافدًا في المنطقة فاقرأ هذه بعناية. لاحظ أن <b>منحة التفوق</b> المنفصلة تشترط إكمال فصلين في المدينة التعليمية بمعدل متميز، فلا تتاح للطالب الجديد."},
 url:"https://www.qf.org.qa/education/higher-education/financial-aid"},

{id:"qamoe", cat:"nat", ct:"qa", who:["qa"], lvl:"ug", st:"check",
 n:{en:"Qatar Ministry of Education and Higher Education scholarships", ar:"بعثات وزارة التعليم والتعليم العالي القطرية"},
 el:{en:"Qatari high school graduates. Three programmes: the <b>Amiri Scholarship Programme</b> covering 24 top ranked universities worldwide plus 5 local, the <b>Abroad Scholarship Programme</b>, and the <b>Local Scholarship Programme</b> including Tomouh. There are also Academic Bridge, Diploma, Inclusion and language programmes.",
     ar:"خريجو الثانوية القطريون. ثلاثة برامج: <b>البعثة الأميرية</b> وتشمل ٢٤ جامعة عالمية مرموقة و٥ جامعات محلية، و<b>بعثة الدراسة في الخارج</b>، و<b>بعثة الدراسة في الداخل</b> بما فيها طموح. وتوجد أيضًا برامج الجسر الأكاديمي والدبلوم والدمج واللغة."},
 cv:{en:"Study inside or outside Qatar. The ministry does not publish coverage detail on its public pages.",
     ar:"الدراسة داخل قطر أو خارجها. الوزارة لا تنشر تفاصيل التغطية على صفحاتها العامة."},
 wn:{en:"Registration ran <b>1 July to 30 September</b> in the most recent announced cycle. Call 44044444 or 155 to confirm the current dates.",
     ar:"جرى التسجيل من <b>١ يوليو إلى ٣٠ سبتمبر</b> في آخر دورة معلنة. اتصل على ٤٤٠٤٤٤٤٤ أو ١٥٥ لتأكيد التواريخ الحالية."},
 url:"https://scholarship.edu.gov.qa"},

{id:"quqa", cat:"nat", ct:"qa", who:["qa","bh","sa","ae","kw","om"], lvl:"ug", st:"open",
 n:{en:"Qatar University scholarships for Qataris and GCC nationals", ar:"منح جامعة قطر للقطريين ومواطني دول الخليج"},
 el:{en:"The <b>Emir's Scholarship for Academic Excellence</b> is for outstanding Qatari Secondary Certificate holders with a <b>95% average or above</b>, graduating in the same year, and is awarded automatically from the admission application. The <b>Student Recruitment and Excellence Scholarship</b> is for newly admitted, academically outstanding Qatari residents. <b>GCC States Scholarships</b> go to GCC nationals with an embassy nomination. The <b>GCC Qatari Certificate Scholarship</b> is non competitive and goes to GCC nationals holding the Qatari Secondary Certificate.",
     ar:"<b>منحة سمو الأمير للتفوق الأكاديمي</b> لحاملي الشهادة الثانوية القطرية المتفوقين بمعدل <b>٩٥٪ فأعلى</b> من خريجي السنة نفسها، وتُمنح تلقائيًا من طلب القبول. و<b>منحة استقطاب الطلبة والتفوق</b> للمقبولين الجدد المتفوقين من المقيمين في قطر. و<b>منح دول مجلس التعاون</b> لمواطني الخليج بترشيح من السفارة. و<b>منحة الشهادة الثانوية القطرية لدول المجلس</b> غير تنافسية وتُمنح لمواطني الخليج الحاصلين على الشهادة الثانوية القطرية."},
 cv:{en:"Tuition and textbook exemption. The Emir's Scholarship adds <b>QAR 1,000 a month for nine months</b>. GCC States Scholarships add housing and campus transport.",
     ar:"إعفاء من الرسوم الدراسية والكتب. وتضيف منحة سمو الأمير <b>١٠٠٠ ريال قطري شهريًا لتسعة أشهر</b>. ومنح دول المجلس تضيف السكن والمواصلات داخل الحرم."},
 wn:{en:"Applied for with the university admission application, in line with Qatar University's admission calendar.",
     ar:"يُقدَّم عليها مع طلب القبول الجامعي، وفق تقويم القبول في جامعة قطر."},
 url:"https://www.qu.edu.qa/en-us/students/admission/scholarships/Pages/types.aspx"},

{id:"quintl", cat:"nat", ct:"qa", who:["all"], lvl:"ug", st:"open",
 n:{en:"Qatar University scholarships for non Qatari students", ar:"منح جامعة قطر للطلبة غير القطريين"},
 el:{en:"The <b>International Students Scholarship</b> is for international undergraduate applicants with a high school average of <b>95% or above</b>. The <b>Talent Scholarship</b> is explicitly for <b>non Qatari</b> undergraduates with a high school average of <b>80% or above</b> who are talented in research, technology, literature, acting (males), media or athletics.",
     ar:"<b>منحة الطلبة الدوليين</b> للمتقدمين الدوليين للبكالوريوس بمعدل ثانوي <b>٩٥٪ فأعلى</b>. و<b>منحة الموهوبين</b> مخصصة صراحة <b>لغير القطريين</b> في البكالوريوس بمعدل ثانوي <b>٨٠٪ فأعلى</b> من الموهوبين في البحث أو التقنية أو الأدب أو التمثيل (للذكور) أو الإعلام أو الرياضة."},
 cv:{en:"Tuition and textbooks, plus a monthly allowance of <b>QAR 500</b> (International Students) or <b>QAR 1,000</b> (Talent), with housing, campus transport, airfare and a residence permit for international students.",
     ar:"الرسوم الدراسية والكتب، مع بدل شهري <b>٥٠٠ ريال قطري</b> (الطلبة الدوليين) أو <b>١٠٠٠ ريال قطري</b> (الموهوبين)، مع السكن والمواصلات وتذكرة السفر والإقامة للطلبة الدوليين."},
 wn:{en:"Applied for with the university admission application.",
     ar:"يُقدَّم عليها مع طلب القبول الجامعي."},

 cv:{en:"Everything government funded in Oman flows through this one centre, in four categories: <b>public seats</b> which are tuition free at Sultan Qaboos University and public colleges, <b>internal scholarships</b> which cover tuition only at private institutions, <b>internal grants</b> which are partial and awarded on social security criteria, and <b>external scholarships and grants</b> for study abroad. New for 2026/27: full scholarships from Ooredoo Oman in priority employment linked fields, direct admission to selected Sultan Qaboos University specialisations, internal scholarships at private institutions for students with autism, and inclusive options including art education for students with hearing disabilities.",

     ar:"مكافأة شهرية نحو ١١٧٠٠٠ ين مع بدل إقليمي، والرسوم الدراسية ورسوم القبول، وتذكرة سفر اقتصادية ذهابًا وإيابًا. مدة المنحة <b>خمس سنوات تشمل سنة تحضيرية</b>، أو سبع سنوات للطب وطب الأسنان والطب البيطري، وست سنوات للصيدلة."},
 wn:{en:"Applications go through the <b>Japanese Embassy</b> in your country, typically around <b>April and May</b>, with written exams and an interview mid year.",
     ar:"التقديم عبر <b>السفارة اليابانية</b> في بلدك، غالبًا في <b>أبريل ومايو</b>، مع اختبارات تحريرية ومقابلة في منتصف السنة."},
 fl:{en:"Not every embassy recruits at undergraduate level every year. Contact the Japanese Embassy in Manama, Riyadh, Abu Dhabi, Doha, Kuwait or Muscat directly rather than assuming.",
     ar:"ليست كل سفارة تستقبل طلبات البكالوريوس كل سنة. تواصل مباشرة مع السفارة اليابانية في المنامة أو الرياض أو أبوظبي أو الدوحة أو الكويت أو مسقط بدل الافتراض."},
 url:"https://www.studyinjapan.go.jp/en/"},

{id:"csc", cat:"fgov", ct:"cn", who:["all"], lvl:"ug", st:"dec",
 n:{en:"Chinese Government Scholarship (CSC)", ar:"منحة الحكومة الصينية"},
 el:{en:"Non Chinese citizens. Bachelor's applicants are generally <b>under 25</b>, high school graduates, in good health.",
     ar:"غير الصينيين. متقدمو البكالوريوس عادة <b>دون ٢٥ سنة</b>، خريجو ثانوية، بصحة جيدة."},
 cv:{en:"Full tuition, campus accommodation or a housing subsidy, a monthly stipend of CNY 2,500 for undergraduates, and comprehensive medical insurance.",
     ar:"الرسوم الدراسية كاملة، وسكن جامعي أو بدل سكن، ومكافأة شهرية ٢٥٠٠ يوان للبكالوريوس، وتأمين طبي شامل."},
 wn:{en:"Roughly <b>December to early April</b>, varying by university.",
     ar:"تقريبًا من <b>ديسمبر إلى أوائل أبريل</b>، وتختلف حسب الجامعة."},
 fl:{en:"There are two channels. Type A goes through your government under a bilateral agreement, and availability for individual Gulf states varies. <b>Type B, applying directly to a Chinese university, is the reliable route for Gulf students.</b> Many bachelor's programmes are taught in Chinese and include a preparatory language year.",
     ar:"يوجد مساران. النوع أ يمر عبر حكومتك ضمن اتفاقية ثنائية، وتوفره يختلف بين دول الخليج. و<b>النوع ب، بالتقديم مباشرة إلى جامعة صينية، هو المسار الموثوق لطلبة الخليج.</b> وكثير من برامج البكالوريوس تُدرّس بالصينية وتشمل سنة لغة تحضيرية."},
 url:"https://www.campuschina.org"},

{id:"hungaricum", cat:"fgov", ct:"hu", who:["bh","ae","om","exp"], lvl:"ug", st:"jan",
 n:{en:"Stipendium Hungaricum (Hungary)", ar:"منحة ستيبنديوم هونغاريكوم (المجر)"},
 el:{en:"Only nationals of <b>partner sending countries</b>. In the Gulf that means <b>Bahrain, the UAE and Oman only</b>. Nationals of <b>Saudi Arabia, Qatar and Kuwait cannot apply</b>. Other Arab partners include Jordan, Egypt, Iraq, Lebanon, Palestine, Tunisia, Morocco, Algeria, Libya, Sudan and Yemen. There is also an age floor based on date of birth.",
     ar:"لمواطني <b>الدول الشريكة المرسِلة</b> فقط. وفي الخليج ذلك يعني <b>البحرين والإمارات وعُمان فقط</b>. ولا يمكن لمواطني <b>السعودية وقطر والكويت التقديم</b>. ومن الشركاء العرب الآخرين الأردن ومصر والعراق ولبنان وفلسطين وتونس والمغرب والجزائر وليبيا والسودان واليمن. ويوجد أيضًا حد أدنى للعمر بحسب تاريخ الميلاد."},
 cv:{en:"Free tuition, a monthly stipend of roughly 110 euro, a free dormitory place or a housing contribution of about 100 euro a month, and medical insurance. <b>This is partial support, not full funding.</b> Budget your own additional living money.",
     ar:"دراسة مجانية، ومكافأة شهرية نحو ١١٠ يورو، وسكن جامعي مجاني أو مساهمة سكن نحو ١٠٠ يورو شهريًا، وتأمين طبي. <b>هذا دعم جزئي وليس تمويلًا كاملًا.</b> خطط لمصروف معيشة إضافي من عندك."},
 wn:{en:"Closes <b>15 January</b>.",
     ar:"يغلق في <b>١٥ يناير</b>."},
 fl:{en:"You must also be nominated by your home country's sending partner authority, usually the Ministry of Education. Applying online alone is not enough.",
     ar:"يجب أيضًا ترشيحك من الجهة الشريكة المرسِلة في بلدك، وهي عادة وزارة التعليم. التقديم الإلكتروني وحده لا يكفي."},
 url:"https://stipendiumhungaricum.hu"},

{id:"opendoors", cat:"fgov", ct:"ru", who:["all"], lvl:"ug", st:"aug",
 n:{en:"Russia, Open Doors International Olympiad", ar:"روسيا، أولمبياد الأبواب المفتوحة الدولي"},
 el:{en:"Foreign citizens aged <b>16 to 23</b> for the bachelor's track, holding qualifying secondary education, with no existing bachelor's or master's degree.",
     ar:"مواطنون أجانب بعمر <b>١٦ إلى ٢٣</b> لمسار البكالوريوس، حاصلون على تعليم ثانوي مؤهل، وليس لديهم بكالوريوس أو ماجستير."},
 cv:{en:"Tuition free study at a Russian university funded from the federal budget. Winners are the top 5% and award winners the top 25%. <b>Living costs and travel are generally not covered.</b>",
     ar:"دراسة مجانية في جامعة روسية بتمويل من الميزانية الاتحادية. الفائزون هم أفضل ٥٪ والحاصلون على جوائز أفضل ٢٥٪. <b>نفقات المعيشة والسفر غير مغطاة عمومًا.</b>"},
 wn:{en:"Registration <b>20 August to 1 November</b>, portfolio stage to mid November, task stage to late December, interviews from late December to late February.",
     ar:"التسجيل من <b>٢٠ أغسطس إلى ١ نوفمبر</b>، ومرحلة الملف حتى منتصف نوفمبر، ومرحلة المهام حتى أواخر ديسمبر، والمقابلات من أواخر ديسمبر إلى أواخر فبراير."},
 url:"https://od.globaluni.ru"},

{id:"ruquota", cat:"fgov", ct:"ru", who:["all"], lvl:"ug", st:"nov",
 n:{en:"Russia government quota (Rossotrudnichestvo)", ar:"الحصة الحكومية الروسية (روس سوترودنيتشستفو)"},
 el:{en:"Foreign nationals, applying through the Russian House or Russian Embassy in your country against a country specific quota. Quota sizes for individual Gulf states are not published, so ask locally.",
     ar:"مواطنون أجانب، بالتقديم عبر البيت الروسي أو السفارة الروسية في بلدك ضمن حصة خاصة بكل دولة. أحجام الحصص لدول الخليج غير منشورة، فاسأل محليًا."},
 cv:{en:"Tuition, a modest state stipend and a dormitory place. <b>Airfare and living costs are not covered.</b>",
     ar:"الرسوم الدراسية، ومكافأة حكومية متواضعة، ومقعد في السكن الجامعي. <b>تذاكر السفر ونفقات المعيشة غير مغطاة.</b>"},
 wn:{en:"Typically opens around <b>November to February</b>, but each Russian House sets its own dates.",
     ar:"يفتح عادة نحو <b>نوفمبر إلى فبراير</b>، لكن كل بيت روسي يحدد تواريخه."},
 url:"https://education-in-russia.com"},

{id:"boutmy", cat:"fgov", ct:"fr", who:["all"], lvl:"ug", st:"jan",
 n:{en:"Sciences Po Émile Boutmy Scholarship (France)", ar:"منحة إميل بوتمي في معهد العلوم السياسية بباريس"},
 el:{en:"Non EU citizens whose household does not pay tax in the EU, applying for the first time. Not available to Swiss or Norwegian nationals or dual EU citizens. Gulf nationals are eligible.",
     ar:"غير مواطني الاتحاد الأوروبي ممن لا تدفع أسرهم ضرائب داخل الاتحاد، ويتقدمون لأول مرة. وغير متاحة لمواطني سويسرا والنرويج أو مزدوجي جنسية الاتحاد. ومواطنو الخليج مؤهلون."},
 cv:{en:"For the three year bachelor's degree: either a <b>full tuition exemption</b> or a reduction of 9,500 euro a year. Merit based, awarded through the admissions application.",
     ar:"لبرنامج البكالوريوس ذي السنوات الثلاث: إما <b>إعفاء كامل من الرسوم</b> أو تخفيض ٩٥٠٠ يورو سنويًا. تُمنح على أساس الجدارة عبر طلب القبول."},
 wn:{en:"Deadline <b>20 January</b> for international school applicants. You tick the Émile Boutmy box inside the admissions application, there is no separate form.",
     ar:"آخر موعد <b>٢٠ يناير</b> لطلبة المدارس الدولية. تؤشر على خانة إميل بوتمي داخل طلب القبول، ولا يوجد نموذج منفصل."},
 fl:{en:"This is one of very few genuinely undergraduate French awards. Most French national schemes are master's level.",
     ar:"هذه من الجوائز الفرنسية القليلة جدًا المتاحة فعلًا لمرحلة البكالوريوس. معظم البرامج الفرنسية الوطنية للماجستير."},
 url:"https://www.sciencespo.fr/students/en/fees-funding/bursaries-financial-aid/emile-boutmy-scholarship/"},

{id:"iccr", cat:"fgov", ct:"in", who:["all"], lvl:"ug", st:"feb",
 n:{en:"India, ICCR A2A Scholarship Scheme", ar:"الهند، منحة المجلس الهندي للعلاقات الثقافية"},
 el:{en:"Foreign nationals aged <b>18 to 40</b> for undergraduate and postgraduate study. Only one application per academic year. Multiple applications mean all of them are rejected.",
     ar:"مواطنون أجانب بعمر <b>١٨ إلى ٤٠</b> للبكالوريوس والدراسات العليا. طلب واحد فقط في السنة الدراسية. وتقديم أكثر من طلب يعني رفضها جميعًا."},
 cv:{en:"Tuition, a living stipend, an accommodation allowance and a contingency grant. You choose up to five university preferences from more than 131 participating institutions.",
     ar:"الرسوم الدراسية، ومكافأة معيشة، وبدل سكن، ومنحة طوارئ. وتختار حتى خمس رغبات جامعية من أكثر من ١٣١ مؤسسة مشاركة."},
 wn:{en:"<b>27 February to 22 April</b>. Courses start between June and August.",
     ar:"من <b>٢٧ فبراير إلى ٢٢ أبريل</b>. والدراسة تبدأ بين يونيو وأغسطس."},
 url:"https://a2ascholarships.iccr.gov.in/"},

{id:"nlschol", cat:"fgov", ct:"nl", who:["all"], lvl:"ug", st:"nov",
 n:{en:"Netherlands, NL Scholarship", ar:"هولندا، المنحة الهولندية"},
 el:{en:"Non EEA nationals, which includes Gulf nationals, starting a full time degree at a participating Dutch institution, who do not already hold a Dutch degree.",
     ar:"مواطنو الدول خارج المنطقة الاقتصادية الأوروبية، ومنهم مواطنو الخليج، ممن يبدأون درجة بدوام كامل في مؤسسة هولندية مشاركة، ولا يحملون شهادة هولندية سابقة."},
 cv:{en:"<b>5,000 euro, first year only.</b> This is a partial award, not full funding.",
     ar:"<b>٥٠٠٠ يورو، للسنة الأولى فقط.</b> وهي جائزة جزئية لا تمويل كامل."},
 wn:{en:"Opens 1 November. <b>Deadlines are set by each university</b>, commonly 1 February or 1 May.",
     ar:"يفتح في ١ نوفمبر. و<b>المواعيد النهائية تحددها كل جامعة</b>، وغالبًا ١ فبراير أو ١ مايو."},
 url:"https://www.studyinnl.org/finances/nl-scholarship"},

{id:"deutschland", cat:"fgov", ct:"de", who:["all"], lvl:"ug", st:"varies",
 n:{en:"Germany, Deutschlandstipendium", ar:"ألمانيا، المنحة الألمانية (دويتشلاند شتيبنديوم)"},
 el:{en:"Students admitted to or enrolled at a participating German university. <b>No nationality restriction.</b> Applications go to the university, not to a central body.",
     ar:"الطلبة المقبولون أو المسجلون في جامعة ألمانية مشاركة. <b>لا يوجد قيد على الجنسية.</b> والتقديم يكون إلى الجامعة لا إلى جهة مركزية."},
 cv:{en:"<b>300 euro a month.</b> This is a supplement, not a full scholarship.",
     ar:"<b>٣٠٠ يورو شهريًا.</b> وهي إضافة داعمة لا منحة كاملة."},
 wn:{en:"Set by each university, commonly a summer or autumn deadline.",
     ar:"تحددها كل جامعة، وغالبًا في الصيف أو الخريف."},
 fl:{en:"If someone tells you DAAD funds bachelor's degrees, they are mistaken. DAAD's flagship awards are all master's and doctoral. Deutschlandstipendium is the undergraduate route in Germany.",
     ar:"إذا قال لك أحد إن الهيئة الألمانية للتبادل العلمي تموّل البكالوريوس فهو مخطئ. جوائزها الرئيسية كلها للماجستير والدكتوراه. والمنحة الألمانية هي المسار الجامعي في ألمانيا."},
 url:"https://www.deutschlandstipendium.de"},

/* ---------- UNIVERSITY LEVEL FUNDING ABROAD ---------- */
{id:"pearson", cat:"uni", ct:"ca", who:["all"], lvl:"ug", st:"jul",
 n:{en:"University of Toronto, Lester B. Pearson International Scholarship", ar:"جامعة تورنتو، منحة ليستر بي بيرسون الدولية"},
 el:{en:"International students requiring a study permit, in the <b>final year of secondary school</b> or graduated no earlier than June of the preceding year, who <b>have not already begun post secondary study elsewhere</b>. Gulf nationals are eligible.",
     ar:"طلبة دوليون يحتاجون تصريح دراسة، في <b>السنة الأخيرة من الثانوية</b> أو تخرجوا في يونيو من السنة السابقة على أبعد تقدير، و<b>لم يبدأوا دراسة جامعية في مكان آخر</b>. ومواطنو الخليج مؤهلون."},
 cv:{en:"Tuition, books, incidental fees and <b>full residence support for four years</b>. About 37 scholars a year from 188 countries.",
     ar:"الرسوم الدراسية، والكتب، والرسوم الفرعية، و<b>سكن كامل لأربع سنوات</b>. نحو ٣٧ طالبًا سنويًا من ١٨٨ دولة."},
 wn:{en:"For 2027 entry: the school nomination portal opens <b>6 July 2026</b>, the school nomination deadline is <b>9 October 2026</b>, the admission application deadline is <b>16 October 2026</b>, and the scholarship application and documents are due <b>6 November 2026</b>.",
     ar:"لدخول ٢٠٢٧: تفتح بوابة ترشيح المدارس في <b>٦ يوليو ٢٠٢٦</b>، وآخر موعد لترشيح المدرسة <b>٩ أكتوبر ٢٠٢٦</b>، وآخر موعد لطلب القبول <b>١٦ أكتوبر ٢٠٢٦</b>، وطلب المنحة ووثائقها في <b>٦ نوفمبر ٢٠٢٦</b>."},
 fl:{en:"The critical mechanic: <b>you must be nominated by your high school, and each school may nominate only one student a year.</b> Speak to your counsellor in Grade 11 or the first weeks of Grade 12, not in November.",
     ar:"النقطة الحاسمة: <b>يجب أن ترشحك مدرستك، ولكل مدرسة ترشيح طالب واحد فقط سنويًا.</b> تحدث مع المرشد في الصف الحادي عشر أو الأسابيع الأولى من الثاني عشر، لا في نوفمبر."},
 url:"https://future.utoronto.ca/pearson-scholarships"},

{id:"usneed", cat:"uni", ct:"us", who:["all"], lvl:"ug", st:"nov",
 n:{en:"United States, need based aid at need blind universities", ar:"الولايات المتحدة، المساعدة القائمة على الحاجة في جامعات القبول غير المرتبط بالقدرة المالية"},
 el:{en:"International undergraduate applicants. A small group of universities is <b>need blind for international students and also meets 100% of demonstrated need</b>: Harvard, Yale, Princeton, MIT, Amherst College, Bowdoin College and Dartmouth College. Some others have recently been reported as joining this group, so verify on each university's own admissions page.",
     ar:"المتقدمون الدوليون للبكالوريوس. مجموعة صغيرة من الجامعات <b>لا تنظر إلى القدرة المالية عند القبول وتغطي ١٠٠٪ من الحاجة المثبتة</b>: هارفارد، ييل، برنستون، معهد ماساتشوستس للتقنية، كلية أمهرست، كلية باودوين، وكلية دارتموث. وذُكر أن جامعات أخرى انضمت مؤخرًا، فتأكد من صفحة القبول في كل جامعة."},
 cv:{en:"Aid is calculated from your family's assessed ability to pay, and can reach the full cost of attendance. A much larger group of universities, including Stanford, Caltech, Chicago, Penn, Columbia, Johns Hopkins, Cornell, Tufts, NYU and Rice, is <b>need aware but still meets full need</b>, meaning asking for aid can affect your admission chances but you will be funded if admitted.",
     ar:"تُحسب المساعدة من قدرة أسرتك المقدّرة على الدفع، وقد تصل إلى كامل تكلفة الدراسة. ومجموعة أكبر بكثير، منها ستانفورد وكالتك وشيكاغو وبنسلفانيا وكولومبيا وجونز هوبكنز وكورنيل وتافتس ونيويورك ورايس، <b>تنظر إلى القدرة المالية لكنها تغطي الحاجة كاملة</b>، أي أن طلب المساعدة قد يؤثر على فرصة قبولك لكنك ستُموَّل إن قُبلت."},
 wn:{en:"Early Action and Early Decision around <b>1 November</b>, Regular Decision <b>1 to 15 January</b>, with the CSS Profile financial aid forms due alongside.",
     ar:"القبول المبكر نحو <b>١ نوفمبر</b>، والقبول العادي من <b>١ إلى ١٥ يناير</b>، مع نماذج المساعدة المالية في الموعد نفسه."},
 fl:{en:"Read this carefully if your family is comfortable financially. This aid is <b>need based</b>, so a Gulf family with a good income may be assessed as able to pay in full and receive nothing. Target <b>merit</b> scholarships instead, and check each one individually because some are restricted to US citizens. The most dangerous category is universities that are need aware and do <b>not</b> meet full need: students get admitted, receive a partial award, and then cannot afford to go.",
     ar:"اقرأ هذا بعناية إذا كان وضع أسرتك المادي مريحًا. هذه المساعدة <b>قائمة على الحاجة</b>، وقد تُقدَّر أسرة خليجية ذات دخل جيد على أنها قادرة على الدفع كاملًا فلا تحصل على شيء. استهدف بدلًا من ذلك منح <b>الجدارة</b>، وتحقق من كل منها على حدة لأن بعضها مقصور على الأمريكيين. وأخطر فئة هي الجامعات التي تنظر إلى القدرة المالية و<b>لا</b> تغطي الحاجة كاملة: يُقبل الطالب، ويحصل على دعم جزئي، ثم لا يستطيع تحمل التكلفة."},
 url:"https://bigfuture.collegeboard.org/pay-for-college"},

{id:"ukug", cat:"uni", ct:"uk", who:["all"], lvl:"ug", st:"jan",
 n:{en:"United Kingdom, undergraduate awards from universities", ar:"المملكة المتحدة، جوائز الجامعات لمرحلة البكالوريوس"},
 el:{en:"International undergraduate applicants holding an offer. Warwick's <b>Undergraduate Global Excellence Scholarship</b> is one of the larger schemes, open to self funded overseas fee status students who apply through UCAS by the January deadline.",
     ar:"المتقدمون الدوليون للبكالوريوس ممن لديهم عرض قبول. و<b>منحة التميز العالمي للبكالوريوس</b> في جامعة وارِك من أكبر البرامج، وهي متاحة للطلبة الممولين ذاتيًا بوضع الرسوم الدولية ممن يقدّمون عبر نظام يوكاس قبل موعد يناير."},
 cv:{en:"Be realistic. <b>The UK has very little full undergraduate funding for international students.</b> Most awards are fee discounts of roughly 2,000 to 10,000 pounds a year, or 25% to 50% off tuition, and almost none cover living costs. Warwick's 2025 round awarded 6 full fee, 148 half fee, 103 quarter fee and 6 smaller awards.",
     ar:"كن واقعيًا. <b>بريطانيا تقدّم تمويلًا كاملًا قليلًا جدًا لمرحلة البكالوريوس للطلبة الدوليين.</b> ومعظم الجوائز خصومات على الرسوم بنحو ٢٠٠٠ إلى ١٠٠٠٠ جنيه سنويًا، أو خصم ٢٥٪ إلى ٥٠٪، ولا يكاد أي منها يغطي المعيشة. ومنحت وارِك في دورة ٢٠٢٥ ست منح كاملة الرسوم، و١٤٨ بنصف الرسوم، و١٠٣ بربع الرسوم، وست جوائز أصغر."},
 wn:{en:"UCAS application by <b>14 January</b>, then scholarship applications typically <b>February to May</b> after you receive an offer.",
     ar:"طلب يوكاس بحلول <b>١٤ يناير</b>، ثم طلبات المنح غالبًا من <b>فبراير إلى مايو</b> بعد استلام العرض."},
 url:"https://warwick.ac.uk/study/scholarships-and-bursaries/"},

{id:"canada", cat:"uni", ct:"ca", who:["all"], lvl:"ug", st:"varies",
 n:{en:"Canada, entrance awards and the UBC International Scholars Programme", ar:"كندا، جوائز القبول وبرنامج علماء كولومبيا البريطانية الدوليين"},
 el:{en:"International undergraduate applicants. The UBC International Scholars Programme combines need and merit. Most Canadian universities award entrance scholarships automatically on admission.",

let lang = "en", pass = "bh", level = "ug", query = "";
const $ = id => document.getElementById(id);

function eligible(s){
  if(s.cat === "no" || s.cat === "pg") return true;
  return s.who.indexOf("all") !== -1 || s.who.indexOf(pass) !== -1;
}

function matchQuery(s){
  if(!query) return true;
  const q = query.toLowerCase();
  const parts = [s.n.en, s.n.ar, s.el.en, s.el.ar];
  if(s.cv){ parts.push(s.cv.en, s.cv.ar); }
  if(s.fl){ parts.push(s.fl.en, s.fl.ar); }
  return parts.join(" ").toLowerCase().indexOf(q) !== -1;
}

    if(s.cat !== sec.cat) return false;
    if(sec.cat === "nat"){
      const own = s.ct === pass;
      if(sec.own !== own) return false;
    }
    if(level === "pg" && (s.cat === "nat" || s.cat === "fgov" || s.cat === "uni")) return false;
    if(level === "pg" && s.cat === "no" && s.lvl !== "pg") return false;
    if(!eligible(s)) return false;
    return matchQuery(s);
  });
}

function badge(s){
  const b = BADGE[s.st] || BADGE.check;
  return `<span class="badge ${b.c}">${b[lang]}</span>`;
}

function card(s, U){
  let body = `<div class="sec"><h3>${U.hEl}</h3><p>${s.el[lang]}</p></div>`;
  if(s.cv) body += `<div class="sec"><h3>${U.hCv}</h3><p>${s.cv[lang]}</p></div>`;
  if(s.wn) body += `<div class="sec"><h3>${U.hWn}</h3><p>${s.wn[lang]}</p></div>`;
  if(s.fl) body += `<div class="flag"><b>${U.hFl}</b><p>${s.fl[lang]}</p></div>`;
  body += `<a class="olink" href="${s.url}" target="_blank" rel="noopener">${U.link} &rsaquo;</a>`;
  return `<div class="mcard${s.cat==="no"?" dead":""}" id="s-${s.id}">
    <button class="mhead" data-id="${s.id}">
      <h2>${s.n[lang]}${badge(s)}</h2><span class="chev">&rsaquo;</span>
    </button>
    <div class="mbody">${body}</div>
  </div>`;
}

function applyChrome(){
  const U = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar"
    ? "المنح والتمويل الدراسي | د. صقر آل خليفة"
    : "Scholarships and Funding | Dr. Saqer AlKhalifa";
  $("langToggle").textContent = U.toggle;
  $("t-title").textContent = U.title;
  $("t-sub").textContent = U.sub;
  $("t-quizline").innerHTML = U.quizline;
  $("t-quizbtn").textContent = U.quizbtn;
  $("t-exploreline").innerHTML = U.exploreline;
  $("t-explorebtn").textContent = U.explorebtn;
  $("t-parline").innerHTML = U.parline;
  $("t-parbtn").textContent = U.parbtn;
  $("t-entline").innerHTML = U.entline;
  $("t-entbtn").textContent = U.entbtn;
  $("r1t").textContent = U.r1t; $("r1").textContent = U.r1;
  $("r2t").textContent = U.r2t; $("r2").textContent = U.r2;
  $("r3t").textContent = U.r3t; $("r3").textContent = U.r3;
  $("t-pickC").textContent = U.pickC;
  $("t-pickL").textContent = U.pickL;
  $("search").placeholder = U.search;
  $("empty").textContent = U.empty;
  $("calT").textContent = U.calT;
  $("calS").textContent = U.calS;
  $("cal").innerHTML = U.cal.map(r =>
    `<div class="cal-row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("");
  $("lastT").textContent = U.lastT;
  $("last").textContent = U.last;
  $("t-disc").textContent = U.disc;
  $("t-foot").innerHTML = U.foot;

  $("countries").innerHTML = CTY_ORDER.map(c =>
    `<button class="fbtn${c===pass?" on":""}" data-c="${c}">${CTY[c][lang]}</button>`).join("");
  $("countries").querySelectorAll(".fbtn").forEach(b =>
    b.addEventListener("click", () => { pass = b.dataset.c; applyChrome(); render(); }));

  $("levels").innerHTML =
    `<button class="fbtn${level==="ug"?" on":""}" data-l="ug">${U.lvlUg}</button>` +
    `<button class="fbtn${level==="pg"?" on":""}" data-l="pg">${U.lvlPg}</button>`;
  $("levels").querySelectorAll(".fbtn").forEach(b =>
    b.addEventListener("click", () => { level = b.dataset.l; applyChrome(); render(); }));

  $("r3box").style.display = (pass === "exp") ? "block" : "none";
}

function render(){
  const U = UI[lang];
  let html = "", total = 0;
  SECTIONS.forEach(sec => {
    const list = forSection(sec);
    if(!list.length) return;
    total += list.length;
    html += `<section class="grp"><h2 class="grp-t">${sec[lang].t}</h2>
      <p class="grp-s">${sec[lang].s}</p>` +
      list.map(s => card(s, U)).join("") + `</section>`;
  });
  $("list").innerHTML = html;
  $("count").textContent = U.count(total);
  $("empty").style.display = total ? "none" : "block";
  $("list").querySelectorAll(".mhead").forEach(b =>
    b.addEventListener("click", () => {
      const c = document.getElementById("s-" + b.dataset.id);
      const opening = !c.classList.contains("open");
      c.classList.toggle("open");
      if(opening && window.goatcounter && window.goatcounter.count){
        try{ window.goatcounter.count({path:"sch-" + b.dataset.id, event:true}); }catch(e){}
      }
    }));
  openFromHash();
}

function openFromHash(){
  const h = (location.hash || "").replace("#", "");
  if(!h) return;
  const c = document.getElementById("s-" + h);
  if(c && !c.classList.contains("open")){
    c.classList.add("open");
    setTimeout(()=>c.scrollIntoView({behavior:"smooth", block:"start"}), 60);
  }
}

function guessPassport(){
  try{
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    const map = {"Asia/Bahrain":"bh","Asia/Qatar":"qa","Asia/Riyadh":"sa",
                 "Asia/Kuwait":"kw","Asia/Dubai":"ae","Asia/Muscat":"om"};
    if(map[tz]) pass = map[tz];
  }catch(e){}
}

$("langToggle").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  applyChrome(); render();
});
$("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
window.addEventListener("hashchange", openFromHash);

guessPassport();
applyChrome();
render();

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
</body>
