<script>
/* MCLANG: one language resolver shared by every Major Compass page.
   Order: ?lang= in the URL, then the visitor's saved choice, then the browser. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }
</script>

/* ============================================================
   Major Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-ar:'Noto Naskh Arabic', 'Amiri', Georgia, serif;

  --paper:#FAF5EA;
  --paper-2:#EFE4CE;
  --card:#F5ECDA;
  --line:#E2D5BB;
  --line-2:#D3C0A0;

  --ink:#152A55;
  --ink-2:#4A3728;
  --ink-3:#6B5B47;

  --navy:#152A55;
  --navy-deep:#0F2047;
  --accent:#7D5F27;
  --accent-soft:#EFE4CE;
  --accent-line:#D3C0A0;

  --gold:#7D5F27;
  --gold-soft:#F5ECDA;
  --gold-line:#E2D5BB;
  --gold-bright:#C09A45;

  --good:#2F5D46;  --good-soft:#E7EEE8;  --good-line:#C9D8CC;
  --warn:#7D5F27;  --warn-soft:#F5ECDA;  --warn-line:#E2D5BB;
  --bad:#8C3A30;   --bad-soft:#F6EAE3;   --bad-line:#E4D2C7;

  --radius:2px; --radius-sm:2px;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

/* ---------- the shared dark nav ---------- */

}

.btn{

.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

.fbtn, .chip, .navbtn, .picker button, .filters button{

input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);

[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{

.rule, .checked, .hedge, .extra, .flag{border-radius:0;}

/* ---------- tables ---------- */

th{

<script>
/* ===== Routes that are not a four-year degree ===== */
const NONE_EN = "No provider verified in this country.";
const NONE_AR = "لم نتحقق من وجود مزوّد في هذه الدولة.";

const ALT = [

/* ---------------- professional qualifications ---------------- */
{id:"acca", f:"prof", open:"all", n:{en:"ACCA, chartered accountancy", ar:"شهادة ACCA في المحاسبة"},
 d:{en:"The single most useful fact on this page: you can start ACCA straight from school. The Foundation level has no academic entry requirements at all, and the full qualification can be entered directly with strong A-levels. You work and study at the same time, which is the point.",
    ar:"أهم معلومة في هذه الصفحة: يمكنك بدء ACCA مباشرة من الثانوية. فمستوى الأساس لا يشترط أي مؤهل أكاديمي إطلاقًا، ويمكن دخول الشهادة الكاملة مباشرة بمستوى متقدم قوي. تعمل وتدرس في الوقت نفسه، وهذا هو المقصود."},
 t:{en:"Foundation level in 12 to 18 months. Full membership needs 13 exams plus 36 months of relevant work experience, so realistically 3 to 5 years from school while employed.",
    ar:"مستوى الأساس في 12 إلى 18 شهرًا. والعضوية الكاملة تحتاج 13 اختبارًا و36 شهرًا من الخبرة العملية، أي 3 إلى 5 سنوات واقعيًا من الثانوية أثناء العمل."},
 c:{en:"Registration about 89 pounds, annual subscription about 137, exams from about 98 to 278 pounds each. Tuition is the larger cost. Budget roughly 8,000 to 15,000 US dollars over three to four years, far below a private university degree.",
    ar:"التسجيل نحو 89 جنيهًا، والاشتراك السنوي نحو 137، والاختبارات من نحو 98 إلى 278 جنيهًا للاختبار. والرسوم الدراسية هي الكلفة الأكبر. قدّر نحو 8,000 إلى 15,000 دولار على ثلاث إلى أربع سنوات، أي أقل بكثير من شهادة جامعية خاصة."},
 w:{bh:{en:"Al Nada Training Centre, Bahrain Financial Harbour, is both a licensed exam centre and a tuition provider. BIBF in Juffair delivers professional qualifications and carries Tamkeen funding. Exam venues also at the British University of Bahrain and the University of Technology Bahrain.",
        ar:"مركز الندى للتدريب في مرفأ البحرين المالي مركز اختبار مرخص ومزوّد تدريب في آن. ومعهد البحرين للدراسات المصرفية والمالية في الجفير يقدّم الشهادات المهنية ويحمل تمويل تمكين. وتوجد مراكز اختبار أيضًا في الجامعة البريطانية في البحرين وجامعة البحرين التقنية."},
    sa:{en:"British Council centres in Riyadh, Jeddah and Dammam. PwC's Academy Middle East teaches in Riyadh and Jeddah.",
        ar:"مراكز المجلس الثقافي البريطاني في الرياض وجدة والدمام. وأكاديمية PwC للشرق الأوسط تدرّس في الرياض وجدة."},
    ae:{en:"PwC's Academy in Dubai, Abu Dhabi and Sharjah. British Council Abu Dhabi and the Emirates Institute of Banking and Finance are exam venues. Phoenix Financial Training in DIFC and Kaplan Genesis are among roughly twenty providers in the UAE.",
        ar:"أكاديمية PwC في دبي وأبوظبي والشارقة. والمجلس الثقافي البريطاني في أبوظبي ومعهد الإمارات للدراسات المصرفية والمالية مركزا اختبار. وفينيكس للتدريب المالي في مركز دبي المالي وكابلان جينيسيس ضمن نحو عشرين مزوّدًا في الإمارات."},
    qa:{en:"Qatar Skills Centre for Administrative Training in West Bay is listed by ACCA itself as a registered learning partner. Inspire Management Training Centre on Najma Street is an exam venue. PwC's Academy teaches in Doha.",
        ar:"مركز قطر للمهارات للتدريب الإداري في الخليج الغربي مدرج لدى ACCA نفسها شريك تعلم مسجل. ومركز إنسباير للتدريب الإداري في شارع النجمة مركز اختبار. وأكاديمية PwC تدرّس في الدوحة."},
    kw:{en:"American University of Kuwait in Salmiya is an exam venue. We could not find a named ACCA approved learning partner with a Kuwait address, so tuition is usually online.",
        ar:"الجامعة الأمريكية في الكويت بالسالمية مركز اختبار. ولم نجد شريك تعلم معتمدًا لـACCA بعنوان في الكويت، فالتدريس عادةً عبر الإنترنت."},
    om:{en:"British Council Muscat is the exam venue. PwC's Academy teaches in Muscat and Phoenix Financial Training has an Oman office.",
        ar:"المجلس الثقافي البريطاني في مسقط هو مركز الاختبار. وأكاديمية PwC تدرّس في مسقط، ولفينيكس للتدريب المالي مكتب في عُمان."}},
 note:{en:"Confirm the exam centre on ACCA's own website before booking. Their centre directory is the only reliable list and it changes.",
       ar:"تأكد من مركز الاختبار على موقع ACCA نفسه قبل الحجز. فدليلهم هو القائمة الموثوقة الوحيدة وهو يتغير."}},

{id:"cima", f:"prof", open:"all", n:{en:"CIMA, management accounting", ar:"شهادة CIMA في المحاسبة الإدارية"},
 d:{en:"Also open entry from school. The Certificate in Business Accounting is four computer-based tests taken on demand, either at a test centre or online from home.",
    ar:"مفتوحة القبول أيضًا من الثانوية. وشهادة محاسبة الأعمال أربعة اختبارات محوسبة تُؤدى عند الطلب، في مركز اختبار أو عبر الإنترنت من المنزل."},
 t:{en:"About six months for the certificate, then the professional levels.",
    ar:"نحو ستة أشهر للشهادة، ثم المستويات المهنية."},
 c:{en:"We could not retrieve current fees from the official site, so check before committing.",
    ar:"لم نستطع الحصول على الرسوم الحالية من الموقع الرسمي، فتحقق قبل الالتزام."},
 w:{bh:{en:"BIBF in Juffair is a Pearson VUE testing centre, which is how CIMA is delivered.",
        ar:"معهد البحرين للدراسات المصرفية والمالية في الجفير مركز اختبار Pearson VUE، وهو الطريق الذي تُقدَّم به CIMA."},
    sa:{en:"Any Pearson VUE centre in the Kingdom, or online from home.", ar:"أي مركز Pearson VUE في المملكة، أو عبر الإنترنت من المنزل."},
    ae:{en:"Future Target Institute in Al Nahda, Dubai, and other Pearson VUE centres.", ar:"معهد فيوتشر تارجت في النهدة بدبي، وغيره من مراكز Pearson VUE."},
    qa:{en:"Pearson VUE centres in Doha, including BMTC Consulting.", ar:"مراكز Pearson VUE في الدوحة، ومنها BMTC للاستشارات."},
    kw:{en:"Pearson VUE centres in Kuwait City.", ar:"مراكز Pearson VUE في مدينة الكويت."},
    om:{en:"Pearson VUE centres in Muscat.", ar:"مراكز Pearson VUE في مسقط."}}},

{id:"cfa", f:"prof", open:"mixed", n:{en:"CFA, investment analysis", ar:"شهادة CFA في تحليل الاستثمار"},
 d:{en:"Not a direct school-leaver route, but there is a door most people do not know about. You can register with 4,000 hours of work experience accumulated over at least three sequential years, with no degree at all. Someone who starts work at eighteen can sit Level I at about twenty one.",
    ar:"ليست مسارًا مباشرًا من الثانوية، لكن فيها بابًا لا يعرفه أكثر الناس. يمكنك التسجيل بأربعة آلاف ساعة خبرة عمل متراكمة خلال ثلاث سنوات متتابعة على الأقل، دون أي شهادة. فمن يبدأ العمل في الثامنة عشرة يمكنه دخول المستوى الأول في نحو الحادية والعشرين."},
 t:{en:"Three levels, minimum about two and a half years of exams, plus the experience requirement.",
    ar:"ثلاثة مستويات، وأقلها نحو سنتين ونصف من الاختبارات، إضافة إلى شرط الخبرة."},
 c:{en:"From about 1,140 US dollars per exam.", ar:"من نحو 1,140 دولارًا للاختبار الواحد."},
 w:{bh:{en:"Prometric centres in Manama.", ar:"مراكز Prometric في المنامة."},
    sa:{en:"Prometric centres in Riyadh and Jeddah.", ar:"مراكز Prometric في الرياض وجدة."},
    ae:{en:"Future Target Institute in Dubai is a named CFA Level I computer-based venue.", ar:"معهد فيوتشر تارجت في دبي مركز معتمد لاختبار المستوى الأول المحوسب."},
    qa:{en:"Prometric centres in Doha.", ar:"مراكز Prometric في الدوحة."},
    kw:{en:"Prometric centres in Kuwait City.", ar:"مراكز Prometric في مدينة الكويت."},
    om:{en:"Prometric centres in Muscat.", ar:"مراكز Prometric في مسقط."}},
 note:{en:"A valid international passport is mandatory to register.",
       ar:"جواز سفر دولي ساري المفعول شرط إلزامي للتسجيل."}},

{id:"cpa", f:"prof", open:"degree", n:{en:"US CPA and CMA", ar:"شهادتا CPA وCMA الأمريكيتان"},
 d:{en:"Named here so you know where the walls are. CPA effectively requires a bachelor's plus about 150 semester hours. CMA requires a bachelor's or an accepted professional certification, which is the back door: finish ACCA first, then CMA.",
    ar:"مذكورتان هنا لتعرف أين تقف الجدران. فـCPA تتطلب عمليًا بكالوريوس ونحو 150 ساعة فصلية. وCMA تتطلب بكالوريوس أو شهادة مهنية معتمدة، وهذا هو الباب الخلفي: أكمل ACCA أولًا ثم CMA."},
 t:{en:"Four CPA sections; two CMA parts plus two years of experience.",
    ar:"أربعة أقسام في CPA؛ وجزآن في CMA مع سنتي خبرة."},
 c:{en:"CPA about 390 US dollars per section internationally, plus jurisdiction fees. CMA about 545 dollars per part, with lower student rates.",
    ar:"CPA نحو 390 دولارًا للقسم دوليًا، إضافة إلى رسوم الولاية. وCMA نحو 545 دولارًا للجزء، مع أسعار أقل للطلبة."},
 w:{bh:{en:"CPA international testing is available.", ar:"اختبار CPA الدولي متاح."},
    sa:{en:"CPA international testing is available. Note that SOCPA registration, which matters for accountants working in the Kingdom, appears to require a degree certificate.",
        ar:"اختبار CPA الدولي متاح. ولاحظ أن تسجيل الهيئة السعودية للمراجعين والمحاسبين، وهو مهم للمحاسبين العاملين في المملكة، يبدو أنه يشترط شهادة جامعية."},
    ae:{en:"CPA international testing is available.", ar:"اختبار CPA الدولي متاح."},
    qa:{en:"Qatar is not on the current CPA international testing list.", ar:"قطر ليست على قائمة اختبار CPA الدولي الحالية."},
    kw:{en:"CPA international testing is available.", ar:"اختبار CPA الدولي متاح."},
    om:{en:"Oman is not on the current CPA international testing list.", ar:"عُمان ليست على قائمة اختبار CPA الدولي الحالية."}}},

/* ---------------- technical certifications ---------------- */
{id:"cloud", f:"cert", open:"all", n:{en:"Cloud certifications: AWS, Azure, Google", ar:"شهادات الحوسبة السحابية: AWS وAzure وجوجل"},
 d:{en:"No degree, no prerequisites, no minimum age in practice. The cheapest credible first rung in technology. AWS Certified Cloud Practitioner and Google Associate Cloud Engineer are the two usual starting points.",
    ar:"لا شهادة جامعية ولا متطلبات سابقة ولا حد أدنى للعمر عمليًا. أرخص درجة أولى معتبرة في التقنية. وشهادتا AWS Cloud Practitioner وGoogle Associate Cloud Engineer هما نقطتا البداية المعتادتان."},
 t:{en:"90 minutes to two hours per exam. Study time is what you make it, typically weeks not years.",
    ar:"من 90 دقيقة إلى ساعتين للاختبار. أما وقت الدراسة فبيدك، وعادةً أسابيع لا سنوات."},
 c:{en:"AWS Cloud Practitioner about 100 US dollars. Google Associate Cloud Engineer about 125. Microsoft AZ-900 varies by region. Valid three years.",
    ar:"AWS Cloud Practitioner نحو 100 دولار. وGoogle Associate Cloud Engineer نحو 125. وMicrosoft AZ-900 يختلف بحسب المنطقة. وصلاحيتها ثلاث سنوات."},
 w:{bh:{en:"BIBF in Juffair is a Pearson VUE centre. Exams can also be taken online under proctoring from home.",
        ar:"معهد البحرين للدراسات المصرفية والمالية في الجفير مركز Pearson VUE. ويمكن أداء الاختبارات عبر الإنترنت من المنزل تحت مراقبة."},
    sa:{en:"Pearson VUE centres across the Kingdom, plus free training through Tuwaiq Academy and the Saudi Digital Academy for citizens.",
        ar:"مراكز Pearson VUE في أنحاء المملكة، مع تدريب مجاني عبر أكاديمية طويق والأكاديمية الرقمية السعودية للمواطنين."},
    ae:{en:"Future Target Institute in Dubai runs Pearson VUE, Prometric and PSI under one roof. New Horizons Dubai and a Pearson VUE centre in Ajman.",
        ar:"معهد فيوتشر تارجت في دبي يجمع Pearson VUE وPrometric وPSI تحت سقف واحد. ونيو هورايزونز دبي ومركز Pearson VUE في عجمان."},
    qa:{en:"New Horizons Qatar and BMTC Consulting, an authorised Pearson VUE testing facility.",
        ar:"نيو هورايزونز قطر وBMTC للاستشارات، وهو مرفق اختبار Pearson VUE معتمد."},
    kw:{en:"New Horizons Kuwait City runs Cisco and CompTIA tracks and hosts exams.",
        ar:"نيو هورايزونز في مدينة الكويت يقدّم مسارات سيسكو وCompTIA ويستضيف الاختبارات."},
    om:{en:"Pearson VUE centres in Muscat.", ar:"مراكز Pearson VUE في مسقط."}}},

{id:"comptia", f:"cert", open:"all", n:{en:"CompTIA and Cisco: A+, Network+, Security+, CCNA", ar:"شهادات CompTIA وسيسكو: ‏A+ وNetwork+ وSecurity+ وCCNA"},
 d:{en:"The standard hardware, networking and security ladder. No degree required at any point. Security+ in particular is a common minimum for cybersecurity roles and for some government contracts.",
    ar:"السلم المعياري للأجهزة والشبكات والأمن. لا تشترط شهادة جامعية في أي مرحلة. وSecurity+ تحديدًا حد أدنى شائع لوظائف الأمن السيبراني ولبعض العقود الحكومية."},
 t:{en:"Each exam is a single sitting. A+ is two exams.",
    ar:"كل اختبار جلسة واحدة. وA+ اختباران."},
 c:{en:"A+ about 274 US dollars per exam and there are two, so about 548 in total. Network+ about 399. Security+ about 439. Cisco CCNA about 300. Most are valid three years.",
    ar:"A+ نحو 274 دولارًا للاختبار وهما اثنان، أي نحو 548 دولارًا. وNetwork+ نحو 399. وSecurity+ نحو 439. وسيسكو CCNA نحو 300. ومعظمها صالح ثلاث سنوات."},
 w:{bh:{en:"BIBF delivers Cisco, CompTIA, Oracle, VMware and other vendor exams as a Pearson VUE centre.",
        ar:"معهد البحرين للدراسات المصرفية والمالية يقدّم اختبارات سيسكو وCompTIA وأوراكل وVMware وغيرها بصفته مركز Pearson VUE."},
    sa:{en:"Pearson VUE centres across the Kingdom.", ar:"مراكز Pearson VUE في أنحاء المملكة."},
    ae:{en:"Future Target Institute and New Horizons Dubai.", ar:"معهد فيوتشر تارجت ونيو هورايزونز دبي."},
    qa:{en:"New Horizons Qatar.", ar:"نيو هورايزونز قطر."},
    kw:{en:"New Horizons Kuwait City runs full Cisco and CompTIA tracks.", ar:"نيو هورايزونز في مدينة الكويت يقدّم مسارات سيسكو وCompTIA كاملة."},
    om:{en:"Pearson VUE centres in Muscat.", ar:"مراكز Pearson VUE في مسقط."}}},

{id:"free", f:"cert", open:"mixed", n:{en:"Free and state-funded technology training", ar:"التدريب التقني المجاني والممول من الدولة"},
 d:{en:"The best value in the region, and the place where nationality matters most. Read the country line carefully.",
    ar:"أفضل قيمة في المنطقة، وأكثر موضع تهم فيه الجنسية. اقرأ سطر دولتك بعناية."},
 t:{en:"Typically 8 to 16 weeks full time.", ar:"عادةً من 8 إلى 16 أسبوعًا بدوام كامل."},
 c:{en:"Free where you qualify.", ar:"مجاني لمن ينطبق عليه الشرط."},
 w:{bh:{en:"AWS re/Start, delivered by ThinkSmart: free, full time, twelve weeks, Sunday to Thursday, and it pays for your AWS Cloud Practitioner exam. Eligibility is residency in Bahrain plus a high school diploma and the right to work, NOT nationality, which makes it the most accessible free technology route in the Gulf for an expatriate school leaver. Tamkeen funds training and on-the-job placements for Bahrainis.",
        ar:"برنامج AWS re/Start عبر ThinkSmart: مجاني بدوام كامل لاثني عشر أسبوعًا من الأحد إلى الخميس، ويدفع رسوم اختبار AWS Cloud Practitioner. والشرط الإقامة في البحرين وشهادة ثانوية وحق العمل، لا الجنسية، وهذا يجعله أكثر مسار تقني مجاني إتاحةً في الخليج للخريج الوافد. وتمكين تموّل التدريب والتوظيف على رأس العمل للبحرينيين."},
    sa:{en:"Tuwaiq Academy in Riyadh runs bootcamps in software, cybersecurity, cloud and game development. Doroob is free and open to any Saudi citizen. The Saudi Digital Academy and SAMAI are also citizen programmes. Non-Saudis should look at the private accredited institutes instead.",
        ar:"أكاديمية طويق في الرياض تقدّم معسكرات في البرمجة والأمن السيبراني والسحابة وتطوير الألعاب. ودروب مجاني ومفتوح لأي مواطن سعودي. والأكاديمية الرقمية السعودية وسماي برنامجان للمواطنين أيضًا. أما غير السعوديين فعليهم النظر في المعاهد الخاصة المعتمدة."},
    ae:{en:"AWS re/Start operates in the UAE as well as Bahrain. National coding programmes exist but we could not verify their current status, so check before relying on them.",
        ar:"برنامج AWS re/Start يعمل في الإمارات كما في البحرين. وتوجد برامج برمجة وطنية لكننا لم نتحقق من وضعها الحالي، فتأكد قبل الاعتماد عليها."},
    qa:{en:"The Qatar Digital Academy is a Ministry of Communications initiative. We could not verify eligibility, cost or partners, so contact them directly.",
        ar:"الأكاديمية الرقمية القطرية مبادرة من وزارة الاتصالات. ولم نتحقق من شروط القبول أو الكلفة أو الشركاء، فتواصل معهم مباشرة."},
    kw:{en:"Kuwait Codes, run by CODED Academy, is entirely free and open to high school and ninth grade students in Kuwait, covering mobile and web development, cybersecurity and Python. AWS re/Start also covers Kuwait.",
        ar:"مبادرة كويت كودز من أكاديمية CODED مجانية تمامًا ومفتوحة لطلبة الثانوية والصف التاسع في الكويت، وتغطي تطوير التطبيقات والويب والأمن السيبراني وبايثون. ويغطي AWS re/Start الكويت أيضًا."},
    om:{en:"The Oman AI and Digital Future Programme is running under the Ministry of Transport, Communications and Information Technology. We could not verify eligibility or cost.",
        ar:"برنامج عُمان للذكاء الاصطناعي والمستقبل الرقمي يعمل تحت وزارة النقل والاتصالات وتقنية المعلومات. ولم نتحقق من شروط القبول أو الكلفة."}}},

/* ---------------- vocational and technical ---------------- */
{id:"voc", f:"voc", open:"mixed", n:{en:"Technical and vocational institutes", ar:"المعاهد التقنية والمهنية"},
 d:{en:"A diploma or higher diploma in two to three years, taught with your hands, and in several Gulf states it carries the same admission rights to university afterwards as an academic secondary certificate. This is the most underrated route in the region.",
    ar:"دبلوم أو دبلوم عالٍ في سنتين إلى ثلاث، يُدرّس بيديك، وفي عدة دول خليجية يمنحك بعده حق الالتحاق بالجامعة كما تمنحه الثانوية الأكاديمية. وهذا أكثر المسارات بخسًا لحقه في المنطقة."},
 t:{en:"Two to three years, sometimes less for a craft certificate.",
    ar:"سنتان إلى ثلاث، وأحيانًا أقل لشهادة حرفية."},
 c:{en:"Heavily subsidised for nationals, and often not for anyone else. See your country.",
    ar:"مدعوم بقوة للمواطنين، وغالبًا غير مدعوم لغيرهم. انظر دولتك."},
 w:{bh:{en:"Bahrain Polytechnic in Isa Town takes a 70 per cent cumulative secondary average from any curriculum, and offers diplomas alongside degrees in engineering technology, ICT, logistics and business. Fees are BHD 2 per credit for Bahrainis and BHD 20 for non-Bahrainis, a tenfold difference. Bahrain Training Institute awards BTEC first, national and higher national diplomas, and importantly it offers craft certificates to learners who did not complete secondary school, which is the lowest formal barrier we found anywhere in the Gulf.",
        ar:"بوليتكنك البحرين في مدينة عيسى يقبل معدلًا تراكميًا ثانويًا 70 بالمئة من أي منهج، ويقدّم دبلومات إلى جانب البكالوريوس في تقنية الهندسة وتقنية المعلومات واللوجستيات والأعمال. والرسوم ديناران للساعة للبحرينيين وعشرون لغيرهم، أي عشرة أضعاف. ومعهد البحرين للتدريب يمنح دبلومات BTEC الأولى والوطنية والعليا، والأهم أنه يقدّم شهادات حرفية لمن لم يكمل الثانوية، وهو أدنى حاجز رسمي وجدناه في الخليج."},
    sa:{en:"The Technical and Vocational Training Corporation runs about 138 technical colleges and accredits more than 1,285 private institutes, with over 250 specialisations. Evening diploma programmes pay trainees a monthly stipend plus an accredited certificate. Named colleges include Riyadh, Jeddah, Dammam, Madinah and the Saudi Mining Polytechnic. Government college admission appears to be for citizens; the private accredited institutes are the likely route for others.",
        ar:"المؤسسة العامة للتدريب التقني والمهني تدير نحو 138 كلية تقنية وتعتمد أكثر من 1,285 معهدًا خاصًا، بأكثر من 250 تخصصًا. وبرامج الدبلوم المسائية تدفع للمتدرب مكافأة شهرية مع شهادة معتمدة. ومن الكليات: الرياض وجدة والدمام والمدينة والبوليتكنك السعودي للتعدين. ويبدو أن القبول في الكليات الحكومية للمواطنين، وأن المعاهد الخاصة المعتمدة هي المسار المرجح لغيرهم."},
    ae:{en:"Abu Dhabi Polytechnic accepts both UAE nationals and international students, although its national qualification programmes are for Emiratis only; entry is 75 to 85 per cent in maths and physics depending on track, with a maximum age of 25. Higher Colleges of Technology is for Emiratis and children of Emirati mothers only, at 60 per cent minimum. Also the Institute of Applied Technology, ADVETI and the National Institute for Vocational Education.",
        ar:"بوليتكنك أبوظبي يقبل المواطنين والطلبة الدوليين، وإن كانت برامج المؤهلات الوطنية للإماراتيين فقط؛ والقبول من 75 إلى 85 بالمئة في الرياضيات والفيزياء بحسب المسار، بحد أقصى للعمر 25 سنة. أما كليات التقنية العليا فللإماراتيين وأبناء الأم الإماراتية فقط، بحد أدنى 60 بالمئة. وهناك أيضًا معهد التكنولوجيا التطبيقية وأدفيتي والمعهد الوطني للتعليم المهني."},
    qa:{en:"The University of Doha for Science and Technology offers more than seventy diploma, bachelor's and master's programmes and explicitly welcomes international students. Diploma fees are QAR 12,500 per semester for Qatar residents and QAR 18,750 for international students, with a full tuition waiver for Qataris and children of Qatari mothers.",
        ar:"جامعة الدوحة للعلوم والتكنولوجيا تقدّم أكثر من سبعين برنامج دبلوم وبكالوريوس وماجستير وترحّب صراحةً بالطلبة الدوليين. ورسوم الدبلوم 12,500 ريال قطري للفصل للمقيمين و18,750 للطلبة الدوليين، مع إعفاء كامل للقطريين وأبناء الأم القطرية."},
    kw:{en:"The Public Authority for Applied Education and Training runs five colleges and several institutes, including the Higher Institute of Energy, the Industrial Training Institute and the Constructional Training Institute. For 2025 and 2026 PAAET announced admission limited to Kuwaiti nationals, while a standing government service for non-Kuwaitis sets a 70 per cent science requirement and opens only General Nursing within health sciences. The two are contradictory, so ask the registrar directly.",
        ar:"الهيئة العامة للتعليم التطبيقي والتدريب تدير خمس كليات وعدة معاهد، منها المعهد العالي للطاقة ومعهد التدريب الصناعي ومعهد التدريب الإنشائي. وأعلنت الهيئة لعامي 2025 و2026 قصر القبول على الكويتيين، بينما تحدد خدمة حكومية قائمة لغير الكويتيين شرط 70 بالمئة في القسم العلمي وتفتح التمريض العام فقط ضمن العلوم الصحية. والأمران متناقضان، فاسأل التسجيل مباشرة."},
    om:{en:"The University of Technology and Applied Sciences has eleven branches from Musandam to Salalah and awards diplomas, advanced diplomas and bachelor's degrees. Seven government vocational colleges operate at Seeb, Saham, Sur, Ibri, Shinas, Al Buraimi and Salalah, plus a marine sciences college at Al Khaburah. The vocational diploma runs a minimum of three years, and there is a separate apprenticeship pathway aimed at under-eighteens and jobseekers.",
        ar:"جامعة التقنية والعلوم التطبيقية لها أحد عشر فرعًا من مسندم إلى صلالة، وتمنح الدبلوم والدبلوم المتقدم والبكالوريوس. وتعمل سبع كليات مهنية حكومية في السيب وصحم وصور وعبري وشناص والبريمي وصلالة، إضافة إلى كلية العلوم البحرية في الخابورة. والدبلوم المهني ثلاث سنوات على الأقل، وهناك مسار تلمذة مهنية منفصل موجّه لمن دون الثامنة عشرة وللباحثين عن عمل."}}},

/* ---------------- apprenticeships ---------------- */
{id:"oilgas", f:"appr", open:"nationals", n:{en:"Oil and gas apprenticeships", ar:"التلمذة المهنية في النفط والغاز"},
 d:{en:"Paid from day one, and they end in a job rather than a job search. This is the single best non-degree route in the Gulf if you hold the right passport, and it is closed if you do not.",
    ar:"مدفوعة من اليوم الأول، وتنتهي بوظيفة لا ببحث عن وظيفة. وهذا أفضل مسار غير جامعي في الخليج إن كنت تحمل الجواز المناسب، وهو مغلق إن لم تكن."},
 t:{en:"Two to three years.", ar:"سنتان إلى ثلاث."},
 c:{en:"Nothing. You are paid to attend.", ar:"لا شيء. أنت تُدفع لك مكافأة لتحضر."},
 w:{bh:{en:"The Bapco diploma and apprenticeship programme runs three years: a foundation year then two years of technical training at the Oil and Gas Academy with practical work at the refinery, in operations, mechanical, electrical or instrumentation. It guarantees employment on successful completion. Entry requirements and pay are not published, so contact them.",
        ar:"برنامج دبلوم وتلمذة بابكو ثلاث سنوات: سنة تأسيسية ثم سنتان تدريب تقني في أكاديمية النفط والغاز مع عمل تطبيقي في المصفاة، في التشغيل أو الميكانيكا أو الكهرباء أو أجهزة القياس. ويضمن التوظيف عند الإتمام بنجاح. أما شروط القبول والأجر فغير منشورة، فتواصل معهم."},
    sa:{en:"The Saudi Aramco Apprenticeship Programme is for Saudi nationals, needs a 75 per cent secondary average and 72 on the QIYAS aptitude test, with a maximum age of 24. It pays a monthly stipend with housing, transport and medical care during training, and ends in an entry-level Aramco job with twelve monthly salaries plus a Ramadan salary and a housing allowance.",
        ar:"برنامج التلمذة في أرامكو السعودية للسعوديين، ويشترط معدل ثانوي 75 بالمئة و72 في اختبار القدرات، بحد أقصى للعمر 24 سنة. ويدفع مكافأة شهرية مع سكن ونقل ورعاية طبية أثناء التدريب، وينتهي بوظيفة مبتدئة في أرامكو باثني عشر راتبًا شهريًا وراتب رمضان وبدل سكن."},
    ae:{en:"The ADNOC Technical Academy has graduated more than six thousand UAE nationals since 1978, with 403 in 2025 alone. It is a two-year vocational curriculum in electrical maintenance, instrumentation, mechanical maintenance and processing operations, leading into ADNOC Group roles.",
        ar:"أكاديمية أدنوك التقنية خرّجت أكثر من ستة آلاف إماراتي منذ 1978، منهم 403 في 2025 وحدها. وهي منهج مهني سنتان في الصيانة الكهربائية وأجهزة القياس والصيانة الميكانيكية وعمليات المعالجة، وتقود إلى وظائف في مجموعة أدنوك."},
    qa:{en:"QatarEnergy runs technician-level national development programmes. We could not retrieve current entry requirements, so apply through their careers portal.",
        ar:"قطر للطاقة تدير برامج تطوير وطنية على مستوى الفنيين. ولم نستطع الحصول على شروط القبول الحالية، فتقدّم عبر بوابة التوظيف لديهم."},
    kw:{en:"We found no published Kuwait Oil Company school-leaver apprenticeship. Check their careers page directly.",
        ar:"لم نجد برنامج تلمذة منشورًا لشركة نفط الكويت لخريجي الثانوية. راجع صفحة التوظيف لديهم مباشرة."},
    om:{en:"The Technician Omanisation Programme is advertised through the national oil and gas jobs portal, and Oman's vocational colleges run a formal apprenticeship pathway at semi-skilled, skilled and professional levels.",
        ar:"برنامج تعمين الفنيين يُعلن عبر البوابة الوطنية لوظائف النفط والغاز، والكليات المهنية العُمانية تدير مسار تلمذة رسميًا بمستويات شبه ماهر وماهر ومحترف."}}},

{id:"aviation", f:"appr", open:"nationals", n:{en:"Aircraft maintenance engineering", ar:"هندسة صيانة الطائرات"},
 d:{en:"The strongest earn-while-you-learn route in the region, and it ends in a civil aviation authority licence, which is a legal moat no degree gives you. Almost all of these schemes are for nationals.",
    ar:"أقوى مسار للتعلم مع الكسب في المنطقة، وينتهي برخصة من هيئة الطيران المدني، وهي حصانة قانونية لا تمنحها شهادة جامعية. وأغلب هذه البرامج للمواطنين."},
 t:{en:"Four to five and a half years.", ar:"من أربع إلى خمس سنوات ونصف."},
 c:{en:"Fully sponsored, with a stipend that becomes a salary.", ar:"ممولة بالكامل، بمكافأة تتحول إلى راتب."},
 w:{bh:{en:"The Gulf Aviation Academy in Muharraq is the Gulf Air Group training arm, but we found no published school-leaver apprenticeship. Ask Gulf Air careers directly.",
        ar:"أكاديمية الخليج للطيران في المحرق هي الذراع التدريبي لمجموعة طيران الخليج، لكننا لم نجد برنامج تلمذة منشورًا لخريجي الثانوية. اسأل توظيف طيران الخليج مباشرة."},
    sa:{en:"Saudia Aerospace Engineering Industries and the Saudi Academy of Civil Aviation run technician training. Verify current intakes directly.",
        ar:"الشركة السعودية لهندسة وصناعة الطيران والأكاديمية السعودية للطيران المدني تديران تدريبًا للفنيين. تحقق من الدفعات الحالية مباشرة."},
    ae:{en:"The Emirates Group AMEL scholarship runs five and a half years for Emirati school leavers, fully sponsored, with a stipend that progresses to a full salary, ending in a GCAA certificate and a higher diploma. flydubai runs a four-year apprenticeship for UAE nationals aged 17 to 24.",
        ar:"منحة رخصة مهندس صيانة الطائرات في مجموعة الإمارات خمس سنوات ونصف لخريجي الثانوية الإماراتيين، ممولة بالكامل بمكافأة تتحول إلى راتب كامل، وتنتهي بشهادة الهيئة العامة للطيران المدني ودبلوم عالٍ. وفلاي دبي تدير تلمذة أربع سنوات للإماراتيين من 17 إلى 24 سنة."},
    qa:{en:"The Qatar Airways aircraft maintenance engineering scholarship is for Qataris and applicants with a Qatari mother, aged 17 to 24, needing a scientific stream diploma at 70 or 75 per cent and IELTS 5.0 to 5.5. It runs about four and a quarter years, is fully funded, carries a five-year employment commitment, and ends in a Qatar Civil Aviation Authority licence.",
        ar:"منحة هندسة صيانة الطائرات في الخطوط الجوية القطرية للقطريين ولأبناء الأم القطرية، من 17 إلى 24 سنة، وتشترط ثانوية علمية بنسبة 70 أو 75 بالمئة وآيلتس من 5.0 إلى 5.5. ومدتها نحو أربع سنوات وربع، وممولة بالكامل، وفيها التزام بالعمل خمس سنوات، وتنتهي برخصة من الهيئة العامة للطيران المدني القطرية."},
    kw:{en:"We found no published Kuwait Airways school-leaver scheme.", ar:"لم نجد برنامجًا منشورًا للخطوط الجوية الكويتية لخريجي الثانوية."},
    om:{en:"Oman Airports and Oman Air run technical training; check their careers pages.", ar:"مطارات عُمان والطيران العُماني يديران تدريبًا تقنيًا؛ راجع صفحات التوظيف لديهما."}}},

{id:"ojt", f:"appr", open:"nationals", n:{en:"Government on-the-job training schemes", ar:"برامج التدريب الحكومية على رأس العمل"},
 d:{en:"Not an apprenticeship in the trade sense, but you are paid an allowance while an employer trains you, and many of these convert into a permanent job.",
    ar:"ليست تلمذة بالمعنى الحرفي، لكنك تتقاضى بدلًا بينما يدرّبك صاحب عمل، وكثير منها يتحول إلى وظيفة دائمة."},
 t:{en:"Six to twelve months, longer in some tracks.", ar:"من ستة إلى اثني عشر شهرًا، وأطول في بعض المسارات."},
 c:{en:"Free, and you are paid.", ar:"مجانية، وتتقاضى مقابلًا."},
 w:{bh:{en:"The Tamkeen on-the-job training programme is open to any Bahraini aged 18 and over who is a jobseeker, whether or not nominated by the Ministry of Labour. It runs six to twelve months and pays a monthly allowance of BHD 200, or BHD 300 on the registered lawyers' track.",
        ar:"برنامج التدريب على رأس العمل من تمكين مفتوح لأي بحريني من 18 سنة فأكثر باحث عن عمل، سواء رشحته وزارة العمل أو لا. ومدته من ستة إلى اثني عشر شهرًا، ويدفع بدلًا شهريًا 200 دينار، أو 300 دينار في مسار المحامين المسجلين."},
    sa:{en:"Technical and Vocational Training Corporation evening programmes pay a monthly stipend during training. The Tamheer scheme exists but targets graduates, not school leavers.",
        ar:"البرامج المسائية في المؤسسة العامة للتدريب التقني والمهني تدفع مكافأة شهرية أثناء التدريب. وبرنامج تمهير موجود لكنه يستهدف الخريجين لا خريجي الثانوية."},
    ae:{en:"Nafis supports Emirati employment in the private sector, including training and salary support.",
        ar:"برنامج نافس يدعم توظيف الإماراتيين في القطاع الخاص، بما في ذلك التدريب ودعم الرواتب."},
    qa:{en:"Qatarisation programmes run through individual employers rather than a single national scheme.",
        ar:"برامج التقطير تُدار عبر أصحاب العمل فرادى لا عبر برنامج وطني واحد."},
    kw:{en:"Programmes run through the Manpower and Government Restructuring Programme.",
        ar:"البرامج تُدار عبر برنامج إعادة هيكلة القوى العاملة والجهاز التنفيذي للدولة."},
    om:{en:"The vocational colleges' apprenticeship pathway targets under-eighteens and jobseekers at three competence levels, and Oman's 2025 labour plan targeted 45,000 jobs.",
        ar:"مسار التلمذة في الكليات المهنية يستهدف من دون الثامنة عشرة والباحثين عن عمل بثلاثة مستويات كفاءة، وخطة عُمان للعمل لعام 2025 استهدفت 45 ألف وظيفة."}}},

/* ---------------- licensed trades ---------------- */
{id:"trades", f:"trade", open:"all", n:{en:"Licensed electrical and plumbing trades", ar:"الحرف الكهربائية والسباكة المرخصة"},
 d:{en:"A trade licence is a legal moat that a bachelor's degree does not give you. You cannot legally do the work without it, which means the number of people who can compete with you is fixed by an examination rather than by how many graduates a university produced.",
    ar:"رخصة الحرفة حصانة قانونية لا تمنحها شهادة جامعية. فلا يمكنك مزاولة العمل قانونًا دونها، أي أن عدد من ينافسك يحدده اختبار لا عدد الخريجين الذين تنتجهم جامعة."},
 t:{en:"Weeks to months of preparation, then a written and often a practical examination.",
    ar:"أسابيع إلى أشهر من التحضير، ثم اختبار كتابي وعملي في الغالب."},
 c:{en:"Very low compared with anything else on this page.",
    ar:"منخفضة جدًا مقارنة بأي شيء آخر في هذه الصفحة."},
 w:{bh:{en:"The Electricity and Water Authority issues four classes of electrician licence: engineer, technician, wireman and cable jointer. The wireman licence costs BHD 20 to register plus BHD 20 for the practical exam, needs a written and a practical test, and is valid five years. There is a parallel plumbers scheme. Applications are processed in about five working days. No degree is required for the technician or wireman routes.",

function L(){ return T[LANG]; }
function tx(o){ return o ? o[LANG] : ""; }

function renderChrome(){
  var t = L();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("lede").textContent = t.lede;

  document.getElementById("t-splitT").textContent = t.splitT;
  document.getElementById("t-splitS").textContent = t.splitS;
  document.getElementById("splits").innerHTML = t.splits.map(function(k){
    return '<div class="pt"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  document.getElementById("t-pickC").textContent = t.pickC;
  document.getElementById("t-pickF").textContent = t.pickF;
  document.getElementById("cchips").innerHTML = CTRYS.map(function(c){
    return '<button class="chip'+(CTRY===c.k?' on':'')+'" data-c="'+c.k+'">'+tx(c)+'</button>'; }).join("");
  document.getElementById("fchips").innerHTML = FAMS.map(function(f){
    return '<button class="chip'+(FAM===f.k?' on':'')+'" data-f="'+f.k+'">'+tx(f)+'</button>'; }).join("");

  document.getElementById("t-downT").textContent = t.downT;
  document.getElementById("t-downS").textContent = t.downS;
  document.getElementById("downs").innerHTML = t.downs.map(function(k){
    return '<div class="pt warn"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  document.getElementById("t-quizline").textContent = t.quizline;
  document.getElementById("t-quizbtn").textContent = t.quizbtn;
  document.getElementById("t-entline").textContent = t.entline;
  document.getElementById("t-entbtn").textContent = t.entbtn;
  document.getElementById("t-ailine").textContent = t.ailine;
  document.getElementById("t-aibtn").textContent = t.aibtn;

  document.getElementById("t-gapsT").textContent = t.gapsT;
  document.getElementById("gaps").innerHTML = t.gaps.map(function(g){
    return '<li>'+g+'</li>'; }).join("");

  document.getElementById("srcT").textContent = t.srcT;
  document.getElementById("srcS").textContent = t.srcS;
  document.getElementById("srcList").innerHTML = T.en.src.map(function(s){
    return '<li>'+s[0]+' <a href="'+s[1]+'" target="_blank" rel="noopener">'+s[1]+'</a></li>'; }).join("");

  document.getElementById("t-disc").textContent = t.disc;
  document.getElementById("t-foot").textContent = t.foot;
}

function renderList(){
  var t = L();
  var list = ALT.filter(function(r){ return FAM === "all" || r.f === FAM; });
  document.getElementById("count").textContent = t.count(list.length);
  document.getElementById("rlist").innerHTML = list.map(function(r){
    var wLabel, w;
    if(CTRY === "all"){
      wLabel = t.whereAll;
      w = '<div class="wall">' + CTRYS.filter(function(c){ return c.k !== "all"; }).map(function(c){
        var has = r.w && r.w[c.k];
        return '<div class="wrow'+(has?'':' empty')+'"><span class="wc">'+tx(c)+'</span>' +
               '<span class="wt">'+(has ? tx(r.w[c.k]) : t.none)+'</span></div>';
      }).join("") + '</div>';
    } else {
      wLabel = t.where;
      w = r.w && r.w[CTRY] ? tx(r.w[CTRY]) : t.none;
    }
    var note = r.note ? '<div class="note">'+tx(r.note)+'</div>' : '';
    return '<div class="rt">' +
      '<div class="rh"><b>'+tx(r.n)+'</b><span class="tag '+r.open+'">'+tx(OPEN[r.open])+'</span></div>' +
      '<p>'+tx(r.d)+'</p>' +
      '<div class="meta">' +
        '<div><span class="ml">'+t.time+'</span>'+tx(r.t)+'</div>' +
        '<div><span class="ml">'+t.cost+'</span>'+tx(r.c)+'</div>' +
      '</div>' +
      '<div class="wh"><span class="wl">'+wLabel+'</span>'+w+'</div>' + note +
    '</div>';
  }).join("");
}

function renderAll(){ renderChrome(); renderList(); }

document.addEventListener("click", function(e){
  var c = e.target.closest ? e.target.closest(".chip") : null;
  if(!c) return;
  if(c.hasAttribute("data-c")) CTRY = c.getAttribute("data-c");
  else if(c.hasAttribute("data-f")) FAM = c.getAttribute("data-f");
  else return;
  renderAll();
  if(window.goatcounter && window.goatcounter.count){
    try{ window.goatcounter.count({path:"alt-"+CTRY+"-"+FAM, title:"Alt routes "+CTRY+" "+FAM, event:true}); }catch(err){}
  }
});

document.getElementById("langToggle").addEventListener("click", function(){
  LANG = (LANG === "en") ? "ar" : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === "ar") ? "rtl" : "ltr";
  this.textContent = (LANG === "ar") ? "English" : "عربي";
  renderAll();
});

renderAll();

<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
/* MCLANG boot: applies the resolved language by driving the page's own toggle,
   then remembers whatever the visitor lands on. */
(function(){
  /* The visitor's language has to survive every click, including clicks that
     cross from one of these sites to another. They sit on different origins,
     so localStorage cannot carry the choice across; every internal link gets
     stamped with the current language instead. */
  var HOSTS = ["saqeralkhalifa.github.io", "internships.saqeralkhalifa.com",
               "saqeralkhalifa.com", "www.saqeralkhalifa.com"];

  function cur(){ return document.documentElement.lang === "ar" ? "ar" : "en"; }

  /* Never overwrite a lang that is already on the link. An explicit ?lang=ar
     link is itself a deliberate choice and outranks the running preference. */
  function stamp(a){
    try{
      var raw = a.getAttribute("href");
      if(!raw || raw.charAt(0) === "#") return;
      var u = new URL(raw, location.href);
      if(u.protocol !== "http:" && u.protocol !== "https:") return;
      if(HOSTS.indexOf(u.hostname) === -1) return;
      if(u.searchParams.has("lang")) return;
      u.searchParams.set("lang", cur());
      a.setAttribute("href", u.toString());
    }catch(e){}
  }
  function onAnchor(e){
    var t = e.target;
    var a = (t && t.closest) ? t.closest("a[href]") : null;
    if(a) stamp(a);
  }
  /* Capture phase, so the href is correct before the browser follows it.
     auxclick covers middle click, contextmenu covers "copy link address". */
  ["click", "auxclick", "contextmenu"].forEach(function(ev){
    document.addEventListener(ev, onAnchor, true);
  });

  var b = document.getElementById("langToggle");
  if(!b) return;
  var want = mcInitLang();
  if(want === "ar" && document.documentElement.lang !== "ar") b.click();
  if(want === "en" && document.documentElement.lang === "ar") b.click();
  mcSaveLang(want);
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){
        mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en");
      }, 0);
    }
  }, true);
})();
</script>
