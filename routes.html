<script>
/* MCLANG: one language resolver shared by every Major Compass page.
   Order: ?lang= in the URL, then the visitor's saved choice, then the browser. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }
</script>

/* ============================================================
   Major Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:Newsreader, Georgia, 'Times New Roman', serif;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-ar:'IBM Plex Sans Arabic', 'IBM Plex Sans', 'Segoe UI', Tahoma, Arial, sans-serif;

  --paper:#f6f3ec;
  --paper-2:#efece4;
  --card:#fbf9f4;
  --line:#ddd7cb;
  --line-2:#cfc9bd;

  --ink:#14161a;
  --ink-2:#33363c;
  --ink-3:#6b6e74;

  --navy:#14161a;
  --navy-deep:#8a5a1e;
  --accent:#8a5a1e;
  --accent-soft:#efece4;
  --accent-line:#cfc9bd;

  --gold:#8a5a1e;
  --gold-soft:#f0ebdf;
  --gold-line:#ddd7cb;
  --gold-bright:#d8b98a;

  --good:#3f6b4f;  --good-soft:#eaefe9;  --good-line:#cfdbd0;
  --warn:#8a5a1e;  --warn-soft:#f0ebdf;  --warn-line:#e2d9c6;
  --bad:#8c3a30;   --bad-soft:#f4e9e5;   --bad-line:#e2cfc8;

  --radius:0; --radius-sm:0;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

}
.mc-nav-inner{

}

.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox,
.m, .fact, .pt, .bar, .quizbar, .cta-inline, .rule, .checked, .hedge, .extra, .flag,

/* ---------- buttons ---------- */
.btn{
  background:var(--ink); border:1px solid var(--ink); border-radius:0;
  font-weight:500; letter-spacing:0; color:var(--paper); box-shadow:none;
  transition:background .15s, border-color .15s, color .15s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff; transform:none; filter:none; box-shadow:none;}
.btn.ghost, .btn.secondary{
  background:transparent; color:var(--ink); border:1px solid var(--ink); box-shadow:none;

.btn.ghost:hover, .btn.secondary:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.printbtn{border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);}
.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

/* filter chips and pickers: square, ruled */
.fbtn, .chip, .navbtn, .picker button, .filters button{
  border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);
  box-shadow:none; transition:background .15s, color .15s, border-color .15s;
}
.fbtn:hover, .chip:hover, .navbtn:hover{border-color:var(--ink); color:var(--ink); background:transparent; transform:none;}
.fbtn.on, .chip.on, .navbtn.on{
  background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500; box-shadow:none;
}
input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);
}
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{
  background:var(--paper-2); border:1px solid var(--line); border-radius:0;

.rule, .checked, .hedge, .extra, .flag{border-radius:0;}

/* ---------- tables ---------- */
table{border-collapse:collapse;}
th{
  text-align:start; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--ink);

.subj, .tag, .chip{

/* ===== Dealbreakers: what each one really closes, and what it does not ===== */
const DB = [

{id:"medical", n:{en:"Blood, hospitals and sick people", ar:"الدم والمستشفيات والمرضى"},
 lead:{en:"This is the answer that gets the worst advice. Almost everyone who picks it is told the same three things, and two of them are wrong.",
       ar:"هذه هي الإجابة التي تتلقى أسوأ نصيحة. فمن يختارها يُقال له الشيء نفسه تقريبًا، واثنان من ثلاثة منه خطأ."},
 closes:{en:"Medicine, dentistry, nursing, and every allied health role that puts you at a bedside or over a specimen. Also veterinary medicine, which involves surgery, wounds and euthanasia as routine duties, and forensic biology, where the work is blood, semen and saliva stains alongside case photographs.",
         ar:"الطب وطب الأسنان والتمريض وكل مهنة صحية مساندة تضعك عند سرير مريض أو فوق عيّنة. وكذلك الطب البيطري، فالجراحة والجروح والقتل الرحيم واجبات يومية فيه، وعلم الأحياء الجنائي، حيث العمل بقع دم ومني ولعاب مع صور الجرائم."},
 not:{en:"It does not close health as a field. Separate two things that students always merge: patient contact and body fluids. A job can be full of one and empty of the other. A genetic counsellor never sees blood; a hospital administrator never touches a patient; a pharmacovigilance officer reads about harm and never witnesses it.",
      ar:"لكنه لا يغلق المجال الصحي. افصل بين أمرين يخلط الطلبة بينهما دائمًا: التعامل مع المرضى، والتعرض لسوائل الجسم. قد تمتلئ الوظيفة بأحدهما وتخلو من الآخر. مستشار الوراثة لا يرى دمًا أبدًا، ومدير المستشفى لا يلمس مريضًا، وموظف اليقظة الدوائية يقرأ عن الضرر ولا يشهده."},
 open:[
  {n:{en:"Public health and epidemiology", ar:"الصحة العامة وعلم الأوبئة"},
   d:{en:"Surveillance, data, policy and campaigns. Outbreak work can put you in a clinic, but you observe rather than take samples.",
      ar:"الترصد والبيانات والسياسات والحملات. قد يضعك عمل تفشي الأمراض في عيادة، لكنك تراقب ولا تأخذ عيّنات."},
   w:{en:"University of Bahrain; Imam Abdulrahman Bin Faisal University and KSAU-HS in Saudi Arabia; Abu Dhabi University; Qatar University and UDST; Kuwait University. No bachelor's found in Oman.",
      ar:"جامعة البحرين؛ جامعة الإمام عبدالرحمن بن فيصل وجامعة الملك سعود بن عبدالعزيز للعلوم الصحية في السعودية؛ جامعة أبوظبي؛ جامعة قطر وجامعة الدوحة للعلوم والتكنولوجيا؛ جامعة الكويت. لم نجد بكالوريوس في عُمان."}},
  {n:{en:"Health informatics and clinical data", ar:"المعلوماتية الصحية والبيانات السريرية"},
   d:{en:"The most genuinely desk-based route in health: electronic records, coding, data quality, clinical trial databases. Zero patients, zero fluids.",
      ar:"أكثر المسارات الصحية مكتبية بحق: السجلات الإلكترونية والترميز وجودة البيانات وقواعد بيانات التجارب السريرية. لا مرضى ولا سوائل."},
   w:{en:"KSAU-HS and Imam Abdulrahman Bin Faisal University in Saudi Arabia; Kuwait University; Higher Colleges of Technology and Liwa University in the UAE. Qatar has a master's only. No bachelor's found in Bahrain or Oman.",
      ar:"جامعة الملك سعود بن عبدالعزيز للعلوم الصحية وجامعة الإمام عبدالرحمن بن فيصل في السعودية؛ جامعة الكويت؛ كليات التقنية العليا وجامعة ليوا في الإمارات. وفي قطر ماجستير فقط. لم نجد بكالوريوس في البحرين أو عُمان."}},
  {n:{en:"Biomedical engineering", ar:"الهندسة الطبية الحيوية"},
   d:{en:"Devices, imaging systems, prosthetics. Industry and design work has no clinical exposure at all. Be aware that hospital-based clinical engineering does: equipment comes back contaminated from theatres and dialysis units.",
      ar:"الأجهزة وأنظمة التصوير والأطراف الصناعية. عمل الصناعة والتصميم لا تعرض فيه إطلاقًا. لكن انتبه: هندسة الأجهزة داخل المستشفى فيها تعرض، فالأجهزة تعود ملوثة من غرف العمليات وأقسام الغسيل الكلوي."},
   w:{en:"Khalifa University and Abu Dhabi University in the UAE; King Saud University; Australian University Kuwait. Not offered at bachelor's level in Bahrain, Qatar or Oman.",
      ar:"جامعة خليفة وجامعة أبوظبي في الإمارات؛ جامعة الملك سعود؛ الجامعة الأسترالية في الكويت. غير متاحة في مرحلة البكالوريوس في البحرين أو قطر أو عُمان."}},
  {n:{en:"Audiology", ar:"السمعيات"},
   d:{en:"Probably the single best fit if you still want patients but not blood. Hearing tests, hearing aids, balance testing, newborn screening. The one exposure is earwax management, which can occasionally cause minor bleeding in the ear canal.",
      ar:"ربما الأنسب على الإطلاق إن كنت تريد التعامل مع المرضى دون دم. فحوص السمع والسماعات واختبارات التوازن وفحص حديثي الولادة. التعرض الوحيد هو إزالة الصملاخ، وقد تسبب أحيانًا نزيفًا بسيطًا في قناة الأذن."},
   w:{en:"University of Sharjah and Gulf Medical University in the UAE; Kuwait University; King Abdulaziz University and Dar Al Uloom in Saudi Arabia. Usually bundled with speech pathology in one degree. None found in Bahrain, Qatar or Oman. Note that Dubai licenses an audiologist only at master's level; a bachelor's licenses you as an assistant.",
      ar:"جامعة الشارقة وجامعة الخليج الطبية في الإمارات؛ جامعة الكويت؛ جامعة الملك عبدالعزيز وجامعة دار العلوم في السعودية. وغالبًا تُدمج مع أمراض النطق في شهادة واحدة. لم نجدها في البحرين أو قطر أو عُمان. ولاحظ أن دبي ترخّص أخصائي السمعيات في مستوى الماجستير فقط، والبكالوريوس يرخّصك مساعدًا."}},
  {n:{en:"Optometry", ar:"البصريات"},
   d:{en:"Refraction, eye health screening, contact lenses, detecting glaucoma and diabetic damage. You get close to faces and handle tears and drops. No systemic body fluids.",
      ar:"قياس النظر وفحص صحة العين والعدسات اللاصقة واكتشاف المياه الزرقاء وأضرار السكري. تقترب من الوجوه وتتعامل مع الدموع والقطرات، دون سوائل جسم أخرى."},
   w:{en:"King Saud University and Qassim University in Saudi Arabia, both as a Doctor of Optometry entered from school; Gulf Medical University in the UAE; University of Buraimi in Oman. None found in Bahrain, Qatar or Kuwait.",
      ar:"جامعة الملك سعود وجامعة القصيم في السعودية، وكلتاهما دكتور بصريات يُدخل إليه من الثانوية؛ جامعة الخليج الطبية في الإمارات؛ جامعة البريمي في عُمان. لم نجدها في البحرين أو قطر أو الكويت."}},
  {n:{en:"Pharmacy, but the industry side", ar:"الصيدلة، لكن في جانب الصناعة"},
   d:{en:"Regulatory affairs, pharmacovigilance and pharmaceutical industry work involve no patients at all. The honest catch: the degree itself includes compulsory hospital and community placements, so you cannot skip the clinical years to reach the desk.",
      ar:"الشؤون التنظيمية واليقظة الدوائية والعمل في صناعة الدواء لا مرضى فيها إطلاقًا. لكن الصدق يقتضي القول إن الشهادة نفسها تتضمن تدريبًا إلزاميًا في المستشفى والصيدلية، فلا يمكنك تخطي السنوات السريرية للوصول إلى المكتب."},
   w:{en:"Widely available across the Gulf. See the pharmacy entry in the majors guide.",
      ar:"متاحة على نطاق واسع في الخليج. انظر مدخل الصيدلة في دليل التخصصات."},
   href:"explore.html#pharm"},
  {n:{en:"Nutrition, on the food science side", ar:"التغذية، في جانب علوم الأغذية"},
   d:{en:"Food science, public health nutrition and sports nutrition are clean. Clinical dietetics is not: a hospital dietitian works at bedsides in intensive care, oncology and renal wards, with feeding tubes and dying patients.",
      ar:"علوم الأغذية والتغذية المجتمعية وتغذية الرياضيين نظيفة. أما التغذية السريرية فلا: أخصائي التغذية في المستشفى يعمل عند الأسرّة في العناية المركزة والأورام والكلى، مع أنابيب التغذية والمرضى المحتضرين."},
   w:{en:"Ahlia University in Bahrain; UAE University and Abu Dhabi University; Qatar University; Sultan Qaboos University and A'Sharqiyah University in Oman; Kuwait University; several Saudi universities.",
      ar:"جامعة أهلية في البحرين؛ جامعة الإمارات وجامعة أبوظبي؛ جامعة قطر؛ جامعة السلطان قابوس وجامعة الشرقية في عُمان؛ جامعة الكويت؛ وعدة جامعات سعودية."}},
  {n:{en:"Health administration and health economics", ar:"إدارة الصحة واقتصاديات الصحة"},
   d:{en:"Budgets, procurement, quality, accreditation, operations. You walk clinical corridors and do no clinical work.",
      ar:"الميزانيات والمشتريات والجودة والاعتماد والتشغيل. تمشي في ممرات المستشفى دون أن تؤدي أي عمل سريري."},
   w:{en:"Kuwait University; University of Sharjah, Hamdan Bin Mohammed Smart University and American University in the Emirates; King Abdulaziz University in Saudi Arabia. In Bahrain, Qatar and Oman this is usually a master's rather than a bachelor's.",
      ar:"جامعة الكويت؛ جامعة الشارقة وجامعة حمدان بن محمد الذكية والجامعة الأمريكية في الإمارات؛ جامعة الملك عبدالعزيز في السعودية. وفي البحرين وقطر وعُمان تكون غالبًا ماجستيرًا لا بكالوريوس."}},
  {n:{en:"Biotechnology and pharmaceutical science", ar:"التقنية الحيوية وعلوم الصيدلة"},
   d:{en:"Molecular biology, formulation, bioinformatics. No patients. If you want zero exposure of any kind, choose bioinformatics or analytical chemistry rather than a lab that handles animal tissue.",
      ar:"البيولوجيا الجزيئية وتركيب الأدوية والمعلوماتية الحيوية. لا مرضى. وإن أردت انعدام التعرض تمامًا فاختر المعلوماتية الحيوية أو الكيمياء التحليلية بدل مختبر يتعامل مع أنسجة حيوانية."},
   w:{en:"University of Sharjah and American University of Ras Al Khaimah; Taif University and King Abdulaziz University in Saudi Arabia. Elsewhere the route is a biology or biochemistry degree followed by a specialist master's.",
      ar:"جامعة الشارقة والجامعة الأمريكية في رأس الخيمة؛ جامعة الطائف وجامعة الملك عبدالعزيز في السعودية. وفي غيرها يكون المسار شهادة أحياء أو كيمياء حيوية ثم ماجستير تخصصي."}},
  {n:{en:"Medical physics", ar:"الفيزياء الطبية"},
   d:{en:"Radiation dosimetry, machine quality assurance, radiation protection. Essentially no blood, although radiotherapy work means being around cancer patients.",
      ar:"قياس الجرعات الإشعاعية وضمان جودة الأجهزة والوقاية من الإشعاع. لا دم تقريبًا، وإن كان العمل في العلاج الإشعاعي يعني وجودك بين مرضى السرطان."},
   w:{en:"King Khalid University in Saudi Arabia is the only bachelor's we could verify in the Gulf. Everywhere else the route is a physics degree then a master's, including Khalifa University in the UAE. Note that the profession is licensed at master's level, not bachelor's.",
      ar:"جامعة الملك خالد في السعودية هي البكالوريوس الوحيد الذي تحققنا منه في الخليج. وفي غيرها المسار شهادة فيزياء ثم ماجستير، ومنها جامعة خليفة في الإمارات. ولاحظ أن المهنة تُرخّص في مستوى الماجستير لا البكالوريوس."}}
 ],
 traps:[
  {n:{en:"Medical laboratory science, sometimes called biomedical science", ar:"العلوم الطبية المخبرية، وتسمى أحيانًا العلوم الطبية الحيوية"},
   d:{en:"The friendliest-sounding name on the list, and the worst fit. You spend your working life with blood, urine, sputum, spinal fluid and tissue. Qatar University's and Sultan Qaboos University's biomedical science degrees both include a compulsory laboratory internship.",
      ar:"أجمل الأسماء وقعًا في القائمة وأسوأها ملاءمة. تقضي حياتك المهنية مع الدم والبول والبلغم والسائل الشوكي والأنسجة. وشهادتا العلوم الطبية الحيوية في جامعة قطر وجامعة السلطان قابوس تتضمنان تدريبًا مخبريًا إلزاميًا."}},
  {n:{en:"Respiratory therapy", ar:"العلاج التنفسي"},
   d:{en:"Marketed as machines and breathing. In practice: arterial blood gas punctures, airway suctioning, sputum and intensive care.",
      ar:"يُسوَّق على أنه أجهزة وتنفس. وفي الواقع: وخز الشرايين لغازات الدم، وشفط الإفرازات، والبلغم، والعناية المركزة."}},
  {n:{en:"Anaesthesia technology", ar:"تقنية التخدير"},
   d:{en:"Sounds technical. It is operating theatre work with cannulation, airways, blood loss and unconscious patients.",
      ar:"يبدو تقنيًا. لكنه عمل في غرفة العمليات مع تركيب القسطرات ومجاري الهواء وفقدان الدم ومرضى فاقدي الوعي."}},
  {n:{en:"Dental hygiene", ar:"صحة الأسنان"},
   d:{en:"Pitched as the clean dental option. Scaling inflamed gums bleeds routinely, plus saliva and aerosol.",
      ar:"يُقدَّم على أنه الخيار النظيف في طب الأسنان. لكن تنظيف اللثة الملتهبة ينزف عادةً، إضافة إلى اللعاب والرذاذ."}},
  {n:{en:"Radiography, partly", ar:"الأشعة، جزئيًا"},
   d:{en:"Plain imaging in an outpatient clinic is low-blood. The same qualification puts you in accident and emergency with trauma, in theatre with a mobile machine, and in CT where radiographers routinely insert cannulas and inject contrast. Interventional radiography involves arterial punctures. Do not choose radiography because someone told you it is blood-free.",
      ar:"التصوير البسيط في العيادات الخارجية قليل الدم. لكن الشهادة نفسها تضعك في الطوارئ مع الإصابات، وفي غرفة العمليات مع جهاز متنقل، وفي الأشعة المقطعية حيث يركّب فنيو الأشعة القسطرات ويحقنون الصبغة. أما الأشعة التداخلية ففيها وخز شرياني. لا تختر الأشعة لأن أحدهم قال لك إنها خالية من الدم."}},
  {n:{en:"Speech and language therapy", ar:"علاج النطق واللغة"},
   d:{en:"Blood is rare, secretions are not. Half the profession is swallowing disorders: you sit close to patients while they eat and deal with saliva, coughing, choking and tracheostomies. School-based and clinic work is much cleaner.",
      ar:"الدم نادر، أما الإفرازات فلا. نصف المهنة اضطرابات البلع: تجلس قريبًا من المريض وهو يأكل وتتعامل مع اللعاب والسعال والاختناق وفتحات القصبة الهوائية. أما العمل في المدارس والعيادات فأنظف بكثير."}},
  {n:{en:"Paramedicine, nursing and clinical dietetics", ar:"الإسعاف والتمريض والتغذية السريرية"},
   d:{en:"Obvious once said, but all three are still recommended to squeamish students because they are available everywhere. All three involve wounds, fluids and death.",
      ar:"واضح بمجرد قوله، لكن الثلاثة ما زالت تُقترح على الطلبة الحساسين لأنها متاحة في كل مكان. وثلاثتها فيها جروح وسوائل وموت."}}
 ,
 {n:{en:"Occupational therapy", ar:"العلاج الوظيفي"},
  d:{en:"Sold as the gentle rehabilitation option. It is gentle in temperament, not in contact: you handle patients physically for most of the working day, including after strokes and amputations.",
     ar:"يُسوَّق على أنه خيار إعادة التأهيل اللطيف. وهو لطيف في الطبع لا في التلامس: تتعامل جسديًا مع المرضى معظم ساعات العمل، بمن فيهم بعد الجلطات وبتر الأطراف."}},
 {n:{en:"Veterinary medicine", ar:"الطب البيطري"},
  d:{en:"Chosen by students who love animals and want to avoid human bodies. It is surgery, birthing, wounds and euthanasia, on patients who cannot be told to hold still.",
     ar:"يختاره من يحب الحيوانات ويريد تجنب الأجساد البشرية. وهو جراحة وتوليد وجروح وإنهاء رحيم للحياة، على مرضى لا يمكن إخبارهم بالثبات."}}]},

{id:"math", n:{en:"Lots of advanced mathematics", ar:"الكثير من الرياضيات المتقدمة"},
 lead:{en:"Be precise about what you are avoiding. Arithmetic, statistics and advanced mathematics are three different things, and students who say they hate maths usually mean one of them.",
       ar:"كن دقيقًا فيما تتجنبه. الحساب والإحصاء والرياضيات المتقدمة ثلاثة أشياء مختلفة، ومن يقول إنه يكره الرياضيات يقصد عادةً واحدًا منها فقط."},
 closes:{en:"All branches of engineering, physics, actuarial science, data science and artificial intelligence, and the theoretical half of computer science. Architecture also carries real structural mathematics. These are not negotiable: the mathematics is the subject, not a hurdle placed in front of it.",
         ar:"كل فروع الهندسة، والفيزياء، والعلوم الاكتوارية، وعلوم البيانات والذكاء الاصطناعي، والنصف النظري من علوم الحاسوب. وفي العمارة رياضيات إنشائية حقيقية أيضًا. وهذه غير قابلة للتفاوض: الرياضيات هي المادة نفسها لا عقبة موضوعة أمامها."},
 not:{en:"It does not close science, health or technology. It does not close accounting either, and this is the most common mistake: accounting is arithmetic and rules, not calculus. What you should expect almost everywhere now is one compulsory statistics course. Psychology, nursing, education and business all have one. A statistics course is not advanced mathematics.",
      ar:"لكنه لا يغلق العلوم ولا الصحة ولا التقنية. ولا يغلق المحاسبة، وهذا أشيع خطأ: المحاسبة حساب وقواعد لا تفاضل وتكامل. وما ينبغي أن تتوقعه في كل مكان تقريبًا اليوم هو مقرر إحصاء إجباري واحد. علم النفس والتمريض والتربية وإدارة الأعمال فيها جميعًا واحد. ومقرر الإحصاء ليس رياضيات متقدمة."},
 open:[
  {n:{en:"Health and life sciences", ar:"العلوم الصحية والحياتية"},
   d:{en:"Nursing, physiotherapy, radiography, speech therapy, nutrition, biology and biotechnology are memory, pattern and practice subjects. Nursing has drug calculations, which are arithmetic done carefully, not mathematics.",
      ar:"التمريض والعلاج الطبيعي والأشعة وعلاج النطق والتغذية والأحياء والتقنية الحيوية مواد ذاكرة وأنماط وممارسة. وفي التمريض حسابات جرعات، وهي حساب يُؤدى بعناية لا رياضيات."},
   w:{en:"Available in every Gulf country in some form. See the majors guide for who offers what.",
      ar:"متاحة بشكل ما في كل دول الخليج. انظر دليل التخصصات لمعرفة من يقدم ماذا."},
   href:"explore.html"},
  {n:{en:"Cybersecurity, on the governance side", ar:"الأمن السيبراني، في جانب الحوكمة"},
   d:{en:"Cryptography is mathematics. Security operations, governance, risk and compliance, incident response and digital forensics are procedure, judgement and attention to detail. The certifications route in particular is almost maths-free.",
      ar:"التشفير رياضيات. أما عمليات الأمن والحوكمة والمخاطر والامتثال والاستجابة للحوادث والأدلة الرقمية فإجراءات وحكم ودقة ملاحظة. ومسار الشهادات المهنية تحديدًا يكاد يخلو من الرياضيات."},
   href:"explore.html#cyber"},
  {n:{en:"Law", ar:"القانون"},
   d:{en:"The most maths-free protected profession there is, and it is licensed in all six Gulf states. It is also reading-heavy in a way students underestimate.",
      ar:"أكثر المهن المحمية خلوًا من الرياضيات، وهي مرخصة في دول الخليج الست. لكنها كثيرة القراءة بقدر يستهين به الطلبة."},
   href:"explore.html#law"},
  {n:{en:"Education and teaching", ar:"التربية والتعليم"},
   d:{en:"Licensed in all six states, growing in absolute demand worldwide, and outside primary maths teaching it asks almost nothing mathematical of you.",
      ar:"مرخصة في الدول الست، ويزداد الطلب عليها عالميًا بالأعداد المطلقة، وخارج تدريس الرياضيات الابتدائية لا تطلب منك شيئًا رياضيًا تقريبًا."},
   href:"explore.html#edu"},
  {n:{en:"Design, media and languages", ar:"التصميم والإعلام واللغات"},
   d:{en:"No mathematics beyond a statistics course. Read the AI page before committing to these, because they are the most exposed fields on the site.",
      ar:"لا رياضيات فيها سوى مقرر إحصاء. لكن اقرأ صفحة الذكاء الاصطناعي قبل أن تلتزم بها، فهي أكثر المجالات تعرضًا في هذا الموقع."},
   href:"ai.html"},
  {n:{en:"Tourism, hospitality and logistics operations", ar:"السياحة والضيافة وعمليات اللوجستيات"},
   d:{en:"Operational rather than analytical. Gulf governments are expanding both sectors deliberately. The analytical end of supply chain does use mathematics; the operations end does not.",
      ar:"تشغيلية لا تحليلية. وحكومات الخليج توسّع القطاعين عن قصد. أما الطرف التحليلي في سلاسل الإمداد فيستخدم الرياضيات، والطرف التشغيلي لا."},
   href:"explore.html#tour"}
 ],
 traps:[
  {n:{en:"Psychology", ar:"علم النفس"},
   d:{en:"Chosen by maths-averse students constantly, and it contains more statistics than most business degrees. Research methods and statistics are usually compulsory across several semesters.",
      ar:"يختاره الطلبة النافرون من الرياضيات باستمرار، وفيه إحصاء أكثر مما في معظم شهادات الأعمال. ومناهج البحث والإحصاء إجبارية عادةً على عدة فصول."}},
  {n:{en:"Economics and finance", ar:"الاقتصاد والتمويل"},
   d:{en:"Often confused with accounting. Economics is mathematical, and quantitative finance is very mathematical. Banking operations are not.",
      ar:"يُخلط بينهما وبين المحاسبة كثيرًا. الاقتصاد رياضي، والتمويل الكمي شديد الرياضية. أما العمليات المصرفية فلا."}},
  {n:{en:"Architecture", ar:"العمارة"},
   d:{en:"Chosen as the artistic option. Structures, environmental analysis and quantities are real mathematics, and the degree is one of the longest and heaviest in workload.",
      ar:"تُختار على أنها الخيار الفني. لكن الإنشاءات والتحليل البيئي والكميات رياضيات حقيقية، والشهادة من أطول الشهادات وأثقلها عبئًا."}},
  {n:{en:"Computer science, in general", ar:"علوم الحاسوب، عمومًا"},
   d:{en:"Programming is not mathematics, but the degree is. Discrete mathematics, algorithms, linear algebra and probability are all compulsory in a proper computer science programme. If you want the work without the degree mathematics, read the page on routes that are not a four-year degree.",
      ar:"البرمجة ليست رياضيات، لكن الشهادة كذلك. الرياضيات المتقطعة والخوارزميات والجبر الخطي والاحتمالات كلها إجبارية في برنامج علوم حاسوب حقيقي. وإن أردت العمل دون رياضيات الشهادة، فاقرأ صفحة الطرق غير الجامعية."}}
 ]},

{id:"speaking", n:{en:"Speaking in front of people all the time", ar:"التحدث أمام الناس طوال الوقت"},
 lead:{en:"One honest warning first. Fear of speaking at seventeen is a poor reason to close a whole field, because it is the dealbreaker that most reliably disappears with practice. Treat this as a preference about how you want to spend your days, not as a permanent limit.",
       ar:"تحذير صادق أولًا. الخوف من الحديث في السابعة عشرة سبب ضعيف لإغلاق مجال كامل، لأنه أكثر المنفّرات زوالًا مع الممارسة. تعامل معه على أنه تفضيل في كيفية قضاء يومك لا حدًّا دائمًا."},
 closes:{en:"Teaching, courtroom advocacy, media presenting, sales, front-of-house hospitality, and most of management. Medicine and dentistry too, since consultation is the job. Marketing and public relations are constant persuasion.",
         ar:"التدريس والمرافعة أمام المحاكم وتقديم البرامج والمبيعات والعمل الأمامي في الضيافة ومعظم الإدارة. والطب وطب الأسنان أيضًا، فالاستشارة هي الوظيفة. والتسويق والعلاقات العامة إقناع متواصل."},
 not:{en:"It does not close any field entirely, because every field has a back office. What you can avoid is performing to a room. What you cannot avoid anywhere is a meeting, a phone call and explaining your work to a colleague. Anyone who tells you a career requires no talking at all is selling you something.",
      ar:"لكنه لا يغلق أي مجال كليًا، لأن لكل مجال مكتبًا خلفيًا. ما يمكنك تجنبه هو الأداء أمام قاعة. أما ما لا يمكنك تجنبه في أي مكان فهو الاجتماع والمكالمة وشرح عملك لزميل. ومن يخبرك بمهنة بلا كلام إطلاقًا فهو يبيعك شيئًا."},
 open:[
  {n:{en:"Laboratory and technical work", ar:"العمل المخبري والتقني"},
   d:{en:"Laboratory science, biotechnology, radiography, pharmacy dispensing, quality control. Short exchanges, no audiences.",
      ar:"العلوم المخبرية والتقنية الحيوية والأشعة وصرف الأدوية وضبط الجودة. تبادلات قصيرة بلا جمهور."}},
  {n:{en:"Software, data and infrastructure", ar:"البرمجيات والبيانات والبنية التحتية"},
   d:{en:"Long stretches of solitary work are normal. Be aware that senior technical roles become progressively more about persuading people, which is a good thing to know at eighteen rather than at thirty.",
      ar:"فترات طويلة من العمل المنفرد أمر طبيعي. لكن انتبه إلى أن الوظائف التقنية العليا تتحول تدريجيًا إلى إقناع الناس، ومن الأفضل أن تعرف ذلك في الثامنة عشرة لا في الثلاثين."}},
  {n:{en:"Audit, accounting and actuarial work", ar:"التدقيق والمحاسبة والعمل الاكتواري"},
   d:{en:"Client meetings exist, but the work itself is documents and numbers. Licensed, and among the more protected office routes in the Gulf.",
      ar:"توجد اجتماعات مع العملاء، لكن العمل نفسه وثائق وأرقام. وهي مرخصة ومن أكثر المسارات المكتبية حماية في الخليج."}},
  {n:{en:"Engineering design and drafting", ar:"التصميم والرسم الهندسي"},
   d:{en:"The design office is quieter than the site. Site supervision and client work are not.",
      ar:"مكتب التصميم أهدأ من الموقع. أما الإشراف الميداني والعمل مع العملاء فلا."}},
  {n:{en:"Writing, editing and archives", ar:"الكتابة والتحرير والأرشفة"},
   d:{en:"Genuinely quiet. Read the AI page first, because written production is the most substituted category of work in the economy.",
      ar:"هادئة. لكن اقرأ صفحة الذكاء الاصطناعي أولًا، فإنتاج الكلمة المكتوبة أكثر فئات العمل استبدالًا في الاقتصاد."},
   href:"ai.html"}
 ],
 traps:[
  {n:{en:"Teaching", ar:"التدريس"},
   d:{en:"Sometimes recommended as a safe, structured job. It is thirty people looking at you, five times a day, every day.",
      ar:"يُقترح أحيانًا على أنه وظيفة آمنة منظمة. لكنه ثلاثون شخصًا ينظرون إليك خمس مرات يوميًا كل يوم."}},
  {n:{en:"Pharmacy in the community", ar:"الصيدلة في المجتمع"},
   d:{en:"Chosen as the quiet health option. A community pharmacist counsels every customer who walks in, all day.",
      ar:"تُختار على أنها الخيار الصحي الهادئ. لكن صيدلي المجتمع ينصح كل زبون يدخل، طوال اليوم."}},
  {n:{en:"Law", ar:"القانون"},
   d:{en:"Corporate and contract law is desk work. Litigation is performance. The degree does not tell you which one you will end up in.",
      ar:"قانون الشركات والعقود عمل مكتبي. أما التقاضي فأداء. والشهادة لا تخبرك في أيهما ستنتهي."}}
 ]},

{id:"routine", n:{en:"Sitting at a desk doing routine tasks", ar:"الجلوس المكتبي والمهام الروتينية"},
 lead:{en:"This is the dealbreaker that has changed most in the last three years, and it now points in a useful direction. The routine desk work you want to avoid is exactly the work that is being automated fastest.",
       ar:"هذا هو المنفّر الأكثر تغيرًا في السنوات الثلاث الأخيرة، وهو يشير الآن إلى اتجاه مفيد. فالعمل المكتبي الروتيني الذي تريد تجنبه هو بالضبط العمل الذي يُؤتمت أسرع من غيره."},
 closes:{en:"Bookkeeping, transaction processing, banking operations, insurance administration, procurement clerking and general administration. Note that these are also the occupations on the fastest declining lists, so avoiding them is not only a preference.",
         ar:"مسك الدفاتر ومعالجة القيود والعمليات المصرفية وإدارة التأمين وكتابة المشتريات والأعمال الإدارية العامة. ولاحظ أن هذه أيضًا على قوائم أسرع المهن انحسارًا، فتجنبها ليس مجرد تفضيل."},
 not:{en:"It does not close business or finance. It closes the bottom rung of them. Every job on earth has administration in it; what varies is the ratio and whether the admin is the point or the residue.",
      ar:"لكنه لا يغلق الأعمال ولا التمويل. إنما يغلق الدرجة الأولى منهما. كل وظيفة على الأرض فيها أعمال إدارية؛ وما يختلف هو النسبة، وهل الإدارة هي الغاية أم الفضلة."},
 open:[
  {n:{en:"Clinical and allied health work", ar:"العمل السريري والصحي المساند"},
   d:{en:"Nursing, physiotherapy, radiography, emergency medicine. No two days are the same and almost none of it happens at a desk.",
      ar:"التمريض والعلاج الطبيعي والأشعة وطب الطوارئ. لا يتشابه يومان، ولا يحدث شيء منها تقريبًا خلف مكتب."}},
  {n:{en:"Site and field engineering", ar:"الهندسة الميدانية وفي المواقع"},
   d:{en:"Civil, mechanical, electrical and renewable energy work in commissioning, supervision and maintenance. The Gulf is still building, and this work cannot be done remotely.",
      ar:"العمل المدني والميكانيكي والكهربائي والطاقة المتجددة في التشغيل والإشراف والصيانة. الخليج ما زال يبني، وهذا العمل لا يمكن أداؤه عن بُعد."}},
  {n:{en:"Teaching", ar:"التدريس"},
   d:{en:"Repetitive in structure, never repetitive in content, because the people change every hour.",
      ar:"متكرر في بنيته، غير متكرر أبدًا في مضمونه، لأن الأشخاص يتغيرون كل ساعة."}},
  {n:{en:"Aviation, ports and operations", ar:"الطيران والموانئ والعمليات"},
   d:{en:"Air traffic control, airport and airline operations, terminal and port operations. Shift-based, event-driven, and expanding across the Gulf.",
      ar:"المراقبة الجوية وعمليات المطارات وشركات الطيران وعمليات المحطات والموانئ. عمل بالورديات تقوده الأحداث، ويتوسع في الخليج."}},
  {n:{en:"Tourism and hospitality operations", ar:"عمليات السياحة والضيافة"},
   d:{en:"One of the fastest growing sectors in the region. Aim at operations and management rather than the information desk, which is the exposed part.",
      ar:"من أسرع القطاعات نموًا في المنطقة. اتجه إلى التشغيل والإدارة لا إلى مكتب الاستعلامات، فهو الجزء المعرّض."}}
 ],
 traps:[
  {n:{en:"Business management", ar:"إدارة الأعمال"},
   d:{en:"Chosen precisely by students who want variety, and the entry-level job it leads to is coordination, reporting and administration. The variety arrives later, if it arrives.",
      ar:"يختارها الطلبة الذين يريدون التنوع تحديدًا، والوظيفة المبتدئة التي تقود إليها تنسيق وتقارير وأعمال إدارية. أما التنوع فيأتي لاحقًا، إن أتى."}},
  {n:{en:"Marketing", ar:"التسويق"},
   d:{en:"Sold as creative. The junior job is scheduling posts, building reports and producing content to a brief.",
      ar:"يُباع على أنه إبداعي. والوظيفة المبتدئة جدولة منشورات وبناء تقارير وإنتاج محتوى وفق موجز."}},
  {n:{en:"Any role whose title contains coordinator, officer or administrator", ar:"أي وظيفة يحمل مسماها كلمة منسق أو موظف أو إداري"},
   d:{en:"Worth saying plainly, because these are the titles most Gulf graduates are hired into.",
      ar:"يستحق أن يُقال، فهذه هي المسميات التي يُوظَّف فيها أكثر خريجي الخليج."}}
 ]},

{id:"physical", n:{en:"Physical or outdoor work", ar:"العمل البدني أو الميداني"},
 lead:{en:"In the Gulf this is a more serious constraint than it is anywhere else, and you are right to take it seriously. All six states legally ban outdoor work in the middle of the day through the summer, which tells you how hard the conditions are.",
       ar:"في الخليج هذا قيد أخطر منه في أي مكان آخر، وأنت محق في أخذه بجدية. فالدول الست جميعًا تحظر قانونًا العمل في الهواء الطلق في منتصف النهار طوال الصيف، وهذا يخبرك بقسوة الظروف."},
 closes:{en:"Site-based civil and mechanical engineering, plant and process operations, renewable energy field work, aircraft maintenance, and the skilled trades. Also, less obviously, nursing and physiotherapy, which are twelve-hour shifts on your feet, and dentistry, which is a posture problem for a career.",
         ar:"الهندسة المدنية والميكانيكية في المواقع، وتشغيل المصانع والعمليات، والعمل الميداني في الطاقة المتجددة، وصيانة الطائرات، والحرف الماهرة. وأقل وضوحًا: التمريض والعلاج الطبيعي، فهما ورديات من اثنتي عشرة ساعة وأنت واقف، وطب الأسنان، فهو مشكلة وضعية جسم على امتداد مهنة."},
 not:{en:"It does not close engineering. Design, analysis, planning, safety case work, procurement and project management are office roles inside engineering, and they are licensed in the same way as the site roles. It also does not close any of computing, finance, law, media or health administration.",
      ar:"لكنه لا يغلق الهندسة. فالتصميم والتحليل والتخطيط وملفات السلامة والمشتريات وإدارة المشاريع وظائف مكتبية داخل الهندسة، وهي مرخصة كما تُرخّص الوظائف الميدانية. ولا يغلق شيئًا من الحوسبة أو التمويل أو القانون أو الإعلام أو إدارة الصحة."},
 open:[
  {n:{en:"Engineering, from the design office", ar:"الهندسة، من مكتب التصميم"},
   d:{en:"You still get the licence, which four Gulf states now tie to your work permit, and you still get the protection. You simply spend your day at a workstation rather than on a site.",
      ar:"تحصل على الترخيص نفسه، الذي تربطه أربع دول خليجية الآن بتصريح عملك، وتحصل على الحماية نفسها. لكنك تقضي يومك أمام محطة عمل لا في موقع."}},
  {n:{en:"Computing, data and cybersecurity", ar:"الحوسبة والبيانات والأمن السيبراني"},
   d:{en:"Entirely indoor and entirely seated. Read the AI page for the entry-level picture before choosing.",
      ar:"داخلية بالكامل وجالسة بالكامل. اقرأ صفحة الذكاء الاصطناعي لصورة الدرجة الأولى قبل أن تختار."},
   href:"ai.html"},
  {n:{en:"Law, accounting and finance", ar:"القانون والمحاسبة والتمويل"},
   d:{en:"Office professions, licensed, and protected in the Gulf by both licensing and nationality rules in the case of law.",
      ar:"مهن مكتبية مرخصة، ومحمية في الخليج بالترخيص وبقواعد الجنسية أيضًا في حالة القانون."}},
  {n:{en:"Health, without the ward", ar:"الصحة، دون الأقسام"},
   d:{en:"Health informatics, public health, health administration, pharmacy in industry, medical physics. All of the field, none of the standing.",
      ar:"المعلوماتية الصحية والصحة العامة وإدارة الصحة والصيدلة في الصناعة والفيزياء الطبية. المجال كله دون وقوف."}}
 ],
 traps:[
  {n:{en:"Architecture", ar:"العمارة"},
   d:{en:"Chosen as a studio profession. Site visits, surveys and construction supervision are part of the job, and the studio years themselves are famous for their hours.",
      ar:"تُختار على أنها مهنة استوديو. لكن زيارات الموقع والمسوحات والإشراف على التنفيذ جزء من العمل، وسنوات الاستوديو نفسها مشهورة بساعاتها."}},
  {n:{en:"Tourism and hospitality management", ar:"إدارة السياحة والضيافة"},
   d:{en:"The word management is doing a lot of work in that title. Hotel and event operations means being on your feet through long shifts, often at night.",
      ar:"كلمة إدارة تحمل عبئًا كبيرًا في هذا المسمى. فعمليات الفنادق والفعاليات تعني الوقوف طوال ورديات طويلة، وكثيرًا في الليل."}},
  {n:{en:"Physiotherapy", ar:"العلاج الطبيعي"},
   d:{en:"Recommended to students who like sport. It is manual work: you are lifting, resisting and supporting other people's bodies all day.",
      ar:"يُقترح على من يحب الرياضة. لكنه عمل يدوي: ترفع وتقاوم وتسند أجساد الآخرين طوال اليوم."}}
 ]}

];

function L(){ return T[LANG]; }
function tx(o){ return o ? o[LANG] : ""; }

function renderChrome(){
  var t = L();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("lede").textContent = t.lede;

  document.getElementById("t-noteT").textContent = t.noteT;
  document.getElementById("t-noteS").textContent = t.noteS;
  document.getElementById("notes").innerHTML = t.notes.map(function(k){
    return '<div class="pt"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  document.getElementById("t-pick").textContent = t.pick;
  document.getElementById("chips").innerHTML = DB.map(function(d){
    return '<button class="chip'+(SEL===d.id?' on':'')+'" data-d="'+d.id+'">'+tx(d.n)+'</button>'; }).join("");

  document.getElementById("t-quizline").textContent = t.quizline;
  document.getElementById("t-quizbtn").textContent = t.quizbtn;
  document.getElementById("t-expline").textContent = t.expline;
  document.getElementById("t-expbtn").textContent = t.expbtn;
  document.getElementById("t-altline").textContent = t.altline;
  document.getElementById("t-altbtn").textContent = t.altbtn;

  document.getElementById("srcT").textContent = t.srcT;
  document.getElementById("srcS").textContent = t.srcS;
  document.getElementById("srcList").innerHTML = T.en.src.map(function(s){
    return '<li>'+s[0]+(s[1] ? ' <a href="'+s[1]+'" target="_blank" rel="noopener">'+s[1]+'</a>' : '')+'</li>'; }).join("");

  document.getElementById("t-disc").textContent = t.disc;
  document.getElementById("t-foot").textContent = t.foot;
}

function renderPanel(){
  var t = L();
  var d = DB.filter(function(x){ return x.id === SEL; })[0];
  var h = '';
  h += '<div class="lead-note">'+tx(d.lead)+'</div>';
  h += '<div class="blk"><h3>'+t.h1+'</h3><p>'+tx(d.closes)+'</p></div>';
  h += '<div class="blk open"><h3>'+t.h2+'</h3><p>'+tx(d.not)+'</p></div>';

  h += '<h3 class="sech">'+t.h3+'</h3>';
  h += d.open.map(function(o){
    var w = o.w ? '<div class="wh"><span class="wl">'+t.where+'</span>'+tx(o.w)+'</div>' : '';
    var a = o.href ? '<a class="olink" href="'+o.href+'">'+t.more+'</a>' : '';
    return '<div class="rt"><b>'+tx(o.n)+'</b><p>'+tx(o.d)+'</p>'+w+a+'</div>';
  }).join("");

  h += '<h3 class="sech warn">'+t.h4+'</h3>';
  h += d.traps.map(function(o){
    return '<div class="rt trap"><b>'+tx(o.n)+'</b><p>'+tx(o.d)+'</p></div>';
  }).join("");

  document.getElementById("panel").innerHTML = h;
}

function renderAll(){ renderChrome(); renderPanel(); }

document.addEventListener("click", function(e){
  var c = e.target.closest ? e.target.closest(".chip") : null;
  if(c && c.hasAttribute("data-d")){
    SEL = c.getAttribute("data-d");
    renderAll();
    if(window.goatcounter && window.goatcounter.count){
      try{ window.goatcounter.count({path:"rt-"+SEL, title:"Dealbreaker "+SEL, event:true}); }catch(err){}
    }
  }
});

document.getElementById("langToggle").addEventListener("click", function(){
  LANG = (LANG === "en") ? "ar" : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === "ar") ? "rtl" : "ltr";
  this.textContent = (LANG === "ar") ? "English" : "عربي";
  renderAll();
});

renderAll();
if(MCFROM){ try{ document.getElementById("t-pick").scrollIntoView({block:"start"}); }catch(e){} }

</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
/* MCLANG boot: applies the resolved language by driving the page's own toggle,
   then remembers whatever the visitor lands on. */
(function(){
  var b = document.getElementById("langToggle");
  if(!b) return;
  if(mcInitLang() === "ar" && document.documentElement.lang !== "ar") b.click();
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){
        mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en");
      }, 0);
    }
  }, true);
})();
</script>
