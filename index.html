<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major Compass: Find Your University Major | Dr. Saqer AlKhalifa</title>
<meta name="description" content="A free bilingual (English/Arabic) assessment that helps high-school students in Bahrain and the Gulf discover the top 5 university majors that fit their interests, strengths, and values.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101418;
    --ink-2:#4a5158;
    --ink-3:#8a9199;
    --paper:#faf9f6;
    --card:#ffffff;
    --line:#e6e3dc;
    --accent:#1c5d99;        /* deep blue accent */
    --accent-soft:#e8f0f8;
    --accent-2:#2a78d6;      /* bar/series color */
    --gold:#b98c2f;
    --good:#0e7a4d;
    --radius:14px;
    --shadow:0 1px 3px rgba(16,20,24,.06), 0 8px 24px rgba(16,20,24,.07);
    color-scheme: light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, Arial, sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  [dir="rtl"] body, [dir="rtl"] & {font-family:'Segoe UI', Tahoma, 'Noto Naskh Arabic', 'Geeza Pro', Arial, sans-serif;}
  .serif{font-family:Georgia, 'Times New Roman', serif;}
  [dir="rtl"] .serif{font-family:'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', Georgia, serif;}

  .wrap{max-width:760px; margin:0 auto; padding:0 20px 80px;}

  /* ---------- header ---------- */
  header.site{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0 14px; border-bottom:1px solid var(--line); margin-bottom:8px;
  }
  .brand{font-size:.95rem; color:var(--ink-2); text-decoration:none; letter-spacing:.02em;}
  .brand strong{color:var(--ink); font-weight:600;}
  .lang-toggle{
    border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:7px 16px; font-size:.95rem; cursor:pointer; color:var(--accent);
    font-weight:600; transition:all .15s;
  }
  .lang-toggle:hover{background:var(--accent-soft);}

  /* ---------- screens ---------- */
  .screen{display:none; animation:fadeIn .35s ease;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---------- intro ---------- */
  .hero{text-align:center; padding:44px 0 8px;}
  .hero .compass{font-size:3rem; line-height:1;}
  .hero h1{font-size:2.2rem; line-height:1.25; margin:14px 0 6px; font-weight:700;}
  .hero p.sub{color:var(--ink-2); font-size:1.12rem; max-width:560px; margin:0 auto 10px;}
  .meta-chips{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:22px 0;}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 16px; font-size:.9rem; color:var(--ink-2);}
  .how{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 28px; margin:10px 0 26px; text-align:start;}
  .how h2{font-size:1.05rem; margin-bottom:12px; color:var(--accent);}
  .how ol{padding-inline-start:22px; color:var(--ink-2);}
  .how li{margin-bottom:8px;}
  .note{font-size:.88rem; color:var(--ink-3); max-width:560px; margin:14px auto 0;}
  .btn{
    display:inline-block; border:none; cursor:pointer; text-align:center;
    background:var(--accent); color:#fff; font-size:1.1rem; font-weight:600;
    padding:15px 44px; border-radius:999px; transition:transform .12s, box-shadow .12s;
    box-shadow:0 4px 14px rgba(28,93,153,.3);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(28,93,153,.35);}
  .btn.secondary{background:var(--card); color:var(--accent); border:1.5px solid var(--accent); box-shadow:none; font-size:.98rem; padding:11px 26px;}

  /* ---------- quiz ---------- */
  .progress-zone{padding:22px 0 6px;}
  .progress-meta{display:flex; justify-content:space-between; align-items:center; font-size:.88rem; color:var(--ink-3); margin-bottom:8px;}
  .section-chip{background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:4px 14px; font-weight:600; font-size:.85rem;}
  .bar-track{height:8px; background:var(--line); border-radius:999px; overflow:hidden;}
  .bar-fill{height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width .3s ease;}
  .qcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:30px 30px 26px; margin-top:18px;
  }
  .qhint{font-size:.86rem; color:var(--ink-3); margin-bottom:10px;}
  .qtext{font-size:1.3rem; font-weight:600; line-height:1.45; margin-bottom:20px;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px;
    padding:13px 16px; font-size:1.02rem; cursor:pointer; text-align:start;
    transition:border-color .12s, background .12s; color:var(--ink); font-family:inherit; line-height:1.45;
  }
  @media (hover:hover) and (pointer:fine){
    .opt:hover{border-color:var(--accent);}
  }
  .opt.selected{border-color:var(--accent); background:var(--accent-soft); font-weight:600;}
  .opt.selected::after{content:"✓"; margin-inline-start:auto; color:var(--accent); font-weight:800; font-size:1.05rem; flex:0 0 auto; padding-inline-start:8px;}
  .opt .emoji{font-size:1.25rem; flex:0 0 auto;}
  .qwhy{margin-top:18px; padding-top:12px; border-top:1px dashed var(--line); font-size:.84rem; color:var(--ink-3); line-height:1.5;}
  .qwhy b{color:var(--ink-2); font-weight:600;}
  .quiz-nav{display:flex; justify-content:space-between; margin-top:16px; gap:10px;}
  .navbtn{background:var(--card); border:1.5px solid var(--line); border-radius:999px; color:var(--ink-2); font-size:.95rem; cursor:pointer; padding:9px 22px; font-family:inherit; font-weight:600;}
  .navbtn:hover{border-color:var(--accent); color:var(--accent);}
  .navbtn.hidden{visibility:hidden; pointer-events:none;}
  .refs{font-size:.8rem; color:var(--ink-3); max-width:640px; margin:26px auto 0; line-height:1.6; text-align:center;}
  .nextbox{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:24px; margin:26px 0 8px; text-align:center;
    box-shadow:0 1px 3px rgba(16,20,24,.06), 0 8px 24px rgba(16,20,24,.07);}
  .nextbox h2{font-size:1.25rem; font-weight:800; margin-bottom:6px;}
  .nextbox p{color:var(--ink-2); font-size:1rem; max-width:560px; margin:0 auto 16px;}
  .nextlinks{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .nextlinks a{text-decoration:none; display:inline-block;}
  .nextpar{margin-top:16px; font-size:.95rem; color:var(--ink-3);}
  .nextpar a{color:var(--accent); font-weight:600; text-decoration:none;}
  .nextpar a:hover{text-decoration:underline;}
  .explorelink{display:block; margin:18px auto 0; font-size:1rem; color:var(--accent); text-decoration:none; font-weight:600;}
  .explorelink:hover{text-decoration:underline;}
  .mread{display:inline-block; margin-top:10px; font-size:.92rem; color:var(--accent); font-weight:600; text-decoration:none;}
  .mread:hover{text-decoration:underline;}

  /* ---------- results ---------- */
  .res-head{text-align:center; padding:36px 0 10px;}
  .res-head .kicker{color:var(--gold); font-weight:700; letter-spacing:.14em; font-size:.8rem; text-transform:uppercase;}
  .res-head h1{font-size:2rem; margin:10px 0 6px;}
  .res-head p{color:var(--ink-2); max-width:540px; margin:0 auto;}
  .viz-root{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px 28px; margin:24px 0;
    --surface-1:#ffffff; --text-primary:#101418; --text-secondary:#4a5158; --series-1:#2a78d6;
  }
  .viz-root h2{font-size:1.05rem; margin-bottom:4px;}
  .viz-root .viz-sub{font-size:.88rem; color:var(--text-secondary); margin-bottom:18px;}
  .prow{display:grid; grid-template-columns:minmax(110px,150px) 1fr 44px; align-items:center; gap:12px; margin-bottom:10px;}
  .prow .plabel{font-size:.94rem; color:var(--text-primary);}
  .prow .plabel small{display:block; color:var(--text-secondary); font-size:.78rem; line-height:1.2;}
  .ptrack{height:14px; background:var(--paper); border:1px solid var(--line); border-radius:4px; overflow:hidden; position:relative;}
  .pfill{height:100%; background:var(--series-1); border-start-start-radius:2px; border-end-start-radius:2px; border-start-end-radius:4px; border-end-end-radius:4px; transition:width .6s ease;}
  .prow .pval{font-size:.88rem; color:var(--text-secondary); text-align:end; font-variant-numeric:tabular-nums;}
  .code-line{margin-top:14px; font-size:.95rem; color:var(--ink-2);}
  .code-line b{color:var(--accent);}

  .majors-title{font-size:1.35rem; margin:30px 0 4px; text-align:center;}
  .majors-sub{text-align:center; color:var(--ink-2); font-size:.95rem; margin-bottom:18px;}
  .mcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:24px 26px; margin-bottom:16px; position:relative;
  }
  .mcard .mtop{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .mrank{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--accent);
    color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:1.02rem;
    align-self:center;
  }
  .mname{font-size:1.22rem; font-weight:700;}
  .mpct{margin-inline-start:auto; font-weight:700; color:var(--accent); font-size:1.05rem; font-variant-numeric:tabular-nums;}
  .mwhy{color:var(--ink-2); font-size:.98rem; margin:8px 0 10px;}
  .mcareers{font-size:.92rem; color:var(--ink-2);}
  .mcareers b{color:var(--ink);}
  .badge{
    display:inline-block; background:#eef7f1; color:var(--good); border:1px solid #cde8d8;
    font-size:.78rem; font-weight:700; border-radius:999px; padding:4px 13px; margin-top:10px;
  }
  .mktbar{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px 22px; margin:22px 0 4px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .mktbar label{font-size:.95rem; color:var(--ink-2); font-weight:600;}
  .mktbar select{
    font-family:inherit; font-size:1rem; font-weight:600; color:var(--accent);
    background:var(--paper); border:1.5px solid var(--line); border-radius:10px;
    padding:9px 14px; cursor:pointer;
  }
  .mktbar select:hover{border-color:var(--accent);}
  .mktbar .srcnote{font-size:.8rem; color:var(--ink-3); flex:1 1 100%; line-height:1.5;}
  .res-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:28px 0 10px;}
  .disclaimer{
    font-size:.85rem; color:var(--ink-3); text-align:center; max-width:600px; margin:18px auto 0;
    border-top:1px solid var(--line); padding-top:16px;
  }
  footer.site{margin-top:40px; text-align:center; font-size:.85rem; color:var(--ink-3);}
  footer.site a{color:var(--accent); text-decoration:none;}

  @media (max-width:560px){
    .hero h1{font-size:1.7rem;}
    .qtext{font-size:1.15rem;}
    .qcard{padding:22px 18px;}
    .prow{grid-template-columns:minmax(88px,110px) 1fr 40px; gap:8px;}
  }
  @media print{
    header.site, .res-actions, .lang-toggle, footer.site{display:none;}
    body{background:#fff;}
    .mcard,.viz-root{box-shadow:none; break-inside:avoid;}
  }

/* ============================================================
   Shared design system, applied across every page
   ============================================================ */
:root{
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Source Sans 3', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --font-ar:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif;

  --paper:#fbf9f5;
  --paper-2:#f4f0e7;
  --card:#ffffff;
  --line:#e7e1d5;
  --line-2:#d6ccb9;

  --ink:#14181d;
  --ink-2:#4a525b;
  --ink-3:#8b929b;

  --navy:#14365c;
  --navy-deep:#0d2036;
  --accent:#16456f;
  --accent-soft:#eaf0f7;
  --accent-line:#c9d9ea;

  --gold:#a37518;
  --gold-soft:#fbf3e1;
  --gold-line:#ecdcb4;
  --gold-bright:#c79a3a;

  --good:#0d6f47;
  --good-soft:#e8f4ee;
  --good-line:#c4e2d3;
  --warn:#8a5a12;
  --warn-soft:#fbf3e1;
  --warn-line:#ecdcb4;
  --bad:#9c3b34;
  --bad-soft:#fbecea;
  --bad-line:#eecdc9;

  --radius:16px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,24,29,.04), 0 14px 30px -16px rgba(20,24,29,.20);
  --shadow-lift:0 2px 4px rgba(20,24,29,.05), 0 22px 40px -20px rgba(20,24,29,.28);
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar);}
body::before{
  content:""; position:fixed; inset:0 0 auto 0; height:3px; z-index:99;
  background:linear-gradient(90deg, var(--navy-deep), var(--navy) 38%, var(--gold-bright) 72%, var(--gold) 100%);
}

.serif, .chap h2, .cn, .stat-n, .minrow b{
  font-family:var(--font-display);
  font-variation-settings:'SOFT' 22, 'WONK' 0;
  letter-spacing:-.012em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .stat-n{
  font-family:var(--font-ar); font-variation-settings:normal; letter-spacing:0; font-weight:700;
}
h1,h2,h3{letter-spacing:-.01em;}
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{letter-spacing:0;}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--gold-soft); color:var(--navy-deep);}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2.5px solid var(--gold-bright); outline-offset:2px; border-radius:6px;
}

/* ---------- masthead ---------- */
header.site{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:16px 0 14px; border-bottom:1px solid var(--line); margin-bottom:0;
}
header.site .brand{
  display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; min-width:0;
}
header.site .mark{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 30%, #1d4a79, var(--navy-deep));
  box-shadow:0 2px 8px rgba(13,32,54,.28), inset 0 0 0 1px rgba(232,194,106,.45);
}
header.site .bt{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
header.site .bt strong{
  font-family:var(--font-display); font-weight:600; font-size:1.06rem; color:var(--ink);
  letter-spacing:-.015em; white-space:nowrap;
}
[dir="rtl"] header.site .bt strong{font-family:var(--font-ar); letter-spacing:0;}
header.site .bs{
  font-size:.74rem; color:var(--ink-3); letter-spacing:.07em; text-transform:uppercase; white-space:nowrap;
}
[dir="rtl"] header.site .bs{letter-spacing:0; text-transform:none; font-size:.82rem;}
.lang-toggle{
  flex:0 0 auto; border:1px solid var(--line-2); background:var(--card); border-radius:999px;
  padding:7px 17px; font-size:.9rem; cursor:pointer; color:var(--accent); font-weight:600;
  font-family:inherit; transition:background .15s, border-color .15s, transform .12s;
}
.lang-toggle:hover{background:var(--accent-soft); border-color:var(--accent-line); transform:translateY(-1px);}

/* ---------- tool switcher ---------- */
.toolnav{
  display:flex; gap:6px; padding:12px 0 4px; overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid var(--line); margin-bottom:4px;
}
.toolnav::-webkit-scrollbar{display:none;}
.toolnav a{
  flex:0 0 auto; text-decoration:none; font-size:.88rem; font-weight:600; color:var(--ink-2);
  padding:7px 14px; border-radius:999px; border:1px solid transparent; white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s;
}
.toolnav a:hover{background:var(--accent-soft); color:var(--accent);}
.toolnav a.on{background:var(--navy); color:#fff; box-shadow:0 3px 10px -3px rgba(20,54,92,.6);}
.toolnav a.on:hover{background:var(--navy-deep); color:#fff;}

/* ---------- hero ---------- */
.hero, .res-head{position:relative;}
.hero::before{
  content:""; position:absolute; z-index:-1; left:50%; top:-40px; transform:translateX(-50%);
  width:min(760px, 118%); height:330px; pointer-events:none;
  background:
    radial-gradient(closest-side, rgba(199,154,58,.13), transparent 72%) 22% 12%/58% 78% no-repeat,
    radial-gradient(closest-side, rgba(20,54,92,.13), transparent 72%) 82% 34%/62% 82% no-repeat;
  filter:blur(2px);
}
.hero h1{font-size:clamp(1.75rem, 1.15rem + 2.3vw, 2.5rem); line-height:1.18; font-weight:600;}
[dir="rtl"] .hero h1{line-height:1.4; font-weight:700;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker{color:var(--gold); font-weight:700;}

/* ---------- surfaces ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox{
  border-radius:var(--radius); border-color:var(--line); box-shadow:var(--shadow);
}
.mcard, .pcard{transition:box-shadow .18s, border-color .18s, transform .18s;}
.mcard:hover, .pcard:hover{box-shadow:var(--shadow-lift); border-color:var(--line-2);}
.pcard{border-inline-start-width:5px;}

/* ---------- buttons and chips ---------- */
.btn{
  background:linear-gradient(180deg, #1d4d7c, var(--navy));
  border:none; border-radius:999px; font-weight:600; letter-spacing:.005em; color:#fff;
  box-shadow:0 2px 4px rgba(13,32,54,.18), 0 10px 22px -10px rgba(13,32,54,.7);
  transition:transform .14s, box-shadow .14s, filter .14s;
}
.btn:hover{transform:translateY(-1.5px); box-shadow:0 3px 6px rgba(13,32,54,.2), 0 16px 30px -12px rgba(13,32,54,.75); filter:saturate(1.08);}
.btn.ghost, .btn.secondary{
  background:var(--card); color:var(--accent); border:1.5px solid var(--accent-line);
  box-shadow:0 1px 2px rgba(20,24,29,.04);
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--accent-soft); border-color:var(--accent);}
.fbtn{
  border:1.5px solid var(--line-2); border-radius:999px; background:var(--card); color:var(--ink-2);
  transition:border-color .15s, background .15s, color .15s, transform .12s;
}
.fbtn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
.fbtn.on{
  background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;
  box-shadow:0 3px 10px -4px rgba(20,54,92,.75);
}
.printbtn{border-color:var(--accent-line);}
.printbtn:hover{background:var(--accent-soft);}

/* ---------- bars and callouts ---------- */
.bar, .quizbar, .cta-inline{
  background:linear-gradient(180deg, #f2f6fb, var(--accent-soft));
  border:1px solid var(--accent-line); border-radius:var(--radius);
}
.rule, .checked, .hedge, .extra, .flag{border-radius:var(--radius-sm);}
.rule.w, .checked, .hedge, .extra, .flag{
  background:linear-gradient(180deg, #fdf8ec, var(--gold-soft)); border-color:var(--gold-line);
}
.rule.b{background:linear-gradient(180deg, #fdf1ef, var(--bad-soft)); border-color:var(--bad-line);}
.rule.n{background:linear-gradient(180deg, #f2f6fb, var(--accent-soft)); border-color:var(--accent-line);}

/* ---------- section labels ---------- */
.sec h3, .lbl, .toc h2{letter-spacing:.1em; font-weight:800;}
[dir="rtl"] .sec h3, [dir="rtl"] .lbl, [dir="rtl"] .toc h2{letter-spacing:0;}
.grp-t, .grp h2, .panel h2, .srcbox h2, .majors-title{font-family:var(--font-display); letter-spacing:-.012em; font-weight:600;}
[dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title{font-family:var(--font-ar); letter-spacing:0; font-weight:700;}

/* ---------- footer ---------- */
footer.site{
  margin-top:52px; padding:26px 0 0; border-top:1px solid var(--line); color:var(--ink-3);
}
footer.site a{color:var(--accent); font-weight:600;}

@media (max-width:520px){
  header.site .bs{display:none;}

/* ---------------- Scoring engine (pure, DOM-free, testable) ---------------- */
function computeProfile(answers){
  // answers: array (same length as QUESTIONS) of selected option indexes (0-based)
  const riasec = {R:0,I:0,A:0,S:0,E:0,C:0};
  const vals = {helping:0,building:0,analyzing:0,leading:0,creating:0,structure:0};
  const aptSelf = {num:0,verb:0,log:0,spat:0};
  const aptTest = {num:0,verb:0,log:0,spat:0};
  let years = "any", avoid = "none";

  QUESTIONS.forEach((q,i)=>{
    const a = answers[i];
    if(a==null) return;
    if(q.type==="likert"){
      riasec[q.dim] += a; // 0..4
    } else if(q.type==="puzzle"){
      if(q.opts[a] && q.opts[a].correct) aptTest[q.apt] += 1;
    } else { // mc
      const opt = q.opts[a]; if(!opt) return;
      if(q.special==="years"){ years = opt.years; return; }
      if(q.special==="avoid"){ avoid = opt.avoid; return; }
      const w = opt.w || {};
      if(w.riasec) for(const k in w.riasec) riasec[k] += w.riasec[k];
      if(w.vals) for(const k in w.vals) vals[k] += w.vals[k];
      if(w.apts) for(const k in w.apts) aptSelf[k] += w.apts[k];
    }
  });

  // clamp negatives, then normalize each family to 0..1 relative to its own max
  const norm = (obj)=>{
    const out = {};
    let max = 0;
    for(const k in obj){ const v = Math.max(0, obj[k]); out[k]=v; if(v>max) max=v; }
    for(const k in out) out[k] = max>0 ? out[k]/max : 0.5;
    return out;
  };
  const riasecN = norm(riasec);

  // aptitude = 40% self-rating (0..3+subject bonus) + 60% puzzle performance (0..2)
  const apt = {};
  for(const k in aptSelf){
    const self = Math.max(0, Math.min(aptSelf[k],4)) / 4;
    const test = aptTest[k] / 2;
    apt[k] = 0.4*self + 0.6*test;
  }
  // relative-normalize aptitudes too (profile, not absolute)
  let aMax = Math.max(apt.num, apt.verb, apt.log, apt.spat);
  const aptN = {};
  for(const k in apt) aptN[k] = aMax>0 ? apt[k]/aMax : 0.5;

  const valsN = norm(vals);

  // Holland code: top-3 letters by raw riasec
  const code = Object.keys(riasec).sort((x,y)=>riasec[y]-riasec[x]).slice(0,3);

  const puzzles = aptTest.num + aptTest.verb + aptTest.log + aptTest.spat;
  return {riasec, riasecN, vals: valsN, apt: aptN, aptRaw: apt, code, years, avoid, puzzles};
}

function scoreMajor(m, p){
  // RIASEC congruence: letters weighted 3/2/1
  const w = [3,2,1];
  let rSum=0, rMax=0;
  m.riasec.forEach((L,i)=>{ const ww = w[i]||1; rSum += ww * (p.riasecN[L]||0); rMax += ww; });
  const rScore = rSum/rMax;

  let vSum=0; m.vals.forEach(v=>vSum += (p.vals[v]||0));
  const vScore = vSum / m.vals.length;

  let aSum=0; m.apts.forEach(a=>aSum += (p.apt[a]||0));
  const aScore = aSum / m.apts.length;

  let score = 0.45*rScore + 0.30*vScore + 0.25*aScore;

  // study-length filter
  if(m.years==="long"){
    if(p.years==="short") score *= 0.35;
    else if(p.years==="four") score *= 0.55;
    else if(p.years==="medium") score *= 0.8;
  }
  // dealbreaker
  if(m.avoidHit && p.avoid!=="none" && m.avoidHit[p.avoid]!=null) score *= m.avoidHit[p.avoid];

  return Math.max(0, Math.min(1, score));
}

function rankMajors(p){
  return MAJORS.map(m=>({m, s:scoreMajor(m,p)}))
    .sort((a,b)=>b.s-a.s)
    .slice(0,5)
    .map(x=>({major:x.m, pct: Math.min(98, Math.round(x.s*100))}));
}

/* why-it-fits sentence, per language */
function buildWhy(m, p, lang){
  const U = UI[lang];
  const parts = [];
  const topLetters = p.code.slice(0,3);
  const hitLetters = m.riasec.filter(L=>topLetters.includes(L)).slice(0,2);
  if(hitLetters.length){
    const names = hitLetters.map(L=> lang==="en" ? DIMS[L].enShort : DIMS[L].arShort).join(U.andWord);
    parts.push(U.whyInterest(names));
  }
  const topVals = Object.keys(p.vals).sort((a,b)=>p.vals[b]-p.vals[a]).slice(0,2);
  const hitVals = m.vals.filter(v=>topVals.includes(v)).slice(0,1);
  if(hitVals.length){
    parts.push(U.whyValue(VALS[hitVals[0]][lang]));
  }
  const topApts = Object.keys(p.apt).sort((a,b)=>p.apt[b]-p.apt[a]).slice(0,2);
  const hitApts = m.apts.filter(a=>topApts.includes(a)).slice(0,1);
  if(hitApts.length){
    parts.push(U.whyApt(APTS[hitApts[0]][lang]));
  }
  if(!parts.length) return m.d[lang];
  let sentence = parts.join(lang==="en" ? ", " : "، ");
  sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1) + ".";
  return sentence + " " + m.d[lang];
}

function archetype(p, lang){
  const [L1, L2] = p.code;
  if(lang==="en") return `${DIMS[L1].adjEn} ${DIMS[L2].enShort}`;
  return `${DIMS[L1].adjAr} ${DIMS[L2].adjAr === DIMS[L1].adjAr ? "" : DIMS[L2].adjAr}`.trim();
}

      const key = c.high[m.id];
      const badge = key
        ? `<span class="badge">${market==="xx" ? U.demandWorld : U.demandIn(c.n[lang])}: ${WHY_DEMAND[key][lang]}</span>`
        : "";
      const card = document.createElement("div");
      card.className = "mcard";
      card.innerHTML =
        `<div class="mtop"><span class="mrank">${idx+1}</span>` +
        `<span class="mname serif">${m.n[lang]}</span>` +
        `<span class="mpct">${r.pct}% ${U.matchWord}</span></div>` +
        `<p class="mwhy"><b>${U.whyLabel}</b> ${buildWhy(m, p, lang)}</p>` +
        `<p class="mcareers"><b>${U.careersLabel}</b> ${m.c[lang].join(" · ")}</p>` +
        badge +
        `<a class="mread" href="explore.html#${m.id}" target="_blank" rel="noopener">${U.readMore}</a>`;
      cards.appendChild(card);
    });
  }

  /* events */
  $("langToggle").addEventListener("click", ()=>{
    lang = lang==="en" ? "ar" : "en";
    applyChrome();
    const active = document.querySelector(".screen.active").id;
    if(active==="screen-quiz") renderQuestion();
    if(active==="screen-results") renderResults(computeProfile(answers));
  });
  $("startBtn").addEventListener("click", ()=>{
    if(!startTime) startTime = Date.now();
    track("start");
    show("quiz"); renderQuestion();
  });
  $("backBtn").addEventListener("click", ()=>{ if(current>0){ current--; renderQuestion(); } });
  $("nextBtn").addEventListener("click", ()=>{
    if(answers[current]==null) return;
    if(current < QUESTIONS.length-1){ current++; renderQuestion(); }
    else finish();
  });
  $("retakeBtn").addEventListener("click", ()=>{
    answers.fill(null); current = 0;
    show("intro");
  });
  $("mktSelect").addEventListener("change", (e)=>{
    market = e.target.value;
    track("market-" + market);
    renderMarket();
  });
  $("printBtn").addEventListener("click", ()=>window.print());
  $("shareBtn").addEventListener("click", async ()=>{
    const url = location.href.split("#")[0];
    const U = UI[lang];
    try{
      if(navigator.share){ await navigator.share({title: U.title, url}); return; }
      await navigator.clipboard.writeText(url);
      $("shareBtn").textContent = U.shareCopied;
      setTimeout(()=>{ $("shareBtn").textContent = U.share; }, 2500);
    }catch(e){/* user cancelled */}
  });

  applyChrome();
})();

/* export for testing in Node */
if (typeof module !== "undefined" && module.exports){
  module.exports = {QUESTIONS, MAJORS, computeProfile, rankMajors, buildWhy, archetype};
}



</script>
<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
