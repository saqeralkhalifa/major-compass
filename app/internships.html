 elig:{en:"At least eighteen, with a GPA of 3.0 and a letter from your institution. The page is titled for UAE nationals but says in its own text that applications from students holding a valid residency visa will also be considered.", ar:"في الثامنة عشرة فأكثر بمعدل ٣٫٠ ورسالة من مؤسستك التعليمية. وعنوان الصفحة خاص بالمواطنين، لكن نصها يذكر أن طلبات الطلبة من حاملي الإقامة السارية تُدرس كذلك."},
 how:{en:"Your college or university emails the hospital with a cover letter and your CV. You cannot send it yourself.", ar:"ترسل كليتك أو جامعتك بريدًا إلى المستشفى برسالة تعريف وسيرتك الذاتية، ولا يمكنك إرسالها بنفسك."},
 url:"https://www.clevelandclinicabudhabi.ae/en/careers/internship-opportunities-for-uae-nationals", checked:"2026-09-28"},

{id:"ccad-wateen", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Cleveland Clinic Abu Dhabi", ar:"كليفلاند كلينك أبوظبي"},
 prog:{en:"Wateen Graduate Trainee Program", ar:"برنامج وتين لتدريب الخريجين"},
 apply:{en:"Applications are accepted throughout the year.", ar:"تُقبل الطلبات على مدار العام."},
 duration:{en:"Twelve months.", ar:"اثنا عشر شهرًا."},
 elig:{en:"Emiratis with an undergraduate degree awarded in the past two years and a graduation GPA of at least 3 out of 4. Screening covers numerical reasoning, cognitive ability, personality and English.", ar:"الإماراتيون من حملة البكالوريوس خلال السنتين الماضيتين بمعدل تخرج لا يقل عن ٣ من ٤. ويشمل الفرز الاستدلال العددي والقدرات المعرفية والشخصية والإنجليزية."},
 how:{en:"Email the careers team to start, then the assessment stages.", ar:"راسل فريق التوظيف للبدء، ثم مراحل التقييم."},
 url:"https://www.clevelandclinicabudhabi.ae/en/careers/uae-nationals/wateen-graduate-trainee-program", checked:"2026-09-28"},

{id:"ccad-clinical-elective", ct:"ae", sector:"health", level:["uni","grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Cleveland Clinic Abu Dhabi", ar:"كليفلاند كلينك أبوظبي"},
 prog:{en:"Clinical Elective Program", ar:"برنامج التدريب السريري الاختياري"},
 apply:{en:"Not published. Rotations are built around the objectives your home institution sets.", ar:"غير منشورة. وتُبنى الفترات حول الأهداف التي تحددها مؤسستك التعليمية."},
 duration:{en:"Four to twelve weeks.", ar:"من أربعة إلى اثني عشر أسبوعًا."},
 elig:{en:"Health professional students and postgraduates, including doctors, nurses, pharmacists and allied health. No nationality rule and no fee are published.", ar:"طلبة المهن الصحية وخريجوها، ومنهم الأطباء والممرضون والصيادلة والمهن الصحية المساندة. ولا يُنشر شرط جنسية ولا رسوم."},
 how:{en:"An online form linked from the page, with questions to the education department.", ar:"نموذج إلكتروني في الصفحة، والاستفسارات إلى دائرة التعليم."},
 url:"https://www.clevelandclinicabudhabi.ae/en/institutes-and-specialties/education/clinical-elective-program", checked:"2026-09-28"},

{id:"doh-abudhabi-internship", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"open",
 org:{en:"Department of Health, Abu Dhabi", ar:"دائرة الصحة، أبوظبي"},
 prog:{en:"Medical Internship Program", ar:"برنامج الامتياز الطبي"},
 apply:{en:"The page prints that applications are available annually from 1 to 31 March, and sets out the 2026 cycle in full: applications 1 to 31 March 2026, screening 1 to 14 April, interviews with facilities 6 May to 16 June, a match date of 7 July and a start date of 1 September 2026. March is the month to watch. The page prints no 2027 dates.", ar:"تطبع الصفحة أن التقديم متاح سنويًا من ١ إلى ٣١ مارس، وتعرض دورة ٢٠٢٦ كاملة: التقديم من ١ إلى ٣١ مارس ٢٠٢٦، والفرز من ١ إلى ١٤ أبريل، والمقابلات مع المرافق من ٦ مايو إلى ١٦ يونيو، وتاريخ المطابقة ٧ يوليو، والبداية في ١ سبتمبر ٢٠٢٦. ومارس هو الشهر الذي يجب ترقبه. ولا تطبع الصفحة أي تواريخ لعام ٢٠٢٧."},
 duration:{en:"One year.", ar:"سنة واحدة."},
 elig:{en:"Named categories are UAE nationals, UAE graduates and eligible international graduates holding an accredited medical or dental degree. The page sets no minimum for UAE nationals, 2.5 or 75 per cent for UAE graduates and 3.2 or 85 per cent for international applicants, who also need IELTS Academic 6, TOEFL 79 or OET C. Time since graduation is capped at two years for non UAE nationals and ten for UAE nationals. Two further categories are listed, the wife of a UAE national and a foreign applicant of an Emirati mother.", ar:"الفئات المذكورة هي المواطنون وخريجو الإمارات والخريجون الدوليون المؤهلون من حملة شهادة طب أو طب أسنان معتمدة. ولا تضع الصفحة حدًا أدنى للمواطنين، و٢٫٥ أو ٧٥ بالمئة لخريجي الإمارات، و٣٫٢ أو ٨٥ بالمئة للمتقدمين الدوليين الذين يلزمهم كذلك آيلتس أكاديمي ٦ أو توفل ٧٩ أو أو إي تي درجة C. ومدة ما بعد التخرج محدودة بسنتين لغير المواطنين وعشر سنوات للمواطنين. وتُدرج فئتان أخريان هما زوجة المواطن والمتقدم الأجنبي من أم إماراتية."},
 how:{en:"Through the MEAD program, with a recent photo, passport copy, graduation certificate, a no objection letter from a current employer or sponsor where there is one, and a signed declaration. Documents carrying a validity date must have more than six months left.", ar:"عبر برنامج ميد، مع صورة حديثة ونسخة من جواز السفر وشهادة التخرج ورسالة عدم ممانعة من جهة العمل أو الكفيل إن وجدت وإقرار موقّع. ويجب أن يتبقى على المستندات ذات تاريخ الصلاحية أكثر من ستة أشهر."},
 url:"https://www.doh.gov.ae/en/programs-initiatives/meed/intermediate-training-program/Internship-Program", checked:"2026-10-01"},

{id:"dubaihealth-internship", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"open",
 org:{en:"Dubai Health and Mohammed Bin Rashid University", ar:"دبي الصحية وجامعة محمد بن راشد"},
 prog:{en:"Medical Internship Program", ar:"برنامج الامتياز الطبي"},
 apply:{en:"The 2026 window opened on 19 February and closed on 3 May, so aim for February.", ar:"فُتحت دورة ٢٠٢٦ في ١٩ فبراير وأُغلقت في ٣ مايو، فاستهدف فبراير."},
 duration:{en:"One year, with ninety medical and twenty five dental places, accredited by the national institute for health specialties. The 2026 intake started on 24 August.", ar:"سنة واحدة بتسعين مقعدًا للطب وخمسة وعشرين لطب الأسنان، ومعتمد من المعهد الوطني للتخصصات الصحية. وبدأت دفعة ٢٠٢٦ في ٢٤ أغسطس."},
 elig:{en:"Open to all nationalities, and the page supports that positively rather than by silence: its fee table names GCC and non UAE nationals as a paying category. A bachelor's degree or equivalent in medicine or dentistry from a college in the World Health Organization directory, and candidates should typically be within two years of graduating. An Emirates ID and a residency permit are each marked if applicable, so there is no residence requirement either. Dental interns from the GCC and other non UAE nationals pay tuition of 65,000 dirhams; medical internship tuition is waived for everybody. There is also a non refundable application fee of 260 dirhams and a non refundable seat reservation fee of 5,000 dirhams.", ar:"متاح لجميع الجنسيات، وتدعم الصفحة ذلك إيجابًا لا بالسكوت: فجدول الرسوم فيها يسمي مواطني دول الخليج وغير مواطني الإمارات فئة تدفع. ويلزم بكالوريوس أو ما يعادله في الطب أو طب الأسنان من كلية مدرجة في دليل منظمة الصحة العالمية، والأصل ألا يكون قد مضى على تخرج المتقدم أكثر من سنتين. وبطاقة الهوية الإماراتية وتصريح الإقامة كل منهما مذكور بصيغة إن وُجد، فلا شرط إقامة كذلك. ويدفع المتدربون في طب الأسنان من دول الخليج ومن غير مواطني الإمارات رسومًا دراسية قدرها ٦٥٠٠٠ درهم، والرسوم الدراسية للتدريب الطبي معفاة عن الجميع. وهناك كذلك رسم تقديم غير مسترد قدره ٢٦٠ درهمًا ورسم حجز مقعد غير مسترد قدره ٥٠٠٠ درهم."},
 how:{en:"Online through the admissions portal, with a non refundable application fee.", ar:"إلكترونيًا عبر بوابة القبول، برسم تقديم غير مسترد."},
 url:"https://www.mbru.ac.ae/graduate-medical-education/internship-admissions/", checked:"2026-10-03"},

{id:"dha-internship", ct:"ae", sector:"health", level:["grad"], paid:"no", status:"annual", gate:"residents",
 org:{en:"Dubai Health Authority", ar:"هيئة الصحة بدبي"},
 prog:{en:"Internship Training Programs, medicine and dentistry", ar:"برامج تدريب الامتياز، الطب وطب الأسنان"},
 apply:{en:"The published window is 10 February to 31 March 2025 with training starting August 2025, and on 1 October 2026 the page still shows that cycle, so check the current dates against the Dubai Health intake before you rely on it.", ar:"الفترة المنشورة من ١٠ فبراير إلى ٣١ مارس ٢٠٢٥ ويبدأ التدريب في أغسطس ٢٠٢٥، وفي ١ أكتوبر ٢٠٢٦ ما تزال الصفحة تعرض تلك الدورة، فقارن التواريخ الحالية بدفعة دبي الصحية قبل أن تعتمد عليها."},
 duration:{en:"One year: six months in medical departments and six in surgical for medicine, and twelve months across seven units for dentistry.", ar:"سنة واحدة: ستة أشهر في الأقسام الباطنية وستة في الجراحية للطب، واثنا عشر شهرًا في سبع وحدات لطب الأسنان."},
 elig:{en:"Graduates of locally and internationally recognized medical schools. The line about graduates of internationally recognized colleges of different nationalities being accepted is printed in both the medical and the dental section, so the page sets no nationality rule. It does set a residence rule: a visa valid for at least a year is required before you can start, and the application asks for a copy of the Emirates ID or a letter pledging to provide it, with the page noting that the Emirates ID requires the visa to be ready. No application is taken more than two years after your final exams, and English is by TOEFL 550, IELTS 6 or OET 300.", ar:"خريجو كليات الطب المعترف بها محليًا ودوليًا. وعبارة قبول خريجي الكليات المعترف بها دوليًا من جنسيات مختلفة مذكورة في قسم الطب وقسم طب الأسنان معًا، فالصفحة لا تضع شرط جنسية. لكنها تضع شرط إقامة: تلزم تأشيرة سارية لسنة على الأقل قبل البدء، ويطلب الطلب نسخة من الهوية الإماراتية أو خطاب تعهد بتقديمها، وتذكر الصفحة أن الهوية تتطلب جهوزية التأشيرة. ولا يُقبل طلب بعد سنتين من الامتحان النهائي، والإنجليزية بتوفل ٥٥٠ أو آيلتس ٦ أو أو إي تي ٣٠٠."},
 how:{en:"Through the authority online services, with a processing fee of 220 dirhams for the medical route and 230 for the dental route.", ar:"عبر الخدمات الإلكترونية للهيئة، برسم معالجة قدره ٢٢٠ درهمًا للمسار الطبي و٢٣٠ درهمًا لمسار طب الأسنان."},
 url:"https://www.dha.gov.ae/en/Medical%20Education%20and%20Research/Internship%20Training%20Programs", checked:"2026-10-01"},

{id:"seha-medical-internship", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"SEHA", ar:"شركة صحة"},
 prog:{en:"Medical Internship Program", ar:"برنامج الامتياز الطبي"},
 apply:{en:"Not published.", ar:"غير منشورة."},
 duration:{en:"A one year clinical program with rotations across the major specialties.", ar:"برنامج سريري لسنة واحدة بالتناوب على التخصصات الرئيسة."},
 elig:{en:"UAE nationals who graduated from approved UAE medical schools or any medical school on the Avicenna database, formerly the WHO directory of medical schools, and expatriate graduates of approved UAE medical schools listed on that database, depending on availability of places.", ar:"مواطنو الإمارات الذين تخرجوا من كليات طب معتمدة في الإمارات أو من أي كلية طب مدرجة في قاعدة بيانات أفيسينا، وهي سابقًا دليل منظمة الصحة العالمية لكليات الطب، والخريجون الوافدون من كليات الطب المعتمدة في الإمارات المدرجة في تلك القاعدة، بحسب توافر المقاعد."},
 how:{en:"Through the careers portal with proof of completion, your transcript, passport copy and a photograph.", ar:"عبر بوابة التوظيف مع إثبات الإتمام وكشف الدرجات ونسخة الجواز وصورة شخصية."},
 url:"https://skmc.seha.ae/join-our-team/", checked:"2026-10-02"},

{id:"ehs-clinical-attachment", ct:"ae", sector:"health", level:["grad"], paid:"no", status:"open", gate:"residents",
 org:{en:"Emirates Health Services", ar:"مؤسسة الإمارات للخدمات الصحية"},
 prog:{en:"Clinical Training Registration", ar:"التسجيل في برامج التدريب السريري"},
 apply:{en:"The registration service is open on the EHS site at any hour, and applications are processed on working days.", ar:"خدمة التسجيل متاحة على موقع الهيئة في أي وقت، وتُعالج الطلبات في أيام العمل."},
 duration:{en:"Set per applicant. Fees are two hundred dirhams to apply and a thousand for each month of enrollment.", ar:"تُحدد لكل متقدم. والرسوم مئتا درهم للتقديم وألف درهم عن كل شهر التحاق."},
 elig:{en:"Graduate physicians from medical and dental faculties, and graduates from health science faculties. The printed document list includes the clinical attachment form, a valid passport copy, a family book copy for nationals or a valid residency visa copy for non UAE nationals, an academic transcript, official experience certificates, an attested internship certificate, a valid Emirates ID copy, a CV, an attested university degree copy, a basic life support certificate, and for doctors an advanced cardiac life support certificate. A start date depends on the availability of suitable vacant training seats.", ar:"الأطباء الخريجون من كليات الطب وطب الأسنان، وخريجو كليات العلوم الصحية. وتشمل قائمة المستندات المطبوعة نموذج التدريب السريري، ونسخة جواز سفر سارية، ونسخة خلاصة قيد للمواطنين أو نسخة إقامة سارية لغير المواطنين، وكشف درجات أكاديمي، وشهادات خبرة رسمية، وشهادة امتياز مصدقة، ونسخة هوية إماراتية سارية، وسيرة ذاتية، ونسخة مصدقة من الشهادة الجامعية، وشهادة الإنعاش القلبي الأساسي، وللأطباء شهادة الإنعاش القلبي المتقدم. ويتوقف تاريخ البدء على توفر مقاعد تدريب شاغرة مناسبة."},
 how:{en:"Apply to the medical practitioners evaluation service on the MOHAP website to obtain the required experience period, then send that with the required documents through the EHS e-service. The service hours printed are Monday to Thursday from 07:30 to 15:30 and Friday from 07:30 to 12:00.", ar:"تقدّم إلى خدمة تقييم الممارسين الصحيين على موقع وزارة الصحة ووقاية المجتمع للحصول على مدة الخبرة المطلوبة، ثم أرسلها مع المستندات المطلوبة عبر الخدمة الإلكترونية لمؤسسة الإمارات للخدمات الصحية. وساعات الخدمة المطبوعة من الاثنين إلى الخميس من ٧٫٣٠ إلى ١٥٫٣٠ والجمعة من ٧٫٣٠ إلى ١٢٫٠٠."},
 url:"https://www.ehs.gov.ae/en/services/training-and-development/request-for-registration-in-the-clinical-training-programs", checked:"2026-09-28"},

{id:"burjeel-observership", ct:"ae", sector:"health", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Burjeel Holdings", ar:"برجيل القابضة"},
 prog:{en:"Undergraduate Observership and Short Term Training", ar:"برنامج الملاحظة والتدريب القصير"},
 apply:{en:"No application window is published. The page offers a request training link.", ar:"لا يُنشر موعد للتقديم. وتتيح الصفحة رابطًا لطلب التدريب."},
 duration:{en:"Not published. The page prints no length for a rotation.", ar:"غير منشورة. لا تطبع الصفحة مدة للدورة التدريبية."},
 elig:{en:"High school graduates or undergraduate students. The categories printed are physicians, dentists, nurses and midwives, allied healthcare specialists and non medical specialties. Training is non hands on shadowing of certified healthcare professionals. The page prints no nationality rule, no documents and no fee.", ar:"خريجو الثانوية أو طلبة البكالوريوس. والفئات المطبوعة هي الأطباء وأطباء الأسنان والممرضون والقابلات وأخصائيو المهن الطبية المساندة والتخصصات غير الطبية. والتدريب مرافقة ومشاهدة دون ممارسة عملية، برفقة ممارسين صحيين معتمدين. ولا تطبع الصفحة شرط جنسية ولا مستندات ولا رسومًا."},
 how:{en:"A Request Training link on the page leads to a training request form. The page does not print who submits it.", ar:"رابط طلب تدريب في الصفحة يقود إلى نموذج طلب. ولا تذكر الصفحة من يقدّمه."},
 url:"https://burjeelholdings.com/strategy/medical-education/undergraduate-training/", checked:"2026-09-28"},

{id:"purehealth-trainee", ct:"ae", sector:"health", level:["uni","grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"PureHealth", ar:"بيور هيلث"},
 prog:{en:"Student Trainee and Graduate Trainee Programs", ar:"برنامجا تدريب الطلبة والخريجين"},
 apply:{en:"No application window is published. Applications go through an online form.", ar:"لا تُنشر فترة تقديم. ويجري التقديم عبر نموذج إلكتروني."},
 duration:{en:"Six to eight weeks for students, twelve months for graduates, with the possibility of a permanent role afterwards.", ar:"من ستة إلى ثمانية أسابيع للطلبة، واثنا عشر شهرًا للخريجين مع إمكانية وظيفة دائمة بعدها."},
 elig:{en:"Emirati undergraduates and graduates with a GPA of 3 or above.", ar:"طلبة البكالوريوس والخريجون الإماراتيون بمعدل ٣ فأعلى."},
 how:{en:"Through the online form on the development center page.", ar:"عبر النموذج الإلكتروني في صفحة مركز التطوير."},
 url:"https://purehealth.ae/emiratidevelopmentcenter/", checked:"2026-09-28"},

{id:"nyuad-external-internship", ct:"ae", sector:"education", level:["uni","grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"New York University Abu Dhabi", ar:"جامعة نيويورك أبوظبي"},
 prog:{en:"External Internship Program", ar:"برنامج التدريب للطلبة من خارج الجامعة"},
 apply:{en:"The university page was read on 2 October 2026. It prints that applications for fall 2026 are closed and that spring 2027 opportunities will be announced closer to the date.", ar:"قُرئت صفحة الجامعة في ٢ أكتوبر ٢٠٢٦. وتطبع أن التقديم لخريف ٢٠٢٦ مغلق وأن فرص ربيع ٢٠٢٧ ستُعلن قرب موعدها."},
 duration:{en:"Twelve weeks, at seven, fifteen or thirty five hours a week.", ar:"اثنا عشر أسبوعًا، بواقع سبع أو خمس عشرة أو خمس وثلاثين ساعة أسبوعيًا."},
 elig:{en:"At least eighteen and enrolled full time at a university in the UAE, in good academic standing. Recent graduates within three years and master's candidates may also apply. School students are not eligible, and this program is for students of other universities, not the university's own.", ar:"في الثامنة عشرة فأكثر وملتحق بدوام كامل بجامعة في الإمارات، بسجل أكاديمي سليم. ويمكن كذلك للخريجين خلال ثلاث سنوات وطلبة الماجستير التقديم. ولا يُقبل طلبة المدارس، والبرنامج مخصص لطلبة الجامعات الأخرى لا لطلبة الجامعة نفسها."},
 how:{en:"Email the hiring manager directly with your CV, a cover letter and a reference letter, plus a research statement for research roles.", ar:"راسل المسؤول عن التوظيف مباشرة بسيرتك الذاتية ورسالة تعريف ورسالة توصية، مع بيان بحثي للأدوار البحثية."},
 url:"https://nyuad.nyu.edu/en/about/careers/internships.html", checked:"2026-10-02"},

{id:"ku-cmhs-internship", ct:"ae", sector:"education", level:["uni","grad"], paid:"no", status:"annual", gate:"unstated",
 org:{en:"Khalifa University", ar:"جامعة خليفة"},
 prog:{en:"College of Medicine Summer Internship", ar:"التدريب الصيفي في كلية الطب"},
 apply:{en:"The published edition is summer 2026 and no 2027 edition has been announced. The form on that page is still live, which is not the same as an intake being open.", ar:"النسخة المنشورة هي صيف ٢٠٢٦ ولم تُعلن نسخة ٢٠٢٧. والنموذج في تلك الصفحة ما يزال فعالًا، وهذا غير أن تكون الدفعة مفتوحة."},
 duration:{en:"Eight weeks. The university states plainly that it is unpaid and that no fees are charged either.", ar:"ثمانية أسابيع. وتذكر الجامعة صراحة أنه بلا أجر وأنه بلا رسوم كذلك."},
 elig:{en:"Third and fourth year university students or recent graduates with a strong foundation in biology or a related scientific discipline.", ar:"طلبة السنتين الثالثة والرابعة في الجامعة أو الخريجون الجدد ممن لديهم أساس قوي في الأحياء أو تخصص علمي ذي صلة."},
 how:{en:"Through the form on the program page, with a CV, a transcript and a statement of academic purpose, or by writing to the program address printed there.", ar:"عبر النموذج في صفحة البرنامج، بسيرة ذاتية وكشف درجات وبيان بالغرض الأكاديمي، أو بالمراسلة على عنوان البرنامج المطبوع فيها."},
 url:"https://www.ku.ac.ae/ku-cmhs-internship-program-summer-2026", checked:"2026-10-02"},

{id:"dubaicares-internships", ct:"ae", sector:"ngo", level:["uni","grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Dubai Cares", ar:"دبي العطاء"},
 prog:{en:"Internship Openings", ar:"فرص التدريب"},
 apply:{en:"A standing form rather than an advertised opening. The form was live on 1 October 2026 and the page listed no openings, no roles, no dates and no pay, so you are submitting into a general pool.", ar:"نموذج دائم لا إعلان عن فرصة محددة. كان النموذج متاحًا في ١ أكتوبر ٢٠٢٦ ولم تعرض الصفحة أي فرص ولا أدوارًا ولا مواعيد ولا أجرًا، أي أنك تقدّم إلى قائمة عامة."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"The page prints no eligibility rule. The form asks for your education, languages, CV and LinkedIn, and it also asks your nationality and your residency status in the Emirates, which are questions rather than stated conditions. No nationality or residence rule appears anywhere.", ar:"لا تذكر الصفحة شرط أهلية. ويطلب النموذج تعليمك ولغاتك وسيرتك الذاتية وحسابك في لينكدإن، كما يسأل عن جنسيتك ووضع إقامتك في الإمارات، وهي أسئلة لا شروط معلنة. ولا يظهر أي شرط جنسية أو إقامة."},
 how:{en:"The online internship form on the openings page.", ar:"نموذج التدريب الإلكتروني في صفحة الفرص."},
 url:"https://www.dubaicares.ae/careers/internship-openings/", checked:"2026-10-01"},

{id:"enwwf-graduate-trainee", ct:"ae", sector:"ngo", level:["grad"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Emirates Nature with WWF", ar:"الإمارات للطبيعة بالتعاون مع الصندوق العالمي للطبيعة"},
 prog:{en:"Graduate Trainee, Community Outreach and Volunteerism", ar:"متدرب خريج، التواصل المجتمعي والتطوع"},
 apply:{en:"Closed. The posting prints a post date of 17 August 2026, a closing date of 11 September 2026 and a start date of September 2026. On 1 October 2026 the page still loads with those dates and no closed notice. The next round is not published, so watch the careers index.", ar:"مغلق. يطبع الإعلان تاريخ نشر في ١٧ أغسطس ٢٠٢٦ وموعد إغلاق في ١١ سبتمبر ٢٠٢٦ وبداية في سبتمبر ٢٠٢٦. وفي ١ أكتوبر ٢٠٢٦ ما تزال الصفحة تُفتح بهذه التواريخ دون إشعار إغلاق. ولم تُنشر الدورة القادمة، فتابع فهرس الوظائف."},
 duration:{en:"Starts in September. The end date is not published.", ar:"يبدأ في سبتمبر، ولا يُنشر تاريخ الانتهاء."},
 elig:{en:"A bachelor's or postgraduate degree in environmental science, ecology, sustainability, conservation, environmental education or a related field, with fluent English. This posting prints no nationality restriction.", ar:"شهادة بكالوريوس أو دراسات عليا في علوم البيئة أو البيئة الطبيعية أو الاستدامة أو الحفاظ على الطبيعة أو التربية البيئية أو مجال متصل، مع إجادة الإنجليزية. ولا يذكر هذا الإعلان أي قيد جنسية."},
 how:{en:"Email a cover letter and your CV to the named contact with the role title in the subject line.", ar:"أرسل رسالة تعريف وسيرتك الذاتية إلى جهة الاتصال المذكورة مع عنوان الوظيفة في سطر الموضوع."},
 url:"https://www.emiratesnaturewwf.ae/en/careers/44-graduate-trainee-community-outreach-volunteerism", checked:"2026-10-01"},

{id:"moe-internship-portal", ct:"ae", sector:"gov", level:["uni","grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"UAE Ministry of Education", ar:"وزارة التربية والتعليم"},
 prog:{en:"The Internships Portal", ar:"بوابة التدريب"},
 apply:{en:"No application window is published. Opportunities are posted as employers add them, and the portal now also carries full time roles for new graduates.", ar:"لا يُنشر موعد للتقديم. وتُنشر الفرص كلما أضافتها جهات العمل، وتحمل البوابة الآن كذلك وظائف بدوام كامل للخريجين الجدد."},
 duration:{en:"Varies by listing.", ar:"تختلف بحسب الفرصة."},
 elig:{en:"Emirati students with a GPA of 3.0 or above from top universities, including Emiratis on scholarship abroad.", ar:"الطلبة الإماراتيون بمعدل ٣٫٠ فأعلى من جامعات مرموقة، ومنهم المبتعثون في الخارج."},
 how:{en:"The landing page prints no registration step and no application instructions. It states that employers can now offer full time jobs for new graduates alongside the internships.", ar:"لا تطبع الصفحة الرئيسية خطوة تسجيل ولا تعليمات تقديم. وتذكر أن بإمكان أصحاب العمل الآن عرض وظائف بدوام كامل للخريجين الجدد إلى جانب فرص التدريب."},
 url:"https://internships.moe.gov.ae/", checked:"2026-09-28"},

{id:"hrdf-tamheer", ct:"sa", sector:"gov", level:["grad"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"Human Resources Development Fund", ar:"صندوق تنمية الموارد البشرية هدف"},
 prog:{en:"Tamheer, on the job training for graduates", ar:"برنامج تمهير للتدريب على رأس العمل"},
 apply:{en:"Open now. The page prints no window and no closing date.", ar:"مفتوح الآن. لا تطبع الصفحة فترة ولا تاريخ إغلاق."},
 duration:{en:"Three to six months full time, with a monthly reward of three thousand riyals paid by the fund.", ar:"من ثلاثة إلى ستة أشهر بدوام كامل، بمكافأة شهرية ثلاثة آلاف ريال يدفعها الصندوق."},
 elig:{en:"Unemployed Saudi graduates aged thirty or under, holding a diploma or degree, with no more than a year of work experience. You can benefit at most twice, up to six months in total.", ar:"الخريجون السعوديون غير الموظفين ممن لا تتجاوز أعمارهم الثلاثين، من حملة الدبلوم أو الشهادة الجامعية، بخبرة لا تتجاوز سنة. ويمكن الاستفادة مرتين كحد أقصى بما لا يتجاوز ستة أشهر."},
 how:{en:"Register on the fund's e services with national access, choose training on the job, and apply to the posted places.", ar:"سجّل في الخدمات الإلكترونية للصندوق عبر النفاذ الوطني، واختر التدريب على رأس العمل، وقدّم على الفرص المعلنة."},
 url:"https://www.hrdf.org.sa/en/products-and-services/programs/individuals/training/graduate-development/", checked:"2026-09-28"},

{id:"hrdf-coop", ct:"sa", sector:"gov", level:["uni"], paid:"no", status:"open", gate:"nationals",
 org:{en:"Human Resources Development Fund", ar:"صندوق تنمية الموارد البشرية هدف"},
 prog:{en:"Cooperative Training placement channel", ar:"قناة التدريب التعاوني"},
 apply:{en:"Open all year. This is where employers post the coop places your degree requires.", ar:"مفتوح طوال العام. وهنا تنشر جهات العمل مقاعد التدريب التعاوني التي يشترطها تخرجك."},
 duration:{en:"At least eight weeks, full time and on site. The fund itself pays nothing, though the employer may.", ar:"ثمانية أسابيع على الأقل بدوام كامل وحضوريًا. ولا يدفع الصندوق شيئًا، وقد تدفع جهة العمل."},
 elig:{en:"The beneficiary must be a Saudi national, currently enrolled in a diploma or bachelor's program, registered on the Human Resources Development Fund website, not currently benefiting from other on the job products, and not on the banned list. The page prints that the fund is not required to pay any amounts to trainees, that no medical insurance is provided, and that there is no social insurance registration.", ar:"يجب أن يكون المستفيد سعودي الجنسية، ومقيدًا حاليًا في برنامج دبلوم أو بكالوريوس، ومسجلًا في موقع صندوق تنمية الموارد البشرية، وغير مستفيد حاليًا من منتجات تدريب أخرى، وغير مدرج في قائمة الممنوعين. وتطبع الصفحة أن الصندوق غير ملزم بدفع أي مبالغ للمتدربين، وأنه لا يُوفَّر تأمين صحي، وأنه لا يوجد تسجيل في التأمينات الاجتماعية."},
 how:{en:"Register on the fund's e services, upload your documents, and apply to the posted opportunities.", ar:"سجّل في الخدمات الإلكترونية للصندوق، وارفع مستنداتك، وقدّم على الفرص المعلنة."},
 url:"https://www.hrdf.org.sa/en/products-and-services/programs/individuals/training/cooperative-training/", checked:"2026-09-28"},

{id:"misk-internship", ct:"sa", sector:"ngo", level:["grad"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"Misk Foundation", ar:"مؤسسة مسك"},
 prog:{en:"Misk Local Traineeship Program", ar:"برنامج مسك للتدريب على رأس العمل"},
 apply:{en:"Applications are open and the page names 30 November 2026 as the closing date. They opened on 11 June 2026 and the program runs from 1 April to 31 December 2026. Misk reveals the individual placements only to applicants who pass the first selection stage, and the page says reaching that stage takes about four weeks. Checked in both languages on 3 October 2026.", ar:"التقديم مفتوح، وتذكر الصفحة ٣٠ نوفمبر ٢٠٢٦ تاريخًا للإغلاق. وقد فُتح التقديم في ١١ يونيو ٢٠٢٦ ويمتد البرنامج من ١ أبريل إلى ٣١ ديسمبر ٢٠٢٦. ولا تكشف مسك الفرص التدريبية إلا للمتقدمين الذين يجتازون مرحلة الاختيار الأولى، وتذكر الصفحة أن الوصول إلى تلك المرحلة يستغرق نحو أربعة أسابيع. تم التحقق باللغتين في ٣ أكتوبر ٢٠٢٦."},
 duration:{en:"Two months to one year, depending on the placement.", ar:"من شهرين إلى سنة كاملة، بحسب الفرصة التدريبية."},
 elig:{en:"Saudi nationality, stated on the Arabic page as being for Saudis only. Senior university students or recent graduates with less than two years of experience, aged 20 to 32, with proficiency in English and Arabic, a reputable university background, and a cumulative GPA of at least 3.75 out of 5 or 2.75 out of 4. The page adds that some employers may set further requirements of their own.", ar:"الجنسية السعودية، وتذكر الصفحة العربية أن البرنامج متاح للسعوديين فقط. طلاب السنة الأخيرة في الجامعات أو حديثو التخرج بخبرة أقل من سنتين، وألا يقل العمر عن ٢٠ سنة ولا يزيد على ٣٢ سنة، مع إتقان الإنجليزية والعربية وخلفية جامعية معتبرة ومعدل تراكمي لا يقل عن ٣٫٧٥ من ٥ أو ٢٫٧٥ من ٤. وتضيف الصفحة أن بعض جهات العمل قد تضع شروطًا إضافية خاصة بها."},
 how:{en:"Sign up on the Misk hub, then an application, a video biography and a virtual interview before matching.", ar:"سجّل في منصة مسك، ثم طلب ومقطع تعريفي مصور ومقابلة افتراضية قبل المواءمة."},
 url:"https://hub.misk.org.sa/programs/skills/misk-local-traineeship-program", checked:"2026-10-03"},

{id:"misk-fellowship", ct:"sa", sector:"ngo", level:["uni","grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Misk Foundation", ar:"مؤسسة مسك"},
 prog:{en:"Misk Fellowship", ar:"زمالة مسك"},
 apply:{en:"The Misk hub says applications open annually and offers a notify me link for when registration opens. Neither page prints a date.", ar:"تذكر منصة مسك أن التقديم يُفتح سنويًا وتتيح رابط تنبيه عند فتح التسجيل. ولا تذكر أي من الصفحتين تاريخًا."},
 duration:{en:"Six months.", ar:"ستة أشهر."},
 elig:{en:"Saudi nationals only, with acceptance at one of the top universities around the world, shown by an enrollment or acceptance letter. The program is free and the hub states plainly that it does not provide scholarships and does not contribute to university admission.", ar:"المواطنون السعوديون فقط، بقبول في إحدى الجامعات الكبرى حول العالم يثبت برسالة قيد أو قبول. والبرنامج بلا رسوم، وتذكر المنصة صراحة أنه لا يقدم منحًا دراسية ولا يسهم في القبول الجامعي."},
 how:{en:"Register on the Misk hub and use the notify me link until the cycle opens.", ar:"سجّل في منصة مسك واستخدم رابط التنبيه حتى تُفتح الدورة."},
 url:"https://misk.org.sa/en/programs/misk-fellowship/", checked:"2026-10-03"},

{id:"mawhiba-summer", ct:"sa", sector:"education", level:["hs"], paid:"no", status:"annual", gate:"nationals",
 org:{en:"Mawhiba", ar:"موهبة"},
 prog:{en:"Universal Enrichment Program", ar:"برنامج موهبة للإثراء العالمي"},
 apply:{en:"The program's own service status read Closed on 2 October 2026, so registration is not open. The page says to check the program page for dates.", ar:"كانت حالة الخدمة الخاصة بالبرنامج تقرأ مغلقة في ٢ أكتوبر ٢٠٢٦، فالتسجيل غير مفتوح. وتذكر الصفحة مراجعة صفحة البرنامج للتواريخ."},
 duration:{en:"Three weeks during the summer vacation. The page prints a contribution of 4,025 riyals for male students, who attend as residents, and 2,530 riyals for female students, who attend on weekdays.", ar:"ثلاثة أسابيع خلال الإجازة الصيفية. وتطبع الصفحة مساهمة قدرها ٤٬٠٢٥ ريالًا للطلاب، ويحضرون إقامةً، و٢٬٥٣٠ ريالًا للطالبات، ويحضرن في أيام الأسبوع."},
 elig:{en:"Students in grades 9 to 11 of Saudi nationality or with a Saudi mother, with non Saudis accepted up to ten per cent of the total. A score of 1400 or higher in the Mawhiba multiple cognitive aptitude test is required.", ar:"طلبة الصفوف من التاسع إلى الحادي عشر من حملة الجنسية السعودية أو من أم سعودية، ويُقبل غير السعوديين بما لا يتجاوز عشرة في المئة من الإجمالي. ويُشترط ١٤٠٠ درجة فأعلى في مقياس موهبة للقدرات العقلية المتعددة."},
 how:{en:"Register on the Mawhiba site or app, pick a course and pay the contribution.", ar:"سجّل في موقع موهبة أو تطبيقها، واختر البرنامج وسدد المساهمة."},
 url:"https://www.mawhiba.sa/en/services/mawhiba-universal-enrichment-program/", checked:"2026-10-02"},

{id:"kaust-vsrp", ct:"sa", sector:"education", level:["uni","grad"], paid:"yes", status:"open", gate:"unstated",
 org:{en:"KAUST", ar:"جامعة الملك عبدالله للعلوم والتقنية"},
 prog:{en:"Visiting Student Research Program", ar:"برنامج الطلبة الباحثين الزائرين"},
 apply:{en:"Open now. The page prints the intake as all year round and prints no closing date. You apply against a specific project on the project page.", ar:"مفتوح الآن. تطبع الصفحة أن التقديم متاح على مدار السنة ولا تطبع تاريخ إغلاق. ويجري التقديم على مشروع بعينه من صفحة المشروع."},
 duration:{en:"Two to six months, fully funded: a monthly stipend of a thousand dollars, a private room and bathroom, round trip flights and lab access.", ar:"من شهرين إلى ستة أشهر بتمويل كامل: مكافأة شهرية ألف دولار وغرفة خاصة بحمامها وتذاكر ذهاب وعودة ودخول المختبرات."},
 elig:{en:"Third year undergraduates and above, and master's students, with a GPA of 3.5 out of 4 and English proof. No nationality rule is printed. Current doctoral candidates, and the university's own students and alumni, are not eligible.", ar:"طلبة البكالوريوس من السنة الثالثة فأعلى وطلبة الماجستير، بمعدل ٣٫٥ من ٤ وإثبات الإنجليزية. ولا يُنشر شرط جنسية. ولا يُقبل طلبة الدكتوراه الحاليون ولا طلبة الجامعة نفسها وخريجوها."},
 how:{en:"Browse the project search and apply through a specific project listing.", ar:"تصفح المشاريع وقدّم عبر مشروع محدد."},
 url:"https://admissions.kaust.edu.sa/study/internships", checked:"2026-09-28"},

{id:"kaust-ssi", ct:"sa", sector:"education", level:["uni","grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"KAUST", ar:"جامعة الملك عبدالله للعلوم والتقنية"},
 prog:{en:"Saudi Summer Internship", ar:"التدريب الصيفي للسعوديين"},
 apply:{en:"The only dates printed are 15 June to 6 August 2026, which have passed, and the page carries no closed notice and no next window, read on 2 October 2026.", ar:"التواريخ الوحيدة المطبوعة هي ١٥ يونيو إلى ٦ أغسطس ٢٠٢٦ وقد مضت، ولا تحمل الصفحة إشعار إغلاق ولا فترة تالية، وقد قُرئت في ٢ أكتوبر ٢٠٢٦."},
 duration:{en:"Six to ten weeks, with a stipend for living expenses and free accommodation on campus.", ar:"من ستة إلى عشرة أسابيع، مع مكافأة لتغطية نفقات المعيشة وسكن مجاني في الحرم الجامعي."},
 elig:{en:"Saudi university students and recent graduates with a cumulative grade point average of 3.5 out of 4 or higher. A copy of the national identity card is required. The page prints no field of study and no degree level.", ar:"طلبة الجامعات السعوديون والخريجون الجدد بمعدل تراكمي ٣٫٥ من ٤ فأعلى. ويُطلب نسخة من الهوية الوطنية. ولا تطبع الصفحة أي تخصص ولا مستوى دراسي."},
 how:{en:"Submit your CV, transcripts in English and national ID for admissions review.", ar:"أرسل سيرتك الذاتية وكشوف الدرجات بالإنجليزية وبطاقة الهوية لمراجعة القبول."},
 url:"https://cemse.kaust.edu.sa/internship-opportunities/saudi-summer-internship-ssi", checked:"2026-10-02"},

{id:"kapsarc-coop", ct:"sa", sector:"energy", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"KAPSARC", ar:"مركز الملك عبدالله للدراسات والبحوث البترولية"},
 prog:{en:"Coop Internship Program", ar:"برنامج التدريب التعاوني"},
 apply:{en:"Fall and spring intakes. On 1 October 2026 the page carries a live apply link to a Co-op Training posting for Spring 2026. The page prints no closing date.", ar:"دفعتان في الخريف والربيع. وفي ١ أكتوبر ٢٠٢٦ تحمل الصفحة رابط تقديم فعالًا إلى إعلان تدريب تعاوني لربيع ٢٠٢٦. ولا تطبع الصفحة موعد إغلاق."},
 duration:{en:"Six months.", ar:"ستة أشهر."},
 elig:{en:"Final year bachelor's students whose degree requires a placement, with a university endorsement letter, a GPA of 4 out of 5 or 3.2 out of 4, good English and a commitment to six months. Majors span engineering, economics, computer science, cybersecurity and business. The page prints no nationality rule.", ar:"طلبة السنة الأخيرة في البكالوريوس ممن يتطلب تخصصهم تدريبًا، مع رسالة اعتماد من الجامعة، ومعدل ٤ من ٥ أو ٣٫٢ من ٤، وإنجليزية جيدة، والالتزام بستة أشهر. وتشمل التخصصات الهندسة والاقتصاد وعلوم الحاسب والأمن السيبراني والأعمال. ولا تنشر الصفحة أي شرط جنسية."},
 how:{en:"Apply to the coop posting on the center's careers portal.", ar:"قدّم على إعلان التدريب في بوابة التوظيف لدى المركز."},
 url:"https://www.kapsarc.org/internship/", checked:"2026-10-01"},

{id:"kapsarc-gdp", ct:"sa", sector:"energy", level:["grad"], paid:"yes", status:"annual", gate:"unstated",
 org:{en:"KAPSARC", ar:"مركز الملك عبدالله للدراسات والبحوث البترولية"},
 prog:{en:"Graduate Development Program", ar:"برنامج تطوير الخريجين"},
 apply:{en:"Not published. The page prints no window and no application route.", ar:"غير منشورة. ولا تطبع الصفحة فترة تقديم ولا مسار تقديم."},
 duration:{en:"A full time one year graduate training contract, with monthly base pay, housing and transport allowances, medical insurance and paid leave.", ar:"عقد تدريب للخريجين لمدة سنة بدوام كامل، مع راتب أساسي شهري وبدلي سكن ومواصلات وتأمين طبي وإجازة مدفوعة."},
 elig:{en:"Graduates of the 2025 or 2026 classes, with a grade point average of 4 out of 5, or 3.2 out of 4, or 60 out of 100 and above, and IELTS 6.5 academic or TOEFL iBT 79. The page prints that applicants who graduated from one of the latest QS top fifty universities do not have to submit an English certificate.", ar:"خريجو دفعتي ٢٠٢٥ أو ٢٠٢٦، بمعدل ٤ من ٥، أو ٣٫٢ من ٤، أو ٦٠ من ١٠٠ فأعلى، مع آيلتس ٦٫٥ أكاديمي أو توفل آي بي تي ٧٩. وتطبع الصفحة أن من تخرج من إحدى أحدث خمسين جامعة في تصنيف كيو إس غير مطالب بتقديم شهادة لغة إنجليزية."},
 how:{en:"Not published on the page read. The page prints the four selection steps: application screening, an online assessment, interviews and final selection.", ar:"غير منشور في الصفحة المقروءة. وتطبع الصفحة خطوات الاختيار الأربع: فرز الطلبات، واختبار إلكتروني، ومقابلات، ثم الاختيار النهائي."},
 url:"https://www.kapsarc.org/graduate-development-program/", checked:"2026-10-02"},

{id:"neom-grow", ct:"sa", sector:"industry", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"NEOM", ar:"نيوم"},
 prog:{en:"GrOW Graduate Program", ar:"برنامج جرو للخريجين"},
 apply:{en:"The page read on 2 October 2026 is headed for the 2024 edition, so its rules are that edition's. It prints no window and no closed notice.", ar:"الصفحة المقروءة في ٢ أكتوبر ٢٠٢٦ معنونة بنسخة ٢٠٢٤، فشروطها شروط تلك النسخة. ولا تطبع أي فترة تقديم ولا إشعار إغلاق."},
 duration:{en:"Full time employment with immersive learning, mentorship and development resources.", ar:"توظيف بدوام كامل مع تعلم مكثف وإرشاد وموارد للتطوير."},
 elig:{en:"Saudi nationals aged up to 28, with a cumulative grade point average of 3.5 out of 4 or 4.5 out of 5, and flexibility to relocate. The page prints no experience rule, no English rule and no degree level.", ar:"المواطنون السعوديون حتى سن ٢٨، بمعدل تراكمي ٣٫٥ من ٤ أو ٤٫٥ من ٥، مع المرونة للانتقال. ولا تطبع الصفحة أي شرط خبرة ولا شرط لغة إنجليزية ولا مستوى شهادة."},
 how:{en:"Through the work at NEOM pages.", ar:"عبر صفحات العمل في نيوم."},
 url:"https://www.neom.com/en-us/be-part-of-neom/work-at-neom/grow", checked:"2026-10-02"},

{id:"rsg-vocational", ct:"sa", sector:"hospitality", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Red Sea Global", ar:"البحر الأحمر الدولية"},
 prog:{en:"Vocational Training Program", ar:"برنامج التدريب المهني"},
 apply:{en:"Very short windows: the sixth cohort registered 5 to 11 July 2026 and started on 23 August. Watch for the next one in early summer.", ar:"فترات قصيرة جدًا: سجّلت الدفعة السادسة من ٥ إلى ١١ يوليو ٢٠٢٦ وبدأت في ٢٣ أغسطس. ترقّب الدفعة القادمة مطلع الصيف."},
 duration:{en:"Two years and four months: English, then vocational training, then an internship, with a monthly stipend of a thousand riyals rising to two thousand, and a guaranteed job at the end.", ar:"سنتان وأربعة أشهر: لغة إنجليزية ثم تدريب مهني ثم تدريب عملي، بمكافأة شهرية ألف ريال ترتفع إلى ألفين، ووظيفة مضمونة في الختام."},
 elig:{en:"Saudi nationals holding a valid national identity card, aged 18 or above. An applicant who has already benefited from a Red Sea Global educational program is not eligible. The Tourism Security track narrows the age band to 18 to 25.", ar:"سعوديو الجنسية ممن يحملون هوية وطنية سارية، ولا يقل العمر عن ١٨ سنة. ولا يُقبل من استفاد سابقًا من أحد البرامج التعليمية للبحر الأحمر العالمية. ويضيّق مسار أمن المنشآت السياحية نطاق العمر إلى ما بين ١٨ و٢٥ سنة."},
 how:{en:"Register on the company's training pages during the window.", ar:"سجّل في صفحات التدريب لدى الشركة خلال الفترة."},
 url:"https://www.redseaglobal.com/en/training-education/vocational-training-program/", checked:"2026-10-03"},

{id:"rsg-hospitality-pioneers", ct:"sa", sector:"hospitality", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Red Sea Global with the University of Tabuk", ar:"البحر الأحمر الدولية مع جامعة تبوك"},
 prog:{en:"Hospitality Pioneers Program", ar:"برنامج روّاد الضيافة"},
 apply:{en:"Not open. The only cohort the page names started on 24 August 2025, and in October 2026 no 2026 cohort has been added, so the page is more than a year behind. It says registration opens again next year and that the process usually starts a month before the program begins.", ar:"غير مفتوح. الدفعة الوحيدة التي تذكرها الصفحة بدأت في ٢٤ أغسطس ٢٠٢٥، وفي أكتوبر ٢٠٢٦ لم تُضَف دفعة ٢٠٢٦، فالصفحة متأخرة أكثر من سنة. وتذكر أن التسجيل يُفتح مرة أخرى في العام المقبل وأن التقديم يبدأ عادة شهرًا قبل بداية البرنامج."},
 duration:{en:"Two and a half years: five months of English, twenty of vocational training and five of placement, with the same rising stipend, leading to three years of employment with the company.", ar:"سنتان ونصف: خمسة أشهر لغة وعشرون تدريبًا مهنيًا وخمسة تدريبًا عمليًا، بالمكافأة المتدرجة نفسها، وتنتهي بثلاث سنوات عمل لدى الشركة."},
 elig:{en:"Saudi nationals. Age must not exceed 25 and the applicant must not have left high school more than five years ago. The applicant must also sign a commitment to work for at least three years from the date of graduation, which binds them well beyond the program itself and is worth knowing before applying.", ar:"سعوديو الجنسية. ألا يزيد العمر على ٢٥ سنة، وألا يكون قد مضى على التخرج من الثانوية أكثر من خمس سنوات. ويلزم المتقدم كذلك بالتوقيع على التزام بالعمل ثلاث سنوات على الأقل من تاريخ التخرج، وهو التزام يمتد إلى ما بعد البرنامج نفسه ويجدر معرفته قبل التقديم."},
 how:{en:"Apply through the University of Tabuk portal, with interviews in Al Wajh.", ar:"قدّم عبر بوابة جامعة تبوك، والمقابلات في الوجه."},
 url:"https://www.redseaglobal.com/en/training-education/hospitality-pioneers-program/", checked:"2026-10-03"},

{id:"rsg-elite", ct:"sa", sector:"hospitality", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Red Sea Global", ar:"البحر الأحمر الدولية"},
 prog:{en:"Elite Graduate Program", ar:"برنامج النخبة للخريجين"},
 apply:{en:"No dates are published. The page refers to a sixth edition and prints no window and no route.", ar:"لا تُنشر تواريخ. وتشير الصفحة إلى نسخة سادسة ولا تطبع فترة تقديم ولا مسارًا."},
 duration:{en:"Four months of English training at a thousand riyals a month, then eighteen months of vocational training at two thousand riyals a month, with employment on successful completion.", ar:"أربعة أشهر من تدريب اللغة الإنجليزية بألف ريال شهريًا، ثم ثمانية عشر شهرًا من التدريب المهني بألفي ريال شهريًا، مع التوظيف عند إتمام البرنامج بنجاح."},
 elig:{en:"Saudi nationals who graduated within the last two years, holding a bachelor or master degree accredited by the Saudi Ministry of Education, and native Arabic speakers equally fluent in English.", ar:"المواطنون السعوديون الذين تخرجوا خلال العامين الماضيين، بدرجة بكالوريوس أو ماجستير معتمدة من وزارة التعليم السعودية، والناطقون بالعربية لغة أمًا بطلاقة مماثلة في الإنجليزية."},
 how:{en:"Not published on the page read.", ar:"غير منشور في الصفحة المقروءة."},
 url:"https://redseaglobal.com/en/training-education/elite-graduate-program/", checked:"2026-10-02"},

{id:"diriyah-gdp", ct:"sa", sector:"industry", level:["grad"], paid:"yes", status:"annual", gate:"unstated",
 org:{en:"Diriyah Company", ar:"شركة الدرعية"},
 prog:{en:"Graduate Development Program", ar:"برنامج تطوير الخريجين"},
 apply:{en:"The company's careers page does not name this program and prints no window for it. Earlier editions were announced separately and their registration periods have closed. What the careers page does print is more than 120 student and graduate positions each year.", ar:"لا تذكر صفحة التوظيف لدى الشركة هذا البرنامج ولا تطبع له فترة تقديم. وقد أُعلنت نسخ سابقة بشكل منفصل وأُغلقت فترات تسجيلها. أما ما تطبعه صفحة التوظيف فهو أكثر من ١٢٠ وظيفة للطلبة والخريجين كل عام."},
 duration:{en:"Not printed.", ar:"غير مطبوعة."},
 elig:{en:"Not printed on the careers page. Earlier announcements described bachelor and master graduates with little or no work experience. No nationality rule and no grade point floor is printed on any page that could be read.", ar:"غير مطبوعة في صفحة التوظيف. ووصفت إعلانات سابقة خريجي البكالوريوس والماجستير بخبرة قليلة أو بلا خبرة. ولا يُطبع أي شرط جنسية ولا حد أدنى للمعدل في أي صفحة أمكن قراءتها."},
 how:{en:"Through the opportunities link on the company's careers page, which goes to its recruitment portal.", ar:"عبر رابط الفرص في صفحة التوظيف لدى الشركة، وهو يؤدي إلى بوابة التوظيف لديها."},
 url:"https://www.diriyahcompany.sa/en/news/diriyah-company-launches-fifth-edition-of-graduate-development-program", checked:"2026-10-02"},

{id:"qiddiya-playforward", ct:"sa", sector:"hospitality", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Qiddiya", ar:"القدية"},
 prog:{en:"PlayForward Graduate Program", ar:"برنامج بلاي فورورد للخريجين"},
 apply:{en:"The last window ran 10 to 30 June 2026 for a cohort running 16 September 2026 to 16 August 2027, so the month to watch is June.", ar:"جرى آخر تقديم من ١٠ إلى ٣٠ يونيو ٢٠٢٦ لدفعة تمتد من ١٦ سبتمبر ٢٠٢٦ إلى ١٦ أغسطس ٢٠٢٧، فالشهر الذي يجب ترقبه هو يونيو."},
 duration:{en:"Eleven months, full time in Riyadh with two rotations, a competitive salary and family medical insurance.", ar:"أحد عشر شهرًا بدوام كامل في الرياض مع تناوبين، براتب تنافسي وتأمين طبي عائلي."},
 elig:{en:"Saudi graduates of the last two years from accredited universities, GPA 3.75 out of 5 or 2.75 out of 4, with professional Arabic and English required in speaking, reading, writing and communication. Medical insurance covers a spouse and children.", ar:"الخريجون السعوديون خلال آخر سنتين من جامعات معتمدة، بمعدل ٣٫٧٥ من ٥ أو ٢٫٧٥ من ٤، بعربية وإنجليزية مهنية في التحدث والقراءة والكتابة والتواصل. ويشمل التأمين الطبي الزوج والأبناء."},
 how:{en:"Register on the Misk hub, then an application, video biography, interview and host assessment.", ar:"سجّل في منصة مسك، ثم طلب ومقطع تعريفي ومقابلة وتقييم لدى الجهة المضيفة."},
 url:"https://hub.misk.org.sa/en/programs/skills/qiddiya-gdp/", checked:"2026-10-01"},

{id:"roshn-gdp", ct:"sa", sector:"industry", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"ROSHN Group", ar:"مجموعة روشن"},
 prog:{en:"Graduate Development Program", ar:"برنامج تطوير الخريجين"},
 apply:{en:"The page carries a register interest button and prints no dates of any kind. No application window is published.", ar:"تحمل الصفحة زر إبداء اهتمام ولا تذكر أي تواريخ. ولا يُنشر موعد للتقديم."},
 duration:{en:"Twelve months in Riyadh or Jeddah, with a market salary, an annual bonus and healthcare that covers parents.", ar:"اثنا عشر شهرًا في الرياض أو جدة، براتب سوقي ومكافأة سنوية وتأمين صحي يشمل الوالدين."},
 elig:{en:"Saudi bachelor's or master's graduates from 2022 onward, GPA 2.75 out of 4 or 3.75 out of 5, with IELTS 5.5, TOEFL paper 475, TOEFL internet 53 or STEP 75. Degrees must be ministry accredited, and a degree from outside Saudi Arabia needs an equivalency.", ar:"الخريجون السعوديون من ٢٠٢٢ فصاعدًا، بمعدل ٢٫٧٥ من ٤ أو ٣٫٧٥ من ٥، وآيلتس ٥٫٥ أو توفل ورقي ٤٧٥ أو توفل إلكتروني ٥٣ أو ستيب ٧٥. ويجب أن تكون الشهادة معتمدة من الوزارة، وتحتاج الشهادة من خارج السعودية إلى معادلة."},
 how:{en:"The register interest button on the program page.", ar:"زر إبداء الاهتمام في صفحة البرنامج."},
 url:"https://www.roshn.sa/roshn-graduate-development-program", checked:"2026-10-03"},

{id:"pif-gdp", ct:"sa", sector:"finance", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Public Investment Fund", ar:"صندوق الاستثمارات العامة"},
 prog:{en:"Graduate Development Program", ar:"برنامج تطوير الخريجين"},
 apply:{en:"The current cycle is closed. More than a thousand graduates have passed through nine cohorts, and it feeds the fund and its giga projects.", ar:"الدورة الحالية مغلقة. وقد مر أكثر من ألف خريج عبر تسع دفعات، ويغذي البرنامج الصندوق ومشاريعه الكبرى."},
 duration:{en:"Twelve months in four phases: foundation, academics, specialization and on the job work with a dissertation, with a monthly allowance and insurance.", ar:"اثنا عشر شهرًا في أربع مراحل: تأسيس فدراسة فتخصص فعمل ميداني مع بحث ختامي، بمخصص شهري وتأمين."},
 elig:{en:"Saudi graduates of 2024 to 2026 in business, finance, engineering, law, data, cybersecurity and economics, GPA 3.75 out of 5 or 2.75 out of 4, IELTS 6, TOEFL internet 76 or TOEFL paper 513 dated 2025 onward. The package includes a monthly allowance, medical insurance and paid leave.", ar:"الخريجون السعوديون من ٢٠٢٤ إلى ٢٠٢٦ في الأعمال والمالية والهندسة والقانون والبيانات والأمن السيبراني والاقتصاد، بمعدل ٣٫٧٥ من ٥ أو ٢٫٧٥ من ٤، وآيلتس ٦ أو توفل إلكتروني ٧٦ أو توفل ورقي ٥١٣ بشهادة من ٢٠٢٥ فصاعدًا. وتشمل الحزمة مكافأة شهرية وتأمينًا طبيًا وإجازة مدفوعة."},
 how:{en:"Through the fund's careers page when the window opens.", ar:"عبر صفحة التوظيف لدى الصندوق عند فتح الفترة."},
 url:"https://www.pif.gov.sa/en/careers/graduate-development-program/", checked:"2026-10-03"},

{id:"ssa-space-academy", ct:"sa", sector:"tech", level:["uni","grad"], paid:"no", status:"open", gate:"unstated",
 org:{en:"Saudi Space Agency", ar:"وكالة الفضاء السعودية"},
 prog:{en:"Space Academy programs", ar:"برامج أكاديمية الفضاء"},
 apply:{en:"Open now. The dates on the academy calendar are the days each course runs, not application deadlines, and the page prints no deadline anywhere. The October series printed is 6 and 7 October for Space Law, 11 and 12 October for Space Economy, 13 and 14 October for Fundamentals of Space Science, 18 and 19 October for Cybersecurity for Space Systems, 20 and 21 October for Introduction to Space Data Science, and 25 and 26 October for Space Software Design and Development, each as a bare day and month with no year. Each program is announced separately with its own registration link or QR code, and admission is notified by email two weeks before the program begins.", ar:"مفتوح الآن. التواريخ في تقويم الأكاديمية هي أيام انعقاد كل دورة لا مواعيد إغلاق للتقديم، ولا تطبع الصفحة أي موعد إغلاق. وسلسلة أكتوبر المطبوعة هي ٦ و٧ أكتوبر لقانون الفضاء، و١١ و١٢ أكتوبر لاقتصاد الفضاء، و١٣ و١٤ أكتوبر لأساسيات علوم الفضاء، و١٨ و١٩ أكتوبر للأمن السيبراني لأنظمة الفضاء، و٢٠ و٢١ أكتوبر لمقدمة في علوم بيانات الفضاء، و٢٥ و٢٦ أكتوبر لتصميم وتطوير برمجيات الفضاء، وكلها باليوم والشهر دون ذكر السنة. ويُعلن عن كل برنامج على حدة برابط تسجيل أو رمز استجابة خاص به، ويُبلَّغ القبول بالبريد قبل أسبوعين من بدء البرنامج."},
 duration:{en:"Two days to several weeks depending on the program, online and in Riyadh. The agency states that programs are free of charge unless the announcement says otherwise, and that participants receive an electronic certificate on completion.", ar:"من يومين إلى عدة أسابيع بحسب البرنامج، إلكترونيًا وفي الرياض. وتذكر الوكالة أن البرامج بلا رسوم ما لم يذكر الإعلان غير ذلك، وأن المشارك يحصل على شهادة إلكترونية عند إتمام المتطلبات."},
 elig:{en:"The page prints that eligibility depends on the target audience of each program and is specified in that program's announcement. Sessions run from 9:30 in the morning to 1:00 in the afternoon Saudi time. All programs are free of charge unless the announcement says otherwise, and participants receive an electronic certificate on completing the requirements.", ar:"تطبع الصفحة أن الأهلية تتوقف على الفئة المستهدفة لكل برنامج وتُحدَّد في إعلانه. وتُقام الجلسات من الساعة ٩٫٣٠ صباحًا إلى الواحدة ظهرًا بتوقيت السعودية. وجميع البرامج بلا رسوم ما لم يذكر الإعلان خلاف ذلك، ويحصل المشارك على شهادة إلكترونية عند استيفاء المتطلبات."},
 how:{en:"Use the registration link beside the program you want. The links resolve to ssa.gov.sa/EServices/services/1761 or to /1762 depending on the program. Enquiries to SpaceAcademy@ssa.gov.sa.", ar:"استخدم رابط التسجيل بجانب البرنامج الذي تريده. وتقود الروابط إلى ssa.gov.sa/EServices/services/1761 أو إلى ‎/1762 بحسب البرنامج. الاستفسارات على SpaceAcademy@ssa.gov.sa."},
 url:"https://www.ssa.gov.sa/spaceacademyen/", checked:"2026-10-01"},

{id:"aramco-cdpne", ct:"sa", sector:"energy", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Saudi Aramco", ar:"أرامكو السعودية"},
 prog:{en:"College Degree Program for Non Employees", ar:"برنامج الابتعاث الجامعي لغير الموظفين"},
 apply:{en:"Registration is closed between rounds and the window is announced on the careers site. Screening tests have run in early May with orientation in August.", ar:"يُغلق التسجيل بين الجولات وتُعلن الفترة في موقع التوظيف. وجرت اختبارات الفرز مطلع مايو والتهيئة في أغسطس."},
 duration:{en:"A preparatory year in Dhahran with a monthly stipend of four thousand riyals, housing, transport and medical care, followed by a sponsored bachelor's degree abroad.", ar:"سنة تحضيرية في الظهران بمكافأة شهرية أربعة آلاف ريال وسكن ونقل ورعاية طبية، يتبعها ابتعاث لدرجة البكالوريوس في الخارج."},
 elig:{en:"Saudi male and female high school graduates. A cumulative average of 85 per cent or above across the whole of high school, and 85 per cent in mathematics and the sciences, which the Arabic page lists as mathematics, physics, chemistry and biology. A Qudurat or General Aptitude Test score of 90 per cent or higher. The applicant must not be older than 22 Hijri years.", ar:"خريجو وخريجات الثانوية العامة من السعوديين. معدل تراكمي ٨٥ بالمئة أو أعلى على مدى الثانوية كلها، و٨٥ بالمئة في الرياضيات والعلوم، وتذكرها الصفحة العربية: الرياضيات والفيزياء والكيمياء والأحياء. ودرجة ٩٠ بالمئة أو أعلى في اختبار القدرات العامة. وألا يزيد عمر المتقدم على ٢٢ سنة هجرية."},
 how:{en:"Online application, then English and maths screening tests.", ar:"تقديم إلكتروني ثم اختبارا فرز في الإنجليزية والرياضيات."},
 url:"https://www.aramco.com/en/careers/saudi-applicants/non-employee-programs/high-school-and-diploma-graduates/cdpne", checked:"2026-10-03"},

{id:"aramco-apprenticeship", ct:"sa", sector:"energy", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Saudi Aramco", ar:"أرامكو السعودية"},
 prog:{en:"Apprenticeship Program", ar:"برنامج التدريب المهني"},
 apply:{en:"Registration is closed between rounds and the window is announced on the careers site.", ar:"يُغلق التسجيل بين الجولات وتُعلن الفترة في موقع التوظيف."},
 duration:{en:"A multi year apprenticeship with a monthly stipend, housing, free transport and medical care.", ar:"تدريب مهني متعدد السنوات بمكافأة شهرية وسكن ونقل مجاني ورعاية طبية."},
 elig:{en:"Saudi school leavers with an average of seventy five or above, a general aptitude score of seventy two or above, and age no more than twenty four Hijri years.", ar:"خريجو الثانوية السعوديون بمعدل ٧٥ فأكثر ودرجة قدرات عامة ٧٢ فأكثر وعمر لا يتجاوز أربعة وعشرين عامًا هجريًا."},
 how:{en:"Online application, then English and maths tests, a medical and a training agreement.", ar:"تقديم إلكتروني ثم اختبارات إنجليزية ورياضيات وفحص طبي واتفاقية تدريب."},
 url:"https://www.aramco.com/en/careers/for-saudi-applicants/student-opportunities/apprenticeship-program", checked:"2026-10-03"},

{id:"aramco-summer-school", ct:"sa", sector:"energy", level:["hs"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Saudi Aramco", ar:"أرامكو السعودية"},
 prog:{en:"Summer Training and Tomooh for school students", ar:"التدريب الصيفي وبرنامج طموح لطلبة المدارس"},
 apply:{en:"Not open. Registration closed at 15:00 on Sunday 15 February 2026, and the page says applying is not available after that. The sessions it fed have already run: Tomooh from 5 July to 6 August 2026 and summer training from 19 July to 6 August 2026. No next window is announced.", ar:"غير مفتوح. أُغلق التسجيل الساعة ٣:٠٠ عصرًا يوم الأحد ١٥ فبراير ٢٠٢٦، وتذكر الصفحة أن التقديم غير متاح بعد ذلك. وقد انتهت الدورتان المرتبطتان به: طموح من ٥ يوليو إلى ٦ أغسطس ٢٠٢٦، والتدريب الصيفي من ١٩ يوليو إلى ٦ أغسطس ٢٠٢٦. ولم تُعلن فترة تالية."},
 duration:{en:"Summer training runs three weeks and Tomooh five, delivered virtually in recent rounds.", ar:"التدريب الصيفي ثلاثة أسابيع وطموح خمسة، وقُدّما عن بعد في الدورات الأخيرة."},
 elig:{en:"High school students in the Kingdom. Summer training takes first, second and third year students and requires that the student has not joined before. Tomooh takes first and second year students and additionally requires an English certificate, IELTS, TOEFL or STEP. The age limit of 22 applies to both tracks. The page carries no printed nationality condition in its requirement lists, and describes the program as being for the Kingdom's promising students, so a reader who is not Saudi should ask before investing time.", ar:"طلاب المرحلة الثانوية في المملكة. يقبل التدريب الصيفي طلاب الصف الأول والثاني والثالث ويشترط ألا يكون الطالب قد التحق بالبرنامج سابقًا. ويقبل طموح طلاب الصف الأول والثاني ويشترط إضافة إلى ذلك شهادة في اللغة الإنجليزية: آيلتس أو توفل أو ستِب. وحد العمر ٢٢ سنة ينطبق على المسارين. ولا تحمل الصفحة شرط جنسية مكتوبًا في قوائم المتطلبات، وتصف البرنامج بأنه لطلبة المملكة الواعدين، فمن ليس سعوديًا ينبغي أن يسأل قبل أن يبذل وقته."},
 how:{en:"Online registration on the careers portal.", ar:"تسجيل إلكتروني في بوابة التوظيف."},
 url:"https://www.aramco.com/en/careers/for-saudi-applicants/student-opportunities/high-school-students", checked:"2026-10-03"},

{id:"aramco-uni-internship", ct:"sa", sector:"energy", level:["uni"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Saudi Aramco", ar:"أرامكو السعودية"},
 prog:{en:"University and Vocational College Internship", ar:"التدريب الجامعي وتدريب الكليات التقنية"},
 apply:{en:"A window is named and it has not opened yet. Registration runs from 08:00 on 26 October 2026 to 15:00 on 2 November 2026, and the same window covers both the university and the vocational college tracks. The window appears on the English page, the Arabic page and the vocational college page, and the Arabic names both dates as Mondays, which matches the calendar. Worth coming back to on 26 October.", ar:"هناك فترة محددة لم تُفتح بعد. التسجيل من الساعة ٨:٠٠ صباحًا يوم ٢٦ أكتوبر ٢٠٢٦ إلى الساعة ٣:٠٠ عصرًا يوم ٢ نوفمبر ٢٠٢٦، والفترة نفسها تشمل مسار الجامعات ومسار الكليات التقنية. وترد الفترة في الصفحة الإنجليزية والصفحة العربية وصفحة الكليات التقنية، وتسمي العربية التاريخين يومي إثنين، وهو ما يطابق التقويم. يُستحسن العودة إليها في ٢٦ أكتوبر."},
 duration:{en:"At least eight weeks, as your institution requires, with a monthly stipend, transport, medical cover and housing where available.", ar:"ثمانية أسابيع على الأقل بحسب متطلب مؤسستك، بمكافأة شهرية ونقل وتغطية طبية وسكن حيث يتوفر."},
 elig:{en:"Academically outstanding Saudi students. A copy of a Saudi national identity card is among the required documents, and a letter from the university stating the purpose and duration of the internship is required. The training the school asks for must run at least eight weeks, and an accepted student must not be enrolled in university classes during the training period.", ar:"الطلاب السعوديون المتفوقون دراسيًا. ومن المستندات المطلوبة صورة من الهوية الوطنية السعودية، ويلزم خطاب من الجامعة يوضح الغرض من التدريب ومدته. ويجب ألا تقل مدة التدريب التي تطلبها الجهة التعليمية عن ثمانية أسابيع، وألا يكون الطالب المقبول مسجلًا في مقررات جامعية خلال فترة التدريب."},
 how:{en:"Direct online application with your national ID, transcript and the university letter.", ar:"تقديم إلكتروني مباشر مع الهوية الوطنية وكشف الدرجات ورسالة الجامعة."},
 url:"https://www.aramco.com/en/careers/for-saudi-applicants/student-opportunities/university-and-vocational-college-internship-programs/university-internship-program", checked:"2026-10-03"},

{id:"sabic-coop", ct:"sa", sector:"energy", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"SABIC", ar:"سابك"},
 prog:{en:"Cooperative Training Program", ar:"برنامج التدريب التعاوني"},
 apply:{en:"During registration periods announced on the careers page.", ar:"خلال فترات التسجيل المعلنة في صفحة التوظيف."},
 duration:{en:"As your university requires.", ar:"بحسب متطلب جامعتك."},
 elig:{en:"Unusually for Saudi Arabia, this track prints no nationality rule, while every other track on the same page prints one. Silence is not permission, so a non Saudi reader should ask before planning around it. What the page does require is institutional and it is the condition that actually governs access: the cooperative training must be a graduation requirement of the applicant's own university or college, and the applicant must be nominated by that institution, so a student whose institution does not nominate them has no route. Also a cumulative GPA of at least 2.50 out of 4 or 3.50 out of 5, medical fitness, and that the applicant has not yet graduated.", ar:"على خلاف المعتاد في السعودية، لا يذكر هذا المسار شرط جنسية، في حين يذكره كل مسار آخر في الصفحة نفسها. والسكوت ليس إذنًا، فعلى القارئ غير السعودي أن يسأل قبل أن يخطط على أساسه. وما تشترطه الصفحة فعلًا شرط مؤسسي وهو الذي يحكم الوصول: أن يكون التدريب التعاوني من متطلبات التخرج في جامعة المتقدم أو كليته، وأن ترشّحه تلك الجهة، فمن لا ترشّحه جهته لا طريق له. وكذلك معدل تراكمي لا يقل عن ٢٫٥٠ من ٤ أو ٣٫٥٠ من ٥، واللياقة الطبية، وألا يكون قد تخرج بعد."},
 how:{en:"Your university nominates you, then you apply on the SABIC jobs portal during the window.", ar:"ترشّحك جامعتك، ثم تقدّم في بوابة وظائف سابك خلال الفترة."},
 url:"https://www.sabic.com/en/careers/middle-east-africa/students-and-fresh-graduates", checked:"2026-10-03"},

{id:"sabic-tadarruj", ct:"sa", sector:"energy", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"SABIC", ar:"سابك"},
 prog:{en:"TADARRUJ operator training, and TAMHEER for graduates", ar:"برنامج تدرج لمشغلي المصانع، وتمهير للخريجين"},
 apply:{en:"Intakes are announced on the careers page. The TAMHEER places run through the national fund's platform for three to six months.", ar:"تُعلن الدفعات في صفحة التوظيف. وتُطرح مقاعد تمهير عبر منصة الصندوق الوطني لمدة ثلاثة إلى ستة أشهر."},
 duration:{en:"English and technical training followed by on the job work, with a stipend, housing allowance, transport and medical cover.", ar:"تدريب لغوي وتقني ثم عمل ميداني، بمكافأة وبدل سكن ونقل وتغطية طبية."},
 elig:{en:"TADARRUJ takes Saudi school leavers aged twenty four or less with priority to fresh graduates, and TAMHEER takes Saudi graduates with a GPA of 2.5 out of 4.", ar:"يقبل تدرج خريجي الثانوية السعوديين بعمر أربعة وعشرين فأقل مع أولوية لحديثي التخرج، ويقبل تمهير الخريجين السعوديين بمعدل ٢٫٥ من ٤."},
 how:{en:"Through the SABIC careers portal when an intake opens.", ar:"عبر بوابة توظيف سابك عند فتح الدفعة."},
 url:"https://www.sabic.com/en/careers/middle-east-africa/students-and-fresh-graduates", checked:"2026-10-03"},

{id:"maaden-trainee", ct:"sa", sector:"industry", level:["hs"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Ma'aden", ar:"معادن"},
 prog:{en:"Traineeship Program for women", ar:"برنامج التدريب للنساء"},
 apply:{en:"Could not be verified, twice. The program is not named anywhere on the company's careers site, whose early careers area shows four unlabeled category tiles and no program description, and the job listings would not load on 11 September 2026 or on 3 October 2026. Nothing here is current, and a reader should not plan around this card until the program appears on the company's own site again.", ar:"لم يتسنَّ التحقق، مرتين. لا يُذكر البرنامج في أي موضع من موقع التوظيف في الشركة، وتُظهر منطقة بدايات المسار المهني فيه أربع فئات دون وصف ودون تعريف بالبرامج، ولم تُحمَّل قوائم الوظائف في ١١ سبتمبر ٢٠٢٦ ولا في ٣ أكتوبر ٢٠٢٦. فلا شيء هنا حاليًا، وعلى القارئ ألا يخطط على أساس هذه البطاقة حتى يظهر البرنامج على موقع الشركة نفسها مرة أخرى."},
 duration:{en:"Not published. It feeds operator, technician, laboratory, administrative and industrial security roles, with a realistic path to employment.", ar:"غير منشورة. ويغذي البرنامج وظائف التشغيل والفنيين والمختبرات والإدارة والأمن الصناعي، بمسار واقعي إلى التوظيف."},
 elig:{en:"Saudi women aged twenty five or younger, holding a diploma with a GPA of 2.5 out of 4 or a school certificate at eighty per cent, passing an English test, interview and medical.", ar:"السعوديات بعمر خمسة وعشرين فأقل، من حاملات الدبلوم بمعدل ٢٫٥ من ٤ أو الثانوية بنسبة ٨٠ بالمئة، باجتياز اختبار إنجليزية ومقابلة وفحص طبي."},
 how:{en:"Apply on the program page.", ar:"قدّمي عبر صفحة البرنامج."},
 url:"https://careers.maaden.com/gb/en", checked:"2026-09-11"},

 how:{en:"Apply now on the careers portal.", ar:"قدّم عبر بوابة التوظيف."},
 url:"https://careers.petrorabigh.com/pages/university-college-co-op-program", checked:"2026-09-28"},

 elig:{en:"Not published anywhere reachable on the company's careers site. Its individual cooperative trainee posting is not available and a second careers host returns errors throughout.", ar:"غير منشورة في أي موضع يمكن الوصول إليه في موقع التوظيف لدى الشركة. وإعلان المتدرب التعاوني لديها غير متاح، ويعيد مضيف توظيف ثانٍ أخطاءً في كل مواضعه."},
