{id:"lucid-early-talent", ct:"sa", sector:"industry", level:["uni","grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Lucid Motors", ar:"لوسيد موتورز"},
 prog:{en:"Early Talent: summer internship and technician programs", ar:"المواهب المبكرة: التدريب الصيفي وبرنامج الفنيين"},
 apply:{en:"The page read on 2 October 2026 names the twelve week summer internship and the two year junior maintenance technician program, delivered with national training partners at King Abdullah Economic City. It prints no window.", ar:"تذكر الصفحة المقروءة في ٢ أكتوبر ٢٠٢٦ التدريب الصيفي لمدة اثني عشر أسبوعًا وبرنامج فني الصيانة المبتدئ لمدة سنتين، بالتعاون مع شركاء تدريب وطنيين في مدينة الملك عبدالله الاقتصادية. ولا تطبع أي فترة تقديم."},
 duration:{en:"Twelve weeks for the summer internship, two years for the junior maintenance technician route.", ar:"اثنا عشر أسبوعًا للتدريب الصيفي، وسنتان لمسار فني الصيانة المبتدئ."},
 elig:{en:"Students and technical graduates. The Saudi route runs with the national training fund and the automotive academy, and no GPA or nationality text is published.", ar:"الطلبة وخريجو التخصصات التقنية. ويجري المسار السعودي مع صندوق التدريب الوطني وأكاديمية المركبات، ولا يُنشر شرط معدل أو جنسية."},
 how:{en:"Apply to the early talent postings on the careers board.", ar:"قدّم على إعلانات المواهب المبكرة في لوحة الوظائف."},
 url:"https://lucidmotors.com/careers/early-talent", checked:"2026-10-02"},

{id:"snb-coop", ct:"sa", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Saudi National Bank", ar:"البنك الأهلي السعودي"},
 prog:{en:"Cooperative Training Program", ar:"برنامج التدريب التعاوني"},
 apply:{en:"Intakes follow the university coop semesters.", ar:"تتبع الدفعات فصول التدريب التعاوني الجامعية."},
 duration:{en:"Not published on the page read.", ar:"غير منشورة في الصفحة المقروءة."},
 elig:{en:"Saudi nationals enrolled for a bachelor degree at a university approved by the Ministry of Education, with a grade point average of at least 3.75 out of 5 or 2.75 out of 4, a national identity card, a university letter confirming that cooperative training is required for graduation, and the last semester transcript. The page prints no field of study.", ar:"المواطنون السعوديون المقيدون لدرجة البكالوريوس في جامعة معتمدة من وزارة التعليم، بمعدل لا يقل عن ٣٫٧٥ من ٥ أو ٢٫٧٥ من ٤، مع الهوية الوطنية، وخطاب من الجامعة يفيد أن التدريب التعاوني شرط للتخرج، وكشف درجات الفصل الأخير. ولا تطبع الصفحة أي تخصص."},
 how:{en:"Online application with your CV, national ID, the university letter and your transcript, then an assessment and interview.", ar:"تقديم إلكتروني مع السيرة الذاتية والهوية ورسالة الجامعة وكشف الدرجات، ثم تقييم ومقابلة."},
 url:"https://www.alahli.com/en/pages/about-us/careers/snb-cooperative-training-program", checked:"2026-10-02"},

{id:"snb-rowad", ct:"sa", sector:"finance", level:["grad"], paid:"yes", status:"open", gate:"unstated",
 org:{en:"Saudi National Bank", ar:"البنك الأهلي السعودي"},
 prog:{en:"Rowad Graduate Program", ar:"برنامج رواد للخريجين"},
 apply:{en:"The page states that applications are accepted from 1 January 2026 to 31 December 2026.", ar:"تذكر الصفحة أن الطلبات تُقبل من ١ يناير ٢٠٢٦ إلى ٣١ ديسمبر ٢٠٢٦."},
 duration:{en:"Twelve months: eight of blended learning then four hands on, with a competitive salary and medical insurance.", ar:"اثنا عشر شهرًا: ثمانية تعلم مدمج ثم أربعة عمل ميداني، براتب تنافسي وتأمين طبي."},
 elig:{en:"Fresh graduates. The page prints no GPA, graduation year or nationality rule. It states a competitive salary and medical insurance.", ar:"الخريجون الجدد، ولا تذكر الصفحة شرط معدل ولا سنة تخرج ولا جنسية. وتذكر راتبًا تنافسيًا وتأمينًا طبيًا."},
 how:{en:"The page describes how applications are reviewed but prints no application route, so ask the bank directly or watch its careers page.", ar:"تصف الصفحة كيف تُراجع الطلبات دون أن تنشر طريقة للتقديم، فاسأل البنك مباشرة أو تابع صفحة التوظيف لديه."},
 url:"https://www.alahli.com/en/pages/about-us/careers/snb-rowad-program", checked:"2026-10-01"},

{id:"alrajhi-coop", ct:"sa", sector:"finance", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Al Rajhi Bank", ar:"مصرف الراجحي"},
 prog:{en:"Cooperative Training", ar:"التدريب التعاوني"},
 apply:{en:"A standing posting on the careers portal, open when the page was read.", ar:"إعلان دائم في بوابة التوظيف، وكان مفتوحًا عند التحقق."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"A bachelor's or master's degree with a minimum cumulative GPA of 3 out of 4 or 3 out of 5, cooperative training that forms part of the graduation curriculum, a university coop letter stating the start and end dates, and passing an interview. The page prints no list of majors and no nationality rule.", ar:"درجة بكالوريوس أو ماجستير بمعدل تراكمي لا يقل عن ٣ من ٤ أو ٣ من ٥، وتدريب تعاوني يشكل جزءًا من متطلبات التخرج، وخطاب تدريب من الجامعة يذكر تاريخي البدء والانتهاء، واجتياز مقابلة. ولا تطبع الصفحة قائمة تخصصات ولا شرط جنسية."},
 how:{en:"Apply on the careers portal with your ID, transcript, coop letter and CV, then an interview.", ar:"قدّم عبر بوابة التوظيف مع الهوية وكشف الدرجات ورسالة التدريب والسيرة الذاتية، ثم مقابلة."},
 url:"https://careers.alrajhibank.com.sa/en/page/coop-program/", checked:"2026-09-28"},

{id:"riyad-fursan", ct:"sa", sector:"finance", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Riyad Bank", ar:"بنك الرياض"},
 prog:{en:"Fursan Al Riyad Graduate Program", ar:"برنامج فرسان الرياض"},
 apply:{en:"The bank's own posting for the 2026 program is marked closed or expired, and prints no closing date.", ar:"إعلان البنك نفسه لبرنامج ٢٠٢٦ موسوم بأنه مغلق أو منتهٍ، ولا يطبع موعد إغلاق."},
 duration:{en:"Six months, described on the posting as a structured graduate development program.", ar:"ستة أشهر، ويصفه الإعلان ببرنامج منظم لتطوير الخريجين."},
 elig:{en:"A bachelor or master degree in a relevant field, zero to one year of work experience, and advanced English. The posting prints no nationality rule and no grade point floor.", ar:"درجة بكالوريوس أو ماجستير في تخصص ذي صلة، وخبرة عمل من صفر إلى سنة، وإنجليزية متقدمة. ولا يطبع الإعلان أي شرط جنسية ولا حدًا أدنى للمعدل."},
 how:{en:"Through the bank's careers portal when a new posting opens.", ar:"عبر بوابة التوظيف في البنك حين يُفتح إعلان جديد."},
 url:"https://careers.riyadbank.com/en/saudi-arabia/jobs/2026-fursan-al-riyad-program-1100081721/", checked:"2026-10-02"},

{id:"sab-students", ct:"sa", sector:"finance", level:["uni","grad"], paid:"yes", status:"annual", gate:"unstated",
 org:{en:"SAB", ar:"البنك السعودي الأول"},
 prog:{en:"Student coop and the Digital Intelligence Graduate Program", ar:"التدريب التعاوني وبرنامج خريجي الذكاء الرقمي"},
 apply:{en:"Neither half is open. The cooperative training page shows its apply control as coming soon and disabled, in Arabic qareeban. The graduate program page says applications are closed. Neither page prints a window, a semester or a deadline, so there is no month to watch beyond the pages themselves. Checked in both languages on 3 October 2026.", ar:"لا شقّ منهما مفتوح. تُظهر صفحة التدريب التعاوني زر التقديم بحالة قريبًا ومعطّلًا. وتذكر صفحة برنامج الخريجين أن التقديم مغلق. ولا تذكر أي من الصفحتين فترة ولا فصلًا ولا موعدًا نهائيًا، فلا شهر يُترقب سوى الصفحتين نفسيهما. تم التحقق باللغتين في ٣ أكتوبر ٢٠٢٦."},
 duration:{en:"The graduate program runs six months on a training contract.", ar:"يمتد برنامج الخريجين ستة أشهر بعقد تدريب."},
 elig:{en:"The two halves of this card print different rules. The cooperative training and internship page has an eligibility panel with nothing in it: no nationality rule, no GPA floor, no subject list and no graduation window. The Digital Intelligence Graduate Program, on the bank's graduate page, does print its rules: Saudi nationals, fluent in English and Arabic, a bachelor's degree completed no more than twelve months ago, and a GPA of 3.5 out of 5 or equivalent. So a non Saudi reader is shut out of the graduate program and should ask the bank about the coop.", ar:"يختلف شرطا شقّي هذه البطاقة. صفحة التدريب التعاوني والتدريب الصيفي تضم لوحة أهلية خالية تمامًا: لا شرط جنسية، ولا حد أدنى للمعدل، ولا قائمة تخصصات، ولا فترة تخرج. أما برنامج الذكاء الرقمي للخريجين، في صفحة الخريجين بالبنك، فيذكر شروطه: مواطنون سعوديون، وإتقان الإنجليزية والعربية، وبكالوريوس لم يمضِ على الحصول عليه أكثر من اثني عشر شهرًا، ومعدل ٣٫٥ من ٥ أو ما يعادله. فالقارئ غير السعودي مستبعد من برنامج الخريجين، وعليه أن يسأل البنك عن التدريب التعاوني."},
 how:{en:"Five stages through the bank site: a screening call, an HR interview, a business interview, documentation, then acceptance or rejection.", ar:"خمس مراحل عبر موقع البنك: مكالمة فرز، ومقابلة مع الموارد البشرية، ومقابلة مع الإدارة، واستكمال المستندات، ثم القبول أو الرفض."},
 url:"https://www.sab.com/en/about-us/careers/student-opportunities/", checked:"2026-10-03"},

{id:"bsf-coop", ct:"sa", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Banque Saudi Fransi", ar:"البنك السعودي الفرنسي"},
 prog:{en:"Coop Training", ar:"التدريب التعاوني"},
 apply:{en:"The only posting the bank publishes for this program closed on 27 November 2021 and is marked closed or expired. Nothing newer appears on its careers site.", ar:"الإعلان الوحيد الذي ينشره البنك لهذا البرنامج أُغلق في ٢٧ نوفمبر ٢٠٢١ وهو موسوم بأنه مغلق أو منتهٍ. ولا يظهر ما هو أحدث في موقع التوظيف لديه."},
 duration:{en:"At least sixteen weeks, per that posting.", ar:"ستة عشر أسبوعًا على الأقل، بحسب ذلك الإعلان."},
 elig:{en:"Per that posting, Saudi nationals currently enrolled as senior undergraduates who have not yet graduated, with a minimum grade point average of 3.0 out of 4 or equivalent.", ar:"بحسب ذلك الإعلان، المواطنون السعوديون المقيدون حاليًا في السنة الأخيرة من البكالوريوس ممن لم يتخرجوا بعد، بمعدل لا يقل عن ٣٫٠ من ٤ أو ما يعادله."},
 how:{en:"Per that posting, a cooperative training request letter from the university, a transcript and a CV.", ar:"بحسب ذلك الإعلان، خطاب طلب تدريب تعاوني من الجامعة، وكشف درجات، وسيرة ذاتية."},
 url:"https://www.bsfcareers.sa/en/saudi-arabia/jobs/coop-training-4450203/", checked:"2026-10-02"},

{id:"albilad-coop", ct:"sa", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Bank Albilad", ar:"بنك البلاد"},
 prog:{en:"Cooperative and Summer Training", ar:"التدريب التعاوني والصيفي"},
 apply:{en:"Could not be verified. The bank's training page refused connections on 2 October 2026 and again on 3 October 2026, in both languages, so nothing on this card was rechecked against the source on either day. Treat every detail here as the last reading rather than as current, and confirm with the bank before planning around it.", ar:"لم يتسنَّ التحقق. رفضت صفحة التدريب في البنك الاتصال في ٢ أكتوبر ٢٠٢٦ ومرة أخرى في ٣ أكتوبر ٢٠٢٦، باللغتين، فلم تُراجع أي تفصيلة في هذه البطاقة على المصدر في اليومين. تعامل مع كل ما هنا بوصفه آخر قراءة لا بوصفه حاليًا، وتأكد من البنك قبل التخطيط على أساسه."},
 duration:{en:"Per your university's requirement.", ar:"بحسب متطلب جامعتك."},
 elig:{en:"Saudi bachelor's or diploma students whose university requires the training, with a GPA above 2.5 out of 4 and a university letter with dates.", ar:"الطلبة السعوديون في البكالوريوس أو الدبلوم ممن تشترط جامعتهم التدريب، بمعدل يزيد على ٢٫٥ من ٤، مع رسالة جامعية بالتواريخ."},
 how:{en:"The apply link on the training page, with your ID, transcript and the letter.", ar:"رابط التقديم في صفحة التدريب، مع الهوية وكشف الدرجات والرسالة."},
 url:"https://www.bankalbilad.com.sa/en/about/pages/training.aspx", checked:"2026-08-24"},

{id:"sama-spp", ct:"sa", sector:"finance", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Saudi Central Bank", ar:"البنك المركزي السعودي"},
 prog:{en:"SAMA Professional Program", ar:"برنامج ساما للمهنيين"},
 apply:{en:"The program page prints no window, no closing date and no statement that it is open or closed.", ar:"لا تطبع صفحة البرنامج أي فترة تقديم ولا موعد إغلاق ولا بيانًا بأنه مفتوح أو مغلق."},
 duration:{en:"Not verified on the page read.", ar:"لم يجرِ التحقق منها في الصفحة المقروءة."},
 elig:{en:"Saudi nationals holding a bachelor or master degree in a required specialization, with a university grade of at least very good or equivalent, who are fresh graduates of the 2025 to 2026 class. English is required, with a preference for IELTS 6.0 or TOEFL iBT 60.", ar:"المواطنون السعوديون من حملة البكالوريوس أو الماجستير في تخصص مطلوب، بتقدير جامعي لا يقل عن جيد جدًا أو ما يعادله، من خريجي دفعة ٢٠٢٥ إلى ٢٠٢٦ الجدد. ويُشترط إتقان الإنجليزية، ويُفضل آيلتس ٦٫٠ أو توفل آي بي تي ٦٠."},
 how:{en:"Four stages printed on the page: application, an assessment center, a personal and technical interview, then preparation and onboarding.", ar:"أربع مراحل مطبوعة في الصفحة: التقديم، ثم مركز تقييم، ثم مقابلة شخصية وفنية، ثم الإعداد والالتحاق."},
 url:"https://sama.gov.sa/en-US/SPP/Pages/default.aspx", checked:"2026-10-02"},

{id:"cma-gdp", ct:"sa", sector:"finance", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Capital Market Authority", ar:"هيئة السوق المالية"},
 prog:{en:"Graduates Development Program", ar:"برنامج تأهيل الخريجين المتفوقين"},
 apply:{en:"Not open. The seventeenth batch took applications from 6 May 2026 to 30 May 2026 and started on 9 August 2026, both dates from the authority's own announcement. No eighteenth batch has been announced, and the authority has published nothing on the program since. The careers subdomain this card used to point at now times out, so the card points at the authority's own program page instead.", ar:"غير مفتوح. استقبلت الدفعة السابعة عشرة الطلبات من ٦ مايو ٢٠٢٦ إلى ٣٠ مايو ٢٠٢٦ وبدأت في ٩ أغسطس ٢٠٢٦، والتاريخان من إعلان الهيئة نفسها. ولم تُعلن دفعة ثامنة عشرة، ولم تنشر الهيئة شيئًا عن البرنامج بعد ذلك. ونطاق التوظيف الذي كانت تشير إليه هذه البطاقة لم يعد يستجيب، فأصبحت تشير إلى صفحة البرنامج على موقع الهيئة."},
 duration:{en:"Twelve months, paid twelve thousand riyals a month for bachelor's holders and fourteen and a half for master's, with insurance and professional certification support.", ar:"اثنا عشر شهرًا، براتب اثني عشر ألف ريال شهريًا للبكالوريوس وأربعة عشر ألفًا وخمسمئة للماجستير، مع تأمين ودعم للشهادات المهنية."},
 elig:{en:"Saudi national, full time, with a bachelor's, master's or higher diploma in the required majors issued or approved by the Ministry of Education. The grade point average must be at least very good or equivalent. Age is capped at 27 for a bachelor's holder provided no more than two years have passed since graduation, and at 30 for a master's or higher diploma holder provided no more than one year has. An English test result is required at IELTS 5, TOEFL internet 64, TOEFL computer 180, TOEFL paper 500, Bulats 60 or STEP 83. A General Aptitude Test or Post Graduate General Aptitude Test result from the National Center for Measurement must be presented; the page sets no minimum score for it. Interviews follow.", ar:"سعودي الجنسية، بدوام كامل، ويحمل بكالوريوس أو ماجستير أو دبلومًا عاليًا في التخصصات المطلوبة صادرًا أو معتمدًا من وزارة التعليم. ويجب أن يكون المعدل التراكمي جيد جدًا على الأقل أو ما يعادله. ويُشترط ألا يزيد عمر حامل البكالوريوس على ٢٧ سنة وألا يمضي على تخرجه أكثر من سنتين، وألا يزيد عمر حامل الماجستير أو الدبلوم العالي على ٣٠ سنة وألا تمضي على تخرجه أكثر من سنة. ويلزم تقديم نتيجة اختبار في اللغة الإنجليزية: آيلتس ٥، أو توفل إلكتروني ٦٤، أو توفل محوسب ١٨٠، أو توفل ورقي ٥٠٠، أو بولاتس ٦٠، أو ستِب ٨٣. ويلزم تقديم نتيجة اختبار القدرات العامة أو القدرات العامة للجامعيين من المركز الوطني للقياس، ولا تحدد الصفحة درجة أدنى له. ثم المقابلات الشخصية."},
 how:{en:"Online application with CV and questionnaire.", ar:"تقديم إلكتروني بالسيرة الذاتية واستبيان."},
 url:"https://cma.gov.sa/en/ContactWithCMA/Pages/GDP.aspx", checked:"2026-10-03"},

{id:"cma-coop", ct:"sa", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Capital Market Authority", ar:"هيئة السوق المالية"},
 prog:{en:"Cooperative Training", ar:"التدريب التعاوني"},
 apply:{en:"No window is published. The authority names cooperative training among its programs and routes applications through its recruitment portal, but neither the portal nor the authority's announcements showed an open semester on 3 October 2026, and the portal's vacancy list would not render. A reachable form is not an open round.", ar:"لا تُنشر فترة تقديم. تذكر الهيئة التدريب التعاوني بين برامجها وتوجّه الطلبات عبر بوابة التوظيف، لكن لا البوابة ولا إعلانات الهيئة أظهرت فصلًا مفتوحًا في ٣ أكتوبر ٢٠٢٦، ولم تُحمَّل قائمة الوظائف في البوابة. ووجود نموذج يعمل لا يعني أن هناك جولة مفتوحة."},
 duration:{en:"A semester.", ar:"فصل دراسي."},
 elig:{en:"Saudi full time students with a GPA of very good or above and a university training accreditation letter.", ar:"الطلبة السعوديون المنتظمون بتقدير جيد جدًا فأعلى ورسالة اعتماد تدريب من الجامعة."},
 how:{en:"Apply now on the coop page.", ar:"قدّم عبر صفحة التدريب التعاوني."},
 url:"https://cma.gov.sa/en/ContactWithCMA/Pages/Careers.aspx", checked:"2026-10-03"},

{id:"hassana-programmes", ct:"sa", sector:"finance", level:["uni","grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Hassana Investment Company", ar:"شركة حصانة الاستثمارية"},
 prog:{en:"Graduate and Cooperative Programs", ar:"برنامجا الخريجين والتدريب التعاوني"},
 apply:{en:"Applications are taken by email and no window is published. The Saudi nationality rule on the page covers the cooperative training track, and the graduate program prints no rule of its own.", ar:"تُقبل الطلبات بالبريد الإلكتروني ولا تُنشر فترة محددة. وشرط الجنسية السعودية في الصفحة يخص مسار التدريب التعاوني، ولا ينشر برنامج الخريجين شرطًا خاصًا به."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"The two routes print different rules. The cooperative training program is printed for Saudi students. The graduate development program prints no nationality rule and no other eligibility criterion.", ar:"تطبع الطريقتان شرطين مختلفين. فبرنامج التدريب التعاوني مطبوع للطلبة السعوديين. أما برنامج تطوير الخريجين فلا يطبع شرط جنسية ولا أي شرط أهلية آخر."},

{id:"tuwaiq-bootcamps", ct:"sa", sector:"tech", level:["grad"], paid:"no", status:"open", gate:"nationals",

 prog:{en:"Employment linked technology bootcamps", ar:"معسكرات التقنية المرتبطة بالتوظيف"},
 apply:{en:"Open. Nine adult bootcamps were listed as taking registrations on 2 October 2026, the nearest starting 11 October and 1 November 2026, and the page loads more beyond those nine. Every one of the nine carries a fee notice.", ar:"مفتوح. تسعة معسكرات للكبار كانت مدرجة بوصفها تستقبل التسجيل في ٢ أكتوبر ٢٠٢٦، وأقربها يبدأ في ١١ أكتوبر و١ نوفمبر ٢٠٢٦، وتحمّل الصفحة مزيدًا بعد التسعة. وكل واحد من التسعة يحمل إشارة إلى وجود رسوم."},
 duration:{en:"Four to forty one weeks depending on the bootcamp. The offer is the training itself and there is no wage.", ar:"من أربعة إلى واحد وأربعين أسبوعًا بحسب المعسكر. والمعروض هو التدريب نفسه دون أجر."},
 elig:{en:"Four of the nine bootcamp pages were read in full on 2 October 2026 and each one prints that the applicant must be a Saudi national. Each also requires a bachelor degree in a technical field, a good level of English and a personal laptop, and one of the four requires passing an entrance test. Acceptance stays at the academy's discretion.", ar:"قُرئت أربع من صفحات المعسكرات التسعة كاملة في ٢ أكتوبر ٢٠٢٦، وكل واحدة تطبع أن يكون المتقدم سعودي الجنسية. وتشترط كل منها كذلك درجة البكالوريوس في تخصص تقني، ومستوى جيدًا في اللغة الإنجليزية، وجهاز حاسب محمول شخصيًا، وتشترط واحدة منها اجتياز اختبار قبول. ويبقى القبول تقديريًا للأكاديمية."},
 how:{en:"Register on the platform and apply per bootcamp. The four pages read were all in person at the Riyadh headquarters.", ar:"سجّل في المنصة وقدّم على كل معسكر. والصفحات الأربع المقروءة كلها حضورية في المقر الرئيسي بالرياض."},
 url:"https://tuwaiq.edu.sa/bootcamps", checked:"2026-10-02"},

 org:{en:"Apple Developer Academy at Tuwaiq", ar:"أكاديمية آبل للمطورين في طويق"},
 prog:{en:"Foundation Program in iOS development", ar:"البرنامج التأسيسي في تطوير iOS"},
 apply:{en:"Open. The academy page was opened in a browser on 2 October 2026 and marks the four week Foundation program as open with thirty seats a month, while the nine month Academy program is marked closed and is printed as starting in September.", ar:"مفتوح. فُتحت صفحة الأكاديمية في متصفح في ٢ أكتوبر ٢٠٢٦ وتضع البرنامج التأسيسي ذا الأسابيع الأربعة في حالة مفتوح بثلاثين مقعدًا شهريًا، بينما برنامج الأكاديمية ذو الأشهر التسعة في حالة مغلق ويُطبع أنه يبدأ في سبتمبر."},
 duration:{en:"The Foundation program runs four weeks at twenty hours a week, Sunday to Thursday, at the academy in Princess Nourah University in Riyadh. The page prints that a full scholarship is awarded to those who qualify.", ar:"يمتد البرنامج التأسيسي أربعة أسابيع بواقع عشرين ساعة أسبوعيًا، من الأحد إلى الخميس، في الأكاديمية بجامعة الأميرة نورة في الرياض. وتطبع الصفحة أن منحة كاملة تُمنح لمن يجتزن القبول."},
 elig:{en:"The page prints that the academy is open to all females aged eighteen and above, regardless of coding knowledge or background, and that the Foundation program has no prerequisites. It prints no nationality rule.", ar:"تطبع الصفحة أن الأكاديمية مفتوحة لجميع الإناث بعمر ثمانية عشر عامًا فأكثر، بغض النظر عن معرفتهن بالبرمجة أو خلفيتهن، وأن البرنامج التأسيسي بلا متطلبات سابقة. ولا تطبع أي شرط جنسية."},
 how:{en:"Register on the academy site. Selection includes an assessment test, and the page points to Swift preparation material to review beforehand.", ar:"سجّل في موقع الأكاديمية. ويشمل الاختيار اختبار تقييم، وتحيل الصفحة إلى مواد إعداد في لغة سويفت لمراجعتها قبله."},

 duration:{en:"Not published.", ar:"غير منشورة."},

 prog:{en:"Mustaqbalak Consulting Coop", ar:"برنامج مستقبلك للتدريب التعاوني"},
 apply:{en:"Open now: applications for the January to March 2027 cycle close on 10 October 2026, with January, June and September start dates. Riyadh is the only office offering it.", ar:"مفتوح الآن: يُغلق التقديم لدورة يناير إلى مارس ٢٠٢٧ في ١٠ أكتوبر ٢٠٢٦، ببدايات في يناير ويونيو وسبتمبر. والبرنامج في مكتب الرياض وحده."},
 duration:{en:"Four to seven months depending on your university, with a monthly salary and health insurance.", ar:"من أربعة إلى سبعة أشهر بحسب جامعتك، براتب شهري وتأمين صحي."},
 elig:{en:"Saudi nationals currently enrolled in schools inside the Kingdom who are required to complete coop training before graduation. Saudis studying abroad are directed to the summer Associate Consultant internship program instead. Riyadh is the only office offering this program. The page prints a monthly salary and enrollment in the health insurance program.", ar:"السعوديون المقيدون حاليًا في مؤسسات تعليمية داخل المملكة والمطالبون بإتمام تدريب تعاوني قبل التخرج. أما السعوديون الدارسون في الخارج فتوجّههم الصفحة إلى برنامج التدريب الصيفي لمستشار مشارك. والرياض هي المكتب الوحيد الذي يقدم هذا البرنامج. وتطبع الصفحة راتبًا شهريًا واشتراكًا في برنامج التأمين الصحي."},
 how:{en:"Online application with CV, cover letter and transcript, then a first round of three interviews covering behavior, a case and market sizing, and a final round of two case interviews.", ar:"تقديم إلكتروني بالسيرة الذاتية ورسالة التغطية وكشف الدرجات، ثم جولة أولى من ثلاث مقابلات تشمل مقابلة سلوكية وحالة وتقدير حجم سوق، وجولة نهائية من مقابلتي حالة."},
 url:"https://www.bain.com/careers/work-with-us/internships-programs/mustaqbalak-consulting-coop/", checked:"2026-10-01"},

{id:"saudia-technic-coop", ct:"sa", sector:"aviation", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Saudia Technic", ar:"السعودية الهندسية"},
 prog:{en:"Cooperative and Summer Training", ar:"التدريب التعاوني والصيفي"},
 apply:{en:"Nothing to apply to. The careers portal carried ten postings on 3 October 2026 and not one was a cooperative or summer training place; a training program link exists with no positions under it. Every posting on the portal that day had a closing date in June 2026, already past, so a reader who clicks through finds nothing live.", ar:"لا يوجد ما يُقدَّم عليه. حملت بوابة التوظيف عشر فرص في ٣ أكتوبر ٢٠٢٦ ولم تكن أي منها تدريبًا تعاونيًا ولا تدريبًا صيفيًا، ويوجد رابط لبرنامج تدريب لا تحته فرص. وكل فرصة على البوابة في ذلك اليوم كان موعد إغلاقها في يونيو ٢٠٢٦، أي مضى، فمن ينقر لا يجد شيئًا قائمًا."},
 duration:{en:"Per the training letter from your institution.", ar:"بحسب رسالة التدريب من مؤسستك."},
 elig:{en:"Saudi students in the final stages of graduation with a GPA of 2.75 out of 4 or 3.75 out of 5, across all majors.", ar:"الطلبة السعوديون في المراحل الأخيرة من التخرج بمعدل ٢٫٧٥ من ٤ أو ٣٫٧٥ من ٥، في جميع التخصصات."},
 how:{en:"Apply on the careers portal when a posting is live.", ar:"قدّم عبر بوابة التوظيف عند فتح الإعلان."},
 url:"https://careers.saudiatechnic.com/", checked:"2026-10-03"},

{id:"flynas-pilots", ct:"sa", sector:"aviation", level:["hs"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"flynas", ar:"طيران ناس"},
 prog:{en:"Future Pilots Program", ar:"برنامج طياري المستقبل"},
 apply:{en:"Not open. The most recent announcement in the airline's media center is still the 2024 batch, which closed on 26 February 2024. The page prints no cost, no fee and no training bond, and no later batch is published. The separate cadet portal could not be read on 3 October 2026, so a batch announced only there would not show here.", ar:"غير مفتوح. ما زال أحدث إعلان في المركز الإعلامي للناقل هو دفعة ٢٠٢٤ التي أُغلقت في ٢٦ فبراير ٢٠٢٤. ولا تذكر الصفحة تكلفة ولا رسومًا ولا التزامًا ماليًا مقابل التدريب، ولم تُنشر دفعة لاحقة. ولم يتسنَّ قراءة بوابة الطلاب المنفصلة في ٣ أكتوبر ٢٠٢٦، فالدفعة التي تُعلن فيها وحدها لن تظهر هنا."},
 duration:{en:"Multi year theoretical and practical training to a commercial license with instrument rating, including two hundred and forty flight hours, ending as a flynas co pilot.", ar:"تدريب نظري وعملي متعدد السنوات حتى الرخصة التجارية مع أهلية الطيران الآلي، بمئتين وأربعين ساعة طيران، وينتهي بوظيفة مساعد طيار في الشركة."},
 elig:{en:"This is not an entry level cadet scheme. The page requires an existing commercial license and logged hours: a GACA or ICAO equivalent multi engine land CPL with instrument rating, a total of at least 240 flight hours made up of 215 single engine and 25 multi engine, a valid GACA first class medical certificate, and an English language proficiency test. Saudi men and women. A school leaver with no license does not meet this.", ar:"هذا ليس برنامج طلاب طيران مبتدئين. تطلب الصفحة رخصة تجارية قائمة وساعات طيران مسجلة: رخصة طيار تجاري متعدد المحركات مع إجازة الطيران الآلي صادرة من الطيران المدني السعودي أو ما يعادلها دوليًا، وما لا يقل عن ٢٤٠ ساعة طيران إجمالًا منها ٢١٥ ساعة أحادي المحرك و٢٥ ساعة متعدد المحركات، وشهادة طبية من الدرجة الأولى سارية من الطيران المدني السعودي، واختبار إتقان اللغة الإنجليزية. للسعوديين والسعوديات. ومن تخرج من الثانوية دون رخصة طيران لا تنطبق عليه هذه الشروط."},
 how:{en:"Apply on the cadet portal during an open window.", ar:"قدّم عبر بوابة المتدربين خلال فترة مفتوحة."},
 url:"https://www.flynas.com/en/media-center/news-updates/future-piolts", checked:"2026-10-03"},

{id:"flynas-engineers", ct:"sa", sector:"aviation", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"flynas", ar:"طيران ناس"},
 prog:{en:"Future Engineers Program", ar:"برنامج مهندسي المستقبل"},
 apply:{en:"The airline's own announcement of the second batch, dated March 2024, says those candidates had already started training in January 2024. It prints no window, no closing date and no application route, and the careers site does not list the program.", ar:"يذكر إعلان شركة الطيران نفسها عن الدفعة الثانية، المؤرخ في مارس ٢٠٢٤، أن أولئك المرشحين كانوا قد بدأوا التدريب في يناير ٢٠٢٤. ولا يطبع أي فترة تقديم ولا موعد إغلاق ولا مسار تقديم، ولا يدرج موقع التوظيف البرنامج."},
 duration:{en:"Per that announcement, six months for master degree holders, twelve months for bachelor degree holders and four years for diploma holders.", ar:"بحسب ذلك الإعلان، ستة أشهر لحملة الماجستير، واثنا عشر شهرًا لحملة البكالوريوس، وأربع سنوات لحملة الدبلوم."},
 elig:{en:"Per that announcement, Saudi candidates holding a diploma, bachelor or master degree in aeronautical science and engineering or aviation technology, with priority to holders of a General Authority of Civil Aviation license in the specialty.", ar:"بحسب ذلك الإعلان، مرشحون سعوديون من حملة الدبلوم أو البكالوريوس أو الماجستير في علوم وهندسة الطيران أو تقنية الطيران، مع الأولوية لحاملي رخصة الهيئة العامة للطيران المدني في التخصص."},
 how:{en:"Watch the airline's careers page.", ar:"تابع صفحة التوظيف في شركة الطيران."},
 url:"https://www.flynas.com/en/media-center/news-updates/flynas-accepts-22-saudi-candidates-for-the-second-batch-of-the-future-engineers-program", checked:"2026-10-02"},

{id:"riyadhair-nawat", ct:"sa", sector:"aviation", level:["hs"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Riyadh Air", ar:"طيران الرياض"},
 prog:{en:"NAWAT Cabin Crew Program", ar:"برنامج نواة لطاقم الضيافة"},

 duration:{en:"Eight months of training guaranteed to lead to employment, with an internationally recognized cabin crew qualification.", ar:"ثمانية أشهر من التدريب المضمون بالتوظيف بعده، بشهادة طاقم ضيافة معترف بها دوليًا."},
 elig:{en:"The page prints no eligibility rule and no nationality rule. It describes the program as preparing the next generation of Saudi cabin crew, which is a description of the intent rather than a rule. Training runs with Bunyan for Training Company and leads to a recognized cabin crew qualification, and the page states that training is guaranteed to lead to employment on successful completion.", ar:"لا تذكر الصفحة شرط أهلية ولا شرط جنسية. وتصف البرنامج بأنه يعد الجيل القادم من مضيفي ومضيفات الطيران السعوديين، وهذا وصف للغرض لا شرط. ويجري التدريب بالتعاون مع شركة بنيان للتدريب ويؤدي إلى مؤهل معتمد لطاقم الضيافة، وتذكر الصفحة أن التدريب يفضي إلى التوظيف عند إتمامه بنجاح."},
 how:{en:"Apply through the careers page vacancies.", ar:"قدّم عبر شواغر صفحة التوظيف."},
 url:"https://www.riyadhair.com/en/careers", checked:"2026-09-28"},

{id:"rac-coop", ct:"sa", sector:"aviation", level:["uni","grad"], paid:"unknown", status:"annual", gate:"unstated",

 prog:{en:"Coop and Trainee Programs", ar:"برامج التدريب التعاوني والمتدربين"},
 apply:{en:"Nothing to apply to. The company's jobs portal held zero open positions of any kind on 3 October 2026, cooperative training included, and requirements are published per posting, so there is no requirements text in existence to read today. Graduate places run through the national Tamheer scheme, which the Human Resources Development Fund restricts to Saudi nationals; that is the fund's rule rather than the company's, but it governs that route.", ar:"لا يوجد ما يُقدَّم عليه. لم تحمل بوابة وظائف الشركة أي فرصة مفتوحة من أي نوع في ٣ أكتوبر ٢٠٢٦، ومنها التدريب التعاوني، والشروط تُنشر مع كل فرصة، فلا يوجد اليوم نص شروط يمكن قراءته. وتمر فرص الخريجين عبر برنامج تمهير الوطني، وصندوق تنمية الموارد البشرية يقصره على السعوديين، وهذا شرط الصندوق لا شرط الشركة لكنه يحكم ذلك المسار."},

 elig:{en:"University coop students and graduates. Criteria appear per posting.", ar:"طلبة التدريب التعاوني والخريجون، وتظهر الشروط في كل إعلان."},
 how:{en:"Apply on the company jobs portal.", ar:"قدّم عبر بوابة وظائف الشركة."},
 url:"https://www.riyadhairports.com/en/careers", checked:"2026-10-03"},

{id:"kfshrc-training", ct:"sa", sector:"health", level:["uni"], paid:"unknown", status:"open", gate:"unstated",

 prog:{en:"Internship, practicum and summer training, non medical", ar:"التدريب والتطبيق والتدريب الصيفي لغير الأطباء"},

 duration:{en:"Not published. The page prints no length.", ar:"غير منشورة. لا تطبع الصفحة مدة."},
 elig:{en:"Non medical interns enrolled at academic institutions. A grade point average of 3 and above is printed for the summer training programs. Three types are printed: internship training, practicum training and summer training. The page prints no nationality rule.", ar:"المتدربون من غير الأطباء المقيدون في مؤسسات أكاديمية. ويُطبع معدل تراكمي من ٣ فأعلى لبرامج التدريب الصيفي. وتُطبع ثلاثة أنواع: التدريب الداخلي، والتدريب التطبيقي، والتدريب الصيفي. ولا تطبع الصفحة أي شرط جنسية."},
 how:{en:"Apply on the hospital's training portal, or email the training department in your city.", ar:"قدّم عبر بوابة التدريب لدى المستشفى، أو راسل إدارة التدريب في مدينتك."},
 url:"https://services.kfshrc.edu.sa/en/home/edu/nonphysicianinternshipprograms", checked:"2026-10-01"},

{id:"hmg-training", ct:"sa", sector:"health", level:["uni"], paid:"unknown", status:"open", gate:"unstated",

 prog:{en:"Undergraduate clinical and non clinical training", ar:"تدريب طلبة البكالوريوس السريري وغير السريري"},
 apply:{en:"No application window is published. Applications go through the group's academy platform, and your university can submit for you or you can apply yourself.", ar:"لا يُنشر موعد للتقديم. ويمر التقديم عبر منصة أكاديمية المجموعة، ويمكن لجامعتك أن تقدّم نيابة عنك أو أن تتقدم بنفسك."},

 elig:{en:"The page prints no GPA, no nationality rule and no academic level requirement. The fields named are medicine and surgery, paramedical services, nursing, pharmacy, and non clinical and administrative roles covering quality, finance, human resources and healthcare administration. A separate practice transition program is printed for nursing and midwifery interns.", ar:"لا تطبع الصفحة معدلًا ولا شرط جنسية ولا مستوى أكاديميًا مطلوبًا. والمجالات المذكورة هي الطب والجراحة، والخدمات الطبية المساندة، والتمريض، والصيدلة، والأدوار غير السريرية والإدارية التي تشمل الجودة والمالية والموارد البشرية وإدارة الرعاية الصحية. ويُطبع برنامج منفصل للانتقال إلى الممارسة لمتدربي التمريض والقبالة."},
 how:{en:"Universities can submit their students' applications through a university administration portal, and students and recent graduates may apply individually. The page prints undergrad.training@drsulaimanalhabib.com and a telephone number.", ar:"يمكن للجامعات تقديم طلبات طلبتها عبر بوابة إدارية خاصة بالجامعات، ويمكن للطلبة والخريجين الجدد التقديم بصفة فردية. وتطبع الصفحة undergrad.training@drsulaimanalhabib.com ورقم هاتف."},

 how:{en:"Sign in to the ministry portal through Nafath, open the health practitioner training program and complete the application form. The service card gives a processing time of 77 working days.", ar:"سجّل الدخول إلى بوابة الوزارة عبر نفاذ، وافتح برنامج تدريب الممارسين الصحيين وعبّئ نموذج الطلب. وتذكر بطاقة الخدمة مدة إنجاز تبلغ ٧٧ يوم عمل."},

 duration:{en:"Up to eighteen months with continuous assessment and mentoring.", ar:"حتى ثمانية عشر شهرًا بتقييم مستمر وإرشاد."},
 elig:{en:"The page describes the program as being for young nationals and names no country, and its apply links cover nine countries including Saudi Arabia.", ar:"تصف الصفحة البرنامج بأنه للمواطنين الشباب ولا تذكر أي دولة، وروابط التقديم فيها تغطي تسع دول منها السعودية."},
 how:{en:"Through the careers portal.", ar:"عبر بوابة التوظيف."},
 url:"https://www.savola.com/en/careers", checked:"2026-10-02"},

{id:"nadec-coop", ct:"sa", sector:"industry", level:["uni"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"NADEC", ar:"نادك"},
 prog:{en:"Coop Training Request", ar:"طلب التدريب التعاوني"},
 apply:{en:"A standing form where you propose your own start and end dates.", ar:"نموذج دائم تقترح فيه تاريخي البدء والانتهاء بنفسك."},
 duration:{en:"As you propose on the form.", ar:"كما تقترح في النموذج."},
 elig:{en:"The page prints no eligibility rule and no list of fields. The form takes a free text academic major and an assigned department, along with a national identifier, date of birth, city, university name, academic degree and GPA. The surrounding text describes training plans to qualify Saudi students, which is a description rather than a printed rule.", ar:"لا تطبع الصفحة أي شرط أهلية ولا قائمة تخصصات. ويأخذ النموذج التخصص الأكاديمي والإدارة المطلوبة كحقلين نصيين، إلى جانب رقم الهوية وتاريخ الميلاد والمدينة واسم الجامعة والدرجة العلمية والمعدل. أما النص المحيط فيصف خططًا لتأهيل الطلبة السعوديين، وهو وصف لا شرط مطبوع."},
 how:{en:"Fill the coop request form online.", ar:"عبّئ نموذج طلب التدريب إلكترونيًا."},
 url:"https://www.nadec.com/en/form/nadec-coop-training-request", checked:"2026-10-01"},

{id:"whitecase-sa-trainee", ct:"sa", sector:"legal", level:["grad"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"White and Case", ar:"وايت آند كيس"},
 prog:{en:"Saudi Law Trainee Program", ar:"برنامج المتدربين في القانون السعودي"},
 apply:{en:"Applications opened on 1 September 2026. The page says closing deadlines vary depending on which process you apply for, and prints no single deadline. Trainees join one of two intakes, in September or in March.", ar:"فُتح التقديم في ١ سبتمبر ٢٠٢٦. وتذكر الصفحة أن مواعيد الإغلاق تختلف بحسب المسار الذي تقدّم إليه، ولا تذكر موعدًا واحدًا. وينضم المتدربون إلى إحدى دفعتين، في سبتمبر أو في مارس."},
 duration:{en:"Not published. The page prints that coop interns are paid a competitive stipend, and prints no figure for it.", ar:"غير منشورة. وتذكر الصفحة أن متدربي التدريب التعاوني يتقاضون مكافأة تنافسية، دون ذكر مبلغها."},
 elig:{en:"Students and graduates with an LLB from a Saudi university who are seeking the Saudi license to practice, with a minimum GPA of 3.5 out of 4.0 or 4.5 out of 5.0, native Arabic fluency in writing and speech, and a stated commitment to an international legal career including an international LLM before consideration for an associate role. The page prints that coop interns are paid a competitive stipend to cover expenses during the program. The page prints no nationality rule.", ar:"الطلبة والخريجون الحاصلون على بكالوريوس الحقوق من جامعة سعودية والساعون إلى رخصة المحاماة السعودية، بمعدل لا يقل عن ٣٫٥ من ٤٫٠ أو ٤٫٥ من ٥٫٠، وإتقان العربية كلغة أم كتابة وحديثًا، والتزام معلن بمسار قانوني دولي يشمل ماجستير قانون دولي قبل النظر في وظيفة محامٍ مشارك. وتطبع الصفحة أن متدربي التدريب التعاوني يتقاضون بدلًا تنافسيًا لتغطية النفقات خلال البرنامج. ولا تطبع الصفحة أي شرط جنسية."},
 how:{en:"Online application on the firm's Saudi careers page.", ar:"تقديم إلكتروني في صفحة التوظيف السعودية لدى المكتب."},
 url:"https://www.whitecase.com/careers/locations/saudi-arabia/saudi-law-trainee-program", checked:"2026-10-01"},

{id:"aoshearman-sa-coop", ct:"sa", sector:"legal", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"A and O Shearman", ar:"إيه آند أو شيرمان"},
 prog:{en:"Saudi Cooperative Training Program", ar:"برنامج التدريب التعاوني في السعودية"},
 apply:{en:"Open now. The page carries a live Apply now control to the Co-op Scheme Winter 2026 posting and prints the winter window as September 2026 to November 2026, with interviews on a rolling basis through November and December. The scheme begins in either December or January depending on university term dates.", ar:"مفتوح الآن. تحمل الصفحة زر تقديم فعالًا إلى إعلان برنامج التدريب التعاوني لشتاء ٢٠٢٦، وتطبع فترة الشتاء من سبتمبر ٢٠٢٦ إلى نوفمبر ٢٠٢٦، مع مقابلات تباعًا خلال نوفمبر وديسمبر. ويبدأ البرنامج في ديسمبر أو يناير بحسب مواعيد الفصل الدراسي في الجامعة."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"Fluent Arabic with business English. The page prints no nationality rule, no GPA floor and no pay. The placement is in Riyadh, and the page says performance on the scheme forms the basis of the assessment for a trainee associate role.", ar:"إجادة العربية مع إنجليزية الأعمال. ولا تنشر الصفحة شرط جنسية ولا حدًا أدنى للمعدل ولا أجرًا. والتدريب في الرياض، وتذكر الصفحة أن الأداء في البرنامج هو أساس التقييم للحصول على وظيفة محامٍ متدرب."},
 how:{en:"Through the firm's Saudi coop page. The Co-op Scheme Winter 2026 posting was live on 28 September 2026, so apply now rather than waiting for one to appear.", ar:"عبر صفحة التدريب التعاوني السعودية لدى المكتب. وكان إعلان برنامج شتاء ٢٠٢٦ قائمًا في ٢٨ سبتمبر ٢٠٢٦، فقدّم الآن دون انتظار إعلان جديد."},
 url:"https://careers.aoshearman.com/en/saudi-arabia-coop-program", checked:"2026-10-01"},

{id:"aramco-consulting-championship", ct:"sa", sector:"consulting", level:["uni"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"Saudi Aramco", ar:"أرامكو السعودية"},
 prog:{en:"Consulting Championship 2026", ar:"بطولة الاستشارات ٢٠٢٦"},
 apply:{en:"Registration has closed. The page prints a registration deadline extended to September 17, 2026, which has passed, and the Aramco careers index no longer lists the championship. The page still shows a Register now control, so the control alone does not mean the round is open. The printed timeline runs on to a case briefing on Sep 13, a first case submission on Oct 12, round one results Oct 25 to 28, judging panel presentations Nov 1 to 3, and a grand finale Dec 6 to 7.", ar:"أُغلق التسجيل. تطبع الصفحة موعدًا نهائيًا للتسجيل مُمددًا إلى ١٧ سبتمبر ٢٠٢٦، وقد انقضى، ولم تعد صفحة التوظيف في أرامكو تذكر البطولة. ولا يزال زر التسجيل ظاهرًا على الصفحة، فوجود الزر وحده لا يعني أن الجولة مفتوحة. ويمتد الجدول المطبوع إلى جلسة تعريف بالحالة في ١٣ سبتمبر، وتسليم الحالة الأولى في ١٢ أكتوبر، ونتائج الجولة الأولى من ٢٥ إلى ٢٨ أكتوبر، وعروض لجنة التحكيم من ١ إلى ٣ نوفمبر، والنهائي في ٦ و٧ ديسمبر."},
 duration:{en:"A competition running to a final in December, with internship offers for the winners rather than a placement for everyone who enters.", ar:"مسابقة تمتد حتى نهائي في ديسمبر، بعروض تدريب للفائزين لا بتدريب لكل من يشارك."},
 elig:{en:"Teams of four to five students from ten named universities: King Fahd University of Petroleum and Minerals, Imam Abdulrahman Bin Faisal University, Prince Mohammad Bin Fahd University, King Faisal University, Umm Al-Qura University, King Abdulaziz University, King Khalid University, King Saud University, Prince Sultan University and Prince Sattam Bin Abdulaziz University. Each member needs a valid .edu.sa email address matching the selected university. The page prints that students from all majors are eligible and prints no nationality rule.", ar:"فرق من أربعة إلى خمسة طلبة من عشر جامعات مذكورة بالاسم: جامعة الملك فهد للبترول والمعادن، وجامعة الإمام عبدالرحمن بن فيصل، وجامعة الأمير محمد بن فهد، وجامعة الملك فيصل، وجامعة أم القرى، وجامعة الملك عبدالعزيز، وجامعة الملك خالد، وجامعة الملك سعود، وجامعة الأمير سلطان، وجامعة الأمير سطام بن عبدالعزيز. ويلزم كل عضو بريد جامعي ينتهي بـ edu.sa مطابق للجامعة المختارة. وتذكر الصفحة أن الطلبة من جميع التخصصات مؤهلون، ولا تطبع أي شرط جنسية."},
 how:{en:"Register the team on the championship page before the extended deadline of 17 September 2026.", ar:"سجّل الفريق في صفحة البطولة قبل الموعد الممدّد في ١٧ سبتمبر ٢٠٢٦."},
 url:"https://www.aramco.com/en/careers/consulting-championship-2026", checked:"2026-10-01"},

{id:"beeah-rise-grad", ct:"ae", sector:"industry", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"BEEAH Group", ar:"مجموعة بيئة"},
 prog:{en:"RISE Graduate Program", ar:"برنامج رايز للخريجين"},
 apply:{en:"Open now. The page states that applications are open, with intake through the year rather than in windows.", ar:"مفتوح الآن. وتذكر الصفحة أن التقديم مفتوح، والالتحاق على مدار العام لا بفترات محددة."},
 duration:{en:"Twelve months.", ar:"اثنا عشر شهرًا."},
 elig:{en:"Emirati graduates who finished within the past eighteen months, with a GPA of 3.0 or above, in a science, technology, engineering, mathematics or business field.", ar:"الخريجون الإماراتيون الذين تخرجوا خلال الثمانية عشر شهرًا الماضية، بمعدل ٣٫٠ فأعلى، في العلوم أو التقنية أو الهندسة أو الرياضيات أو الأعمال."},
 how:{en:"Through the program page. The group's jobs portal had an expired security certificate when the page was read, so go in from the program page.", ar:"عبر صفحة البرنامج. وكانت شهادة أمان بوابة الوظائف منتهية عند التحقق، فادخل من صفحة البرنامج."},
 url:"https://www.beeahgroup.com/work-for-beeah/rise-graduate-program/", checked:"2026-09-28"}
,

{id:"qa-qf-mehnaty", ct:"qa", sector:"education", level:["uni"], paid:"yes", status:"annual", gate:"residents",
 org:{en:"Qatar Foundation", ar:"مؤسسة قطر"},
 prog:{en:"Mehnaty work study program", ar:"برنامج مهنتي للعمل أثناء الدراسة"},
 apply:{en:"Postings appear on the QF internships portal. On 16 September 2026 the portal listed one opportunity in total, an Al Meydan posting, so the Mehnaty category showed zero.", ar:"تظهر الفرص في بوابة التدريب لدى مؤسسة قطر. وفي ١٦ سبتمبر ٢٠٢٦ أدرجت البوابة فرصة واحدة فقط، وهي إعلان ضمن الميدان، فكان تصنيف مهنتي صفرًا."},
 duration:{en:"Set per posting. The page prints up to 20 hours a week during the semester. It prints no figure for the breaks.", ar:"تُحدد لكل فرصة. وتذكر الصفحة حتى ٢٠ ساعة أسبوعيًا خلال الفصل الدراسي، ولا تذكر رقمًا للعطل."},
 elig:{en:"A GPA of 2.5 or higher. Paid at 50 riyals an hour. Students on a scholarship must confirm it allows work. The Mehnaty section prints no enrollment rule of its own; the requirement to be enrolled at one of the Qatar Foundation universities is printed under Al Meydan.", ar:"معدل ٢٫٥ فأعلى. والأجر ٥٠ ريالًا للساعة. وعلى طلبة المنح التأكد من أن المنحة تسمح بالعمل. ولا يذكر قسم مهنتي شرط قيد خاصًا به؛ أما شرط القيد في إحدى جامعات مؤسسة قطر فمذكور ضمن الميدان."},
 how:{en:"Create a profile on the portal and apply to each posting.", ar:"أنشئ ملفًا في البوابة وقدّم على كل فرصة على حدة."},
 url:"https://internships.qf.org.qa/", checked:"2026-10-01"},

{id:"qa-qf-almeydan", ct:"qa", sector:"education", level:["uni"], paid:"no", status:"dormant", gate:"residents",
 org:{en:"Qatar Foundation", ar:"مؤسسة قطر"},
 prog:{en:"Al Meydan internship program", ar:"برنامج الميدان للتدريب"},
 apply:{en:"The portal carries no live posting today. The administrative assistant role under the Mehnaty program closed on 24 September 2026, and no Al Meydan posting is listed.", ar:"لا تحمل البوابة أي إعلان اليوم. أُغلقت وظيفة المساعد الإداري ضمن برنامج مهنتي في ٢٤ سبتمبر ٢٠٢٦، ولا يوجد إعلان ضمن برنامج الميدان."},
 duration:{en:"Up to 20 hours a week during the semester and up to 40 in the breaks.", ar:"حتى ٢٠ ساعة أسبوعيًا خلال الفصل الدراسي وحتى ٤٠ ساعة في العطل."},
 elig:{en:"Al Meydan requires enrollment at one of the Qatar Foundation universities, prioritizes juniors and sophomores, and prints a GPA floor of 2.0 or higher. Mehnaty is a separate program and prints a GPA floor of 2.5 or higher, and adds that students on scholarships must make sure their scholarship permits work. The page prints no nationality rule and no residence rule.", ar:"يشترط الميدان القيد في إحدى جامعات مؤسسة قطر، ويقدّم طلبة السنتين الثانية والثالثة، ويطبع حدًا أدنى للمعدل قدره ٢٫٠ فأعلى. أما مهنتي فبرنامج منفصل يطبع حدًا أدنى قدره ٢٫٥ فأعلى، ويضيف أن على الطلبة المبتعثين التأكد من أن بعثتهم تسمح بالعمل. ولا تطبع الصفحة شرط جنسية ولا شرط إقامة."},
 how:{en:"Applications go through the postings on the portal. The page prints no registration step and no other instructions.", ar:"يجري التقديم عبر الإعلانات المنشورة في البوابة. ولا تطبع الصفحة خطوة تسجيل ولا أي تعليمات أخرى."},
 url:"https://internships.qf.org.qa/", checked:"2026-10-01"},

{id:"qa-qcri-sip", ct:"qa", sector:"tech", level:["uni","grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Qatar Computing Research Institute, HBKU", ar:"معهد قطر لبحوث الحوسبة، جامعة حمد بن خليفة"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"Runs each year. The 2026 round took applications from 26 March to 10 April 2026 and has closed. The next call is expected in March 2027.", ar:"يُقام سنويًا. استقبلت دورة ٢٠٢٦ الطلبات من ٢٦ مارس إلى ١٠ أبريل ٢٠٢٦ وأُغلقت. ويُتوقع الإعلان القادم في مارس ٢٠٢٧."},
 duration:{en:"Eight weeks in two cohorts, May to July, with a break for Eid Al Adha.", ar:"ثمانية أسابيع في دفعتين من مايو إلى يوليو، مع إجازة لعيد الأضحى."},
 elig:{en:"Undergraduate and graduate students. A computer science background is preferred but not required. Research areas: Arabic language technologies, cybersecurity, artificial intelligence and software engineering. The page prints no nationality rule and no stipend.", ar:"طلبة البكالوريوس والدراسات العليا. يُفضَّل تخصص علوم الحاسوب دون اشتراطه. مجالات البحث: تقنيات اللغة العربية، والأمن السيبراني، والذكاء الاصطناعي، وهندسة البرمجيات. ولا تذكر الصفحة شرط جنسية ولا مكافأة."},
 how:{en:"Online form linked from the program page. Choose two research areas.", ar:"نموذج إلكتروني من صفحة البرنامج، مع اختيار مجالين بحثيين."},
 url:"https://www.hbku.edu.qa/en/academic-events/QCRI-SIP26", checked:"2026-09-03"},

{id:"qa-qbri-srp", ct:"qa", sector:"health", level:["uni"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"Qatar Biomedical Research Institute, HBKU", ar:"معهد قطر لبحوث الطب الحيوي، جامعة حمد بن خليفة"},
 prog:{en:"Summer Research Program", ar:"برنامج البحث الصيفي"},
 apply:{en:"Runs each year. The 2026 round closed on 10 March 2026 and ran from 31 May to 16 July. Expect the next call early in 2027.", ar:"يُقام سنويًا. أُغلقت دورة ٢٠٢٦ في ١٠ مارس ٢٠٢٦ وجرت من ٣١ مايو إلى ١٦ يوليو. ويُتوقع الإعلان القادم مطلع ٢٠٢٧."},
 duration:{en:"About seven weeks, 8:30 to 15:30.", ar:"نحو سبعة أسابيع، من ٨:٣٠ إلى ١٥:٣٠."},
 elig:{en:"Undergraduates in a biological or medical science with a GPA of 3.0 or higher who hold a Qatari residence permit. Students studying abroad may apply under separate conditions. Proof of hepatitis B vaccination is required.", ar:"طلبة البكالوريوس في العلوم البيولوجية أو الطبية بمعدل ٣٫٠ فأعلى ممن يحملون إقامة قطرية. ويمكن للدارسين في الخارج التقديم بشروط خاصة. ويُطلب إثبات التطعيم ضد التهاب الكبد ب."},
 how:{en:"Online form on the program page, with a CV, transcript and a choice of two projects. Enquiries to qbri-srp@hbku.edu.qa.", ar:"نموذج إلكتروني في صفحة البرنامج، مع سيرة ذاتية وكشف درجات واختيار مشروعين. الاستفسارات على qbri-srp@hbku.edu.qa."},
 url:"https://www.hbku.edu.qa/en/academic-events/QBRI-SRP26", checked:"2026-09-03"},

{id:"qa-qeeri-srp", ct:"qa", sector:"energy", level:["uni"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"Qatar Environment and Energy Research Institute, HBKU", ar:"معهد قطر لبحوث البيئة والطاقة، جامعة حمد بن خليفة"},
 prog:{en:"Summer Research Program", ar:"برنامج البحث الصيفي"},
 apply:{en:"Runs each year. The program page still shows the 2024 round, deadline 12 May 2024, and no 2025 or 2026 page was found. Check the page in spring.", ar:"يُقام سنويًا. ما تزال صفحة البرنامج تعرض دورة ٢٠٢٤، وآخر موعد فيها ١٢ مايو ٢٠٢٤، ولم نجد صفحة لعام ٢٠٢٥ أو ٢٠٢٦. راجع الصفحة في الربيع."},
 duration:{en:"Eight weeks, Sunday to Thursday.", ar:"ثمانية أسابيع، من الأحد إلى الخميس."},
 elig:{en:"Undergraduates in a STEM subject with at least two years completed, a GPA of 3.0 or higher and a Qatari residence permit. Two faculty recommendation letters are required.", ar:"طلبة البكالوريوس في تخصصات العلوم والتقنية والهندسة والرياضيات ممن أتموا سنتين على الأقل، بمعدل ٣٫٠ فأعلى وإقامة قطرية. وتُطلب رسالتا توصية من أعضاء هيئة التدريس."},
 how:{en:"Online form linked from the program page, with a CV, letter of interest, transcript, Qatar ID copy and two project choices.", ar:"نموذج إلكتروني من صفحة البرنامج، مع سيرة ذاتية ورسالة اهتمام وكشف درجات ونسخة من البطاقة القطرية واختيار مشروعين."},
 url:"https://www.hbku.edu.qa/en/QEERI/SRP", checked:"2026-09-03"},

{id:"qa-qu-srip", ct:"qa", sector:"education", level:["hs","uni","grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Qatar University, Young Scientists Center", ar:"جامعة قطر، مركز العلماء الشباب"},
 prog:{en:"Summer Research Internship Program", ar:"برنامج التدريب البحثي الصيفي"},
 apply:{en:"Runs each year. For 2026, university students registered by 30 April and school students by 10 May, and the program ran from 24 May to 31 August 2026. Expect the 2027 call in March.", ar:"يُقام سنويًا. في ٢٠٢٦ سجّل طلبة الجامعات حتى ٣٠ أبريل وطلبة المدارس حتى ١٠ مايو، وجرى البرنامج من ٢٤ مايو إلى ٣١ أغسطس ٢٠٢٦. ويُتوقع إعلان ٢٠٢٧ في مارس."},
 duration:{en:"A two day research methods course, about four weeks of internship in June, then follow up work to the end of August.", ar:"دورة في مناهج البحث ليومين، ثم نحو أربعة أسابيع من التدريب في يونيو، ثم متابعة حتى نهاية أغسطس."},
 elig:{en:"Undergraduate and graduate students from Qatar University and other universities, plus a track for school students guided by senior student researchers. The page prints no GPA, age or nationality rule and does not say whether it is paid.", ar:"طلبة البكالوريوس والدراسات العليا من جامعة قطر وغيرها، ومسار لطلبة المدارس بإشراف باحثين من الطلبة المتقدمين. ولا تذكر الصفحة معدلًا ولا سنًا ولا شرط جنسية، ولا تذكر إن كان بأجر."},
 how:{en:"Microsoft Forms registration linked from the program page, one form for university students and one for school students.", ar:"تسجيل عبر نماذج مايكروسوفت من صفحة البرنامج، نموذج لطلبة الجامعات وآخر لطلبة المدارس."},
 url:"https://www.qu.edu.qa/en-us/Research/ysc/internship/Pages/internship-2026.aspx", checked:"2026-09-03"},

{id:"qa-guq-internship", ct:"qa", sector:"education", level:["uni"], paid:"no", status:"open", gate:"residents",
 org:{en:"Georgetown University in Qatar", ar:"جامعة جورجتاون في قطر"},
 prog:{en:"Academic Internship Program", ar:"برنامج التدريب الأكاديمي"},
 apply:{en:"Open now. The page prints a Spring 2027 window with applications opening September 17 and closing October 2, selection and interviews through October and November, offers to be accepted by November 30, and the placement running January to April. The autumn window is printed as March 12 to March 29 with no year.", ar:"مفتوح الآن. تطبع الصفحة فترة لربيع ٢٠٢٧ يُفتح فيها التقديم في ١٧ سبتمبر ويُغلق في ٢ أكتوبر، مع الاختيار والمقابلات خلال أكتوبر ونوفمبر، وقبول العروض بحلول ٣٠ نوفمبر، والتدريب من يناير إلى أبريل. وتُطبع فترة الخريف من ١٢ إلى ٢٩ مارس دون ذكر السنة."},
 duration:{en:"One semester. Students work 10 to 15 hours a week at a partner organization and may not exceed 15 hours, alongside the course INAF 335, which is graded pass or fail and carries one academic credit toward the Georgetown degree.", ar:"فصل دراسي واحد. يعمل الطالب من ١٠ إلى ١٥ ساعة أسبوعيًا لدى جهة شريكة دون تجاوز ١٥ ساعة، إلى جانب مقرر INAF 335 الذي يُقيَّم بناجح أو راسب ويمنح ساعة معتمدة واحدة ضمن درجة جورجتاون."},
 elig:{en:"Degree seeking students studying at Georgetown University in Qatar. The page prints that the program is not open to students outside the university, so a student elsewhere cannot apply. Host organizations may set their own GPA floor. The page prints that internship positions will not be paid, that organizations may offer stipends for transportation, and that eligible students may apply to the Internship Fund for a monthly transport stipend.", ar:"الطلبة المسجلون لنيل درجة في جامعة جورجتاون في قطر. وتطبع الصفحة أن البرنامج غير متاح لطلبة من خارج الجامعة، فلا يستطيع طالب من جهة أخرى التقديم. وقد تشترط الجهات المستضيفة معدلًا خاصًا بها. وتطبع الصفحة أن المقاعد بلا أجر، وأن بعض الجهات قد تقدم بدل مواصلات، وأن الطلبة المؤهلين يمكنهم التقدم إلى صندوق التدريب للحصول على بدل مواصلات شهري."},
 how:{en:"Submit a CV, cover letter and transcript for each organization through the university's process. Hosts interview and make offers.", ar:"قدّم سيرة ذاتية ورسالة تغطية وكشف درجات لكل جهة عبر آلية الجامعة. وتجري الجهات المقابلات وتصدر العروض."},
 url:"https://www.qatar.georgetown.edu/academics/experiential-learning/academic-internship-program/", checked:"2026-10-01"},

{id:"qa-tamuq-tsre", ct:"qa", sector:"education", level:["uni"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"Texas A&M University at Qatar", ar:"جامعة تكساس إي آند إم في قطر"},
 prog:{en:"Texas Summer Research Experience", ar:"تجربة البحث الصيفي في تكساس"},
 apply:{en:"Runs each year. Applications open on 15 September and close on 15 October for the following summer, with a withdrawal deadline of 31 October. The page prints no year.", ar:"يُقام سنويًا. يُفتح التقديم في ١٥ سبتمبر ويُغلق في ١٥ أكتوبر للصيف التالي، وآخر موعد للانسحاب ٣١ أكتوبر. ولا تذكر الصفحة السنة."},
 duration:{en:"Ten weeks in summer. The page says the work is with a main campus faculty member and that applicants must be eligible to travel to the United States, but it does not name the location.", ar:"عشرة أسابيع في الصيف. وتذكر الصفحة أن العمل يكون مع عضو هيئة تدريس في الحرم الرئيسي وأن على المتقدم أن يكون مؤهلًا للسفر إلى الولايات المتحدة، لكنها لا تسمي الموقع."},
 elig:{en:"Undergraduates classified as sophomores with at least 30 credit hours before the program starts, in good standing with the university, with a GPR of 2.5 or higher and eligibility to travel to the United States. The page prints no restriction to Texas A and M Qatar students, though it sits in the Qatar campus section and the application portal is the university's own. A fee of 730 riyals is payable only if you are selected and matched.", ar:"طلبة البكالوريوس المصنفون في السنة الثانية بـ٣٠ ساعة معتمدة على الأقل قبل بدء البرنامج، وفي وضع جيد لدى الجامعة، بمعدل ٢٫٥ فأعلى وأهلية للسفر إلى الولايات المتحدة. ولا تذكر الصفحة قصر البرنامج على طلبة تكساس إي آند إم في قطر، وإن كانت ضمن قسم الحرم القطري وبوابة التقديم تابعة للجامعة نفسها. وتُدفع رسوم ٧٣٠ ريالًا فقط عند الاختيار والمطابقة."},
 how:{en:"Apply through the university's Yalla portal.", ar:"قدّم عبر بوابة «يلا» في الجامعة."},
 url:"https://www.qatar.tamu.edu/students/aggiesabroad/texas-research", checked:"2026-10-01"},

{id:"qa-qe-graduates", ct:"qa", sector:"energy", level:["grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"QatarEnergy", ar:"قطر للطاقة"},
 prog:{en:"Qatari Recent Graduates", ar:"الخريجون القطريون الجدد"},
 apply:{en:"Open now. Postings are on the career portal all year, with no closing dates printed. The page says assessment can take up to 90 days.", ar:"مفتوح الآن. تُنشر الفرص في بوابة التوظيف على مدار العام دون مواعيد إغلاق. وتذكر الصفحة أن التقييم قد يستغرق حتى ٩٠ يومًا."},
 duration:{en:"Not stated. A development program follows hiring.", ar:"غير مذكورة. ويلي التعيين برنامج تطوير."},
 elig:{en:"The page describes the program as being for Qatari recent graduates and speaks of developing Qatari talent, but it prints no formal eligibility clause, so treat the nationality expectation as a description rather than a published rule.", ar:"تصف الصفحة البرنامج بأنه للخريجين القطريين الجدد وتتحدث عن تطوير الكفاءات القطرية، لكنها لا تذكر شرط أهلية رسميًا، فاعتبر توقع الجنسية وصفًا لا قاعدة منشورة."},
 how:{en:"Apply to a posting in the graduates section of the QatarEnergy career portal.", ar:"قدّم على إحدى الفرص في قسم الخريجين في بوابة التوظيف في قطر للطاقة."},
 url:"https://careerportal.qatarenergy.qa/graduates", checked:"2026-09-28"},

{id:"qa-qe-scholarship", ct:"qa", sector:"energy", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"QatarEnergy", ar:"قطر للطاقة"},
 prog:{en:"University Program, energy sector scholarships", ar:"برنامج المنح الجامعية لقطاع الطاقة"},
 apply:{en:"The page states that applications are only accepted on the dates posted on the QatarEnergy career page. No dates are printed on the scholarship page and no form is open on it.", ar:"تذكر الصفحة أن الطلبات تُقبل فقط في المواعيد المنشورة على صفحة التوظيف في قطر للطاقة. ولا تُذكر مواعيد في صفحة المنح ولا يوجد نموذج مفتوح فيها."},
 duration:{en:"The full bachelor degree, then a place on a development program.", ar:"مدة درجة البكالوريوس كاملة، ثم مقعد في برنامج تطوير."},
 elig:{en:"The page states that the scholarship programs are only available for Qatari students. It prints no rule on year of graduation. Sponsorship covers the degree, health care and an allowance, with a job on graduation.", ar:"تذكر الصفحة أن برامج المنح متاحة للطلبة القطريين فقط. ولا تذكر شرطًا بشأن سنة التخرج. وتغطي الرعاية الدراسة والرعاية الصحية ومكافأة، مع وظيفة بعد التخرج."},
 how:{en:"Watch the QatarEnergy career page and apply there on the dates it posts. The scholarship page names no sponsor list and no other route.", ar:"تابع صفحة التوظيف في قطر للطاقة وقدّم فيها في المواعيد التي تنشرها. ولا تذكر صفحة المنح قائمة جهات راعية ولا طريقًا آخر."},
 url:"https://careerportal.qatarenergy.qa/scholarship-programs", checked:"2026-09-13"},

{id:"qa-qelng-internship", ct:"qa", sector:"energy", level:["hs","uni"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"QatarEnergy LNG", ar:"قطر للطاقة للغاز الطبيعي المسال"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"No posting is live. The internship category on the careers site prints that there are currently no open positions matching this category or location. The program runs over the summer months of June to August in Doha and Ras Laffan, and the site offers email alerts for the category.", ar:"لا يوجد إعلان قائم. تطبع صفحة فئة التدريب في موقع التوظيف أنه لا توجد حاليًا وظائف مفتوحة تطابق هذه الفئة أو الموقع. ويُقام البرنامج في أشهر الصيف من يونيو إلى أغسطس في الدوحة ورأس لفان، ويتيح الموقع تنبيهات بريدية لهذه الفئة."},
 duration:{en:"The summer months, June to August, in Doha or Ras Laffan.", ar:"أشهر الصيف من يونيو إلى أغسطس، في الدوحة أو راس لفان."},
 elig:{en:"Qatari school and university students, and children of QatarEnergy LNG staff. A certificate is issued on completion.", ar:"طلبة المدارس والجامعات من القطريين، وأبناء موظفي قطر للطاقة للغاز الطبيعي المسال. وتُمنح شهادة عند الإتمام."},
 how:{en:"Apply to the internship posting on the careers site when it appears, or write to internship@qatarenergylng.qa.", ar:"قدّم على إعلان التدريب في موقع التوظيف عند نشره، أو راسل internship@qatarenergylng.qa."},
 url:"https://careers.qatarenergylng.qa/go/Internship/4813301/", checked:"2026-09-21"},

{id:"qa-qelng-ngdp", ct:"qa", sector:"energy", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"QatarEnergy LNG", ar:"قطر للطاقة للغاز الطبيعي المسال"},
 prog:{en:"National Graduate Development Program", ar:"برنامج تطوير الخريجين الوطنيين"},
 apply:{en:"Six Fresh Qatari Graduate postings were live on 28 September 2026, all posted on 22 September 2026 with no closing date.", ar:"كانت ست فرص للخريجين القطريين الجدد منشورة في ٢٨ سبتمبر ٢٠٢٦، نُشرت جميعها في ٢٢ سبتمبر ٢٠٢٦ دون موعد إغلاق."},
 duration:{en:"Not stated. Development runs until the graduate reaches a target position.", ar:"غير مذكورة. ويستمر التطوير حتى يبلغ الخريج الوظيفة المستهدفة."},
 elig:{en:"Qatari fresh graduates. The postings are titled for petroleum, chemical, mechanical and electrical engineering, for business and finance majors, and for computer majors.", ar:"الخريجون القطريون الجدد. وعناوين الإعلانات هي هندسة البترول والكيمياء والميكانيكا والكهرباء، وتخصصات الأعمال والمالية، وتخصصات الحاسوب."},
 how:{en:"Apply on the posting for your major on the careers site. The petroleum engineering, business and finance and computing postings are based in Doha, and the chemical, mechanical and electrical engineering postings at Ras Laffan.", ar:"قدّم على الإعلان الخاص بتخصصك في موقع التوظيف. وإعلانات هندسة البترول والأعمال والمالية والحاسوب مقرها الدوحة، وإعلانات الهندسة الكيميائية والميكانيكية والكهربائية في راس لفان."},
 url:"https://careers.qatarenergylng.qa/go/National-Graduates/4813201/", checked:"2026-10-01"},

{id:"qa-qr-summer", ct:"qa", sector:"aviation", level:["uni","grad"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"Qatar Airways", ar:"الخطوط الجوية القطرية"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"The program page carries a live apply link and prints no window and no closing date.", ar:"تحمل صفحة البرنامج رابط تقديم فعّالًا ولا تذكر فترة تقديم ولا موعد إغلاق."},
 duration:{en:"Two to three months.", ar:"من شهرين إلى ثلاثة أشهر."},
 elig:{en:"Applicants must be Qatari or have a Qatari mother, and must be enrolled in or have graduated from an academic institution in Qatar where the study scheme is in English. Undergraduates need at least 60 credit hours completed with an overall GPA of 3.0 or above. An overall IELTS score of 5.5 or above is required, along with being self sponsored or sponsored by the institution, and passing an interview set by the airline.", ar:"يجب أن يكون المتقدم قطريًا أو من أم قطرية، وأن يكون مقيدًا في مؤسسة أكاديمية في قطر تدرّس بالإنجليزية أو متخرجًا منها. ويحتاج طلبة البكالوريوس إلى إتمام ٦٠ ساعة معتمدة على الأقل بمعدل تراكمي ٣٫٠ فأعلى. ويُشترط مجموع آيلتس ٥٫٥ فأعلى، وأن يكون المتقدم على نفقته أو على نفقة مؤسسته، واجتياز مقابلة تحددها الشركة."},
 how:{en:"Online application on the Qatar Airways careers portal, followed by an interview.", ar:"طلب إلكتروني في بوابة التوظيف في الخطوط القطرية، تليه مقابلة."},
 url:"https://www.qatarairways.com/en-us/nationalisation/internship-programme.html", checked:"2026-09-28"},

{id:"qa-qr-gdp", ct:"qa", sector:"aviation", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Qatar Airways", ar:"الخطوط الجوية القطرية"},
 prog:{en:"Graduate Development Program", ar:"برنامج تطوير الخريجين"},
 apply:{en:"The page states that applications remain open throughout the year and that the next recruitment cycle begins in November 2026.", ar:"تذكر الصفحة أن التقديم مفتوح طوال العام وأن دورة التوظيف القادمة تبدأ في نوفمبر ٢٠٢٦."},
 duration:{en:"Two years.", ar:"سنتان."},
 elig:{en:"Qatari nationals or those with a Qatari mother, between 20 and 28 years old, holding a bachelor's degree or equivalent from an institution approved by the Supreme Education Council, with an overall GPA of 2.5 or above. Criminal identification and medical clearance are required. Eight streams are printed: commercial, engineering, human resources, finance and business management, brand and communication, information technology, customer experience and subsidiaries.", ar:"القطريون أو أبناء الأم القطرية، بين ٢٠ و٢٨ عامًا، الحاصلون على بكالوريوس أو ما يعادله من مؤسسة معتمدة من المجلس الأعلى للتعليم، بمعدل تراكمي ٢٫٥ فأعلى. ويُشترط التحقق الأمني واللياقة الطبية. وتُطبع ثمانية مسارات: التجاري، والهندسة، والموارد البشرية، والمالية وإدارة الأعمال، والعلامة والاتصال، وتقنية المعلومات، وتجربة العملاء، والشركات التابعة."},
 how:{en:"Online application on the careers portal. Enquiries to aldarbrecruitment@qatarairways.com.qa or on +974 4022 2096.", ar:"طلب إلكتروني في بوابة التوظيف. الاستفسارات على aldarbrecruitment@qatarairways.com.qa أو هاتف ٩٧٤٤٠٢٢٢٠٩٦+."},
 url:"https://www.qatarairways.com/en/nationalisation/graduates-development-programme.html", checked:"2026-10-01"},

{id:"qa-qr-cadet", ct:"qa", sector:"aviation", level:["hs"], paid:"yes", status:"dormant", gate:"nationals",
 org:{en:"Qatar Airways", ar:"الخطوط الجوية القطرية"},
 prog:{en:"Cadet Pilot Training Program", ar:"برنامج تدريب الطيارين المبتدئين"},
 apply:{en:"On 1 October 2026 the page still says it is not accepting applications and asks applicants to check again at a later date when applications resume. The page prints no intake dates and no reopening date, only that a limited number of scholarships are awarded each year.", ar:"في ١ أكتوبر ٢٠٢٦ ما تزال الصفحة تذكر أن التقديم غير متاح وتطلب المراجعة لاحقًا عند استئنافه. ولا تذكر الصفحة مواعيد دفعات ولا تاريخ استئناف، بل تذكر فقط أن عددًا محدودًا من المنح يُمنح كل عام."},
 duration:{en:"Up to 18 months of training, then a five year employment bond.", ar:"حتى ١٨ شهرًا من التدريب، ثم التزام بالعمل خمس سنوات."},
 elig:{en:"Qatari nationals or children of a Qatari mother above 17 and below 27 at the time of applying, with at least 70 percent in secondary school, a Class 1 medical and a height of at least 160 cm. The IELTS rule is an overall band of at least 4.5 taken in the last 24 months, with no component below 4.0. The page refers to scholarship expenses and fees paid by Qatar Airways, and prints no figure for cost, salary or allowance.", ar:"المواطنون القطريون أو أبناء الأم القطرية فوق ١٧ ودون ٢٧ عامًا عند التقديم، بنسبة ٧٠٪ على الأقل في الثانوية ولياقة طبية من الفئة الأولى وطول ١٦٠ سم على الأقل. وشرط الآيلتس درجة كلية لا تقل عن ٤٫٥ خلال آخر ٢٤ شهرًا، ولا تقل أي مهارة عن ٤٫٠. وتشير الصفحة إلى أن قطر للطيران تتحمل نفقات المنحة ورسومها، ولا تذكر رقمًا للتكلفة ولا للراتب ولا للبدل."},
 how:{en:"Online application on the careers portal when a round opens. Enquiries to cadet@qatarairways.com.qa.", ar:"طلب إلكتروني في بوابة التوظيف عند فتح دفعة جديدة. الاستفسارات على cadet@qatarairways.com.qa."},
 url:"https://www.qatarairways.com/en-us/nationalisation/cadet-pilot-programme.html", checked:"2026-10-01"},

{id:"qa-qnb-internship", ct:"qa", sector:"finance", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"QNB", ar:"بنك قطر الوطني"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"The application form on the page is live. No application window is published.", ar:"نموذج التقديم في الصفحة متاح. ولا يُنشر موعد للتقديم."},
 duration:{en:"Up to four weeks.", ar:"حتى أربعة أسابيع."},
 elig:{en:"The page prints no nationality or residence rule. It gives priority to Qatari citizens, to a GPA of 2.6 or higher and to fields of study related to banking. A face to face interview and full attendance are required, and absence during the internship is not permitted without a valid reason.", ar:"لا تذكر الصفحة شرط جنسية أو إقامة. وتمنح الأولوية للمواطنين القطريين ولمعدل ٢٫٦ فأعلى ولتخصصات الدراسة المتصلة بالعمل المصرفي. وتُشترط مقابلة شخصية وحضور كامل، ولا يُسمح بالغياب أثناء التدريب دون سبب مقبول."},
 how:{en:"Online internship form on the QNB site.", ar:"نموذج التدريب الإلكتروني في موقع بنك قطر الوطني."},
 url:"https://qnb.com/sites/qnb/qnbglobal/page/en/eninternship.html", checked:"2026-10-01"},

{id:"qa-qnb-scholarship", ct:"qa", sector:"finance", level:["hs","uni"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"QNB", ar:"بنك قطر الوطني"},
 prog:{en:"Scholarship Program", ar:"برنامج المنح الدراسية"},
 apply:{en:"The page carries a live apply link. No application window is published.", ar:"تحمل الصفحة رابط تقديم فعّالًا. ولا يُنشر موعد للتقديم."},
 duration:{en:"The degree, then one year of work at QNB for each year sponsored.", ar:"مدة الدراسة، ثم سنة عمل في البنك مقابل كل سنة رعاية."},
 elig:{en:"Qatari citizens with at least 70 percent in the secondary certificate, or a GPA of 3.0 if already at university, in a field of study the bank states should follow its needs. A student who does not graduate on time, does not complete the studies or does not serve the work obligation pays the fees set in the scholarship contract.", ar:"المواطنون القطريون بنسبة ٧٠٪ على الأقل في الشهادة الثانوية، أو معدل ٣٫٠ لمن هم في الجامعة، في تخصص تذكر الصفحة أنه يتبع حاجة البنك. ومن لا يتخرج في موعده أو لا يكمل دراسته أو لا يفي بالتزام العمل يدفع الرسوم المحددة في عقد المنحة."},
 how:{en:"The apply link on the page goes to the QNB careers portal at qnb.sniperhire.net, not to the internship form.", ar:"يقود رابط التقديم في الصفحة إلى بوابة التوظيف في بنك قطر الوطني على qnb.sniperhire.net لا إلى نموذج التدريب."},
 url:"https://www.qnb.com/sites/qnb/qnbglobal/page/en/ennationalisation.html", checked:"2026-09-28"},

{id:"qa-cbq-sponsorship", ct:"qa", sector:"finance", level:["uni"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"Commercial Bank", ar:"البنك التجاري"},
 prog:{en:"Student Sponsorship Program", ar:"برنامج رعاية الطلبة"},

{id:"qa-qia-scholarship", ct:"qa", sector:"finance", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Qatar Investment Authority", ar:"جهاز قطر للاستثمار"},
 prog:{en:"QIA Scholarship Program", ar:"برنامج المنح الدراسية"},
 apply:{en:"Runs each year. On 1 October 2026 the only deadline printed is still 15 November 2025 for one partner university, so the page has not been refreshed for the 2026 intake. Other dates are on the universities' own pages.", ar:"يُقام سنويًا. وفي ١ أكتوبر ٢٠٢٦ ما يزال الموعد الوحيد المطبوع هو ١٥ نوفمبر ٢٠٢٥ لإحدى الجامعات الشريكة، فالصفحة لم تُحدَّث لدفعة ٢٠٢٦. والمواعيد الأخرى في صفحات الجامعات نفسها."},
 duration:{en:"A full bachelor degree.", ar:"درجة بكالوريوس كاملة."},
 elig:{en:"Qatari nationals in the final year of secondary school with at least 90 percent, IELTS 6.5 and an unconditional offer from a university and major approved by QIA. Full tuition, a monthly allowance and a job on graduation.", ar:"المواطنون القطريون في السنة الأخيرة من الثانوية بنسبة ٩٠٪ على الأقل وآيلتس ٦٫٥ وقبول غير مشروط من جامعة وتخصص يعتمدهما الجهاز. رسوم كاملة ومكافأة شهرية ووظيفة بعد التخرج."},
 how:{en:"Online application through the QIA careers system: application, interviews, then a full day assessment. Enquiries to scholarship@qia.qa.", ar:"طلب إلكتروني عبر نظام التوظيف في الجهاز: طلب، ثم مقابلات، ثم تقييم ليوم كامل. الاستفسارات على scholarship@qia.qa."},
 url:"https://www.qia.qa/en/careers/pages/QIA-Scholarship-Program.aspx", checked:"2026-10-01"},

{id:"qa-qdb-summer", ct:"qa", sector:"finance", level:["hs","uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Qatar Development Bank", ar:"بنك قطر للتنمية"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"Open, with no dates printed. The page is an information page rather than a form, and it asks you to send your documents to the human resources team.", ar:"مفتوح دون مواعيد منشورة. والصفحة صفحة معلومات لا نموذجًا، وتطلب إرسال مستنداتك إلى فريق الموارد البشرية."},
 duration:{en:"Summer. Length not stated.", ar:"الصيف. المدة غير مذكورة."},
 elig:{en:"The page prints no nationality or residence rule. It says only that several students from Qatari universities, local schools and colleges join the bank for summer internships, which describes who has attended rather than who may apply. The one real requirement it prints is an official letter from your university advisor to human resources.", ar:"لا تذكر الصفحة شرط جنسية أو إقامة. وتقول فقط إن عددًا من طلبة الجامعات القطرية والمدارس والكليات المحلية يلتحقون بالبنك للتدريب الصيفي، وهذا وصف لمن التحق لا لمن يحق له التقديم. والشرط الحقيقي الوحيد المذكور هو رسالة رسمية من المرشد الأكاديمي إلى الموارد البشرية."},
 how:{en:"Send an official letter from your university advisor to the human resources department. The page prints no CV requirement and no email address, and points to a summer internship FAQ for more.", ar:"أرسل خطابًا رسميًا من المرشد الأكاديمي في جامعتك إلى إدارة الموارد البشرية. ولا تطبع الصفحة اشتراط سيرة ذاتية ولا عنوان بريد، وتحيل إلى أسئلة شائعة عن التدريب الصيفي."},
 url:"https://ossform.qdb.qa/en/internship", checked:"2026-10-01"},

{id:"qa-qfcra-internship", ct:"qa", sector:"finance", level:["hs","uni","grad"], paid:"unknown", status:"open", gate:"unstated",

 duration:{en:"Not stated.", ar:"غير مذكورة."},
 elig:{en:"High performing school, university and postgraduate students. The page names Carnegie Mellon Qatar, Georgetown Qatar, HBKU, Qatar University and the University of Doha for Science and Technology as partners, and prints no nationality rule.", ar:"طلبة المدارس والجامعات والدراسات العليا من المتفوقين. وتذكر الصفحة كارنيجي ميلون قطر وجورجتاون قطر وجامعة حمد بن خليفة وجامعة قطر وجامعة الدوحة للعلوم والتكنولوجيا شركاء، ولا تذكر شرط جنسية."},
 how:{en:"Send a CV to internships@qfcra.com.", ar:"أرسل سيرتك الذاتية إلى internships@qfcra.com."},
 url:"https://www.qfcra.com/internship-programme-2/", checked:"2026-09-28"},

{id:"qa-qicdrc-internship", ct:"qa", sector:"legal", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Qatar International Court and Dispute Resolution Center", ar:"محكمة قطر الدولية ومركز تسوية المنازعات"},

 duration:{en:"Usually one to two weeks, 8:00 to 16:00.", ar:"أسبوع إلى أسبوعين عادة، من ٨:٠٠ إلى ١٦:٠٠."},
 elig:{en:"Law students, usually aged 18 or over. A confidentiality agreement is signed and a certificate issued. No nationality rule is printed.", ar:"طلبة القانون، ممن بلغوا ١٨ عامًا عادة. يُوقَّع اتفاق سرية وتُمنح شهادة. ولا يُذكر شرط جنسية."},
 how:{en:"Email programs@qicdrc.gov.qa with a one page cover letter to the Registrar and a two page CV. The page asks for the subject line to read Application for Internship followed by your name.", ar:"راسل programs@qicdrc.gov.qa برسالة تغطية من صفحة واحدة موجهة إلى المسجل وسيرة ذاتية من صفحتين. وتطلب الصفحة أن يكون سطر الموضوع «Application for Internship» متبوعًا باسمك."},
 url:"https://www.qicdrc.gov.qa/programmes/internships", checked:"2026-09-28"},
