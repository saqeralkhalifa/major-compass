<script>
/* MCLANG: one language resolver shared across Dr. Saqer AlKhalifa's student tools. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }

/* ============================================================
   Major Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-ar:'Noto Naskh Arabic', 'Amiri', Georgia, serif;

  --paper:#FAF5EA;
  --paper-2:#EFE4CE;
  --card:#F5ECDA;
  --line:#E2D5BB;
  --line-2:#D3C0A0;

  --ink:#152A55;
  --ink-2:#4A3728;
  --ink-3:#6B5B47;

  --navy:#152A55;
  --navy-deep:#0F2047;
  --accent:#7D5F27;
  --accent-soft:#EFE4CE;
  --accent-line:#D3C0A0;

  --gold:#7D5F27;
  --gold-soft:#F5ECDA;
  --gold-line:#E2D5BB;
  --gold-bright:#C09A45;

  --good:#2F5D46;  --good-soft:#E7EEE8;  --good-line:#C9D8CC;
  --warn:#7D5F27;  --warn-soft:#F5ECDA;  --warn-line:#E2D5BB;
  --bad:#8C3A30;   --bad-soft:#F6EAE3;   --bad-line:#E4D2C7;

  --radius:2px; --radius-sm:2px;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

/* ---------- the shared dark nav ---------- */
.mc-nav{
  background:var(--ink); color:var(--paper);
  position:sticky; top:0; z-index:40;
}
.mc-nav-inner{
  max-width:920px; margin:0 auto; padding:13px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
}
.mc-brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--paper); min-width:0;}
.mc-brand b{font-family:var(--font-display); font-size:17px; font-weight:400; letter-spacing:-.01em; white-space:nowrap;}
[dir="rtl"] .mc-brand b{font-family:var(--font-ar); font-weight:600; letter-spacing:0;}
.mc-brand span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9AAAD0; white-space:nowrap;}
[dir="rtl"] .mc-brand span{letter-spacing:0; text-transform:none; font-size:12px;}
.mc-nav-links{
  display:flex; gap:20px; font-size:12px; letter-spacing:.06em; align-items:center;
  overflow-x:auto; scrollbar-width:none; flex:1 1 auto; justify-content:center;
}
.mc-nav-links::-webkit-scrollbar{display:none;}
[dir="rtl"] .mc-nav-links{letter-spacing:0; font-size:13px;}
.mc-nav-links a{
  color:#D3DCEF; text-decoration:none; white-space:nowrap; padding-bottom:2px;
  border-bottom:1px solid transparent; transition:color .15s, border-color .15s;
}
.mc-nav-links a:hover{color:var(--paper);}
.mc-nav-links a[aria-current="page"]{color:var(--paper); border-bottom-color:var(--accent);}
.mc-nav .lang-toggle{
  flex:0 0 auto; border:1px solid var(--accent); background:var(--accent); border-radius:999px;
  padding:6px 17px; font-size:13px; letter-spacing:.04em; font-weight:600;
  color:#F5ECDA; cursor:pointer; font-family:var(--font-body);
  transition:background .15s, color .15s, border-color .15s;
}
.mc-nav .lang-toggle:hover{background:var(--paper); color:var(--ink); border-color:var(--paper);}
@media (max-width:640px){
  .mc-nav-inner{padding:11px 18px; gap:10px;}
  .mc-nav-links{justify-content:flex-start; order:3; width:100%; gap:16px; padding-bottom:2px;}
}
@media print{ .mc-nav{display:none;} }

/* the old in-page masthead and pill switcher are replaced by .mc-nav */
header.site, nav.toolnav{display:none !important;}

/* ---------- page header ---------- */
.hero, .res-head{position:relative;}
.hero::before{display:none !important;}
.hero{padding-top:52px;}

}

/* ---------- surfaces: square, flat, ruled ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox,
.m, .fact, .pt, .bar, .quizbar, .cta-inline, .rule, .checked, .hedge, .extra, .flag,
.note, .card, .grp{
  border-radius:0 !important;
  box-shadow:none !important;
}
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .stat, .nextbox, .m, .fact{
  background:var(--card); border:1px solid var(--line-2);
}
.mcard:hover, .pcard:hover, .m:hover{border-color:var(--ink-3);}

.lede{background:var(--card); border:1px solid var(--line-2);
  border-inline-start:2px solid var(--accent) !important; border-inline-end:1px solid var(--line-2) !important;}

/* ---------- buttons ---------- */
.btn{
  background:var(--ink); border:1px solid var(--ink); border-radius:0;
  font-weight:500; letter-spacing:0; color:var(--paper); box-shadow:none;
  transition:background .15s, border-color .15s, color .15s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff; transform:none; filter:none; box-shadow:none;}
.btn.ghost, .btn.secondary{
  background:transparent; color:var(--ink); border:1px solid var(--ink); box-shadow:none;
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.printbtn{border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);}
.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

/* filter chips and pickers: square, ruled */
.fbtn, .chip, .navbtn, .picker button, .filters button{
  border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);
  box-shadow:none; transition:background .15s, color .15s, border-color .15s;
}
.fbtn:hover, .chip:hover, .navbtn:hover{border-color:var(--ink); color:var(--ink); background:transparent; transform:none;}
.fbtn.on, .chip.on, .navbtn.on{
  background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500; box-shadow:none;
}
input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);
}
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{
  background:var(--paper-2); border:1px solid var(--line); border-radius:0;
}
.rule, .checked, .hedge, .extra, .flag{border-radius:0;}
.rule.w, .checked, .hedge, .extra, .flag{background:var(--warn-soft); border-color:var(--warn-line);}

/* ---------- tables ---------- */

th{

  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--ink);

}

.pt{border-inline-start-width:2px !important;}

:root{ --font-label:'IBM Plex Mono', 'Noto Naskh Arabic', ui-monospace, SFMono-Regular, monospace; }

{id:"mbma-fdp", ct:"bh", sector:"gov", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",

 apply:{en:"Applications are closed at the moment. When a round opens the route is an online application, then a written examination, a psychometric test and an interview, and you take the diplomatic oath once you finish the programme.", ar:"التقديم مغلق حاليًا. وعند فتح دورة جديدة يكون المسار طلبًا إلكترونيًا، ثم اختبارًا تحريريًا واختبارًا نفسيًا ومقابلة شخصية، وتؤدي القسم الدبلوماسي عند إتمام البرنامج."},

{id:"cpisp", ct:"bh", sector:"gov", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Crown Prince's International Scholarship Programme", ar:"برنامج ولي العهد للمنح الدراسية العالمية"},
 prog:{en:"CPISP, Grade 11 round", ar:"دورة الصف الحادي عشر"},
 apply:{en:"Applications open every March. The 2026 round has closed.", ar:"يُفتح التقديم كل مارس. وقد أُغلقت دورة ٢٠٢٦."},
 duration:{en:"A fully funded undergraduate degree abroad. Ministry of Education students first do two years of preparatory boarding school.", ar:"منحة كاملة لبكالوريوس في الخارج. يدرس طلبة مدارس وزارة التربية سنتين تحضيريتين داخليتين قبلها."},
 elig:{en:"Bahraini citizens in Grade 11 or equivalent with a cumulative average of 97 per cent or above across Grade 10 and the first semester of Grade 11. You apply yourself, no school nomination needed.", ar:"مواطنون بحرينيون في الصف الحادي عشر أو ما يعادله بمعدل تراكمي ٩٧٪ فأعلى للصف العاشر والفصل الأول من الحادي عشر. التقديم فردي دون حاجة لترشيح المدرسة."},
 how:{en:"Apply online in the March window, then sit the English and critical reasoning examinations.", ar:"قدّم إلكترونيًا في فترة مارس، ثم اجلس لاختباري اللغة الإنجليزية والتفكير النقدي."},
 url:"https://www.cpisp.bh/CPISPapplication/", checked:"2026-08-24"},

{id:"youth-city-2030", ct:"bh", sector:"gov", level:["hs","uni"], paid:"no", status:"open", gate:"nationals",
 org:{en:"Ministry of Youth Affairs", ar:"وزارة شؤون الشباب"},
 prog:{en:"Youth City 2030", ar:"مدينة شباب ٢٠٣٠"},
 apply:{en:"The summer season runs 12 July to 20 August, so registration is open right now for the last of this year's programmes.", ar:"يمتد الموسم الصيفي من ١٢ يوليو إلى ٢٠ أغسطس، والتسجيل مفتوح الآن لآخر برامج هذا العام."},
 duration:{en:"Short programmes. The 15 and over group runs evenings, 4pm to 8.30pm. A certificate needs 80 per cent attendance.", ar:"برامج قصيرة. تحضر الفئة من ١٥ عامًا فأكثر مساءً من الرابعة حتى الثامنة والنصف. وتُمنح الشهادة بحضور ٨٠٪."},
 elig:{en:"Bahrainis aged 15 to 35, with a valid smart card and an active eKey account.", ar:"البحرينيون من ١٥ إلى ٣٥ عامًا، ببطاقة ذكية سارية وحساب مفتاح إلكتروني فعّال."},
 how:{en:"Register on the E-Shabab app and pay online. Fees are 10 dinars per programme, or 20 for programmes with a training body certificate. No cash.", ar:"سجّل عبر تطبيق E-Shabab وادفع إلكترونيًا. الرسوم ١٠ دنانير للبرنامج، أو ٢٠ للبرامج التي تمنح شهادة من جهة تدريبية. ولا تُقبل النقدية."},
 url:"https://www.mya.gov.bh/en/faq-youth-city-2030", checked:"2026-08-24"},

{id:"uob-early-access", ct:"bh", sector:"education", level:["hs"], paid:"no", status:"annual", gate:"residents",
 org:{en:"University of Bahrain", ar:"جامعة البحرين"},
 prog:{en:"Early Access to University", ar:"برنامج الوصول المبكر للجامعة"},
 apply:{en:"Registration ran 9 to 19 June for the summer term. It opens once a year before each term.", ar:"جرى التسجيل من ٩ إلى ١٩ يونيو للفصل الصيفي. ويُفتح مرة واحدة سنويًا قبل كل فصل."},
 duration:{en:"Real university courses taken while still at school, for credit. Grade 12 entrants take one summer term, Grade 10 entrants can take two academic years. Three courses a semester at most.", ar:"مقررات جامعية حقيقية تُدرس أثناء المدرسة وتُحتسب. يدرس طلبة الثاني عشر فصلًا صيفيًا واحدًا، ويمكن لطلبة العاشر الدراسة سنتين. بحد أقصى ثلاثة مقررات في الفصل."},
 elig:{en:"Students in Grade 10, 11 or 12 at government or private schools. Under 18s need parental consent.", ar:"طلبة الصفوف العاشر والحادي عشر والثاني عشر في المدارس الحكومية والخاصة. ويشترط موافقة ولي الأمر لمن هم دون ١٨."},
 how:{en:"Register on the student information system with a transcript, ID and parental consent. Fees are 8 dinars per credit hour for Bahrainis and 80 for others, plus a one off 50 dinar summer registration fee.", ar:"سجّل عبر نظام معلومات الطلبة مع كشف درجات وإثبات هوية وموافقة ولي الأمر. الرسوم ٨ دنانير للساعة للبحرينيين و٨٠ لغيرهم، مع رسم تسجيل صيفي ٥٠ دينارًا يُدفع مرة واحدة."},
 url:"https://www.uob.edu.bh/study/early-access-to-university/", checked:"2026-08-24"},

{id:"mkf-rayaat", ct:"bh", sector:"ngo", level:["hs","uni"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"AlMabarrah AlKhalifia Foundation", ar:"مؤسسة المبرة الخليفية"},
 prog:{en:"Rayaat scholarship programme", ar:"برنامج رايات للمنح الدراسية"},
 apply:{en:"Registration for the current intake ran 12 to 21 April, with results in July. Watch for the same window next April.", ar:"جرى التسجيل للدفعة الحالية من ١٢ إلى ٢١ أبريل، وصدرت النتائج في يوليو. ترقّب الفترة نفسها في أبريل القادم."},
 duration:{en:"A full bachelor's degree in Bahrain, normally four years, including internship placements in the public and private sectors.", ar:"بكالوريوس كامل في البحرين، عادة أربع سنوات، ويشمل تدريبًا عمليًا في القطاعين العام والخاص."},
 elig:{en:"Bahraini nationals. School leavers need a secondary average of at least 85 per cent, higher for fields such as medicine, must not hold another scholarship, and must show volunteering. Students already at university may also apply.", ar:"بحرينيو الجنسية. يشترط لخريجي الثانوية معدل ٨٥٪ على الأقل، ويرتفع في تخصصات مثل الطب، وألا يكون المتقدم حاصلًا على منحة أخرى، مع إثبات عمل تطوعي. ويحق لطلبة الجامعات الحاليين التقديم."},
 how:{en:"Apply to a partner university in Bahrain first, then apply to the foundation with your passport, transcripts and community service letters.", ar:"قدّم أولًا إلى جامعة شريكة في البحرين، ثم إلى المؤسسة مع جواز السفر والسجلات الأكاديمية ورسائل العمل المجتمعي."},
 url:"https://mkfbh.org/rayaat", checked:"2026-08-24"},

{id:"mkf-watheq", ct:"bh", sector:"ngo", level:["hs"], paid:"no", status:"annual", gate:"unstated",
 org:{en:"AlMabarrah AlKhalifia Foundation", ar:"مؤسسة المبرة الخليفية"},
 prog:{en:"Watheq university preparatory programme", ar:"برنامج واثق التحضيري للجامعة"},
 apply:{en:"Runs mid July to late August each summer. Seats are limited and there is no published deadline, so register as soon as it opens.", ar:"يُقام من منتصف يوليو إلى أواخر أغسطس كل صيف. المقاعد محدودة ولا يوجد موعد نهائي معلن، فسجّل فور فتحه."},
 duration:{en:"21 days, 24 sessions, daily 9am to 2pm, with university visits, company tours and mock interviews.", ar:"٢١ يومًا و٢٤ جلسة، يوميًا من التاسعة حتى الثانية، مع زيارات جامعية وجولات في الشركات ومقابلات تجريبية."},
 elig:{en:"Aged 16 to 18, secondary students or recent school leavers. You apply yourself, no school nomination needed.", ar:"من ١٦ إلى ١٨ عامًا، من طلبة الثانوية أو خريجيها حديثًا. التقديم فردي دون حاجة لترشيح المدرسة."},
 how:{en:"Register on the programme page. A non refundable fee of 30 dinars applies.", ar:"سجّل عبر صفحة البرنامج. الرسوم ٣٠ دينارًا وغير قابلة للاسترداد."},
 url:"https://mkfbh.org/watheq", checked:"2026-08-24"},

{id:"ncst-secondary", ct:"bh", sector:"education", level:["hs"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Nasser Centre for Science and Technology", ar:"مركز ناصر للعلوم والتكنولوجيا"},
 prog:{en:"Secondary technical and vocational programmes", ar:"البرامج الثانوية التقنية والمهنية"},
 apply:{en:"Applications are through the centre's own form, with two rounds of offers. No fixed dates are published.", ar:"التقديم عبر نموذج المركز، مع جولتين من العروض. ولا تُنشر تواريخ ثابتة."},
 duration:{en:"A full time secondary school route, not a short placement. Streams include technical education, mechanical and electrical engineering, artificial intelligence, cloud computing, cybersecurity, sport and business, and vocational training.", ar:"مسار مدرسي ثانوي بدوام كامل لا تدريبًا قصيرًا. تشمل المسارات التعليم التقني والهندسة الميكانيكية والكهربائية والذكاء الاصطناعي والحوسبة السحابية والأمن السيبراني والرياضة وإدارة الأعمال والتدريب المهني."},
 elig:{en:"Bahraini citizens only, entering after Grade 9, roughly ages 14 to 16, and up to 20 for vocational training. You must pass placement tests in English, Arabic and mathematics.", ar:"المواطنون البحرينيون فقط، والالتحاق بعد الصف التاسع، وتتراوح الأعمار غالبًا بين ١٤ و١٦، وتصل إلى ٢٠ للتدريب المهني. ويشترط اجتياز اختبارات تحديد المستوى في الإنجليزية والعربية والرياضيات."},
 how:{en:"Apply through the online registration form on the centre website, then sit the placement tests.", ar:"قدّم عبر نموذج التسجيل الإلكتروني في موقع المركز، ثم اجلس لاختبارات تحديد المستوى."},
 url:"https://ncst.edu.bh/academic/programmes-courses/", checked:"2026-08-24"},

{id:"injaz-company", ct:"bh", sector:"ngo", level:["hs"], paid:"no", status:"annual", gate:"residents",
 org:{en:"INJAZ Bahrain", ar:"إنجاز البحرين"},
 prog:{en:"Company Programme, school track", ar:"برنامج الشركة الطلابية، مسار المدارس"},
 apply:{en:"An annual cycle ending in national finals in June. Teams enter through their school, so this depends on your school taking part.", ar:"دورة سنوية تنتهي بنهائيات وطنية في يونيو. تشارك الفرق عبر مدارسها، فالأمر يعتمد على مشاركة مدرستك."},
 duration:{en:"A school year. Student teams set up and run a real company, ending at the Young Entrepreneurs Competition.", ar:"سنة دراسية. تؤسس فرق الطلبة شركة حقيقية وتديرها، وتنتهي بمسابقة رواد الأعمال الشباب."},
 elig:{en:"Secondary school students at participating schools.", ar:"طلبة المرحلة الثانوية في المدارس المشاركة."},
 how:{en:"Ask your school whether it runs INJAZ Bahrain programmes.", ar:"اسأل مدرستك إن كانت تنفذ برامج إنجاز البحرين."},
 url:"https://www.injazbh.org/", checked:"2026-08-24"},

{id:"rcsi-research-summer", ct:"bh", sector:"health", level:["uni"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"RCSI Medical University of Bahrain", ar:"جامعة البحرين الطبية، الكلية الملكية للجراحين في أيرلندا"},
 prog:{en:"Research Summer School", ar:"المدرسة الصيفية للبحث العلمي"},
 apply:{en:"No published deadline. Apply for an advertised project or propose your own to a supervisor.", ar:"لا يوجد موعد نهائي معلن. قدّم على مشروع معلن أو اقترح مشروعك على مشرف."},
 duration:{en:"About eight weeks over the summer on a laboratory, clinical or non laboratory project.", ar:"نحو ثمانية أسابيع صيفًا في مشروع مختبري أو سريري أو غير مختبري."},
 elig:{en:"RCSI undergraduate students. The page does not say whether students of other universities may apply.", ar:"طلبة البكالوريوس في الجامعة. ولا توضح الصفحة إمكانية تقديم طلبة جامعات أخرى."},
 how:{en:"Through the university virtual learning environment, or email rss@rcsi-mub.com.", ar:"عبر بيئة التعلم الافتراضية بالجامعة، أو راسل rss@rcsi-mub.com."},
 url:"https://www.rcsi.com/bahrain/research/research-summer-school", checked:"2026-08-24"},

{id:"khuh-academy", ct:"bh", sector:"health", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"King Hamad University Hospital", ar:"مستشفى الملك حمد الجامعي"},
 prog:{en:"Healthcare Academy clinical attachments", ar:"أكاديمية الرعاية الصحية، التنسيب السريري"},
 apply:{en:"Booked through the academy platform. No intake dates are published.", ar:"الحجز عبر منصة الأكاديمية. ولا تُنشر مواعيد للدفعات."},
 duration:{en:"Not published. Covers workshops, clinical attachments and placements.", ar:"غير منشورة. تشمل ورشًا وتنسيبًا سريريًا وتدريبًا ميدانيًا."},
 elig:{en:"Not published. Expect to be asked for a university letter.", ar:"غير منشورة. توقّع أن يُطلب منك خطاب من جامعتك."},
 how:{en:"Apply and book through the Healthcare Academy platform on the hospital website. Some courses carry a fee.", ar:"قدّم واحجز عبر منصة أكاديمية الرعاية الصحية في موقع المستشفى. وبعض الدورات برسوم."},
 url:"https://www.khuh.org.bh/en/healthcareacademy", checked:"2026-08-24"},

{id:"ila-internship", ct:"bh", sector:"finance", level:["uni"], paid:"unknown", status:"dormant", gate:"residents",
 org:{en:"ila Bank", ar:"بنك إيلا"},
 prog:{en:"ila Bank Internship Programme", ar:"برنامج إيلا للتدريب"},
 apply:{en:"There is no current round. The last edition recruited through a social media contest in which you solved a riddle about the bank's products, then interviews, then training modules, then a final selection.", ar:"لا توجد دورة حالية. اعتمدت النسخة الأخيرة على مسابقة عبر وسائل التواصل تحل فيها لغزًا عن منتجات البنك، ثم مقابلات، ثم وحدات تدريبية، ثم الاختيار النهائي."},
 duration:{en:"Two months. The third edition began on 10 October 2022.", ar:"شهران. وبدأت النسخة الثالثة في ١٠ أكتوبر ٢٠٢٢."},
 elig:{en:"Students at local and international universities in Bahrain.", ar:"طلبة الجامعات المحلية والدولية في البحرين."},
 how:{en:"Enter the social media contest, sit the interview, complete the training modules at the Bahrain Institute of Banking and Finance, then present a business idea to the ila team.", ar:"شارك في مسابقة وسائل التواصل، ثم اجتز المقابلة، وأكمل الوحدات التدريبية في معهد البحرين للدراسات المصرفية والمالية، ثم قدّم فكرة عمل أمام فريق إيلا."},
 url:"https://ilabank.com/news/ila-Banks-third-internship-programme-offers-the-youth-of-Bahrain-stronger-career-prospects", checked:"2026-08-24"},

{id:"bnh-summer", ct:"bh", sector:"finance", level:["uni"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Bahrain National Holding", ar:"البحرين الوطنية القابضة"},
 prog:{en:"Summer Internship Programme", ar:"برنامج التدريب الصيفي"},
 apply:{en:"No application route is published. Editions are documented in 2021, 2022 and 2023.", ar:"لا تُنشر طريقة للتقديم. وهناك نسخ موثقة في ٢٠٢١ و٢٠٢٢ و٢٠٢٣."},
 duration:{en:"Not stated on the page.", ar:"غير مذكورة في الصفحة."},
 elig:{en:"Students from a range of universities who are interested in insurance, before they graduate.", ar:"طلبة من جامعات مختلفة ممن لديهم اهتمام بقطاع التأمين، قبل تخرجهم."},
 how:{en:"Not stated on the page.", ar:"غير مذكورة في الصفحة."},
 url:"https://www.bnhgroup.com/en/news/bahraintnationaltholdingtbnhtcommencestitstsummertinternshiptprogram/", checked:"2026-08-24"},

{id:"tatweer-furas", ct:"bh", sector:"energy", level:["grad"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"Tatweer Petroleum", ar:"تطوير للبترول"},
 prog:{en:"Furas Internship Programme", ar:"برنامج فرص للتدريب"},
 apply:{en:"No application route is published on the page. A cohort of 15 is described for 2022.", ar:"لا تُنشر طريقة للتقديم في الصفحة. وتصف الصفحة دفعة من ١٥ متدربًا في ٢٠٢٢."},
 duration:{en:"One year.", ar:"سنة واحدة."},
 elig:{en:"Bahraini fresh graduates holding a bachelor's degree.", ar:"الخريجون البحرينيون الجدد من حملة البكالوريوس."},
 how:{en:"Not stated on the page. The programme runs with the Ministry of Labour and Tamkeen.", ar:"غير مذكورة في الصفحة. ويُنفَّذ البرنامج بالتعاون مع وزارة العمل وتمكين."},
 url:"https://tatweerpetroleum.com/human-resources/", checked:"2026-08-24"},

{id:"bapco-diploma", ct:"bh", sector:"energy", level:["hs"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Bapco", ar:"بابكو"},
 prog:{en:"Diploma Programme for operators and technicians", ar:"برنامج الدبلوم للمشغلين والفنيين"},
 apply:{en:"No window is published. The page sends you to the Bapco careers portal.", ar:"لا تُنشر فترة تقديم. وتحيلك الصفحة إلى بوابة التوظيف لدى بابكو."},
 duration:{en:"Two to three years.", ar:"من سنتين إلى ثلاث سنوات."},
 elig:{en:"Trainees entering roles as operators or technicians in oil and gas operations, mechanical engineering, electrical engineering, and instrumentation and control. The page notes that a first intake of 15 female trainees joined in 2019.", ar:"متدربون يلتحقون بوظائف مشغلين أو فنيين في عمليات النفط والغاز والهندسة الميكانيكية والهندسة الكهربائية وأجهزة القياس والتحكم. وتذكر الصفحة أن أول دفعة من ١٥ متدربة التحقت في ٢٠١٩."},
 how:{en:"Not stated on the page beyond the link to the careers portal.", ar:"غير مذكورة في الصفحة سوى رابط بوابة التوظيف."},
 url:"https://www.bapco.net/en/page/training-and-development/", checked:"2026-08-24"},

{id:"bibf-waqf-fund", ct:"bh", sector:"finance", level:["grad"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"Bahrain Institute of Banking and Finance with the Waqf Fund", ar:"معهد البحرين للدراسات المصرفية والمالية بالتعاون مع صندوق الوقف"},
 prog:{en:"Specialised training in risk, audit and compliance", ar:"تدريب متخصص في المخاطر والتدقيق والالتزام"},
 apply:{en:"Announced on 29 April 2024. No later round has been announced, so email first to ask before you count on it.", ar:"أُعلن عنه في ٢٩ أبريل ٢٠٢٤. ولم تُعلن دورة بعده، فراسلهم للسؤال قبل أن تعتمد عليه."},
 duration:{en:"Three weeks.", ar:"ثلاثة أسابيع."},
 elig:{en:"Young Bahrainis and recent graduates who want a career in banking and finance.", ar:"الشباب البحرينيون والخريجون الجدد الراغبون في مهنة في المصارف والتمويل."},
 how:{en:"Email islamicfinance@bibf.com.", ar:"راسل islamicfinance@bibf.com."},
 url:"https://www.bibf.com/bibf-waqf-fund-en/", checked:"2026-08-24"},

{id:"bcfc-bidaya", ct:"bh", sector:"finance", level:["uni","grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Bahrain Commercial Facilities Company", ar:"شركة البحرين للتسهيلات التجارية"},
 prog:{en:"Bidaya Summer Internship Programme", ar:"برنامج بداية للتدريب الصيفي"},
 apply:{en:"The first edition ran for two months from 1 July 2026, so expect applications in the spring if it returns.", ar:"أُقيمت النسخة الأولى لمدة شهرين ابتداءً من ١ يوليو ٢٠٢٦، فترقّب التقديم في الربيع إن عادت."},
 duration:{en:"Two months, with rotations across the company's departments.", ar:"شهران مع تناوب على إدارات الشركة."},
 elig:{en:"University students and fresh graduates from institutions in Bahrain and abroad.", ar:"طلبة الجامعات والخريجون الجدد من مؤسسات داخل البحرين وخارجها."},
 how:{en:"Not published. The company careers page takes applications and keeps CVs for six months.", ar:"غير منشورة. تستقبل صفحة الوظائف لدى الشركة الطلبات وتحتفظ بالسير الذاتية ستة أشهر."},
 url:"https://www.bcfc.bh/AboutUs/Careers/", checked:"2026-08-24"},

{id:"oq-internship", ct:"om", sector:"energy", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"OQ", ar:"أوكيو"},
 prog:{en:"Internship Programme", ar:"برنامج التدريب"},
 apply:{en:"A standing online form with no deadline. You choose a preferred start date and a preferred location, Muscat, Salalah or Sohar.", ar:"نموذج إلكتروني دائم بلا موعد نهائي. تختار فيه تاريخ البدء المفضل والموقع المفضل، مسقط أو صلالة أو صحار."},
 duration:{en:"Not published. The form asks what period you need.", ar:"غير منشورة. يسألك النموذج عن المدة التي تحتاجها."},
 elig:{en:"College and university students who need a placement. The form also takes job seekers.", ar:"طلبة الكليات والجامعات ممن يحتاجون إلى تدريب. ويستقبل النموذج الباحثين عن عمل أيضًا."},

 prog:{en:"TAROT Duroob", ar:"برنامج تاروت دروب"},
 apply:{en:"Worth knowing about but not currently evidenced. The company defines it as a scheme for GCC nationals based in their own country, which would include Bahrainis and Omanis, but the only postings we could reach are from 2017 and one is marked expired. Ask the hotel in your own country rather than applying to a UAE posting.", ar:"يستحق المعرفة لكن لا دليل على قيامه الآن. تعرّفه الشركة بأنه برنامج لمواطني دول الخليج المقيمين في بلدانهم، وهو ما يشمل البحرينيين والعُمانيين، غير أن الإعلانات الوحيدة التي وصلنا إليها من عام ٢٠١٧ وأحدها منتهٍ. فاسأل الفندق في بلدك بدل التقديم على إعلان إماراتي."},
 duration:{en:"Eighteen months of fast track development.", ar:"ثمانية عشر شهرًا من التطوير المُعجَّل."},
 elig:{en:"GCC nationals based in their country of origin, holding a higher education degree. Each individual posting then restricts to one nationality, so a Bahraini would need a Bahrain posting.", ar:"مواطنو دول الخليج المقيمون في بلدانهم، من حملة شهادة التعليم العالي. ثم يقصر كل إعلان على جنسية واحدة، فيحتاج البحريني إلى إعلان في البحرين."},

 how:{en:"An aptitude test, a behavioural interview and a technical interview. Questions to AE-Recruitment@kpmg.com.", ar:"اختبار قدرات ومقابلة سلوكية ومقابلة فنية. والاستفسارات على AE-Recruitment@kpmg.com."},
 url:"https://kpmg.com/ae/en/careers/excel-internship-program.html", checked:"2026-08-24"},

{id:"kpmg-excel-immersion", ct:"ae", sector:"consulting", level:["hs","uni"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"KPMG Lower Gulf", ar:"كي بي إم جي الخليج الأدنى"},

{id:"sap-ypp-uae", ct:"ae", sector:"tech", level:["grad"], paid:"no", status:"open", gate:"unstated",
 org:{en:"SAP", ar:"ساب"},
 prog:{en:"Young Professionals Programme", ar:"برنامج المهنيين الشباب"},
 apply:{en:"Open now. The posting went up on 29 July 2026 with no closing date and the programme starts at the beginning of October 2026. This is the only UAE programme we found that is accepting applications today.", ar:"مفتوح الآن. نُشر الإعلان في ٢٩ يوليو ٢٠٢٦ دون تاريخ إغلاق، ويبدأ البرنامج مطلع أكتوبر ٢٠٢٦. وهو البرنامج الإماراتي الوحيد الذي وجدناه يستقبل الطلبات اليوم."},
 duration:{en:"Two months full time, delivered online in a live virtual classroom from nine to six, Monday to Friday. The training is fully sponsored but it is not a salaried job.", ar:"شهران بدوام كامل، يُقدَّم إلكترونيًا في صف افتراضي مباشر من التاسعة إلى السادسة من الاثنين إلى الجمعة. والتدريب ممول بالكامل لكنه ليس وظيفة براتب."},
 elig:{en:"A bachelor's degree in business, management information systems, engineering, data science or AI. You must be unemployed or in part time work unrelated to your goals, preferably graduated within the last three years in the top quartile, and fluent in English. No nationality or visa rule appears in the posting, though SAP's general rule is that you live in a country where the programme runs.", ar:"شهادة بكالوريوس في الأعمال أو نظم المعلومات الإدارية أو الهندسة أو علم البيانات أو الذكاء الاصطناعي. ويلزم أن تكون بلا عمل أو في عمل جزئي لا يتصل بطموحك، ويفضل أن تكون تخرجت خلال ثلاث سنوات ضمن الربع الأعلى، وأن تجيد الإنجليزية. ولا يظهر شرط جنسية ولا تأشيرة في الإعلان، وإن كانت قاعدة ساب العامة أن تقيم في بلد يُقام فيه البرنامج."},
 how:{en:"Apply on the SAP careers posting with an English CV.", ar:"قدّم عبر إعلان التوظيف لدى ساب بسيرة ذاتية بالإنجليزية."},
 url:"https://www.sap.com/mena/training-certification/digital-skills-center.html", checked:"2026-08-24"},

 elig:{en:"The company describes it as open to all nationalities and welcomes students at school, diploma, bachelor's and master's level. Note that this wording comes from a company news item rather than a live eligibility page, so confirm when you apply.", ar:"تصفه الشركة بأنه مفتوح لكل الجنسيات وترحب بالطلبة في المدرسة والدبلوم والبكالوريوس والماجستير. وانتبه إلى أن هذه الصياغة وردت في خبر للشركة لا في صفحة شروط قائمة، فتأكد عند التقديم."},

 duration:{en:"Eight weeks, placed inside a startup, a corporate partner, a venture fund or the Hub71 team itself.", ar:"ثمانية أسابيع داخل شركة ناشئة أو شريك مؤسسي أو صندوق استثماري أو فريق هب ٧١ نفسه."},

{id:"desc-cyber-internship", ct:"ae", sector:"tech", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Dubai Electronic Security Center", ar:"مركز دبي للأمن الإلكتروني"},
 prog:{en:"Cybersecurity Internships", ar:"التدريب في الأمن السيبراني"},
 apply:{en:"Rolling. You propose your own dates, which is unusual and useful.", ar:"مستمر على مدار العام. وتقترح أنت تواريخك، وهذا غير معتاد ومفيد."},
 duration:{en:"Three to four weeks at least, and flexible to suit your university.", ar:"من ثلاثة إلى أربعة أسابيع على الأقل، ومرنة بحسب جامعتك."},
 elig:{en:"University students interested in cybersecurity, ideally with relevant coursework and some programming in Python, JavaScript, C, Verilog or Bash. No nationality rule is published.", ar:"طلبة الجامعات المهتمون بالأمن السيبراني، ويفضل من درسوا مقررات ذات صلة ولديهم برمجة ببايثون أو جافاسكربت أو سي أو فيريلوغ أو باش. ولا يُنشر شرط جنسية."},
 how:{en:"Send your CV, the cybersecurity courses you have taken, and your preferred dates through the apply control on the page.", ar:"أرسل سيرتك الذاتية والمقررات التي درستها في الأمن السيبراني والتواريخ المفضلة عبر زر التقديم في الصفحة."},
 url:"https://www.desc.gov.ae/contact-us/internships-careers/", checked:"2026-08-24"},

{id:"mbzuai-ugrip", ct:"ae", sector:"education", level:["uni"], paid:"yes", status:"annual", gate:"open",
 org:{en:"Mohamed bin Zayed University of Artificial Intelligence", ar:"جامعة محمد بن زايد للذكاء الاصطناعي"},
 prog:{en:"Undergraduate Research Internship Programme", ar:"برنامج التدريب البحثي لطلبة البكالوريوس"},
 apply:{en:"The 2026 deadline was 28 February for a programme running the whole of June, so the window opens in January. Put a reminder in December.", ar:"كان الموعد النهائي لعام ٢٠٢٦ في ٢٨ فبراير لبرنامج امتد يونيو كله، أي أن التقديم يُفتح في يناير. ضع تذكيرًا في ديسمبر."},
 duration:{en:"Four weeks in Abu Dhabi, fully funded. The package covers a stipend, accommodation, health insurance, the visa, airfares and airport transfers.", ar:"أربعة أسابيع في أبوظبي بتمويل كامل يشمل مكافأة وسكنًا وتأمينًا صحيًا والتأشيرة وتذاكر الطيران والتنقل من المطار وإليه."},
 elig:{en:"Undergraduates in the penultimate year of a STEM major, graduating after August, with a cumulative GPA of 3.5 out of 4 and the university's English requirement. Participants have come from more than fifty nine countries and the funding covers flights, so this is the one UAE programme you can genuinely apply to from Bahrain without already living there.", ar:"طلبة البكالوريوس في السنة قبل الأخيرة في تخصص علمي، ممن يتخرجون بعد أغسطس، بمعدل تراكمي ٣٫٥ من ٤ مع شرط اللغة الإنجليزية لدى الجامعة. وقد شارك فيه طلبة من أكثر من تسع وخمسين دولة، ويغطي التمويل تذاكر الطيران، فهو البرنامج الإماراتي الوحيد الذي يمكنك التقديم عليه فعلًا من البحرين دون أن تكون مقيمًا هناك."},
 how:{en:"Through the university's applicant portal, with an enrolment letter, transcripts, proof of English, passport, statement of purpose and CV.", ar:"عبر بوابة المتقدمين في الجامعة، مع رسالة قيد وكشوف درجات وإثبات الإنجليزية وجواز السفر وبيان الغرض والسيرة الذاتية."},
 url:"https://mbzuai.ac.ae/ugrip/", checked:"2026-08-24"},

{id:"ccad-internship", ct:"ae", sector:"health", level:["hs","uni","grad"], paid:"no", status:"open", gate:"residents",
 org:{en:"Cleveland Clinic Abu Dhabi", ar:"كليفلاند كلينك أبوظبي"},
 prog:{en:"Internship Opportunities", ar:"فرص التدريب"},
 apply:{en:"Rolling, with no cycle or deadline.", ar:"مستمر على مدار العام دون دورة ولا موعد نهائي."},
 duration:{en:"Three months, unpaid.", ar:"ثلاثة أشهر بلا أجر."},
 elig:{en:"At least eighteen, with a GPA of 3.0 and a letter from your institution. The page is titled for UAE nationals but says in its own text that applications from students holding a valid residency visa will also be considered, so do not be put off by the title.", ar:"في الثامنة عشرة فأكثر بمعدل ٣٫٠ ورسالة من مؤسستك التعليمية. وعنوان الصفحة خاص بالمواطنين، لكن نصها يذكر أن طلبات الطلبة من حاملي الإقامة السارية تُدرس كذلك، فلا يصرفك العنوان."},
 how:{en:"Your college or university emails the hospital with a cover letter and your CV. You cannot send it yourself.", ar:"ترسل كليتك أو جامعتك بريدًا إلى المستشفى برسالة تعريف وسيرتك الذاتية، ولا يمكنك إرسالها بنفسك."},
 url:"https://www.clevelandclinicabudhabi.ae/en/careers/internship-opportunities-for-uae-nationals", checked:"2026-08-24"},

{id:"ccad-wateen", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"open", gate:"nationals",

 prog:{en:"Wateen Graduate Trainee Programme", ar:"برنامج وتين لتدريب الخريجين"},
 apply:{en:"Applications are accepted throughout the year.", ar:"تُقبل الطلبات على مدار العام."},
 duration:{en:"Twelve months.", ar:"اثنا عشر شهرًا."},
 elig:{en:"Emiratis with an undergraduate degree awarded in the past two years and a graduation GPA of at least 3 out of 4. Screening covers numerical reasoning, cognitive ability, personality and English.", ar:"الإماراتيون من حملة البكالوريوس خلال السنتين الماضيتين بمعدل تخرج لا يقل عن ٣ من ٤. ويشمل الفرز الاستدلال العددي والقدرات المعرفية والشخصية والإنجليزية."},
 how:{en:"Email the careers team to start, then the assessment stages.", ar:"راسل فريق التوظيف للبدء، ثم مراحل التقييم."},
 url:"https://www.clevelandclinicabudhabi.ae/en/careers/uae-nationals/wateen-graduate-trainee-program", checked:"2026-08-24"},

 prog:{en:"Clinical Elective Programme", ar:"برنامج التدريب السريري الاختياري"},

 duration:{en:"Four to twelve weeks.", ar:"من أربعة إلى اثني عشر أسبوعًا."},
 elig:{en:"Health professional students and postgraduates, including doctors, nurses, pharmacists and allied health. No nationality rule and no fee are published.", ar:"طلبة المهن الصحية وخريجوها، ومنهم الأطباء والممرضون والصيادلة والمهن الصحية المساندة. ولا يُنشر شرط جنسية ولا رسوم."},
 how:{en:"An online form linked from the page, with questions to the education department.", ar:"نموذج إلكتروني في الصفحة، والاستفسارات إلى دائرة التعليم."},
 url:"https://www.clevelandclinicabudhabi.ae/en/institutes-and-specialties/education/clinical-elective-program", checked:"2026-08-24"},

{id:"doh-abudhabi-internship", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"open",
 org:{en:"Department of Health, Abu Dhabi", ar:"دائرة الصحة، أبوظبي"},
 prog:{en:"Medical Internship Programme", ar:"برنامج الامتياز الطبي"},
 apply:{en:"The window is 1 to 31 March every year, for a start on 1 September. The 2026 round has closed.", ar:"فترة التقديم من ١ إلى ٣١ مارس كل عام، لبدء في ١ سبتمبر. وقد أُغلقت دورة ٢٠٢٦."},
 duration:{en:"One year.", ar:"سنة واحدة."},
 elig:{en:"Named categories are UAE nationals, UAE graduates and eligible international graduates holding an accredited medical or dental degree. The minimum GPA varies by category, international graduates must show English proficiency, and there are limits on time since graduation. This is one of the clearest routes in Abu Dhabi that names international graduates outright.", ar:"الفئات المذكورة هي المواطنون وخريجو الإمارات والخريجون الدوليون المؤهلون من حملة شهادة طب أو طب أسنان معتمدة. ويختلف الحد الأدنى للمعدل بحسب الفئة، ويلزم الخريجين الدوليين إثبات الإنجليزية، وهناك حدود لمدة ما بعد التخرج. وهو من أوضح المسارات في أبوظبي التي تذكر الخريجين الدوليين صراحة."},
 how:{en:"Through the government services account, with the form, documents and a signed declaration before the deadline.", ar:"عبر حساب الخدمات الحكومية، مع النموذج والمستندات وإقرار موقّع قبل الموعد النهائي."},
 url:"https://www.doh.gov.ae/en/programs-initiatives/meed/intermediate-training-program/Internship-Program", checked:"2026-08-24"},

{id:"dubaihealth-internship", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"open",
 org:{en:"Dubai Health and Mohammed Bin Rashid University", ar:"دبي الصحية وجامعة محمد بن راشد"},
 prog:{en:"Medical Internship Programme", ar:"برنامج الامتياز الطبي"},
 apply:{en:"The 2026 window opened on 19 February and closed on 3 May, so aim for February.", ar:"فُتحت دورة ٢٠٢٦ في ١٩ فبراير وأُغلقت في ٣ مايو، فاستهدف فبراير."},
 duration:{en:"One year, with ninety medical and twenty five dental places, accredited by the national institute for health specialties. The 2026 intake started on 24 August.", ar:"سنة واحدة بتسعين مقعدًا للطب وخمسة وعشرين لطب الأسنان، ومعتمد من المعهد الوطني للتخصصات الصحية. وبدأت دفعة ٢٠٢٦ في ٢٤ أغسطس."},
 elig:{en:"A medicine or dentistry degree from a college listed in the world health organisation directory, usually within two years of graduating, with English by IELTS, TOEFL or EmSAT. GCC and non UAE nationals are formally an accepted category, but the monthly honorarium is reserved for UAE nationals and dental applicants from outside pay substantial tuition.", ar:"شهادة في الطب أو طب الأسنان من كلية مدرجة في دليل منظمة الصحة العالمية، عادة خلال سنتين من التخرج، مع إثبات الإنجليزية بآيلتس أو توفل أو إمسات. ومواطنو الخليج وغير الإماراتيين فئة مقبولة رسميًا، لكن المكافأة الشهرية مقصورة على المواطنين، ويدفع المتقدمون لطب الأسنان من الخارج رسومًا دراسية كبيرة."},
 how:{en:"Online through the admissions portal, with a non refundable application fee.", ar:"إلكترونيًا عبر بوابة القبول، برسم تقديم غير مسترد."},
 url:"https://www.mbru.ac.ae/graduate-medical-education/internship-admissions/", checked:"2026-08-24"},

{id:"dha-internship", ct:"ae", sector:"health", level:["grad"], paid:"no", status:"annual", gate:"open",
 org:{en:"Dubai Health Authority", ar:"هيئة الصحة بدبي"},
 prog:{en:"Internship Training Programmes, medicine and dentistry", ar:"برامج تدريب الامتياز، الطب وطب الأسنان"},
 apply:{en:"The published window is 10 February to 31 March, but the page still shows the 2025 cycle, so check the current dates against the Dubai Health intake before you rely on it.", ar:"الفترة المنشورة من ١٠ فبراير إلى ٣١ مارس، لكن الصفحة ما تزال تعرض دورة ٢٠٢٥، فقارن التواريخ الحالية بدفعة دبي الصحية قبل أن تعتمد عليها."},
 duration:{en:"One year: six months in medical departments and six in surgical for medicine, and twelve months across seven units for dentistry.", ar:"سنة واحدة: ستة أشهر في الأقسام الباطنية وستة في الجراحية للطب، واثنا عشر شهرًا في سبع وحدات لطب الأسنان."},
 elig:{en:"Graduates of locally and internationally recognised medical schools. The authority states plainly that graduates of internationally recognised colleges from different nationalities are accepted. No application is taken more than two years after your final exams, and English is by TOEFL 550, IELTS 6 or OET 300.", ar:"خريجو كليات الطب المعترف بها محليًا ودوليًا. وتذكر الهيئة صراحة أن خريجي الكليات المعترف بها دوليًا من جنسيات مختلفة مقبولون. ولا يُقبل طلب بعد سنتين من الامتحان النهائي، والإنجليزية بتوفل ٥٥٠ أو آيلتس ٦ أو أو إي تي ٣٠٠."},
 how:{en:"Through the authority's online services, with a processing fee.", ar:"عبر الخدمات الإلكترونية للهيئة، برسم معالجة."},
 url:"https://www.dha.gov.ae/en/Medical%20Education%20and%20Research/Internship%20Training%20Programs", checked:"2026-08-24"},

{id:"seha-medical-internship", ct:"ae", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"SEHA", ar:"شركة صحة"},
 prog:{en:"Medical Internship Programme", ar:"برنامج الامتياز الطبي"},
 apply:{en:"Not published.", ar:"غير منشورة."},
 duration:{en:"A one year clinical programme with rotations across the major specialties.", ar:"برنامج سريري لسنة واحدة بالتناوب على التخصصات الرئيسة."},
 elig:{en:"Emiratis from approved UAE medical schools or any school on the international directory, and expatriate graduates of approved UAE medical schools, subject to places being available. There is a small fee for expatriates.", ar:"الإماراتيون من كليات الطب المعتمدة في الإمارات أو أي كلية في الدليل الدولي، والخريجون المقيمون من كليات الطب المعتمدة في الإمارات بحسب توفر المقاعد. وهناك رسم صغير على المقيمين."},
 how:{en:"Through the careers portal with proof of completion, your transcript, passport copy and a photograph.", ar:"عبر بوابة التوظيف مع إثبات الإتمام وكشف الدرجات ونسخة الجواز وصورة شخصية."},
 url:"https://skmc.seha.ae/join-our-team/", checked:"2026-08-24"},

{id:"ehs-clinical-attachment", ct:"ae", sector:"health", level:["grad"], paid:"no", status:"open", gate:"residents",
 org:{en:"Emirates Health Services", ar:"مؤسسة الإمارات للخدمات الصحية"},
 prog:{en:"Clinical Training Registration", ar:"التسجيل في برامج التدريب السريري"},
 apply:{en:"Rolling, with no deadline. The service runs online at any hour and applications are processed on working days.", ar:"مستمر على مدار العام دون موعد نهائي. والخدمة إلكترونية في أي وقت، وتُعالج الطلبات في أيام العمل."},
 duration:{en:"Set per applicant. Fees are two hundred dirhams to apply and a thousand for each month of enrolment.", ar:"تُحدد لكل متقدم. والرسوم مئتا درهم للتقديم وألف درهم عن كل شهر التحاق."},
 elig:{en:"Graduate physicians from medical and dental faculties and graduates of health science faculties. The document list provides for non nationals through a copy of a valid residency visa, which is the route if you are not Emirati.", ar:"الأطباء الخريجون من كليات الطب وطب الأسنان وخريجو كليات العلوم الصحية. وتوفر قائمة المستندات مسارًا لغير المواطنين عبر نسخة من إقامة سارية، وهو الطريق إن لم تكن إماراتيًا."},
 how:{en:"Apply first to the practitioner evaluation service, then submit the attachment form and documents online.", ar:"قدّم أولًا على خدمة تقييم الممارسين، ثم أرسل نموذج الإلحاق والمستندات إلكترونيًا."},
 url:"https://www.ehs.gov.ae/en/services/training-and-development/request-for-registration-in-the-clinical-training-programs", checked:"2026-08-24"},

{id:"burjeel-observership", ct:"ae", sector:"health", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Burjeel Holdings", ar:"برجيل القابضة"},
 prog:{en:"Undergraduate Observership and Short Term Training", ar:"برنامج الملاحظة والتدريب القصير"},
 apply:{en:"Rolling. No deadline is published.", ar:"مستمر على مدار العام دون موعد نهائي منشور."},
 duration:{en:"Four to twelve weeks per rotation, set by what your university requires. This is observation only, not hands on.", ar:"من أربعة إلى اثني عشر أسبوعًا لكل فترة بحسب ما تطلبه جامعتك. وهو ملاحظة فقط لا ممارسة."},
 elig:{en:"School leavers and undergraduates enrolled in an accredited programme in medicine, dentistry, pharmacy, nursing or allied health. You need a university ID, health clearance and liability insurance, and the request must come from your university. No nationality rule and no fee are published.", ar:"خريجو الثانوية وطلبة البكالوريوس الملتحقون ببرنامج معتمد في الطب أو طب الأسنان أو الصيدلة أو التمريض أو المهن الصحية المساندة. وتحتاج إلى بطاقة جامعية وإخلاء صحي وتأمين مسؤولية، وأن يأتي الطلب من جامعتك. ولا يُنشر شرط جنسية ولا رسوم."},
 how:{en:"Your university submits the training request form, or contacts academic affairs directly.", ar:"تقدّم جامعتك نموذج طلب التدريب، أو تتواصل مع الشؤون الأكاديمية مباشرة."},
 url:"https://burjeelholdings.com/strategy/medical-education/undergraduate-training/", checked:"2026-08-24"},

{id:"purehealth-trainee", ct:"ae", sector:"health", level:["uni","grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"PureHealth", ar:"بيور هيلث"},
 prog:{en:"Student Trainee and Graduate Trainee Programmes", ar:"برنامجا تدريب الطلبة والخريجين"},
 apply:{en:"Rolling, through an online form.", ar:"مستمر على مدار العام عبر نموذج إلكتروني."},
 duration:{en:"Six to eight weeks for students, twelve months for graduates, with the possibility of a permanent role afterwards.", ar:"من ستة إلى ثمانية أسابيع للطلبة، واثنا عشر شهرًا للخريجين مع إمكانية وظيفة دائمة بعدها."},
 elig:{en:"Emirati undergraduates and graduates with a GPA of 3 or above.", ar:"طلبة البكالوريوس والخريجون الإماراتيون بمعدل ٣ فأعلى."},
 how:{en:"Through the online form on the development centre page.", ar:"عبر النموذج الإلكتروني في صفحة مركز التطوير."},
 url:"https://purehealth.ae/emiratidevelopmentcenter/", checked:"2026-08-24"},

{id:"nyuad-external-internship", ct:"ae", sector:"education", level:["uni","grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"New York University Abu Dhabi", ar:"جامعة نيويورك أبوظبي"},
 prog:{en:"External Internship Programme", ar:"برنامج التدريب للطلبة من خارج الجامعة"},
 apply:{en:"Spring applications have closed and the university says autumn opportunities will be announced later in the year.", ar:"أُغلق تقديم الفصل الربيعي، وتذكر الجامعة أن فرص الخريف ستُعلن لاحقًا هذا العام."},
 duration:{en:"Not published. Full time roles run thirty five hours a week and part time at least ten.", ar:"غير منشورة. والوظائف بدوام كامل خمس وثلاثون ساعة أسبوعيًا وبدوام جزئي عشر ساعات على الأقل."},
 elig:{en:"At least eighteen and enrolled full time at a university in the UAE, in good academic standing. Recent graduates within three years and master's candidates may also apply. School students are not eligible, and this programme is for students of other universities, not the university's own.", ar:"في الثامنة عشرة فأكثر وملتحق بدوام كامل بجامعة في الإمارات، بسجل أكاديمي سليم. ويمكن كذلك للخريجين خلال ثلاث سنوات وطلبة الماجستير التقديم. ولا يُقبل طلبة المدارس، والبرنامج مخصص لطلبة الجامعات الأخرى لا لطلبة الجامعة نفسها."},
 how:{en:"Email the hiring manager directly with your CV, a cover letter and a reference letter, plus a research statement for research roles.", ar:"راسل المسؤول عن التوظيف مباشرة بسيرتك الذاتية ورسالة تعريف ورسالة توصية، مع بيان بحثي للأدوار البحثية."},
 url:"https://nyuad.nyu.edu/en/about/careers/internships.html", checked:"2026-08-24"},

{id:"ku-cmhs-internship", ct:"ae", sector:"education", level:["uni","grad"], paid:"no", status:"annual", gate:"unstated",
 org:{en:"Khalifa University", ar:"جامعة خليفة"},
 prog:{en:"College of Medicine Summer Internship", ar:"التدريب الصيفي في كلية الطب"},
 apply:{en:"Dates are published only inside an image on the page, so watch it in the spring.", ar:"لا تُنشر التواريخ إلا داخل صورة في الصفحة، فتابعها في الربيع."},
 duration:{en:"Eight weeks. The university states plainly that it is unpaid and that no fees are charged either.", ar:"ثمانية أسابيع. وتذكر الجامعة صراحة أنه بلا أجر وأنه بلا رسوم كذلك."},
 elig:{en:"Third and fourth year students or recent graduates with a strong grounding in biology or a related science, interested in molecular biology and genetics. No nationality rule is published.", ar:"طلبة السنتين الثالثة والرابعة أو الخريجون الجدد بأساس قوي في الأحياء أو علم متصل، المهتمون بالبيولوجيا الجزيئية وعلم الوراثة. ولا يُنشر شرط جنسية."},
 how:{en:"An online form on the page, with your CV, transcript and a statement of purpose.", ar:"نموذج إلكتروني في الصفحة، مع سيرتك الذاتية وكشف درجاتك وبيان الغرض."},
 url:"https://www.ku.ac.ae/ku-cmhs-internship-program-summer-2026", checked:"2026-08-24"},

{id:"dubaicares-internships", ct:"ae", sector:"ngo", level:["uni","grad"], paid:"no", status:"open", gate:"unstated",
 org:{en:"Dubai Cares", ar:"دبي العطاء"},
 prog:{en:"Internship Openings", ar:"فرص التدريب"},
 apply:{en:"Rolling. The organisation says it runs internships all year across fundraising, marketing, programmes, finance, operations and human resources. Note that some role descriptions on the page have not been updated in years, though the application form is live.", ar:"مستمر على مدار العام. وتذكر المؤسسة أنها تستقبل المتدربين طوال السنة في جمع التبرعات والتسويق والبرامج والمالية والعمليات والموارد البشرية. وانتبه إلى أن بعض أوصاف الأدوار لم تُحدَّث منذ سنوات، وإن كان نموذج التقديم قائمًا."},
 duration:{en:"At least two months, on site, Sunday to Thursday hours. The listed roles are marked unpaid.", ar:"شهران على الأقل حضوريًا بدوام أيام الأسبوع. والأدوار المعلنة موسومة بأنها بلا أجر."},
 elig:{en:"Undergraduate or graduate students. A sample role asked for a degree in international development, education, economics or social policy, with English, research and analytical skills. No nationality rule appears anywhere.", ar:"طلبة البكالوريوس أو الدراسات العليا. وطلب أحد الأدوار شهادة في التنمية الدولية أو التعليم أو الاقتصاد أو السياسات الاجتماعية، مع الإنجليزية ومهارات البحث والتحليل. ولا يظهر شرط جنسية في أي موضع."},
 how:{en:"The online internship form on the openings page.", ar:"نموذج التدريب الإلكتروني في صفحة الفرص."},
 url:"https://www.dubaicares.ae/careers/internship-openings/", checked:"2026-08-24"},

{id:"enwwf-graduate-trainee", ct:"ae", sector:"ngo", level:["grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Emirates Nature with WWF", ar:"الإمارات للطبيعة بالتعاون مع الصندوق العالمي للطبيعة"},
 prog:{en:"Graduate Trainee, Community Outreach and Volunteerism", ar:"متدرب خريج، التواصل المجتمعي والتطوع"},
 apply:{en:"Open now. The role page gives a closing date of 11 September 2026, although the careers index lists an earlier date for the same role, so apply sooner rather than later.", ar:"مفتوح الآن. وتذكر صفحة الوظيفة موعد إغلاق في ١١ سبتمبر ٢٠٢٦، بينما يذكر فهرس الوظائف تاريخًا أقرب للوظيفة نفسها، فقدّم مبكرًا لا متأخرًا."},
 duration:{en:"Starts in September. The end date is not published.", ar:"يبدأ في سبتمبر، ولا يُنشر تاريخ الانتهاء."},
 elig:{en:"A bachelor's or postgraduate degree in environmental science, ecology, sustainability, conservation, environmental education or a related field, with fluent English. This posting carries no nationality restriction, which matters because another vacancy on the same page is marked Emiratis only, so the organisation does label the gate when there is one.", ar:"شهادة بكالوريوس أو دراسات عليا في علوم البيئة أو البيئة الطبيعية أو الاستدامة أو الحفاظ على الطبيعة أو التربية البيئية أو مجال متصل، مع إجادة الإنجليزية. ولا يحمل هذا الإعلان أي قيد جنسية، وهذا مهم لأن وظيفة أخرى في الصفحة نفسها موسومة بأنها للإماراتيين وحدهم، أي أن المؤسسة تذكر الشرط حين يوجد."},
 how:{en:"Email a cover letter and your CV to the named contact with the role title in the subject line.", ar:"أرسل رسالة تعريف وسيرتك الذاتية إلى جهة الاتصال المذكورة مع عنوان الوظيفة في سطر الموضوع."},
 url:"https://www.emiratesnaturewwf.ae/en/careers/44-graduate-trainee-community-outreach-volunteerism", checked:"2026-08-24"},

{id:"moe-internship-portal", ct:"ae", sector:"gov", level:["uni","grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"UAE Ministry of Education", ar:"وزارة التربية والتعليم"},
 prog:{en:"The Internships Portal", ar:"بوابة التدريب"},
 apply:{en:"Rolling. Opportunities are posted as employers add them, and the portal now also carries full time roles for new graduates.", ar:"مستمر على مدار العام. وتُنشر الفرص كلما أضافتها جهات العمل، وتحمل البوابة الآن كذلك وظائف بدوام كامل للخريجين الجدد."},
 duration:{en:"Varies by listing.", ar:"تختلف بحسب الفرصة."},
 elig:{en:"Emirati students with a GPA of 3.0 or above from top universities, including Emiratis on scholarship abroad.", ar:"الطلبة الإماراتيون بمعدل ٣٫٠ فأعلى من جامعات مرموقة، ومنهم المبتعثون في الخارج."},
 how:{en:"Register on the portal and apply to the listings.", ar:"سجّل في البوابة وقدّم على الفرص المعلنة."},
 url:"https://internships.moe.gov.ae/", checked:"2026-08-24"},

{id:"hrdf-tamheer", ct:"sa", sector:"gov", level:["grad"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"Human Resources Development Fund", ar:"صندوق تنمية الموارد البشرية هدف"},
 prog:{en:"Tamheer, on the job training for graduates", ar:"برنامج تمهير للتدريب على رأس العمل"},
 apply:{en:"Open all year through the fund's portal. This is the national scheme almost every big Saudi employer plugs into.", ar:"مفتوح طوال العام عبر بوابة الصندوق. وهو البرنامج الوطني الذي تنضم إليه كل جهات العمل الكبرى تقريبًا."},
 duration:{en:"Three to six months full time, with a monthly reward of three thousand riyals paid by the fund.", ar:"من ثلاثة إلى ستة أشهر بدوام كامل، بمكافأة شهرية ثلاثة آلاف ريال يدفعها الصندوق."},
 elig:{en:"Unemployed Saudi graduates under thirty, holding a diploma or degree, with no more than a year of work experience. You can benefit at most twice, up to six months in total.", ar:"الخريجون السعوديون غير الموظفين دون الثلاثين، من حملة الدبلوم أو الشهادة الجامعية، بخبرة لا تتجاوز سنة. ويمكن الاستفادة مرتين كحد أقصى بما لا يتجاوز ستة أشهر."},
 how:{en:"Register on the fund's e services with national access, choose training on the job, and apply to the posted places.", ar:"سجّل في الخدمات الإلكترونية للصندوق عبر النفاذ الوطني، واختر التدريب على رأس العمل، وقدّم على الفرص المعلنة."},
 url:"https://www.hrdf.org.sa/en/products-and-services/programs/individuals/training/graduate-development/", checked:"2026-08-24"},

{id:"hrdf-coop", ct:"sa", sector:"gov", level:["uni"], paid:"no", status:"open", gate:"nationals",
 org:{en:"Human Resources Development Fund", ar:"صندوق تنمية الموارد البشرية هدف"},
 prog:{en:"Cooperative Training placement channel", ar:"قناة التدريب التعاوني"},
 apply:{en:"Open all year. This is where employers post the coop places your degree requires.", ar:"مفتوح طوال العام. وهنا تنشر جهات العمل مقاعد التدريب التعاوني التي يشترطها تخرجك."},
 duration:{en:"At least eight weeks, full time and on site. The fund itself pays nothing, though the employer may.", ar:"ثمانية أسابيع على الأقل بدوام كامل وحضوريًا. ولا يدفع الصندوق شيئًا، وقد تدفع جهة العمل."},
 elig:{en:"Saudi students currently enrolled in a diploma or bachelor's programme.", ar:"الطلبة السعوديون المقيدون حاليًا في برنامج دبلوم أو بكالوريوس."},
 how:{en:"Register on the fund's e services, upload your documents, and apply to the posted opportunities.", ar:"سجّل في الخدمات الإلكترونية للصندوق، وارفع مستنداتك، وقدّم على الفرص المعلنة."},
 url:"https://www.hrdf.org.sa/en/products-and-services/programs/individuals/training/cooperative-training/", checked:"2026-08-24"},

{id:"misk-internship", ct:"sa", sector:"ngo", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Misk Foundation", ar:"مؤسسة مسك"},
 prog:{en:"Misk Internship Programme", ar:"برنامج مسك للتدريب"},
 apply:{en:"The window has run in April and May in recent cycles, so aim for the spring.", ar:"جرى التقديم في أبريل ومايو في الدورات الأخيرة، فاستهدف الربيع."},
 duration:{en:"Six months, full time and in person in Riyadh, with financial compensation and a matched host company.", ar:"ستة أشهر بدوام كامل وحضوريًا في الرياض، بمقابل مالي وشركة مضيفة تُختار لك."},
 elig:{en:"Saudi bachelor's or master's graduates of the last two class years, with a GPA of 3.75 out of 5 or 3 out of 4 and advanced English, across twenty seven listed majors.", ar:"الخريجون السعوديون من حملة البكالوريوس أو الماجستير خلال آخر سنتين، بمعدل ٣٫٧٥ من ٥ أو ٣ من ٤ وإنجليزية متقدمة، في سبعة وعشرين تخصصًا معلنًا."},
 how:{en:"Sign up on the Misk hub, then an application, a video biography and a virtual interview before matching.", ar:"سجّل في منصة مسك، ثم طلب ومقطع تعريفي مصور ومقابلة افتراضية قبل المواءمة."},
 url:"https://hub.misk.org.sa/programs/skills/internship-program-at-mohammed-bin-salman-foundation-misk/", checked:"2026-08-24"},

{id:"misk-fellowship", ct:"sa", sector:"ngo", level:["uni","grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Misk Foundation", ar:"مؤسسة مسك"},
 prog:{en:"Misk Fellowship", ar:"زمالة مسك"},
 apply:{en:"Historically a spring window. The published timeline is old, so confirm the current cycle on the Misk hub first.", ar:"جرى التقديم تاريخيًا في الربيع. والجدول المنشور قديم، فتأكد من الدورة الحالية في منصة مسك أولًا."},
 duration:{en:"Six months.", ar:"ستة أشهر."},
 elig:{en:"Saudi citizens in the last two years of a bachelor's, master's or doctoral degree at a leading university anywhere in the world, with a record of leadership.", ar:"المواطنون السعوديون في آخر سنتين من البكالوريوس أو الماجستير أو الدكتوراه في جامعة مرموقة في أي مكان في العالم، بسجل قيادي."},
 how:{en:"Online application, then psychometric testing and interviews.", ar:"تقديم إلكتروني، ثم اختبارات قياس نفسي ومقابلات."},
 url:"https://misk.org.sa/en/programs/misk-fellowship/", checked:"2026-08-24"},

{id:"mawhiba-summer", ct:"sa", sector:"education", level:["hs"], paid:"no", status:"annual", gate:"nationals",
 org:{en:"Mawhiba", ar:"موهبة"},
 prog:{en:"Universal Enrichment Programme", ar:"برنامج موهبة للإثراء العالمي"},
 apply:{en:"Registration opens ahead of each summer on the Mawhiba site, and the gateway is the annual Mawhiba aptitude test.", ar:"يُفتح التسجيل قبل كل صيف في موقع موهبة، والبوابة إليه اختبار موهبة السنوي للقدرات."},
 duration:{en:"Three weeks in the summer. Families pay a contribution rather than being paid.", ar:"ثلاثة أسابيع في الصيف، وتدفع الأسر مساهمة مالية ولا يتقاضى الطالب شيئًا."},
 elig:{en:"Students in grades nine to eleven scoring 1400 or above on the Mawhiba cognitive test, with an English score if tested in Arabic. Saudi nationality or a Saudi mother, with up to a tenth of places for non Saudis.", ar:"طلبة الصفوف التاسع إلى الحادي عشر ممن حققوا ١٤٠٠ فأكثر في اختبار موهبة للقدرات، مع درجة إنجليزية لمن اختُبر بالعربية. والجنسية سعودية أو لأم سعودية، مع نسبة تصل إلى العُشر لغير السعوديين."},
 how:{en:"Register on the Mawhiba site or app, pick a course and pay the contribution.", ar:"سجّل في موقع موهبة أو تطبيقها، واختر البرنامج وسدد المساهمة."},
 url:"https://www.mawhiba.sa/en/services/mawhiba-universal-enrichment-program/", checked:"2026-08-24"},

{id:"kaust-vsrp", ct:"sa", sector:"education", level:["uni","grad"], paid:"yes", status:"open", gate:"open",
 org:{en:"KAUST", ar:"جامعة الملك عبدالله للعلوم والتقنية"},
 prog:{en:"Visiting Student Research Programme", ar:"برنامج الطلبة الباحثين الزائرين"},
 apply:{en:"Rolling, all year round, against more than a hundred live research projects. This is the one Saudi programme you can apply to from anywhere in the world.", ar:"مستمر على مدار العام، على أكثر من مئة مشروع بحثي قائم. وهو البرنامج السعودي الوحيد الذي يمكنك التقديم عليه من أي مكان في العالم."},
 duration:{en:"Two to six months, fully funded: a monthly stipend of a thousand dollars, a private room and bathroom, round trip flights and lab access.", ar:"من شهرين إلى ستة أشهر بتمويل كامل: مكافأة شهرية ألف دولار وغرفة خاصة بحمامها وتذاكر ذهاب وعودة ودخول المختبرات."},
 elig:{en:"Third year undergraduates and above, and master's students, from any country, with a GPA of 3.5 out of 4 and English proof. Current doctoral candidates are not eligible.", ar:"طلبة البكالوريوس من السنة الثالثة فأعلى وطلبة الماجستير، من أي دولة، بمعدل ٣٫٥ من ٤ وإثبات الإنجليزية. ولا يُقبل طلبة الدكتوراه الحاليون."},

{id:"conversion", strength:"survey",

/* What a placement in each sector is actually good for. */
const SECTOR_READ = {
finance:{

 good:{en:"Good for seeing industrial scale and a real safety culture, and the technical standards you meet are the same ones used across the region and beyond. It is the sector where the Gulf still trains people to a standard that transfers internationally.",

        ar:"أغلب التوظيف في الخليج في قطاع المدارس الخاصة والعالمية، وهناك يكون للتدريب وزن حقيقي، إلى جانب وظائف المناهج والقياس وتقنيات التعليم. أما في التعليم الحكومي فالراتب محدد بسلّم منشور، فالتدريب يؤثر في قبولك لا في دخلك."}},
hospitality:{
 good:{en:"Good for a fast and honest read on service standards, operational discipline and how a business runs on a margin. It is also the sector where an unpaid or very low paid placement is most common and most likely to be plain labour, so read the terms before you agree.",
       ar:"مفيد لقراءة سريعة وصادقة لمعايير الخدمة والانضباط التشغيلي وكيف يعمل نشاط على هامش ضيق. وهو أيضًا القطاع الذي يكثر فيه التدريب بلا أجر أو بأجر زهيد ويغلب أن يكون عملًا عاديًا، فاقرأ الشروط قبل أن توافق."},
 expect:{en:"Expect rostered shifts including weekends and public holidays, rotation through front desk, food and beverage and events, and a great deal of standing. You will be measured on attendance and manner more than on judgement.",
         ar:"توقّع ورديات مجدولة تشمل نهايات الأسبوع والأعياد، وتنقلًا بين الاستقبال والأغذية والمشروبات والفعاليات، ووقوفًا طويلًا. وسيُقاس أداؤك بالانضباط في الحضور وحسن التعامل أكثر من حسن التقدير."},
 leads:{en:"It leads to management trainee schemes at the international hotel operators, and increasingly to tourism development and events bodies tied to national tourism strategies. The second route pays better and is where Gulf nationals more often end up, but it recruits on project management and commercial skills rather than floor experience alone.",
        ar:"يقود إلى برامج المتدربين الإداريين لدى المشغّلين الفندقيين العالميين، وبصورة متزايدة إلى جهات تطوير السياحة والفعاليات المرتبطة بالاستراتيجيات الوطنية. والمسار الثاني أعلى أجرًا وإليه يتجه المواطنون غالبًا، لكنه يوظّف على أساس مهارات إدارة المشاريع والتجارة لا الخبرة الميدانية وحدها."}},
legal:{
 good:{en:"Good for finding out whether you can read long documents accurately for weeks without your attention slipping, which is most of the job. It is also where you discover how much of Gulf legal work is bilingual drafting rather than argument.",
       ar:"مفيد لتكتشف هل تستطيع قراءة وثائق طويلة بدقة أسابيع متصلة دون أن ينفلت انتباهك، فهذا معظم المهنة. وفيه تكتشف أن جزءًا كبيرًا من العمل القانوني الخليجي صياغة بلغتين لا مرافعة."},
 expect:{en:"Expect document review, translation between Arabic and English, preparing bundles, research memoranda, and at a local firm some court filing work. International firms in the financial centres do mostly transactional work and typically give students less to touch.",
         ar:"توقّع مراجعة مستندات، وترجمة بين العربية والإنجليزية، وإعداد ملفات القضايا، ومذكرات بحثية، وفي المكاتب المحلية بعض أعمال الإيداع أمام المحاكم. أما المكاتب الدولية في المراكز المالية فيغلب عليها العمل التعاملي وتعطي الطالب مساحة أضيق."},
 leads:{en:"It leads to trainee positions at local firms, to in house legal teams at banks, energy companies and government related entities, and to government legal departments. Check the licensing rules for your own nationality and degree before you invest, because the right to practise and to appear in court differs by country and in several Gulf states is restricted to nationals.",
        ar:"يقود إلى وظائف المحامي المتدرب في المكاتب المحلية، وإلى الإدارات القانونية داخل المصارف وشركات الطاقة والجهات الحكومية. وتحقق من أنظمة الترخيص بحسب جنسيتك ودرجتك قبل أن تستثمر وقتك، فحق مزاولة المهنة والمثول أمام المحاكم يختلف من دولة إلى أخرى وهو في عدد منها مقصور على المواطنين."}},
ngo:{
 good:{en:"Good for early responsibility, because these organisations are short staffed and will hand you real work quickly. You will build things yourself rather than watch, which is rare at this stage.",
       ar:"مفيد لأنك تتحمل مسؤولية مبكرة، إذ تعاني هذه الجهات من قلة الموظفين وستُسند إليك أعمال حقيقية بسرعة. وستبني أشياء بيدك بدل أن تكتفي بالمشاهدة، وهذا نادر في هذه المرحلة."},
 expect:{en:"Expect events, donor and grant reporting, social media, and spreadsheets you will have to build from nothing because no one else has. Supervision is often thin and processes are often absent, which is a burden and an opportunity at the same time.",
         ar:"توقّع فعاليات، وتقارير للمانحين والمنح، ووسائل تواصل، وجداول بيانات ستبنيها من الصفر لأن أحدًا لم يبنها. والإشراف ضعيف غالبًا والإجراءات غائبة غالبًا، وهذا عبء وفرصة في آن."},
 leads:{en:"The Gulf sector is small and funded mainly by government, royal foundations and corporate giving. A placement here more often leads to a communications, programme management or corporate social responsibility role inside a company or a government entity than to a career in the sector itself.",
        ar:"القطاع الخليجي صغير ويموَّل أساسًا من الحكومات والمؤسسات الملكية والعطاء المؤسسي. والتدريب هنا يقود في الغالب إلى وظيفة في الاتصال أو إدارة البرامج أو المسؤولية الاجتماعية داخل شركة أو جهة حكومية، أكثر مما يقود إلى مهنة في القطاع نفسه."}},
aviation:{
 good:{en:"Good because this is one of the few industries where Gulf employers are genuinely global operators, so what you learn transfers outside the region. It also shows you an operation that runs to the minute, which changes how you think about scheduling and cost.",
       ar:"مفيد لأنه من الصناعات القليلة التي يكون فيها أصحاب العمل الخليجيون مشغّلين عالميين فعلًا، فما تتعلمه ينتقل معك خارج المنطقة. ويعرّفك على عملية تُدار بالدقيقة، وهذا يغيّر تفكيرك في الجدولة والتكلفة."},
 expect:{en:"Expect rostered operations work, ground handling or hub control observation, network and schedule planning support, and a large amount of safety and compliance documentation. Airside access requires its own security clearance and training, which can take up a good part of a short placement.",
         ar:"توقّع عملًا تشغيليًا بالورديات، ومشاهدة الخدمات الأرضية أو غرفة التحكم، ودعم تخطيط الشبكة والجداول، وكمًّا كبيرًا من وثائق السلامة والالتزام. والدخول إلى المنطقة الجوية يتطلب تصريحًا أمنيًا وتدريبًا خاصًا، وقد يستهلك جزءًا كبيرًا من تدريب قصير."},
 leads:{en:"It leads to airline graduate programmes, to airport operators and regulators, and to maintenance and repair organisations. Be clear that pilot and cabin crew careers are recruited through separate academies and cadet schemes and are not entered through an internship.",
        ar:"يقود إلى برامج الخريجين في شركات الطيران، وإلى مشغّلي المطارات والجهات التنظيمية، وإلى شركات الصيانة والإصلاح. وليكن واضحًا أن مسار الطيارين وأطقم الضيافة يُوظَّف عبر أكاديميات وبرامج منفصلة ولا يُدخل إليه عن طريق التدريب."}}
};

/* The body we prefill. The student replaces the bracketed parts. */
function applyBody(o, lang, extra){
  const org  = o.org[lang];
  const idw = o.ct === "bh" ? "CPR" : "civil ID";
  const prog = o.prog[lang];
  if(lang === "ar"){
    /* Kept deliberately short. Arabic percent-encodes to about nine characters
       per letter, and several mail handlers cut a mailto link off past 2000. */
    return [
      "تحية طيبة،",
      "",
      "أتقدم بطلب للالتحاق بـ" + prog + " لدى " + org + ".",
      "",
      "الاسم: [كما في البطاقة]",
      "الجهة الدراسية: []",
      "التخصص والسنة: [مثال: محاسبة، الثالثة]",
      "الرقم الشخصي: []",
      "الهاتف: []",
      "الفترة المتاحة: [من / إلى]",
      "",
      "سبب اختياري لكم: [ثلاثة أسطر عن الجهة]",
      "",
      (extra ? "المرفقات: " + extra : "المرفق: السيرة الذاتية."),
      "",
      "وشكرًا،",
      "[اسمك]"
    ].join("\n");
  }
  return [
    "Dear Sir or Madam,",
    "",
    "I am writing to apply for the " + prog + " at " + org + ".",
    "",
    "Name: [your full name as it appears on your " + idw + "]",
    "University or school: [your institution]",
    "Subject and year: [for example, Accounting, third year]",
    idw + " number: [your " + idw + "]",
    "Phone: [your number]",
    "Dates I am available: [for example, 1 July to 31 August]",
    "",
    "Why I want to train with you specifically: [three lines about why this organisation, not about yourself]",
    "",
    (extra ? "Attached: " + extra : "Attached: my CV."),
    "",
    "Thank you for your time,",
    "[your name]"
  ].join("\n");
}

var LANG="en", CT="bh", ST="all", LV="all", SE="all", GRP="";
function L(){ return T[LANG]; }
function tx(o){ return o ? o[LANG] : ""; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function grpSectors(){ return GRP && GROUP_SECTORS[GRP] ? GROUP_SECTORS[GRP] : null; }

function matches(o){
  if(o.ct !== CT) return false;
  if(ST !== "all" && o.status !== ST) return false;
  if(LV !== "all" && o.level.indexOf(LV) < 0) return false;
  if(SE !== "all" && o.sector !== SE) return false;
  var g = grpSectors();
  if(g && g.indexOf(o.sector) < 0) return false;
  return true;
}

function chips(el, items, sel, attr){
  document.getElementById(el).innerHTML = items.map(function(i){
    var soon = (i.live === false);
    return '<button class="chip'+(i.k===sel?" on":"")+(soon?" soon":"")+'"'+
      (soon?' disabled title="'+esc(L().soon)+'"':'')+
      ' data-'+attr+'="'+i.k+'">'+ (i[LANG] || i.en) +'</button>';
  }).join("");
}

function renderMatcher(){
  var t = L();
  document.getElementById("m-h").textContent = t.mH;
  document.getElementById("m-p").innerHTML = t.mP.replace(
    LANG==="en" ? "the quiz is thirty four questions" : "فهو أربعة وثلاثون سؤالًا",
    '<a href="'+MC+'" target="_blank" rel="noopener">'+(LANG==="en"?"the quiz is thirty four questions":"فهو أربعة وثلاثون سؤالًا")+'</a>');
  var items = GROUP_LABELS.slice();
  document.getElementById("mchips").innerHTML =
    items.map(function(g){
      return '<button class="chip'+(g.k===GRP?" on":"")+'" data-grp="'+g.k+'">'+g[LANG]+'</button>';
    }).join("") +
    (GRP ? '<button class="chip" data-grp="">'+t.mClear+'</button>' : "");
  document.getElementById("m-hint").textContent = t.mHint;
}

function renderSectorRead(){
  var t = L(), el = document.getElementById("sread"), k = null;
  if(SE !== "all") k = SE;
  else if(GRP && GROUP_SECTORS[GRP]) k = GROUP_SECTORS[GRP][0];
  if(!k || !SECTOR_READ[k]){ el.innerHTML = ""; return; }
  var r = SECTOR_READ[k];
  var name = (SECTORS.filter(function(s){return s.k===k;})[0]||{})[LANG] || k;
  el.innerHTML = '<div class="sread"><h3>'+name+'</h3><dl>'+
    '<dt>'+t.sGood+'</dt><dd>'+tx(r.good)+'</dd>'+
    '<dt>'+t.sExpect+'</dt><dd>'+tx(r.expect)+'</dd>'+
    '<dt>'+t.sLeads+'</dt><dd>'+tx(r.leads)+'</dd>'+
    '</dl></div>';
}

function renderEvidence(){
  var t = L();
  document.getElementById("e-h").textContent = t.eH;
  document.getElementById("e-p").textContent = t.eP;
  var lab = {causal:t.evCausal, survey:t.evSurvey, contested:t.evContested, gap:t.evGap};
  document.getElementById("evlist").innerHTML = EVIDENCE.map(function(e){
    return '<div class="ev">'+
      '<span class="evtag '+e.strength+'">'+lab[e.strength]+'</span>'+
      '<div class="evclaim">'+tx(e.claim)+'</div>'+
      '<div class="evsrc"><b>'+t.evSource+':</b> '+tx(e.source)+
        ' <a class="evlink" href="'+e.url+'" target="_blank" rel="noopener">'+t.evRead+'</a></div>'+
      (e.note ? '<div class="evnote">'+tx(e.note)+'</div>' : '')+
    '</div>';
  }).join("");
}

function render(){
  var t = L();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  var kn = (KEYNOTES[CT] && KEYNOTES[CT][LANG]) || {h:t.keyH, p:t.keyP};
  document.getElementById("k-h").textContent = kn.h;
  document.getElementById("k-p").textContent = kn.p;
  document.getElementById("t-ctlabel").textContent = t.ctLabel;
  document.getElementById("t-stlabel").textContent = t.stLabel;
  document.getElementById("t-lvlabel").textContent = t.lvLabel;
  document.getElementById("t-selabel").textContent = t.seLabel;

  renderMatcher();
  chips("ctchips", CTS, CT, "ct");
  chips("stchips", STATUSES, ST, "st");
  chips("lvchips", LEVELS, LV, "lv");
  chips("sechips", SECTORS, SE, "se");
  renderSectorRead();

  var inCountry = OPPS.filter(function(o){ return o.ct === CT; });
  var rows = OPPS.filter(matches);
  var order = {open:0, annual:1, dormant:2};
  rows.sort(function(a,b){ return (order[a.status]-order[b.status]) || a.org.en.localeCompare(b.org.en); });
  document.getElementById("count").textContent = t.count(rows.length, inCountry.length);

  document.getElementById("list").innerHTML = rows.length ? rows.map(function(o){
    var stat = o.status==="open"    ? (LANG==="en"?"Open now":"مفتوح الآن")
             : o.status==="dormant" ? (LANG==="en"?"May no longer run":"قد لا يُقام الآن")
                                    : (LANG==="en"?"Runs each year":"يُقام سنويًا");
    var gcls = {open:"g-open", residents:"g-res", gcc:"g-gcc", nationals:"g-nat", unstated:"g-un"};
    var gate = (o.gate && t.gates[o.gate]) ? '<span class="tag '+gcls[o.gate]+'">'+t.gates[o.gate]+'</span>' : "";
    var paid = o.paid==="yes" ? '<span class="tag">'+t.paidYes+'</span>'
             : o.paid==="no"  ? '<span class="tag">'+t.paidNo+'</span>' : "";
    return '<div class="opp">'+
      '<div class="otop"><span class="oorg">'+tx(o.org)+'</span>'+
      '<span class="oprog">'+tx(o.prog)+'</span>'+
      '<span class="tag'+(o.status==="open"?" open":"")+'">'+stat+'</span>'+paid+gate+'</div>'+
      '<dl class="orows">'+
        '<dt>'+t.dWhen+'</dt><dd>'+tx(o.apply)+'</dd>'+
        '<dt>'+t.dWho+'</dt><dd>'+tx(o.elig)+'</dd>'+
        '<dt>'+t.dLong+'</dt><dd>'+tx(o.duration)+'</dd>'+
        '<dt>'+t.dHow+'</dt><dd>'+tx(o.how)+'</dd>'+
      '</dl>'+
      applyBlock(o, t)+
      '<div class="ometa">'+t.checked(o.checked)+'</div>'+
    '</div>';
  }).join("") : '<div class="empty">'+t.none+'</div>';

  document.getElementById("s-h").textContent = t.subH;
  document.getElementById("s-p").textContent = t.subP;
  document.getElementById("s-btn").textContent = t.subB;
  renderEvidence();
  document.getElementById("mc-h").textContent = t.mcH;
  document.getElementById("mc-p").textContent = t.mcP;
  document.getElementById("mcgrid").innerHTML = MCLINKS.map(function(m){
    var c = m[LANG];
    return '<a class="mccard" href="'+m.href+'" target="_blank" rel="noopener"><b>'+c[0]+'</b><span>'+c[1]+'</span></a>';
  }).join("");
  document.getElementById("srcT").textContent = t.srcT;
  document.getElementById("srcS").textContent = t.srcS;
  document.getElementById("t-disc").textContent = t.disc;
  document.getElementById("t-foot").innerHTML = t.foot;
}

function applyBlock(o, t){
  var a = (typeof APPLY !== "undefined" && APPLY[o.id]) || {};
  var out = '<div class="applyrow">';
  if(a.direct){
    out += '<a class="btn apply" href="'+a.direct+'" target="_blank" rel="noopener">'+t.applyDirect+'</a>';
  }
  if(a.email){
    var extra = a.attach ? a.attach[LANG] : null;
    var href = "mailto:" + a.email +
      "?subject=" + encodeURIComponent(a.subject || (o.prog[LANG] + " " + (LANG==="en"?"application":"طلب تدريب"))) +
      "&body=" + encodeURIComponent(applyBody(o, LANG, extra));
    out += '<a class="btn apply mail" href="'+href+'">'+t.applyEmail+'</a>';
  }
  out += '<a class="olink" href="'+o.url+'" target="_blank" rel="noopener">'+t.more+'</a>';
  out += '</div>';
  if(!a.direct && !a.email){
    out += '<div class="needbox"><b>'+t.applyNeedT+'</b><p>'+t.applyNeed+'</p></div>';
  }
  out += '<a class="cvlink" href="cv.html">'+t.cvHelp+'</a>';
  return out;
}

function gc(path, title){
  if(window.goatcounter && window.goatcounter.count){
    try{ window.goatcounter.count({path:path, title:title, event:true}); }catch(e){}
  }
}

document.addEventListener("click", function(e){
  var c = e.target.closest ? e.target.closest(".chip") : null;
  if(c && !c.disabled){
    if(c.hasAttribute("data-grp")){ GRP = c.getAttribute("data-grp"); SE = "all"; gc("io-grp-"+(GRP||"clear"), "Matcher "+GRP); }
    else if(c.hasAttribute("data-ct")){ CT = c.getAttribute("data-ct"); gc("io-ct-"+CT, "Country "+CT); }
    else if(c.hasAttribute("data-st")){ ST = c.getAttribute("data-st"); gc("io-st-"+ST, "When "+ST); }
    else if(c.hasAttribute("data-lv")){ LV = c.getAttribute("data-lv"); gc("io-lv-"+LV, "Level "+LV); }
    else if(c.hasAttribute("data-se")){ SE = c.getAttribute("data-se"); GRP = ""; gc("io-se-"+SE, "Sector "+SE); }
    render();
    return;
  }
  if(e.target.closest && e.target.closest(".olink")) gc("io-out", "Outbound to employer");
  if(e.target.closest && e.target.closest(".btn.apply.mail")) gc("io-mail", "Prefilled email opened");
  else if(e.target.closest && e.target.closest(".btn.apply")) gc("io-apply", "Direct apply opened");
  if(e.target.closest && e.target.closest(".cvlink")) gc("io-cv", "CV builder opened");
  if(e.target.closest && e.target.closest("#s-btn")) gc("io-submit", "Employer submit");
  if(e.target.closest && e.target.closest(".mccard")) gc("io-mc", "Across to Major Compass");
  if(e.target.closest && e.target.closest(".evlink")) gc("io-evidence", "Evidence source");
});

/* The tab title, the bookmark and anything that reads the document head
   should follow the language too, not sit in English on an Arabic page. */
var DOCTITLE = {
  en: "Internship Opportunities in Bahrain and the Gulf",
  ar: "فرص التدريب في البحرين والخليج"
};
var DOCDESC = {
  en: "Every internship in Bahrain, Oman, the UAE and Saudi Arabia we could verify, with the real application link, when applications actually open, who each one is for, and honest evidence on what a placement is worth. Free, in Arabic and English, by Dr. Saqer AlKhalifa.",
