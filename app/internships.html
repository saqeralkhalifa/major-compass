{id:"qa-qm-internship", ct:"qa", sector:"gov", level:["uni","grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"Qatar Museums", ar:"متاحف قطر"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"Runs one to six months in the spring and the autumn. The page says applications are now closed and that spring 2027 opportunities will be shared in March.", ar:"يُقام من شهر إلى ستة أشهر في الربيع والخريف. وتذكر الصفحة أن التقديم مغلق الآن وأن فرص ربيع ٢٠٢٧ ستُعلن في مارس."},
 duration:{en:"One to six months.", ar:"من شهر إلى ستة أشهر."},
 elig:{en:"Undergraduates and fresh graduates with a GPA of 2.5 or higher and a Qatar ID or residence permit. Priority to Qatari nationals.", ar:"طلبة البكالوريوس والخريجون الجدد بمعدل ٢٫٥ فأعلى وبطاقة قطرية أو إقامة. الأولوية للمواطنين القطريين."},
 how:{en:"Online form on the Qatar Museums site. The document list is not shown while applications are closed.", ar:"نموذج إلكتروني في موقع متاحف قطر. ولا تظهر قائمة المستندات أثناء إغلاق التقديم."},
 url:"https://qm.org.qa/en/about-us/careers-and-opportunities/internships/", checked:"2026-09-28"},

{id:"qa-hmc-internship", ct:"qa", sector:"health", level:["grad"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"Hamad Medical Corporation", ar:"مؤسسة حمد الطبية"},
 prog:{en:"Medical Internship Program", ar:"برنامج الامتياز الطبي"},
 apply:{en:"Two standing windows, printed with no calendar year against them. The January intake takes applications from 16 May to 15 November with notification by 20 November and a start on 1 January. The July intake takes applications from 16 November to 15 May with notification by 20 May and a start on 1 July. The page carries its own currency stamp of 20 October 2024, so confirm the graduation window before you rely on it.", ar:"فترتان دائمتان، تُطبعان دون ذكر السنة. تستقبل دفعة يناير الطلبات من ١٦ مايو إلى ١٥ نوفمبر مع الإبلاغ بحلول ٢٠ نوفمبر وبدء في ١ يناير. وتستقبل دفعة يوليو الطلبات من ١٦ نوفمبر إلى ١٥ مايو مع الإبلاغ بحلول ٢٠ مايو وبدء في ١ يوليو. وتحمل الصفحة ختم تحديث خاصًا بها في ٢٠ أكتوبر ٢٠٢٤، فتأكد من فترة التخرج قبل أن تعتمد عليها."},
 duration:{en:"One year in thirteen blocks: four required rotations and two electives.", ar:"سنة واحدة في ثلاثة عشر جزءًا: أربعة تناوبات إلزامية واثنان اختياريان."},
 elig:{en:"Graduates within the past five years, which the page writes as 2020 or more recently, from a medical school listed on the World Directory of Medical Schools. Applicants must hold Qatari citizenship, GCC citizenship, or a valid Qatar residency permit under first degree family sponsorship only. One clinical exam is required at the printed thresholds: USMLE Step 2 CK at 172, IFOM CSE at 60, or MCC QE Part 1 at a pass. One English test is required: TOEFL iBT professional level 80, IELTS Academic 6.5, or OET Medical C plus. The internship is unpaid except for Qatari nationals.", ar:"الخريجون خلال السنوات الخمس الماضية، وتكتبها الصفحة بصيغة ٢٠٢٠ أو أحدث، من كلية طب مدرجة في الدليل العالمي لكليات الطب. ويجب أن يحمل المتقدم الجنسية القطرية أو جنسية إحدى دول مجلس التعاون أو إقامة قطرية سارية بكفالة عائلية من الدرجة الأولى فقط. ويُشترط اجتياز اختبار سريري واحد بالحدود المطبوعة: يو اس ام ال اي الخطوة الثانية ١٧٢، أو اي اف او ام ٦٠، أو الجزء الأول من امتحان المجلس الكندي بدرجة ناجح. ويُشترط اختبار لغة إنجليزية واحد: توفل ٨٠، أو آيلتس أكاديمي ٦٫٥، أو او اي تي الطبي بدرجة سي زائد. والتدريب بلا أجر عدا المواطنين القطريين."},
 how:{en:"Through the How to Apply link on the page. Queries go to internship@hamad.qa. Candidates must arrive six weeks before the start date for onboarding.", ar:"عبر رابط كيفية التقديم في الصفحة. وتُرسل الاستفسارات إلى internship@hamad.qa. وعلى المقبول الوصول قبل ستة أسابيع من تاريخ البدء لإجراءات الالتحاق."},
 url:"https://www.hamad.qa/EN/Education-and-research/Medical-Education/Internship%20Program/Pages/default.aspx", checked:"2026-10-01"},

{id:"qa-sidra-ingen", ct:"qa", sector:"health", level:["hs"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Sidra Medicine", ar:"سدرة للطب"},
 prog:{en:"Introduction to Genomics program for schools", ar:"برنامج مدخل إلى الجينوم لطلبة المدارس"},
 apply:{en:"Requests come from schools. No application window is published.", ar:"تأتي الطلبات من المدارس. ولا يُنشر موعد للتقديم."},
 duration:{en:"Not stated. Hands on lab sessions in DNA extraction and analysis.", ar:"غير مذكورة. جلسات عملية في المختبر في استخلاص الحمض النووي وتحليله."},
 elig:{en:"Students in the 11th and 12th grades at public and private schools. The page prints that applications for the InGen student program must come from the school administration rather than from individual students. The program runs in collaboration with the Ministry of Education, and students work in a dedicated Biosafety Level 1 laboratory on DNA extraction, DNA quality checking and DNA amplification. No nationality rule and no residence rule are printed.", ar:"طلبة الصفين الحادي عشر والثاني عشر في المدارس الحكومية والخاصة. وتطبع الصفحة أن طلبات برنامج إنجين تأتي من إدارة المدرسة لا من الطلبة أنفسهم. ويُقام البرنامج بالتعاون مع وزارة التربية والتعليم، ويعمل الطلبة في مختبر للسلامة الحيوية من المستوى الأول على استخلاص الحمض النووي وفحص جودته وتضخيمه. ولا يُطبع شرط جنسية ولا شرط إقامة."},
 how:{en:"The school administration applies through the service request page linked from the program page, either for a student InGen program or for an information session.", ar:"تتقدم إدارة المدرسة عبر صفحة طلب الخدمة المرتبطة بصفحة البرنامج، سواء لبرنامج إنجين الطلابي أو لجلسة تعريفية."},
 url:"https://www.sidra.org/research/scientist-training/", checked:"2026-10-01"},

{id:"qa-sidra-internship", ct:"qa", sector:"health", level:["uni","grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Sidra Medicine", ar:"سدرة للطب"},
 prog:{en:"Internship and Externship Program", ar:"برنامج التدريب الداخلي والخارجي"},

 org:{en:"Primary Health Care Corporation", ar:"مؤسسة الرعاية الصحية الأولية"},
 prog:{en:"Qatar graduates application", ar:"طلب خريجي قطر"},
 apply:{en:"The page carries a live form for graduates of Qatar institutions. No application window is published.", ar:"تحمل الصفحة نموذجًا فعّالًا لخريجي المؤسسات التعليمية في قطر. ولا يُنشر موعد للتقديم."},
 duration:{en:"Not stated. This is a route into employment rather than a fixed program.", ar:"غير مذكورة. وهو مسار للتوظيف لا برنامج محدد المدة."},
 elig:{en:"The route is for Qatar graduates of Qatari and other nationalities. The page prints that a profile from a graduate of an institution outside Qatar is deleted automatically. The rule is about where you graduated rather than where you live or what passport you hold.", ar:"المسار مخصص لخريجي قطر من القطريين ومن جنسيات أخرى. وتطبع الصفحة أن ملف خريج مؤسسة من خارج قطر يُحذف تلقائيًا. والشرط يتعلق بمكان التخرج لا بمكان الإقامة ولا بالجنسية."},

 url:"https://www.phcc.gov.qa/careers", checked:"2026-09-28"},

 how:{en:"Fill in the form on the Qatarisation page: name, QID, email and phone.", ar:"املأ النموذج في صفحة التقطير: الاسم ورقم البطاقة والبريد والهاتف."},

 org:{en:"Nakilat", ar:"ناقلات"},
 prog:{en:"National Development Program", ar:"برنامج التطوير الوطني"},
 apply:{en:"A standing program for graduates the company hires. The program page prints no posting, no window and no cadence. No program posting was among the 35 vacancies live on the careers site when it was counted on 3 September 2026, and that count was not repeated on 16 September.", ar:"برنامج قائم للخريجين الذين تعيّنهم الشركة. ولا تذكر صفحة البرنامج إعلانًا ولا فترة تقديم ولا تكرارًا. ولم يكن بين الوظائف الـ٣٥ المعلنة في موقع التوظيف عند عدّها في ٣ سبتمبر ٢٠٢٦ إعلان للبرنامج، ولم يُعد العدّ في ١٦ سبتمبر."},
 duration:{en:"Phased development to a target role, onshore or at sea.", ar:"تطوير على مراحل حتى الوظيفة المستهدفة، في البر أو البحر."},
 elig:{en:"University graduates joining Nakilat. The page sits under Qatarisation but prints no nationality rule. The page also describes a marine cadet program of about four years alternating between college and sea, leading to a third officer or fourth engineer role, and routes scholarships through QatarEnergy's University Program. It prints no nationality or school leaver rule for the cadet route.", ar:"خريجو الجامعات الملتحقون بناقلات. الصفحة ضمن قسم التقطير لكنها لا تذكر شرط جنسية. وتصف الصفحة كذلك برنامج ضباط بحريين متدربين مدته نحو أربع سنوات يتناوب بين الكلية والبحر وينتهي بوظيفة ضابط ثالث أو مهندس رابع، وتحيل المنح إلى برنامج قطر للطاقة الجامعي. ولا تذكر شرط جنسية ولا شرط تخرج من الثانوية لمسار الضباط."},
 how:{en:"Apply to postings on careers.nakilat.com or join the talent community.", ar:"قدّم على الوظائف في careers.nakilat.com أو انضم إلى مجتمع المواهب."},
 url:"https://www.nakilat.com/national-development/", checked:"2026-10-01"},

{id:"qa-ashghal-internship", ct:"qa", sector:"gov", level:["uni"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"Public Works Authority, Ashghal", ar:"هيئة الأشغال العامة، أشغال"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"Open. The page prints no dates, no intake months and no deadline, so send the form whenever you are ready.", ar:"مفتوح. لا تذكر الصفحة تواريخ ولا أشهر التحاق ولا موعدًا نهائيًا، فأرسل النموذج متى كنت مستعدًا."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"University students holding a Qatar ID. Priority to students who need an internship to graduate.", ar:"طلبة الجامعات من حاملي البطاقة القطرية. الأولوية لمن يحتاج التدريب للتخرج."},
 how:{en:"Complete the application form attached to the page and email it with a copy of a Qatari ID card to Internship@ashghal.gov.qa. The page prints no requirement for a university letter.", ar:"عبّئ نموذج الطلب المرفق بالصفحة وأرسله بالبريد مع نسخة من البطاقة الشخصية القطرية إلى Internship@ashghal.gov.qa. ولا تطبع الصفحة أي اشتراط لخطاب من الجامعة."},
 url:"https://www.ashghal.gov.qa/en/Careers/Pages/summertrainingprogramme.aspx", checked:"2026-09-28"},

{id:"qa-aspire-internship", ct:"qa", sector:"gov", level:["uni","grad"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"Aspire Zone Foundation", ar:"مؤسسة أسباير زون"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"The page asks you to write for details. No application window is published.", ar:"تطلب الصفحة مراسلتها للحصول على التفاصيل. ولا يُنشر موعد للتقديم."},
 duration:{en:"Not stated.", ar:"غير مذكورة."},
 elig:{en:"Qatari nationals and Qatar residents with their sponsor's approval, aged 18 to 30, either fresh graduates or undergraduates with at least 60 credit hours, with a GPA of 2.0 or higher and a relevant major. Professional fluency in English is required and Arabic and English speakers are preferred.", ar:"المواطنون القطريون والمقيمون في قطر بموافقة الكفيل، بين ١٨ و٣٠ عامًا، من الخريجين الجدد أو طلبة البكالوريوس ممن أتموا ٦٠ ساعة معتمدة، بمعدل ٢٫٠ فأعلى وتخصص مناسب. وتُشترط إجادة مهنية للإنجليزية مع تفضيل المتحدثين بالعربية والإنجليزية."},
 how:{en:"Email NationalDevelopment.AZF@aspirezone.qa.", ar:"راسل NationalDevelopment.AZF@aspirezone.qa."},
 url:"https://aspirezone.qa/en/careers/national-development/internship-programme", checked:"2026-09-28"},

{id:"qa-aspire-scholarship", ct:"qa", sector:"gov", level:["hs","uni"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"Aspire Zone Foundation", ar:"مؤسسة أسباير زون"},
 prog:{en:"Student Scholarship Program", ar:"برنامج المنح الدراسية للطلبة"},
 apply:{en:"The page asks you to write for details. No application window is published.", ar:"تطلب الصفحة مراسلتها للحصول على التفاصيل. ولا يُنشر موعد للتقديم."},
 duration:{en:"A bachelor or postgraduate degree, in Qatar or abroad.", ar:"درجة بكالوريوس أو دراسات عليا، في قطر أو الخارج."},
 elig:{en:"Qatari nationals aged 30 or under with at least 80 percent in secondary school and an unconditional acceptance letter from an accredited university. The page prints no rule on the field of study. It covers bachelor and postgraduate study, in Qatar and abroad, with academic guidance, financial support and employment at the foundation on graduation.", ar:"المواطنون القطريون في سن ٣٠ فما دون، بنسبة ٨٠٪ على الأقل في الثانوية وقبول غير مشروط من جامعة معتمدة. ولا تذكر الصفحة شرطًا بشأن مجال الدراسة. ويشمل البرنامج الدراسة الجامعية والدراسات العليا داخل قطر وخارجها، مع إرشاد أكاديمي ودعم مالي ووظيفة في المؤسسة بعد التخرج."},
 how:{en:"Email NationalDevelopment.AZF@aspirezone.qa confirming you meet the conditions.", ar:"راسل NationalDevelopment.AZF@aspirezone.qa مؤكدًا استيفاء الشروط."},
 url:"https://aspirezone.qa/en/careers/national-development/student-scholarship-programme", checked:"2026-09-28"},

{id:"qa-qstp-internship", ct:"qa", sector:"tech", level:["uni","grad"], paid:"unknown", status:"dormant", gate:"residents",
 org:{en:"Qatar Science and Technology Park", ar:"واحة قطر للعلوم والتكنولوجيا"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"The window has closed. The page prints an application period of September 4 to September 18 with no year against it, and that period ended three days ago. Three cycles are printed, all without years: winter 29 January to 21 April, summer 14 June to 3 September, and autumn 1 October to 24 December. The winter cycle is the next one a student can plan for. Selected candidates are contacted on a rolling basis.", ar:"أُغلقت الفترة. تطبع الصفحة فترة تقديم من ٤ إلى ١٨ سبتمبر دون ذكر السنة، وقد انتهت قبل ثلاثة أيام. وتطبع ثلاث دورات، جميعها بلا سنة: الشتاء من ٢٩ يناير إلى ٢١ أبريل، والصيف من ١٤ يونيو إلى ٣ سبتمبر، والخريف من ١ أكتوبر إلى ٢٤ ديسمبر. ودورة الشتاء هي أقرب ما يمكن للطالب التخطيط له. ويجري التواصل مع المرشحين المختارين تباعًا."},
 duration:{en:"Twelve weeks, part time at 20 hours a week or full time at 40. The autumn placement runs from 1 October to 24 December.", ar:"اثنا عشر أسبوعًا، بدوام جزئي ٢٠ ساعة أسبوعيًا أو كامل ٤٠ ساعة. وتمتد دورة الخريف من ١ أكتوبر إلى ٢٤ ديسمبر."},
 elig:{en:"Current seniors or graduates within the past two years, enrolled at a local university in Qatar, with relevant skills or an interest in technology, innovation or entrepreneurship. The page prints no nationality rule and no residence rule.", ar:"طلبة السنة الأخيرة أو خريجو العامين الماضيين، المقيدون في جامعة محلية في قطر، ولديهم مهارات أو اهتمام بالتقنية أو الابتكار أو ريادة الأعمال. ولا تطبع الصفحة شرط جنسية ولا شرط إقامة."},
 how:{en:"An online form linked from the page, then matching between applicants and startups, then interviews with the startups. The page prints no enquiries address.", ar:"نموذج إلكتروني مرتبط من الصفحة، ثم مطابقة بين المتقدمين والشركات الناشئة، ثم مقابلات مع الشركات. ولا تطبع الصفحة عنوانًا للاستفسارات."},
 url:"https://qstp.qa/programs/internship/", checked:"2026-10-01"},

{id:"qa-qcdc-shadowing", ct:"qa", sector:"education", level:["hs"], paid:"no", status:"annual", gate:"residents",
 org:{en:"Qatar Career Development Center", ar:"مركز قطر للتطوير المهني"},
 prog:{en:"My Career My Future job shadowing program", ar:"برنامج مهنتي مستقبلي للمرافقة الوظيفية"},
 apply:{en:"Runs each year in August, with a winter edition around the new year. The August 2026 edition ran from 2 to 6 August and registration is closed.", ar:"يُقام سنويًا في أغسطس، مع نسخة شتوية قرب رأس السنة. جرت نسخة أغسطس ٢٠٢٦ من ٢ إلى ٦ أغسطس وأُغلق التسجيل."},
 duration:{en:"Five days: an orientation, three days shadowing a workplace and a closing day with a university fair.", ar:"خمسة أيام: يوم تعريفي، وثلاثة أيام في مرافقة جهة عمل، ويوم ختامي مع معرض للجامعات."},
 elig:{en:"Arabic speaking students in grades 10 to 12 at schools in Qatar. There is a registration fee of 350 riyals.", ar:"طلبة الصفوف من العاشر إلى الثاني عشر الناطقون بالعربية في مدارس قطر. رسوم التسجيل ٣٥٠ ريالًا."},
 how:{en:"Registration link on the event page when a new edition is announced. Enquiries to qcdc@qf.org.qa.", ar:"رابط التسجيل في صفحة الفعالية عند الإعلان عن نسخة جديدة. الاستفسارات على qcdc@qf.org.qa."},
 url:"https://qcdc.org.qa/events/my-career-my-future-2026/", checked:"2026-09-03"},

{id:"qa-pwc-summer", ct:"qa", sector:"consulting", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"PwC Middle East, Doha", ar:"بي دبليو سي الشرق الأوسط، الدوحة"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"Runs each year. The 2026 Doha postings went up in April and June 2026 and both now show as filled. Watch careers.pwc.com in spring.", ar:"يُقام سنويًا. نُشرت إعلانات الدوحة لعام ٢٠٢٦ في أبريل ويونيو ٢٠٢٦ وتظهر الآن مشغولة. راقب careers.pwc.com في الربيع."},
 duration:{en:"Summer. Length not printed.", ar:"الصيف. المدة غير مذكورة."},
 elig:{en:"University students. The Deals stream is for Qatari nationals only. The Tax and Legal stream prints no nationality rule.", ar:"طلبة الجامعات. مسار الصفقات للمواطنين القطريين فقط. ومسار الضرائب والقانون لا يذكر شرط جنسية."},
 how:{en:"Apply to the posting on careers.pwc.com when it reappears.", ar:"قدّم على الإعلان في careers.pwc.com عند نشره من جديد."},
 url:"https://careers.pwc.com/global/en/search-results?keywords=Doha", checked:"2026-09-03"},

{id:"qa-ey-graduate", ct:"qa", sector:"consulting", level:["grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"EY, Doha", ar:"إرنست ويونغ، الدوحة"},
 prog:{en:"Graduate Programs", ar:"برامج الخريجين"},
 apply:{en:"On 16 September 2026 every stream showed as opening soon, with no dates. The page notes that the requirements vary across countries in the region.", ar:"في ١٦ سبتمبر ٢٠٢٦ كانت كل المسارات تظهر بحالة «يُفتح قريبًا» دون مواعيد. وتشير الصفحة إلى أن المتطلبات تختلف بين دول المنطقة."},
 duration:{en:"Two years.", ar:"سنتان."},
 elig:{en:"Final year students and graduates of the last 18 months. The subject lists differ by stream. Advisory takes all degree backgrounds. Tax asks for accounting, taxation, finance, economics or law. Audit asks for accounting, finance, science, technology, engineering or mathematics. Strategy and Transactions asks for accounting, taxation, finance, economics, law or engineering. Financial Accounting Advisory Services asks for accounting or finance. Doha is a listed location.", ar:"طلبة السنة الأخيرة وخريجو آخر ١٨ شهرًا. وتختلف قوائم التخصصات بحسب المسار. يقبل المسار الاستشاري كل الخلفيات الدراسية. ويطلب مسار الضرائب المحاسبة أو الضرائب أو المالية أو الاقتصاد أو القانون. ويطلب مسار التدقيق المحاسبة أو المالية أو العلوم أو التقنية أو الهندسة أو الرياضيات. ويطلب مسار الاستراتيجية والصفقات المحاسبة أو الضرائب أو المالية أو الاقتصاد أو القانون أو الهندسة. ويطلب مسار خدمات المحاسبة المالية الاستشارية المحاسبة أو المالية. والدوحة من المواقع المدرجة."},
 how:{en:"Student application link on the EY MENA careers page when a stream opens.", ar:"رابط تقديم الطلبة في صفحة التوظيف في إرنست ويونغ الشرق الأوسط عند فتح المسار."},
 url:"https://www.ey.com/en_sa/careers/students-apply-here", checked:"2026-10-01"},

{id:"kw-dasman-summer", ct:"kw", sector:"health", level:["uni","grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"Dasman Diabetes Institute", ar:"معهد دسمان للسكري"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"Runs each year. The 2026 round took applications from 23 April to 14 May 2026 and ran from 28 June to 16 August. Expect the next call in April 2027.", ar:"يُقام سنويًا. استقبلت دورة ٢٠٢٦ الطلبات من ٢٣ أبريل إلى ١٤ مايو ٢٠٢٦ وجرت من ٢٨ يونيو إلى ١٦ أغسطس. ويُتوقع الإعلان القادم في أبريل ٢٠٢٧."},
 duration:{en:"Seven weeks, Sunday to Thursday, 7:30 to 15:00.", ar:"سبعة أسابيع، من الأحد إلى الخميس، من ٧:٣٠ إلى ١٥:٠٠."},
 elig:{en:"Residents of Kuwait with a valid Civil ID, students or graduates of the last six months in biomedical, medical or related fields. Places go first come first served across 15 research and clinical tracks.", ar:"المقيمون في الكويت من حاملي البطاقة المدنية، من الطلبة أو خريجي الأشهر الستة الماضية في المجالات الطبية والطبية الحيوية وما يتصل بها. وتُمنح المقاعد بأسبقية التقديم في ١٥ مسارًا بحثيًا وسريريًا."},
 how:{en:"Online form on the program page with a CV, transcript and Civil ID. Enquiries to summerinternship@dasmaninstitute.org.", ar:"نموذج إلكتروني في صفحة البرنامج مع سيرة ذاتية وكشف درجات والبطاقة المدنية. الاستفسارات على summerinternship@dasmaninstitute.org."},
 url:"https://www.dasmaninstitute.org/internship-training/internship-program/", checked:"2026-09-03"},

{id:"kw-kisr-summer", ct:"kw", sector:"education", level:["hs"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Kuwait Institute for Scientific Research", ar:"معهد الكويت للأبحاث العلمية"},
 prog:{en:"Summer Student Training Program", ar:"برنامج التدريب الصيفي للطلبة"},
 apply:{en:"The page names a 45th summer course of five weeks and prints no dates and no registration window.", ar:"تذكر الصفحة دورة صيفية خامسة وأربعين مدتها خمسة أسابيع ولا تذكر تواريخ ولا فترة تسجيل."},
 duration:{en:"Five weeks.", ar:"خمسة أسابيع."},
 elig:{en:"The page says the summer course is for students from high school, technical colleges and universities, and prints no nationality rule and no grade average. A two week spring course runs for grade 8 and 9 students on water resources, the environment, recycling and energy conservation.", ar:"تذكر الصفحة أن الدورة الصيفية لطلبة الثانوية والكليات التقنية والجامعات، ولا تذكر شرط جنسية ولا معدلًا. وتُقام دورة ربيعية من أسبوعين لطلبة الصفين الثامن والتاسع في موارد المياه والبيئة وإعادة التدوير وترشيد الطاقة."},
 how:{en:"The page carries a contact line but no application form and no address. Write through the institute contact page when a course is announced.", ar:"تحمل الصفحة سطر تواصل دون نموذج تقديم ودون عنوان. راسل عبر صفحة التواصل في المعهد عند الإعلان عن دورة."},
 url:"https://www.kisr.edu.kw/en/careers-training/student-programs/", checked:"2026-09-13"},

{id:"kw-equate-internship", ct:"kw", sector:"energy", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"EQUATE Petrochemical Company", ar:"شركة إيكويت للبتروكيماويات"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"Runs each year. The page prints no dates, and the student portal returned a server error again on 16 September 2026.", ar:"يُقام سنويًا. لا تذكر الصفحة مواعيد، وأعادت بوابة الطلبة خطأ خادم مرة أخرى في ١٦ سبتمبر ٢٠٢٦."},
 duration:{en:"Not stated.", ar:"غير مذكورة."},
 elig:{en:"Students close to graduation in engineering, finance, chemistry and similar fields. A preparatory document must be read before applying. No nationality rule is printed.", ar:"الطلبة المقبلون على التخرج في الهندسة والمالية والكيمياء وما شابه. ويجب قراءة مستند تمهيدي قبل التقديم. ولا يُذكر شرط جنسية."},
 how:{en:"Student internship portal linked from the internship page.", ar:"بوابة تدريب الطلبة المرتبطة بصفحة التدريب."},
 url:"https://www.equate.com/internship/", checked:"2026-10-01"},

{id:"kw-kipic-internship", ct:"kw", sector:"energy", level:["uni"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"Kuwait Integrated Petroleum Industries Company, KIPIC", ar:"الشركة الكويتية للصناعات البترولية المتكاملة"},
 prog:{en:"Student internship", ar:"تدريب الطلبة"},
 apply:{en:"On 1 October 2026 the page lists no vacancy and states that the company only accepts applications once an official recruitment campaign has been activated and announced in local newspapers, on the recruitment homepage and on its official social media accounts. It invites a letter from your college and publishes no window, so there is nothing to apply to today.", ar:"في ١ أكتوبر ٢٠٢٦ لا تدرج الصفحة أي شاغر وتذكر أن الشركة لا تقبل الطلبات إلا بعد تفعيل حملة توظيف رسمية والإعلان عنها في الصحف المحلية وفي صفحة التوظيف وفي حساباتها الرسمية. وتدعو إلى رسالة من كليتك ولا تنشر موعدًا، فلا يوجد ما يُقدَّم عليه اليوم."},
 duration:{en:"As stated in the college letter.", ar:"بحسب ما تحدده رسالة الكلية."},
 elig:{en:"The page prints that recruitment campaigns are restricted to nationals and that applicants who do not meet the criteria will not be able to apply. The only student route it names is temporary on the job training. No GPA, age or civil ID rule is printed.", ar:"تطبع الصفحة أن حملات التوظيف مقصورة على المواطنين وأن من لا تنطبق عليه الشروط لن يستطيع التقديم. والمسار الطلابي الوحيد الذي تذكره هو التدريب المؤقت أثناء العمل. ولا تطبع شرط معدل ولا عمر ولا بطاقة مدنية."},
 how:{en:"Your college sends an official letter addressed to the Manager of Planning and Career Development, with the objectives of the training and the duration of the internship. The page prints no email address and no submission route for the letter.", ar:"ترسل كليتك خطابًا رسميًا موجهًا إلى مدير التخطيط والتطوير الوظيفي، يتضمن أهداف التدريب ومدته. ولا تطبع الصفحة عنوان بريد ولا وسيلة لإرسال الخطاب."},
 url:"https://kipic.com.kw/careers/", checked:"2026-10-01"},

{id:"kw-kpc-graduate", ct:"kw", sector:"energy", level:["grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Kuwait Petroleum Corporation", ar:"مؤسسة البترول الكويتية"},
 prog:{en:"Fresh Graduate Program", ar:"برنامج الخريجين الجدد"},
 apply:{en:"The page carries a standing apply link to recruitment.kpc.com.kw and publishes no campaign dates.", ar:"تحمل الصفحة رابط تقديم دائمًا إلى recruitment.kpc.com.kw ولا تنشر مواعيد حملات."},
 duration:{en:"Two years of in house training, external courses and mentoring.", ar:"سنتان من التدريب الداخلي والدورات الخارجية والإرشاد."},
 elig:{en:"The page prints no nationality rule. It says the corporation hires fresh graduates of non engineering and non science majors, and sends engineering and science majors to KOC and KNPC.", ar:"لا تذكر الصفحة شرط جنسية. وتقول إن المؤسسة توظف الخريجين الجدد في التخصصات غير الهندسية وغير العلمية، وتحيل التخصصات الهندسية والعلمية إلى شركة نفط الكويت وشركة البترول الوطنية."},
 how:{en:"Use the apply link on the page through to recruitment.kpc.com.kw. The page prints no enquiry address.", ar:"استخدم رابط التقديم في الصفحة إلى recruitment.kpc.com.kw. ولا تذكر الصفحة عنوان استفسار."},
 url:"https://www.kpc.com.kw/KPCCareers", checked:"2026-09-13"},

{id:"kw-nbk-academy", ct:"kw", sector:"finance", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"National Bank of Kuwait", ar:"بنك الكويت الوطني"},
 prog:{en:"NBK Academy", ar:"أكاديمية الوطني"},
 apply:{en:"Runs each year. No 2026 window is printed. The program page prints no dates. It says the academy has trained more than 260 graduates across 28 waves since 2009, and it still describes the Tech Academy as having run one wave with a second planned for late 2024, which marks the page as out of date.", ar:"يُقام سنويًا. لا يُذكر موعد لعام ٢٠٢٦. ولا تذكر صفحة البرنامج مواعيد. وتقول إن الأكاديمية درّبت أكثر من ٢٦٠ خريجًا في ٢٨ دفعة منذ ٢٠٠٩، وما تزال تصف أكاديمية التكنولوجيا بأنها أقامت دفعة واحدة وتخطط لثانية أواخر ٢٠٢٤، وهذا يدل على أن الصفحة قديمة."},
 duration:{en:"Five to seven months.", ar:"من خمسة إلى سبعة أشهر."},
 elig:{en:"Kuwaiti fresh graduates. The older page asks for a GPA of 3.0, age 25 or under and up to two years of experience; treat those as possibly out of date. A sister NBK Tech Academy takes computing and data graduates.", ar:"الخريجون الكويتيون الجدد. تطلب الصفحة القديمة معدل ٣٫٠ وسن ٢٥ فما دون وخبرة حتى سنتين، وقد تكون هذه الشروط قديمة. وتستقبل أكاديمية الوطني للتكنولوجيا خريجي الحاسوب والبيانات."},
 how:{en:"NBK recruitment portal at careers.nbk.com.", ar:"بوابة التوظيف في البنك careers.nbk.com."},
 url:"https://www.nbk.com/careers.html", checked:"2026-09-13"},

{id:"kw-nbk-aspire", ct:"kw", sector:"finance", level:["hs","uni"], paid:"unknown", status:"annual", gate:"unstated",

 prog:{en:"NBK Aspire Summer Internship", ar:"برنامج التدريب الصيفي أسباير"},
 apply:{en:"Runs each summer. The bank's own page describes the 2024 edition, four two week sessions from 30 June to 22 August 2024, and prints no application route.", ar:"يُقام كل صيف. تصف صفحة البنك نسخة ٢٠٢٤، أربع جلسات من أسبوعين من ٣٠ يونيو إلى ٢٢ أغسطس ٢٠٢٤، ولا تذكر آلية تقديم."},
 duration:{en:"Two week sessions across the summer.", ar:"جلسات من أسبوعين على مدار الصيف."},
 elig:{en:"Students aged 14 to 18 at school, college or university. No nationality rule is printed.", ar:"الطلبة بين ١٤ و١٨ عامًا في المدارس أو الكليات أو الجامعات. ولا يُذكر شرط جنسية."},
 how:{en:"No route is printed. Watch NBK's channels in spring.", ar:"لا تُذكر آلية. راقب قنوات البنك في الربيع."},
 url:"https://www.nbk.com/kuwait/news-and-insights/media-relations/news.html?news=-nbk-aspire--summer-internship-program-kicks-off-", checked:"2026-09-03"},

{id:"kw-kfh-forssah", ct:"kw", sector:"finance", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Kuwait Finance House", ar:"بيت التمويل الكويتي"},
 prog:{en:"Forssah trainee program", ar:"برنامج فرصة"},
 apply:{en:"The trainee posting is live on the careers site. No closing date and no application window are published.", ar:"إعلان المتدربين متاح في موقع التوظيف. ولا يُنشر موعد إغلاق ولا فترة تقديم."},
 duration:{en:"Two years, comprising a six month training course, varied educational techniques and delegation trips to the bank's subsidiaries.", ar:"سنتان، تشمل دورة تدريبية مدتها ستة أشهر، وأساليب تعليمية متنوعة، وزيارات إلى الشركات التابعة للبنك."},
 elig:{en:"Kuwaiti graduates with a GPA of 3.25 or higher in business administration or information technology, from local and international universities. The page prints no age limit and no rule on work experience. Selection runs through a nomination, an HR interview, an English and technical test, then a second interview with the department.", ar:"الخريجون الكويتيون بمعدل ٣٫٢٥ فأعلى في إدارة الأعمال أو تقنية المعلومات، من جامعات محلية ودولية. ولا تذكر الصفحة حدًا للعمر ولا شرطًا بشأن الخبرة. ويمر الاختيار بترشيح ومقابلة مع الموارد البشرية واختبار إنجليزية واختبار فني، ثم مقابلة ثانية مع الإدارة المعنية."},
 how:{en:"Apply Now on the Forssah page.", ar:"زر التقديم في صفحة فرصة."},
 url:"https://www.kfh.com/en/home/Personal/Tools-services/Career/Forssah.html", checked:"2026-09-28"},

 url:"https://www.e-gulfbank.com/en/about-us/careers/", checked:"2026-09-03"},

 how:{en:"No route is printed. Contact InvestGB or Gulf Bank in spring.", ar:"لا تُذكر آلية. تواصل مع إنفست جي بي أو بنك الخليج في الربيع."},
 url:"https://www.e-gulfbank.com/en/about-us/media/press-releases/2025/04/investgb-launches-the-third-edition-of-its-internship-program-for-2025-to-attract-young-kuwaiti-talents-and-professionals/", checked:"2026-09-03"},

{id:"kw-boubyan-graduates", ct:"kw", sector:"finance", level:["grad"], paid:"unknown", status:"open", gate:"unstated",

 elig:{en:"Not stated. The form asks for your major, preferred department and nationality.", ar:"غير مذكورة. يطلب النموذج التخصص والإدارة المفضلة والجنسية."},
 how:{en:"An Apply Now link on the careers page opens the bank's general application form, which asks for the type of applicant as fresh or experienced, the degree major, a preferred area and nationality. It is not a form reserved for graduates.", ar:"يفتح زر التقديم في صفحة التوظيف نموذج الطلب العام للبنك، ويسأل عن نوع المتقدم خريج جديد أو ذي خبرة، والتخصص، والمجال المفضل، والجنسية. وهو ليس نموذجًا مخصصًا للخريجين."},
 url:"https://bankboubyan.com/en/careers/", checked:"2026-09-28"},

{id:"kw-kgdp", ct:"kw", sector:"finance", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Kafa'a, Institute of Banking Studies", ar:"كفاءة، معهد الدراسات المصرفية"},
 prog:{en:"Kuwaiti Graduates Development Program, KGDP", ar:"برنامج تأهيل الكويتيين حديثي التخرج للعمل في القطاع المصرفي"},
 apply:{en:"On 16 September 2026 the page still printed one application window only, 5 to 23 October 2025, and named no new round. It prints no round number and no cadence. October is the month to watch on the strength of that single window.", ar:"في ١٦ سبتمبر ٢٠٢٦ كانت الصفحة ما تزال تعرض فترة تقديم واحدة فقط من ٥ إلى ٢٣ أكتوبر ٢٠٢٥ ولا تذكر دفعة جديدة. ولا تذكر رقم دفعة ولا تكرارًا. وأكتوبر هو الشهر الذي يجب ترقبه استنادًا إلى تلك الفترة الوحيدة."},
 duration:{en:"About five months of classroom and field training at Kuwaiti banks.", ar:"نحو خمسة أشهر من التدريب النظري والميداني في البنوك الكويتية."},
 elig:{en:"Kuwaiti nationals who graduated in the last two years in banking, economics, accounting, finance or similar, with a GPA of 3.0 or higher. Applicants must not be employed by any other entity at the time of applying. The page states that submitting an application does not guarantee acceptance.", ar:"المواطنون الكويتيون ممن تخرجوا خلال السنتين الماضيتين في المصارف أو الاقتصاد أو المحاسبة أو المالية وما شابه، بمعدل ٣٫٠ فأعلى. ويجب ألا يكون المتقدم على رأس عمل لدى أي جهة أخرى وقت التقديم. وتذكر الصفحة أن تقديم الطلب لا يضمن القبول."},
 how:{en:"The page carries a brochure download and no registration form, and prints no application link. Enquiries to cs@kibs.edu.kw or 00965 2290 1100.", ar:"تحمل الصفحة ملفًا تعريفيًا للتحميل لا نموذج تسجيل، ولا تذكر رابط تقديم. الاستفسارات على cs@kibs.edu.kw أو ٠٠٩٦٥٢٢٩٠١١٠٠."},
 url:"https://kafaakw.org/kuwaiti-graduates-development-program-kgdp/?lang=en", checked:"2026-10-01"},

{id:"kw-kia-graduate", ct:"kw", sector:"finance", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Kuwait Investment Authority", ar:"الهيئة العامة للاستثمار"},
 prog:{en:"Fresh Graduate Training Program", ar:"برنامج تدريب الخريجين الجدد"},
 apply:{en:"Runs in rounds. No window is printed and the page showed no announcement on 16 September 2026.", ar:"يُقام على دفعات. لا يُذكر موعد، ولم تعرض الصفحة إعلانًا في ١٦ سبتمبر ٢٠٢٦."},
 duration:{en:"Eleven months of classroom and workplace training.", ar:"أحد عشر شهرًا من التدريب النظري وفي مكان العمل."},
 elig:{en:"Kuwaiti nationals aged 26 or under with a bachelor degree from the last three years in business or engineering, a GPA of 3.0 or higher, a GMAT of 360 or higher or a GMAT Focus of 395 or higher taken in person and no more than five years old, and good Arabic and English.", ar:"المواطنون الكويتيون في سن ٢٦ فما دون، بدرجة بكالوريوس خلال السنوات الثلاث الماضية في الأعمال أو الهندسة، ومعدل ٣٫٠ فأعلى، وجيمات ٣٦٠ فأعلى أو جيمات فوكس ٣٩٥ فأعلى مؤدًى حضوريًا ولا يتجاوز عمره خمس سنوات، وإجادة للعربية والإنجليزية."},
 how:{en:"Apply through portal.kia.gov.kw when a round is announced.", ar:"قدّم عبر portal.kia.gov.kw عند الإعلان عن دفعة."},
 url:"https://www.kia.gov.kw/training-programs/", checked:"2026-10-01"},

{id:"kw-jazeera-gdp", ct:"kw", sector:"aviation", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Jazeera Airways", ar:"طيران الجزيرة"},
 prog:{en:"Graduate Development Program", ar:"برنامج تطوير الخريجين"},
 apply:{en:"Open now. The online form accepts applications with no closing date.", ar:"مفتوح الآن. يستقبل النموذج الإلكتروني الطلبات دون موعد إغلاق."},
 duration:{en:"Not stated.", ar:"غير مذكورة."},
 elig:{en:"The printed eligibility criteria are being 21 years of age or older, holding a high school diploma as a minimum, providing a valid medical clearance certificate, submitting a police clearance certificate, and strong communication skills in English and Arabic. Kuwaiti nationality appears in the invitation sentence on the page rather than in the criteria list. The training areas listed include aircraft maintenance engineering, flight operations, ground operations, terminal operations, network planning, finance and accounting, marketing and customer experience, sales, revenue optimisation, human resources, information technology, facilities management and the call center.", ar:"شروط الأهلية المطبوعة هي بلوغ ٢١ عامًا فأكثر، والحصول على شهادة الثانوية كحد أدنى، وتقديم شهادة لياقة طبية سارية، وتقديم شهادة حسن سيرة من الشرطة، ومهارات تواصل قوية بالإنجليزية والعربية. أما الجنسية الكويتية فترد في جملة الدعوة على الصفحة لا ضمن قائمة الشروط. ومجالات التدريب المذكورة تشمل هندسة صيانة الطائرات، وعمليات الطيران، والعمليات الأرضية، وعمليات المبنى، وتخطيط الشبكة، والمالية والمحاسبة، والتسويق وتجربة العملاء، والمبيعات، وتحسين الإيرادات، والموارد البشرية، وتقنية المعلومات، وإدارة المرافق، ومركز الاتصال."},
 how:{en:"An Enroll Now control on the program page opens an external form. The page prints no CV requirement.", ar:"زر التسجيل في صفحة البرنامج يفتح نموذجًا خارجيًا. ولا تطبع الصفحة اشتراط سيرة ذاتية."},
 url:"https://www.jazeeraairways.com/en-kw/graduate-development-program", checked:"2026-09-28"},

{id:"kw-alghanim-internships", ct:"kw", sector:"industry", level:["uni"], paid:"yes", status:"annual", gate:"unstated",
 org:{en:"Alghanim Industries", ar:"صناعات الغانم"},
 prog:{en:"Internships", ar:"التدريب"},
 apply:{en:"Runs each year. First and second year applications open in April for a summer placement. Later year placements are posted as needed. No positions were open on 16 September 2026.", ar:"يُقام سنويًا. يُفتح تقديم طلبة السنتين الأولى والثانية في أبريل لتدريب صيفي. وتُنشر فرص السنوات المتقدمة بحسب الحاجة. ولم تكن هناك فرص مفتوحة في ١٦ سبتمبر ٢٠٢٦."},
 duration:{en:"Four weeks rotating across the group's businesses for first and second years. Flexible for third and fourth years.", ar:"أربعة أسابيع بالتناوب بين شركات المجموعة لطلبة السنتين الأولى والثانية. ومرنة لطلبة السنتين الثالثة والرابعة."},
 elig:{en:"University students with strong English. A stipend and a certificate are given on completion. No nationality rule is printed.", ar:"طلبة الجامعات ممن يجيدون الإنجليزية. تُمنح مكافأة وشهادة عند الإتمام. ولا يُذكر شرط جنسية."},
 how:{en:"Apply to an internship vacancy on careers.alghanim.com, or set a job alert when none is posted.", ar:"قدّم على فرصة تدريب في careers.alghanim.com، أو فعّل تنبيه الوظائف عند عدم وجود فرص."},
 url:"https://careers.alghanim.com/go/Internships/3622401/", checked:"2026-10-01"},

{id:"kw-alghanim-academy", ct:"kw", sector:"industry", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Alghanim Industries", ar:"صناعات الغانم"},
 prog:{en:"Academy Program", ar:"برنامج الأكاديمية"},
 apply:{en:"Runs in cohorts. No posting was open on 16 September 2026 and the careers page listed zero academy jobs. You can set an alert there for when one is posted.", ar:"يُقام على دفعات. لم يكن هناك إعلان مفتوح في ١٦ سبتمبر ٢٠٢٦ ولم تدرج صفحة التوظيف أي فرص للأكاديمية. ويمكنك ضبط تنبيه هناك عند نشر إعلان."},
 duration:{en:"Six months, then promotion on completion.", ar:"ستة أشهر، ثم ترقية عند الإتمام."},
 elig:{en:"The page describes a full time job opportunity tailored for Kuwaiti nationals. It names no fields or specializations.", ar:"تصف الصفحة فرصة عمل بدوام كامل مخصصة للمواطنين الكويتيين. ولا تسمي مجالات ولا تخصصات."},
 how:{en:"Apply to the Academy Program posting on careers.alghanim.com when it appears.", ar:"قدّم على إعلان برنامج الأكاديمية في careers.alghanim.com عند ظهوره."},
 url:"https://careers.alghanim.com/go/Academy-Program/9328001/", checked:"2026-10-01"},

{id:"kw-alshaya-summer", ct:"kw", sector:"hospitality", level:["hs","uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Alshaya Group", ar:"مجموعة الشايع"},
 prog:{en:"Summer Internship with the Public Authority for Manpower", ar:"التدريب الصيفي مع الهيئة العامة للقوى العاملة"},
 apply:{en:"Runs each summer through the Public Authority for Manpower's summer training project. The 2025 edition ran from 29 June to 24 July 2025 with 160 students.", ar:"يُقام كل صيف عبر مشروع التدريب الصيفي في الهيئة العامة للقوى العاملة. جرت نسخة ٢٠٢٥ من ٢٩ يونيو إلى ٢٤ يوليو ٢٠٢٥ بمشاركة ١٦٠ طالبًا."},
 duration:{en:"One month.", ar:"شهر واحد."},
 elig:{en:"Kuwaiti students, placed in the group's stores and restaurants to learn sales, customer service and stock management.", ar:"الطلبة الكويتيون، يوزَّعون على متاجر المجموعة ومطاعمها لتعلم البيع وخدمة العملاء وإدارة المخزون."},
 how:{en:"Placement is through the Public Authority for Manpower's summer training registration, not through Alshaya. Alshaya's careers address is careers@alshaya.com.", ar:"التوزيع عبر تسجيل التدريب الصيفي في الهيئة العامة للقوى العاملة لا عبر الشايع. وبريد التوظيف في الشايع careers@alshaya.com."},
 url:"https://www.alshaya.com/en/english/media-centre/alshaya-news/alshaya-group-and-public-authority-of-manpower-pam-celebrate-successful-completion-of-summer-internship-for-160-kuwaiti-students/", checked:"2026-09-03"},

{id:"kw-ooredoo-graduates", ct:"kw", sector:"tech", level:["grad"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Ooredoo Kuwait", ar:"أوريدو الكويت"},
 prog:{en:"Graduate opportunities CV pool", ar:"فرص الخريجين"},
 apply:{en:"On 1 October 2026 the graduate opportunities entry is no longer on the portal. The ten live postings are all experienced hire roles and the latest closing date printed anywhere on the portal is 1 January 2027, so the standing CV upload the card previously named cannot be found.", ar:"في ١ أكتوبر ٢٠٢٦ لم يبق مدخل فرص الخريجين في البوابة. والشواغر العشرة المعروضة كلها وظائف لذوي الخبرة، وآخر تاريخ إغلاق مطبوع في البوابة هو ١ يناير ٢٠٢٧، فلا يمكن العثور على رفع السيرة الذاتية الدائم الذي كانت البطاقة تذكره."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"The portal prints no eligibility rule against the graduate entry, and prints no nationality rule and no residence rule.", ar:"لا تطبع البوابة أي شرط أهلية أمام مدخل الخريجين، ولا تطبع شرط جنسية ولا شرط إقامة."},
 how:{en:"No graduate route is on the portal today. Watch the Kuwait portal for a graduate or CV posting to return.", ar:"لا يوجد مسار للخريجين في البوابة اليوم. تابع بوابة الكويت حتى يعود إعلان للخريجين أو لرفع السيرة الذاتية."},
 url:"https://ooredoo.sniperhire.net/kuwait", checked:"2026-10-01"},

{id:"kw-stc-summer", ct:"kw", sector:"tech", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"stc Kuwait", ar:"stc الكويت"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},

{id:"callback", strength:"causal",

       ar:"هؤلاء أصحاب عمل يديرون أصلًا برامج منظمة، فالنسبة تصف الشركات الكبيرة ذات البرامج الرسمية. ولا تقول شيئًا عن التدريب غير الرسمي الذي يُرتَّب عبر معرفة عائلية، وهو الطريق الذي يُحصَل به على حصة كبيرة من فرص التدريب في الخليج."}},

{id:"clarity", strength:"survey",
 claim:{en:"71 per cent of students who had done an internship said it helped clarify their career goals a great deal or quite a bit. 9 per cent said it helped a little or not at all.",
        ar:"٧١ بالمئة من الطلبة الذين أنهوا تدريبًا قالوا إنه ساعدهم كثيرًا أو إلى حد كبير في توضيح أهدافهم المهنية. وقال ٩ بالمئة إنه ساعدهم قليلًا أو لم يساعدهم إطلاقًا."},
 source:{en:"National Survey of College Internships 2023, University of Wisconsin Madison with Strada Education Foundation.",
         ar:"المسح الوطني للتدريب الجامعي ٢٠٢٣، جامعة ويسكونسن ماديسون بالتعاون مع مؤسسة سترادا."},
 url:"https://cdn.prod.website-files.com/6777c52f82e5471a3732ea25/679a75cb40cfdba551afc484_Building-Better-Internships-NSCI-Descriptive-Report-June-2024.pdf",
 note:{en:"This is students reporting that they felt clearer, not a measured change of course. The survey never asked whether a placement made a student rule a field out, so the value of an internship as negative information, often the most useful thing it gives you, is unmeasured everywhere we looked.",
       ar:"هذا شعور الطلبة بالوضوح لا تغيير مسار مقيس. ولم يسأل المسح إطلاقًا عمّا إذا كان التدريب قد دفع الطالب إلى استبعاد مجال، ولذلك فإن قيمة التدريب كمعلومة سلبية، وهي غالبًا أنفع ما يمنحك، غير مقيسة في أي مصدر بحثنا فيه."}},

{id:"gulf", strength:"gap",
 claim:{en:"No Gulf statistical office publishes internship outcome data at all. We looked for conversion rates, for a comparison of paid against unpaid work, and for any figure on salary returns, and found none of them.",
        ar:"لا يوجد جهاز إحصائي خليجي واحد ينشر بيانات عن نتائج التدريب. بحثنا عن نسب التحويل، وعن مقارنة بين التدريب المدفوع وغير المدفوع، وعن أي رقم لعائد الراتب، فلم نجد شيئًا من ذلك."},
 source:{en:"Checked against GASTAT in Saudi Arabia, the Gulf Labor Markets and Migration database and ILO Arab States outputs, August 2026.",
         ar:"جرى التحقق لدى الهيئة العامة للإحصاء في السعودية، وقاعدة بيانات أسواق العمل والهجرة في الخليج، ومخرجات منظمة العمل الدولية للدول العربية، أغسطس ٢٠٢٦."},
 url:"https://gulfmigration.grc.net/gcc-population-employed-in-the-private-sector-and-percentage-of-non-nationals-in-the-sector-in-gcc-countries-2015-2024/",
 note:{en:"Every number on this page comes from Germany, Britain or the United States. Treat them as the best available evidence from elsewhere, not as Gulf facts. Programs here publish participant headcounts, which is not the same thing. If anyone quotes you a Gulf internship conversion statistic, ask them for the dataset.",
       ar:"كل رقم في هذه الصفحة يأتي من ألمانيا أو بريطانيا أو الولايات المتحدة. فتعامل معها كأفضل دليل متاح من أماكن أخرى، لا كحقائق خليجية. أما البرامج هنا فتنشر أعداد المشاركين، وهذا شيء آخر. وإن استشهد أحد أمامك برقم خليجي عن نسبة تحويل المتدربين، فاطلب منه البيانات."}}
];

/* What a placement in each sector is actually good for. */
const SECTOR_READ = {
finance:{
 good:{en:"Good for learning how a regulated institution documents a decision, and for putting a name on your CV that every other employer in the region recognizes. It is also the fastest way to find out whether you can sit with numbers for eight hours without losing accuracy.",
       ar:"مفيد لتتعلم كيف توثّق مؤسسة خاضعة للرقابة قراراتها، ولتضع في سيرتك اسمًا يعرفه كل صاحب عمل آخر في المنطقة. وهو أسرع طريقة لتعرف هل تستطيع الجلوس مع الأرقام ثماني ساعات دون أن تفقد الدقة."},
 expect:{en:"Expect Excel, reconciliations, know your customer and compliance checks, credit files, and sitting silently in meetings. You will rarely see a client and almost never see a decision made, only the paperwork that follows it.",
         ar:"توقّع الإكسل، وتسويات الحسابات، وإجراءات اعرف عميلك والالتزام، وملفات الائتمان، والجلوس صامتًا في الاجتماعات. نادرًا ما ستقابل عميلًا، وشبه مستحيل أن تحضر لحظة اتخاذ القرار، بل ستشاهد الأوراق التي تليه."},
 leads:{en:"It leads to graduate schemes at the large national banks, and later to corporate treasury, a sovereign fund or a family office. Ask early which track you are on, because the branch and retail route and the head office route are separate careers that rarely cross.",
        ar:"يقود إلى برامج الخريجين في المصارف الوطنية الكبرى، ولاحقًا إلى الخزينة في الشركات أو صندوق سيادي أو مكتب عائلي. اسأل مبكرًا عن المسار الذي وُضعت فيه، فمسار الفروع والتجزئة ومسار الإدارة العامة مساران منفصلان نادرًا ما يلتقيان."}},
energy:{
 good:{en:"Good for seeing industrial scale and a real safety culture, and the technical standards you meet are the same ones used across the region and beyond. It is the sector where the Gulf still trains people to a standard that transfers internationally.",
       ar:"مفيد لترى الحجم الصناعي وثقافة سلامة حقيقية، والمعايير الفنية التي ستتعامل معها هي نفسها المستخدمة في المنطقة وخارجها. وهو القطاع الذي ما زال الخليج يدرّب فيه الناس على مستوى معترف به دوليًا."},
 expect:{en:"Expect a long safety induction, a rotation across an office and a site, shadowing engineers, logging data and health and safety paperwork. Access to live plant is usually restricted for students, so much of the value comes from the people you sit with rather than the tasks you are given.",
         ar:"توقّع تعريفًا مطولًا بالسلامة، وتنقلًا بين المكتب والموقع، ومرافقة المهندسين، وتسجيل البيانات، وأوراق الصحة والسلامة. والدخول إلى الوحدات العاملة مقيّد للطلبة عادةً، فالقيمة الأكبر تأتي ممن تجلس معهم أكثر مما تأتي من المهام."},
 leads:{en:"It leads to the graduate and cooperative training programs of the national oil companies, which remain the main structured entry route for nationals, and to downstream petrochemicals. Service contractors and engineering consultancies hire faster but pay and stability differ sharply.",
        ar:"يقود إلى برامج الخريجين والتدريب التعاوني في شركات النفط الوطنية، وهي البوابة المنظمة الأساسية أمام المواطنين، وإلى البتروكيماويات. أما شركات الخدمات ومكاتب الاستشارات الهندسية فتوظّف أسرع، لكن الأجر والاستقرار يختلفان اختلافًا واضحًا."}},
industry:{
 good:{en:"Good for understanding how physical goods, cost and time actually behave, knowledge that stays useful even if you leave the sector. It is one of the few placements where you can see the whole chain from ship to gate in a single week.",
       ar:"مفيد لتفهم كيف تتصرف البضائع والتكلفة والوقت في الواقع، وهي معرفة تبقى نافعة حتى لو تركت القطاع. وهو من فرص التدريب القليلة التي تتيح رؤية السلسلة كاملة من السفينة إلى البوابة خلال أسبوع."},
 expect:{en:"Expect time in a yard or warehouse, shift patterns, terminal operating systems, customs and shipping documentation, and heat. The work is physical and administrative at once, and much of the workforce around you will not be speaking Arabic or English as a first language.",
         ar:"توقّع وقتًا في الساحات والمستودعات، ونظام ورديات، وأنظمة تشغيل المحطات، ومستندات الجمارك والشحن، وحرارة عالية. العمل بدني وإداري معًا، ومعظم من حولك لا يتحدثون العربية أو الإنجليزية كلغة أولى."},
 leads:{en:"It leads to operations and planning roles at port and logistics groups, and to manufacturing operations in the industrial cities. Progression is usually through operations supervision rather than a graduate scheme, so entry is easier and the early ceiling is lower.",
        ar:"يقود إلى وظائف التشغيل والتخطيط في مجموعات الموانئ واللوجستيات، وإلى تشغيل المصانع في المدن الصناعية. والترقي يجري غالبًا عبر الإشراف التشغيلي لا عبر برنامج خريجين، فالدخول أسهل والسقف المبكر أدنى."}},
tech:{
 good:{en:"Good because the output is verifiable in a way almost no other placement is. If you write code, ship an internal tool or clean a dataset, you leave with something you can show, and that matters more than the reference letter.",
       ar:"مفيد لأن ناتج العمل قابل للتحقق بصورة لا تتوفر في أي تدريب آخر تقريبًا. فإن كتبت شيفرة أو أنجزت أداة داخلية أو نظّفت بيانات، خرجت بشيء تستطيع عرضه، وهذا أهم من خطاب التوصية."},
 expect:{en:"Expect one narrow ticket, a great deal of reading someone else's code, code review that will feel harsh, and often no access to production. Many Gulf employers will place you in an internal IT team rather than a product team, and the two are not the same thing.",
         ar:"توقّع مهمة واحدة ضيقة، وقراءة كثيرة لشيفرة كتبها غيرك، ومراجعة ستبدو قاسية، وغالبًا بلا صلاحية على بيئة الإنتاج. وكثير من جهات العمل ستضعك في فريق تقنية المعلومات الداخلي لا في فريق منتج، والاثنان ليسا شيئًا واحدًا."},
 leads:{en:"It leads to regional technology firms and the technology arms of banks and telecom operators, to government digital agencies, and to cloud and systems integration partners. Be realistic: the Gulf market for junior software engineers is small relative to the number of computing graduates, and most of those jobs sit inside companies whose main business is not technology.",
        ar:"يقود إلى شركات التقنية الإقليمية وأذرع التقنية في المصارف وشركات الاتصالات، وإلى الجهات الحكومية الرقمية، وإلى شركاء الحوسبة السحابية وتكامل الأنظمة. وكن واقعيًا: سوق مهندسي البرمجيات المبتدئين في الخليج صغير مقارنةً بعدد خريجي الحاسب، ومعظم الوظائف داخل شركات نشاطها الأساسي ليس التقنية."}},
consulting:{
 good:{en:"Good for learning to structure a problem, defend a number and produce a document to a deadline, which is a portable skill. It also gives you an unusually early view of how Gulf government clients buy advice.",
       ar:"مفيد لتتعلم كيف تبني هيكل مشكلة، وتدافع عن رقم، وتُخرج وثيقة في موعدها، وهي مهارة تنتقل معك. ويمنحك رؤية مبكرة غير معتادة لكيفية شراء الجهات الحكومية الخليجية للاستشارات."},
 expect:{en:"Expect slide production, desk research, data cleaning, taking notes in workshops, and long unpredictable hours. You will own very little, and the quality of the placement depends almost entirely on which project you land on.",
         ar:"توقّع إعداد شرائح، وبحثًا مكتبيًا، وتنظيف بيانات، وتدوين محاضر ورش، وساعات طويلة غير منتظمة. ولن تملك من العمل إلا القليل، وجودة التدريب تعتمد كليًا تقريبًا على المشروع الذي تُوضع فيه."},
 leads:{en:"It leads to an analyst offer at the firm itself, and more commonly to a strategy, delivery or program management office inside a ministry, a government related entity or a giga project. That second route is where most people actually end up, and it pays comparably with better hours.",
        ar:"يقود إلى عرض عمل كمحلل في الشركة نفسها، ويقود بصورة أكثر شيوعًا إلى مكتب استراتيجية أو تنفيذ أو إدارة برامج داخل وزارة أو جهة حكومية أو مشروع كبير. وهذا المسار الثاني هو الذي ينتهي إليه أغلب الناس، وأجره مقارب وساعاته أفضل."}},
gov:{
 good:{en:"Good for learning how a decision and a budget actually move through an institution, the single most useful thing to know in an economy where the state is the largest client and the largest employer. You also learn the correspondence conventions no course teaches.",
       ar:"مفيد لتتعلم كيف يتحرك القرار وتتحرك الميزانية داخل مؤسسة، وهذه أنفع معرفة في اقتصاد تكون فيه الدولة أكبر عميل وأكبر جهة توظيف. وتتعلم أعراف المراسلات الرسمية التي لا يعلّمها أي مقرر."},
 expect:{en:"Expect slow onboarding, memo and letter drafting, meetings, committee minutes, and quiet stretches with little to do. The value of a government placement depends almost entirely on the one person supervising you, more so than in any other sector here.",
         ar:"توقّع بطئًا في إجراءات المباشرة، وصياغة مذكرات وخطابات، واجتماعات، ومحاضر لجان، وفترات هدوء بلا عمل يُذكر. وقيمة التدريب الحكومي تعتمد كليًا تقريبًا على الشخص الذي يشرف عليك، أكثر من أي قطاع آخر هنا."},
 leads:{en:"It leads to graduate entry at ministries and authorities, to a secondment into a program office, and to credibility when you later apply to any firm that sells to government. Understand before you go that public sector pay in most Gulf states runs on published grade and qualification rules, so the placement affects whether you get in, not what you are paid.",
        ar:"يقود إلى التعيين المباشر للخريجين في الوزارات والهيئات، وإلى الانتداب إلى مكتب برنامج، وإلى مصداقية عند التقديم لاحقًا على أي شركة تبيع للحكومة. واعلم قبل أن تبدأ أن أجور القطاع العام في معظم دول الخليج محكومة بسلالم درجات ومؤهلات منشورة، فالتدريب يؤثر في دخولك لا في راتبك."}},
health:{
 good:{en:"Good for testing whether you can tolerate a clinical environment, shift work and the sight of people who are unwell, before you commit years to a license. For non clinical students it is a clear view of how a hospital is financed and audited.",
       ar:"مفيد لتختبر هل تحتمل البيئة السريرية ونظام الورديات ومنظر المرضى، قبل أن تلتزم بسنوات من أجل ترخيص مهني. ولطلبة التخصصات غير السريرية هو نافذة على كيفية تمويل المستشفى وتدقيقه."},
 expect:{en:"Expect administration, quality and accreditation work, patient flow, medical records and infection control audits. Direct patient contact is restricted by licensing rules in every Gulf state, so a student placement is observational unless you are already in a clinical program with an approved rotation.",
         ar:"توقّع أعمالًا إدارية، وجودة واعتمادًا، وتدفق المرضى، وسجلات طبية، وتدقيق مكافحة العدوى. أما التعامل المباشر مع المرضى فمقيّد بأنظمة الترخيص في كل دول الخليج، فيبقى تدريب الطالب مشاهدةً ما لم تكن في برنامج سريري له دورة معتمدة."},
 leads:{en:"It leads to hospital groups public and private, health ministries, and to insurance, regulation and accreditation bodies. Note plainly that clinical careers are entered through licensing examinations and residency, not through internships, so a placement helps you decide but does not shorten the route.",
        ar:"يقود إلى المجموعات الصحية الحكومية والخاصة، ووزارات الصحة، وجهات التأمين والتنظيم والاعتماد. ولنقلها بصراحة: المسارات السريرية يُدخل إليها عبر امتحانات الترخيص والزمالة لا عبر التدريب الصيفي، فالتدريب يساعدك على الحسم لكنه لا يختصر الطريق."}},
education:{
 good:{en:"Good because it tests whether you can hold a room of thirty people who did not choose to be there, and nothing else in university tests that. It is the cheapest way to find out that teaching is not for you before you take a four year qualification.",
       ar:"مفيد لأنه يختبر قدرتك على ضبط قاعة فيها ثلاثون شخصًا لم يختاروا الحضور، ولا شيء في الجامعة يختبر ذلك. وهو أرخص طريقة لتكتشف أن التدريس لا يناسبك قبل أن تقضي أربع سنوات في مؤهل تربوي."},
 expect:{en:"Expect classroom observation, marking, small group support, preparing resources and administrative work. You will rarely lead a full lesson, and in many Gulf schools a student placement is treated as a supervision task rather than as training.",
         ar:"توقّع ملاحظة صفية، وتصحيح أوراق، ودعم مجموعات صغيرة، وإعداد مواد، وأعمالًا إدارية. ونادرًا ما ستقود حصة كاملة، وفي كثير من المدارس يُعامَل تدريب الطالب على أنه مهمة إشراف لا تدريب."},
 leads:{en:"Most hiring in the Gulf is in the private and international school sector, which is where a placement carries weight, alongside curriculum, assessment and education technology roles. In the national school systems pay is set by a published scale, so the placement affects whether you are hired, not what you earn.",
        ar:"أغلب التوظيف في الخليج في قطاع المدارس الخاصة والعالمية، وهناك يكون للتدريب وزن حقيقي، إلى جانب وظائف المناهج والقياس وتقنيات التعليم. أما في التعليم الحكومي فالراتب محدد بسلّم منشور، فالتدريب يؤثر في قبولك لا في دخلك."}},
hospitality:{
 good:{en:"Good for a fast and honest read on service standards, operational discipline and how a business runs on a margin. It is also the sector where an unpaid or very low paid placement is most common and most likely to be plain labor, so read the terms before you agree.",
       ar:"مفيد لقراءة سريعة وصادقة لمعايير الخدمة والانضباط التشغيلي وكيف يعمل نشاط على هامش ضيق. وهو أيضًا القطاع الذي يكثر فيه التدريب بلا أجر أو بأجر زهيد ويغلب أن يكون عملًا عاديًا، فاقرأ الشروط قبل أن توافق."},
 expect:{en:"Expect rostered shifts including weekends and public holidays, rotation through front desk, food and beverage and events, and a great deal of standing. You will be measured on attendance and manner more than on judgement.",
         ar:"توقّع ورديات مجدولة تشمل نهايات الأسبوع والأعياد، وتنقلًا بين الاستقبال والأغذية والمشروبات والفعاليات، ووقوفًا طويلًا. وسيُقاس أداؤك بالانضباط في الحضور وحسن التعامل أكثر من حسن التقدير."},
 leads:{en:"It leads to management trainee schemes at the international hotel operators, and increasingly to tourism development and events bodies tied to national tourism strategies. The second route pays better and is where Gulf nationals more often end up, but it recruits on project management and commercial skills rather than floor experience alone.",
        ar:"يقود إلى برامج المتدربين الإداريين لدى المشغّلين الفندقيين العالميين، وبصورة متزايدة إلى جهات تطوير السياحة والفعاليات المرتبطة بالاستراتيجيات الوطنية. والمسار الثاني أعلى أجرًا وإليه يتجه المواطنون غالبًا، لكنه يوظّف على أساس مهارات إدارة المشاريع والتجارة لا الخبرة الميدانية وحدها."}},
legal:{
 good:{en:"Good for finding out whether you can read long documents accurately for weeks without your attention slipping, which is most of the job. It is also where you discover how much of Gulf legal work is bilingual drafting rather than argument.",
       ar:"مفيد لتكتشف هل تستطيع قراءة وثائق طويلة بدقة أسابيع متصلة دون أن ينفلت انتباهك، فهذا معظم المهنة. وفيه تكتشف أن جزءًا كبيرًا من العمل القانوني الخليجي صياغة بلغتين لا مرافعة."},
 expect:{en:"Expect document review, translation between Arabic and English, preparing bundles, research memoranda, and at a local firm some court filing work. International firms in the financial centers do mostly transactional work and typically give students less to touch.",
         ar:"توقّع مراجعة مستندات، وترجمة بين العربية والإنجليزية، وإعداد ملفات القضايا، ومذكرات بحثية، وفي المكاتب المحلية بعض أعمال الإيداع أمام المحاكم. أما المكاتب الدولية في المراكز المالية فيغلب عليها العمل التعاملي وتعطي الطالب مساحة أضيق."},
 leads:{en:"It leads to trainee positions at local firms, to in house legal teams at banks, energy companies and government related entities, and to government legal departments. Check the licensing rules for your own nationality and degree before you invest, because the right to practice and to appear in court differs by country and in several Gulf states is restricted to nationals.",
        ar:"يقود إلى وظائف المحامي المتدرب في المكاتب المحلية، وإلى الإدارات القانونية داخل المصارف وشركات الطاقة والجهات الحكومية. وتحقق من أنظمة الترخيص بحسب جنسيتك ودرجتك قبل أن تستثمر وقتك، فحق مزاولة المهنة والمثول أمام المحاكم يختلف من دولة إلى أخرى وهو في عدد منها مقصور على المواطنين."}},
ngo:{
 good:{en:"Good for early responsibility, because these organizations are short staffed and will hand you real work quickly. You will build things yourself rather than watch, which is rare at this stage.",
       ar:"مفيد لأنك تتحمل مسؤولية مبكرة، إذ تعاني هذه الجهات من قلة الموظفين وستُسند إليك أعمال حقيقية بسرعة. وستبني أشياء بيدك بدل أن تكتفي بالمشاهدة، وهذا نادر في هذه المرحلة."},
 expect:{en:"Expect events, donor and grant reporting, social media, and spreadsheets you will have to build from nothing because no one else has. Supervision is often thin and processes are often absent, which is a burden and an opportunity at the same time.",

 leads:{en:"The Gulf sector is small and funded mainly by government, royal foundations and corporate giving. A placement here more often leads to a communications, program management or corporate social responsibility role inside a company or a government entity than to a career in the sector itself.",
        ar:"القطاع الخليجي صغير ويموَّل أساسًا من الحكومات والمؤسسات الملكية والعطاء المؤسسي. والتدريب هنا يقود في الغالب إلى وظيفة في الاتصال أو إدارة البرامج أو المسؤولية الاجتماعية داخل شركة أو جهة حكومية، أكثر مما يقود إلى مهنة في القطاع نفسه."}},
aviation:{
 good:{en:"Good because this is one of the few industries where Gulf employers are genuinely global operators, so what you learn transfers outside the region. It also shows you an operation that runs to the minute, which changes how you think about scheduling and cost.",

 expect:{en:"Expect rostered operations work, ground handling or hub control observation, network and schedule planning support, and a large amount of safety and compliance documentation. Airside access requires its own security clearance and training, which can take up a good part of a short placement.",

/* The body we prefill. The student replaces the bracketed parts. */
function applyBody(o, lang, extra){
  const org  = o.org[lang];
  const idw = o.ct === "bh" ? "CPR" : "civil ID";
  const prog = o.prog[lang];
  if(lang === "ar"){
    /* Kept deliberately short. Arabic percent-encodes to about nine characters
       per letter, and several mail handlers cut a mailto link off past 2000. */
    return [
      "تحية طيبة،",
      "",
      "أتقدم بطلب للالتحاق بـ" + prog + " لدى " + org + ".",
      "",
      "الاسم: [كما في البطاقة]",
      "الجهة الدراسية: []",
      "التخصص والسنة: [مثال: محاسبة، الثالثة]",
      "الرقم الشخصي: []",
      "الهاتف: []",
      "الفترة المتاحة: [من / إلى]",
      "",
      "سبب اختياري لكم: [ثلاثة أسطر عن الجهة]",
      "",
      (extra ? "المرفقات: " + extra : "المرفق: السيرة الذاتية."),
      "",
      "وشكرًا،",
      "[اسمك]"
    ].join("\n");
  }
  return [
    "Dear Sir or Madam,",
    "",
    "I am writing to apply for the " + prog + " at " + org + ".",
    "",
    "Name: [your full name as it appears on your " + idw + "]",
    "University or school: [your institution]",
    "Subject and year: [for example, Accounting, third year]",
    idw + " number: [your " + idw + "]",
    "Phone: [your number]",
    "Dates I am available: [for example, 1 July to 31 August]",
    "",
    "Why I want to train with you specifically: [three lines about why this organization, not about yourself]",
    "",
    (extra ? "Attached: " + extra : "Attached: my CV."),
    "",
    "Thank you for your time,",
    "[your name]"
  ].join("\n");
}

var LANG="en", CT="bh", ST="all", LV="all", SE="all", GRP="";
function L(){ return T[LANG]; }
function tx(o){ return o ? o[LANG] : ""; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function grpSectors(){ return GRP && GROUP_SECTORS[GRP] ? GROUP_SECTORS[GRP] : null; }

function matches(o){
  if(o.ct !== CT) return false;
  if(ST !== "all" && o.status !== ST) return false;
  if(LV !== "all" && o.level.indexOf(LV) < 0) return false;
  if(SE !== "all" && o.sector !== SE) return false;
  var g = grpSectors();
  if(g && g.indexOf(o.sector) < 0) return false;
  return true;
}

function chips(el, items, sel, attr){
  document.getElementById(el).innerHTML = items.map(function(i){
    var soon = (i.live === false);
    return '<button class="chip'+(i.k===sel?" on":"")+(soon?" soon":"")+'"'+
      (soon?' disabled title="'+esc(L().soon)+'"':'')+
      ' data-'+attr+'="'+i.k+'">'+ (i[LANG] || i.en) +'</button>';
  }).join("");
}

function renderMatcher(){
  var t = L();
  document.getElementById("m-h").textContent = t.mH;
  document.getElementById("m-p").innerHTML = t.mP.replace(
    LANG==="en" ? "the quiz is thirty four questions" : "فهو أربعة وثلاثون سؤالًا",
    '<a href="'+MC+'" target="_blank" rel="noopener">'+(LANG==="en"?"the quiz is thirty four questions":"فهو أربعة وثلاثون سؤالًا")+'</a>');
  var items = GROUP_LABELS.slice();
  document.getElementById("mchips").innerHTML =
    items.map(function(g){
      return '<button class="chip'+(g.k===GRP?" on":"")+'" data-grp="'+g.k+'">'+g[LANG]+'</button>';
    }).join("") +
    (GRP ? '<button class="chip" data-grp="">'+t.mClear+'</button>' : "");
  document.getElementById("m-hint").textContent = t.mHint;
}

function renderSectorRead(){
  var t = L(), el = document.getElementById("sread"), k = null;
  if(SE !== "all") k = SE;
  else if(GRP && GROUP_SECTORS[GRP]) k = GROUP_SECTORS[GRP][0];
  if(!k || !SECTOR_READ[k]){ el.innerHTML = ""; return; }
  var r = SECTOR_READ[k];
  var name = (SECTORS.filter(function(s){return s.k===k;})[0]||{})[LANG] || k;
  el.innerHTML = '<div class="sread"><h3>'+name+'</h3><dl>'+
    '<dt>'+t.sGood+'</dt><dd>'+tx(r.good)+'</dd>'+
    '<dt>'+t.sExpect+'</dt><dd>'+tx(r.expect)+'</dd>'+
    '<dt>'+t.sLeads+'</dt><dd>'+tx(r.leads)+'</dd>'+
    '</dl></div>';
}

function renderEvidence(){
  var t = L();
  document.getElementById("e-h").textContent = t.eH;
  document.getElementById("e-p").textContent = t.eP;
  var lab = {causal:t.evCausal, survey:t.evSurvey, contested:t.evContested, gap:t.evGap};
  document.getElementById("evlist").innerHTML = EVIDENCE.map(function(e){
    return '<div class="ev">'+
      '<span class="evtag '+e.strength+'">'+lab[e.strength]+'</span>'+
      '<div class="evclaim">'+tx(e.claim)+'</div>'+
      '<div class="evsrc"><b>'+t.evSource+':</b> '+tx(e.source)+
        ' <a class="evlink" href="'+e.url+'" target="_blank" rel="noopener">'+t.evRead+'</a></div>'+
      (e.note ? '<div class="evnote">'+tx(e.note)+'</div>' : '')+
    '</div>';
  }).join("");
}

function render(){
  var t = L();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  var kn = (KEYNOTES[CT] && KEYNOTES[CT][LANG]) || {h:t.keyH, p:t.keyP};
  document.getElementById("k-h").textContent = kn.h;
  document.getElementById("k-p").textContent = kn.p;
  document.getElementById("t-ctlabel").textContent = t.ctLabel;
  document.getElementById("t-stlabel").textContent = t.stLabel;
  document.getElementById("t-lvlabel").textContent = t.lvLabel;
  document.getElementById("t-selabel").textContent = t.seLabel;

  renderMatcher();
  chips("ctchips", CTS, CT, "ct");
  chips("stchips", STATUSES, ST, "st");
  chips("lvchips", LEVELS, LV, "lv");
  chips("sechips", SECTORS, SE, "se");
  renderSectorRead();

  var inCountry = OPPS.filter(function(o){ return o.ct === CT; });
  var rows = OPPS.filter(matches);
  var order = {open:0, annual:1, dormant:2};
  rows.sort(function(a,b){ return (order[a.status]-order[b.status]) || a.org.en.localeCompare(b.org.en); });
  document.getElementById("count").textContent = t.count(rows.length, inCountry.length);

  document.getElementById("list").innerHTML = rows.length ? rows.map(function(o){
    var stat = o.status==="open"    ? (LANG==="en"?"Open now":"مفتوح الآن")

    var paid = o.paid==="yes" ? '<span class="tag">'+t.paidYes+'</span>'

    return '<div class="opp">'+
      '<div class="otop"><span class="oorg">'+tx(o.org)+'</span>'+
      '<span class="oprog">'+tx(o.prog)+'</span>'+
      '<span class="tag'+(o.status==="open"?" open":"")+'">'+stat+'</span>'+paid+gate+'</div>'+
      '<dl class="orows">'+
        '<dt>'+t.dWhen+'</dt><dd>'+tx(o.apply)+'</dd>'+
        '<dt>'+t.dWho+'</dt><dd>'+tx(o.elig)+'</dd>'+
        '<dt>'+t.dLong+'</dt><dd>'+tx(o.duration)+'</dd>'+
        '<dt>'+t.dHow+'</dt><dd>'+tx(o.how)+'</dd>'+
      '</dl>'+
      applyBlock(o, t)+
      '<div class="ometa">'+t.checked(o.checked)+'</div>'+

  }).join("") : '<div class="empty">'+t.none+'</div>';

  document.getElementById("s-h").textContent = t.subH;
  document.getElementById("s-p").textContent = t.subP;
  document.getElementById("s-btn").textContent = t.subB;
  renderEvidence();
  document.getElementById("mc-h").textContent = t.mcH;
  document.getElementById("mc-p").textContent = t.mcP;
  document.getElementById("mcgrid").innerHTML = MCLINKS.map(function(m){
    var c = m[LANG];
    return '<a class="mccard" href="'+m.href+'" target="_blank" rel="noopener"><b>'+c[0]+'</b><span>'+c[1]+'</span></a>';
  }).join("");
  document.getElementById("srcT").textContent = t.srcT;
  document.getElementById("srcS").textContent = t.srcS;
  document.getElementById("t-disc").textContent = t.disc;
  document.getElementById("t-foot").innerHTML = t.foot;
}

function applyBlock(o, t){
  var a = (typeof APPLY !== "undefined" && APPLY[o.id]) || {};
  var out = '<div class="applyrow">';
  if(a.direct){
    out += '<a class="btn apply" href="'+a.direct+'" target="_blank" rel="noopener">'+t.applyDirect+'</a>';
  }
  if(a.email){
    var extra = a.attach ? a.attach[LANG] : null;
    var href = "mailto:" + a.email +
      "?subject=" + encodeURIComponent(a.subject || (o.prog[LANG] + " " + (LANG==="en"?"application":"طلب تدريب"))) +
      "&body=" + encodeURIComponent(applyBody(o, LANG, extra));
    out += '<a class="btn apply mail" href="'+href+'">'+t.applyEmail+'</a>';
  }
  out += '<a class="olink" href="'+o.url+'" target="_blank" rel="noopener">'+t.more+'</a>';
  out += '</div>';
  if(!a.direct && !a.email){
    out += '<div class="needbox"><b>'+t.applyNeedT+'</b><p>'+t.applyNeed+'</p></div>';
  }
  out += '<a class="cvlink" href="cv.html">'+t.cvHelp+'</a>';
  return out;
}

/* The tab title, the bookmark and anything that reads the document head
   should follow the language too, not sit in English on an Arabic page. */

};
function syncHead(){
  document.title = DOCTITLE[LANG] || DOCTITLE.en;
  var d = document.querySelector('meta[name="description"]');
  if(d) d.setAttribute("content", DOCDESC[LANG] || DOCDESC.en);
  var ol = document.querySelector('meta[property="og:locale"]');
  if(ol) ol.setAttribute("content", LANG === "ar" ? "ar_BH" : "en_US");
  var oa = document.querySelector('meta[property="og:locale:alternate"]');
  if(oa) oa.setAttribute("content", LANG === "ar" ? "en_US" : "ar_BH");
}

document.getElementById("langToggle").addEventListener("click", function(){
  LANG = (LANG === "en") ? "ar" : "en";
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === "ar") ? "rtl" : "ltr";
  this.textContent = (LANG === "ar") ? "English" : "عربي";

});

try{

<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
    /* Links that point at saqeralkhalifa.com have an Arabic twin. The
       main site is two separate pages, not a toggle, so the href has to
       move with the language or an Arabic reader lands in English. */
    var h = document.querySelectorAll("[data-href-en]");
    for(var j=0;j<h.length;j++){
      var v = h[j].getAttribute("data-href-"+l);
      if(v) h[j].setAttribute("href", v);
    }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
(function(){
  /* The visitor's language has to survive every click, including clicks that
     cross from one of these sites to another. They sit on different origins,
     so localStorage cannot carry the choice across; every internal link gets
     stamped with the current language instead. */
  var HOSTS = ["saqeralkhalifa.github.io", "internships.saqeralkhalifa.com",
               "saqeralkhalifa.com", "www.saqeralkhalifa.com"];

  function cur(){ return document.documentElement.lang === "ar" ? "ar" : "en"; }

  /* Never overwrite a lang that is already on the link. An explicit ?lang=ar
     link is itself a deliberate choice and outranks the running preference. */
  function stamp(a){
    try{
      var raw = a.getAttribute("href");
      if(!raw || raw.charAt(0) === "#") return;
      var u = new URL(raw, location.href);
      if(u.protocol !== "http:" && u.protocol !== "https:") return;
      if(HOSTS.indexOf(u.hostname) === -1) return;
      if(u.searchParams.has("lang")) return;
      u.searchParams.set("lang", cur());
      a.setAttribute("href", u.toString());
    }catch(e){}
  }
  function onAnchor(e){
    var t = e.target;
    var a = (t && t.closest) ? t.closest("a[href]") : null;
    if(a) stamp(a);
  }
  /* Capture phase, so the href is correct before the browser follows it.
     auxclick covers middle click, contextmenu covers "copy link address". */
  ["click", "auxclick", "contextmenu"].forEach(function(ev){
    document.addEventListener(ev, onAnchor, true);
  });

  var b = document.getElementById("langToggle");
  if(!b) return;
  var want = mcInitLang();
  if(want === "ar" && document.documentElement.lang !== "ar") b.click();
  if(want === "en" && document.documentElement.lang === "ar") b.click();
  mcSaveLang(want);
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){
        mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en");
      }, 0);
    }
  }, true);
})();
</script>
