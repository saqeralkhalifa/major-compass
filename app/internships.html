<script>
/* MCLANG: one language resolver shared across Dr. Saqer AlKhalifa's student tools. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }

/* ============================================================
   Youth Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-ar:'Noto Naskh Arabic', 'Amiri', Georgia, serif;

  --paper:#FAF5EA;
  --paper-2:#EFE4CE;
  --card:#F5ECDA;
  --line:#E2D5BB;
  --line-2:#D3C0A0;

  --ink:#152A55;
  --ink-2:#4A3728;
  --ink-3:#6B5B47;

  --navy:#152A55;
  --navy-deep:#0F2047;
  --accent:#7D5F27;
  --accent-soft:#EFE4CE;
  --accent-line:#D3C0A0;

  --gold:#7D5F27;
  --gold-soft:#F5ECDA;
  --gold-line:#E2D5BB;
  --gold-bright:#C09A45;

  --good:#2F5D46;  --good-soft:#E7EEE8;  --good-line:#C9D8CC;
  --warn:#7D5F27;  --warn-soft:#F5ECDA;  --warn-line:#E2D5BB;
  --bad:#8C3A30;   --bad-soft:#F6EAE3;   --bad-line:#E4D2C7;

  --radius:2px; --radius-sm:2px;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

/* ---------- the shared dark nav ---------- */
.mc-nav{
  background:var(--ink); color:var(--paper);
  position:sticky; top:0; z-index:40;
}
.mc-nav-inner{
  max-width:920px; margin:0 auto; padding:13px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
}
.mc-brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--paper); min-width:0;}
.mc-brand b{font-family:var(--font-display); font-size:17px; font-weight:400; letter-spacing:-.01em; white-space:nowrap;}
[dir="rtl"] .mc-brand b{font-family:var(--font-ar); font-weight:600; letter-spacing:0;}
.mc-brand span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9AAAD0; white-space:nowrap;}
[dir="rtl"] .mc-brand span{letter-spacing:0; text-transform:none; font-size:12px;}
.mc-nav-links{
  display:flex; gap:20px; font-size:12px; letter-spacing:.06em; align-items:center;
  overflow-x:auto; scrollbar-width:none; flex:1 1 auto; justify-content:center;
}
.mc-nav-links::-webkit-scrollbar{display:none;}
[dir="rtl"] .mc-nav-links{letter-spacing:0; font-size:13px;}
.mc-nav-links a{
  color:#D3DCEF; text-decoration:none; white-space:nowrap; padding-bottom:2px;
  border-bottom:1px solid transparent; transition:color .15s, border-color .15s;
}
.mc-nav-links a:hover{color:var(--paper);}
.mc-nav-links a[aria-current="page"]{color:var(--paper); border-bottom-color:var(--accent);}
.mc-nav .lang-toggle{
  flex:0 0 auto; border:1px solid var(--accent); background:var(--accent); border-radius:999px;
  padding:6px 17px; font-size:13px; letter-spacing:.04em; font-weight:600;
  color:#F5ECDA; cursor:pointer; font-family:var(--font-body);
  transition:background .15s, color .15s, border-color .15s;
}
.mc-nav .lang-toggle:hover{background:var(--paper); color:var(--ink); border-color:var(--paper);}
@media (max-width:640px){
  .mc-nav-inner{padding:11px 18px; gap:10px;}
  .mc-nav-links{justify-content:flex-start; order:3; width:100%; gap:16px; padding-bottom:2px;}
}
@media print{ .mc-nav{display:none;} }

/* the old in-page masthead and pill switcher are replaced by .mc-nav */
header.site, nav.toolnav{display:none !important;}

/* ---------- page header ---------- */
.hero, .res-head{position:relative;}
.hero::before{display:none !important;}
.hero{padding-top:52px;}
.hero h1{font-size:clamp(34px, 5.4vw, 52px); line-height:1.04; font-weight:400;}
[dir="rtl"] .hero h1{line-height:1.35; font-weight:600;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker, .eyebrow{

}
[dir="rtl"] .kicker, [dir="rtl"] .eyebrow{letter-spacing:0; text-transform:none; font-size:13px;}

/* ---------- surfaces: square, flat, ruled ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox,
.m, .fact, .pt, .bar, .quizbar, .cta-inline, .rule, .checked, .hedge, .extra, .flag,
.note, .card, .grp{
  border-radius:0 !important;
  box-shadow:none !important;
}
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .stat, .nextbox, .m, .fact{
  background:var(--card); border:1px solid var(--line-2);
}
.mcard:hover, .pcard:hover, .m:hover{border-color:var(--ink-3);}
.pcard{border-inline-start-width:2px; border-inline-start-color:var(--accent);}
.lede{background:var(--card); border:1px solid var(--line-2);
  border-inline-start:2px solid var(--accent) !important; border-inline-end:1px solid var(--line-2) !important;}

/* ---------- buttons ---------- */
.btn{
  background:var(--ink); border:1px solid var(--ink); border-radius:0;
  font-weight:500; letter-spacing:0; color:var(--paper); box-shadow:none;
  transition:background .15s, border-color .15s, color .15s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff; transform:none; filter:none; box-shadow:none;}
.btn.ghost, .btn.secondary{
  background:transparent; color:var(--ink); border:1px solid var(--ink); box-shadow:none;
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.printbtn{border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);}
.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

/* filter chips and pickers: square, ruled */
.fbtn, .chip, .navbtn, .picker button, .filters button{
  border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);
  box-shadow:none; transition:background .15s, color .15s, border-color .15s;
}
.fbtn:hover, .chip:hover, .navbtn:hover{border-color:var(--ink); color:var(--ink); background:transparent; transform:none;}
.fbtn.on, .chip.on, .navbtn.on{
  background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500; box-shadow:none;
}
input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);
}
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{
  background:var(--paper-2); border:1px solid var(--line); border-radius:0;
}
.rule, .checked, .hedge, .extra, .flag{border-radius:0;}
.rule.w, .checked, .hedge, .extra, .flag{background:var(--warn-soft); border-color:var(--warn-line);}

.rule.n{background:var(--paper-2); border-color:var(--line);}
.row.act{background:var(--paper-2) !important; border-color:var(--line) !important;}

  letter-spacing:0; text-transform:none; font-size:13px;

/* ---------- tables ---------- */
table{border-collapse:collapse;}
th{
  text-align:start; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--ink);
}
[dir="rtl"] th{letter-spacing:0; text-transform:none; font-size:13px;}
td{padding:14px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; font-size:14px;}

/* ---------- footer ---------- */
footer.site{

}
footer.site a{color:var(--accent); font-weight:500;}

.lang-toggle, .mc-nav .lang-toggle{border-radius:999px;}
.pt{border-inline-start-width:2px !important;}
.compass, .emoji{display:none !important;}

.subj, .tag, .chip{

[dir="rtl"] .subj, [dir="rtl"] .tag, [dir="rtl"] .chip{letter-spacing:0; text-transform:none; font-size:13px;}

 org:{en:"Tamkeen", ar:"تمكين"},
 prog:{en:"National Employment Program 3.0", ar:"برنامج التوظيف الوطني ٣٫٠"},
 apply:{en:"You cannot apply to this yourself. It is wage support an enterprise claims for someone it has already hired, and the page prints that the enterprise applies through Tamkeen's online portal within six months of the employee's joining date. It is listed here so you know it exists and can ask an employer about it, not as an opening.", ar:"لا يمكنك التقديم على هذا بنفسك. فهو دعم أجور تطالب به المنشأة لمن وظفته بالفعل، وتطبع الصفحة أن المنشأة تتقدم عبر بوابة تمكين الإلكترونية خلال ستة أشهر من تاريخ التحاق الموظف. وهو مدرج هنا لتعرف بوجوده وتسأل صاحب العمل عنه، لا بوصفه فرصة مفتوحة."},
 duration:{en:"Wage support for up to five years.", ar:"دعم للأجر لمدة تصل إلى خمس سنوات."},
 elig:{en:"The employee must be a Bahraini national, and either a fresh graduate with 24 months of experience or less or a job seeker nominated by the Ministry of Labor. The employee must not be a business owner or a commercial registration holder. Employees with a first or second degree relationship to the employer are excluded, as are outsourcing companies seeking support for employees seconded elsewhere. Wage floors printed are 350 dinars or more for high school graduates, 430 or more for diploma holders, 500 or more for bachelor's degree holders and above, and a minimum of 800 on the doctors track. Separate tracks are printed for actuaries, doctors, engineers and people with determination.", ar:"يجب أن يكون الموظف بحريني الجنسية، وأن يكون إما خريجًا جديدًا بخبرة ٢٤ شهرًا أو أقل أو باحثًا عن عمل مرشحًا من وزارة العمل. ويجب ألا يكون صاحب عمل أو حاملًا لسجل تجاري. ويُستثنى الموظفون الذين تربطهم بصاحب العمل صلة قرابة من الدرجة الأولى أو الثانية، وكذلك شركات الإسناد التي تطلب الدعم لموظفين منتدبين لجهات أخرى. والحدود الدنيا للأجر المطبوعة هي ٣٥٠ دينارًا فأكثر لخريجي الثانوية، و٤٣٠ فأكثر لحملة الدبلوم، و٥٠٠ فأكثر لحملة البكالوريوس فما فوق، و٨٠٠ كحد أدنى في مسار الأطباء. وتُطبع مسارات منفصلة للاكتواريين والأطباء والمهندسين وذوي العزيمة."},
 how:{en:"Through your employer, after you are hired. The wage figures printed are floors the employer must meet, 350 dinars or more for high school graduates, 430 or more for diploma holders and 500 or more for bachelor's degree holders, and they are not a stipend paid to an applicant.", ar:"عبر صاحب العمل بعد توظيفك. والأرقام المطبوعة للأجور حدود دنيا على صاحب العمل الوفاء بها، ٣٥٠ دينارًا فأكثر لخريجي الثانوية و٤٣٠ فأكثر لحاملي الدبلوم و٥٠٠ فأكثر لحاملي البكالوريوس، وليست مكافأة تُدفع لمتقدم."},
 url:"https://www.tamkeen.bh/en/programs/national-employment-program-3-0/", checked:"2026-10-03"},

{id:"tamkeen-apprenticeship", ct:"bh", sector:"gov", level:["hs","grad"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"Tamkeen, through the Bahrain national portal", ar:"تمكين، عبر البوابة الوطنية"},
 prog:{en:"Apprenticeship Program", ar:"برنامج التلمذة المهنية"},
 apply:{en:"You cannot apply to this yourself. The page prints that the enterprise employs the apprentice and claims the support, and it publishes no application route for an individual at all. It is listed here so you know it exists and can ask an employer about it.", ar:"لا يمكنك التقديم على هذا بنفسك. تطبع الصفحة أن المنشأة توظف المتدرب وتطالب بالدعم، ولا تنشر أي مسار تقديم للفرد إطلاقًا. وهو مدرج هنا لتعرف بوجوده وتسأل صاحب العمل عنه."},
 duration:{en:"36 months of support.", ar:"٣٦ شهرًا من الدعم."},
 elig:{en:"Bahraini nationals aged 16 to 40, registered with social insurance under the hiring company. The employer must hold an active commercial registration from the Ministry of Industry and Commerce or a license from the relevant regulator.", ar:"المواطنون البحرينيون من ١٦ إلى ٤٠ عامًا، المسجلون في التأمينات الاجتماعية لدى الشركة الموظِّفة. ويشترط أن يحمل صاحب العمل سجلًا تجاريًا ساريًا من وزارة الصناعة والتجارة أو ترخيصًا من الجهة الرقابية المختصة."},
 how:{en:"Through an employer that has already registered you with social insurance. Tamkeen prints that it covers 50 per cent of the wage for 36 months and 100 per cent of the training cost, which is money paid toward the employer's cost rather than to you.", ar:"عبر صاحب عمل سجّلك بالفعل في التأمينات الاجتماعية. وتطبع تمكين أنها تغطي ٥٠ بالمئة من الأجر لمدة ٣٦ شهرًا و١٠٠ بالمئة من كلفة التدريب، وهو مال يُدفع تجاه كلفة صاحب العمل لا إليك."},
 url:"https://www.bahrain.bh/wps/portal/en/BNP/ServicesCatalogue/GSX-UI-PServiceDetails?psID=3217", checked:"2026-10-03"},

 duration:{en:"Not stated on the page.", ar:"غير مذكورة في الصفحة."},
 elig:{en:"You classify yourself as a university student or a university graduate. Education levels run from secondary school through to a doctorate. Nationality is collected but no requirement is stated.", ar:"تصنّف نفسك طالبًا جامعيًا أو خريجًا جامعيًا. وتمتد المستويات التعليمية من الثانوية حتى الدكتوراه. وتُطلب الجنسية دون أن يُذكر شرط بشأنها."},
 how:{en:"Online form asking for your personal details, nationality, date of birth, education level, major and GPA, with your academic certificate, a letter of request from your university and a CV.", ar:"نموذج إلكتروني يطلب بياناتك الشخصية والجنسية وتاريخ الميلاد والمستوى التعليمي والتخصص والمعدل، مع شهادتك الأكاديمية وخطاب طلب من جامعتك وسيرة ذاتية."},
 url:"https://www.eskanbank.com/Contact/Careers/internForm", checked:"2026-10-03"},

{id:"bapco-empower", ct:"bh", sector:"energy", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Bapco Energies", ar:"بابكو للطاقة"},
 prog:{en:"Empower Summer Internship Program", ar:"برنامج إمباور للتدريب الصيفي"},

 duration:{en:"Eight weeks across July and August.", ar:"ثمانية أسابيع خلال يوليو وأغسطس."},
 elig:{en:"University students who need a placement to meet a graduation requirement. Placements are matched to your major.", ar:"طلبة الجامعات الذين يحتاجون التدريب لاستيفاء متطلب التخرج. توزَّع الفرص بحسب تخصصك."},
 how:{en:"Apply on the Bapco Energies career portal under the job title Intern. Places span Bapco Refining, Bapco Upstream, Bapco Gas, ASRY and GPIC.", ar:"قدّم عبر بوابة التوظيف تحت المسمى Intern. تشمل الفرص بابكو للتكرير وبابكو للتنقيب وبابكو للغاز وأسري وشركة الخليج لصناعة البتروكيماويات."},
 url:"https://www.bapcoenergies.com/empower-program", checked:"2026-09-01"},

{id:"edb-internship", ct:"bh", sector:"gov", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Bahrain Economic Development Board", ar:"مجلس التنمية الاقتصادية"},
 prog:{en:"EDB Internship Program", ar:"برنامج التدريب في مجلس التنمية الاقتصادية"},
 apply:{en:"Two rounds a year. Summer applications 2 to 31 May. Winter applications 1 to 23 November, so the winter round is the next one open.", ar:"دورتان في السنة. التقديم للصيف من ٥ إلى ٣١ مايو، وللشتاء من ١ إلى ٢٣ نوفمبر، والدورة الشتوية هي القادمة."},
 duration:{en:"Four weeks in January for the winter round, four to eight weeks in July and August for the summer round.", ar:"أربعة أسابيع في يناير للدورة الشتوية، ومن أربعة إلى ثمانية أسابيع في يوليو وأغسطس للدورة الصيفية."},
 elig:{en:"Bahraini students at universities anywhere in the world, aged 18 or over, with a GPA of 3.0 or above on the American system or 2.2 or above on the British system. Graduates are not eligible.", ar:"الطلبة البحرينيون في جامعات حول العالم، بعمر ١٨ فأكثر، بمعدل ٣٫٠ فأعلى في النظام الأمريكي أو ٢٫٢ فأعلى في النظام البريطاني. الخريجون غير مؤهلين."},
 how:{en:"Online form with a CV, CPR copy, transcript and a video answering three set questions. Interviews follow within two to four weeks of closing.", ar:"نموذج إلكتروني مع سيرة ذاتية ونسخة من البطاقة الذكية وكشف الدرجات ومقطع مصور يجيب عن ثلاثة أسئلة. تجري المقابلات خلال أسبوعين إلى أربعة من الإغلاق."},
 url:"https://www.bahrainedb.com/about-us/career-opportunities/edb-internship-programme", checked:"2026-10-01"},

{id:"sico-summer", ct:"bh", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"SICO", ar:"سيكو"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"The deadline is the end of May each year. Watch the same page from around March.", ar:"الموعد النهائي نهاية مايو من كل عام. تابع الصفحة نفسها ابتداءً من مارس تقريبًا."},
 duration:{en:"Two months, covering asset management, investment banking, brokerage, market making, treasury and research.", ar:"شهران تشمل إدارة الأصول والخدمات المصرفية الاستثمارية والوساطة وصناعة السوق والخزينة والبحوث."},
 elig:{en:"Bahraini nationals on an undergraduate degree in finance, business or economics, GPA 2.5 or above, competent in Excel and PowerPoint, strong Arabic and English.", ar:"مواطنون بحرينيون في بكالوريوس التمويل أو الأعمال أو الاقتصاد، بمعدل ٢٫٥ فأعلى، مع إجادة الإكسل والباوربوينت والعربية والإنجليزية."},
 how:{en:"Send your contact details and CV to Careers@sicobank.com.", ar:"أرسل بيانات التواصل والسيرة الذاتية إلى Careers@sicobank.com."},
 url:"https://www.sicobank.com/en/internships", checked:"2026-09-01"},

{id:"ghg-summer", ct:"bh", sector:"hospitality", level:["uni","grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Gulf Hotels Group", ar:"مجموعة فنادق الخليج"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"The page printed on 2 October 2026 that applications for 2026 are closed. It prints no closing date and no opening month.", ar:"طبعت الصفحة في ٢ أكتوبر ٢٠٢٦ أن التقديم لعام ٢٠٢٦ مغلق. ولا تطبع أي موعد إغلاق ولا شهر فتح."},
 duration:{en:"1 July to 31 August, as printed on the page.", ar:"من ١ يوليو إلى ٣١ أغسطس، كما تطبعه الصفحة."},
 elig:{en:"Bahraini nationals aged eighteen or older. The page prints no degree or enrollment rule.", ar:"المواطنون البحرينيون بعمر ثمانية عشر عامًا فأكثر. ولا تطبع الصفحة أي شرط شهادة أو قيد."},
 how:{en:"The page offers a general address for sending a CV, which is not an application to this program.", ar:"تتيح الصفحة عنوانًا عامًا لإرسال السيرة الذاتية، وهو ليس تقديمًا على هذا البرنامج."},
 url:"https://gulfhotelsgroup.com/internship/", checked:"2026-10-02"},

{id:"amh-medical", ct:"bh", sector:"health", level:["grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"American Mission Hospital", ar:"المستشفى الأمريكي"},
 prog:{en:"Medical Internship Program", ar:"برنامج الامتياز الطبي"},
 apply:{en:"The page still shows the 2024 and 2025 cycle, with a deadline of 5 May 2024, interviews from 26 to 29 May 2024, acceptance on 10 June 2024 and a start on 1 July 2024. No later cycle is published, so ask the hospital about the current one.", ar:"ما تزال الصفحة تعرض دورة ٢٠٢٤ و٢٠٢٥، بموعد إغلاق في ٥ مايو ٢٠٢٤، ومقابلات من ٢٦ إلى ٢٩ مايو ٢٠٢٤، وإشعار القبول في ١٠ يونيو ٢٠٢٤، وبداية في ١ يوليو ٢٠٢٤. ولم تُنشر دورة أحدث، فاسأل المستشفى عن الدورة الحالية."},
 duration:{en:"Not stated. Training is split between the hospital and Salmaniya Medical Complex.", ar:"غير مذكورة. يتوزع التدريب بين المستشفى ومجمع السلمانية الطبي."},
 elig:{en:"Graduates of medical schools in Bahrain, Bahraini and non Bahraini, plus Bahraini graduates of universities abroad. That cycle was also bounded by graduation year, taking 2023 graduates and those expecting to graduate by June 2024.", ar:"خريجو كليات الطب في البحرين، بحرينيين وغير بحرينيين، إضافة إلى الخريجين البحرينيين من جامعات خارج البحرين. وكانت تلك الدورة محددة بسنة التخرج كذلك، لخريجي ٢٠٢٣ ومن يتوقع تخرجهم بحلول يونيو ٢٠٢٤."},
 how:{en:"Online form. Prepare every document first because the form cannot be saved. Enquiries to internship@amh.org.bh.", ar:"نموذج إلكتروني. جهّز كل المستندات مسبقًا لأن النموذج لا يُحفظ. للاستفسار internship@amh.org.bh."},
 url:"https://www.amh.org.bh/internship/", checked:"2026-09-13"},

{id:"bisb-athr", ct:"bh", sector:"finance", level:["uni"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Bahrain Islamic Bank", ar:"بنك البحرين الإسلامي"},
 prog:{en:"Athr Summer Internship Program", ar:"برنامج أثر للتدريب الصيفي"},
 apply:{en:"The last cycle the bank published ran from July to September 2023. No later cycle and no application dates are published, so ask the bank or your university career office before the summer.", ar:"آخر دورة نشرها البنك جرت من يوليو إلى سبتمبر ٢٠٢٣. ولا تُنشر دورة أحدث ولا مواعيد تقديم، فاسأل البنك أو مكتب التوظيف في جامعتك قبل الصيف."},
 duration:{en:"The 2023 release describes a run from July to September, across several of the bank departments.", ar:"يصف بيان ٢٠٢٣ فترة من يوليو إلى سبتمبر، عبر عدة إدارات في البنك."},
 elig:{en:"University students and graduates. The 2023 release names 28 participants. It does not use the name Athr; it describes a summer training program inside a wider initiative called Jood, so the program name here may not be the bank current one.", ar:"طلبة الجامعات وخريجوها. ويذكر بيان ٢٠٢٣ ثمانية وعشرين مشاركًا. ولا يستخدم البيان اسم أثر، بل يصف برنامج تدريب صيفي ضمن مبادرة أوسع باسم جود، فقد لا يكون اسم البرنامج هنا هو المستخدم لدى البنك اليوم."},
 how:{en:"Not published.", ar:"غير منشورة."},
 url:"https://www.bisb.com/en/bnk-albhryn-alaslamy-bisb-ykhttm-tdrybh-alsyfy-ltlbt-wkhryjy-aljamat-bnjah", checked:"2026-10-01"},

 how:{en:"Not published.", ar:"غير منشورة."},
 url:"https://benefit.bh/media-centre/news-and-press-releases/BENEFIT-launches-fourth-edition-of-FinTech-Internship-Program-MASAR", checked:"2026-09-10"},

{id:"nbb-evolve", ct:"bh", sector:"finance", level:["grad"], paid:"yes", status:"open", gate:"nationals",
 org:{en:"National Bank of Bahrain", ar:"بنك البحرين الوطني"},
 prog:{en:"Thrive Program", ar:"برنامج ثرايف"},
 apply:{en:"Open. The application form was live on 2 October 2026 and prints no window. The internship is paid and runs six to twelve months.", ar:"مفتوح. كان نموذج التقديم متاحًا في ٢ أكتوبر ٢٠٢٦ ولا يذكر فترة محددة. والتدريب بأجر ويمتد من ستة إلى اثني عشر شهرًا."},
 duration:{en:"Six to twelve months, full time from day one.", ar:"من ستة إلى اثني عشر شهرًا، بدوام كامل منذ اليوم الأول."},
 elig:{en:"Bahraini graduates.", ar:"الخريجون البحرينيون."},
 how:{en:"Online form on the Thrive page: education level, major, GPA and a CV. A paid internship with a full time job role.", ar:"نموذج إلكتروني في صفحة ثرايف: المستوى التعليمي والتخصص والمعدل والسيرة الذاتية. تدريب بأجر ضمن دور وظيفي بدوام كامل."},
 url:"https://nbbonline.com/thrive-application/", checked:"2026-10-03"},

{id:"alsalam-summer", ct:"bh", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Al Salam Bank", ar:"مصرف السلام"},
 prog:{en:"Summer Internship Program", ar:"برنامج التدريب الصيفي"},
 apply:{en:"The bank's own announcement of the concluded eighteenth edition is the only page that names the program. It prints no window, no closing date and no application route.", ar:"إعلان المصرف نفسه عن النسخة الثامنة عشرة المنتهية هو الصفحة الوحيدة التي تذكر البرنامج. ولا يطبع أي فترة تقديم ولا موعد إغلاق ولا مسار تقديم."},

 prog:{en:"Information and Digital Technology Graduate Trainee Program", ar:"برنامج تدريب الخريجين في تقنية المعلومات والتقنية الرقمية"},
 apply:{en:"The careers page publishes a three week window, October 1 to 23, and that window has now opened. The page still dates the intake to January 2026, which has passed, so it is showing the previous cycle's timeline and the year of the current window is not printed. Confirm the cycle with Bapco Energies before you rely on the dates. The printed selection stages are eligibility verification October 26 to November 6, a video interview November 9 to 15, an online assessment November 16 to 20 and a final interview November 23 to December 15, all with the note that the timeline is subject to change.", ar:"تنشر صفحة الوظائف فترة تقديم من ثلاثة أسابيع، من ١ إلى ٢٣ أكتوبر، وقد فُتحت هذه الفترة الآن. وما تزال الصفحة تذكر أن الدفعة تبدأ في يناير ٢٠٢٦ وهو تاريخ مضى، فهي تعرض جدول الدورة السابقة ولا تطبع سنة الفترة الحالية. فتأكد من الدورة مع بابكو للطاقة قبل أن تعتمد على التواريخ. ومراحل الاختيار المطبوعة هي التحقق من الأهلية من ٢٦ أكتوبر إلى ٦ نوفمبر، ومقابلة مرئية من ٩ إلى ١٥ نوفمبر، وتقييم إلكتروني من ١٦ إلى ٢٠ نوفمبر، ومقابلة نهائية من ٢٣ نوفمبر إلى ١٥ ديسمبر، مع ملاحظة أن الجدول قابل للتغيير."},
 duration:{en:"One year.", ar:"سنة واحدة."},
 elig:{en:"Bahraini nationals who graduated within the past three years, aged 20 to 25 on the date you apply, with a GPA of 3.0 or above on the American system or an upper second on the British system, with effective communication skills in Arabic and English, and able to pass security clearance. The form asks for a CV, a CPR copy and an up to date university transcript.", ar:"مواطنون بحرينيون تخرجوا خلال السنوات الثلاث الماضية، بعمر ٢٠ إلى ٢٥ عامًا يوم التقديم، بمعدل ٣٫٠ فأعلى في النظام الأمريكي أو تقدير جيد جدًا في النظام البريطاني، مع مهارات تواصل فعّالة بالعربية والإنجليزية واجتياز التدقيق الأمني. ويطلب النموذج سيرة ذاتية ونسخة من البطاقة الذكية وكشف درجات محدّثًا."},

 duration:{en:"Four weeks.", ar:"أربعة أسابيع."},
 elig:{en:"Law students who have completed at least their first year, and graduates of the past two years, with fluent English and strong academic results. You must be resident in Kuwait or Bahrain depending on the office you apply to. No nationality requirement is stated.", ar:"طلبة القانون ممن أنهوا السنة الأولى على الأقل، والخريجون خلال السنتين الماضيتين، مع إجادة الإنجليزية ونتائج أكاديمية قوية. ويشترط أن تكون مقيمًا في الكويت أو البحرين بحسب المكتب الذي تقدم إليه. ولا تُشترط جنسية معينة."},
 how:{en:"Email careers@asarlegal.com with a cover letter naming the office you want, Kuwait or Bahrain, along with your CV, transcripts and supporting documents.", ar:"أرسل بريدًا إلى careers@asarlegal.com مع رسالة تعريف تحدد فيها المكتب الذي تريده، الكويت أو البحرين، مع سيرتك الذاتية وكشوف الدرجات والمستندات المساندة."},
 url:"https://www.asarlegal.com/asar-summer-internship-program-2026-kuwait-and-bahrain", checked:"2026-10-02"},

{id:"seef-internship", ct:"bh", sector:"industry", level:["uni"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Seef Properties", ar:"شركة سيف العقارية"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"The printed closing date is 10 June and it has passed, while the Apply Now button on the page is still live. A live form is not the same as an open round, so ask before you rely on it. The placement itself runs from 1 July to 31 August.", ar:"موعد الإغلاق المطبوع ١٠ يونيو وقد مضى، في حين أن زر التقديم في الصفحة ما يزال فعالًا. والنموذج الفعال ليس كالدفعة المفتوحة، فاسأل قبل أن تعتمد عليه. أما التدريب نفسه فيمتد من ١ يوليو إلى ٣١ أغسطس."},
 duration:{en:"Two months, 1 July to 31 August.", ar:"شهران، من ١ يوليو إلى ٣١ أغسطس."},
 elig:{en:"Bahraini university students aged 18 or over.", ar:"الطلبة الجامعيون البحرينيون بعمر ١٨ عامًا فأكثر."},
 how:{en:"Online form asking for your full name, email, university, major, and proof of your GPA or a CV. Attachments must be pdf, doc or docx and under 1MB each.", ar:"نموذج إلكتروني يطلب اسمك الكامل وبريدك الإلكتروني واسم جامعتك وتخصصك، وإثبات معدلك أو سيرة ذاتية. وتُقبل المرفقات بصيغة pdf أو doc أو docx على ألا يتجاوز حجم كل ملف ميغابايت واحدًا."},
 url:"https://seef.com.bh/internship/", checked:"2026-10-02"},

{id:"mbma-fdp", ct:"bh", sector:"gov", level:["grad"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"Mohamed bin Mubarak Al Khalifa Academy for Diplomatic Studies", ar:"أكاديمية محمد بن مبارك آل خليفة للدراسات الدبلوماسية"},
 prog:{en:"Foundational Diplomatic Program", ar:"البرنامج الدبلوماسي التأسيسي"},
 apply:{en:"Applications are closed at the moment. When a round opens the route is an online application, then a written examination, a psychometric test and an interview, and you take the diplomatic oath once you finish the program.", ar:"التقديم مغلق حاليًا. وعند فتح دورة جديدة يكون المسار طلبًا إلكترونيًا، ثم اختبارًا تحريريًا واختبارًا نفسيًا ومقابلة شخصية، وتؤدي القسم الدبلوماسي عند إتمام البرنامج."},
 duration:{en:"One academic year, nine calendar months.", ar:"سنة أكاديمية واحدة، أي تسعة أشهر."},
 elig:{en:"Bahraini citizens only, aged 32 or under, holding a bachelor's degree accredited in Bahrain, with an English certificate: IELTS 6.5, TOEFL iBT 79, CAE, CPE, GCSE or IGCSE English as a First or Second Language at grade C or 4, IB English at standard or higher level grade 4, or APTIS 169. You must be of good conduct and in good health, with no felony conviction and no dismissal from service within the past three years by a judicial ruling or a final disciplinary decision.", ar:"المواطنون البحرينيون فقط، بعمر ٣٢ سنة فأقل، من حملة بكالوريوس معتمد في البحرين، مع شهادة في الإنجليزية: آيلتس ٦٫٥، أو توفل آي بي تي ٧٩، أو سي أيه إي، أو سي بي إي، أو جي سي إس إي أو آي جي سي إس إي في الإنجليزية لغة أولى أو ثانية بتقدير C أو ٤، أو إنجليزية البكالوريا الدولية بالمستوى العادي أو العالي بتقدير ٤، أو أبتس ١٦٩. ويُشترط حسن السيرة والسلامة الصحية، وألا تكون محكومًا في جناية ولا مفصولًا من الخدمة خلال السنوات الثلاث الماضية بحكم قضائي أو قرار تأديبي نهائي."},
 how:{en:"Online application, followed by the written examination, the psychometric test and the interview.", ar:"طلب إلكتروني يتبعه الاختبار التحريري والاختبار النفسي والمقابلة."},
 url:"https://www.mbma.gov.bh/foundational-diplomatic-program/", checked:"2026-10-02"},

{id:"bas-takeoff", ct:"bh", sector:"aviation", level:["hs"], paid:"unknown", status:"dormant", gate:"unstated",

 prog:{en:"Take Off Summer Youth Program", ar:"برنامج تيك أوف الصيفي للشباب"},
 apply:{en:"There is nothing to apply to. The internship page has been taken down and now redirects to the home page, and the careers page names no program at all. It sends anyone looking for work to the national Dawmt portal instead.", ar:"لا يوجد ما يُقدَّم عليه. فقد أُزيلت صفحة التدريب وصارت تحوّل إلى الصفحة الرئيسية، ولا تذكر صفحة الوظائف أي برنامج. وتحيل الباحثين عن عمل إلى بوابة دوامت الوطنية بدلًا من ذلك."},
 duration:{en:"A summer program. The length is not stated.", ar:"برنامج صيفي. ومدته غير مذكورة."},
 elig:{en:"Secondary school students, roughly ages fifteen to eighteen. No nationality requirement is stated on the page.", ar:"طلبة المرحلة الثانوية، بأعمار خمسة عشر إلى ثمانية عشر تقريبًا. ولا تشترط الصفحة جنسية معينة."},
 how:{en:"No route is published. Watch the careers page and the company news for a fourth edition, and register on Dawmt in the meantime.", ar:"لا يُنشر أي مسار. تابع صفحة الوظائف وأخبار الشركة بحثًا عن نسخة رابعة، وسجّل في دوامت في هذه الأثناء."},
 url:"https://bas.com.bh/careers", checked:"2026-09-03"},

 apply:{en:"The page prints one line about timing, that applications will open in October 2025, and that date has passed. No later window is published.", ar:"تذكر الصفحة سطرًا واحدًا عن التوقيت هو أن التقديم سيُفتح في أكتوبر ٢٠٢٥، وقد انقضى ذلك الموعد. ولم تُنشر فترة أحدث."},

 how:{en:"Not published. The page carries no application link.", ar:"غير منشورة. ولا تحمل الصفحة رابط تقديم."},

{id:"bankabc-global-intern", ct:"bh", sector:"finance", level:["grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Bank ABC", ar:"بنك إيه بي سي"},
 prog:{en:"Global Internship Program", ar:"برنامج التدريب العالمي"},
 apply:{en:"No application window is published. Selection is competitive and includes a hackathon in which graduates compete for a place.", ar:"لا تُنشر فترة تقديم. والاختيار تنافسي ويشمل هاكاثون يتنافس فيه الخريجون على المقاعد."},
 duration:{en:"Two weeks of intensive training at the Bahrain Institute of Banking and Finance, then a two month internship, with a further two week international placement for the strongest performers.", ar:"أسبوعان من التدريب المكثف في معهد البحرين للدراسات المصرفية والمالية، ثم تدريب لمدة شهرين، مع تنسيب دولي إضافي لأسبوعين لأصحاب الأداء الأفضل."},
 elig:{en:"Graduates who finished their degree within the past year. Selection looks at academic results, previous internship experience, personal qualities and motivation. The head office is in Bahrain, and international placements are in New York, London, Paris, Milan and Dubai.", ar:"الخريجون الذين أنهوا دراستهم خلال العام الماضي. ويراعي الاختيار النتائج الأكاديمية وخبرة التدريب السابقة والصفات الشخصية والدافعية. والمقر الرئيسي في البحرين، والتنسيب الدولي في نيويورك ولندن وباريس وميلانو ودبي."},
 how:{en:"The page prints no application route. It describes the hackathon as part of how the bank selects, not as something you enter directly, so write to the bank and ask how to be considered.", ar:"لا تطبع الصفحة مسار تقديم. وتصف الهاكاثون بوصفه جزءًا من طريقة اختيار البنك لا شيئًا تدخله مباشرة، فراسل البنك واسأل كيف يمكن النظر في طلبك."},
 url:"https://www.bank-abc.com/en/Media%20Relations/PressRelease/next-generation-of-bankers", checked:"2026-10-02"},

{id:"ithmaar-energy-intern", ct:"bh", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Ithmaar Bank", ar:"بنك الإثمار"},
 prog:{en:"Ithmaar Energy Internship Program", ar:"برنامج الإثمار للطاقة التدريبي"},
 apply:{en:"No application window or route is published on the page. The most recent announcement is dated 9 August 2026. The 2026 edition ran in August with 17 students.", ar:"لا تُنشر فترة تقديم ولا طريقة له في الصفحة. وآخر إعلان مؤرخ في ٩ أغسطس ٢٠٢٦. وأُقيمت دورة ٢٠٢٦ في أغسطس بسبعة عشر طالبًا."},
 duration:{en:"Not stated on the page.", ar:"غير مذكورة في الصفحة."},
 elig:{en:"University students. The page describes the program as aimed at young Bahraini talent but sets no explicit nationality rule.", ar:"طلبة الجامعات. وتصف الصفحة البرنامج بأنه موجه للكفاءات البحرينية الشابة دون أن تضع شرط جنسية صريحًا."},
 how:{en:"Not stated on the page.", ar:"غير مذكورة في الصفحة."},

{id:"cpisp", ct:"bh", sector:"gov", level:["hs"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Crown Prince's International Scholarship Program", ar:"برنامج ولي العهد للمنح الدراسية العالمية"},
 prog:{en:"CPISP, Grade 11 round", ar:"دورة الصف الحادي عشر"},
 apply:{en:"Applications open every March. The 2026 round has closed.", ar:"يُفتح التقديم كل مارس. وقد أُغلقت دورة ٢٠٢٦."},
 duration:{en:"A fully funded undergraduate degree abroad. Ministry of Education students first do two years of preparatory boarding school.", ar:"منحة كاملة لبكالوريوس في الخارج. يدرس طلبة مدارس وزارة التربية سنتين تحضيريتين داخليتين قبلها."},
 elig:{en:"Bahraini citizens in Grade 11 or equivalent with a cumulative average of 97 per cent or above across Grade 10 and the first semester of Grade 11. You apply yourself, no school nomination needed.", ar:"مواطنون بحرينيون في الصف الحادي عشر أو ما يعادله بمعدل تراكمي ٩٧٪ فأعلى للصف العاشر والفصل الأول من الحادي عشر. التقديم فردي دون حاجة لترشيح المدرسة."},
 how:{en:"Apply online in the March window, then sit the English and critical reasoning examinations.", ar:"قدّم إلكترونيًا في فترة مارس، ثم اجلس لاختباري اللغة الإنجليزية والتفكير النقدي."},
 url:"https://www.cpisp.bh/CPISPapplication/", checked:"2026-09-03"},

{id:"youth-city-2030", ct:"bh", sector:"gov", level:["hs","uni"], paid:"no", status:"annual", gate:"nationals",
 org:{en:"Ministry of Youth Affairs", ar:"وزارة شؤون الشباب"},
 prog:{en:"Youth City 2030", ar:"مدينة شباب ٢٠٣٠"},
 apply:{en:"The 2026 summer season has ended. This page prints no dates for it, so watch the E-Shabab app, where registration for the next season opens.", ar:"انتهى موسم صيف ٢٠٢٦. ولا تطبع هذه الصفحة تواريخه، فتابع تطبيق E-Shabab حيث يُفتح التسجيل للموسم القادم."},
 duration:{en:"Short programs. The 15 and over group runs evenings, 4pm to 8.30pm. A certificate needs 80 per cent attendance.", ar:"برامج قصيرة. تحضر الفئة من ١٥ عامًا فأكثر مساءً من الرابعة حتى الثامنة والنصف. وتُمنح الشهادة بحضور ٨٠٪."},
 elig:{en:"Bahrainis aged 9 to 14 for the morning session and 15 to 35 for the evening session, with a valid smart card and an active eKey account.", ar:"البحرينيون من ٩ إلى ١٤ عامًا للفترة الصباحية ومن ١٥ إلى ٣٥ عامًا للفترة المسائية، ببطاقة ذكية سارية وحساب مفتاح إلكتروني فعّال."},
 how:{en:"Register on the E-Shabab app and pay online. Fees are 5 or 10 dinars for the younger group and 10 or 20 for the older group, the higher figure for programs with a training body certificate. No cash.", ar:"سجّل عبر تطبيق E-Shabab وادفع إلكترونيًا. الرسوم ٥ أو ١٠ دنانير للفئة الأصغر و١٠ أو ٢٠ للفئة الأكبر، والمبلغ الأعلى للبرامج التي تمنح شهادة من جهة تدريبية. ولا تُقبل النقدية."},
 url:"https://www.mya.gov.bh/en/faq-youth-city-2030", checked:"2026-09-28"},

{id:"uob-early-access", ct:"bh", sector:"education", level:["hs"], paid:"no", status:"annual", gate:"residents",
 org:{en:"University of Bahrain", ar:"جامعة البحرين"},
 prog:{en:"Early Access to University", ar:"برنامج الوصول المبكر للجامعة"},
 apply:{en:"Registration for the summer term ran 9 to 19 June 2026, which has passed. The university prints that the exact window varies from semester to semester, so check before each term rather than assuming these dates.", ar:"جرى التسجيل للفصل الصيفي من ٩ إلى ١٩ يونيو ٢٠٢٦ وقد مضى. وتطبع الجامعة أن الفترة الدقيقة تختلف من فصل إلى آخر، فتحقق قبل كل فصل بدل افتراض هذه التواريخ."},
 duration:{en:"Real university courses taken while still at school, for credit. Grade 12 entrants take one summer term. Grade 10 entrants can take two years, including summer terms, which is how the page puts it. Three courses a semester at most.", ar:"مقررات جامعية حقيقية تُدرس وأنت في المدرسة وتُحتسب ساعاتها. ويأخذ الملتحق في الصف الثاني عشر فصلًا صيفيًا واحدًا. ويمكن للملتحق في الصف العاشر أخذ سنتين تشملان الفصول الصيفية، وهكذا تضعها الصفحة. وثلاثة مقررات في الفصل على الأكثر."},
 elig:{en:"Students in Grade 10, 11 or 12 at public or private schools, which is the wording the university prints. Under 18s need parental consent.", ar:"طلبة الصفوف العاشر والحادي عشر والثاني عشر في المدارس العامة أو الخاصة، وهذه هي الصيغة التي تطبعها الجامعة. ويحتاج من هم دون الثامنة عشرة إلى موافقة ولي الأمر."},
 how:{en:"Register on the student information system with a transcript, ID and parental consent. Fees are 8 dinars per credit hour for Bahrainis and 80 for others, plus a one off 50 dinar summer registration fee.", ar:"سجّل عبر نظام معلومات الطلبة مع كشف درجات وإثبات هوية وموافقة ولي الأمر. الرسوم ٨ دنانير للساعة للبحرينيين و٨٠ لغيرهم، مع رسم تسجيل صيفي ٥٠ دينارًا يُدفع مرة واحدة."},
 url:"https://www.uob.edu.bh/study/early-access-to-university/", checked:"2026-10-02"},

{id:"mkf-rayaat", ct:"bh", sector:"ngo", level:["hs","uni"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"AlMabarrah AlKhalifia Foundation", ar:"مؤسسة المبرة الخليفية"},
 prog:{en:"Rayaat scholarship program", ar:"برنامج رايات للمنح الدراسية"},
 apply:{en:"The foundation's own registration announcement prints that applications for the 2026 to 2027 academic year were accepted over ten days, from 29 March to 7 April 2026, so that window has closed. The requirements on the program page open only when the Requirements heading is tapped.", ar:"يطبع إعلان التسجيل الصادر عن المؤسسة نفسها أن طلبات العام الدراسي ٢٠٢٦ إلى ٢٠٢٧ استُقبلت خلال عشرة أيام، من ٢٩ مارس إلى ٧ أبريل ٢٠٢٦، فتلك الفترة أُغلقت. وشروط البرنامج لا تظهر في الصفحة إلا بالنقر على عنوان الشروط."},
 duration:{en:"The length of the degree. The scholarship covers university fees in full and adds a book allowance, monthly incentives for outstanding students, enrichment workshops, internships at private and government bodies, and community service.", ar:"مدة الدرجة الجامعية. وتغطي المنحة الرسوم الجامعية كاملة وتضيف بدل كتب، وحوافز شهرية للطلبة المتميزين، وورش إثراء، وتدريبًا في جهات خاصة وحكومية، وعملًا مجتمعيًا."},
 elig:{en:"Bahraini national, printed as the first requirement. A secondary school average of at least 85 percent for the government universities, or at least 95 percent or the equivalent for a fresh graduate going to the Euro University of Bahrain. Current university students need a cumulative grade point average of 3.0 or above. You must apply to one or more of the foundation's partner universities yourself, you must not already hold a bachelor's degree, and you must not hold another grant, scholarship or financial assistance from any government or private body.", ar:"مواطن بحريني، وهو أول شرط مطبوع. ومعدل ثانوية عامة لا يقل عن ٨٥ بالمئة للجامعات الحكومية، أو لا يقل عن ٩٥ بالمئة أو ما يعادله للخريج الحديث المتوجه إلى الجامعة الأوروبية للبحرين. ويحتاج الطلبة الجامعيون الحاليون إلى معدل تراكمي ٣٫٠ فأعلى. وعليك أن تتقدم بنفسك إلى جامعة واحدة أو أكثر من الجامعات الشريكة للمؤسسة، وألا تكون حاصلًا على درجة البكالوريوس مسبقًا، وألا تكون حاصلًا على منحة أو مساعدة مالية أخرى من أي جهة حكومية أو خاصة."},
 how:{en:"The page lists the documents it wants with the application: the applicant's passport and smart card, both parents' passports, the certificates for the last five secondary school semesters, a passport sized photograph, course and volunteering certificates where you have them, a conditional acceptance letter from the Euro University of Bahrain, and a full academic transcript for current university students.", ar:"تدرج الصفحة المستندات المطلوبة مع الطلب: جواز سفر مقدم الطلب وبطاقته الذكية، وجوازي سفر الوالدين، وشهادات آخر خمسة فصول دراسية من المرحلة الثانوية، وصورة شخصية بحجم جواز السفر، وشهادات الدورات والعمل التطوعي إن وُجدت، وخطاب قبول مشروط من الجامعة الأوروبية للبحرين، وكشف الدرجات الأكاديمي الكامل للطلبة الجامعيين الحاليين."},
 url:"https://mkfbh.org/rayaat", checked:"2026-10-02"},

{id:"mkf-watheq", ct:"bh", sector:"ngo", level:["hs"], paid:"no", status:"annual", gate:"unstated",
 org:{en:"AlMabarrah AlKhalifia Foundation", ar:"مؤسسة المبرة الخليفية"},
 prog:{en:"Watheq university preparatory program", ar:"برنامج واثق التحضيري للجامعة"},
 apply:{en:"The 2026 program ran from 1 to 30 July and has finished. The page also carries the 2025 dates, 14 July to 20 August. Seats are limited and no application deadline is printed, so register as soon as the next round opens.", ar:"جرى برنامج ٢٠٢٦ من ١ إلى ٣٠ يوليو وانتهى. وتحمل الصفحة أيضًا تواريخ ٢٠٢٥ من ١٤ يوليو إلى ٢٠ أغسطس. والمقاعد محدودة ولا يُنشر موعد نهائي للتقديم، فسجّل فور فتح الدورة القادمة."},
 duration:{en:"21 days, 24 sessions, daily 9am to 2pm, with university visits, company tours and mock interviews.", ar:"٢١ يومًا و٢٤ جلسة، يوميًا من التاسعة حتى الثانية، مع زيارات جامعية وجولات في الشركات ومقابلات تجريبية."},
 elig:{en:"Aged 16 to 18, secondary students or recent school leavers. You apply yourself, no school nomination needed.", ar:"من ١٦ إلى ١٨ عامًا، من طلبة الثانوية أو خريجيها حديثًا. التقديم فردي دون حاجة لترشيح المدرسة."},
 how:{en:"Register on the program page. A non refundable fee of 30 dinars applies.", ar:"سجّل عبر صفحة البرنامج. الرسوم ٣٠ دينارًا وغير قابلة للاسترداد."},
 url:"https://mkfbh.org/watheq", checked:"2026-09-10"},

{id:"ncst-secondary", ct:"bh", sector:"education", level:["hs"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Nasser Center for Science and Technology", ar:"مركز ناصر للعلوم والتكنولوجيا"},
 prog:{en:"Secondary technical and vocational programs", ar:"البرامج الثانوية التقنية والمهنية"},
 apply:{en:"Applications are through the center's own form. No dates, rounds or deadline are published.", ar:"التقديم عبر نموذج المركز. ولا تُنشر تواريخ ولا جولات ولا موعد نهائي."},
 duration:{en:"A full time secondary school route, not a short placement. Streams include technical education, mechanical and electrical engineering, artificial intelligence, cloud computing, cybersecurity, sport and business, and vocational training.", ar:"مسار مدرسي ثانوي بدوام كامل لا تدريبًا قصيرًا. تشمل المسارات التعليم التقني والهندسة الميكانيكية والكهربائية والذكاء الاصطناعي والحوسبة السحابية والأمن السيبراني والرياضة وإدارة الأعمال والتدريب المهني."},
 elig:{en:"Applicants must be a Bahraini national. The technical education program takes students aged 14 to 16 who have completed the Grade 9 school certificate, and the vocational training program takes ages 14 to 20. The technical education program is conditional on passing an entrance test in English and mathematics, while the artificial intelligence, cloud computing and cybersecurity programs require an entrance test in English, Arabic and mathematics. All programs require passing the entrance exams and interviews.", ar:"يجب أن يكون المتقدم بحريني الجنسية. ويقبل برنامج التعليم التقني الطلبة بين ١٤ و١٦ عامًا ممن أتموا شهادة الصف التاسع، ويقبل برنامج التدريب المهني الأعمار بين ١٤ و٢٠ عامًا. ويشترط برنامج التعليم التقني اجتياز اختبار قبول في الإنجليزية والرياضيات، بينما تشترط برامج الذكاء الاصطناعي والحوسبة السحابية والأمن السيبراني اختبار قبول في الإنجليزية والعربية والرياضيات. وتشترط جميع البرامج اجتياز اختبارات القبول والمقابلات."},
 how:{en:"The page prints a document checklist: a completed application form, three recent passport photographs, previous school reports with final grades, medical status, and an original or copy of the CPR and the passport. It prints no submission link, no email address and no office to send them to.", ar:"تطبع الصفحة قائمة مستندات: نموذج طلب مستوفى، وثلاث صور شخصية حديثة، وتقارير المدرسة السابقة بالدرجات النهائية، والحالة الصحية، وأصل أو نسخة من البطاقة الشخصية وجواز السفر. ولا تطبع رابط تقديم ولا عنوان بريد ولا جهة تُرسل إليها."},
 url:"https://ncst.edu.bh/academic/programmes-courses/", checked:"2026-10-03"},

 elig:{en:"The page describes the school as introducing RCSI undergraduate students to research, and prints no nationality or residence rule. The application route runs through the university's internal virtual learning environment, so a student from another university cannot apply from this page.", ar:"تصف الصفحة المدرسة بأنها تعرّف طلبة البكالوريوس في الجامعة على البحث العلمي، ولا تذكر شرط جنسية أو إقامة. ويمر التقديم عبر بيئة التعلم الافتراضية الداخلية للجامعة، فلا يستطيع طالب من جامعة أخرى التقديم من هذه الصفحة."},

 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"The applicant must be an Omani national. Three tracks are printed. Undergraduate trainees must be in the penultimate year of a degree or diploma. Graduate trainees must have completed the degree or diploma. On job training applicants must have completed the EASA B1 or B2 program and passed all its modules, with a letter from a Part 147 or CAR 147 training school. For all three the field of study must relate to aeronautical or aerospace engineering, aircraft maintenance engineering, mechanical engineering, electrical or electronic engineering, electronic and communication engineering, or mechatronics.", ar:"يجب أن يكون المتقدم عُماني الجنسية. وتُطبع ثلاثة مسارات. فطلبة البكالوريوس يجب أن يكونوا في السنة قبل الأخيرة من الدرجة أو الدبلوم. والخريجون يجب أن يكونوا قد أتموا الدرجة أو الدبلوم. أما المتقدمون للتدريب أثناء العمل فيجب أن يكونوا قد أتموا برنامج بي١ أو بي٢ واجتازوا جميع وحداته، مع خطاب من مدرسة تدريب معتمدة وفق الجزء ١٤٧. وفي المسارات الثلاثة يجب أن يتصل التخصص بهندسة الطيران أو الفضاء، أو هندسة صيانة الطائرات، أو الهندسة الميكانيكية، أو الهندسة الكهربائية أو الإلكترونية، أو هندسة الإلكترونيات والاتصالات، أو الميكاترونكس."},
 how:{en:"Email technical.training@omanair.com with a CV, a passport copy and both sides of a national ID, plus the documents for your track: transcripts and graduation certificates, and for on job training a letter from a Part 147 or CAR 147 training school.", ar:"أرسل إلى technical.training@omanair.com سيرة ذاتية ونسخة من جواز السفر ووجهي الهوية الوطنية، إضافة إلى مستندات مسارك: كشوف الدرجات وشهادات التخرج، وللتدريب أثناء العمل خطاب من مدرسة تدريب معتمدة وفق الجزء ١٤٧."},
 url:"https://services.omanair.com/gbl/en/engineering-request-form", checked:"2026-09-28"},

{id:"mol-linked-training", ct:"om", sector:"gov", level:["hs","grad"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Ministry of Labor", ar:"وزارة العمل"},
 prog:{en:"Employment Linked and On the Job Training Contracts", ar:"التدريب المقرون بالتشغيل وعقود التدريب على رأس العمل"},
 apply:{en:"A job seeker cannot apply here. The page names employers and establishments as the beneficiaries of the service, and the start button goes to the employer e-services portal. Your part begins only after an employer has registered a contract, which you then accept or reject. Requests lapse after fourteen days of inactivity.", ar:"لا يمكن للباحث عن عمل التقديم هنا. تذكر الصفحة أن المستفيدين من الخدمة هم أصحاب العمل والمنشآت، ويقود زر بدء الخدمة إلى بوابة الخدمات الإلكترونية لأصحاب العمل. ولا يبدأ دورك إلا بعد أن تسجل جهة عمل عقدًا تقبله أنت أو ترفضه. وتُلغى الطلبات تلقائيًا بعد أربعة عشر يومًا من عدم التفاعل."},
 duration:{en:"Set in the contract. Not published as a fixed term.", ar:"تُحدد في العقد، ولا تُنشر مدة موحدة."},
 elig:{en:"The page prints no nationality rule. The beneficiary is a registered job seeker who receives a training contract from an establishment. The employer signs in by national ID or by a PKI authenticated phone card.", ar:"لا تطبع الصفحة أي شرط جنسية. والمستفيد باحث عن عمل مسجل يتلقى عقد تدريب من منشأة. ويدخل صاحب العمل إلى الخدمة بالهوية الوطنية أو ببطاقة هاتف موثقة."},
 how:{en:"The employer signs in, adds a new request, enters the applicant information, chooses an approved training opportunity, signs electronically and sends the contract to the job seeker, who accepts or rejects it through the individual services portal. On acceptance the contract registers with the ministry and the social protection fund. A request is cancelled automatically after fourteen days if it stays a draft or waits on the job seeker with no update.", ar:"يدخل صاحب العمل إلى الخدمة، ويضيف طلبًا جديدًا، ويُدخل بيانات المتقدم، ويختار فرصة تدريب معتمدة، ويوقّع إلكترونيًا ويرسل العقد إلى الباحث عن عمل الذي يقبله أو يرفضه عبر بوابة خدمات الأفراد. وعند القبول يُسجَّل العقد لدى الوزارة وصندوق الحماية الاجتماعية. ويُلغى الطلب تلقائيًا بعد أربعة عشر يومًا إذا بقي مسودة أو بانتظار الباحث عن عمل دون تحديث."},
 url:"https://www.mol.gov.om/ManpowerAllEServices/Details/340", checked:"2026-10-01"},

 apply:{en:"Open courses are listed on the programs page while places last. The current listing is a three day biodiversity course for ages fourteen to twenty five, with no dates or price published.", ar:"تُعرض الدورات المفتوحة في صفحة البرامج ما دامت المقاعد متاحة. والمعروض حاليًا دورة عن التنوع الحيوي لثلاثة أيام للأعمار من ١٤ إلى ٢٥، دون نشر تواريخ ولا رسوم."},

 elig:{en:"The one course listed, Biodiversity Gems, is printed for ages 14 to 25 and runs for three days in partnership with the British Embassy Muscat. The page prints no dates, no price and no nationality rule.", ar:"الدورة الوحيدة المدرجة، جواهر التنوع الأحيائي، مطبوعة للأعمار من ١٤ إلى ٢٥ عامًا وتمتد ثلاثة أيام بالشراكة مع السفارة البريطانية في مسقط. ولا تطبع الصفحة تواريخ ولا سعرًا ولا شرط جنسية."},
 how:{en:"A Find more link on the page leads to a Google Form. The page prints no email address.", ar:"رابط في الصفحة يقود إلى نموذج جوجل. ولا تطبع الصفحة عنوان بريد."},
 url:"https://outwardboundoman.com/available-programmes/", checked:"2026-09-28"},

{id:"omran-talent", ct:"om", sector:"hospitality", level:["uni","grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"OMRAN Group", ar:"مجموعة عُمران"},
 prog:{en:"Masarat, Midhyaf and Tadreeb Programs", ar:"برامج مسارات ومضياف وتدريب"},
 apply:{en:"Openings post on the group's e careers portal.", ar:"تُنشر الفرص في بوابة التوظيف الإلكترونية للمجموعة."},
 duration:{en:"Varies by program.", ar:"تختلف بحسب البرنامج."},
 elig:{en:"The page prints no nationality rule. It states that the group recruits talented people from the Sultanate of Oman and around the world. The programs named are Midhyaf, the hospitality training and placement program, Masarat for graduate development and rotational learning, and Tadreeb for hands on training and skills development.", ar:"لا تطبع الصفحة أي شرط جنسية. وتذكر أن المجموعة تستقطب الكفاءات من سلطنة عُمان ومن خارجها. والبرامج المذكورة هي مِضياف للتدريب والتوظيف في الضيافة، ومسارات لتطوير الخريجين والتدوير الوظيفي، وتدريب للتدريب العملي وبناء المهارات."},
 how:{en:"Register and apply on the e careers portal.", ar:"سجّل وقدّم عبر بوابة التوظيف الإلكترونية."},
 url:"https://omran.om/work-at-omran-group", checked:"2026-09-28"},

{id:"squ-elective", ct:"om", sector:"health", level:["uni"], paid:"no", status:"open", gate:"unstated",
 org:{en:"Sultan Qaboos University, College of Medicine", ar:"جامعة السلطان قابوس، كلية الطب"},
 prog:{en:"Clinical Elective for Visiting Medical Students", ar:"التدريب السريري الاختياري للطلبة الزائرين"},
 apply:{en:"Apply at least six months before your start date. Electives begin on the first Sunday of each month.", ar:"قدّم قبل ستة أشهر على الأقل من تاريخ البدء. وتبدأ الفترات في أول أحد من كل شهر."},
 duration:{en:"Two to eight weeks. No tuition fees at present, and the placement is unpaid.", ar:"من أسبوعين إلى ثمانية أسابيع، دون رسوم دراسية حاليًا، والتدريب بلا أجر."},
 elig:{en:"Medical students who have completed at least three years of medical training and are actively enrolled in the clinical or clerkship phase, at a school listed in the World Directory of Medical Schools and authorised to award a primary medical qualification. Applicants who have already graduated are not eligible. Adequate English for clinical communication is required. The page prints no nationality rule and no residence rule.", ar:"طلبة الطب الذين أتموا ثلاث سنوات على الأقل من الدراسة الطبية وهم في المرحلة السريرية، في كلية مدرجة في الدليل العالمي لكليات الطب ومخوّلة بمنح المؤهل الطبي الأساسي. ولا يُقبل من تخرّج بالفعل. ويُشترط إتقان إنجليزية كافية للتواصل السريري. ولا تطبع الصفحة شرط جنسية ولا شرط إقامة."},
 how:{en:"Email medtcs@squ.edu.om with a nomination letter from the dean, a transcript, a recommendation letter, a CV, a passport copy, a photograph, proof of health insurance, an immunisation form and a status verification form from the home institution. Applications must be submitted at least six months before the intended start date, and electives commence on the first Sunday of each month.", ar:"أرسل إلى medtcs@squ.edu.om رسالة ترشيح من العميد، وكشف درجات، وخطاب توصية، وسيرة ذاتية، ونسخة من جواز السفر، وصورة شخصية، وإثبات تأمين صحي، ونموذج تطعيمات، ونموذج إثبات وضع من المؤسسة الأم. ويجب تقديم الطلب قبل ستة أشهر على الأقل من تاريخ البدء المطلوب، وتبدأ الفترات الاختيارية في أول أحد من كل شهر."},
 url:"https://www.squ.edu.om/medicine/Programs/Undergraduate/Elective-Programme/Elective-Programs/Visiting-Programme", checked:"2026-10-01"},

{id:"royal-hospital-training", ct:"om", sector:"health", level:["hs","uni","grad"], paid:"no", status:"open", gate:"unstated",
 org:{en:"The Royal Hospital", ar:"المستشفى السلطاني"},
 prog:{en:"Short Term Training and Clinical Attachments", ar:"التدريب القصير والإلحاق السريري"},
 apply:{en:"No application window is published. Clinical attachment applications go through Al Barwa or by email to the training and studies department.", ar:"لا يُنشر موعد للتقديم. وتُقدَّم طلبات الإلحاق السريري عبر البروة أو بالبريد الإلكتروني إلى دائرة التدريب والدراسات."},
 duration:{en:"Clinical attachments run up to three months and can be extended.", ar:"يمتد الإلحاق السريري حتى ثلاثة أشهر مع إمكانية التمديد."},
 elig:{en:"The page prints no nationality rule and no residence rule. Doctors who are unaffiliated, unemployed or fully licensed must route through the Ministry of Health Directorate General; government and private doctors in Oman, nurses, students, pharmacists and other allied professionals apply directly. Overseas applicants need a letter from their college or university stating the training is required, and a clear passport copy. International students and local expatriate students are responsible for arranging their own insurance before joining. A training fee of 90 Omani rials a week is printed for private staff, paid into a Ministry of Health account.", ar:"لا تطبع الصفحة شرط جنسية ولا شرط إقامة. والأطباء غير المرتبطين بجهة أو غير العاملين أو المرخصون بالكامل يتقدمون عبر المديرية العامة في وزارة الصحة؛ أما أطباء القطاعين الحكومي والخاص في عُمان والممرضون والطلبة والصيادلة وسائر المهن الطبية المساندة فيتقدمون مباشرة. ويحتاج المتقدمون من الخارج إلى خطاب من كليتهم أو جامعتهم يفيد بأن التدريب مطلوب، ونسخة واضحة من جواز السفر. ويتحمل الطلبة الدوليون والطلبة الوافدون المقيمون مسؤولية ترتيب تأمينهم قبل الالتحاق. وتُطبع رسوم تدريب قدرها ٩٠ ريالًا عُمانيًا أسبوعيًا على موظفي القطاع الخاص، تُدفع في حساب وزارة الصحة."},
 how:{en:"Send an application letter, a CV with a passport photograph, certificates and transcripts, and the completed immunisation declaration form checklist for clinical attachments, through Al Barwa or by email to roy_etdept@yahoo.com. Short term training runs for a maximum of three months and can be extended.", ar:"أرسل خطاب تقديم وسيرة ذاتية بصورة شخصية وشهادات وكشوف درجات ونموذج إقرار التطعيمات المستوفى للتدريب السريري، عبر البروة أو بالبريد إلى roy_etdept@yahoo.com. ويمتد التدريب قصير المدى إلى ثلاثة أشهر كحد أقصى وقابل للتمديد."},
 url:"https://royalhospital.med.om/eng/training.php", checked:"2026-10-01"},

{id:"khimji-mt", ct:"om", sector:"industry", level:["grad"], paid:"unknown", status:"dormant", gate:"nationals",
 org:{en:"Khimji Ramdas", ar:"خيمجي رامداس"},
 prog:{en:"Management Trainee Program", ar:"برنامج المتدربين الإداريين"},
 apply:{en:"Ran for eleven years to 2018. The announcement prints more than 1,300 applications for that cohort. No current round is advertised.", ar:"استمر إحدى عشرة سنة حتى ٢٠١٨. ويطبع الإعلان أكثر من ١٣٠٠ طلب لتلك الدفعة. ولا يُعلن عن دفعة حالية."},
 duration:{en:"Five months, four in Oman and one in Malaysia, leading to placement in the group's divisions.", ar:"خمسة أشهر، أربعة في عُمان وشهر في ماليزيا، وتنتهي بالتوظيف في قطاعات المجموعة."},
 elig:{en:"Omanis. The 2018 cohort took forty two. The announcement prints no degree requirement and no grade point floor.", ar:"العمانيون. وضمت دفعة ٢٠١٨ اثنين وأربعين. ولا يطبع الإعلان شرط شهادة ولا حدًا أدنى للمعدل."},
 how:{en:"Not printed. The announcement names no application route, so ask the group whether the program still runs before you plan around it.", ar:"غير مطبوع. ولا يذكر الإعلان مسار تقديم، فاسأل المجموعة إن كان البرنامج ما يزال قائمًا قبل أن ترتب على أساسه."},
 url:"https://khimji.com/pressrelease/khimji-ramdas-management-trainee-programme-inducts-42-omanis/", checked:"2026-10-02"},

{id:"omanlng-programmes", ct:"om", sector:"energy", level:["uni","grad"], paid:"unknown", status:"annual", gate:"residents",
 org:{en:"Oman LNG", ar:"العمانية للغاز الطبيعي المسال"},
 prog:{en:"Graduate Recruitment, Internships and the Engineering Development Program", ar:"توظيف الخريجين والتدريب وبرنامج تطوير المهندسين"},
 apply:{en:"The company site could not be reached on 2 October 2026, in a browser and by direct fetch, so nothing about these programs could be verified.", ar:"تعذّر الوصول إلى موقع الشركة في ٢ أكتوبر ٢٠٢٦، في المتصفح وبالجلب المباشر، فلم يتسنَّ التحقق من أي شيء عن هذه البرامج."},
 duration:{en:"Internships run about two months. The engineering program rotates across departments.", ar:"التدريب نحو شهرين، وبرنامج المهندسين يتنقل بين الأقسام."},
 elig:{en:"Graduates in technical fields such as engineering, physics and materials, and in law, finance, HR and communications. Interns from any Omani educational institute.", ar:"الخريجون في التخصصات التقنية كالهندسة والفيزياء والمواد، وفي القانون والمالية والموارد البشرية والإعلام. والمتدربون من أي مؤسسة تعليمية عُمانية."},
 how:{en:"Through the careers site or careers@omanlng.co.om. An internship can lead to a permanent place.", ar:"عبر موقع التوظيف أو careers@omanlng.co.om. وقد يقود التدريب إلى وظيفة دائمة."},
 url:"https://omanlng.co.om/en/Careers/Pages/default.aspx", checked:"2026-08-24"},

{id:"sib-tomohi", ct:"om", sector:"finance", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Sohar International", ar:"بنك صحار الدولي"},
 prog:{en:"Tomohi Graduate Program", ar:"برنامج طموحي للخريجين"},
 apply:{en:"The program page prints that applications for the current intake have now closed, and that future opportunities will be announced through the bank's official channels. It prints no window and no date.", ar:"تطبع صفحة البرنامج أن التقديم للدفعة الحالية قد أُغلق، وأن الفرص المقبلة ستُعلن عبر القنوات الرسمية للبنك. ولا تطبع أي فترة تقديم ولا تاريخًا."},
 duration:{en:"One year, as printed on the program page.", ar:"سنة واحدة، كما تطبعه صفحة البرنامج."},
 elig:{en:"Omani nationals who are fresh graduates holding a bachelor degree in accounting, auditing, finance, economics, marketing, human resources, management and business administration, information systems, information technology, supply chain management or a related field, with a minimum grade point average of 2.8 or equivalent.", ar:"المواطنون العُمانيون من الخريجين الجدد حاملي درجة البكالوريوس في المحاسبة أو التدقيق أو المالية أو الاقتصاد أو التسويق أو الموارد البشرية أو الإدارة وإدارة الأعمال أو نظم المعلومات أو تقنية المعلومات أو إدارة سلاسل الإمداد أو تخصص ذي صلة، بمعدل تراكمي لا يقل عن ٢٫٨ أو ما يعادله."},
 how:{en:"Through the Tawteen platform of the Ministry of Labor, as the program page states.", ar:"عبر منصة تواطين التابعة لوزارة العمل، كما تذكر صفحة البرنامج."},
 url:"https://www.sib.om/tomohi-program", checked:"2026-10-02"},

{id:"petrojobs-portal", ct:"om", sector:"energy", level:["uni","grad"], paid:"unknown", status:"dormant", gate:"open",

 prog:{en:"Vacancies and student placements from PDO and other operators", ar:"وظائف وفرص تدريب من تنمية نفط عُمان وشركات القطاع"},

 url:"https://www.petrojobs.om/", checked:"2026-09-01"},

{id:"mtcit-makeen", ct:"om", sector:"tech", level:["grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"Ministry of Transport, Communications and IT", ar:"وزارة النقل والاتصالات وتقنية المعلومات"},
 prog:{en:"Makeen Digital Talent Program", ar:"برنامج مكين للمواهب الرقمية"},
 apply:{en:"Runs in cohorts announced by the ministry. Selection is by assessment and interview, and past cohorts took a small share of a very large applicant pool.", ar:"يُقام على دفعات تعلنها الوزارة، والاختيار باختبار ومقابلة. وقبلت الدفعات السابقة نسبة صغيرة من عدد كبير من المتقدمين."},
 duration:{en:"Sixteen weeks of training then eight weeks of practical placement, in data science and AI, full stack development, or systems and network security.", ar:"ستة عشر أسبوعًا من التدريب ثم ثمانية أسابيع من التطبيق العملي، في علم البيانات والذكاء الاصطناعي أو تطوير البرمجيات أو أمن الأنظمة والشبكات."},
 elig:{en:"Omani job seekers who pass the assessment and interview. The announcement prints a monthly grant of 200 rials and a laptop for each trainee. It does not say the training is free.", ar:"الباحثون عن عمل العمانيون ممن يجتازون التقييم والمقابلة. ويطبع الإعلان منحة شهرية قدرها ٢٠٠ ريال وحاسوبًا محمولًا لكل متدرب. ولا يذكر أن التدريب مجاني."},
 how:{en:"The announcement prints no application route. Watch the ministry's own site and channels for the next cohort call, which is where previous ones were announced.", ar:"لا يطبع الإعلان مسار تقديم. تابع موقع الوزارة وقنواتها لإعلان الدفعة القادمة، فمن هناك أُعلنت الدفعات السابقة."},
 url:"https://mtcit.gov.om/media-4/news-announcements-11/news-85/mtcit-launches-2nd-edition-of-makeen-137", checked:"2026-10-02"},

{id:"oia-nomou", ct:"om", sector:"gov", level:["grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Oman Investment Authority", ar:"جهاز الاستثمار العُماني"},
 prog:{en:"Nomou Graduate Training Program", ar:"برنامج نمو لتدريب الخريجين"},

 elig:{en:"Recent bachelor's or master's graduates in finance, accounting, HR, legal, information systems and business, with a GPA of 3.0 or above.", ar:"الخريجون الجدد من حملة البكالوريوس أو الماجستير في المالية والمحاسبة والموارد البشرية والقانون ونظم المعلومات والإدارة، بمعدل ٣٫٠ فأعلى."},
 how:{en:"Apply on the career page when an intake opens.", ar:"قدّم عبر صفحة التوظيف عند فتح الدفعة."},
 url:"https://oia.gov.om/Index.php?r=en/site/pages&slug=career", checked:"2026-10-02"},

 org:{en:"Port of Duqm", ar:"ميناء الدقم"},
 prog:{en:"Internship Program", ar:"برنامج التدريب"},
 apply:{en:"No application window is published. Enquiries are made by email.", ar:"لا يُنشر موعد للتقديم. وتُقدَّم الاستفسارات بالبريد الإلكتروني."},
 duration:{en:"Not published.", ar:"غير منشورة."},

 url:"https://jobs.adnoc.ae/us/en/Internship-program", checked:"2026-10-03"},

 apply:{en:"The printed deadline of 3 April 2026 has passed and the page still shows the 2026 cycle with a live apply control and no closed notice, read on 2 October 2026. Treat it as between cycles.", ar:"مضى الموعد المطبوع في ٣ أبريل ٢٠٢٦ وما تزال الصفحة تعرض دورة ٢٠٢٦ بزر تقديم فعّال دون إشعار إغلاق، وقد قُرئت في ٢ أكتوبر ٢٠٢٦. فاعتبرها بين دورتين."},
 duration:{en:"Six to eight weeks.", ar:"من ستة إلى ثمانية أسابيع."},
 elig:{en:"Undergraduates holding a UAE visa, and the page names Emiratis and expatriates side by side, studying a STEM subject such as data science, computer science or mathematics.", ar:"طلبة البكالوريوس من حاملي التأشيرة الإماراتية، وتذكر الصفحة الإماراتيين والمقيمين جنبًا إلى جنب، الدارسين في تخصص علمي كعلم البيانات أو علوم الحاسب أو الرياضيات."},
 how:{en:"Apply through the page with a CV showing your graduation date, a recent photo, a passport copy, an Emirates ID copy and a motivation letter of at most one page. The page marks academic transcripts as preferred rather than required.", ar:"قدّم عبر الصفحة بسيرة ذاتية تبيّن تاريخ تخرجك، وصورة حديثة، ونسخة من جواز السفر، ونسخة من الهوية الإماراتية، وخطاب دوافع في صفحة واحدة على الأكثر. وتصف الصفحة كشوف الدرجات بأنها مفضلة لا مطلوبة."},
 url:"https://www.adialab.ae/internships", checked:"2026-10-02"},

{id:"dib-emirati-programme", ct:"ae", sector:"finance", level:["hs","uni","grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"Dubai Islamic Bank", ar:"بنك دبي الإسلامي"},
 prog:{en:"Emirati Programs, including Iktaseb summer training", ar:"البرامج الإماراتية، ومنها التدريب الصيفي اكتساب"},
 apply:{en:"Iktaseb summer training starts at the end of the UAE academic year and runs up to two months. No application deadline is published.", ar:"يبدأ تدريب اكتساب الصيفي مع نهاية العام الدراسي في الإمارات ويمتد حتى شهرين. ولا يُنشر موعد نهائي للتقديم."},
 duration:{en:"The Iktaseb track begins at the end of the UAE academic year and can take up to two months to complete. The page prints no length for the graduate track.", ar:"يبدأ مسار اكتسب في نهاية العام الدراسي في الإمارات وقد يستغرق شهرين حتى الإتمام. ولا تطبع الصفحة مدة للمسار الخاص بالخريجين."},
 elig:{en:"Emiratis, from school level through to graduates, holding a passport valid for six months or more.", ar:"الإماراتيون، من مستوى المدرسة إلى الخريجين، بجواز سفر صالح لستة أشهر فأكثر."},
 how:{en:"The page sends applicants for the graduate program to the bank's careers site at careers.dib.ae, and links a general career portal at jobs.dib.ae.", ar:"توجّه الصفحة المتقدمين لبرنامج الخريجين إلى موقع التوظيف في البنك على careers.dib.ae، وتضع رابطًا لبوابة الوظائف العامة على jobs.dib.ae."},
 url:"https://www.dib.ae/work-with-us/emiratisation", checked:"2026-09-28"},

{id:"mubadala-maseeraty", ct:"ae", sector:"finance", level:["uni","grad"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Mubadala", ar:"مبادلة"},
 prog:{en:"Maseeraty and the Global Internship", ar:"مسيرتي والتدريب الدولي"},
 apply:{en:"The student page prints no window and no dates. The only call to action on it is to join the talent community.", ar:"لا تذكر صفحة الطلبة فترة تقديم ولا تواريخ. والدعوة الوحيدة فيها هي الانضمام إلى مجتمع المواهب."},
 duration:{en:"Maseeraty runs two years with rotations and support for professional qualifications. The global internship includes placements abroad of about five months.", ar:"يمتد مسيرتي سنتين بالتناوب بين الوحدات مع دعم للشهادات المهنية. ويشمل التدريب الدولي فترات في الخارج نحو خمسة أشهر."},
 elig:{en:"The linked student page prints no nationality rule, no duration and no eligibility rule. Other company pages describe the program as being for Emiratis, so ask before you invest time in it.", ar:"لا تذكر صفحة الطلبة المرتبطة شرط جنسية ولا مدة ولا شرط أهلية. وتصف صفحات أخرى لدى الشركة البرنامج بأنه للإماراتيين، فاسأل قبل أن تستثمر فيه وقتك."},
 how:{en:"Through the careers portal. The page prints a six stage process: a recruiter pre screen call, aptitude tests, interviews with the manager and team, a business case or presentation, final interviews with executive directors, then background verification.", ar:"عبر بوابة التوظيف. وتذكر الصفحة ست مراحل: مكالمة فرز مع المختص، واختبارات قدرات، ومقابلات مع المدير وفريق العمل، وحالة عملية أو عرض تقديمي، ومقابلات نهائية مع المديرين التنفيذيين، ثم التحقق من الخلفية."},
 url:"https://www.mubadala.com/en/careers/student", checked:"2026-10-03"},

{id:"mubadala-local-internship", ct:"ae", sector:"finance", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"Mubadala", ar:"مبادلة"},
 prog:{en:"Local Internship", ar:"التدريب المحلي"},
 apply:{en:"Not published. On 13 September 2026 the student page described only Maseeraty, and the local internship appeared solely as a filter on the job portal.", ar:"غير منشور. في ١٣ سبتمبر ٢٠٢٦ لم تصف صفحة الطلبة سوى مسيرتي، وظهر التدريب المحلي في مرشّح بوابة الوظائف فقط."},
 duration:{en:"Not published.", ar:"غير منشورة."},
 elig:{en:"This is the one Mubadala student track that no company page describes as Emirati only. That is not the same as being told you are eligible, so ask before you invest time in it.", ar:"هذا المسار الطلابي الوحيد لدى مبادلة الذي لا تصفه أي صفحة بأنه للإماراتيين وحدهم. وهذا ليس كأن يُقال لك إنك مؤهل، فاسأل قبل أن تستثمر فيه وقتك."},
 how:{en:"Through the careers portal.", ar:"عبر بوابة التوظيف."},
 url:"https://www.mubadala.com/en/careers/student", checked:"2026-10-01"},

{id:"flydubai-masar", ct:"ae", sector:"aviation", level:["uni"], paid:"no", status:"open", gate:"residents",
 org:{en:"flydubai", ar:"فلاي دبي"},
 prog:{en:"Masar Internship Program", ar:"برنامج مسار للتدريب"},
 apply:{en:"No application window is published. You can join the talent community to be told when a role opens.", ar:"لا يُنشر موعد للتقديم. ويمكنك الانضمام إلى مجتمع المواهب ليصلك إشعار عند فتح أي دور."},
 duration:{en:"Eight to twelve weeks at least, depending on the department. The airline states the internship is unpaid.", ar:"من ثمانية إلى اثني عشر أسبوعًا على الأقل بحسب الإدارة. وتذكر الشركة أن التدريب بلا أجر."},
 elig:{en:"Applicants must be 18 or older, currently enrolled at a university or educational institution based in the UAE, and fluent in written and spoken English. UAE nationals need a valid family book, and non nationals need a valid UAE residence visa and a no objection certificate from the sponsor. The page prints that the applicant must be open to an unpaid internship.", ar:"يجب أن يكون المتقدم في الثامنة عشرة فأكثر، ومقيدًا حاليًا في جامعة أو مؤسسة تعليمية في الإمارات، ومتقنًا للإنجليزية كتابة وحديثًا. ويحتاج المواطنون إلى خلاصة قيد سارية، ويحتاج غير المواطنين إلى إقامة إماراتية سارية وشهادة عدم ممانعة من الكفيل. وتطبع الصفحة أن على المتقدم أن يقبل تدريبًا بلا أجر."},
 how:{en:"An Apply now control on the page leads to the jobs page. The page prints no written instructions beyond that.", ar:"زر التقديم في الصفحة يقود إلى صفحة الوظائف. ولا تطبع الصفحة تعليمات مكتوبة غير ذلك."},
 url:"https://careers.flydubai.com/masarinternship", checked:"2026-09-28"},

{id:"efta-cadet", ct:"ae", sector:"aviation", level:["hs","uni"], paid:"no", status:"open", gate:"residents",
 org:{en:"Emirates Flight Training Academy", ar:"أكاديمية الإمارات لتدريب الطيران"},
 prog:{en:"Cadet Pilot Program, self sponsored", ar:"برنامج الطيار المتدرب، على النفقة الخاصة"},
 apply:{en:"The academy takes new cadets every other month, so you start at the next available date. An offer stays valid for twelve months.", ar:"تستقبل الأكاديمية دفعة جديدة كل شهرين، فتبدأ في أقرب موعد متاح. ويبقى العرض ساريًا اثني عشر شهرًا."},
 duration:{en:"About one hundred and four weeks. This is a fee paying route, priced at two hundred and twenty thousand five hundred dollars including value added tax.", ar:"نحو مئة وأربعة أسابيع. وهو مسار مدفوع بقيمة مئتين وعشرين ألفًا وخمسمئة دولار شاملة ضريبة القيمة المضافة."},
 elig:{en:"Two routes are printed. School leavers aged 18 to 21 need a minimum high school score of 80 per cent and must have studied mathematics and physics in their last year of education, plus English for non native speakers. Degree holders aged 21 to 26 need a minimum GPA of 3.0 in a scientific or engineering major, and the page prints that a non national must be eligible for a UAE student visa. Both routes require a height of at least 160cm, a BMI of 29 or less, a GCAA Class 1 medical certificate, and IELTS 6.0 or TOEFL iBT 65 at the time of application.", ar:"تُطبع طريقتان. خريجو الثانوية بين ١٨ و٢١ عامًا يحتاجون إلى نسبة لا تقل عن ٨٠ بالمئة في الثانوية ودراسة الرياضيات والفيزياء في سنتهم الأخيرة، إضافة إلى الإنجليزية لغير الناطقين بها. وحملة الدرجات الجامعية بين ٢١ و٢٦ عامًا يحتاجون إلى معدل لا يقل عن ٣٫٠ في تخصص علمي أو هندسي، وتطبع الصفحة أن غير المواطن يجب أن يكون مؤهلًا لتأشيرة دراسة في الإمارات. وتشترط الطريقتان طولًا لا يقل عن ١٦٠ سم، ومؤشر كتلة جسم ٢٩ أو أقل، وشهادة طبية من الفئة الأولى، وآيلتس ٦٫٠ أو توفل ٦٥ وقت التقديم."},
 how:{en:"Online application, then a recorded video interview, a psychometric assessment and an interview, then a three day assessment in Dubai. Assessment fees are payable before any offer: 1,000 dirhams online, 500 on day one and 4,200 on days two and three.", ar:"تقديم إلكتروني، ثم مقابلة مصورة واختبار قياس نفسي ومقابلة، ثم تقييم حضوري في دبي على ثلاثة أيام. وتُدفع رسوم التقييم قبل أي عرض: ألف درهم إلكترونيًا، وخمسمئة في اليوم الأول، وأربعة آلاف ومئتان في اليومين الثاني والثالث."},
 url:"https://www.emiratesflighttrainingacademy.com/en/admissions/", checked:"2026-09-28"},

{id:"emirates-national-grad", ct:"ae", sector:"aviation", level:["grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"The Emirates Group", ar:"مجموعة الإمارات"},
 prog:{en:"National Graduate Training Program", ar:"برنامج تدريب الخريجين المواطنين"},
 apply:{en:"Not published. Vacancies appear on the group's careers site.", ar:"غير منشورة. تظهر الشواغر في موقع التوظيف لدى المجموعة."},
 duration:{en:"Twelve months. A sister scheme, the graduate outstation program, runs eighteen to twenty four months, takes applicants aged twenty one to twenty seven rather than twenty to thirty, and states a competitive salary with medical cover and travel concessions.", ar:"اثنا عشر شهرًا. وبرنامج شقيق، وهو برنامج الخريجين في المحطات الخارجية، يمتد من ثمانية عشر إلى أربعة وعشرين شهرًا، ويقبل من هم بين الحادية والعشرين والسابعة والعشرين لا بين العشرين والثلاثين، ويذكر راتبًا تنافسيًا مع تغطية طبية وامتيازات سفر."},
 elig:{en:"A valid UAE passport and family book, aged twenty to thirty, with a bachelor's degree or higher diploma.", ar:"جواز سفر إماراتي ساري وخلاصة قيد، بين العشرين والثلاثين، بشهادة بكالوريوس أو دبلوم عالٍ."},
 how:{en:"Apply to vacancies, then an assessment center, a psychometric test and an interview.", ar:"قدّم على الشواغر، ثم مركز تقييم واختبار قياس نفسي ومقابلة."},
 url:"https://www.emiratesgroupcareers.com/uae-nationals/university-graduates/", checked:"2026-10-02"},

{id:"emirates-school-leaver", ct:"ae", sector:"aviation", level:["hs"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"The Emirates Group", ar:"مجموعة الإمارات"},
 prog:{en:"School Leaver Programs: cadet pilot, engineer license, aviation management, technologists", ar:"برامج خريجي الثانوية: الطيار المتدرب ورخصة الصيانة وإدارة الطيران والفنيين"},

 elig:{en:"Emiratis with a grade twelve certificate. Ages run from seventeen to twenty six depending on the route, and the aviation management and technologist routes ask for eighty five per cent and IELTS 6.0.", ar:"الإماراتيون من حملة شهادة الصف الثاني عشر. وتتراوح الأعمار بين السابعة عشرة والسادسة والعشرين بحسب المسار، ويشترط مسارا إدارة الطيران والفنيين ٨٥ بالمئة ودرجة آيلتس ٦٫٠."},
 how:{en:"Apply to the vacancies on the group's careers site.", ar:"قدّم على الشواغر في موقع التوظيف لدى المجموعة."},
 url:"https://www.emiratesgroupcareers.com/uae-nationals/high-school-graduates/", checked:"2026-10-02"},

{id:"etihad-national-programmes", ct:"ae", sector:"aviation", level:["hs","uni","grad"], paid:"unknown", status:"annual", gate:"nationals",
 org:{en:"Etihad Airways", ar:"الاتحاد للطيران"},
 prog:{en:"UAE National Programs, including Bedayati and the cadet routes", ar:"برامج المواطنين، ومنها بدايتي ومسارات المتدربين"},
 apply:{en:"The airline's page for UAE nationals was read on 2 October 2026. It lists the program names and prints no dates, no durations and no eligibility rules, so none of those could be verified.", ar:"قُرئت صفحة شركة الطيران الخاصة بمواطني الإمارات في ٢ أكتوبر ٢٠٢٦. وهي تدرج أسماء البرامج ولا تطبع أي تواريخ ولا مدد ولا شروط تقديم، فلم يتسنَّ التحقق من أي منها."},
 duration:{en:"Not published on the page read.", ar:"غير منشورة في الصفحة المقروءة."},
 elig:{en:"UAE nationals, per the page's own heading. It prints no rule for any individual program.", ar:"مواطنو الإمارات، بحسب عنوان الصفحة نفسها. ولا تطبع أي شرط لأي برنامج بعينه."},
 how:{en:"Through the UAE nationals careers hub, or register for the career fair.", ar:"عبر منصة توظيف المواطنين، أو سجّل في معرض الوظائف."},
 url:"https://careers.etihad.com/teams/uae-nationals", checked:"2026-10-02"},

{id:"dpworld-forsa", ct:"ae", sector:"industry", level:["uni"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"DP World", ar:"موانئ دبي العالمية"},
 prog:{en:"Forsa Internship Program", ar:"برنامج فرصة للتدريب"},
 apply:{en:"No application window is published, and no form or email appears on the page, so you will need to reach the company another way.", ar:"لا يُنشر موعد للتقديم، ولا يظهر في الصفحة نموذج ولا بريد، فستحتاج إلى الوصول إلى الشركة بطريقة أخرى."},
 duration:{en:"Set by the letter from your university.", ar:"تُحدد برسالة جامعتك."},
 elig:{en:"A minimum GPA of 2.5, proficiency in English, and a university letter specifying the requested internship period. A family book is listed for UAE nationals as a conditional document. The page prints no nationality rule.", ar:"معدل تراكمي لا يقل عن ٢٫٥، وإتقان الإنجليزية، وخطاب من الجامعة يحدد فترة التدريب المطلوبة. ويُذكر خلاصة القيد كمستند مشروط لمواطني الإمارات. ولا تطبع الصفحة أي شرط جنسية."},
 how:{en:"No route is published. Ask through the careers pages.", ar:"لا تُنشر آلية. اسأل عبر صفحات التوظيف."},
 url:"https://www.dpworld.com/en/careers/uae/emiratisation/students/forsa-internship-programme", checked:"2026-09-28"},
