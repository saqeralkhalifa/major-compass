{id:"adports-voyage", ct:"ae", sector:"industry", level:["grad"], paid:"unknown", status:"open", gate:"nationals",
 org:{en:"AD Ports Group", ar:"مجموعة موانئ أبوظبي"},
 prog:{en:"Voyage of Discovery", ar:"رحلة الاكتشاف"},
 apply:{en:"Open now. The page carries an application form with an Apply Now control and a brochure to download, and prints no closing date.", ar:"مفتوح الآن. تحمل الصفحة نموذج تقديم مع زر للتقديم وكتيبًا للتحميل، ولا تطبع تاريخ إغلاق."},
 duration:{en:"Not published. The page prints no length for the program.", ar:"غير منشورة. لا تطبع الصفحة مدة للبرنامج."},
 elig:{en:"Emirati university graduates aged 21 to 26 with a minimum GPA of 3.0. The description prints no English test requirement, though the application form on the page asks whether you hold an IELTS score and for the overall band.", ar:"خريجو الجامعات من الإماراتيين بين ٢١ و٢٦ عامًا بمعدل تراكمي لا يقل عن ٣٫٠. ولا يطبع الوصف أي اشتراط لاختبار لغة إنجليزية، غير أن نموذج التقديم في الصفحة يسأل عن وجود درجة آيلتس وعن الدرجة الكلية."},
 how:{en:"Apply on the group's careers page.", ar:"قدّم عبر صفحة التوظيف لدى المجموعة."},
 url:"https://www.adportsgroup.com/en/careers", checked:"2026-09-28"},

{id:"rta-student-training", ct:"ae", sector:"gov", level:["uni"], paid:"unknown", status:"open", gate:"residents",
 org:{en:"Roads and Transport Authority, Dubai", ar:"هيئة الطرق والمواصلات بدبي"},
 prog:{en:"Student Internship and Training", ar:"التدريب الطلابي"},
 apply:{en:"A standing request form on which you propose your own start and end dates.", ar:"نموذج طلب متاح دائمًا تقترح فيه تاريخي البدء والانتهاء بنفسك."},
 duration:{en:"Whatever your academic program requires. Interns work eight hours a day, from eight in the morning to three.", ar:"بحسب ما يتطلبه برنامجك الدراسي. ويعمل المتدربون ثماني ساعات يوميًا من الثامنة صباحًا إلى الثالثة."},
 elig:{en:"Students enrolled at recognized universities or colleges in the UAE who need a placement for their degree. No nationality bar is published, but the Emirates ID and university letter make study here necessary in practice.", ar:"الطلبة الملتحقون بجامعات أو كليات معترف بها في الإمارات ممن يشترط تخرجهم تدريبًا. ولا يُنشر منع بحسب الجنسية، لكن الهوية الإماراتية ورسالة الجامعة تجعلان الدراسة هنا لازمة عمليًا."},
 how:{en:"Three steps are printed: select the program type, enter personal details, then submit academic details and documents. The documents printed are an official letter from the university or college, a transcript, a photograph, a CV, a passport copy, both sides of an Emirates ID and a family book. The Ajyal program is printed with a shorter list: an official letter, a photograph, a CV, a passport copy and an Emirates ID.", ar:"تُطبع ثلاث خطوات: اختيار نوع البرنامج، ثم إدخال البيانات الشخصية، ثم تقديم التفاصيل الأكاديمية والمستندات. والمستندات المطبوعة هي خطاب رسمي من الجامعة أو الكلية، وكشف درجات، وصورة شخصية، وسيرة ذاتية، ونسخة جواز سفر، ووجها الهوية الإماراتية، وخلاصة القيد. ويُطبع برنامج أجيال بقائمة أقصر: خطاب رسمي، وصورة شخصية، وسيرة ذاتية، ونسخة جواز سفر، وهوية إماراتية."},
 url:"https://www.rta.ae/wps/portal/rta/ae/home/careers/student-training-request", checked:"2026-09-28"},

{id:"rta-ajyal", ct:"ae", sector:"gov", level:["hs","uni"], paid:"yes", status:"open", gate:"residents",
 org:{en:"Roads and Transport Authority, Dubai", ar:"هيئة الطرق والمواصلات بدبي"},
 prog:{en:"Ajyal Summer Internship Program", ar:"برنامج أجيال للتدريب الصيفي"},
 apply:{en:"The authority's training form was read on 2 October 2026. It is live, this program is selectable on it, and it prints no window and no closed marker. The applicant enters the start and end dates.", ar:"قُرئ نموذج التدريب لدى الهيئة في ٢ أكتوبر ٢٠٢٦. وهو فعّال، وهذا البرنامج قابل للاختيار فيه، ولا يطبع أي فترة تقديم ولا إشارة إلى الإغلاق. ويدخل المتقدم تاريخي البداية والنهاية."},
 duration:{en:"Not published. The applicant sets the start and end dates on the form.", ar:"غير منشورة. ويحدد المتقدم تاريخي البداية والنهاية في النموذج."},
 elig:{en:"The form asks for an official letter from the university or college, a photo, a CV, a passport copy and an Emirates ID. It prints no nationality rule and no grade point floor.", ar:"يطلب النموذج خطابًا رسميًا من الجامعة أو الكلية، وصورة شخصية، وسيرة ذاتية، ونسخة من جواز السفر، والهوية الإماراتية. ولا يطبع أي شرط جنسية ولا أي حد أدنى للمعدل."},
 how:{en:"Through the three step form on the authority's training page.", ar:"عبر النموذج ذي الخطوات الثلاث في صفحة التدريب لدى الهيئة."},
 url:"https://www.rta.ae/wps/portal/rta/ae/home/careers/student-training-request", checked:"2026-10-02"},

{id:"dct-abudhabi-internship", ct:"ae", sector:"hospitality", level:["uni","grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Department of Culture and Tourism, Abu Dhabi", ar:"دائرة الثقافة والسياحة، أبوظبي"},

{id:"rotana-internship", ct:"ae", sector:"hospitality", level:["uni","grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Rotana", ar:"روتانا"},
 prog:{en:"Internship and Work Placement", ar:"التدريب والتوظيف التدريبي"},

 elig:{en:"Undergraduates and graduates across hotel departments. One posting asked for study at a hotel management school and fluent English, while the program page itself prints no criteria. No nationality rule is published.", ar:"طلبة البكالوريوس والخريجون في أقسام الفنادق. وقد طلب أحد الإعلانات الدراسة في مدرسة لإدارة الفنادق مع إجادة الإنجليزية، بينما لا تذكر صفحة البرنامج نفسها أي شروط. ولا يُنشر شرط جنسية."},
 how:{en:"Search the careers site filtered to internship.", ar:"ابحث في موقع التوظيف مع تحديد فئة التدريب."},

{id:"rotana-tarot", ct:"ae", sector:"hospitality", level:["grad"], paid:"unknown", status:"open", gate:"unstated",
 org:{en:"Rotana", ar:"روتانا"},
 prog:{en:"TAROT Graduate Program", ar:"برنامج تاروت للخريجين"},
 apply:{en:"No application window is published. Applications go through the careers site, and the program itself runs twelve months.", ar:"لا يُنشر موعد للتقديم. ويمر التقديم عبر موقع التوظيف، ومدة البرنامج نفسه اثنا عشر شهرًا."},
 duration:{en:"Twelve months: four developmental quarters, followed by property rotations and special projects.", ar:"اثنا عشر شهرًا: أربعة أرباع تطويرية، تليها تدويرات في الفنادق ومشاريع خاصة."},
 elig:{en:"A diploma, bachelor's or master's with at least three years of continuous study and a year of practical experience, strong English, ideally aged twenty three to twenty eight, and willing to relocate. No nationality rule is published, and the company runs a separate nationals track alongside it.", ar:"دبلوم أو بكالوريوس أو ماجستير بثلاث سنوات دراسة متصلة على الأقل وسنة خبرة عملية، مع إنجليزية قوية، ويفضل بين الثالثة والعشرين والثامنة والعشرين، مع الاستعداد للانتقال. ولا يُنشر شرط جنسية، وللشركة مسار منفصل للمواطنين إلى جانبه."},
 how:{en:"Apply through the job search results filtered for trainee positions, or email recruitment@rotana.com.", ar:"قدّم عبر نتائج البحث عن الوظائف مع تصفيتها على وظائف المتدربين، أو أرسل إلى recruitment@rotana.com."},
 url:"https://www.rotanacareers.com/en/rotana-pages/?page_id=tarot", checked:"2026-09-28"},

{id:"rotana-duroob", ct:"ae", sector:"hospitality", level:["grad"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Rotana", ar:"روتانا"},
 prog:{en:"TAROT Duroob", ar:"برنامج تاروت دروب"},
 apply:{en:"The page the group designates for this program prints no content about it, and the only postings that carry its name were published in 2017 and are marked closed or expired. The group appears to have stopped publishing it.", ar:"الصفحة التي تخصصها المجموعة لهذا البرنامج لا تطبع عنه شيئًا، والإعلانات الوحيدة التي تحمل اسمه نُشرت في ٢٠١٧ وهي موسومة بأنها مغلقة أو منتهية. ويبدو أن المجموعة توقفت عن نشره."},
 duration:{en:"Eighteen months, per those 2017 postings.", ar:"ثمانية عشر شهرًا، بحسب إعلانات ٢٠١٧ تلك."},
 elig:{en:"Those 2017 postings described GCC nationals based in their country of origin holding a higher education degree, and each posting was limited to one nationality. That is what they printed then, not a current rule.", ar:"وصفت إعلانات ٢٠١٧ تلك مواطني دول المجلس المقيمين في بلدانهم من حملة شهادة التعليم العالي، وكان كل إعلان مقصورًا على جنسية واحدة. وذلك ما طبعته آنذاك لا شرطًا حاليًا."},
 how:{en:"Through the careers search for GCC nationals on that page.", ar:"عبر البحث عن وظائف مواطني دول المجلس في تلك الصفحة."},
 url:"https://www.rotanacareers.com/en/rotana-pages/?page_id=duroob", checked:"2026-10-02"},

{id:"atlantis-imtiyaz", ct:"ae", sector:"hospitality", level:["uni","grad"], paid:"unknown", status:"open", gate:"nationals",

 prog:{en:"Imtiyaz, empowering Emiratis to become future leaders", ar:"امتياز لتمكين الإماراتيين ليكونوا قادة المستقبل"},

{id:"miral-summer-squad", ct:"ae", sector:"hospitality", level:["hs"], paid:"unknown", status:"dormant", gate:"unstated",
 org:{en:"Miral", ar:"ميرال"},
 prog:{en:"Summer Squad Work Experience", ar:"برنامج فريق الصيف للخبرة العملية"},
 apply:{en:"The company's careers page no longer names this program. The only page that describes it is the report on the 2024 edition. The program the careers page prints instead is Maharaty, a two year training program for Emirati nationals.", ar:"لم تعد صفحة التوظيف لدى الشركة تذكر هذا البرنامج. والصفحة الوحيدة التي تصفه هي التقرير عن نسخة ٢٠٢٤. والبرنامج الذي تطبعه صفحة التوظيف بدلًا منه هو مهاراتي، وهو برنامج تدريبي لمدة سنتين لمواطني الإمارات."},

 elig:{en:"That report describes participants aged sixteen to eighteen and a cohort drawn from more than twenty nationalities, which is who took part rather than a rule about who may apply.", ar:"يصف ذلك التقرير مشاركين بعمر ستة عشر إلى ثمانية عشر عامًا ودفعة من أكثر من عشرين جنسية، وهؤلاء من شاركوا لا شرط عمن يحق له التقديم."},
 how:{en:"No route of its own. The careers page carries one CV upload form, used for Maharaty and for its open positions.", ar:"لا مسار خاص به. وتحمل صفحة التوظيف نموذج تحميل سيرة ذاتية واحدًا يُستخدم لمهاراتي وللوظائف المتاحة لديها."},

{id:"miral-maharaty", ct:"ae", sector:"hospitality", level:["grad"], paid:"unknown", status:"open", gate:"nationals",

{id:"moet-hospitality-camp", ct:"ae", sector:"hospitality", level:["hs","uni"], paid:"unknown", status:"dormant", gate:"residents",
 org:{en:"Ministry of Economy and Tourism", ar:"وزارة الاقتصاد والسياحة"},
 prog:{en:"UAE Hospitality Summer Camp", ar:"معسكر الضيافة الصيفي"},
 apply:{en:"The page read on 2 October 2026 documents the 2025 edition, whose registration closed on 30 June, and prints no later edition.", ar:"توثق الصفحة المقروءة في ٢ أكتوبر ٢٠٢٦ نسخة ٢٠٢٥ التي أُغلق تسجيلها في ٣٠ يونيو، ولا تطبع نسخة لاحقة."},
 duration:{en:"Two to four weeks.", ar:"من أسبوعين إلى أربعة أسابيع."},
 elig:{en:"Open to UAE nationals and UAE based students aged fifteen to twenty two. The tracks the camp covers are hotel operations, culinary arts, food and beverage service, front office, housekeeping and guest services, and tourism and events, which is what is taught rather than what you must have studied.", ar:"مفتوح لمواطني الإمارات وللطلبة المقيمين في الإمارات بعمر خمسة عشر إلى اثنين وعشرين عامًا. والمسارات التي يغطيها المعسكر هي عمليات الفنادق وفنون الطهي وخدمة الأغذية والمشروبات ومكتب الاستقبال والإشراف الداخلي وخدمات الضيوف والسياحة والفعاليات، وهي ما يُدرَّس لا ما يلزم أن تكون قد درسته."},
 how:{en:"An online form asking about your academic background and your motivation.", ar:"نموذج إلكتروني يسأل عن خلفيتك الدراسية ودوافعك."},
 url:"https://www.moet.gov.ae/en/uae-hospitality-summer-camp-2025", checked:"2026-10-02"},

{id:"pwc-watani", ct:"ae", sector:"consulting", level:["uni","grad"], paid:"yes", status:"annual", gate:"nationals",
 org:{en:"PwC Middle East", ar:"بي دبليو سي الشرق الأوسط"},
 prog:{en:"Watani, internship and graduate routes", ar:"برنامج وطني، مساري التدريب والخريجين"},
 apply:{en:"No window is published. The page prints no application period, no intake month and no deadline, and the firm's graduate route runs from its UAE nationals careers page rather than from a dated round. An earlier version of this card said the process takes about three months end to end; that sentence could not be found on the page on 3 October 2026 and has been removed rather than left standing unsourced.", ar:"لا تُنشر فترة تقديم. لا تذكر الصفحة فترة تقديم ولا شهر دفعة ولا موعدًا نهائيًا، ومسار الخريجين في الشركة يمر من صفحة التوظيف الخاصة بمواطني الإمارات لا من جولة محددة بتاريخ. وكانت نسخة سابقة من هذه البطاقة تذكر أن العملية تستغرق نحو ثلاثة أشهر من أولها إلى آخرها، ولم يُعثر على هذه العبارة في الصفحة في ٣ أكتوبر ٢٠٢٦ فحُذفت بدلًا من تركها دون مصدر."},
 duration:{en:"The graduate route runs three years. The internship length is not published.", ar:"مسار الخريجين ثلاث سنوات، ولا تُنشر مدة التدريب."},
 elig:{en:"The firm says Watani is open to all UAE nationals holding a UAE passport and family book. The internship is for penultimate year students and the graduate route for those who finished within the past eighteen months. Excellent English and Arabic are required.", ar:"تذكر الشركة أن وطني مفتوح لكل المواطنين الإماراتيين من حملة جواز السفر وخلاصة القيد. والتدريب لطلبة السنة قبل الأخيرة، ومسار الخريجين لمن تخرج خلال الثمانية عشر شهرًا الماضية. وتُشترط إجادة ممتازة للإنجليزية والعربية."},
 how:{en:"Through the student careers portal, or write to mer_watani@pwc.com.", ar:"عبر بوابة توظيف الطلبة، أو راسل mer_watani@pwc.com."},
 url:"https://www.pwc.com/m1/en/careers/uae-nationals-careers.html", checked:"2026-10-03"},

{id:"pwc-coop-summer-ae", ct:"ae", sector:"consulting", level:["uni"], paid:"unknown", status:"annual", gate:"unstated",
 org:{en:"PwC Middle East", ar:"بي دبليو سي الشرق الأوسط"},
 prog:{en:"COOP and Summer Internship Program", ar:"برنامج التدريب التعاوني والصيفي"},

 apply:{en:"Not open. A UAE 2026 round was posted and is no longer accepting applications; the only record of its closing is a mirror of the posting on a third party job board, not SAP's own portal, so treat that detail as unconfirmed. No Young Professionals posting for the UAE or any other country was on SAP's careers portal on 3 October 2026. The program page says roles are posted regularly by country, so the portal is the thing to watch.", ar:"غير مفتوح. نُشرت جولة للإمارات لعام ٢٠٢٦ ولم تعد تستقبل الطلبات، والدليل الوحيد على إغلاقها نسخة من الإعلان على لوحة وظائف من جهة أخرى لا على بوابة ساب نفسها، فهذه التفصيلة غير مؤكدة. ولم تكن هناك أي فرصة في برنامج المهنيين الشباب للإمارات ولا لأي دولة أخرى على بوابة ساب في ٣ أكتوبر ٢٠٢٦. وتذكر صفحة البرنامج أن الفرص تُنشر بانتظام بحسب الدولة، فالبوابة هي ما يُترقب."},
 duration:{en:"Two months full time, delivered online in a live virtual classroom from nine to six, Monday to Friday. The training is fully sponsored but it is not a salaried job.", ar:"شهران بدوام كامل، يُقدَّم إلكترونيًا في صف افتراضي مباشر من التاسعة إلى السادسة من الاثنين إلى الجمعة. والتدريب ممول بالكامل لكنه ليس وظيفة براتب."},
 elig:{en:"A bachelor's degree, graduated within the last three years, currently unemployed or underemployed, and living in a country where the program is active. That last condition is a residence rule rather than a nationality rule, and it is the one that matters here: it means a reader living in Bahrain qualifies for a Bahrain round and not for a UAE one. The page says the program runs in more than 48 countries without listing them, so whether Bahrain is among them cannot be confirmed from the page.", ar:"درجة بكالوريوس، والتخرج خلال السنوات الثلاث الأخيرة، وأن يكون المتقدم متعطلًا أو يعمل دون مستوى مؤهله، وأن يسكن في دولة يعمل فيها البرنامج. والشرط الأخير شرط إقامة لا شرط جنسية، وهو الشرط المهم هنا: فالقارئ الساكن في البحرين تنطبق عليه جولة البحرين لا جولة الإمارات. وتذكر الصفحة أن البرنامج يعمل في أكثر من ٤٨ دولة دون أن تسميها، فلا يمكن التأكد من الصفحة ما إذا كانت البحرين بينها."},

{id:"mbzuai-ugrip", ct:"ae", sector:"education", level:["uni"], paid:"yes", status:"annual", gate:"open",

 apply:{en:"The page now prints the next cycle: applications open 1 January 2027 at 8 in the morning Gulf time and close 28 February 2027 at 5 in the afternoon, for a program running Monday 7 June to Friday 2 July 2027. Put a reminder in December.", ar:"تطبع الصفحة الآن الدورة القادمة: يُفتح التقديم في ١ يناير ٢٠٢٧ الساعة الثامنة صباحًا بتوقيت الخليج ويُغلق في ٢٨ فبراير ٢٠٢٧ الساعة الخامسة مساءً، لبرنامج يمتد من الاثنين ٧ يونيو إلى الجمعة ٢ يوليو ٢٠٢٧. ضع تذكيرًا في ديسمبر."},
